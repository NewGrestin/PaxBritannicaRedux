  PB_CHR_Pride_Real:0 "Pride of the Royal Army"
  PB_CHR_Pride_Real_desc:0 "In the early days of the 19th century, when the motherland was at its weakest, "Patriots" and Infidels seized the opportunity to strike her. But as chaos spread throughout Spanish America, the responsibility of defending the King's subjects and land from usurpers was gradually shouldered upon us, \n\n§RAnd so we did.§! \n\nThe strategic genius of men like §YJosé Manuel de Goyeneche§!, managed to stem the time of our foes in decisive victories like Huaqui despite overwhelming odds. \n\nOur triumph over the Republican filth remains a source of pride within our nation. Even now more than a century later our military still lives up to this example and remains one of the finest fighting forces in the Americas."

  PB_CHR_The_Imbecile:0 "The Imbecile"
  PB_CHR_The_Imbecile_desc:0 "The Ferdinandists are known to hail themselves on a throne, ruling an empire older than most in the world, British, Russian, Germans. The Spanish crown, is certainly one to find great prestige on the Iberian Peninsula. \nAnd to this day do they still sit on the throne. \n§RThough maybe not the one they would like...§!\nFar from home, in exile, upon the lands of New Hispania, have the Spanish found themselves. \n\nDreaming of reclaiming their homeland.\n§OThough, with their head in the clouds it is unknown whether or not such a dream will come true or not.§!"

  ###########################
  # NEWS
  ###########################
  PBNews.343.t:0 "THE SPANISH SUCCESSION WAR"
  PBNews.343.d:0 "The United Viceroyalties of New Granada and New Spain have begun sporadic yet intensifying attacks south of the border into the Blessed Crown of Hispania, reviving what many believed to be a long-dead conflict dating back to the Ferdinandist Wars of the early 19th century. In the aftermath of Alfonso XII’s death, Carlist Requetés seized power in defiance of Alfonso XIII’s ascension, denouncing him as illegitimate and unfit to rule. Now, the struggle has once again escalated, drawing the eyes of nearly every country in South America, as the blood-soaked conflicts of the fuedal system rages on into the 20th century."
  PBNews.343.a:0 "Truly Enlightened times..."

  PBNews.344.t:0 "COUP IN BOGOTA?"
  PBNews.344.d:0 "The Capital of the United Viceroyalties have come under attack as of Today, with local sources unable to determine the current situation, many have speculated that a Military coup has occured as Military vehichles have blocked all major roads and Television and Radio broadcasts have come under restrictions, and reports of smoke plumes coming from the Capital and noise of gunfire, However sources from Quito and other major cities have continued to maintain that the situation is stable, nonetheless it appears that swift change has come to Bogota should whatever is happening succeed or not."
  PBNews.344.a:0 "Curious."

  Hispan_Succesion.1.t:0 "Death of Alfonso XII"
  Hispan_Succesion.1.d:0 "It was a quiet night. The guards stood at their posts, ready to defend the king and his court at all costs. It had been a stressful life for Alfonso, ruling over half a continent, let alone one that had been in open rebellion nearly 50 years ago. Over the years, his health deteriorated; he coughed blood—lots of it—coating his entire room red. As he lay there, not a sound or disturbance in his bloodstained room, there was no acknowledgment of the thousands he had sacrificed to maintain the empire. He was a pragmatist, unwilling to disturb the fragile peace, yet adamant about preserving it. He had kept his distant cousin Jaime out of the spotlight long enough to maintain a fragile balance between the north and the south. But now, all that was left of him was an old man waiting for his final breath. And then, it came."
  Hispan_Succesion.1.a:0 "Plus Ultra"

  Hispan_Succesion.2.t:0 "The Second Spanish Succession War"
  Hispan_Succesion.2.d:0 "Since the first Spanish Succession War, familial infighting had become commonplace. No matter the creed, blood, or bonds, that was always the case. Jaime III and his Requetes had always been a presence in the United Viceroyalties ever since the monarchy in Spain collapsed—hopping from one host to another like a leech. And as expected, he showed his intent to usurp the legitimate throne. They say blood is thicker than water, but in war, all you do is spill blood."
  Hispan_Succesion.2.a:0 "And so, it begins."
  
