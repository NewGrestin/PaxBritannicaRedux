  PB_HSP_CHR_Quito_War_Countdown:0 "The Battle for Ecuador"
  PB_HSP_CHR_Quito_War_Countdown_desc:0 "\n\n£GFX_TT_Ecuador_Crisis\n\n\n\nThe Territorial Army of the Audiencia of Quito has formally repudiated the authority of the central government in Bogotá. declaring 'No Further Contact' §YGovernor General Leopoldo Saro Marin§! has made his position vague on whether he is willing to concede to the carlists, recognizing Alfonso XIII, or seek self determination. .\n\n--------------------------\n§W[CHR.GetFlag][CHR.GetAdjective] Influence§!: [?CHR.CHR_influence|0]\n§O[COL.GetFlag][COL.GetAdjective] Influence§!: [?CHR.COL_influence|0]\n§G[ECU.GetFlag][ECU.GetAdjective] Influence§!: [?CHR.ECU_influence|0]\n--------------------------\n\nThe faction with the greatest influence will determine the fate of the territory, securing control over key states in time for the succesion war.\n\nUnless decisive action is taken, §Rwe risk losing Quito to hostile forces.§!"

