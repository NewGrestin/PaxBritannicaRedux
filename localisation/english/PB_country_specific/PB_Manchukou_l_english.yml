  ####    IDEAS     ####
  ######################
  
  PB_MAN_Ultramilitarist_Stronghold:0 "Ultramilitarist Stronghold"
  PB_MAN_Ultramilitarist_Stronghold_desc:0 "Manchuria was the birthplace of the Moscow Circle conspiracy, a cloak and dagger organ of the Russian military deeply opposed to the liberalizations of the current period. As St. Petersburg shifted from autocracy, reactionary elements of the military that were too vocal for their own good would often find themselves reassigned away from power. Often, this reassignment meant Manchuria, Mongolia, or even as far as the Americas. For the lucky few, Harbin became a breeding ground for a conspiracy that would ultimately worm into the highest levels of Russian high command.\n\nThe effect on Manchuria itself is noticeable. Russian chauvinist policy dominates the sham Duma, where the Chinese are treated as second class colonials in their own country. Manchu and Chinese women are frequently pressured into marrying Russians, adopting Russian names, and abandoning cultural traditions in favor of those preferred by the Circle. The only true route to legitimate citizenship for the population remains absolute assimilation, a humiliating process that even once completed can be revoked without recourse.\n\nFor the moment, Russia seems content to overlook these eccentricities, but as resistance grows to the regime, it may be forced to look further into the dirty business of their “Yellow Russian” ambitions."
  PB_MAN_Far_from_Home:0 "On the Hills of Manchuria"
  PB_MAN_Far_from_Home_desc:0 "Far from home and surrounded by enemies, Zheltorossiya is the independent arm of Russian influence in the Middle Kingdom. Since the calcification of the Russian occupation, it has become the launch point for various interventions, particularly the recent intervention in Xinjiang.\n\nFollowing the collapse of the Qing, the Tsardom moved to occupy Outer Mongolia, establishing the Mongol Principality as a client state. Similarly, when the armies of the would-be modern Timur, Ma Zhongying, pressed towards the Central Asian border, the Tsardom answered in kind.\n\nNow, the Tsarist army remains overextended, committed to fighting the rebel groups of our protectorates while keeping watch for the inevitable return of the Japanese. North China sits across the border, with their degenerate anarchists ready to tear down the Tsardom and replace it with chaos.\n\nEnemies sit at all the edges of our Empire, and we must fight viciously if we are to protect what is rightfully ours."
  