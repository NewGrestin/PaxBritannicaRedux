  ### Leaders ###
  HWA_esterhazy_miklos:0 "Miklós II"
  HWA_esterhazy_miklos_desc:0 "§HBorn:§! §Y7/5/1869 in Vienna, Habsburg Austria§!\n\nBorn in a city filled with Hungarian loyalists who had fled after the 45' Revolution, the infamous Esterházy family longed for a return to the old oligarchic nobility under the Habsburg Emperor. Using their influence within the Habsburg dynasty, they designated their son, Miklós II, as the future king of the White Hungarian Exiles. By 1890, he had become a knight of the Order of the Golden Fleece; from 1889 he served as a reserve lieutenant in the 11th Hussar Regiment, and in 1901 he was appointed a privy councillor. Active in public life, he was also a hereditary member of the Hungarian House of the Order.\n\nFollowing Tisza’s reactionary takeover, the exiles were allowed to return, and after a controversial population referendum, the House of Esterházy was sworn in, with Miklós II crowned King of Hungary. This restoration was short-lived, however. The Second Hungarian Revolution forced Miklós and his family to flee to Austria after the execution of István Tisza. When a reactionary revolt later seized key regions of Slovakia and Transdanubia, Miklós returned and crowned himself king once more—though this time, his rule was far less stable."
  
