  HWA_opening_screen_picture: "GFX_PB_HWA_opening_picture"
  HWA_country_opening_subname: "Regnum Mariae Patronae Hungariae"
  HWA_country_opening_lore: "Since the Hungarian Revolution of 1848, conservatives and reactionaries had remained deeply skeptical of the new regime established by Lajos Kossuth. In the aftermath of the revolution, many Hungarian aristocrats and political émigrés fled to Vienna, hoping that the revolutionary government might eventually compromise with the monarchy.\n\nSome moderates, such as Lajos Batthyány, had once believed Hungary could still retain its parliament while remaining a kingdom under the Habsburg crown. Those hopes collapsed when Kossuth consolidated power and expelled many conservative and reactionary figures from Hungary, forcing them into exile. The purge alienated much of the conservative elite and drove them firmly into the arms of the old aristocratic order and it never fully embraced the Hungarian Revolution. As seen by the White Hungarian Emigres using either the Old medieval Hungarian flags or the Estzerhanzy Flag.\n\nWhen political restrictions were later relaxed, these exiles returned and organized a powerful opposition within the Hungarian parliament. By 1894 they had won the elections and began working to restore the ancient Kingdom of Hungary.\n\nTheir opportunity came in 1903. Led by István Tisza, the army seized power in a military coup, ending the Kossuthist republic and restoring the monarchy under the House of Esterházy. For the exiled aristocracy, it was the long-awaited revenge against the revolutionary order.\n\nYet the restoration proved unstable. A generation that had grown up under Kossuth’s reforms increasingly rejected reactionary rule. Years of mismanagement and repression eventually sparked the Second Hungarian Revolution in 1931. Tisza was captured and executed, while the king once again fled to Vienna.\n\nIn the chaos that followed, the revolutionary government collapsed into factional struggle. Seizing the moment, the White Army under Pál Prónay launched a counter-revolution across Transdanubia, capturing town after town with little resistance. Only at the Lake Balaton did revolutionary forces finally halt the advance.\n\nYet the White movement itself remains divided. Its many paramilitary factions answer to rival aristocrats in exile, united only by loyalty to a weak king. Unless the question of the Golden Bull of 1222 and aristocratic privilege is resolved, even a White victory may only sow the seeds of its own downfall."

