  ### IDEAS ###
  PB_HWA_Last_Palatine:0 "The Last Palatine"
  PB_HWA_Last_Palatine_desc:0 "The Hungarian White Army, or rather the unenviable Kingdom of Hungary it so virtuously displays itself as, is but the continuation of a 106th year of Palatine rule over the Hungarian people. The White Army wages unrelenting war with the sole purpose of subduing the Jacobin beast, and it remains the recipient of the adoring gaze of many reactionaries in its espousement of its so-called Neo-Absolutism, with gifts and aid flowing into the kingdom on its holy crusade against an enemy sitting atop the new city of Gomorrah in all its debauchery."
  PB_HWA_Metternicht_Age:0 "The Death Throes of the Metternichtine Age"
  PB_HWA_Metternicht_Age_desc:0 "Hungary is the subject of what many call the Metternichtine experiment, the brainchild of the long-dead Prince Metternich. It swaddled together the force of a hundred factions in opposition to the perceived threat of Jacobinism that crept upon Austria's borders in more directions than simply external. It was designed with the proposition of upholding a holy alliance between Russia and Germany to guide the Hungarian Kingdom for their own benefit, with a common understanding to adopt a policy of forced isolation on the Hungarian Kingdom that prevented one side from gaining an upper hand over the other. It is without a doubt the mind of Metternich that still echoes a hundred years on from its founding. Whether Metternich's foresight is able to guide the blind Hungarian nation into the new century is another question."
  PB_HWA_Miracle_On_Danube:0 "Miracle on the Danube"
  PB_HWA_Miracle_On_Danube_desc:0 "In the smoldering aftermath of the Hungarian Revolution, the House of Esterházy fled into exile, seeking refuge in Vienna after failing to stem the fires of revolt in Buda and witnessing the merciless execution of István Tisza. Hungary was left scarred, leaderless, and humiliated.\n\nYears later, fate opened its door. In 1932, amid mounting opposition and the collapse of Imre Cresnyák’s government, the kingdom was plunged once more into chaos. With no governor to hold the realm together, long-simmering conservative fury erupted into open revolt. Armed bands swept across the wild plains of Transdanubia and into the Carpathian Mountains, claiming land and loyalty alike.\n\nFrom exile, the Esterházy heir returned at last, proclaiming the restoration of his crown and declaring that God Himself had ordained his rule over Hungary. But the throne stood unguarded, and the kingdom divided—for as he reached to reclaim what he believed was divinely his, others moved in the shadows, ready to tear the crown from his grasp."
  PB_HWA_Lord_Of_The_Flies:0 "Lord of the Flies"
  PB_HWA_Lord_Of_The_Flies_desc:0 "When Juraj Košút leapt forward to seize his banner on the eve of the Austrian advance, it was not the flag of Hungary that he grasped, but that of the Slovak—long overshadowed within the old Kingdom of Hungary and by the achievements of his nephew, Lajos Kossuth. The statesman sought to forge a place for the Slovak nation’s own hopes and dreams, pursuing Austrian autonomy and mercy for the battered Slovak infant that cried out for a cradle of its own. These pleas were rejected. From that refusal grew an animosity toward the Austrian hand that ceased to rock the child’s bed, and so the Slovak people sheathed their swords, waiting in quiet resolve—hoping that, in time, another hand might yet reach out to care."