  PB_PER_Ummah_Vanguard:0 "Enlightened Vanguard of the Ummah"
  PB_PER_Ummah_Vanguard_desc:0 "Once a mere pawn in the hands of giants, Persia felt the griefs of the war of influence waged between Britain and Russia unlike any others. Swept into the Great Game against its will, Tehran would endure London unwillingness to let the country choose its own fate — let alone improve its own condition. Acutely felt during the late nineteenth, the British oversight would strip our country from its oil reserves and strategic autonomy, with the succeeding monarchs unwilling to oppose such looting. \n\nSin cannot prevail eternally however, and so does imperialist rule. \n\nAs Europe emerged from the mud of a slaughter unconceivable before, Allah sent two signs to the wretched and the oppressed of this world. First were the Hungarian and Japanese revolutions, showing global tyranny wouldn’t go unopposed anymore. Heavenly beacons in a mist of darkness. Second was how incredibly weakened the British kleptocrats found themselves after the cataclysmic events of the war. With economic collapse, agitation at home and Philadelphia unwilling to remain subservient anymore, it appeared the whole imperial structure was frailer than ever. Inspired by those miracles, the Persian peoples finally stood as one against the profane Empire of Victoria — and, imbued by divine grace, won the fight. \n\nGuided by Allah’s will and Jamal Al-Afgani’s teachings, reinforced by successful land reforms and industrial efforts, our young republic now stands as a bulwark against the kuffar from London and Saint-Petersburg. While the oppressors think of us as a secluded anomaly in a world otherwise submitted to them, our cause isn’t bound to petty nationalism or tribalism. As long as the Ummah remain disunited and threatened by imperialists and autocrats alike, our prime mission remains unachieved."
  
