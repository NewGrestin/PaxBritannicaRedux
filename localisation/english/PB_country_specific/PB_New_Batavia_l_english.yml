  # IDEAS
  ##########################
  PB_NBT_Shattered_Star:0 "The Shattered Star"
  PB_NBT_Shattered_Star_desc:0 "At first glance, New Holland may appear as a shining Star in an otherwise turbulent Southern hemisphere. Distant from the uproar of the Eastern side of the continent, the country enjoys a paramount position within Netherlands' own empire; being autonomous in all but name while reaping the fruits of both oceanic trade and the bounty of its own soil. Urban yet pastoral, close yet distant, civilized yet savage... The land Down Under shines as a familiar and prosperous place, yet a place of adventure for the willing pioneers — a figure best embodied by the hardworking voortrekker, carefully laying the bedrock for expanding the civilized world while enriching his family in the process. On the coast, vast cities shelter the nascent proletariat which, like their brothers in the outback, can too succeed thanks to the abundance of work offered by the country's vast portuary infrastructures. \n\nAn enviable situation in the eyes of the foreigner perhaps. But for the New Hollander, the reality is far distant from the fairy tales told by propaganda and national mythos. \n\nAs the Aboriginals remain an ever-present stain in a country solely built for the white protestants, New Holland finds itself fractured not only along racial lines, but throughout class antagonism as well. Beyond their shared skin color, city workers share little to no resemblance to the agrarian farmers inward — a dissonance often translating into outright animosity as both interests conflict over New Holland's course. With the recent shift toward industrial production and subsequent political gains for organized labor, the once proud pioneers find themselves increasingly at odds with the central government — and now gazes toward the disparate trekkers Republic of South Africa as an example of emancipation. Only time will tell if the government is able to pull things together again, or if the Southern star truly lies broken."
  PB_NBT_Aboriginals_Twilight:0 "Twilight of the Aboriginals"
  PB_NBT_Aboriginals_Twilight_desc:0 "The apparent wealth and prosperity of New Holland cannot fully overshadow the heap of corpses on which the country was first built on. \n\nWith their arable lands forcefully confiscated, their homes razed by Dutch pioneers and the land they once cherished turned barren by extensive agriculture and mining, the aboriginals stand as the first victims of this colonial utopia. \n\nAs ancient tribes and communities lie shattered under the settlers’ hoofs, the indigenous themselves have been turned into a subservient workforce when they have not purely and simply been discarded entirely; left to rot in ghettos and reservations without purpose nor future of their own."
  PB_NBT_Outback_Howls:0 "Howls in the Outback"
  PB_NBT_Outback_Howls_desc:0 "To oversee New Holland's vast extents is a daunting task indeed. Beyond key cities and a few safe havens, mother nature appears in her most cruel attires. With pests of various shapes and sizes multiplying unopposed in the outback on one side and terrible diseases slaughtering both men and cattle on the other, this land is truly a challenge for whoever intends to carry on the civilizing duty inland. \n\nFortunately enough, God and science gifted us with a blessing when it came to deal with Emus and other hindrances. By releasing repurposed Combatagates designed solely to eradicate hostile fauna into the wild, we could finally secure new arable lands, laying the foundations for a pacified, prosperous outback in which all would thrive without having to fear the now-vanquished scions of nature. \n\nIf only this radiant vision hadn't gone horribly wrong.\n\nMimicking the British East Africa's way of dealing with native revolts, we massively released modified Combatagates in New Holland inner-territories in hope of helping settlers' efforts. What seemed to work with great efficiency at first turned against us in a matter of years as the artificial lifeforms slowly became the ultimate parasites among those we sought to destroy. Worse was the fact that the beasts somehow outgrew their own limitations in the process, with Combatagates surviving far past their normal lifespan while showing increasingly aggressive instincts towards men — a trait supposedly suppressed. While the man-made plague has somehow been contained within a few scarcely-populated regions, fear ramps up every days at the prospect of cannibalistic monstrosities taking over the countryside in an orgy of violence. \n\nAs the wilderness slowly falls silent, only to be torn apart by the sinister screams of unnatural entities, we must be prepared should this fateful hypothesis came into fruition."
  
  
  ##OLD IDEAS
  PB_NBT_Stable_Nation:0 "Stable Nation"
  PB_NBT_Stable_Nation_desc:0 "The Constitution that enshrines the New Holland colony is one of fairness, equality, and opportunity. The continued successes of previous and current governments have maintained a prestigious political atmosphere that has bled into the New-Hollander consciousness, citizens remain confident in bureaucratic workings leading to great stability and freedoms rarely seen in the modern world. "
  PB_NBT_Economy:0 "Thriving Economy"
  PB_NBT_Economy_desc:0 "The Vrijhaven economy has seen an explosion of success. The large deposit of rare minerals on mainland Oceania has greatly attributed to this fact, that as well as the competency of the ruling government that has ensured the small colony stays relevant in Asian-Pacific affairs. Everyday a new factory is opened up and hundreds are employed in sustainable, well paying jobs; continously feeding the colonies thirst for new settlers and skilled labour."
