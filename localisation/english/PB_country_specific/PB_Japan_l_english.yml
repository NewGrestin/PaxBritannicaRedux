  repjap.1.t:0 "Opening of the 10th Party Congress"
  repjap.1.d:0 "PLACEHOLDER The Tenth Party Congress of the Japanese Republic begins, introducing the primary factions"
  repjap.1.a:0 "Welcome. Let's begin."

  repjap.2.t:0 "Debates on the Status of Unions"
  repjap.2.d:0 "PLACEHOLDER Decision on whether to allow independent unions or to maintain the structure of a single, state reliant union for all trades"
  repjap.2.a:0 "Maintain the current Union structure"
  repjap.2.b:0 "Shift towards independently managed unions"

  repjap.3.t:0 "Debates on the Status of Regional Militias"
  repjap.3.d:0 "PLACEHOLDER Decision on whether to integrate the regional people's militias into the Revolutionary Guards or allow them to continue operating independently"
  repjap.3.a:0 "Centralize the Militias under the Revolutionary Guard"
  repjap.3.b:0 "Allow the Militias to continue functioning independently"

  repjap.4.t:0 "Debates on the Political Status of the Military"
  repjap.4.d:0 "PLACEHOLDER Decision on whether to maintain commissars to ensure the military is politically loyal or to allow the military to remain politically independent but potentially disloyal"
  repjap.4.a:0 "Establish and expand the role of Political Officers"
  repjap.4.b:0 "Allow the Army to remain politically independent"

  repjap.5.t:0 "Conclusion of the Party Conference"
  repjap.5.d:0 "PLACEHOLDER The Party Congress ends with a decisive Hashimoto victory regardless of player decision, angering reformists and laying the groundwork for major political unrest"
  repjap.5.a:0 "Congratulations to our Grand Protector"

#  repjap.6.t:0 "Violence on the Streets of Tokyo"
#  repjap.6.d:0 "PLACEHOLDER Hashimoto's attempt to further consolidate power angers most of the government and leads to an assassination attempt, with the subsequent Revolutionary Guard crackdown leading to widespread riots in Tokyo"
#  repjap.6.a:0 "We must find those responsible!"
#  repjap.6.b:0 "That was too risky, we need to be more careful"

  repjap.6.t:0 "Assassination Attempt on Seigo Nakano"
  repjap.6.d:0 "With rising tensions following the RPA’s decision to enforce agrarian policies on the populace, the Republican Government has made attempts to manipulate public opinion in favor of governmental decisions. \n\nMany rallies, speeches and notably government subsidiaries towards public services. Despite everything, protestations towards the government persisted; though today was another rally planned by Japanese President Seigo Nakano, one of many in the past few years. \n\nStanding at a metro station in Kyushu, following 1 hour and 38 minutes of speaking, Nakano made his way to the presidential vehicle, during this moment Tomeo Sagoya would fire three rounds at the president, before he himself would be killed by the presidential guard.\nFollowing the assassination attempt, Nakano would immediately be rushed to the nearest hospital for treatment.\n\nThe nation now waits to hear whether he recovers or not."
  repjap.6.a:0 "The Captain Falls, Announce the Emergency Congress"
  repjap.6.b:0 "Thankfully Nakano Survives."

  repjap.7.t:0 "Fate of the National Government"
  repjap.7.d:0 "Following the Assassination of Seigo Nakano, an emergency government was quickly established under the rule of Kingoro Hashimoto. \n\nWhile no one doubts the capabilities of Hashimoto, the foundations of the Revolutionary People's Association does not permit the militaristic rule of the military, in the similar manner of a Shogun. \n\nDespite this, the argument that the Republic is not ready to have a new president while old ones are being shot on the street can certainly be made. \n\nWith that being said, Kingoro Hashimoto has a decision to make whether he makes moves to safeguard the Republic itself, or allow for a new National Congress to be declared, allowing for a new president of the Republic to be elected."
  repjap.7.a:0 "The Situation Must be Stabilized First"
  repjap.7.b:0 "Let the People Have their Say"

  repjap.8.t:0 "Inner Party System Expands"
  repjap.8.d:0 "While the inner party mechanisms of the Republic of Japan have quite the history of polarity and internal divisions, the remaining political parties that have refrained from associating with the Revolutionary People's Association, essentially creating what could only be described as a 1.5 party system. \n\nHowever, as already current associates of the party display their own candidates and factionalist displays, many it the other ideological separatist parties have moved over time to eventually join the greater national association; thus establishing a big tent party, and moving the nation further towards the goal of a one party state. \n\nLiberals, Conservatives and even proponents of a two-staged revolution have been found joining the greater association, making greater headway and connections looking to forward their own now inner faction's goals."
  repjap.8.a:0 "The Revolution carries on."

  repjap.9.t:0 "The Sakurakai is Successful"
  repjap.9.d:0 "PLACEHOLDER Backed into a corner by the overwhelming Sakurakai forces, Hashimoto refuses to relinquish power and commits suicide. The Sakurakai are victorious and can begin to govern Japan, but having failed to remove Ishii, the Revolutionary Guards overpower them and seize control"
  repjap.9.a:0 "The National struggle must now begin"

  repjap.10.t:0 "The Sakurakai is Successful"
  repjap.10.d:0 "PLACEHOLDER Backed into a corner by the overwhelming Sakurakai forces, Hashimoto refuses to relinquish power and commits suicide. The Sakurakai are victorious and can begin to govern Japan, but having failed to remove Okawa, he rallies the radical Pan-Asianists to wrest control from the reformists"
  repjap.10.a:0 "We must safeguard the Pan-Asian ideal"

  repjap.11.t:0 "The People's Shogun reigns Triumphant"
  repjap.11.d:0 "Some called Kingoro Hashimoto a madman, others called him a traitor, but now anyone who would say otherwise had been swept away. His reign secured, Hashimoto stands atop a throne bathed in the blood of reactionaries. Japan would never again be allowed to fall into the perfidious grasp of imperial reformists or republicans.\n\nThese and many more thoughts drifted through his mind as he watched the bloodshed from the balcony of the Revolutionary Directory. The last remnants of the Sakurakai, the bastard Oyama and his anarchist whore, were lined up alongside dozens of others. He hardly remembered who most of them were, that was Ishii's job after all, he just signed the lists.\n\nThere was no ceremony for the traitors, and methodically, almost rhythmically, the guards moved down the line. After a time, the thud of the pistol began to sound like a drum beat. A drum beat that would guide the heart of his new Japan. He had been to kind to the people, too soft, but never again would that be allowed to happen. The final pistol crack gave him a clarity he had not had since the flames of rebellion brought down the Imperial Palace. Japan was an iron bar laid across the anvil, heated by the fire of revolution and the Grand Protector...\n\nHe was the hammer."
  repjap.11.a:0 "Death solves all problems."

  repjap.12.t:0 "The Righteous Crusade"
  repjap.12.d:0 "The joke is that it's bushido code but being twisted to make people kill each other with ideological fanatacism lmao"
  repjap.12.a:0 "Excellent work, comrades."

  repjap.13.t:0 "The Gifts of Benevolence"
  repjap.13.d:0 "Hashimoto grants the military extra rations as a reward for hunting down and killing reactionaries, what a madlad"
  repjap.13.a:0 "Truly our rule is just."

  repjap.14.t:0 "The Value of Respect"
  repjap.14.d:0 "The Soldiers are taught to respect one another enough to willingly rat each other out for talk against the regime"
  repjap.14.a:0 "You scratch my back, I'll scratch yours, as the Americans say."

  repjap.15.t:0 "A Culture of Honesty"
  repjap.15.d:0 "Soldiers are actively encouraged to ensure the honesty of the masses though campaigns of terror"
  repjap.15.d:0 "Honesty is the best policy."

  repjap.16.t:0 "New Recruits"
  repjap.16.d:0 "With the liberalization of gender norms, even women, once previously consigned to traditional roles, can partake in the revolution. Although, Hashimoto thought to himself, perhaps not quite to this extent. The training runs for the newly formed women's brigade were in full force, and the Grand Protector himself had arrived to oversee the fruits of his reforms.\n\nA brigade's worth of women, some as old as their forties, marched in lock step around Tokyo's empty parade grounds while others trained with rifles or bayonets. Hashimoto was less than impressed, most of the recruits were far too young or too old for frontline combat. Perhaps Ishii had been right when he protested the reforms to begin with-\n\nHis train of thought derailed at the sound of someone sceaming like a banshee. Glancing up, he caught a blur of a woman tackling one of the training instructors. The mock fight, training for close combat, ended within seconds as the woman held a mock knife to her instructor's throat. Realizing she was beneath the gaze of Japan's Generalissimo, she dropped the knife and quickly bowed. Hashimoto laughed, rose from his chair and stepped down on to the parade ground, gesturing for the woman to approach.\n\n\"You'll go a long way with that kind of enthusiasm,\" he joked, A hand clasped on her shoulder. \"Your name, comrade?\""
  repjap.16.a:0 "\"Sada, sir, Sada Abe\""

  repjap.17.t:0 "The Midnight Phone Call"
  repjap.17.d:0 "Ishii, having grown his power through Hashimoto's reforms, seizes the chance to take control of Japan and forces Hashimoto to resign and commit suicide, framing it as a reactionary assassination."
  repjap.17.a:0 "The Shogun's finest pupil finally takes the throne"

  repjap.18.t:0 "The Midnight Phone Call"
  repjap.18.d:0 "Ishii attempts to seize control of the government, but understimates Hashimoto's control over the Revolutionary Guard and is subsequently purged, paving the way for Hashimoto's permanent absolute rule."

  repjapflavor.1.t:0 "A Quiet Shift"
  repjapflavor.1.d:0 "The days spent at what remained of the Imperial Palace were often quiet. When fires swept through Tokyo during the Glorious Revolution, the Palace was not spared. Some still remembered as Emperor Meiji himself stood before the burning wreckage of his legacy, the angry and starving wretches that once thought him a god closing in with rifles in hand.\n\nThese were quiet days though, Shirou thought. The Palace still remained a burnt out sepulchre, but the government insisted on guarding it lest it become a haven for \"Imperial loyalists." As he marched along the perimeter, his eyes fell on a young man standing near the gate, gazing absentmindedly at the blackened structure. A frown crawled on to Shirou's face as he stepped up to the man, barking orders.\n\n\"What are you doing here, this is a restricted area!\"\n\nThe man broke from his stupor, fixing his glasses on his face and sputtering an apology. He glanced back one last time at the Palace, then to Shirou, and smiled.\n\n\"I used to live here, you know?\"\n\n\"What?\"\n\nBefore he had time to respond, the man was gone, melted away into the bustling Tokyo crowd. Shirou shook his head, looking once more back at the Palace before moving on with his shift."
  repjapflavor.1.a:0 "\"What a strange man.\""
  
  repjap_flavor.1.t:0 "Rikken Students Protest"
  repjap_flavor.1.d:0 "Despite following the Japanese Revolution a large scale of popular criticism of the national government would occur. Though most instances of criticism would be towards the previous Imperial Regime, the practice wouldn't really leave even following the Japanese adoption of Democratic Centralism.\nStudents, protests and strikes would become a rather common form of displaying grievances towards the governing institutions.\n\nWhile historically for the past few decades this has proven a slight problem for the National Government; most instances of protestations were either met with bargaining or ignoring the strike brokers. \nToday however the Rikken institute has initiated a series of large scale student protests. While nominally the previously mentioned methods would be used to deal with the strikers; with the Rikken Institute being one of our largest and most prestigious research institutions, the means for handling the protests would require more immediate government action, as for the moment the student protestations cause quite the stand still among the development of our nation's capabilities in national research."
  repjap_flavor.1.a:0 "This may set a Bad Precedent..."
  repjap_flavor.1.b:0 "What are you waiting for? Shoot those bastards!"
  
  repjap_flavor.2.t:0 "Rise of the Bōsōzoku"
  repjap_flavor.2.d:0 "Amongst the vast urban environments that dot the landscape of the Republic of Japan, there was a very quick adaptation requirement for society and Japanese culture, as the government and people sought to move past its archaic institutions of both government and class structures, leading to these structures to be completely turned on its head as Japan’s culture became consumed in the revolutionary chaos, a sort of strange evolutionary effect would occur where Japanese society would seemingly evolve way to quickly, as women, youth and social groups would acquire new rights; the people would not waste the opportunity to present their concerns to the government by protestations. And while Japan ended up stamping out these dissenters, it would end up leaving many people feeling left behind by society's growth. \n\nMany of these people, typically youth members, would eventually form groups or gangs of similar peoples with their own rules and structures in a curious display of counterculture. \n\nDespite all of this though, it provides a very interesting and in depth look into how life and youth develop in the unique environment that is the Megacity landscape."
  repjap_flavor.2.a:0 "Interesting"
  
  repjap_flavor.3.t:0 "Nichiren Terrorists Strike Tokyo"
  repjap_flavor.3.d:0 "Though the young Japanese Republic have maintained the doctrine of destroying previous reactionary remnants going on for about a decade now, there would still exist several factions seeking to resist the Republican’s advance and dream of restoring a proper traditional Japan once more. One faction being a strange Ultranationalists sect of Nichiren Buddhists headed by a Nisshō Inoue. \n\nA group who would claim responsibility for an apparent domestic terrorist attack on the recently established Tokyo Metro, construction of which was completed in recent years following the total reconstruction of Tokyo City after the Japanese Revolution.\n\nThe attack seemed to target several politicians who would have been seen in the area, commemorating the opening of the metro system to the people, keyly utilizing makeshift bombs, and what appeared to be makeshift chemical weapons. The attack, caused by an apparent desire for spreading propaganda by deed. Despite the fact that many Nichiren organizations would acquire more neutral relations with the Japanese Government, there would still be several groups that proclaim admiration towards the previously reactionary empire. \n\nThe attack would be carried out, injuring around Fifty civilians and killing Seven civilians with the intended targets of the Republican Politicians remaining unharmed. The perpetrators would eventually be captured by the Japanese Republican Red Guard, and promptly executed following interrogation. Though during investigation, it would appear as though the group acclaimed a cult like following; revering Inoue as a prophet like figure, who in of himself following his exile in the [CHI.GetName], would gain influence from a Millenarist groups.\nUnder superstitious reports from Republican Officials, the group desired to overthrow the government and establish a Chinese Puppet Government, but the group denied such claims. The incident would go on to be known as the League of Blood Incident , and though investigations continue throughout the Japanese Republic; many of the groups leaders have been apprehended and flags fly at half mast in order to pay respect to those who passed from the attack"
  repjap_flavor.3.a:0 "Buddhist, Cultists, AND Terrorists? What the Hell is Happening in Our Nation?"

  repjap_flavor.4.t:0 "Learning from the Laws of Nature"
  repjap_flavor.4.d:0 "The grand opening of the National Robotics Institute (KRK) has been a major success. [JAP.GetLeader] themself was present to shake hands with the major figures in Japanese automatics research, including the chairman of the new institute Makoto Nishimura. The KRK opening was also attended by members of the Navy, the Airforce, prominent philosophers of robotics and representatives of Tokyo electric, who hailed the KRK as the finalization of Tanaka Hisashige's dream and a next step in Japanese industrialization. Chairman Nishimura began the grand opening with a masterful speech regarding the ethics of robotics, contrasting the enslavement of nature's laws by the Europeans and Americans with the liberation found in Japan's friendship and mutual respect with nature and robots. Referring to his previous work with Gakutensoku, one of Asia's first robots, Nishimura applauded the opening of the KRK as the start of a great friendship between robotics, nature and the Revolution. Polite clapping followed as [JAP.GetLeader] ended the ceremony by 'meeting' Gakutensoku, awkwardly shaking the hand of the primitive robot as a symbol of this new era of friendship."
  repjap_flavor.4.a:0 "The Revolution has gained a cold, mechanical arm" 
 
  repjap_flavor.5.t:0 "Bonzai Genetics"
  repjap_flavor.5.d:0 "As Japan continues to walk through decades of development in mere years, Western trends have started popping up in the country, even despite our efforts to crack down on perceived Western concepts. A big one is the young scientific field of sociogenetics, which has been legalized since the end of the imperial government, but has only recently picked up speed in our nation. The utilization of sociogenetic methods has allowed for improved agricultural yields in products ranging from beef to rice, allowing Japan to improve its self-sufficiency against the growing monopoly of Western powers. \n\nA side-effect of the sociogenetic field has become the normalization of sociogenetic improvements among the party elite, especially those who mingle with the scientific bureau. Due to the taboo surrounding the issue, it tends to only stay at rumours if bureaucrats or politicians have improved themselves with genetic treatment, but the recent appearance of more prominent members of the party sporting clear genetic changes, including different eye colours, reversion of baldness and increased muscle density, has started to break the taboo apart. Despite the clear moral issues with the practice, sociogenetics now are a normal part of life in Japan, something our political system can't deny."
  repjap_flavor.5.a:0 "A quiet revolution is happening for humanity" 
 
  japrep_flavor.10.t:0 "\"People's Kobe\" hits shelves"
  japrep_flavor.10.d:0 "Kobe beef, once a meat for the richest of the rich in Japan, has been bend to the whims of the Republic today as the Kobe farming collective introduce \"People's Kobe Beef\" to the nation. Gene-treated Tajima cattle have been able to reduce the cost of the marbled beef to a normal price, as the enormous cows, their impressive size held together by new genetic code, allow for larger yields of Kobe beef on an annual basis. While previous government talks debated on the outlawing of such decadent, aristocratic meat like Kobe beef, the introduction of the people's beef may be enough to convince the party to continue allowing the sale of the delicacy."
  japrep_flavor.10.a:0 "It almost tastes like the real thing!"
