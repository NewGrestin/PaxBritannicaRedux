  repjap.6.t:0 "Assassination Attempt on Seigo Nakano"
  repjap.6.d:0 "With rising tensions following the RPA’s decision to enforce agrarian policies on the populace, the Republican Government has made attempts to manipulate public opinion in favor of governmental decisions. \n\nMany rallies, speeches and notably government subsidiaries towards public services. Despite everything, protestations towards the government persisted; though today was another rally planned by Japanese President Seigo Nakano, one of many in the past few years. \n\nStanding at a metro station in Kyushu, following 1 hour and 38 minutes of speaking, Nakano made his way to the presidential vehicle, during this moment Tomeo Sagoya would fire three rounds at the president, before he himself would be killed by the presidential guard.\nFollowing the assassination attempt, Nakano would immediately be rushed to the nearest hospital for treatment.\n\nThe nation now waits to hear whether he recovers or not."
  repjap.6.a:0 "The Captain Falls, Announce the Emergency Congress"
  repjap.6.b:0 "The Bullet Strikes Kingoro Hashimoto Instead."

  repjap.7.t:0 "Fate of the National Government"
  repjap.7.d:0 "Following the Assassination of Seigo Nakano, an emergency government was quickly established under the rule of Kingoro Hashimoto. \n\nWhile no one doubts the capabilities of Hashimoto, the foundations of the Revolutionary People's Association does not permit the militaristic rule of the military, in the similar manner of a Shogun. \n\nDespite this, the argument that the Republic is not ready to have a new president while old ones are being shot on the street can certainly be made. \n\nWith that being said, Kingoro Hashimoto has a decision to make whether he makes moves to safeguard the Republic itself, or allow for a new National Congress to be declared, allowing for a new president of the Republic to be elected."
  repjap.7.a:0 "The Situation Must be Stabilized First"
  repjap.7.b:0 "Let the People Have their Say"

  repjap.8.t:0 "Inner Party System Expands"
  repjap.8.d:0 "While the inner party mechanisms of the Republic of Japan have quite the history of polarity and internal divisions, the remaining political parties that have refrained from associating with the Revolutionary People's Association, essentially creating what could only be described as a 1.5 party system. \n\nHowever, as already current associates of the party display their own candidates and factionalist displays, many it the other ideological separatist parties have moved over time to eventually join the greater national association; thus establishing a big tent party, and moving the nation further towards the goal of a one party state. \n\nLiberals, Conservatives and even proponents of a two-staged revolution have been found joining the greater association, making greater headway and connections looking to forward their own now inner faction's goals."
  repjap.8.a:0 "The Revolution carries on."

  repjap.9.t:0 "March of the Anguished Fallen"
  repjap.9.d:0 "The Japanese way has and always will be by the sword. The endless martial struggle that awaits her people is a sacrifice that no other nation on this planet could possibly withstand or await. \n\nThe Japanese people have understood this for thousands of years, during the Mongol invasions, during the great Warring States Period, and even during the Japanese Revolution. The people of Japan understand this, though the Japanese Government does not, despite their speeches and lies. \n\nIts only through the flame of patriotic thought will Japan finally be redeemed and dubbed a nation worthy of her people. \nThe times are changing, we must stand ready in preparation for redemption. Let us prepare for the coming storm, we will prove ourselves ready under the leadership of Bin Akao."
  repjap.9.a:0 "The National struggle must now begin"

  repjap.10.t:0 "Opening of the 10th Party Congress"
  repjap.10.d:0 "The time has finally come for the nation to elect a new leader for our nation. \n\nWith tensions heating in the west, this is believed to be quite a momentous election. \nBelieving whoever wins this election will likely determine the outcourse of the future of Japan and Asia itself.\n\nPrimarily the Pan-Asianists, Agrarian, and Technocrats have pushed forward candidates of which are believed to win out among the inner party groups.\n\n—The Pan Asianists have pushed forward the candidates Konoe Fumimaro alongside Ikki Kita, of which promise to maintain the social nationalist doctrine of Kokutairon.\n—The Technocrats have offered a much more pragmatic approach, pushing forwards a restructuring of Republican bureaucracy. Believing the Japanese Republic should be overhauled to be much more efficient and perfect in their industrialization of the country. Modernized and effective.\n—The Agrarians, as the name suggests, offered a much more peasant supported system, a step away from widespread industrialization. They have much support from the anarchist sub factions amongst the party, and while they're not as popular as the other parties, they're still a notable horse in the race."
  repjap.10.a:0 "Suzuki's Technocrats Win"
  repjap.10.b:0 "Seigo Nakano Shall Preserve Kokutairon"
  repjap.10.c:0 "The Red Prince is Victorious"
  repjap.10.f:0 "Arima's Agrarian Flock is Triumphant"

  repjap.11.t:0 "Returning the Father of the Nation?"
  repjap.11.d:0 "While the Emperor had been forced to abdicate years ago; giving birth to our newfound Republic. \nWith the ascension of Presidential Candidate Konoe, there has been a potential notion among many of the followers of Kokutairon Thought of the creation of a strong figurehead to guide and lead the Japanese People. \n\nKonoe, while he does indeed have aristocratic blood, has made an effort of putting the nation and her people above the privileged decadence of the previous Imperial government. Thus giving him the nickname ‘The Red Prince'. \n\nHowever, with such a nickname many wonder about the potential of inaugurating a former emperor as president of the Republic — under the title of First Citizen. \nWhile previously this may have been taboo, the thought has been entertained by many previous nationalists who now serve the Republic. \n\nOf course Japan will never revere such notions of a living God or emperor again, but hailing the First Citizen? \nMight be an interesting change of pace."
  repjap.11.a:0 "The Light of Amaterasu Touches Japan Once More."
  repjap.11.b:0 "If Anyone is to Rule the Nation, It is to be Chosen by the People. Not Divine Right."
  repjap.11.c:0 "Proclaim Fujiwara Shogun Instead"

  repjap.12.t:0 "Come Sweet Death"
  repjap.12.d:0 "While much of the Technocratic administration has sought to increase the nation's efficiency to exponential levels and streamline much of her bureaucracy; today however, such efforts and initiatives have buckled under their own weights. \n\nMaximizing military and social spending has led the nation to ever growing stagnation, until today the government finally announced that it could no longer afford governmental expenses — eventually culminating and creating one of the largest protests the nation has seen since the Japanese Revolution. \n\nStudents, Workers, Farmers, and even many of our military Conscripts have revolted against the Technocratic Faction's Government. \n\nWhile previously the People's Association would react to the protestations with apathy; news stations have reported that protestors have broken past the barricades. \nNow the people await the fate of the nation."
  repjap.12.a:0 "The Protestors have Won. Japan is Dead."
  repjap.12.b:0 "PSS-9 is the Nation's Only Salvation. Give them the Reigns."

  repjap.13.t:0 "The Plight of the Urban Societies"
  repjap.13.d:0 "With the election of the Agrarians factions in Japan, large scale migrations and fundings have been dedicated towards the agrarian sectors of Japan — developing into a problematic situation for us, where many people within the urban landscapes have become overwhelmingly neglected. \n\nWhile such an issue is luckily enough, it can be stopped if we assert ourselves a little more and do a little corrective actions. Currently the rule of [JAP.GetLeader] will have to end, and they will have to step down; as they have faced much criticism due to the growing crisis. \n\nWhile nominally we would select a that would retain our agrarian principles under a more moderate approach. It should be noted that with such a growing agrarian base, it's only the Republic’s will to carry out the will of her people. \nIf the people wish to abandon the plight of urban life, one might argue we should accept such a thought as our national ethos. \n\nAt the end of the day we are going to have to elect a new leader under either circumstance, the decision in the end will be ours."
  repjap.13.a:0 "We'll Take the Pragmatic Approach Here."
  repjap.13.b:0 "Follow the Will of the People, the Village will Regain her Dominance."

  repjap.14.t:0 "Reform Finally"
  repjap.14.d:0 "Following Kingoro Hashimoto's Decision to announce free election under more moderate socialist approaches; there have of course been numerous candidates that arise from what was once believed a dark horse position in Japanese left wing politics. \nMany of these groups considered Reformist and far less nationalist in their principles, however, very much still maintain excellence as proponents of socialist laborism. \n\nAs such the following candidates have been announced as probable in their capabilities in taking leadership of the Japanese Republic. \n\nHotsumi Ozaki — who proposes to maintain Democratic Centralist Principles, guide Japan away from nationalism and move towards internationalism, and vastly expand unionist principles. \n\nAbe Isoo—A dedicated Reformist who seeks to truly restore democracy in Japan, and has been known for his advocation of Zimmerwaldism and rights activism \n\nIkuo Oyama—An Agrarian Socialist advocate, who is a compromise candidate between farmer and industrial worker factions. \n\nAnd Finally Kanno Sugako—leader of the anarchist faction; the candidate proposes a vast decentralization of the apparatus of state, vast expansion of civil and gender rights and freedoms. Sugako has been a long time critic of the Kokutairon system, and seeks to dismantle much of its systems and centralized power."
  repjap.14.a:0 "Sugako Kanno's Anarchists"
  repjap.14.b:0 "Abe Isoo's Reformists"
  repjap.14.c:0 "Hotsumi Ozaki's Unionists"
  repjap.14.e:0 "Ikuo Oyama's Farmer-Laborists"

  repjap.15.t:0 "Elections of New Party Leaders"
  repjap.15.d:0 "As the world enters a new age, there are increasing changes and advancements that bring forwards new social issues, of which will require governmental shifts that new leadership from the democratic processes of a Republic promise the people.\n\nDue to so many new changes, the nation has elected numerous new party candidates to their proper parties and factions."
  repjap.15.a:0 "I Love Democracy."

  repjap.16.t:0 "Helmsman of the Statocratic Union"
  repjap.16.d:0 "The Republic is too unstable to properly be led by the guise of civilian politicians. \nOnly through the great power and strength of the defenders and commanders of the revolution, can we truly expect to defend it from within. \n\nA nation needs a commander and chief to defend, and while many citizens hold Kingoro Hashimoto to be said commander in chief; at our disposal is a series of earnest patriotic officers who will devoutly serve in the equivalent role of defending and leading Japan.\n\nThere is of course Kingoro Hashimoto, the current leader of the military. While he has allowed for a patriotic people's dictatorship to be defended, he is also very much associated with the previous citizens regime. \nNext there is Endo Saburo who is noted for increasing Japanese and Chinese relations, he has frequently met with numerous members of the Agrarian Factions of the nation; and has earned the trust of the people. \nFinally there is Sanzo Nosaka of which there are many things that could be said; labor organizer, writer, University Professor and long time politician for many of the Socialist parties. While he is certainly more acquainted as a civilian; he has also shown interest in defending the nation militarily. If there was anyone to be a neutral mediary between the civic factions and the military it would be him."
  repjap.16.a:0 "Keep Hashimoto"
  repjap.16.b:0 "Pick Endo Saburo"
  repjap.16.c:0 "Select Sanzō Nosaka"

  repjap.17.t:0 "The Midnight Phone Call"
  repjap.17.d:0 "Ishii, having grown his power through Hashimoto's reforms, seizes the chance to take control of Japan and forces Hashimoto to resign and commit suicide, framing it as a reactionary assassination."
  repjap.17.a:0 "The Shogun's finest pupil finally takes the throne"

  repjap.18.t:0 "The Midnight Phone Call"
  repjap.18.d:0 "Ishii attempts to seize control of the government, but understimates Hashimoto's control over the Revolutionary Guard and is subsequently purged, paving the way for Hashimoto's permanent absolute rule."

  repjapflavor.1.t:0 "A Quiet Shift"
  repjapflavor.1.d:0 "The days spent at what remained of the Imperial Palace were often quiet. When fires swept through Tokyo during the Glorious Revolution, the Palace was not spared. Some still remembered as Emperor Meiji himself stood before the burning wreckage of his legacy, the angry and starving wretches that once thought him a god closing in with rifles in hand.\n\nThese were quiet days though, Shirou thought. The Palace still remained a burnt out sepulchre, but the government insisted on guarding it lest it become a haven for \"Imperial loyalists." As he marched along the perimeter, his eyes fell on a young man standing near the gate, gazing absentmindedly at the blackened structure. A frown crawled on to Shirou's face as he stepped up to the man, barking orders.\n\n\"What are you doing here, this is a restricted area!\"\n\nThe man broke from his stupor, fixing his glasses on his face and sputtering an apology. He glanced back one last time at the Palace, then to Shirou, and smiled.\n\n\"I used to live here, you know?\"\n\n\"What?\"\n\nBefore he had time to respond, the man was gone, melted away into the bustling Tokyo crowd. Shirou shook his head, looking once more back at the Palace before moving on with his shift."
  repjapflavor.1.a:0 "\"What a strange man.\""
  
  repjap_flavor.1.t:0 "Rikken Students Protest"
  repjap_flavor.1.d:0 "Despite following the Japanese Revolution a large scale of popular criticism of the national government would occur. Though most instances of criticism would be towards the previous Imperial Regime, the practice wouldn't really leave even following the Japanese adoption of Democratic Centralism.\nStudents, protests and strikes would become a rather common form of displaying grievances towards the governing institutions.\n\nWhile historically for the past few decades this has proven a slight problem for the National Government; most instances of protestations were either met with bargaining or ignoring the strike brokers. \nToday however the Rikken institute has initiated a series of large scale student protests. While nominally the previously mentioned methods would be used to deal with the strikers; with the Rikken Institute being one of our largest and most prestigious research institutions, the means for handling the protests would require more immediate government action, as for the moment the student protestations cause quite the stand still among the development of our nation's capabilities in national research."
  repjap_flavor.1.a:0 "This may set a Bad Precedent..."
  repjap_flavor.1.b:0 "What are you waiting for? Shoot those bastards!"
  
  repjap_flavor.2.t:0 "Rise of the Bōsōzoku"
  repjap_flavor.2.d:0 "Amongst the vast urban environments that dot the landscape of the Republic of Japan, there was a very quick adaptation requirement for society and Japanese culture, as the government and people sought to move past its archaic institutions of both government and class structures, leading to these structures to be completely turned on its head as Japan’s culture became consumed in the revolutionary chaos, a sort of strange evolutionary effect would occur where Japanese society would seemingly evolve way to quickly, as women, youth and social groups would acquire new rights; the people would not waste the opportunity to present their concerns to the government by protestations. And while Japan ended up stamping out these dissenters, it would end up leaving many people feeling left behind by society's growth. \n\nMany of these people, typically youth members, would eventually form groups or gangs of similar peoples with their own rules and structures in a curious display of counterculture. \n\nDespite all of this though, it provides a very interesting and in depth look into how life and youth develop in the unique environment that is the Megacity landscape."
  repjap_flavor.2.a:0 "Interesting"
  
  repjap_flavor.3.t:0 "Nichiren Terrorists Strike Tokyo"
  repjap_flavor.3.d:0 "Though the young Japanese Republic have maintained the doctrine of destroying previous reactionary remnants going on for about a decade now, there would still exist several factions seeking to resist the Republican’s advance and dream of restoring a proper traditional Japan once more. One faction being a strange Ultranationalists sect of Nichiren Buddhists headed by a Nisshō Inoue. \n\nA group who would claim responsibility for an apparent domestic terrorist attack on the recently established Tokyo Metro, construction of which was completed in recent years following the total reconstruction of Tokyo City after the Japanese Revolution.\n\nThe attack seemed to target several politicians who would have been seen in the area, commemorating the opening of the metro system to the people, keyly utilizing makeshift bombs, and what appeared to be makeshift chemical weapons. The attack, caused by an apparent desire for spreading propaganda by deed. Despite the fact that many Nichiren organizations would acquire more neutral relations with the Japanese Government, there would still be several groups that proclaim admiration towards the previously reactionary empire. \n\nThe attack would be carried out, injuring around Fifty civilians and killing Seven civilians with the intended targets of the Republican Politicians remaining unharmed. The perpetrators would eventually be captured by the Japanese Republican Red Guard, and promptly executed following interrogation. Though during investigation, it would appear as though the group acclaimed a cult like following; revering Inoue as a prophet like figure, who in of himself following his exile in the [CHI.GetName], would gain influence from a Millenarist groups.\nUnder superstitious reports from Republican Officials, the group desired to overthrow the government and establish a Chinese Puppet Government, but the group denied such claims. The incident would go on to be known as the League of Blood Incident , and though investigations continue throughout the Japanese Republic; many of the groups leaders have been apprehended and flags fly at half mast in order to pay respect to those who passed from the attack"
  repjap_flavor.3.a:0 "Buddhist, Cultists, AND Terrorists? What the Hell is Happening in Our Nation?"

  repjap_flavor.4.t:0 "Learning from the Laws of Nature"
  repjap_flavor.4.d:0 "The grand opening of the National Robotics Institute (KRK) has been a major success. [JAP.GetLeader] themself was present to shake hands with the major figures in Japanese automatics research, including the chairman of the new institute Makoto Nishimura. The KRK opening was also attended by members of the Navy, the Airforce, prominent philosophers of robotics and representatives of Tokyo electric, who hailed the KRK as the finalization of Tanaka Hisashige's dream and a next step in Japanese industrialization. Chairman Nishimura began the grand opening with a masterful speech regarding the ethics of robotics, contrasting the enslavement of nature's laws by the Europeans and Americans with the liberation found in Japan's friendship and mutual respect with nature and robots. Referring to his previous work with Gakutensoku, one of Asia's first robots, Nishimura applauded the opening of the KRK as the start of a great friendship between robotics, nature and the Revolution. Polite clapping followed as [JAP.GetLeader] ended the ceremony by 'meeting' Gakutensoku, awkwardly shaking the hand of the primitive robot as a symbol of this new era of friendship."
  repjap_flavor.4.a:0 "The Revolution has gained a cold, mechanical arm" 
 
  repjap_flavor.5.t:0 "Bonzai Genetics"
  repjap_flavor.5.d:0 "As Japan continues to walk through decades of development in mere years, Western trends have started popping up in the country, even despite our efforts to crack down on perceived Western concepts. A big one is the young scientific field of sociogenetics, which has been legalized since the end of the imperial government, but has only recently picked up speed in our nation. The utilization of sociogenetic methods has allowed for improved agricultural yields in products ranging from beef to rice, allowing Japan to improve its self-sufficiency against the growing monopoly of Western powers. \n\nA side-effect of the sociogenetic field has become the normalization of sociogenetic improvements among the party elite, especially those who mingle with the scientific bureau. Due to the taboo surrounding the issue, it tends to only stay at rumours if bureaucrats or politicians have improved themselves with genetic treatment, but the recent appearance of more prominent members of the party sporting clear genetic changes, including different eye colours, reversion of baldness and increased muscle density, has started to break the taboo apart. Despite the clear moral issues with the practice, sociogenetics now are a normal part of life in Japan, something our political system can't deny."
  repjap_flavor.5.a:0 "A quiet revolution is happening for humanity" 
 
  repjap_flavor.10.t:0 "\"People's Kobe\" hits shelves"
  repjap_flavor.10.d:0 "Kobe beef, once a meat for the richest of the rich in Japan, has been bend to the whims of the Republic today as the Kobe farming collective introduce \"People's Kobe Beef\" to the nation. Gene-treated Tajima cattle have been able to reduce the cost of the marbled beef to a normal price, as the enormous cows, their impressive size held together by new genetic code, allow for larger yields of Kobe beef on an annual basis. While previous government talks debated on the outlawing of such decadent, aristocratic meat like Kobe beef, the introduction of the people's beef may be enough to convince the party to continue allowing the sale of the delicacy."
  repjap_flavor.10.a:0 "It almost tastes like the real thing!"

  repjap_flavor.11.t:0 "Philosophy of a Knife"
  repjap_flavor.11.d:0 "Reports from Manchuria have shocked the military administration and have only recently reached the halls of Tokyo, causing outrage and serious debate among the highest ranks of the KJK. Deep inside the Manchurian forests, near the border of Russia, a special administrative unit has been found to house the unimagineable. Called Area Zero by the Russians, this site has been used by Moscow to experiment on human test subjects in horrific, inhumane programs. The details of the tests have been censored for the lower ranks of the party, but the inner circle and military leadership know every, bloody detail that Area Zero entailed. \n\nThese crimes against humanity cements our conflict against the Russians and European colonialism as just, showcasing the depravity of the imperialist mindset and the logical conclusion of its scientific racism. While it is a great propaganda victory for Japanese republicanism and Asian liberation, there is another option that has been heavily discussed: Area Zero and its occupants still contain valueable information that may lead to scientific breakthrough. Utilizing the results of their experiments would force us to keep quiet about the inhumanity that was experienced inside the walls of Area Zero, but would grant us a technological boon over the advanced European armies."
  repjap_flavor.11.a:0 "Imperialism breeds horrors beyond human comprehension!"
  repjap_flavor.11.b:0 "Let the Russians continue their work, this time for us! Put a loyalist in charge."
 
  ##########################
  # NEWS STUFF MECHANIC
  ##########################
 repjap_news.1.t:0 "10TH PARTY CONGRESS ENDS IN JAPAN"
 repjap_news.1.d:0 "Japan's political situation has left much to be desired, as the ever young Republic still makes efforts to maintain stability following the end of the Japanese Revolution. Today would prove no different as the government would announce a New Party Congress following the death of party minister ‘Kingoro Hashimoto.’ \n\nWith such an important minister's death, the national association will have to reassess its situation amongst growing unrest; with such an opportunity allowing for the potential development of a new party chairman and a new course being adopted by the Japanese nation."
 repjap_news.1.a:0 "How Will the Japanese Experiment Continue?"
 
 repjap_news.2.t:0 "THE EMPIRE STRIKES BACK"
 repjap_news.2.d:0 "The Japanese have almost always held a martial background in their culture. While after the Japanese revolution, the imperial system was nearly completely dismantled; the emperor was forced to abdicate amid intense growing turmoil. Despite this, the Japanese government still maintained quite the centralized leadership. \n\nFollowing the national election of Fujiwara, a discussion was presented to the Japan under the guise of elevation of Fujiwara as Shogun or the inauguration of the Emperor as First citizen. With such a question raised, it would seem the Japanese are taking a step back in their revolutionary efforts."
 repjap_news.2.a:0 "What is this? Some sort of People's Empire?" 
 
 repjap_news.3.t:0 "THE JAPANESE SPRING"
 repjap_news.3.d:0 "In recent years following Japan's Revolution, there has been a general belief that the government would apply the necessary reforms to become a genuine democratic nation, and allow for the power to be delivered to the people of Japan. \n\nToday, to the surprise of many, that day has arrived; following the governmental decision to permit reformist factions provisions, and with their candidate taking position of chairman; Japan's future now sees a lot more democratic and less iron fisted."
 repjap_news.3.a:0 "Sakuras are Blooming in Tokyo, it Seems."  
 
 repjap_news.4.t:0 "TOKYO IS BURNING"
 repjap_news.4.d:0 "After the Japanese inaugurated the Technocratic Faction's leadership, the nation saw much of its bureaucracy reformed and the entire nation's economy ultimately streamlined and pushed to its maximum potential. \n\nUnfortunately for the National Government, however, such desire of maximizing efficiency has led to the people growing more and more discontent; culminating in collapse of the Japanese government due to protestations. The future of Japan for the moment remains uncertain."
 repjap_news.4.a:0 "It all comes tumbling down, tumbling down, tumbling down."  
 
 repjap_news.5.t:0 "URBAN COLLAPSE IN JAPAN"
 repjap_news.5.d:0 "In the aftermath of Yoriyasu Arima Cabinet's decision to provide incredible large scale provisions to the agrarian sectors of the national economy; Japan's population saw a widescale migration to her rural countryside, and many cityscapes left primarily abandoned. \n\nWith such a societal shift into targeting urban environments as capitalist and anti revolutionary; and as such a growing importance placed on village and rural life — the peasantry should lead the revolutionary cause against Imperialist oppression."
 repjap_news.5.a:0 "What an odd theory."
 
 repjap_news.6.t:0 "ULTRANATIONALIST COUP IN TOKYO"
 repjap_news.6.d:0 "To the shock of many today; the Japanese government has seen a serious show of force from an inter party nationalist faction. As they have ousted the previous Republican government and established a revanchist, ultra patriotic regime. \n\nSoliders, patriotic citizens and militaristic politicians have stormed the Japanese Government hall, and forcefully arrested numerous other politicians and denizens deemed opposing to their rule. Elections have been halted, and Japan now pursues the goal of vastly expanding her military and industrial might under the guise of ultra patriotism."
 repjap_news.6.a:0 "Concerning."  
