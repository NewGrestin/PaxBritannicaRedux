  PB_ASK_The_Battle_For_Victoria_Island: "The Battle For Victoria Island"
  PB_ASK_The_Battle_For_Victoria_Island_desc: "\n\n\n\n\n\nEver since the establishment of the Britian and Russia's respective northwestern colonies the Vancouver region has remained a flashpoint between the two empires. The strategically important Victoria island has long been eyed by Alaska as a potential staging ground for any advancements into the Borelian interior. Whilst probing efforts and border clashes have continued for the past twenty of so years since the start of the decade we have made a concentrated effort to secure the island under our control. Naturally the HBC does not intend to give away Victoria Island without a fight.\n\nWhich ever nation has more influence over the island within the next 14 months will gain control of the island, alongside some additional bonuses. If both nations are tied then the Hudson Bay Company will win the Battle for Victoria Island.\n\n[ASK.GetNameWithFlag]:  §Y[?ASK.VIC_ISLAND_INF]%§!\n[BCL.GetNameWithFlag]:  §Y[?BCL.VIC_ISLAND_INF]%§!\n" 
