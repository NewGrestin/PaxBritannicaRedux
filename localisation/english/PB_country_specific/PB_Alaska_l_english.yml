  PB_ASK_The_Last_Frontier: "The Last Frontier"
  PB_ASK_The_Last_Frontier_desc: "\n\n\n\n\n\nIt is in the far-flung lands of the Alaskan wilderness where many have found their peace. Home to Russian administrators, American industrialists, and British missionaries there are few who are not willing to call this nation home, as isolated and barren as it may be. With Russian colonial spirit at a fever pitch and the wealth of the American continent ripe for exploitation there are those who seek to find their fortune amongst our lands, we should make every effort to welcome these individuals and profit from their expertise.\n\n"

  ASK_Frontier_Settlers: "In Search Of A New Life"
  ASK_Frontier_Settlers_desc: "Every month convoys full of eager and bright minds are shipped off from the motherland into our young virgin nation, these people, whom come from all walks of life, have brought with them their skills and specialities to which our colony desperately requires should it prosper into a fully developed nation. There are also those whom have crossed into our borders fleeing tyranny, or just with a vigor for expedition, these souls, whatever the case may be for their arrival, will too find their rich future on our soil. We shall welcome everyone, poor, sick, and all."

