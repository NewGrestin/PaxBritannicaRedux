l_english:

PB_IRQ_This_Land: "Is My Land, Is Your Land."
PB_IRQ_This_Land_desc: "Great Babylonia may resist our inherent resolve to occupy these uncivilized lands, but we are here to the benefit of all iraqis, we want all iraqis to have free eleckshiyuns, i cant attest to this myself, it is simply in the interest of both American and Iraqi people to hold firm in this relationship we are to forge between our two great nations, both birthplaces to the first states both ancient and modern, it serves a testament to our commitment to ensure that this land abused and left on the rack is brought with us to the future for what they had served to symbolize for us years later."