 GUA_ubico_i: "Ubico I"
 GUA_ubico_i_desc: "It doesn't matter when: during coffee time, while watching a parade or when talking to the important men of the Royal Fruit Company. Ubico I, first emperor of Guatemala and its people, will always bring up his resemblance to his idol, the great Simón Bolívar. In the emperor's eyes, Ubico shares the tactical genius, the political mind and respect for the people as the man that liberated South America from Madrid's oppression and established a royal dynasty in Colombia. His comparisons to Bolivar have become a habit that many of Ubico's close allies have become used to, even if they have to bite on their tongue when the comparisons turn into grand displays, including statues and paintings of Bolívar and Ubico in similar poses. \n\nUbico hasn't always been the dictator of tropical Guatemala, being the son of a lawyer-politician who climbed through life via the military. With the support of the Guatemalan military and financial backing from Royal Fruit, Ubico was able to overthrow Guatemalan democracy and install a military dictatorship, before proclaiming himself the Emperor of Guatemala. In response, the Republic of Los Altos started their revolutionary campaign against Ubico's reign, with the conflict continueing to this day, though with more restrain than the first months of the war. Nevertheless, raids and pillaging of local villages may be damned, as long as Ubico rules Guatemala like the little emperor he is."

