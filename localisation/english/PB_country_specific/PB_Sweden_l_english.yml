  PB_SWE_election_category:0 "The Cossack Election"
  PB_SWE_election_category_desc:0 "The Automation Crisis has arrived in Sweden, and already Ernst Trygger and his government have been pressured to take the crisis by its reins and recover from it as quickly as possible. Unfortunately, such desires have been largely gated by an impasse in the Riksdag, which has prevented any bills from being passed without approval by the §gNational coalition§! opposition. This deadlock has led to ongoing negotiations with the §2'Citizens' coalition§! of Trygger and his allies against §gNational coalition§!. This window will showcase the effects of negotiations to come, and it will conclude if the Kirunaavtalet agreement comes to pass.\n\nKeeping the §2coalition policy support§! equal to or less than the §mconcessions we make to the opposition§! will ensure that the §gNational Coalition§! will be satisfied enough to let our bill pass. However, prioritising our own agenda to appease §lcoalition partners§! and keep §2coalition policy support§! above 0 is crucial to prevent the coalition from collapsing.\n\nThe support for our coalitions's policies is: §S[?DEN_cabinet_policy_support]§!\n\nThe level of concessions to the opposition is: §m[?DEN_opposition_concessions]§!\n\nThe number of pooled economic credits we have is: §Y[?DEN_economic_credits]§!\n§LFor every economic credit we are able to acquire in surplus at the end of this focus tree, wrangling control of Affarsimperium will become noticeably easier.§!"
  
