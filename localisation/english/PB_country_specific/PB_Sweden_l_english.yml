  SWE_bop_court_viktorias_advice: "Seek Viktoria's Advice"
  SWE_bop_court_viktorias_advice_desc: "In order to make the Queen feel as though she has more authority over us than she really has, we will ask for her advice on a government policy and try to implement what she says, without compromising our authority."
  SWE_bop_court_convene_nobility: "Convene the Nobility"
  SWE_bop_court_convene_nobility_desc: "The nobility feel sidelined by the party, and so we will convene a meeting amongst prominent nobles, including the Queen, and seek to work out any issues between us all."
  SWE_bop_court_fund_monarchy: "Fund the Monarchy"
  SWE_bop_court_fund_monarchy_desc: "To appease the monarchy some, we will siphon some tax money away from the government and towards the monarchy, just to shut them up for a while."
  SWE_bop_party_assert_party_prerogatives: "Assert Party Prerogatives"
  SWE_bop_party_assert_party_prerogatives_desc: "The party is the one with the authority, not the monarchy, and we will make sure they know that."
  SWE_bop_party_undermine_royal_authority: "Undermine Royal Authority"
  SWE_bop_party_undermine_royal_authority_desc: "Any good attack on entrenched institutions is subversive, so we will work to erode their power below their noses."
  SWE_bop_party_dismiss_royal_complaints: "Dismiss Royal Complaints"
  SWE_bop_party_dismiss_royal_complaints_desc: "The monarchy has lodged several complaints about our actions, and they've sat gathering dust. The time has come to deny them outright."
 
 
  SWE_courtyard_camarilla: "The Courtyard Camarilla"
  SWE_courtyard_camarilla_desc:0 "The §eCourtyard Party§! as a party had normatively served purely to empower §YSven Hedin§!'s direction for the national government — a vast coalition of right-wing and authoritarian-leaning factions who agree on little and argue for as little. the §nLund Conservatives§! clinging to their ideal for the new society and state, the bitter §cProtectionist Party defectors§! nursing old grudges and loyalties, the §dNobility§! guarding what remains of their privilege, the §GLuddites§! railing against the machine society of the coming age, and the fervent §6Transcendentalists§! dreaming of idealist nostalgia.\n\nHolding this arrangement together is not optional nor is it preferable, Yet if left unattended, these factions will tear at each other before any enemy of the state gets the chance.\n\nAnd above them all sits §YQueen Viktoria§!, who lent her name to this government though hesistantly. Conservative by trade, she remains fiercely protective of her royal prerogative and of the democratic institutions she has presided over for so long. And while She does not object to the Courtyard's politics necessarily, those closest to §YSven Hedin§!'s ministry would understand the danger plainly: give the Crown reason to believe her vision for democracy is being undermined, and she will not hesitate to move against the very government she allowed to form.\n\n[get_hedin_loyalists_support]\n\n[get_lundarna_support]\n\n[get_kronparteit_support]\n\n[get_luddites_support]\n\n[get_transcendentalist_support]\n\n[get_conservative_support]\n"
  
