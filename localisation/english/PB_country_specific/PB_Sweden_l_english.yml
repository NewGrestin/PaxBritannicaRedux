  SWE_opening_screen_picture: "GFX_PB_SWE_opening_picture"
  SWE_country_opening_subname: " "
  SWE_country_opening_lore: "§YFeatures:§!\n    - Maintain our monopoly on augmentations\n    - Address growing Corporate influence in the country\n    - Put an end to political violence & gridlock in the Riksdag\n    - Redouble our colonial efforts in Solkusten and beyond\n    - Strike down the Bear of the east\n\n§YSituation:§!\n Whether it be the impressive  empire the Caroleans fought for or the prosperity the Gustavians brought fourth, the east has continously caused tragedy after tragedy for the Swedes, its attempts to end the age-old rivalry with Russia being met with lead. Sweden had been relegated to a regional power since its defeat in 1722 & been on a steady decline thereafter.\n\nThe depression would be cured with §YGustav III§!'s accession 1771 & his subsequent self-coup a year later. His reign, while authoritarian & despotic, would bring much-needed change that the ineffective, bickering Riksdag couldn't. His reigns milestone would be besting the Bear in the §YWar of 1788-90§!, sinking its fleet & reclaiming Karelia, along with establishing §CSolkusten§! & other colonial projects. His descendants would continue Swedens steady growth & modernization, known as the §YGustavian Era§!, coming to an end in 1907 with Queen Carola's death.\n\nRussia, claiming Stockholm supported their secessionists in the aftermath of the §R1st National Awakening§!, would launch an invasion of Sweden in 1926. The war would become known for its slow, cold & brutal conditions, culimating in an eventual Russian victory in 1928, despite Swedish effort. A third of Sweden and a fourth of its population, that being Finland, would be lost. \n\nSweden has yet to recover from his disastrous event, facing untenable political stability and growing radicalism. Will the Eastern Realm be reclaimed, or is to be consumed by the bear?\n\nSweden is an §YEmerging Power§!.\n\n$PB_special_thanks$\n\n"
  SWE_country_paths_page: "SWA LORE"
  SWE_country_opening_politics: "Out In The Big Wide Blue\n\nThe conservative political landscape is in the midst of a transitional period within the §BProtektionistiska Partiet§!. Under the government of §YErnst Trygger§!, the §BPP§! has tilted closer to the quote 'modern right' steering the party into the social and electoral demands of the 20th Century, although to the behest of Trygger himself as he sits on the right of the party. He presides over an uneasy §BCivic Koalition§! with much of the Riksdag's center, elected on the promise that he alone could reach across the aisle to the §gCourtyard Party§! (Borggårdspartiet) on the right, and secure their cooperation on matters relating to the §YWinter Insurgency§!, which had consumed much of the political spotlight in his term.\n\nComing into 1933, the Coalition has grown frustrated with an increasingly unruly and openly anti-parliamentarian agitation by the §gCourtyard Party§!, whose attacks on the political institutions itself show no signs of relenting. It seems Trygger alone stands as the firewall keeping the Coalition together — of which his fall would invite a hung §YRiksdag§! for the remainder of the term.\n\nWith the §YKirunaavtalet§! scheduled later in the year, the Coalition's left flank has issued an ultimatum: pass the most consequential policies now, while there is still time to secure the Coalition electorally. Chief among these are the §YSufferagettlagen (Suffragette Act)§! and the long-overdue empowerment of the historically under-apportioned seats in §YKiruna§! and the northern industrial cities — regions whose legislative weight has never caught up to their contribution to the kingdom since the population boom of the §YSecond Renaissance§!."
  SWE_country_opening_politics_1: "A"
  SWE_country_opening_paths: "§gBorggårdspartiet§! (§gReactionary§!/§GNeo-Imperialist§!):\n£white_dot Before the §YKirunaavtalet§!, force the coalition to collapse: drop §BCoalition Support§! to 0 or below while keeping §gOpposition Concessions§! under 3. If the §YKirunaavtalet§! then fails, the §gNationella Koalition§! will be elected in the succeeding snap elections.\n£white_dot To force Queen §YViktoria I§! to abdicate, complete the §YAll the King's Men§! focus and stave off the §gMannerheim Coup§!.\n£white_dot  To fully empower the §GLundarna§! you need to stave off the §gMannerheim coup§! after finishing the §YLiturgical Struggle§! focus branch prior to taking the §YAll The Kings Men§! focus.\n\n\n\n§gKronparteit§! (§gDespotism§!):\n£white_dot follow the same instructions as above refering to the §gMannerheim's Coup§! mission, but instead let the coup succeed.\n£white_dot  To achieve the §gSwedish Cromwell§! end-state, IDK MAN!!!!!"
  SWE_country_opening_paths_1: "A"

