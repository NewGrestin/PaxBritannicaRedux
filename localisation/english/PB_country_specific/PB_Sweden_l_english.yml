  SWE_contract_ship_vasa: "Commission the Vasa"
  SWE_contract_ship_vasa_desc: "Named for the royal dynasty, and its other untimely namesake. the Vasa is to be laid down as a heavy warship befitting Sweden's renewed naval ambitions. The shipyards will need to divert significant resources to see her built.\n\nNote: This will strain our consumer goods supply and dockyard capacity while under construction."

  SWE_contract_ship_tre_kronor: "Commission the Tre Kronor"
  SWE_contract_ship_tre_kronor_desc: "Named for the Three Crowns of the Swedish royal coat of arms, this light cruiser is intended to serve as a fast, versatile addition to the fleet, capable of screening our heavier units and patrolling the Baltic approaches."

  SWE_contract_ship_gota_lejon: "Commission the Göta Lejon"
  SWE_contract_ship_gota_lejon_desc: "Named for the Lion of Götaland, this modern light cruiser incorporates lessons learned from earlier designs, offering improved fire control and armor over her predecessors."

