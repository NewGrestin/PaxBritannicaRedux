  PBNews.379.t: "FINLAND FROZEN"
  PBNews.379.d: "Is the news being heard as both Swedish and Russian representatives have signed an apparent armistice with the Free Finnish Army. Both sides have pledged to halt all combat operations along the front amid rumors that a Russian ultimatum forced the Finns to suspend their offensive.\nThe Swedish government has yet to comment on the agreement, though it is expected to face considerable disappointment from Finnish and Swedish communities on both sides of the Gulf of Bothnia. Nevertheless, Russia's limited military response in Finland suggests that neither side is willing to risk escalating the conflict into a full-scale war."
  PBNews.379.a: "So who really won the war? The Finns, the Russians, or the Swedes?"
  PBNews.380.t: "SWEDO-DUTCH TRADE WAR"
  sweden.6.t: "The Finnish Administration Asks for Intervention"
  sweden.6.d: ""
  sweden.6.a: ""
  
  sweden.7.t: "Intervention in Finland"
  sweden.7.d: "To our north, the Finnish insurgency has been a constant thorn in our side that we expected to be a quick affair. When Finnish and Swedish rebels began fighting against us, it was expected that they would fall apart or be crushed easily, but it was proven to not be so easy as their tenacity withstood our attacks. Despite repeated failures to snuff out the Finno-Swedish insurgents, they by no means held the capabilities to push us out, and many were content to just contain the rebels until the situation changed to favour us.\n\nAs it turned out, the situation in Finland certainly changed, but not in our favour. Swedish assistance has drastically increased these past months, and with Stockholm's aid the Army of Finland has made strides in their efforts to banish us from Finland. At last, both military and civilian authorities have had enough of this travesty and authorized the mobilization of several divisions to reinforce and beat back the Finns and Swedes. Despite this, numerous issues, ranging from poor supply routes, rough terrain, and the biting cold have led the military to be pessimistic about our coming offensive.\n\nThus, a tough decision has been made to approach Sweden with an ultimatum first. We'll allow for a full ceasefire along current lines, allowing them to keep whatever territory they've consolidated while saving what we've defended. Despite some revanchists seeking to commit to the full destruction of the Finnish rebels, the risk of another war breaking out with Sweden so soon after the last is too great for many to seriously consider."
  sweden.7.a: "Let's hope the Swedes are reasonable."
  
  sweden.8.t: "The Russian Ultimatum"
  sweden.8.d: "It seems the Finnish situation has finally caught the eye of Saint Petersburg.\n\nSince the beginning of the relatively low-intensity conflict in the region in 1931, Russian military presence has been limited as it was widely believed that the rebellion would dissipate quickly. That was not the case, as the tenacious Finnish-Swedish fighters repulsed numerous Russian operations. However, a critical and constant shortage of equipment, especially big guns like artillery, prevented the rebels from beating the Russians out of Finland. That is, however, until we began drastically increasing support a few months ago. Our support enabled Kemi to launch significant offensive operations, which, despite pushing the Russians back significantly, also wrought great losses to both manpower and equipment to the Army of Finland.\n\nThis is the stage set for the most recent development, an envoy directly from Saint Petersburg carrying what we feared to be inevitable: an ultimatum. It seems the Russians can no longer put up with the Finnish conflict and have authorized the mobilization of several divisions to reinforce their war effort up north. This escalation could potentially lead to a resumption of hostilities between our nations, something neither side really wants. Despite the ultimatum not stating it, it's also believed that the Russians are not very optimistic about their capabilities to win the war totally. Regardless of the exact reasoning, they've offered us an out: an indefinite ceasefire along current lines of control. We keep what we'e gathered, they keep what they've defended.\n\nDespite some voices calling for a rejection of this ultimatum, the Russians undisputably have the bigger stick in this fight, and most have accepted this is the best we'll get. The only thing left to do is sign it."
  sweden.8.a: "We have no choice."

  sweden.9.t: "Winter Insurgency Vets Return"
  sweden.9.d: "Much of the Swedish Volunteers have now returned home following the cessation of hostilities in the Winter Insurgency. With the war, for the most part and in its current phase, over at least for the coming years, the nation reflects on a campaign that has brought considerable merit to our hopes in the east. Though we failed to secure the whole of Finland, considerable progress has been made toward this objective.\n\nOur boys return to the cheers and applause of their families, welcomed as heroes. 'A Valiant Campaign,' the newspapers proclaim, celebrating the victories won across the Gulf and the courage displayed by Swedish volunteers. Yet amongst the populace lie a quiet sense of incompletion. The campaign had not ended in the quick and complete victory as promised, leaving many a Swede to wonder whether the sacrifices made have achieved enough.\n\nBeyond the Gulf, the eastern horizon remains dark. The bear still lives, wounded perhaps, annoyed more likely, but far from defeated. Ultranationalist voices have already begun denouncing the ceasefire as a squandered opportunity, claiming that Sweden halted its advance at the very moment the enemy faltered. They argue that the nation should have struck the bear dead once and for all, reclaiming Sweden's imperial glory while the chance still remained. For now, however, those ambitions remain unrealized, suspended alongside the armistice itself."
  sweden.9.a: "Perhaps it was too soon a treaty..?"
  sweden.9.b: "Some day we'll see them all home!"

  sweden.11.t: "Negotiations with Krueger"
  sweden.11.d: "The Pitch was simple, \n\nEdison's advances, and the growing threat of the Automation Crisis in Britain and America, loom over the Kingdom like a gathering storm. Should the Anglo-American powers master mass automation before we do, Sweden risks being inundated with cheap English manufactures, Georgian beer, and American shame from the mainland to Solkusten. Our workshops would struggle to compete, our markets would be overwhelmed, and our industries could face de-industrialization at the hands of foreign production, eroding not only our economy but our very autonomy. \n\nYet every crisis carries within it an opportunity. Britain has been struck first. Its workers have resisted automation with strikes, sabotage, and political unrest, hoping to strangle the movement in its cradle before it can transform their nation. Their hesitation grants Sweden an opportunity that may come but once in a thousand years. While our own labour unions and politicians remain preoccupied with the "inevitable" British deluge, we have been handed a precious window to replicate—and perhaps surpass Britain's technological advances on our own terms.\n\nIf we seize this moment, Sweden need not merely withstand the coming industrial revolution. We may outflank Britain itself, claim mastery over the age of automation, and secure our place upon the throne of the new industrial world."
  sweden.11.a: "Perhaps the future lies beyond simple humanity."
  sweden.11.b: "Britain can only serve a case against it."

  sweden.17.t: "The Automation Crisis hits Sweden"
  sweden.17.d: "A hundred or so men from the dock stood staring out at the sea. To the inspecting manager, uninformed of the latest arrivals and departures, it seemed as though they were simply loitering, looking toward what could only be described as more than three dozen cargo ships lining up to enter the port of Göteborg. He didn't know what was in those ships to distract the entire dockyard from unloading the weekly coal shipments.\n\n'We won't be needing them...' one man said.\n\n'They won't be needing us,' another quickly corrected.\n\nDozens- hundreds, of automats and mechanical parts were being shipped ashore, with a quarter bound for Denmark and the rest destined for Sweden. Just then, the port authority spokesman arrived from one of the ships, demanding that people clear the way as it docked. One worker stood in front of him, unwilling to move, until British security escorted him away.'Take him away,' the spokesman said. 'I can replace him—all of the lot.'\n\nThe manager ran frantically after the spokesman, asking what exactly he was doing, under what jurisdiction and what state of mind was this man firing individuals on impulse?\n\nThe spokesman, stopped, fixed his coat and suddenly grabbed the manager by the collar, replying coldly,\n\n'I've got a brain in a jar that'll happily take your spot if you have a complaint.'"
  sweden.17.a: "And like this, Swede against Swede, by will of the Anglos."

  sweden.29.t: "Too little, too late."
  sweden.29.d: "A little compromise; a bargain that's all we asked for. Hardly could that ever have been too much to ask for. We've asked for crumbs and Riksdag gave us nothing.\nThe Conservatives we once rallied under are dying, the successor though they have shown a background in respect to our admirations of protecting the values we hold dear, once again these politicians of the party wish to try moderation once again. \nWhilst many in the party are split on the issue, many of us agree that this betrayal of national politics can no longer continue. \nThe Fatherland has been betrayed, her people neglected and our traditions stamped out against all of our attempts at salvation. \n\nAnd with all these attempts we hear the marchers in the streets. In response to the expanding industrial slavery, workers have begun clogging, monkey wrenching, and sabotaging their industry. With the failures of the Conservatives in parliament, the flame is now lit. \n\nThe people have chosen anger, and in that decision anger too is chosen in the party…"
  sweden.29.a: "A Violet Will Defeat Any Machine."

  sweden_flavor.1.t: "The Northern Way of Life"
  sweden_flavor.1.d: "It had not taken a Russian invasion to bring about such a sight. No greater effort would have been demanded of Sweden, nor of the Finns themselves. The Laukkuryssä—known by many names: bagmen, peddlers, or simply 'Russian bag traps' despite most being Karelians—had long wandered the lakes and forests of the North with little more than great packs upon their backs and honest trade as their livelihood. Yet today they carried not wares, but rifles, swords, boots, and ammunition.\n\nLong had Swedish officials suspected these restless wanderers of little more than serving as Russian smugglers. The insult of being called a Russian was borne unwillingly, but the accusation endured nevertheless. Now, however, the rumors spreading across the frontier spoke of another Russian annexation, another campaign of erasure, and another people destined to disappear beneath the Empire. The bagmen had become soldiers.\n\nAmong them marched one spoken of in both Finland and Karelia with uncommon reverence: Ukki Väinämöinen, the 'Grandfather,' hailed as a hero of the struggle for freedom. Whether enlightened philosopher or merely a stubborn yeoman depended entirely upon whom one asked.\n\nCuriously, the old man's words echoed ideas already taking root within Sweden itself. He condemned automation no less fiercely than Russian industrialism, seeing in both the same machinery of dehumanization. Unlike the English Luddites, whose struggle was often one of profession and livelihood, Väinämöinen's concern was broader. What becomes of a people when labor no longer binds them to their neighbors, but instead to debts without end? Is a man truly free if he spends his life working only to repay another, becoming not a slave by law, but a slave to obligation itself?"
  sweden_flavor.1.a: "How Curious!"

  sweden_flavor.2.t: "War Report: 179-S"
  sweden_flavor.2.d: "With the ever continuing conflict that is the Swedish Insurgency in Finland, there have been continuous claims from our populace within the territory of the Russian Occupied zones that the Okhrana have attempted to falsify claims that Swedish troops are performing paganist sacrifices on Russian troops in order to claim a moral and religious high ground against our belligerent. \n\nWhile we had initially believed such claims to be false, upon personal investigations of our troops activities in Eastern Lands, surprisingly enough the claims turned out to be actually true.\nIn a shocking turn of events, a regimental commander has actually incited his troops to carry out ancient pagan Blood Eagles on Russian Troops in an effort to create Psychological Warfare among their troops.\n\nThe Blood Eagles process involves the subject laying prone, as their skin is flayed from their back. Their ribs separated from their spine, usually through either forcibly breaking them or surgical precision. Finally the subject's still breathing lungs are then pulled through the areas where the wings were, creating a pair of ‘wings.’ This is all typically done while the subject is still alive, causing insufferable pain until the subject either dies from shock or bleeding; typically the former. \n\nWhile the utilization of such a method is barbaric and should clearly be forbidden, the effectiveness of such methods can be seen as quite clear. As many Russian recruits have shown resistance to volunteering, fearing being tortured in such a manner themselves. \nThough it might be incredibly taboo, perhaps we should advocate for the method's expansion in the war."
  sweden_flavor.2.a: "Are you Mad! Reprimand the Commander Immediately!"
  sweden_flavor.2.b: "Psychological Warfare of Any Means Should be Expanded to Defend our Homelands…"
  
  sweden_flavor.3.t: "Business in Arms, Business in Finland"
  sweden_flavor.3.d: "War is a game of superiority. The ultimate goal of this game is to stack enough advantages in your favor to overwhelm your opponent and destroy them. This takes many forms, be it evolving tactics and strategies, sheer numbers, or, arguably most important in the age of science, technological superiority. A thousand of Rome's strongest legionaries will win easily against a hundred Carthaginians of equal match, but those thousand legionaries will be dead before they could even reach a hundred men with twenty machine guns. Obviously, modern warfare is never so stark, but the point is made. Sweden, a second-rate power, needs to maximize these advantages to win against her foes, especially those as powerful and vast as Russia.\n\nThe Affärsimperierna, Sweden's most powerful business conglomerates, dabble in war production to various degrees. Some can claim to not have blood on their hands, simply selling the material or tools to manufacture weapons of war, while others, such as Bofors, are directly involved the making of these tools of violence. With Finland ablaze and the frontlines melting, several of these companies have spotted an opportunity to simultaneously aid our effort while enriching themselves by using the struggle as a playground for R&D testing. Three particular experimental weapons have caught the military's eye, if just for the names associated with them.\n\nBofors, the artillery manufacturer, has been experimenting with truck-mounted rocket artillery as a result of maneuverability issues faced during the Northern War, when towed artillery proved unable to easily traverse the frozen wastes of Finland. Their solution was to mount artillery on a vehicle, and in order to create a fast-moving mobile artillery unit, they settled on mounting experimental rockets to trucks. Kreuger and Toll, meanwhile, have continued their research into body augmentations by proposing the deployment of a company of Razormaidens: elite, nimble, elegant, and exceedingly violent women capable of fast-moving shock attacks. These augmentations have hardly, if ever, been testing on the field on such a scale, so pursuing this could reap great benefits on the understanding of these technologies. And lastly, ESAB, a welding and robotics company that spearheaded the development of Hardsuits during the Northern War, has returned with a new batch of experimental suits and equally experimental heavy infantry arms."
  sweden_flavor.3.a: "Blood shed now to avoid blood shed in the future."
  
  sweden_flavor.4.t: "Hear the Rockets Sing"
  sweden_flavor.4.d: "\"Fire!\"\n\nAt that word the rockets strapped to rails on the back of a truck lit and the missiles ripped into the air, whistling across the crimson sky in an arc before crashing down upon a small town. The projectiles burst into a mighty explosion, lighting ablaze the town, once vibrant but now desolate. Within minutes of the volley of rockets, infantrymen fixed bayonets and loaded their rifles, setting off into the woods that separated the hill and the town, while the crew operating the rockets began the slow process of reloading.\n\nOnce the infantry reached the smoldering town, they found no sign that it had been occupied recently. No Russian corpses, no abandoned or destroyed equipment, nothing but the acrid smoke and embers fluttering in the wind. Without warning, the crack of dozens of rifles and sputtering of machineguns from a treeline tore into the town, lead screaming into those unfortunate to be in the sight lines. The infantrymen took positions in ruined buildings and hastily-dug foxholes, firing back at unseen enemies amongst the trees. Machinegunners hurried to emplace their guns and return fire while a radioman called back to the rocket team, screaming at them to open fire on the treeline.\n\nWith the rockets being nearly prepared, the officer ordered double time on reloading and had their aim adjusted. Once all was prepared, he yelled once more to fire. There was but one issue. A single rocket, improperly loaded, hissed to life, but instead of cleaning leaving the rack, it struck one of the beams, detonating itself and igniting the combustibles in the other rockets. They themselves exploded, creating a titan of a blast that repeated the same catastrophic cycle. Only a dozen or so rockets escaped their chambers before the calamity, of which several struck their own positions, the rest largely missing the Russians who were now charging into the town.\n\nOnly a handful of Swedish troops escaped the town with their lives. They came across the inferno where their artillery once was, each crewman left a charred and blackened husk, if they even still existed as a cohesive thing.\n\nA few weeks later, hundreds of kilometers away in a comfortable office in Stockholm, an executive would explain to his colleagues the results thus far the deployment of these rocket trucks, delving into statistics and numbers but not once mentioning the names of those fallen in their project or even considering that the numbers of losses and incidents equated to people with lives and families of their own."
  sweden_flavor.4.a: "Lives sacrificed for a project that may be discontinued regardless."
  
  sweden_flavor.5.t: "Woman o' War"
  sweden_flavor.5.d: "The Russian positions near the village of Pyykkölä were cold. Very cold, in fact, and desolate, and vulnerable, and just about everything a soldier wouldn't want, with almost none of what he wanted. Snow was piled meters high in some places, and each passing day a new frozen and blackened corpse would be added to the list of those lost. By this point, nearly a month since they were sent to this frozen hell, the men of the company had been desensitized to it, and come to appreciate the few mouths to feed on the already thin rations. When the hell was relief going to come? Or at least a resupply of food and material?\n\nLate one night, as the soldiers slept stiffened by the biting winds tearing at them even through their tents, the unlucky sentry posted overlooking the Lake Karhusalmi heard an unusual sound echoing from the frozen lake. A strange and subtle whirring noise seeped past the howling winds into his ears, and when he pulled his binoculars to his eyes all the pains and suffering of the past month disappeared in favor of an intense and unfiltered dread. Dozens, perhaps a hundred, of ghostly figures were skating across the ice effortlessly, their long thick coats trailing behind them like a cape, their thin and elegant figures lit by the moonlight as they raced closer yet closer at speeds impossible for a human to do without shattering the ice below.\n\nThe sentry was awestruck, unbelieving of his eyes, until he saw the moonlight glint off of blades. Long blades, short blades, an assortment of knives and swords awoke him of the impending threat. As he rushed screaming to his comrades, his body unfeeling of any sensation but fear and dread, the maidens came upon the camp. The first tents crumpled as blades ripped through cloth and flesh of the sleeping men, and when dazed soldiers awoke and left their tents, confused and flustered, many met knives tearing into their throats, swords slicing them in two, any manner of unexpected, rapid, and extraordinarily violent ends. Those cognitive enough to ready their arms found themselves struggling to land shots on the blitzing figures. After minutes of unabated violence someone started hurling grenades into the middle of the camp, at some point a fire started, and as quickly as the savage assault began, it ended. The camp was quiet and a small fire crackled, turning many of the corpses and materiel to ash.\n\nTwo days later, relief arrived. The fresh soldiers stumbled upon a horrifying and confusing sight for any to behold. Blood-soaked snow, ashes scattered about the clearing, and charred corpses. None of them could make of what had happened here. The mutilation of the bodies, or what was left of them, was unlike any they'd seen. The only clue to what happened that night to anyone not involved was a single charred corpse of a woman, dressed in a flowing coat, now hardly recognizable, with all sorts of bodily modifications, from robotic augmentations to biological alterations. The relief force couldn't do anything but write it off as shelling and abandon the post."
  sweden_flavor.5.a: "Capability of violence is not unique to man."
  
  sweden_flavor.6.t: "Iron and Steel"
  sweden_flavor.6.d: "When Hardsuit development first began at the end of the Great War and as their wide-scale use was seen with the Northern War, it became apparent that these suits would require much more training than merely telling pilots how to use them. The nature of these "second skins" of steel led to a wide array of mental and physical issues, ranging from overestimations of physical strength after extended periods of use to an acute realization of mortality inducing panic attacks. After a particularly colorful incident in early 1928 when an unstable pilot had a psychotic breakdown including delusions of Godliness and massacred his company and part of a nearby Finnish village before landships had to be called in, the military mandated that all Hardsuit pilots must undergo physical and mental therapy as well as genetic alterations in order to avoid such incidents in the future.\n\nWhen the deployment of new and experimental Hardsuit technology was authorized, it was not the Swedish military but the company, ESAB, that was responsible for them. In order to cut costs on the project, ESAB decided the first thing to do was to hire inexperienced pilots, many of whom had to undergo augmentation surgeries on their own dime and often through sketchy unlicensed doctors, and the second thing to do was to try to avoid hiring therapists for as long as possible. They told themselves that they would only do so once signs of psychosis began.\n\nInitially, all seemed well enough. The first few field operations were successful, with new grenade launcher technology allowing for effectively mobile light artillery. After some weeks, though, the first signs of trouble arrived. An atrocity was reported when the men in Hardsuits chose to fire a volley of grenades into rounded up POWs, but the company chalked it up to a "misinterpretation of events" and covered it up. A week later, a Swedish infantry company reported taking fire from unidentified Hardsuits, but the company once more insisted it was Russians using their own technology despite the proximity of the experimental Hardsuit unit.\n\nThen it happened. The commander of one of the battalions suddenly stopped reporting back. A team was dispatched to their position and discovered a scene of brutality. The officer had been mutilated beyond recognition save his epaulettes, their lodging was torn to peices, and when the team came across a nearby village, they found a repeat of the 1928 incident. Almost the entire village had been blown to pieces, its inhabitants used as target practice or for taking out anger upon, and now the Hardsuiters were firing at each other with grenades to see who could survive the longest. Failing to stand down the battalion, anti-landship guns had to be hauled in to deal with the surviving Hardsuiters, of which two had escaped never to be seen again. Once more, the incident was swept under the rug and the company only then decided to hire therapists."
  sweden_flavor.6.a: "Was the money saved worth the cost in blood?"
  
  sweden_flavor.7.t: "Labour Freefalling"
  sweden_flavor.7.d: "It didn't happen all at once. But the warnings were there from the day it first began. Some heeded it and sought to make their voice heard, others dismissed it or were too busy to worry about it, at least in their own minds. In the end, no matter what choice you made, fate made all equal; egalitarianism, in the worst way possible.\n\nBy the end of the first week, reports were already giving worrying details. Unemployment doubled to nearly 10% since the last report only month prior. It took a few days for cities like Stockholm to begin seeing the effects, with the destitute and the impoverished, the vagrants and the drifters, all wandering the streets unsure of what to do. By the next report a month later, things were well out of control. First it had doubled, now it had tripled to nearly 30%. The insolvent masses, booted from their jobs in favor of machines, were wandering the streets with little to do but try to get by. Some kept applying for any odd jobs they could, almost always finding no reciprocation; many more took to theft and robbery, often just to get food to survive; a few even took their anger out on unsuspecting passersby, turning routine walks through the streets into random acts of violence.\n\nAnd then, of course, there were those who saw no other way out. By the second week of the crisis, Stockholm police had to construct barriers on bridges above a certain height after the bays below became inundated with bodies. A week later, they stopped trying to patch holes cut into them. Numerous cities stipulated that roof access on all buildings was to be off-limits to anyone except staff, though many simply turned to the nearest window instead. After a month, the worst had passed, but the shock of it has been nothing short of traumatic for Sweden. Time, and the response of the government, will tell if it resumes again."
  sweden_flavor.7.a: "2,567, Dead in the first week."
  
  sweden_flavor.8.t: "A Crisis Unlike Any Other"
  sweden_flavor.8.d: "In most crises of economics, it's not entirely the working man that's hit. Usually, businesses of all shapes and sizes see profits dry up, or investors face devastating losses on their investments. Here, though, the working man has no one to share his pain with. The bigwigs at Kreuger and Toll, Bofors, ESAB, Epiroc, and all the rest weren't facing corporate losses or any kinda of hardship. In fact, they were rolling in cash as they no longer had to pay for labour and could simply get their machines to do it at the cost of nothing but the initial investment into the things. Even the businesses too poor to afford automation or not willing to risk the investment were hardly touched in any way but seeing less profit than those above them.\n\nSome have tried to rationalize the crisis and predict its future. A few oh-too-optimistic people have tried to hold on to any hope they have and claim that perhaps if everything becomes automated, products will become free and society will be liberated from the shackles of work and free to engage in leisure, but more believe that automation and the unemployment it brings are here to stay. However, increasingly people have begun to consider the effects automation is bound to have on those installing it in their workplaces in the first place. Right now, those men at the top are rolling in cash without having to pay for labour, but without jobs the people have no money, and without money the people don't buy. Before long, those companies will start to hurt when the money of the once-toiling masses dry up. Profits will fall, and maybe then, just maybe, corporate will realize that automation is not sustainable."
  sweden_flavor.8.a: "A glimmer of light at the end of a long, dark tunnel."
  
  sweden_flavor.9.t: "A Permanent Underclass?"
  sweden_flavor.9.d: "It wasn't long before rumours began to swirl that the government, instead of taking care of the working man and his family, had been collaborating with the Affärsimperierna. The one way out, many believe, collaborating with the men who took their shovels and gave it to a machine to dig their grave in? Most couldn't believe it and kept waiting for the day the government came to their aid. But some did believe it. And those who did began to come to a realization. This was the inevitable conclusion to hierarchy. It was never bound to simply be a set of castes, those at the very top were bound by the nature of their beliefs to squeeze all they could out of those just below them and kick those at the bottom even further down. Widen the gap, destroy the middle, and make sure it stays that way. A permanent underclass.\n\nThe theory is, generally, quite fringe. Only radical Jacobin clubs and other sorts of egalitarians in coffee houses gossiping amongst themselves. But it won't stay that way. These Jacobin cells are growing ever-more adept at propaganda and mobilizing the masses, and it won't be long before what is now in the periphery bleeds into the mainstream."
  sweden_flavor.9.a: "It's just a conspiracy theory."
  
  sweden_flavor.10.t: "Mass Protests in Ådalen"
  sweden_flavor.10.d: "Located in northern Sweden, specifically Västernorrland County, the series of work towns collectively referred to as Ådalen after the river valley of the same name has become one of the forefront wood industry regions in Sweden. While small settlements have existed in the region for a long time, they were isolated and difficult to reach owing to its terrain. It wouldn't be until the Second Renaissance that demand for timber led to its rapid growth as company towns were propped up to house the mass of workers imported to the region. While the pay has been poor, and conditions poorer, thousands of down-on-their-luck working men and even women have called this place home.\n\nUntil the past week. Seven days ago, nearly all of the towns in Ådalen simultaneously announced that they were importing automatons, and two days ago they arrived. So many arrived, in fact, that the companies that owned the towns laid off nearly 90% of their workers, leaving only a skeleton crew of mainly engineers who previously maintained other machinery. Right after being laid off, the towns - owned by the companies - evicted them too. Naturally, this did not go over well at all with the thousands of men, many of whom have families, who had lived in these towns, some since birth. While some have left, the overwhelming majority have stood their ground and organized large protests against the companies for both laying them off and evicting them simultaneously.\n\nThe companies, chiefly Graningeverken which owns a large series of factories in the towns, have begun organizing strikebreakers and called in police from Kramfors, a proper town to the north. Some private security contracters have also approached them offering a hand. Though outnumbered, the protesters are unarmed, so a crackdown won't be too difficult."
  sweden_flavor.10.a: "If they know what's good for them, they'll disperse before things get ugly."
  
  sweden_flavor.11.t: "Free City of Ådalen"
  sweden_flavor.11.d: "Terrifying news has reached us from Ådalen.\n\nYesterday, shortly after noon, the strikebreakers, police, and private security contracters marched forth to forcibly disperse the protesters and few striking workers that had been taking to the streets of the towns. They started with the largest town, Lunde, where things quickly turned violent after a tense standoff. Some protesters reportedly started throwing rocks, so the police returned in kind with batons and boots to the faces of those standing before them. However, after only half a minute or so, one of the rocks thrown was, in fact, not a rock but an improvised explosive. Dozens of workers and strikebreakers alike were killed and many more wounded, but the strikebreakers retreated, leaving three wounded behind who are now hostages.\n\nAfter the retreat, the organizer of this attack came forward. His name is Carl Skoglund, a worker from one of the pulp mills nearby, who had somehow managed to acquire mostly outdated rifles and organized a militia, which rapidly swelled with more volunteers wielding sticks and blunt weapons. He announced to the town of Lunde that he had had enough with the arrogance and violence of the companies that dictated their lives for decades and now tried to expel them from their homes. He was going to put an end to it, he said, with the first step being the declaration of the Free and Equitable Republic of the Cities of Ådalen, which just about the entirety of the press has merely dubbed the "Free City of Ådalen".\n\nWithin just a few hours, news had spread across Sweden and the Västernorrland County Administrative Board has called on Stockholm to relieve the towns from this hostile takeover. While a significant portion of the government, and of course the Affärsimperierna, are calling for us to send in troops to crush the rebellion while it's still organizing, it might just be worth seeking a peaceful end to the conflict through the power of diplomacy."
  sweden_flavor.11.a: "Send an envoy, tell them we'll talk."
  sweden_flavor.11.b: "This Jacobin scum must not be allowed to fester in our country!"
  
  sweden_flavor.12.t: "Ådalen Refuses to Negotiate"
  sweden_flavor.12.d: "When our envoy arrived at Lunde, he was met not with a representative of the Free City of Ådalen, but by a half-dozen guns pointed at him. He announced he was here on behalf of the Swedish government to negotiate an end to the strike. He was shot at. Warning shots at the soil beneath his feet, but shot at nonetheless. While he scurried off for his life, he recalled hearing shouts calling him reactionary scum and a bootlicker of big industry. This was more than enough for the more bloodthirsty parts of our government to override the decision to negotiate, and provided a good "told-you-so" moment for the Affärsimperierna. The troops would, indeed, be sent in.\n\nIn the early afternoon, four companies of soldiers aided by a detatchment of Hardsuiters arrived in Kramfors and set off to crush the Jacobins where they stood. Two companies and the Hardsuiters approached Lunde from the north while the other two flanked the collection of towns to attack Ramvik, south of Lunde, from the west. The Hardsuiters led the assault with handheld grenade launchers and incendiary rounds. The entirely wooden structures the bulk of the town comprised of were uniquely vulnerable to this, and quickly the front defenses were aflame with burning men scurrying from the ruins just to be shot by the infantry. Once the first line of defenses were breached, militiamen started hurling explosives and incendiary bottles at the Hardsuiters, injuring a few but not significantly slowing them. By this point the infantry had begun assaulting Ramvik with great success, and by the end of the first half-hour the militias had abandoned the towns west of the river.\n\nShort work was made of the rest of the defenders. It appears that morale was not particularly high amongst the militias as many fled or surrendered their arms, and within the next half hour the river had been crossed successfully with limited casualties. Carl Skoglund and a small entourage of loyal Jacobins holed themselves up in a sawmill manager's office in Utvik-Nordvik, where he or his bodyguards managed to kill one Hardsuiter with an anti-landship rifle, but a well-placed grenade lit the room he barricaded himself in ablaze, and when the fire was put out only a charred corpse remained. In the end, almost a hundred rebels laid dead, about 250 wounded, and thousands fled or captured, while only five men were killed on the side of the military, including one Hardsuiter."
  sweden_flavor.12.a: "They should have turned themselves in."
  
  sweden_flavor.13.t: "Reap What You Sow"
  sweden_flavor.13.d: "As expected, the reaction to the events in Ådalen have not exactly been positive. Labour activists, egalitarian newspapers, and Jacobin clubs have all denounced the action as an unnecessary overreaction to the crisis, as was expected of them. Even several members of the coalition and opposition have spoken negatively on the actions at Ådalen. At the very least, there hasn't been any widespread reaction from labour like we expected. However, the media reaction is still plenty of danger to us, and how we approach that will be important. For the most part, though, things will continue as normal. The companies that own the towns of Ådalen will repair the damages and have to deal with the lost revenue until things are back in working order, and the survivors of the rebellion will generally be put on trial, several of which have already been imprisoned. Yet despite it all, a question lingers. Why were the rebels so staunch in their opposition to negotiation? Some brush it off and try not to think about it. Others wonder if perhaps it was karmic retribution for something we've done. No one knows for sure.\n\nNow, regarding our response to the media backlash, we have things boiled down to two options. On one hand, we could stand our ground and justify the crackdown as harsh but necessary. This would naturally not be the best for our public relations image, but it might placate the Affärsimperierna and throw us a bone to maneuver more. However, on the other hand, we could show clemency: pardon the decent among the rebels while keeping the worst offenders, and reimburse the families of those lost. The businesses wouldn't be particularly happy about pardoning some of who they see as egalitarian thugs, but the masses will be pleased."
  sweden_flavor.13.a: "Those troublemakers should have known better."
  sweden_flavor.13.b: "But we are a benevolent government!"
  
  sweden_flavor.14.t: "Divide and Conquer"
  sweden_flavor.14.d: "When our envoy arrived at Lunde's gates, the militiamen guarding the town were surprised and ordered the man to stay while the man in charge left to find a superior. A few minutes later, Carl Skoglund himself, wearing a hand-fashioned Phrygian cap, approached him cautiously with bodyguards. The envoy made clear that the government was willing to allow the rebels to peacefully disband, and in exchange the government would help all of those living in the towns find housing and jobs elsewhere. The only real cost to any of the rebels was that the chief organizers of the rebellion, including Skoglund, would be required to leave Sweden permanently, with any and all belongings.\n\nSkoglund told the man he would speak to his "cabinet" and left for his office. After half an hour, and what sounded like a verbal fight, he and his cabinet left the office with most of them storming off. Skoglund himself announced that the council was unable to come to an agreement, and that therefore he was taking executive authority and declaring that there would be no agreement, turning away the envoy. However, as our troops were preparing to set off to assault Ådalen, from the town emerged a long line of workers led by the "cabinet members" who had been displeased with Skoglund. They explained that most of the men who had stayed merely wanted to feel heard, to feel seen, and most cared little for Skoglund's fantasies of republicanism, only putting up with it because they knew it was their best chance at getting what they wanted. Now that that was on the table, they abandoned Skoglund with only the most fanatical Jacobins remaining.\n\nThe exodus marched onwards to Kramfors where they would be processed and eventually transported to Stockholm from where the government would deal with them. Meanwhile, the troops, four companies and a Hardsuit detatchment strong, set off for Lunde. The Hardsuiters made short work of the frontal defenses with incendiary grenade launchers, pushing in to the heart of the rustic town while the infantry cleaned up behind and swept through homes and mills. Eventually, Skoglund and his loyal guards attempted to ambush the Hardsuiters with makeshift bombs, but did little damage and were liquidated quickly. The rest of the towns - Ramvik, Klockestrand, Nyadal, Svatorna, and Utvik-Nordvik - were utterly deserted."
  sweden_flavor.14.a: "A successful operation on all fronts!"
  
  sweden_flavor.15.t: "A Muted Reaction"
  sweden_flavor.15.d: "When news of a violent fight in Ådalen broke, the gut reaction of many was anger at the government. Then, as details came out, the reaction became far less vitriolic. What many had assumed to be the massacre of protesting workers had in fact only really been an unfortunately violent put-down of a radical Jacobin rebellion once it became known that the government was not only allowing most of the workers and unemployed to freely leave, but also was helping them adjust and relocate.\n\nOf course, many Jacobin clubs were still in uproar, and most egalitarian papers made clear their disapproval of the state's reliance on violence, but almost everyone else will likely forget about it altogether, only occasionally being reminded of an odd moment in Swedish history."
  sweden_flavor.15.a: "So, only the people that don't really matter disapprove."
  
  sweden_flavor.16.t: "Violence in Ådalen"
  sweden_flavor.16.d: "In late morning, four companies of infantry and a detatchment of Hardsuiters wielding incendiary grenade launchers arrived in Kramfors, whereupon two companies marched southwestward along dusty trails to flank the defenses from the forest. At noon, the Hardsuiters marched forth where they came under fire from militiamen from various mills and workshops in Lunde. They were met with incendiary grenades, the blast and ensuing flame forcing the men, some of whom were ablaze themselves, into the streets where infantry sharpshooters picked them off from afar. When the Hardsuiters approached the town center, they were met with improvised grenades themselves. Some were wounded and one was killed, but the Hardsuiters pressed on and dealt with the rebels swiftly.\n\nThe flanking companies now charged across a field of tree stumps to close the gap with the city, taking few casualties before reaching the shocked defenders. No quarter was taken as the soldiers swept through the largely residential buildings in this area. The remaining defenders retreated across the bridge to the island of Sandö, where Hardsuiters took potshots with their grenades. After a heavy beating of bombs, infantry crossed the bridge and seized the island. Two companies marched southward to Ramvik while Hardsuiters and the rest of the infantry advanced further across the river to Klockestrand, both of which held out almost a stubbornly.\n\nHowever, it was clear that morale among the rebels was dropping, and by the time Nyadal across the river from Ramvik fell, the vast majority of the surviving defenders abandoned the remaining towns, only really leaving only a cadre of loyal Jacobins including Carl Skoglund in Utvik-Nordvik. These defenders made a valiant last stand, if for a vile cause, using just about everything available to them to resist their inevitable ends. It was ultimately for naught as a well-placed incendiary grenade put a fiery end to the republicans.\n\nWhen the dust - and smoke - cleared, a damaged but not ruined collection of towns remained, though some buildings will need extensive repairs or demolishing. The fleeing defenders will be tracked down in due time, but for now the rebellion of Ådalen has been put down."
  sweden_flavor.16.a: "Such bloodshed for a doomed cause."
  
  sweden_flavor.17.t: "Strikes in Stockholm, Marches in Malmö"
  sweden_flavor.17.d: "Despite the justness of the putting down of the Ådalen Jacobins, it seems much of Swedish society does not see it that way. No, no, not at all, in fact.\n\nFirst came the disgusted reactions from the workers, apalled at our treatment of who they see as working class heroes fighting for a more equitable society; then came the denouncments from just about every newspaper left of our own; then came the demonstrations, marches, and protests from across cities and even many rural regions. And then came the strikes. Numerous major cities, including Stockholm, saw significant strikes from whatever employed workers remained. Factories ran idly and workshops shuttered as what some described as half of Stockholm's industry came to a screeching halt.\n\nThis movement is spreading rapidly and it has significant support from the working class. This disaster has become one of our greatest trials yet, and no one in government can agree on the approach. Generally, our advisors and ministers fall into two camps: some say that we need to be lenient, allow the masses to air out their grievances and tire themselves out, giving some concessions here and there until it peters out; or we can keep up the hard line, mobilize the police and beat the protesters and strikers into submission, make wider society know that what happened in Ådalen can - and will - happen here too."
  sweden_flavor.17.a: "Let them get their feelings out."
  sweden_flavor.17.b: "We will not tolerate this behavior."
  
  sweden_flavor.18.t: "Revolution Retreats"
  sweden_flavor.18.d: "When we announced to our government and the population as a whole that we would allow the demonstrations to proceed unabated and work with the striking workers, reactions were mixed. Some thought of us as slimy bastards wriggling ourselves out of a snag by any means necessary, others were hesitant to trust us after the violence in Ådalen, and most pressing of all was the reaction of the Affärsimperierna, who were in an uproar about our dealings with labour. We tried our best to calm tensions, but the businesses remain unhappy and refuse to see the practicality of making minor concessions.\n\nAs the weeks passed, so did the worst of the demonstrations. We tried to make peace with the workers on strike, which sometimes worked and other times didn't. In times where the workers refused to work with us, we lent the companies some off-duty policemen to deal with the threat while not directly having blood on our hands. By now, things appear to have calmed, and despite some continued unrest, most have quieted themselves, though still with a bad taste in their mouths."
  sweden_flavor.18.a: "The storm passes."
  
  sweden_flavor.19.t: "Folkfiende"
  sweden_flavor.19.d: "The scene in Stockholm was strained, tension pulled so tight that one could cut it with the flick of a bayonet. Across the city, massive crowds of workers, unemployed, and Jacobin agitators stormed the streets in mobs attacking storefronts and bystanders, if official reports were to be believed. Meanwhile, the police, valiant as ever and reinforced with troops, stood steady with riot shields and batons, prepared to push back the rabble, again if the official story is to be believed. The reality was hardly less dramatic, but far less played-up. In reality, the roving mobs were organized protesters, with only a small portion of genuine trouble-makers. And it was not the shot of a Jacobin that instigated the violence, but the police themselves on the orders of military officers that began the beatings.\n\nBy nightfall, the streets were quiet save bands of policemen and military police, and this was the case throughout much of Sweden's major urban centers. The operation may have won us no loyalty from the masses, but fickle loyalty is not necessary when a baton in the face will dissuade almost anyone. The only issue with this assessment of the operation is that it is a lie to anyone who takes anything more than a cursory glance at the situation. Below the surface, rebellion festered. In the clubs and private homes of many, disloyalty manifested. Whispers spread from man to man, bearing one word: Folkfiende. Public enemy. A term associated with the excesses of violent Jacobin revolution to refer to enemies of the revolution applied to the government. Was this the end of a would-be revolution, crushed under the boot, or a precursor to one?"
  sweden_flavor.19.a: "Time will tell."
  
  sweden_flavor.20.t: "Hemmabyarna"
  sweden_flavor.20.d: "With the appointment of Hans Larsson to interior ministership, political pundits and keen laymen alike have renewed interest in Larsson’s literary works, of which he has a long history with dozens of writings dating back to the early 1890s. Of particular interest to many is a work titled “Hemmabyarna” (The Home Villages), a classic work dealing with the turbulence of the new era, and what Larsson himself has called his most sincere work./n/nPublished in 1916, while Europe readjusted to peace in a tulmutuous and unfamiliar new world, the book looks not to the future but to the past to cope with the present. Partly autobiographical, partly fictional, and wholly philosophical, the uncertainty of modern life and its constant uprooting by unnatural forces is contrasted with the idyllic, simple, and wholeheartedly humanistic agrarian society that Larsson was familiar with in his early life.\n\nIn the context of the current situation, this book highlights Larsson’s goal and the drive behind it. Automation is not the future, he claims, but the end, and the future will instead be the past. A return to idyllic agrarianism, an appreciation for nature and the simple life of the countryside, is what is needed to heal Sweden from the pain it’s endured since the Second Renaissance."
  sweden_flavor.20.a: "Truly, the Swedish Walden."
  
  sweden.25.t: "Viktoria Bans the SPS"
  sweden.25.d: "After the apparent ascendancy of the Självbevarelsedriftssamhället to national prominence in the wake of automation riots, The Queen has seen it fit and in the 'total and enduring interest' of the government to ban the party alongside its Luddite allies in the right-wing Coalition.\n\nAutomation riots and protest have now apparently spread to the farmers and yeomen countryside, threatening a Fifth 'Dalecarlian rebellion' seeking to restore the old ruralist nature of the Swedish nation, with farmers and self-defense organizations already readying for the coming blows."
  sweden.25.a: "Whispers of Rebellion.."

  sweden.26.t: "The Fifth Dalecarlian Rebellion"
  sweden.26.d: "Civilization has always found its beginning in the countryside. Long before cities crowned themselves the arbiters of culture and progress, it was the plough, the shepherd's crook, and the calloused hand that sustained kingdoms. Though peasants bent their backs beneath kings and landlords, paid tribute, and marched to wars not of their own making, it was upon their labor that every throne rested. Whether they knew it or not, every lord was carried upon the shoulders of the yeoman.\n\nFor generations, the Swedish farmer accepted his place not as mere humiliation or matter of circumstance, but as vocation. God had ordained every estate of society, granting to each its own calling and duty. The peasant tilled the soil, the priest tended the soul, the noble defended the realm, and the king ruled in justice. Such was the divine order, and obedience was owed so long as authority itself remained obedient to God.\n\nSo it was during the first, second, third, and fourth Dalecarlian Rebellions. The men of Dalarna did not rise because they despised order; they rose because they believed that order itself had been betrayed. They saw a Crown that had abandoned its sacred obligations, a king who had placed earthly ambition above divine law, and so they took up arms believing they defended not merely their homes, but God's covenant with Sweden. Though they were broken, their sentiment held value.\n\nThat memory has never truly vanished. The Swedish peasant, the crofter, the statare, and every humble laborer asks the same question once more: if God entrusted the mighty with stewardship over His people, by what right do they now cast them aside? Is the yeoman to be discarded for iron engines? Is honest labor to be replaced by soulless mechanisms that neither pray nor reap by the sweat of their brow?\n\nThe struggle before Sweden is therefore greater than one of economics or industry. It is a question of Creation itself. Shall our bread and wine be fashioned by hands made in God's image, or by lifeless contrivances fashioned only in man's imitation of the body of God? For to exalt the machine above the laborer is not merely folly, it is to raise an idol, a copy of a copy, above the work of the Creator Himself."
  sweden.26.a: "They may make Babel once more."

  sweden.30.t: "The Trench"
  sweden.30.d: "It has been 15 days since the ."
  sweden_bills.2.t: "Untimely Un-Demise"
  sweden_bills.2.d: "The Riksdag had already written the obituary of the Suffragettlagen, for weeks, Prime Minister Ernst Trygger’s government had fought to defend the bill, arguing that a modern constitutional monarchy could no longer deny half its population equal standing before the law. But as the day of the vote arrived, the atmosphere inside Parliament was one of resignation rather than hope. The opposition, led by Sven Hedin, appeared united. The reform that had consumed Swedish politics seemed moments away from defeat.\n\nThen the unexpected happened.\n\nAs the final votes were called, a small group of opposition backbenchers rose from their seats. They were members of Hedin’s own Courtyard Faction, politicians who had spent years building influence within the conservative movement, not through a rigid ideology, but through loyalty, connections and the promise of a stronger Sweden. One by one, they broke with the opposition and cast their votes in favour of the bill.\n\nFor a moment, nobody in the chamber understood what had happened.\n\nThen the final tally was announced.\n\n...\n\nIt passed.\n\nGovernment ministers erupted in disbelief. Trygger, who had entered the chamber expecting defeat, found himself surrounded by supporters congratulating him on a victory he had not expected to claim. Outside the Riksdag, suffragette activists who had gathered expecting another disappointment were suddenly celebrating. The cheers of the crowd echoed through Stockholm as women who had spent decades demanding recognition realised that their struggle had finally become reality.\n\nBut behind the celebrations was a far more complicated reality, The Courtyard Faction had not voted out of loyalty to Trygger’s government, nor had its members suddenly embraced the entire programme of the reform movement. Their decision was a message: under Sven Hedin’s leadership, the faction had become less concerned with controlling every aspect of domestic policy and more interested in proving its ability to shape the direction of the Kingdom. By allowing the bill to pass, they had demonstrated that no government could ignore their presence in the Riksdag.\n\nHedin’s opponents accused the Courtyard rebels of turning a historic reform into a political game. The rebels, however, remained tight-lipped about the true reasons behind their revolt, offering no explanation and leaving politicians across the aisle to speculate about their motives rather than receiving any satisfactory answers. Prime Minister Trygger had won the vote, but everyone in the chamber understood the true lesson of the evening, the Suffragettlagen had passed not because the government had defeated its opponents, but because a faction within the opposition had decided that history would move forward on their terms.\n\nThe kingmakers has entered the court, demanding a stronger Sweden in exchange for the free hand of its citizens in their own lives. The country had entered a new age and that Courtyard King Hedin had announced that he intended to decide what that age would look like."
  sweden_bills.2.a: "Had Reform Truly Outflanked Reaction?"
  sweden_bills.14.t: "Trygger's Agenda"
  sweden_bills.14.d: "It was a matter of life or death for the future of the Protektionistiska Partiet. For Trygger, it was his goal to hold the party and the coalition at large from collapsing, and to keep the Courtyard Party from gaining even more ground from the onslaught that came with the failures of the '26 War with Russia. The party had, in general, maneuvered and labeled itself as one of modernity, tilting toward progressive conservatism and reform that could only have passed in the time of Viktoria, and no one else. Trygger himself had prided himself on his capability to work with both the Courtyard Party and the Coalition to bring about a common agenda, especially during the war, and in the national catastrophe that followed, which had swallowed almost the entirety of Trygger's agenda, with refugees and poverty having doubled since the war's end.\n\nBut those days are gone. The rally-around-the-flag maneuvers that had carried the Trygger government from collapse day in and day out have built up an excessive backlog of paperwork and legislation that the Riksdag has yet to address. The Coalition has put a timer on Trygger's head. The Automation Crisis is shaking up the establishment, and the egalitarian and liberal factions of the Coalition are growing increasingly impatient, dissenting over the inclusion of the Krueger-propped Folkpartiet and over the constant swamping of the Suffrage Act in committee. The pressure on Trygger is twofold: to deal with the immediate effects of the crisis, and to push through the final legislation and reforms, before his government and his party must pivot into campaign mode for the coming election, likely the first in ten years without Trygger himself, now old and running out of time."
  sweden_bills.14.a: "On this Earth or in Politics?"

  sweden_bills.15.t: "Trygger's Fall"
  sweden_bills.15.d: "His appointment by the Queen seemed almost comedic at the time. He had to contend with a party outflanked on both flanks — reformists pulling one way, reactionaries the other — yet the choice made a kind of sense given Viktoria's own ambitions: a monarch skeptical of parliamentary politics and hungry to see executive power restored to the Crown, pairing herself with a man wholeheartedly committed to the constitution as it stood, someone who might steady her conservative party even as it drifted toward the center and bled support to a right growing less willing to compromise by the year. A figure like Trygger might have reeled the reformists back in and made peace with the old guard on questions like the military and the nobility. Instead, in trying to hold the middle, he only deepened the animosities already dividing the chamber. The Four Estates system killed bills that mattered to both sides, and in the end simply deferred to whatever Viktoria chose to approve or veto.\n\nTo the reactionaries, it was a system too accommodating to the bourgeoisie and the unions, one that had all but guaranteed their seat at the table and turned partisan abstention into the price of peace. To the reformists, Trygger was defending an order that had smothered every attempt at change — reducing legislation to little more than a referendum for Viktoria to sign or shelve as she pleased, entrenching the nobility and the peasantry while the middle class was squeezed out entirely. He himself came to seem like an emblem of the institution he served: a body too backward to read the winds, too cautious to commit, too unwilling to choose.\n\nIt would be fair to say Trygger will leave the Riksdag, and Swedish politics altogether, as a man born too late — one who, despite every effort to bridge reform and reaction, never rose a rung or fell one, left stranded instead on the landing, with no path down nor up."
  sweden_bills.15.a: "In the matter of Swedish politics, it seemed Trygger was the only one opposed to change."

  sweden_national.2.t: "The Courtyard Party's Courtyard Party"
  sweden_national.2.d: "The Courtyard Party owes much of its roots to its lavish and adventurous ideals of grandeur, most evident in its name and its near-patriarchal leader, Sven Hedin — adventurer and fervent Russophobe in his own right and field of profession. He aims to double down on much of his earlier anti-Russian foreign policy, having been vindicated of his fears of the East in '26, capitalizing on the loss and sense of great betrayal amongst the swedish populace by ardently supporting the Army of Finland and its insurgency against the Russian government.\n\nYet it was not on pure dogma alone that Hedin sought power; he could just as easily have secured himself a near-permanent position as Foreign Minister. But the pragmatic Riksdag, a generally unbothered Swedish populace, and a governmentally “infatuated” Queen Viktoria had no need for war with Russia. He needed an internal political vehicle to ensure his machinations went unimpeded, One he found in the Courtyard Party.\n\nAnd thus the party had to compromise — no longer could it stand near-malnourished in terms of actual internal policy so that the Foreign Office could take the reins of national agenda. A stance had to be taken toward the country's internal affairs, that could enforce and whip into shape the political machine that is the Courtyard Party's tent, lest it become a Foreign Office with a state attached."
  sweden_national.2.a: "Though the notion isn't entirely innacurate..."
  
  sweden_national.3.t: "A Reactionary's Reaction"
  sweden_national.3.d: "Though it was not improper to think of the Courtyard Party as a single-issue political vehicle, this notion would have to change as the stockade they had built around the policy of “Indisputable Right of Revenge against the Bear” gave way to Hedin's carte blanche to appoint whoever he saw fit to run the country's ministries which in turn would be given a carte blache to do as they wish.\n\nAs is the agenda, one advocate closest to a Hedin-friendly Interior Minister could be found in Barthold Lunden — a fervent antisemite and chemical engineer who serves as a testament to the forces of cultural reaction, railing against what he calls “Jacobin sodomy”: homosexuality and those seeking to bypass censorship laws. Brother of Birger Furugård, he's sure to implement a Nordicist and generally reactionary stance against “Anglo cosmopolitanism” and the like. Though this appointment would surely alienate the city folk, it wouldn't be out of character for a party reactionary in both foreign and internal policy."
  sweden_national.3.a: "Yikes!"
  sweden_national.3.b: "Pretty on-brand for a Reactionary."

  sweden_national.4.t: "The Swedish Latinite"
  sweden_national.4.d: "Elmo Lindholm, already requisitioned for the Economic Ministry, is no less a cultural ideologue than an administrator. Having nurtured the Lundarna in its infancy, and shaped in turn by his ideological mentors — Rudolf Kjellén at home, Charles Maurras abroad — he pursues nothing less than a socio-economic remaking of the Swedish nation from the inside out. A nationalist and a traditionalist by temperament, he has set himself to building the ideological bulwark of the movement within two institutions above all: the army and the youth. To that end he has been quietly seeding militant reactionary self-defense circles at Lund University, with an eye to expanding the model nationwide.\n\nLindholm speaks to the alienated and discarded youth of the cities in a way few of his peers in the often noble centric Courtyard Party can manage, even as he works to discipline the Church of Sweden itself, steering it toward a social-Catholic reformation his critics and admirers alike have taken to calling “Lund Conservatism.” Between the two — the barracks and the pulpit — he has assembled the makings of a genuine base for the next generation of young patriotic Reactionare\n\nHe would make an appealing Interior Minister in his own right, straddling a divide few in the party can bridge as he's courted by corporatists among the nobility on one side, and by the movement's more Luddite, anti-automation and agrarian wing on the other, both drawn in by the same body of rhetoric railing against what he brands “Uppsalan moral nihilism and machine civilization.”."
  sweden_national.4.a: "Youth for the Old Ways.."
  sweden_national.4.b: "A perfect choice!"

  sweden_national.5.t: "The Swedish Walden"
  sweden_national.5.d: "An interesting candidate of note is that of Hans Larsson, a humanist and transcendental writer at lund that had gained notoriety for his biography Hemmabyarna, considered amongst the new generation of transcendentalists as the Swedish Walden for its embrace of the simple pleasure and humanity in peasant life amidst the often 'toxic' life that had swept the second renaissance, founding Lund Philosophy as a movement rooted in humanist idealism regarded as Neo-Kantian and empiricist. Larsson as such leans heavily to the agrarian and ruralist folk, a scathing advocate against automation but similarly against anti intellectualism that draws sympathy from both the young noble and agrarian wings of the courtyard party despite his lack of appearances in public politics.\n\nSuch an appointment to the interior ministry may come as a significant boost to the cause of cultural agrarianism, while alleviating the concerns of the democratic center and right of the courtyard party as Larsson holds strong democratic beliefs, digging into the agrarian support base of both the Left and center as an alternative to urbanite elitism and value nihilism of the Uppsala School in a similar fashion to Lindholm without the ultra nationalist baggage."
  sweden_national.5.a: "Perhaps we should circle back..."
  sweden_national.5.b: "A peculiar man of aesthetics!"
  
  sweden.31.t: "Kiruna"
  sweden.31.d: "The choice of city was itself a daring statement: not Stockholm, not Uppsala, but a mining town built on iron ore and foreign capital, a place that existed only on the backs of industrious demand and labour unseen in Stockholm's banks and public works. To hold the convention there was to say, without saying it, that the old geography of power — court, cathedral, capital — no longer described where Sweden's future was being decided. It was a point not lost on either side: much as Manchester and Liverpool had forced Britain's hand a century before, the matter of reform now weighed on the minds of the Coalition just as it once had on the Whigs.\n\nThrough the latter years of the Second Renaissance, Kiruna and towns like it had exploded in population and development. Much of the nation's steel ran through the region, and the great mines lay just past the town's edge — infact, much of Kiruna had been built on works rising straight out of the mine's deepest pits. It was not so different, in its way, from the World City of London, itself a city of levels topped one above the next, though in this case from bottom to surface like it had been built into the ground. where altitude had long since become a kind of class marker in its own right. Its shanties sat deep in the lower pit levels, while the modular suction tubes that once served the whole town had, by then, been repurposed almost entirely for managerial use or simple delivery. To rise in Kiruna, as in London, was still to rise away from the people who built the place — the difference was only which level the foundation and perhaps standard of living had started.\n\nIt was no accident, then, that the left and center of the coalition chose such a place — where the insecurity and precarity of the common man's life might serve, in part, as motivation for their cause, and in some measure as a cruel joke aimed at Trygger's conservatives. For in all the debate over the Four Estates, no one had seriously proposed a fifth: a seat for the factory worker, the mason, the miner — a Riksdag that accounted for the man with no strings attached to land or title. It would not be wrong to say that this, more than anything said in the hall, was the message meant for everyone present, it was Reform, or Revolution."
  sweden.31.a: "Best hope for the former?"
  sweden.32.t: "Trygger's Arrival"
  sweden.32.d: "The delegates who'd chosen Kiruna knew exactly what they were doing. A convention held in a city built on suction tubes and pit-work was not neutral ground; it was an argument made in brick and ore before a single motion was to be read. The absence of a Fifth Estate — no seat for the miner, the smith, the man who fed the steelworks that in turn fed the nation — was not, in itself, a novel grievance. The Four Estates had always excluded him. But to negotiate his fate in the very city built on his labor, under the shadow of the pits that housed him, was to make the omission impossible to ignore, even for men who'd spent careers ignoring it comfortably from Stockholm.\n\nNowhere was this better illustrated than in Trygger's own arrival. He had long been reform's bogeyman, though by then the sentiment belonged more to memory than to the party itself — the Protektionists had left him behind in favor of courting reform a decade prior. He came to Kiruna not to fight for anything, but to see the party off, the way a disapproving father sees off a daughter to a marriage he'd once hoped to prevent, and now could only attend. The party had chosen reform, not him — but it would have been crueler still to refuse her a farewell, to not be present for a change in her life simply because he'd argued against it. It was, perhaps, a sentiment shared by the few of the old conservative faction who remained, the ones who had come to politics alongside him and had not yet all gone. Fewer every year, but not none. Those who understood Trygger read it plainly: here was a man so devoted to his party that he'd let it remake itself into something nearly unrecognizable to him — and love it still, precisely because it was his.\n\nIt should be said, in fairness to those who found him easier to despise than to mourn, that this grace had its limits. one of the mine-town representatives seated, pointedly, in the gallery rather than the floor that he had 'finally stood somewhere the miners could see the fellow' a remark that had struck a chord with Trygger, perhaps reminding some of the person he used to be during the height of his popularity, reported to have said only that the delegate 'mistook a balcony for an apology,' and that he had no need for the pity of workmen or sadists laughing off or rubbing the fact he stole a decade of legislation from them, it was not the suggestion of regret, nor for reform itself, which he had made his peace with, but for the suggestion that his presence in Kiruna was penance rather than simply his attendance. He had come to see his party off. He had not come to be forgiven, and the distinction, to him, seemed to matter more than anyone in the hall was willing to grant it.\n\nAs He receded back to the balcony above the convention floor, growing old in his chair, counting now not the days remaining to him but the shape of whatever he might still leave behind still angry and perhaps contemplating what they had remarked. 'You have shown me the thing the Estates cannot hold,' he is said to have told a reformist delegate. 'You have not shown me what should replace it. That is still yours to build, and mine to no longer stand in the way of.' It read, to those present, as something close to a blessing not ever slightly bordering on enthusiasm, but the closest thing to confidence in the party's future that Trygger had left to give. Whether it was resignation or simple recognition that permission was no longer his to give in the end."
  sweden.32.a: "Farewell to the Swedish Castlereagh!"

  sweden_paskkravallerna.4.t: "Stockholm Police Commisioner Resigns"

  sweden_paskkravallerna.2.t: "Standoff at Lund University"
  sweden_paskkravallerna.2.d: "A situation has developed at Lund university. The university's Jacobin club had entered a standoff with those aligned with neo-Imperialist groups. The Jacobins has citied their right to protest against what they view as a reactionary and despotic ideology. While the Neo-Imperialists claim to be standing their ground in self-defence against 'extremism.` At present, the standoff, while tense, has not resulted in any fatalities and violence has been limited to small clashes. But many fear it's only a matter of time until the standoff turns into a riot.\n\nTo avoid this, we have two choices. The first is to send in the military, they should be able to crackdown on those involved and put an end to this for good. However, many fear a military presence will simply escalate the situaton and lead to further violence. Not to mention how it may be controversial to use force to down political expression. The second is to try and negotiate the surrender of the Jacobins. This, if successful, will ensure no blood is spilled and de-escalate the situation. However, this may simply be kicking the can down the road, many see a violent clash between these two ideologies as inevitable and that it may be better to stop it dead in its tracks. And if negotiations fail, the situation will get worse both for us and those involved. Another factor to consider is the location. Lund university is where Elmo Lindholm first founded the Lundarna, It has major political and social history tied to it, both good and bad. The acts we take will forever be tied to the Lundarna, whether we want them to or not."
  sweden_paskkravallerna.2.a: "Get the Dean to diffuse the situation."
  sweden_paskkravallerna.2.b: "Send in the troops!"
  
  sweden_trade_war.1.t: "Sweden Attempts to Bypass Us!"
  sweden_trade_war.1.d: "As of a few days ago, Stockholm has started the process of reviving a centuries-old law called the Produktplakatet, a law which prohibits the transport of foreign goods to Sweden unless they are transported by either Swedish ships or ships from the country of origin. As one of our key sources of income is that very practice of intermediary trade, this threatens our revenue, just as it did two centuries ago. As such, much of our government and several of our diplomats have urged us to respond with diplomatic objections and threats of tariffs and other regulations against Sweden. A prolonged trade war would be damaging to both their economy and their prestige, after all.\n\nThere lies one issue: the rapidly expanding Swedish merchant fleet. The past few years have seen a marked increase in Swedish merchant ships, and it's believed that such a large and growing fleet will mean whatever we throw at them won't stick, and they can simply make up for anything lost to us. Some leading economists and diplomats are even saying we shouldn't challenge them at all.\n\nThis leaves the decision up to us. Do we snap back and threaten tariffs? Or should we simply let them be?"
  sweden_trade_war.1.a: "Raise diplomatic protests, and throw in a threat of tariffs."
  sweden_trade_war.1.b: "It's not worth fighting over."
  
  sweden_trade_war.2.t: "The Dutch Bend the Knee"
  sweden_trade_war.2.d: "Our expanding merchant fleet seems to have convinced the weak Dutch that challenging the recently-revived Produktplakatet wasn't worth the effort. The Produktplakatet, an old law that prohibits the transport of foreign goods to and within Sweden to only Swedish ships and ships from the country the goods originated, has been threatening to the Dutch with their act as a middleman. It seems it was too risky to challenge, as without so much as an acknowledgement they've let the ordinance do its work freely. This is quite good for us; we expected them to fight back much more, which while we would surely win, but the cost of such a fight has been averted. Now, at long last, Sweden is no longer being scammed by foreign governments acting as unnecessary mediators."
  sweden_trade_war.2.a: "Sweden is free of foreign middlemen!"
  
  sweden_trade_war.3.t: "The Dutch Hold Fast"
  sweden_trade_war.3.d: "The Dutch, in all their arrogance, have responded to the revival of the Produktplakatet with diplomatic objections and threats of increased tariffs. Given one of their primary sources of income is transported goods between countries as a middleman, the law, which prohibits such actions in Sweden, has proven too threatening, and so they have retaliated.\n\nWe are no doubt sure to win this battle, but the question remains of how. The moderates in our government are certain that the Dutch will be willing to negotiate with us to reach an amicable agreement, but the hardliners, as well as the nationalist press and politicians, want us to fight fire with fire by pushing through our own retaliatory tariffs.\n\nEconomists tend to agree that we should seek a diplomatic settlement, but perhaps we could push to keep the terms as they are by keeping up the pressure. It would certainly appease the more hardline nationalists, too."
  sweden_trade_war.3.a: "Try the diplomatic path, arrange a meeting in, say, Doggerland?"
  sweden_trade_war.3.b: "To hell with these Dutchies, hit back with tariffs!"
  
  sweden_trade_war.4.t: "Swedes Seek Diplomacy"
  sweden_trade_war.4.d: "Following our demand that the Swedes repeal their Produktplakatet, we waited with bated breath to see how they would respond. Many believed the Swedes would keep up the pressure, or perhaps push their advantage militarily, but to our surprise their rational side has come out on top and they've offered to hold a conference to turn down the burner and perhaps come to a reasonable conclusion. They've offered to meet in Doggerland, an artificial island in the North Sea that's been under a joint Anglo-Dutch Commission for some time now. The play is smart: meet somewhere not directly on either country's soil, but close to home instead of a foreign country. We'll meet them.\n\nOur foreign office has been drawing up demands in concord with top economists, and our offer to Stockholm is simple. We will allow Sweden to largely maintain their law, but there will be a quota of Dutch ships that are allowed to import goods regardless of origin into Sweden per half year. This way, the Swedes can pat themselves on the back and say they've liberated themselves from enough of our middlemen to be sovereign, while we keep some of the revenue we generate. Not quite win-win, but not lose-lose either. Surely they'll see the value of our offer?"
  sweden_trade_war.4.a: "Tell them our demands."
  
  sweden_trade_war.5.t: "Conference in Doggerland"
  sweden_trade_war.5.d: "Five days ago, the Dutch agreed to the conference in Doggerland. Our diplomats disembarked in Port Hesus the next day, shadowed by a coterie of Livgardet to protect them, and act as a show of strength. A hall was reserved for the diplomats to congregate, and nearly immediately the Dutch made their move. They offered to largely allow us to enforce the Produktplakatet, but in order to ensure the Dutch revenue from their middlemen practices is at least somewhat salvaged, we should allow a relatively small quota of Dutch ships to engage in the practice, but no more.\n\nOur delegation was highly divided. Some were willing to meet the demands, believing the partial fulfillment of the law would be better than a prolonged trade war, but some were insistent that the Dutch fully adhere to our laws; after all, why should the Hague dictate another country's laws? After a day of recess full of arguing and no agreement, the exhausted diplomats have forwarded the proposal directly to the Prime Minister to make the final call."
  sweden_trade_war.5.a: "Fine, take your exemptions."
  sweden_trade_war.5.b: "What a travesty! Leave the conference."
  
  sweden_trade_war.6.t: "Sweden Accepts Our Offer"
  sweden_trade_war.6.d: "After lengthy debate amongst their diplomats and even having to delegate the decision to the Prime Minister, the Swedish diplomats have returned with a begrudging acceptance of our proposal. Dutch ships will be allowed to deliver foreign goods to a degree, after a certain point being turned away. While the Swedish nationalists might be in arms, ours are celebrating a perceived victory, while our diplomats and government breathe a sigh of relief knowing that the worst was avoided."
  sweden_trade_war.6.a: "Let this peace endure between our countries!"
  
  sweden_trade_war.7.t: "Swedes Fight Back"
  sweden_trade_war.7.d: "Despite our modesty, the Swedes have proven hard-headed and have met our threats of tariffs with their own preemptive tariffs. It seems Stockholm is insistent that we submit to their law that will deprive us of revenue. The immediate choice of action is clear, or it seems so: push through the tariffs we threatened with, and if they push more we push back harder. However, a growing sentiment has arisen in our government and among the dovish of our population that perhaps it isn't worth the fight. We can get ourselves out of this mess now and avoid a potentially costly trade war in the long term. It might not save our income, but perhaps it will save our coffers."
  sweden_trade_war.7.a: "How insolent! Push through those tariffs!"
  sweden_trade_war.7.b: "Oh, we should have never have gotten into this mess..."
  
  sweden_trade_war.8.t: "Dutch Capitulation"
  sweden_trade_war.8.d: "It seems the Dutch have finally come to their senses. The Hague has conceded that a trade war with one of their strongest nearby countries is not worth what they'd lose simply complying with us, and they've dropped the tariffs and sent a diplomatic note asking we drop ours and keep to just the Produktplakatet. While a small portion of nationalists want us to press on, our economists have returned worrying reports that a long-term trade war would actually be more detrimental to us than it would be to them. Thus, accepting their surrender is the only choice we really have."
  sweden_trade_war.8.a: "What a welcome surprise!"
  
  sweden_trade_war.9.t: "The Dutch Return the Favor"
  sweden_trade_war.9.d: "Our tariffs to coerce the Dutch into complying with the Produktplakatet seems to have done little to dissuade them from their path, and instead they've met our fire with their own and raised even higher tariff walls. This is an unacceptable move, and the entire government has already agreed that we will not back down. However, the fervor may have been too much, as reports from economists pointing out that a prolonged trade war with the Dutch would be more detrimental to us than to them have been brushed aside.\n\nWithin government, two competing approaches have been raised. One the one hand, we could simply raise more tariffs, try to beat them at their own game and get them to blink first. However, a portion of our government has raised the curious option of simply threatening war. The Swedish Army is much larger, more advanced, and of higher quality than the Dutch Army, and surely the Hague would see this and back down immediately. However, should they stand their ground, the move would backfire greatly since our army is by no means prepared to launch any kind of attack against the Dutch, not to mention Britain or Germany might step in should the situation spiral."
  sweden_trade_war.9.a: "Tell them they'll concede or it's war."
  sweden_trade_war.9.b: "War? No! Just threaten more tariffs!"
  
  sweden_trade_war.10.t: "Swedish Threats"
  sweden_trade_war.10.d: "It was some time after midnight when the ultimatum was delivered to our government. The Swedes, in their endless posturing and saber-rattling, have crossed the line and outright threatened military action. The Swedish Army is by no means a paper tiger: years of fighting Russia has hardened their men and spurred technological innovation, not to mention their augmentation companies being among the best in the world. A war with Sweden could be disastrous. However, some in the government seem to be unphased by the stark demands. They laugh in the face of death and say he's bluffing. Whether we are brave enough to stare him down and say the same, is up to us."
  sweden_trade_war.10.a: "This isn't worth the risk."
  sweden_trade_war.10.b: "Surely they're bluffing! Right?"
  
  sweden_trade_war.11.t: "The Dutch Don't Blink"
  sweden_trade_war.11.d: "When we sent off our ultimatum to the Hague demanding compliance or war, our government prematurely celebrated a sure victory. The Dutch then read our note, and they laughed. They've responded not with a plea for mercy, but with a simple response: "Try us."\n\nThey somehow spotted our bluff and sent it back, making our government a laughing stock and, to an extent, a pariah. Already the Germans have stepped in and proclaimed that any violation of Dutch sovereignty would be met in kind, and the British seem poised to do the same.\n\nFor now, our government has recalled the war threat, and to try to save face will continue economic warfare until the conflict peters out. With our prestige greatly damaged, our economy certain to face turbulence and downturn, and an angrier opposition both left and right, it's clear to everyone within and without Sweden that we've de facto lost this trade war."
  sweden_trade_war.11.a: "What an embarassment."
  
  sweden_trade_war.12.t: "Peace for Our Time"
  sweden_trade_war.12.d: "The Dutch have been thoroughly spooked by the threat of war. Our supremacy on the land, sea, and air, even when not directly exercised, proves to be the best tool of diplomacy once more. While Britain, Germany, and a few other countries have placed diplomatic objections, all are thankful the quarrel didn't escalate. No one is more relieved than our own government; after all, if the Dutch weren't so weak-minded and withstood our threat, we'd be totally embarassed both domestically and abroad. Our prestige remains intact and perhaps even bolstered, even if the dovish of the world are displeased."
  sweden_trade_war.12.a: "Three cheers to our best tool in diplomacy!"
  
  sweden_trade_war.13.t: "The Swedes Push Their Luck"
  sweden_trade_war.13.d: "They threaten our revenue, we threaten tariffs. They respond with tariffs, we push the tariffs even further. Now the only thing to be decided is who suffers more.\n\nEconomists from our nation and others have been very split on the situation. While a few of the more nationalist-minded of our homegrown economists want to push through the trade war which they believe we're sure to win, more doubt a prolonged trade war will be beneficial to either of us, and a number even believe now is the time to cut our losses and comply before the costs outweigh the positives. A deadlock in their conclusion has meant the next step has been passed off to the executive, and thus we must decide here and now, with a foggy future for either decisions, whether to let go of our benefits or risk losing more by pushing the trade war further."
  sweden_trade_war.13.a: "They want a trade war, they'll get a trade war."
  sweden_trade_war.13.b: "Just... let it go."
  
  sweden_trade_war.14.t: "No Rest for the Wicked"
  sweden_trade_war.14.d: "The Dutch have held fast thus far in what many are calling a folly of a trade war, and they will continue to hold fast. Despite the obvious costs this trade war will accrue as it drags on, they refuse to let go of their benefits and are not interested in changing their minds. While this is sure to be a negative for them, what is more worrying is that they will not be the only ones affected. The economists we ignored were right, as trade relations between us and the Netherlands deteriorate and seem to approach oblivion entirely. Dutch businesses are, of their own accord, pulling out of the country en masse and trade with the Netherlands and even several other countries disapproving of our tactics has slumped greatly.\n\nIt seems our cockiness at the beginning of this trade war was foolish indeed. We've managed to get ourselves into a hole we dug ourselves and we're stuck in here for the time being."
  sweden_trade_war.14.a: "Why couldn't they just let it go!?"
  
  sweden_trade_war.15.t: "The Dutch Cave In"
  sweden_trade_war.15.d: "After weeks of disagreements and economic battling with the Netherlands, the fruits of our labour have finally been harvested. Facing certain economic stagnation if not decline should their fight continue, the Dutch have reached out to us seeking to concede to the Produktplakatet in exchange for ceasing the drawn-out trade war between our countries. This is fortunate timing for us, as already we've begun seeing early warning signs of our own economic downturn. Not only have Dutch businesses begun pulling out of Sweden, even some other foreign businesses have, albeit on a much lower scale and many seem to intend on returning once the situation blows over. But it is not right to dwell on what may have been, just was has been, and what has happened is doubtlessly a victory."
  sweden_trade_war.15.a: "At long last!"

  sweden_paskkravallerna.10.t: "The Stockholm Flotilla"
  sweden_paskkravallerna.10.d: "It was still dawn when the watchmen at Vaxholm reported the first silhouettes approaching: graceful and silent through the archipelago. With the pandemonium unfolding in the capital, the intentions of this flotilla soon became unmistakable: flying no recognisable maritime ensign, the flotilla carries volunteer agitators and supplies gathered from Germany and Prussia - at least from what has been deduced by our coastal authorities. Under the guise of humanitarian relief we believe these dissidents bring rifles, ammunition, provisions and radical literature in a foolish crusade to deny Her Majesty's Government the restoration of lawful order in Stockholm.\n\nPrime Minister Hedin remains firm on his stance against the anarchists working against law and order in the kingdom, extending this to the emigres trying to bring their godless ideology to us. We will not allow foreign radicals to dictate the fate of our capital; If allowed to proceed, the flotilla will reinforce the insurrectionists with invaluable manpower and weaponry which we can not allow - lest we make a mockery of Her Majesty's name\n\nTwo immediate options now face Prime Minister Hedin's cabinet. That we instruct our ambassador in Frankfurt to demand a German crackdown against these violent anarchists. Alternatively, we could deploy the navy to halt this impudent expedition ourselves before it reaches Swedish shores."
  sweden_paskkravallerna.10.a: "Demand the Germans step up crackdowns!"
  sweden_paskkravallerna.10.b: "Bombard them!"

  sweden_paskkravallerna.13.t: "The Stockholm Flotilla"
  sweden_paskkravallerna.13.d: "The Swedish embassy in Frankfurt has issued an accusatory communique on behalf of the Hedin government: the Swedes accuse German dissidents as having assembled an armed flotilla, destined for the so-called 'Stockholm Stockade'. These anarchist fools intend to join their comrades in certain death in their futile attempt to undermine law and order in the Swedish capital. While Frankfurt has no love for these radicals, if we fail to act on who are technically German nationals we risk provoking a serious diplomatic incident with our northern neighbour."
  sweden_paskkravallerna.13.a: "Close it down!"
  sweden_autocrisis.1.t: "A Telecompanies' Tordesillas"
  sweden_autocrisis.1.d: "It seems the British and the Americans, in common cause, have not relented in their infiltration of our market — and now they plan their boldest move yet against our home soil. Dolbear-Bell Telecom has entered into back-door talks with our own homegrown LM Ericsson Telecom. Ericsson, for its part, has made steady inroads into Britain's telecommunications market, gaining a modest but real foothold as a household name in New Georgia and in those territories left unclaimed by the American giant Dolbear-Bell.\n\nIt should come as no surprise, then, that the two have arrived at a deal: to consolidate their holdings, monopolize their grip over North America, and cast aside our quality products in favor of their own cheap and lackluster technology. Yet this arrangement is not without its costs to them. In exchange, Ericsson would receive what amounts to a blank cheque across Europe — Britain and a few other regions excepted — but only at the price of abandoning the European market altogether. To some, this may look like a fair trade. To others, mere crumbs beside the wealth and security of the American market. They underestimate our reach in believing this a one-sided bargain... for the truth is rather more complicated than it may first appear."
  sweden_autocrisis.1.a: "A deal so foolish, Goliath will always stand boasting!"
  sweden_autocrisis.1.b: "The fools dont know what they are set to lose."
  sweden_autocrisis.2.t: "Stockholm Draws a Line"
  sweden_autocrisis.3.t: "Dolbear-Bell Will Not Be Denied"
  sweden_autocrisis.4.t: "Terms Across the Atlantic"
  sweden_autocrisis.5.t: "A Handshake in Good Faith"
  sweden_autocrisis.6.t: "America Opens the Purse"
  sweden_autocrisis.7.t: "Philadelphia Slams the Door"
  sweden_autocrisis.8.t: "Weighing Ericsson's Fate"
  sweden_autocrisis.9.t: "Sweden Cries Foul"
  sweden_autocrisis.10.t: "The Price of Approval"
  sweden_autocrisis.11.t: "One Last American Word"
  PBNews.383.d: "Results of the deal between the Telecommunications Companies have finally come, as Ericcson Telecom and Dolbear-Bell Telecom have both agreed to a quote 'Telecom Tordesillas', effectively dividing the spheres of both companies. With america detatching itself from the European Market, and Sweden pivoting to its own periphery. It seems that both companies have finally sought an end to the violent competition over each other's market.\n\n The agreement, cedes Ericcson exclusive rights across the Nordic and Baltic exchanges, while Dolbear-Bell aims for the American Sunbelt and Caribbean concessions."
  PBNews.383.t: "KISTA AGREEMENT"
  PBNews.383.a: "Frightening.."
  PBNews.384.a: "Brillant must be happy"
  PBNews.384.t: "KISTA TALKS FAIL"
  PBNews.384.d: "The much-anticipated Kista Agreement has collapsed before ever reaching signature. After weeks of quiet negotiation in the Stockholm suburb, delegations from Ericcson Telecom and Dolbear-Bell Telecom reportedly walked away from the table over disputes concerning Caribbean switchboard concessions, with neither firm willing to cede ground.\n\n A source close to the talks described the final session as quote two men shouting across a table about wires neither of them has laid yet. Both companies have since issued terse statements insisting the failure lies squarely with the other party."
  sweden.33.t: "Arrival of the Egalitarians"
  sweden.33.d: "In the Heart of Swedish Labour, perhaps the Heart of Sweden itself, the inclusion of her Patron Party was almost guaranteed, and to much grandeur and vigor the Workman and the Miner chanted the name of the Rättighetsförbundet. Though the name may be a source of confusion, a left-adjacent party going by the name of the Right, it tenders its ideals to the rights of man, not the right of the chamber.\n\nThe Party itself is spearheaded by the most ardent supporters of the Workers' cause and the rights of the rightless, from the Suffrage movement to the Distributionists, reaching across the grand left adjacency with a notable following among the Unions.\n\nYet beyond the socio-economic threads bridging the urban and rural left, the party remains dominated by what is called 'Quidingite Orthodoxy,' a Utopian Socialism concerned with the relationship between the individual and the state, and with the notion of Pan-European community. Set against this stands a newer branch, grown out of the modernist left under Pär Lagerkvist: an atheist, a modernist, an aesthetic radical, who has built his standing on questioning the establishment, even under the Civic Coalition, demanding unbowed social change and pushing Egalitarianism far into Bohemianism, in what he calls an 'awoke' movement.\n\nWhichever tide the Right League rides next, it may well be unwilling to repeat the mistakes that brought down the Civic Coalition."
  sweden.35.t: "Sweden's Lord Grey"
  sweden.36.t: "The Centre's New Clothes"
  
  sweden.37.t: "Condemnation of the Tygger Government"
