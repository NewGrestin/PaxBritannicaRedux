  SWE_paskkravallerna: "Påskkravallerna"
  SWE_paskkravallerna_desc: "\nRevolution has once more attempted to bruise and batter the Kingdom. The main republican organs — the §sLunds Jacobinklubb§!, §jVasajakobiner§!, and §RVacklande§! — as well as other minor unions and opposition groups, have formed an unprecedented front of treacherous Jacobin terror against the election of our government, pressuring even the Queen and the Army into potentially compromising our cabinet to appease the centre.\n\nShould we prove unable to protect the government from this coming revolution, Sweden will surely be subject to a coalition and subsequent partition amongst our neighbors, to contain the Jacobin threat at the cost of our sovereignty!\n\n§RRepublikansk§!\n£GFX_pol_violence Escalation : §Y[?SWE_revolt_escalation]§!\n£GFX_industry_texticon  Resources : §Y[?SWE_revolt_resources]§!\n£GFX_legitimacy Legitimacy: §Y[?SWE_revolt_legitimacy]\n\n§!"
  SWE_sweden_stockade: "£political_violence_texticon Stockholm Stockade"
  
