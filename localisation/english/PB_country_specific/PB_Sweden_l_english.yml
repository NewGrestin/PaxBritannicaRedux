  sweden_paskkravallerna.7.t: "Massacre at Lund"
  sweden_paskkravallerna.7.d: "The army was given the simple order to restore order to Lund University, but what was supposed to be a straightforward public order response snowballed into turmoil. One of the oldest and most prestigious educational institutions in Europe, the university in Lund had for weeks been occupied by radical students. The Life Guards and their mounted detail was supported by the Royal Military Police's canines and few duopods in establishing a perimeter around the campus, a show of force geared to intimidate the radical anarchists and any sympathisers watching on as the event was telescreened across the kingdom.\n\nBoth sides grew agitated as the standoff continued through the night, and it took one provocateur to destroy all calm when shots were heard ringing out from the direction of the university's observatory. Our soldiers did not hesitate, and once the firing began on both sides it did not stop. All tele-broacasting was quickly shut down by authorities and by sunrise the campus had lost all contact with the outside as the military forcefully occupied the remainder of the buildings.\n\nBoth sides grew agitated as the standoff continued through the night, and it took one provocateur to destroy all calm when shots were heard ringing out from the direction of the university's observatory. Our soldiers did not hesitate, and once the firing began on both sides it did not stop. All tele-broacasting was quickly shut down by authorities and by sunrise the campus had lost all contact with the outside as the military forcefully occupied the remainder of the buildings."
  sweden_paskkravallerna.7.a: "No Way to Prevent This."
  
  sweden_national.11.t: "Under Gustav's Eyes"
  sweden_national.11.d: "Few lights remain on at this hour in Stockholm. With icy winds comes snowfall, blanketing the dormant gears that, by day, fuel the Riksdag's complex machinery. This night, Prime Minister Hedin and a few of his aids were the only ones left in the Riksdag's wide, opulent halls. Down the hall, an aid to the Prime Minister strides down the opulent halls, stacks of paper clutched to his chest with one and a steaming cup of coffee in his other hand, destined to keep Sven Hedin awake for a few more hours. As the aide sharply flicks down the hall, the wisping coffee wafts past the eyes of a painting of Gustav III, he who brought the Swedish to their greatest victory in modern history, he who pacified the Russian Bear and seized Karelia, snatching centuries of success from the precipice of failure not just from without, but within. Historians today have the benefit of hindsight, but in the first years of the War of 1788 it was unknown whether the Three Crowns would ever fly over Lake Onega. In those days those who were doubtful, who had weak wills, or Russophilic tendencies skittered into the arms of the traitorous Anjala League. They -- with their vile Liikkala Note -- threatened to upend the coming victory and bend our nation over the Tsar's knee. It is a miracle, and a testament to our King's wisdom, that such a conspiracy was bested and our place in the sun was seized.\n\nSuch a conspiracy, Hedin believes, exists again today. Upon his desk are stacks upon stacks of Swedish Russophiles, Russian expatriates, and oft-maligned refugees from the high walls of Stockholm to the thick forests of Norrbotten. For hours, Sven Hedin briskly reviewed what felt like thousands, striking each to be filed for the Munckska to \"process\" by any means necessary -- either by deportation or by more colorful means.\n\nWomen like Elsa Celsing, a portraitist living in Västerås but who was born and taught in St. Petersburg; men like Fyodor Lidval, an architect whose Russian first name betrayed a long life living in the shadow of the Winter Palace; Russian Jacobins whose loyalties -- like Georgy Pyatakov -- were now called into question; and composers like Simon Barer whose symphonies brought an unwelcome Ruthenian sound to the great Swedish culture. Officers of the army with Russian parents or Russian training or something as simple as a Russian wife were called into question, and many were deported by a mere slash of ink.\n\nThe door creaks, and Hedin's aid strides into the room, wordlessly. With a thump, the aid brought in one final stack and another cup of coffee for the Prime Minister to drink while he perused the next pile. The previous piles had been fairly simple, but this one caught his eye -- at the very top of the list was a single name: Ernst Linder."
  sweden_national.11.a: "What do you have to hide, General?"

  sweden_national.19.t: "Never Another Anjala"
  sweden_national.19.d: "Born in the village of Pojo, in the Nyland landskap of Finland on April 25th, 1868, General Ernst Linder is an accomplished Fennoswedish equestrian and officer of the Army, a veteran of the Third Northern War, and partly responsible for the wide success of the Swedish pansars. His history among the cavalry has translated surprisingly well to the advent of landship warfare, and Ernst Linder is at its forefront. In all, Linder appears to be a Swedish patriot, especially invested in the cause of the Army of Finland and the struggle against the Russian Military Administration that has seized half of Sweden's rightful land.\n\nHowever, recent reports gathered by the Munckskas tell a different story. General Linder's Fennoswedish lineage is a source of great personal pride, and beneath the memory of the First National Awakening, it could very well be a threat to the nation. Agents of the Munck Corps have shadowed Linder into cultural groups with the aborted cause of Finnish Independence. Rather than return Finland to the Swedish sphere as an integrated part of the Empire, the Munckskas believe General Linder wishes for an independent and sovereign Finland, apart from both Russia or Sweden.\n\nThose in support of Linder's removal cite the Anjala League of 1788, the cabal of military officers and government officials responsible for almost destroying Sweden's chances of ever growing its empire -- and see Linder's support of Finnish independence as practically giving the Russians free reign to walk into Finland and seize it for themselves. Alternatively, those who believe Linder should say argue that the idea of \"Finnish independence\" hinges on the idea of a separate Finnish culture that, evidently, doesn't exist. Swedish integration of Finland has been highly successful, and Linder's attraction to Finnish sovereignty may not have a leg to stand on.\n\nAnd now, it is Sven Hedin's duty to decide what to be done of this argument. Caffeine runs through Prime Minister Hedin's veins, and the fountain pen rests in his hand. By the strike of his pen, what will be General Linder's fate?"
  sweden_national.19.a: "\"Finnish culture,\" HAH! Linden will stay."
  sweden_national.19.b: "And give the Russians half of our empire?! Linden must go!"

  sweden_bills.7.t: "A Rose By Every Woman's Name"
  sweden_bills.7.d: "The Four Estate's squabbling over the Suffragetlagen grows more complicated by the day. The Riksdag's Ledamöter each spend hours arguing their cases before their fellow parliament members, and the more hours they waste arguing over the particulars, the more the movement becomes galvanized into greater action and agitation. Each passing hour, the Suffragettes demand more, and today was an example of the goalpost shifting.\n\nIn a rousing speech in Stockholm's Stortorget by a high-ranking LKPR member -- a lawyer, teacher, and activist by the name of Christina Mathilda Staël von Holstein -- the LKPR have begun to demand not just the Women's Vote like they had initially demanded, but complete and total women's equality: complete equal participation in public and private life, the ability for women to hold public office, to hold high positions in Swedish corporations, and more.\n\nNaturally, the Riksdag is divided between the Civic Coalition's left flank, which argues for, and the right flank which argues against. The left flank insists that women's civic equality is no major step, and refusal of such would be simply delaying the inevitable -- to their eyes, women would gain their rights eventually, and it would be only a matter of time. In predictable fashion, however, the rightward Protectionists remain cautious of giving too much too fast. The Courtyardists especially rail against this insinuation, citing \"scientific proof\" of a woman's inability to remain stable in the face of the true \"pressures of public office,\" and have repeatedly fillibustered the issue, wasting more and more time. It is clear, now, that the executive must step in.\n\nThe issue falls into the lap of Prime Minister Trygger who, rightward-facing himself, could greatly influence the decision of the Coalition to one side or the other. All it takes is a few words of support in their direction, and the Coalition will surely bend."
  sweden_bills.7.a: "Consider it done."
  sweden_bills.7.b: "Ladies, ladies! calm down!"

  sweden_national.15.t: "The Falun Speech"
  sweden_national.15.d: "Following a recent reshuffling of the Swedish Army's junior officer corps, Prime Minister Hedin personally appeared at the Dalarna Regiment's barracks in Falun to inspect what is one of Her Majesty's most prestigious infantry units. While being shown through the officers mess hall with his entourage by the barrack's aide-de-camp, the Prime Minister saw the opportunity to remind the suite of the dangers facing the nation. Speaking of both traitors both internal and external, though mainly the former, the Prime Minister passionate voiced his scorn for his ideological opposition within the kingdom. That disloyal officers, political agitators, and those who placed their dogmatic partisan interests before their loyalty to the crown should be dealt with before they threaten the state. Despite dull nods and awkward applause from the Prime Minister's surrounds, certain senior officers have privately voiced their concern for the introduction of divisive ideological narrative to Sweden's military.\n\nFollowing the disclosure of this tirade to the press, concern has been stirred in the Riksdag and amid the general population."
  sweden_national.15.a: "The Prime Minister speaks the truth."
  sweden_national.15.b: "This rhetoric has no place in our Army."

  sweden_national.12.t: "The Spirit of Gebhard von Blücher"
  sweden_national.12.d: "Though the cryptojacobins of the opposition may refuse to admit it, Sweden's long, storied relationship with the German Völk is fact. Though our churches may be different, we both bare a lineage that stands as a bulwark against Latin aggression and Russian barbarism. Above all odds, the Germanic crowns stand in defiance against a world that seeks to destroy it.\n\nNowhere is this history of bravery and courage more evident than in Generalfeldmarschall Gebhard Leberecht von Blücher, who Swedish High Command have increasingly memorialized in their push to \"Germanize\" the military. Generalfeldmarschall von Blücher, a German from Rostock, represents one of the purest spirits of gallant militarism, an idea thought long-dead in the modern day.\n\nFirst a Swedish hussar during the Pomeranian War against Prussia, he defected to the Royal Prussian Army as a hussar officer and took part in the First Franco-German War in 1795 alongside the Holy Roman Empire's Reichsarmee. Though the Reichsarmee and the Preußische Armee failed against the Franco-Dutch Coalition, Gebhard von Blücher was individually a very effective cavalier on the battlefield. Swedish historians and military scholars -- revisionist or otherwise -- laud Gebhard von Blücher as a confident, charismatic, and bull-like man on the battlefield and in his personal life, and one of the last elements of \"German chivalry\" before the Second Renaissance swept those days away.\n\nMilitary scholars especially laud his efforts during the Battle of Leipzig, when von Blücher successfully lead the Prussian Hussars through incessant, destructive cavalry charges, breaking the French Royal Army's attempts to push past the Rhine and even earn Prussia ground against the Franco-Dutch coalition. Von Blücher's smashing success earned him the nickname, \"Marschall Vorwärts:\" Marshall Forward. The combination of von Blücher's chivalry, bravado, and aggressive ability to defend the Fatherland stuck with the German consciousness even after the Franco-Dutch victory, and Sweden and Germany's shared history of Blücher's legacy ties the nations together, even if his contributions to Sweden were fairly minor.\n\nBut the spirit of Gebhard von Blücher and his actions in support of Sweden or Germany are not worth the argument; Sweden knows that -- in order to survive the gathering storm -- the Germanic realms must stick together, and if puff stories about long-dead, gallant men are what excites the officers of the day, then High Command is happy to foster those dreams of chivalry.\n\nImmer vorwärts, aber langsam."
  sweden_national.12.a: "Immer vorwärts, aber langsam."
  
  sweden_flavor.21.t:"Kallocain"
  sweden_flavor.21.d: "Can hope exist in a city built entirely on suspicion? Of course it can. Suspicion is no more the opposite of trust than it is trust's proof. Where else could a citizen be so certain of his neighbor's heart, if not where every heart lay open to inspection? It would be strange, even shameful, to conspire, to conceal, to let a single word go unweighed and perhaps further, concoct spite or deception? When a society of true cooperation demanded nothing less than total transparency between one soul and another. What was there to fear in being known completely, except the guilt of a man who had something left to hide? No, it was not merely natural but destined that such a society should arrive — one in which deceit, whether meant or by complete accident, simply ceased to be possible.\n\nHector was strapped to the chair. His parents sat at the table to the side, and more than a dozen medical personnel moved around him with such clean, orderly precision that you might have mistaken them for parts of the same machine, indistinguishable from the polished shoes upward.\n\n\"Please, Pappa, I don't like this. It's not funny anymore,\" Hector cried out — the way a toddler cries when a parent's joke has gone on too long. But Hector was fourteen, and his parents sat stock-still, their only concern that his tantrum might interfere with the operation.\n\n\"Now, now, little one,\" the doctor said, \"there is nothing to hide. Just a bit of this, you see, and it will all be fine. You won't need to hide yourself from us — we'll be able to read what's on your lips before you say it, and see to it your every need.\"\n\n\"There's nothing in you that needs hiding, and nothing that you don't want to be, is there? Not if you're the boy you say you are. No more lies, no more distrust between us, I assure of it. I'm sure Mamma and Pappa will be proud to see how pure their young man's heart really is.\"\n\nAfter a few hours under, Hector was to be let go and presented with his parents in the other room. No longer would this child be constrained by a sin of his own creation and conviction.\n\nThen Hector spoke, though his mouth felt no longer his own. \"Why,\" he said, looking at his father. \"Father, why are you so cruel, you beat me at home, and you sleep with the daughter of Mister Rissen.\"\n\nHis father did not move. For the first time, it was he who seemed strapped to something.\n\nAnd so it was recorded, as it was recorded for every child upon his fourteenth year: a heart examined, and found, as all hearts eventually were, to be exactly as complicated and unclean as any other. This was not cause for alarm, of course. For what greater comfort could there be, in a world so easily deceived, than to finally have nothing left to prove?"
  sweden_flavor.21.a:"Nothing to be ashamed of."

  sweden_flavor.22.t: "Svenssons Department Chains Open in Småland"
  sweden_flavor.22.d: "Svenssons is a Swedish Furniture chain opened in 1898. Offering a wide assortment of goods; tables, beds, bookshelves, chairs, you name it!\n\nSvenssons has been offering a wide variety of furniture and services all over Scandinavia, and even numerous locations in non-Nordic countries.\n\nRecently, however, the corporation has announced a widescale construction project creating several department stores and superstores all over Sweden; presenting very large shopping centers where customers can peruse and shop at their own discretion; able to pick and choose from an insurmountable amount of furniture options at their disposal. The Svenssons corporation has even gone so far as to take another step forward, and has also opened many delis and small customer food courts that offer a series of Swedish based cuisine; a fan favorite of which has been Swedish Meatballs.\n\nCuriously, however, a department chain in Malmö has been quarantined following several missing persons reports, where several people have entered the complex and never came back out. A detachment of Swedish Home Guards have taken initiative to quarantine the area in order to ensure that no one else enters the super complex. Svenssons has refused to comment on the matter — worrying about bad PR. Some inside jokes have been reported from Malmö citizens, attempting to make light of the situation, saying that the people simply got lost in the massive, metaphorically infinite, complex."
  sweden_flavor.22.a: "Perhaps they'll open one in the United Commonwealth?"