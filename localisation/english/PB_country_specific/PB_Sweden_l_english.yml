  SWE_korvlinjen: "Korvlinjen"
  SWE_korvlinjen_desc: "A ring of privately-funded defensive works raised around Stockholm at the turn of the century, financed in part by patriotic donors through the Palmqvist Fund. Though modest compared to the state's own fortifications, the Korvlinjen still forms an inner screen of redoubts guarding the capital's landward approaches."
  SWE_havsbandslinjen: "Havsbandslinjen"
  SWE_havsbandslinjen_desc: "The outermost ring of Stockholm's archipelago defenses, pushed all the way to the open sea from Söderarm in the north to Landsort in the south. With the increasingly unstable state of European affairs, the General Staff has judged the old inner lines insufficient and ordered the archipelago's defense extended to meet any hostile fleet before it ever reaches the inner skerries."
  SWE_skanelinjen: "Skånelinjen"
  SWE_skanelinjen_desc: "A chain of field fortifications and strongpoints drawn across the flat, exposed farmland of Skåne, Sweden's most vulnerable frontier to a landing from the south. Bunkers, anti-tank obstacles, and artillery positions have been sited to turn the province's open ground into a costly crossing for any invader who reaches Swedish soil."
  SWE_boden_fortress: "Boden Fortress"
  SWE_boden_fortress_desc: "A ring of armored rock forts guarding the approaches to Norrbotten and the vital northern railway to the iron ore fields, built at the turn of the century when Russia was still seen as the principal threat. Its turreted batteries and garrison works have been kept in repair and quietly modernized as the fortress remains Sweden's anchor in the north."
  SWE_karlsborg_fortress: "Karlsborg Fortress"
  SWE_karlsborg_fortress_desc: "Sweden's old reserve capital, raised on the shores of Lake Vättern after the loss of Finland to serve as a last refuge for the Crown, the Riksdag, and the national treasury should the coast ever fall. Its immense ramparts, some of the longest fortifications in Europe, have long since been stripped of most of their guns, but the fortress endures as a monument to an older idea of defense."
  SWE_alvsborg_fortress: "Älvsborg Fortress"
  SWE_alvsborg_fortress_desc: "Sited at the mouth of the Göta älv, this fortress stands guard over Gothenburg, Sweden's principal western port and its window to the North Sea. Its batteries are tasked with denying any hostile fleet passage up the river to the city and its shipyards."

