  PB_SWE_Not_Flickering: "A Flickering Democracy"
  PB_SWE_Not_Flickering_desc: "\n\n£GFX_TT_SWE_Not_Flickering\n\n\n\nAfter losing the §OThird Northern War§! in 1927, Swedish democracy entered a limbo that has lasted since the ink dried in Saint Petersburg. The Riksdag has entered a state of gridlock that multiple elections have failed to fix, with last year’s elections resulting in yet another hung parliament. The Swedish people, as a result of such a state of affairs, grow angrier and more radicalized as each day goes by. \n\nIt will take something §Ydrastic§! to save democracy in Sweden or else Scandinavia’s longest-standing democracy will §Rdescend into the abyss and be lost like so many others have in recent years.§!"
  PB_SWE_Gustavian_Legacy: "Legacy of the Gustavian Era"
  PB_SWE_Gustavian_Legacy_desc: "\n\n£GFX_TT_SWE_Gustavian_Legacy\n\n\n\nSweden continues to be hit with hardship after hardship, and while recent history has not been kind to the small nation, its people find pride in the prosperity that the Gustavians brought with them.\n\nSweden's decline, having begun with its tragic defeat in the Great Northern War in 1721 was brought to a reverse by Gustav III’s reign, beginning in 1772. He not only put an end to the corruption and decadence that had begun seeping into the country, but managed to humiliate the Russian bear, sinking its fleet and reclaiming Karelia. \nThis would only be the beginning of his success, as he’d dedicate the rest of his reign fighting for the common man — launching a crusade to rid the nation of its oppressive Aristocracy. In the Union and Securities act of 1789, the four estates' representation would be equalised, the government would be opened for all people, noble land would be purchasable by non-nobles and the power of the monarch would be heavily increased. \n\nHis descendants would continue to carry out his legacy of enlightened despotism and reformism. Gustav IV’s reign would oversee rapid agricultural growth, colonial expansion and the Finnish realm being put on par with the Swedish one. \nHis son, Gustav V would oversee major governmental reform, abolishing the estates system of the Riksdag, kickstarting urbanization and industrialization in Sweden along with democratization, seeing a steady rise in quality of life and birth rates. \nSweden’s position as a major power had been restored and it would have remained one were it not for the Romanov betrayal, enslaving our brothers in the East. \n\nWhile the future of our country lies in uncertainty, the prosperity and hope the Gustavians brought to this nation will not be forgotten by its people."
