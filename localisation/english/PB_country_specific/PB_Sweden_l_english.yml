  PB_SWE_Swedish_Coglomerates_Very_Dissatisfied: "$PB_SWE_Swedish_Coglomerates_$"
  PB_SWE_Swedish_Coglomerates_Very_Dissatisfied_desc: "Affärsimperiumen, also known as the Augmentation Cartels, are seven massive conglomerates that have grown to such a scale since the beginning of the Second Renaissance. These seven conglomerates are Bofors, Boliden AB, LKAB, Epiroc, Uddeholms AB, ESAB, and Kreuger & Toll. As it stands, they make up a lion's share of Sweden's economy and, as such, have considerable influence in the government. \n\nThe Affärsimperiums approval of the government is currently §RAbyssmal§!"

