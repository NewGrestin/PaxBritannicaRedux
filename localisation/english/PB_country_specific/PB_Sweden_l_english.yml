  SWE_folkh_shorter_workweek: "Trial the Eight-Hour Workday"
  SWE_folkh_shorter_workweek_desc: "Rather than allow Automation to put a man out of a job, the State will introduce a shortened workday, allowing labour to be spread across the workforce as automation pays for the loss of capital and raw output"
  SWE_folkh_wage_earner_funds: "Establish Wage-Earner Funds"
  SWE_folkh_wage_earner_funds_desc: "Following the Meidner model, a levy on excess corporate profits will be paid in shares rather than cash, building collective worker ownership of Swedish industry over time. Capital owners will resist fiercely, but the working class stands to gain a lasting stake in the means of production itself."


  SWE_paskkravallerna: "Påskkravallerna"
  SWE_paskkravallerna_desc: "\nRevolution has once more attempted to bruise and batter the Kingdom. The main republican organs — the §sLunds Jacobinklubb§!, §jVasajakobiner§!, and §RVacklande§! — as well as other minor unions and opposition groups, have formed an unprecedented front of treacherous Jacobin terror against the election of our government, pressuring even the Queen and the Army into potentially compromising our cabinet to appease the centre.\n\nShould we prove unable to protect the government from this coming revolution, Sweden will surely be subject to a coalition and subsequent partition amongst our neighbors, to contain the Jacobin threat at the cost of our sovereignty!\n\n§RRepublikansk§!\n£GFX_pol_violence Escalation : §Y[?SWE_revolt_escalation]§!\n£GFX_industry_texticon  Resources : §Y[?SWE_revolt_resources]§!\n£GFX_legitimacy Legitimacy: §Y[?SWE_revolt_legitimacy]\n\n§!"
  SWE_sweden_stockade: "£political_violence_texticon Stockholm Stockade"
  
  SWE_courtyard_camarilla: "The Courtyard Camarilla"
  SWE_courtyard_camarilla_desc:0 "The §eCourtyard Party§! as a party had normatively served purely to empower §YSven Hedin§!'s direction for the national government — a vast coalition of right-wing and authoritarian-leaning factions who agree on little and argue for as little. the §nLund Conservatives§! clinging to their ideal for the new society and state, the bitter §cProtectionist Party defectors§! nursing old grudges and loyalties, the §dNobility§! guarding what remains of their privilege, the §GLuddites§! railing against the machine society of the coming age, and the fervent §6Transcendentalists§! dreaming of idealist nostalgia.\n\nHolding this arrangement together is not optional nor is it preferable, Yet if left unattended, these factions will tear at each other before any enemy of the state gets the chance.\n\nAnd above them all sits §YQueen Viktoria§!, who lent her name to this government though hesistantly. Conservative by trade, she remains fiercely protective of her royal prerogative and of the democratic institutions she has presided over for so long. And while She does not object to the Courtyard's politics necessarily, those closest to §YSven Hedin§!'s ministry would understand the danger plainly: give the Crown reason to believe her vision for democracy is being undermined, and she will not hesitate to move against the very government she allowed to form."

  SWE_debug_trigger_state_mission: "£political_violence_texticon Republikansk Activity Escalates"
  SWE_debug_trigger_state_mission_desc: "The §sLunds Jacobinklubb§!, §jVasajakobiner§!, and §RVacklande§! have all formed a United Front in opposition to the Hedin Government and have begun active campaigns of violence seeking to topple our Government!"
