  PB_SWE_election_category: "The Cossack Election"
  PB_SWE_election_category_desc: "The §YAutomation Crisis§! has arrived in Sweden, and already Ernst Trygger and his government have been pressured to take the crisis by its reins and recover from it as quickly as possible. Unfortunately, such desires have been largely gated by an impasse in the Riksdag, which has prevented any bills from being passed without approval by the §gNational coalition§! opposition. This deadlock has led to ongoing negotiations with the §B'Citizens' coalition§! of Trygger and his allies against §gNational coalition§!. This window will showcase the effects of negotiations to come, and it will conclude if the Kirunaavtalet agreement comes to pass.\n\nKeeping the §Bcoalition policy support§! equal to or less than the §gconcessions we make to the opposition§! will ensure that the §gNational Coalition§! will be satisfied enough to let our bill pass. However, prioritising our own agenda to appease §lCoalition Partners§! and keep §Bcoalition policy support§! above 0 is crucial to prevent the coalition from collapsing.\n\nOur £pop §BCoalition's Support§! is: §Y[?SWE_cabinet_policy_support]§!\n\nThe level of £decision_influence_small  §gOpposition Concessions§! is: §Y[?SWE_opposition_concessions]§!"
  
