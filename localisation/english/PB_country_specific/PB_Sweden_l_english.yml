  SWE_cn_party:0 "PP"
  SWE_cn_party_long:0 "Protektionistiska Partiet\n§gThe §cProtektionistiska Partiet§!§g (§!§cProtectionist Party§!§g)\n Founded in §Y1888§!, initially drawing its base from the §YChamber of the Nobility§!, the §cProtectionist Party§! campaigned on a policy of tariff-friendliness in the decades prior to the Great War. It remained dominant in politics through the reign of §CFredrik II§!, a king who played only a minor role politically, allowing the party to continue setting the day-to-day agenda throughout the Great War and into the §YSecond Great Northern War§! under the leadership of party chairman §CErnst Trygger§!. Trygger charted a careful and pragmatic course, balancing support between §ereactionaries§! and §lliberals§! through crisis after crisis, and established a grand §CCivic Coalition§! among the moderate to left-leaning parties to support the government throughout the war while keeping the reactionaries close enough to manage but out of power outright — Trygger himself proving able to bring both sides of the table to compromise over the extent of the war.\n\nOver time, however, the Protectionist Party — having been dislodged from power after a period of cooperation with §lLiberal§! and §sRadical Egalitarian§! parties — experienced a stark shift toward the center, championed by those seeking calm and progressive reform in light of a decaying political system in §CArvid Lindman§! and condemned by the party's Finnish elements under §CPehr Evind Svinhufvud§! having been abandoned by the Trygger Cabinet in the war. The party now heads toward an election that will test its ability to escape its foundationless position, as Trygger leaves politics indefinitely in his old age.\n\n§WCurrent Faction Leader:§! §YErnst Trygger§!" 
  SWE_ss_party:0 "R"
  SWE_ss_party_long:0 "Rättighetsförbundet"
  SWE_jc_party:0 "SJS"
  SWE_jc_party_long:0 "Svenska Jakobinska Samlingen"
  SWE_rc_party:0 "B"
  SWE_rc_party_long:0 "Borggårdspartiet\n§gThe §eBorggårdspartiet§!§g (§!§eCourtyard Party§!§g)\nis the principal political vehicle for the dissident Right within the Riksdag. It was founded in 1905 by the Swedish explorer and nobleman §CSven Hedin§! and the late ideological forefather §CJohan Rudolf Kjellén§! as a primarily anti-Russian and corporatist political movement, one that voiced political support for Prussia during the §YFirst National Awakening§! and campaigned for the acquisition of Swedish coastal defense ships and expansion of military and economic security. From its founding, the party has pursued militarist and revanchist agitation through both public agitation and private co-ersion, drawing much of its early leadership from anti-parliamentary conservatives and nobility positioned to the right of the §BProtektionistiska Partiet§! which drifted to the center since the Trygger Cabinet.\n\nOver time, the §lBorggårdspartiet§! has cultivated a populist and nationalistic rhetoric that resonates strongly with its agrarian base of peasants and landholders. Of which this constituency has increasingly embraced a §lLuddite§! hostility toward what it perceives as §6Second Renaissance Liberalism§!— a movement it accuses of stripping the countryside of its traditional importance and culture in favor of an anti-individualistic, corporatist liberal elite. Much of this rural base remains uneducated and holds strongly fundamentalist, religiously inflected political convictions, viewing the traditional order of the estates as essential to Swedish social cohesion. with the death of Kjellen in 1922, the party has devolved in terms of domestic policy and has mostly secluded itself into what many critics call a §Y'Foreign-Office with a Party'§! as it's tent grew to encapsulate agrarian and dissident groups while the party itself refused to take a specific stance beyond foreign-policy.§!\n\n§WCurrent Faction Leader:§! §YSven Hedin§!"
  SWE_ni_party:0 "B - L"
  SWE_ni_party_long:0 "Borggårdspartiet - Lundensarna\n§gThe §eBorggårdspartiet - §nLundensarna§!§!§g (§!§eCourtyard Party - §nLund Faction§!§!§g)\n The Lund Faction encapsulates the political ideology of \"§nLund Conservatism§!\", founded by §CElmo Lindholm§! in his time at the §YKatedral Gymnasium§!, developing out of debates with right-wing students, the movement takes much of its ideological and socio-cultural aspects from Charles Maurras and promotes a social-catholicization of the Church in Sweden, adopting catholic traditionalism and values without joining the Catholic Church outright. Its adherents style themselves a younger, harder right, scornful of the compromise and consensus-politics of their elders, and rally around the old cry of §Ythrone, altar, and sword§!. They hold democracy to be a corrosive force that rewards mediocrity over merit, see the nation as a single living body rather than a compact of free individuals, and regard the crown and the Church as the last stable pillars of a society they believe has drifted into decadence. The party looks admiringly abroad at strongmen who have tamed unruly parliaments by force of will, and at home directs its sharpest scorn at liberal and left-wing students and politicians, whom it accuses of conspiring against the nation's true interests. On economic matters it draws heavily on §CRudolf Kjellén§!, treating the state itself as a living organism whose health depends not on the free play of markets but on its self-sufficiency and strength relative to other powers; the party accordingly favours a tightly organized, autarkic national economy, guided by the state and orderly corporate bodies rather than left to individual profit-seeking or class conflict.\n\nLindholm's relationship with the party's aging founder §CSven Hedin§! is one of uneasy reverence. The Lundensarna venerate Hedin as a living monument — the explorer-statesman who gave the §lBorggårdspartiet§! its footing under both Hedin and Kjellen's leadership at the time — but chafe against his old-guard foreign policy, with the party subject to Hedin's strict hold on the Foreign-Office and a Carte-Blanche in the Interior ministry to those in the party. Lindholm and his circle regard this restraint as itself a relic of the compromise-politics they despise, and argue openly for closer ties to Paris, arguing against the day-dreaming and bygone foreign policy attatched to the order established by the victors of the Great War may only serve to partition it between Russia, Britain, and Germany. Hedin, for his part, tolerates the Lund Faction as a useful engine of youthful energy and uncompromising conviction, so long as it does not presume to speak in his name on matters of state beyond the party's own walls.§!\n\n§WCurrent Faction Leader:§! §YElmo Lindholm§!"
