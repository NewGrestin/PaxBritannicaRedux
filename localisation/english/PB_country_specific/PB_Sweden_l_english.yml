  SWE_rc_party:0 "B"
  SWE_rc_party_long:0 "Borggårdspartiet\n§gThe §lBorggårdspartiet§!§g (§!§lCourtyard Party§!§g)\nis the principal political vehicle for the dissident Right within the Riksdag. It was founded in 1905 by the Swedish explorer and nobleman §CSven Hedin§! as a primarily anti-Russian movement, one that voiced political support for Prussia during the §YFirst National Awakening§! and campaigned for the acquisition of Swedish coastal defense ships. From its founding, the party has pursued militarist and revanchist agitation through both public agitation and private co-ersion, drawing much of its early leadership from anti-parliamentary conservatives and nobility positioned to the right of the §BProtektionistiska Partiet§! which drifted to the center since its founding.\n\nOver time, the §lBorggårdspartiet§! has cultivated a populist and nationalistic rhetoric that resonates strongly with its agrarian base of peasants and landholders. Of which this constituency has increasingly embraced a §lLuddite§! hostility toward what it perceives as §6Second Renaissance Liberalism§!— a movement it accuses of stripping the countryside of its traditional importance and culture in favor of an anti-individualistic, corporatist liberal elite. Much of this rural base remains uneducated and holds strongly fundamentalist, religiously inflected political convictions, viewing the traditional order of the estates as essential to Swedish social cohesion.§!\n"
