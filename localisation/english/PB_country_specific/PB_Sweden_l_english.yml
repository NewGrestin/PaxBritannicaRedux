  SWE_womens_emmancipation_act: "Suffragettlagen"
  SWE_womens_emmancipation_act_desc: "The Sufferagettlagen (Suffragette Act)"
  SWE_munck_corps_act: "Självförsvarets Organisationslag"
  SWE_munck_corps_act_desc: "The Självförsvarets Organisationslag (Self-Defense Organization Act) seeks to regularize self-defense associations founded by Swedish Veterans and Hunting lodges on the basis of national security, citing large scale Russian backed left-wing attacks on the retired defenders of the homeland, this law seeks to legalize the formation of self-defense units and paramilitary organizations to dissuade from Russian influence\n\nProvided they are registered with the Crown, these self-defense groups are tasked with dissuading from Russian extorsion and violence against private property"
  SWE_prohibition_referendum_act: "Rusdrycksförbudslagen"
  SWE_prohibition_referendum_act_desc: "Rusdrycksförbudslagen (Intoxicating Liquor Prohibition Act) Intends to ban the production, sale, and consumption of 'intoxicating beverages' such as wine, beer, cider, and spirits. \n\nLong championed by the §gNationella Koalition§!, prohibition has become one of the defining tenets of the reactionary movement and enjoys considerable support from Sweden's Catholic minority, who regard alcohol as a source of moral decay, social disorder, and declining public virtue. Advocates argue that the Act will strengthen family life, improve worker productivity, and restore discipline, opponents to the referendum warn that it will encourage illicit trade, organized smuggling, and widespread disregard for the law."
  
  
