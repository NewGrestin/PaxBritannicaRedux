  PB_SWE_Riket_Two: "Den Östra Riksdelen"
  PB_SWE_Riket_Two_desc: "\n\n£GFX_TT_SWE_Riket_Two\n\n\n\n"Finns! Brothers! Your achievements are great, and the gratitude I express to you on behalf of all is just as great. – To interpret this would require an orator with all his skill – But I am a soldier. – Soldier! What a proud title! When I bear this title, by you – for you – and with you!" \n\n- §YC.G.E Mannerheim§!\n\nWith these words and the stroke of a pen, half of Sweden was lost, §Rperhaps forever.§!"
  PB_SWE_Riket_Two1: "Den Östra Riksdelen"
  PB_SWE_Riket_Two1_desc: "\n\n£GFX_TT_SWE_Riket_Two\n\n\n\n"Finns! Brothers! Your achievements are great, and the gratitude I express to you on behalf of all is just as great. – To interpret this would require an orator with all his skill – But I am a soldier. – Soldier! What a proud title! When I bear this title, by you – for you – and with you!" \n\n- §YC.G.E Mannerheim§!\n\nWith these words and the stroke of a pen, half of Sweden was lost, §Rperhaps forever.§!"
