  # Events
  ##########################
  PBNews.379.t: "FINLAND FROZEN"
  PBNews.379.d: "Is the news being heard as both Swedish and Russian representatives have signed an apparent armistice with the Free Finnish Army. Both sides have pledged to halt all combat operations along the front amid rumors that a Russian ultimatum forced the Finns to suspend their offensive.\nThe Swedish government has yet to comment on the agreement, though it is expected to face considerable disappointment from Finnish and Swedish communities on both sides of the Gulf of Bothnia. Nevertheless, Russia's limited military response in Finland suggests that neither side is willing to risk escalating the conflict into a full-scale war."
  PBNews.379.a: "So who really won the war? The Finns, the Russians, or the Swedes?"
  
  sweden.6.t: "The Finnish Administration Asks for Intervention"
  sweden.6.d: ""
  sweden.6.a: ""
  
  sweden.7.t: "Intervention in Finland"
  sweden.7.d: "To our north, the Finnish insurgency has been a constant thorn in our side that we expected to be a quick affair. When Finnish and Swedish rebels began fighting against us, it was expected that they would fall apart or be crushed easily, but it was proven to not be so easy as their tenacity withstood our attacks. Despite repeated failures to snuff out the Finno-Swedish insurgents, they by no means held the capabilities to push us out, and many were content to just contain the rebels until the situation changed to favour us.\n\nAs it turned out, the situation in Finland certainly changed, but not in our favour. Swedish assistance has drastically increased these past months, and with Stockholm's aid the Army of Finland has made strides in their efforts to banish us from Finland. At last, both military and civilian authorities have had enough of this travesty and authorized the mobilization of several divisions to reinforce and beat back the Finns and Swedes. Despite this, numerous issues, ranging from poor supply routes, rough terrain, and the biting cold have led the military to be pessimistic about our coming offensive.\n\nThus, a tough decision has been made to approach Sweden with an ultimatum first. We'll allow them to keep the largely worthless western regions of Finland, mostly inhabited by Swedes, in exchange for totally ending hostilities. Despite some revanchists seeking to commit to the full destruction of the Finnish rebels, the risk of another war breaking out with Sweden so soon after the last is too great for many to seriously consider."
  sweden.7.a: "Let's hope the Swedes are reasonable."
  
  sweden.8.t: "The Russian Ultimatum"
  sweden.8.d: "It seems the Finnish situation has finally caught the eye of Saint Petersburg.\n\nSince the beginning of the relatively low-intensity conflict in the region in 1931, Russian military presence has been limited as it was widely believed that the rebellion would dissipate quickly. That was not the case, as the tenacious Finnish-Swedish fighters repulsed numerous Russian operations. However, a critical and constant shortage of equipment, especially big guns like artillery, prevented the rebels from beating the Russians out of Finland. That is, however, until we began drastically increasing support a few months ago. Our support enabled Kemi to launch significant offensive operations, which, despite pushing the Russians back significantly, also wrought great losses to both manpower and equipment to the Army of Finland.\n\nThis is the stage set for the most recent development, an envoy directly from Saint Petersburg carrying what we feared to be inevitable: an ultimatum. It seems the Russians can no longer put up with the Finnish conflict and have authorized the mobilization of several divisions to reinforce their war effort up north. This escalation could potentially lead to a resumption of hostilities between our nations, something neither side really wants. Despite the ultimatum not stating it, it's also believed that the Russians are not very optimistic about their capabilities to win the war totally. Regardless of the exact reasoning, they've offered us an out: in exchange for ending all hostilities in Finland, we'll be allowed to keep the largely Swedish regions of western Finland already consolidated under the Army of Finland.\n\nDespite some voices calling for a rejection of this ultimatum, the Russians undisputably have the bigger stick in this fight, and most have accepted this is the best we'll get. The only thing left to do is sign it."
  sweden.8.a: "We have no choice."

  sweden.9.t: "Winter Insurgency Vets Return"
  sweden.9.d: "Much of the Swedish Volunteers have now returned home following the cessation of hostilities in the Winter Insurgency. With the war, for the most part and in its current phase, over at least for the coming years, the nation reflects on a campaign that has brought considerable merit to our hopes in the east. Though we failed to secure the whole of Finland, considerable progress has been made toward this objective.\n\nOur boys return to the cheers and applause of their families, welcomed as heroes. 'A Valiant Campaign,' the newspapers proclaim, celebrating the victories won across the Gulf and the courage displayed by Swedish volunteers. Yet amongst the populace lie a quiet sense of incompletion. The campaign had not ended in the quick and complete victory as promised, leaving many a Swede to wonder whether the sacrifices made have achieved enough.\n\nBeyond the Gulf, the eastern horizon remains dark. The bear still lives, wounded perhaps, annoyed more likely, but far from defeated. Ultranationalist voices have already begun denouncing the ceasefire as a squandered opportunity, claiming that Sweden halted its advance at the very moment the enemy faltered. They argue that the nation should have struck the bear dead once and for all, reclaiming Sweden's imperial glory while the chance still remained. For now, however, those ambitions remain unrealized, suspended alongside the armistice itself."
  sweden.9.a: "Perhaps it was too soon a treaty..?"
  sweden.9.b: "Some day we'll see them all home!"

  sweden.11.t: "Negotiations with Krueger"
  sweden.11.d: "The Pitch was simple, \n\nEdison's advances, and the growing threat of the Automation Crisis in Britain and America, loom over the Kingdom like a gathering storm. Should the Anglo-American powers master mass automation before we do, Sweden risks being inundated with cheap English manufactures, Georgian beer, and American shame from the mainland to Solkusten. Our workshops would struggle to compete, our markets would be overwhelmed, and our industries could face de-industrialization at the hands of foreign production, eroding not only our economy but our very autonomy. \n\nYet every crisis carries within it an opportunity. Britain has been struck first. Its workers have resisted automation with strikes, sabotage, and political unrest, hoping to strangle the movement in its cradle before it can transform their nation. Their hesitation grants Sweden an opportunity that may come but once in a thousand years. While our own labour unions and politicians remain preoccupied with the "inevitable" British deluge, we have been handed a precious window to replicate—and perhaps surpass Britain's technological advances on our own terms.\n\nIf we seize this moment, Sweden need not merely withstand the coming industrial revolution. We may outflank Britain itself, claim mastery over the age of automation, and secure our place upon the throne of the new industrial world."
  sweden.11.a: "Perhaps the future lies beyond simple humanity."
  sweden.11.b: "Britain can only serve a case against it."

  sweden.17.t: "The Automation Crisis hits Sweden"
  sweden.17.d: "A hundred or so men from the dock stood staring out at the sea. To the inspecting manager, uninformed of the latest arrivals and departures, it seemed as though they were simply loitering, looking toward what could only be described as more than three dozen cargo ships lining up to enter the port of Göteborg. He didn't know what was in those ships to distract the entire dockyard from unloading the weekly coal shipments.\n\n'We won't be needing them...' one man said.\n\n'They won't be needing us,' another quickly corrected.\n\nDozens- hundreds, of automats and mechanical parts were being shipped ashore, with a quarter bound for Denmark and the rest destined for Sweden. Just then, the port authority spokesman arrived from one of the ships, demanding that people clear the way as it docked. One worker stood in front of him, unwilling to move, until British security escorted him away.'Take him away,' the spokesman said. 'I can replace him—all of the lot.'\n\nThe manager ran frantically after the spokesman, asking what exactly he was doing, under what jurisdiction and what state of mind was this man firing individuals on impulse?\n\nThe spokesman, stopped, fixed his coat and suddenly grabbed the manager by the collar, replying coldly,\n\n'I've got a brain in a jar that'll happily take your spot if you have a complaint.'"
  sweden.17.a: "And like this, Swede against Swede, by will of the Anglos."

  sweden.29.t: "Too little, too late."
  sweden.29.d: "A little compromise; a bargain that's all we asked for. Hardly could that ever have been too much to ask for. We've asked for crumbs and Riksdag gave us nothing.\nThe Conservatives we once rallied under are dying, the successor though they have shown a background in respect to our admirations of protecting the values we hold dear, once again these politicians of the party wish to try moderation once again. \nWhilst many in the party are split on the issue, many of us agree that this betrayal of national politics can no longer continue. \nThe Fatherland has been betrayed, her people neglected and our traditions stamped out against all of our attempts at salvation. \n\nAnd with all these attempts we hear the marchers in the streets. In response to the expanding industrial slavery, workers have begun clogging, monkey wrenching, and sabotaging their industry. With the failures of the Conservatives in parliament, the flame is now lit. \n\nThe people have chosen anger, and in that decision anger too is chosen in the party…"
  sweden.29.a: "A Violet Will Defeat Any Machine."

  sweden_flavor.1.t: "The Northern Way of Life"
  sweden_flavor.1.d: "It had not taken a Russian invasion to bring about such a sight. No greater effort would have been demanded of Sweden, nor of the Finns themselves. The Laukkuryssä—known by many names: bagmen, peddlers, or simply 'Russian bag traps' despite most being Karelians—had long wandered the lakes and forests of the North with little more than great packs upon their backs and honest trade as their livelihood. Yet today they carried not wares, but rifles, swords, boots, and ammunition.\n\nLong had Swedish officials suspected these restless wanderers of little more than serving as Russian smugglers. The insult of being called a Russian was borne unwillingly, but the accusation endured nevertheless. Now, however, the rumors spreading across the frontier spoke of another Russian annexation, another campaign of erasure, and another people destined to disappear beneath the Empire. The bagmen had become soldiers.\n\nAmong them marched one spoken of in both Finland and Karelia with uncommon reverence: Ukki Väinämöinen, the 'Grandfather,' hailed as a hero of the struggle for freedom. Whether enlightened philosopher or merely a stubborn yeoman depended entirely upon whom one asked.\n\nCuriously, the old man's words echoed ideas already taking root within Sweden itself. He condemned automation no less fiercely than Russian industrialism, seeing in both the same machinery of dehumanization. Unlike the English Luddites, whose struggle was often one of profession and livelihood, Väinämöinen's concern was broader. What becomes of a people when labor no longer binds them to their neighbors, but instead to debts without end? Is a man truly free if he spends his life working only to repay another, becoming not a slave by law, but a slave to obligation itself?"
  sweden_flavor.1.a: "How Curious!"

  sweden.25.t: "Viktoria Bans the SPS"
  sweden.25.d: "After the apparent ascendancy of the Självbevarelsedriftssamhället to national prominence in the wake of automation riots, The Queen has seen it fit and in the 'total and enduring interest' of the government to ban the party alongside it's Luddite allies in the right-wing Coalition.\n\nAutomation riots and protest have now apparently spread to the farmers and yeomen countryside, threatening a Fifth 'Dalecarlian rebellion' seeking to restore the old ruralist nature of the Swedish nation, with farmers and self-defense organizations already readying for the coming blows."
  sweden.25.a: "Whispers of Rebellion.."

  sweden.26.t: "The Fifth Dalecarlian Rebellion"
  sweden.26.d: "Civilization has always found its beginning in the countryside. Long before cities crowned themselves the arbiters of culture and progress, it was the plough, the shepherd's crook, and the calloused hand that sustained kingdoms. Though peasants bent their backs beneath kings and landlords, paid tribute, and marched to wars not of their own making, it was upon their labor that every throne rested. Whether they knew it or not, every lord was carried upon the shoulders of the yeoman.\n\nFor generations, the Swedish farmer accepted his place not as mere humiliation or matter of circumstance, but as vocation. God had ordained every estate of society, granting to each its own calling and duty. The peasant tilled the soil, the priest tended the soul, the noble defended the realm, and the king ruled in justice. Such was the divine order, and obedience was owed so long as authority itself remained obedient to God.\n\nSo it was during the first, second, third, and fourth Dalecarlian Rebellions. The men of Dalarna did not rise because they despised order; they rose because they believed that order itself had been betrayed. They saw a Crown that had abandoned its sacred obligations, a king who had placed earthly ambition above divine law, and so they took up arms believing they defended not merely their homes, but God's covenant with Sweden. Though they were broken, their sentiment held value.\n\nThat memory has never truly vanished. The Swedish peasant, the crofter, the statare, and every humble laborer asks the same question once more: if God entrusted the mighty with stewardship over His people, by what right do they now cast them aside? Is the yeoman to be discarded for iron engines? Is honest labor to be replaced by soulless mechanisms that neither pray nor reap by the sweat of their brow?\n\nThe struggle before Sweden is therefore greater than one of economics or industry. It is a question of Creation itself. Shall our bread and wine be fashioned by hands made in God's image, or by lifeless contrivances fashioned only in man's imitation of the body of God? For to exalt the machine above the laborer is not merely folly, it is to raise an idol, a copy of a copy, above the work of the Creator Himself."
  sweden.26.a: "They may make Babel once more."

  sweden.30.t: "The Trench"
  sweden.30.d: "It has been 15 days since the ."