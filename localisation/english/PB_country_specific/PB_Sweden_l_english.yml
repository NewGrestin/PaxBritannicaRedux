  SWE_6_years_after_the_war: "What Went Wrong?"
   SWE_6_years_after_the_war_desc: "Ever since the conclusion of the Russo Invasion of Sweden in the late 1920s, has Sweden found themselves asking the question of 'How did things end up so calamitous?' \nSweden has lost a massive portion of her population in the Eastern Provinces, and while guerrila and protracted fighting among partisan groups continue; it is quite clear that we need to reevaluate our sitation in regards to our old enemy."
  SWE_our_finnish_brethren: "Our Brethren in Finland"
    SWE_our_finnish_brethren_desc: "While a large scale of the populace in the combative areas in our former Easternlands still retain a majority Swedish Population, the Finnish lands still retain an insurmountable amount of Finnish demographics. \nIn truth, these people are still Scandinavian, and therefore our brothers. Under no circumstance should we forget this. \nIn the name of a Scandinavia, free from Russian Tyranny shall we support the Fins."
  SWE_improving_lappi_logistics: "Improving Lappi Logistics"
    SWE_improving_lappi_logistics: "One of the few means via transportation on land between Sweden and Finland, any other means of transporting supplies or volunteers in any other circumstance would have to be delivered by air or sea. \nIt is for this very reason why we cannot neglect the importance of Lappi! \nRailroad and Infrastructure must be improved and streamlined in order for increased effectiveness of these lands for both us and our Finnish allies."
  SWE_protect_kemi: "Protect Kemi"
    SWE_protect_kemi_desc: "While hostilities between Sweden and our historical enemy that is the Russians are continued into the foreseeable future, we should take note that one of our closest provinces to the Russians, AKA - Kemi, is most likely to see combat sightings provided war breaksout between our two nations. \nIt is for that very reason, that we should take effort in providing proper defenses for these territories lest we want Stockholm to be crushed beneath a Russian boot."
  SWE_escalate_weapon_shipments: "Escalate Weapon Shipments"
    SWE_escalate_weapon_shipments_desc: "We cannot hope to stop the endless hordes of Russian soldiers if we do not stop them here. \nFinland will be the first domino in ensuring our national surival and life. \nWhile thousands of our supporters in the Easternlands may stand against the Russians, it will be all for not if they do not have the means to shoulder a rifle - we must send them guns and munitions for this very reason."
  SWE_swedish_flotila_to_the_rescue: "Swedish Flotila to the Rescue"
    SWE_swedish_flotila_to_the_rescue_desc: "While the Russian Empire imposes quite a clear imposing land force in the entire world, their naval capacity is quite inept compared to many other countries. \nWhile a state of war may not officially exist between our two countries yet, IF we were able to send our own national fleet to the Baltics in order to maintain our shipping lines, we may be able to intimidate the Russians into sending far less supplies via sea route to their Finnish proxy."
  SWE_the_swedes_stake: "The Swedes' Stake"
    SWE_the_swedes_stake_desc: "To our Eastern Territories our people hold families, businesses, friends and homes. \nOur people hold a disdain for the idea of Russian conquest of the lands of Finland - newspaper, rallies and speeches in defense of these lands are a constant; let the people rage against the Russo Conquerors."
  SWE_send_the_swedish_volunteer_corps: "Friviliga Krigshjältar"
    SWE_send_the_swedish_volunteer_corps_desc: "As war was raged in the lands of Finland, thousands of exiles headed West into the natural lands of Sweden. Many of these exiles harbored a deep desire for revenge and reclamation. \nLet us not deny these folks the right to reclaim their homelands. Let us establish a definitive corps dedicated and make it easier for these people to unite and fight."
  SWE_further_reinforcements: "Further Reinforcements"
    SWE_further_reinforcements_desc: "While many of the free fighters in Finland are original inhabitants FROM Finland, many of our own people still hold a desire to assist our own citizens who have seen conquest as though they were neighbors. \nAnd who are we to deny these good samaritans, let us arm volunteers and defend our Eastern Frontier."
  SWE_force_the_affarsimperium_to_contribute: "Force the Affärsimperierna to Contribute"
    SWE_force_the_affarsimperium_to_contribute_desc: "While the corporate conglomerates that are the Affarsimperium have remained neutral in the conflict to the East, not wishing to risk losing money; we cant expect to pay for supplies and munitions on thoughts and wishes alone. \nThe guns and bombs used to defend against Russian Despotism will require money, and while it may require a favor or two, we may be able to persuade the Affarsimperium in lending a hand or two."
  SWE_the_final_offensive: "The Final Offensive"
    SWE_the_final_offensive_desc: "This is our last chance to properly shift our weight around the Finnish lands; One final push and we can apply enough pressure to maintain our holdings in Finland.\n\n§YOnce more unto the breach dear friends. Once more.§!"
  SWE_twillight_of_swedish_democracy: "Twilight of Swedish Democracy"
    SWE_twillight_of_swedish_democracy_desc: "The Swedish nation in the aftermath of the Russian Invasion and Growing political violence in the nation, our citizens have called for social reform and a definitive government that serves in the name of her people. \nHowever, in recent days the Riksdag has entered a never ending limbo, and our politicians are incapable of passing even the simplest reform. Many wonder if this will be the end for Swedish Democracy as we know it."
  SWE_prioritize_non_interference: "Prioritize Non-Interference"
    SWE_prioritize_non_interference_desc: "The Affarsimperium has proven great capabilities in becoming one of the largest conglomerates of augmentations in the world, and have certainly proved their capabilities in becoming the most efficient producers in the nation, they have rather capably provided proper jobs and labor to the nation. \nWe should not intervene now, even if our people make protests!"
  SWE_swedish_iron_swedish_blood: "Swedish Iron, Swedish Blood"
    SWE_swedish_iron_swedish_blood_desc: "While in many circumstances the Luddites all over the world have been dubbed quacks and crazies, it can definitely be said that they have a point when it comes to safeguarding the prestige and wellbeing of the occupations of our people. \nIt is by human hand that our nation's goods are to provided to the world, and we will not neglect our people's need for employment now, nor ever."
  SWE_negotiations_with_ivar_kreuger: "Negotiate with Ivar Kreuger"
    SWE_negotiations_with_ivar_kreuger_desc: "Richest man in Sweden, the Match King, spokesman for the Affarsimperium; there is many things that can be said about Ivar Kreuger, but as rising tensions in the nation only continue to grow ever more; he may be one of the few men who can apply the proper changes we need in our corporate and economic apparatus to ease the woes of our workers and our people."
  SWE_the_workers_plight: "The Workers' Plight"
    SWE_the_workers_plight_desc: "With expanding Automation upon all nations of the world, our nation finds a rather unique situation like so many others in facing automation - of which is the maintaining of occupations for our peoples, of which now feel as though they have been neglected by society. \nLike so many other nations, we will have to figure out how to adress this issue."
  SWE_no_swede_left_behind: "No Swede Left Behind"
    SWE_no_swede_left_behind_desc: "One of the primary most problems following the automation crisis in Sweden is an incapability of the national government to provide the proper means to live. \nWith jobs and livelihoods being taken away from citizens - we are going to have to provide social care to the nation and our people; Unemployment pay, Social Security, and Guarantees of Employments are a must of a new day."
  SWE_occupy_the_mines: "Occupy the Mines"
    SWE_occupy_the_mines_desc: "Mining is one Sweden's largest forms of economic production; it makes up the jobs of an overwhelming amount of our population. \nIn Britain and America these countries have faced a great issue in the automation of the mines - strikes, protests, and riots in the street. We should make great strives to prevent this in our father land."
  SWE_the_kohandeln: "Kohandeln"
    SWE_the_kohandeln_desc: "For a while now our nation has faced a rather odd urban divide, as our people remain split between agricultural and urban labor. \nWith ever expanding automation crisis in our nation, we too also now face an agricultural crisis. \nBefore our nation faces complete economic collapse - we must ensure cooperation is made between our peasants and workers."
  SWE_womens_suffrage: "Women's Suffrage"
    SWE_womens_suffrage_desc: "Between rising risks of workers riots, peasants protests, corporate over reaching, growing luddism; there has been a fight and struggle being carried out amongst another group. \nThat of the female struggle and the desire to acquire women's suffrage and rights for the individuals of our nation that hold up half the sky.\nWhile such an issue has been kicked down the road for the past few decades due to more pressing issues - now may be the perfect time to allow for the rights of women in the nation."
  SWE_position_of_munck_corps: "Status of the Munck Corps"
    SWE_position_of_munck_corps_desc: "Founded in 1927 by lieutenant general Bror Munck, the Munck corps was founded during rising political tensions as a way to deal with rising radical republican and lefitst popularity. \nToday they have been a rather continous force that several parties continue to face. \nMany within our government believe that such aggressive harrasing of our nations citizens depending on their political backgrounds can be considered rather taboo - with that being said several people believe that we should address what to do with the Munck Corps."
  SWE_prohibition_referendum: "Prohibition Referendum"
    SWE_prohibition_referendum_desc: "After the 2nd Northern War and the several Swedish Crises of the past decade a large number of our nation has taken to drowning their sorrows in alcolhol - leading to the entire nation appearing drunk, and such a state of vice being associated with our nations ills. \nWhile escapism is a necessity for every human being, the Swedish people must retain a form of sobriety nationwide if we are to ever move on from such events - not to mention defend our national prestige."
  SWE_deal_with_kronpartiert: "Approach Kronpartiet"
    SWE_deal_with_kronpartiert_desc: "The Kronpartiet is a political organism within the nation composed of widescale monarchists, gustavians, and traditionalists. \nAs a traditional nation, they hold much sway in the nation's politics - if we are going to upend the politiical limbo our nation finds itself in, we are going to have to find a way on how to deal with such a hurdle. "
  SWE_kirunaavtalet: "Kirunaavtalet"
    SWE_kirunaavtalet_desc: "Continuing our process of expanding our nations metallurgy and mining initiatives, we should take great care and effort into assessing the nations funding towards mining developments and bore based drilling."
  SWE_cossack_election: "The Cossack Election"
    SWE_cossack_election_desc: "The time has finally come for our nation to effectively inaugurate new members to the Riksdag and elect a new Prime Minister \nWith many harsh critiques and words shared between many politicans, such an election is likely to become quite catalystic in our coming future."
  SWE_feed_the_machine: "Feed the Machine"
    SWE_feed_the_machine_desc: "If Sweden is to ever catch up to the great industrial empires of Europe, Especially with rising tensions, we absolutely need to vastly expand the industrialization of our nation. \nWhether is automatons or flesh and blood, the Northern Lion will Roar!"
  SWE_workers_over_wire: "Workers over Wire"
    SWE_workers_over_wire_desc: "It is flesh and blood that has made Sweden; plow the fields, dig the mines, constructed the cities and palaces, and more importanly created the machines that we have dared to replace the toilers of our nation with. \nWho are we to have the notions of replacing the builders of our nation with automatons? \nUnder no means, shall we dare to replace our workers with these wirebacks."
  SWE_expand_dannemora_zinkgruvan_automation: "Revive the Roaring Bergslagen"
    SWE_expand_dannemora_zinkgruvan_automation_desc: "One of the largest industrial districts in our nation and Scandinavia, Bergslagen has maintained a rather large impact on our national production and prestige, and why is it for that reason should we not continue to grow and continue to develop it?"
  SWE_reviving_svealand_mills: "Industrialization of Svealand"
    SWE_reviving_svealand_mills_desc: "Svealand has historically maintained quite a large industrial destrict, however, in recent years it has largely gone unmaintained and modernized with the growing Automation Crisis. \nWith a few new bolts, screws, and machines; we may be able to provide newfound industry and employment to our people."
  SWE_supress_the_statare: "Suppress the Statare"
    SWE_supress_statare_desc: "The statare a social group within our nation frequently compared to as serfs, have provided a rather large amount of manpower in terms of agricultural and peasant based production. \nWith growing tensions among our labor populace, so too has the statare begun revolting accordingly like so many others in our nation. \nThis group if left unattended to for so long, will only become a greater problem. As a response, we must stamp them out; like swatting a wasp before it can call others from its nest."
  SWE_reform_the_statare: "Reform the Statare"
    SWE_reform_the_statare_desc: "While the statare could definitely potentially provide a great issue to our nation and the crown, these people are still our citizens. \nWhile many have taken initiative of revolting and growing in dissesion; perhaps instead of surpressing these people we should instead take note of their issues and apply proper reformation accordingly."
