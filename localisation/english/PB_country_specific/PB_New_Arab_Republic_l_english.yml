  ### LEADERS ###
  NAN_ismail_qasim: "Isma'il Ansar Qasim"
  
  #################
  ####  IDEAS  ####
  #################
  
  PB_NAN_Scions_of_Ummah:0 "Lost Sons of the Ummah"
  PB_NAN_Scions_of_Ummah_desc:0 "When the heavily armed Ottoman-Hejazi forces swept through the Arabian desert to shatter the Saudi fiefdom, we seized the opportunity to arise and confront both the archaic fossils of Ryad and the turkic oppressors from Osman. With considerable support from our brethren in Persia, we successfully managed to establish a bridgehead around the Gulf — carrying the banner of Arab enlightenment and Al-Afgani's teachings throughout battle. \n\nOur hope for a quick victory would soon vanish however. Kept at bay by the British intervention in Kuwait, our supply line weakened and our attempt to cross the ad-Dahna desert unconclusive, we withdrew from the Arabian interior — entrenching ourselves on the coast. \n\nAlthough the stalemate perpetuated itself indefinitely, and Persian assistance shrunk dramatically over time, we waited and are still waiting for the ideal time to strike and remind the world the cause of Arab Renaissance is not yet a lost one."
  PB_NAN_Shia_Dominance:0 "Shia Dominance"
  PB_NAN_Shia_Dominance_desc:0 "Although we like to fashion ourselves as the standard bearer of all Arabs within the Peninsula, the confessional reality of our land speaks of a different truth. Largely influenced by Persia, our territory hosts a sizable Shia majority whose habits and faith diverge from those of the rest of Arabia’s population. \n\nWith the Sunni population distrustful about our regime and our pleas for confessional equality met with suspicion by most, our legitimacy remains ever-low outside of the coastal provinces bordering the Gulf. "
  