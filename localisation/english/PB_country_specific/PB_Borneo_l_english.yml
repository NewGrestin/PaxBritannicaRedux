  BOR_bertram_brooke: "Bertram Dayrell Brooke"
  BOR_bertram_brooke_desc:0 "§YBorn:§! 8/08/1876\n\n§YBertram Willes Dayrell Brooke§! is the the son of Charles Brooke, the second of White Rajah of the Raj of Sarawak, and a brother of Charles Vyner Brooke, the third and current White Rajah.\n\nBrooke was educated at Winchester College and at Trinity College, Cambridge. He was president of Cambridge University Boat Club, rowing in The Boat Race in 1900 and 1901 and was a member of the Pitt Club. He went on to serve in Royal Stormtrooper Units during the Great War on the Italian and Iberian Fronts. His time in the Stormtroopers had ultimately changed Bertram for the worse. In the eyes of British Royality he had become a erratic chauvinistic sellsword who could not display anymore art of fine statemanship and respect to the Empire subjects. In 1913 his brother Vyner would be finally forced to disinherit him and relinquish his rights of succession to be next White Rajah.\n\nA soul searching introspection by Betram did not follow but a surge of hatred, paranoia and hysteria. A year later Betram would attempt a coup against his own brother that would collapse among the streets of Kuching and result in his imprisonment. Betram might be one of the few who benefited from the §RKrakatoa Distaster§!. With the collapse of Dutch Control in Borneo his brother decides to exile him into the chaos on a doomed pacification mission and the hope he would never return.\n\nBetram however would excell in the chaos and manage to evict the Dayak Clans, Corsairs and Jacobins from Eastern Borneo. Here he would solidy his control over the valueable oil fiels of Tarakan. When he rejected orders to join Suttons command and relinquish his own power base, London and Sarawak saw no other option to legitimize his control and materially support him.\n\nHis thirst is not yet quenched and his disdain against aboriginals, colonisubjects and lastly his own brother continues..."  
