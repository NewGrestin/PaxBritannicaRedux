  PB_SIA_Death_Railway:0 "Legacy of the Burma Railway Affair"
  PB_SIA_Death_Railway_desc:0 "Spared by Western imperialism for most of the nineteenth century, we blinded ourselves in thinking we were among the great of this world. Civilized unlike the Burmese primitives, distinguished as opposed to the brutish Chinese... Perhaps destiny had granted us a place of choice within the hierarchies of this world. Not only did we became complacent toward the europeans as such, but we even took part in their petty rivalry — thinking we would secure our position forever and ever as such. \n\nHow foolish were we. \n\nAs French Indochina fell under British influence thanks to our efforts during the Great War, it soon appeared we had lost any values in the eyes of London. Rewarded with little to no gains in Indochina, we ultimately tried to wash the shame of this mutilated victory with a grandiose and bold move the imperialists would remember. Still under construction at this time, the Burma railroad was swiftly nationalized — with all future profits now belonging to us. While we may have successfully regained our people's trust for a time, we had unleashed a terrible evil upon our land. \n\nUninterested in negotiating with us, Britannia sent its legions to cross our borders, crushing our feeble army in a matter of weeks while securing control of the railway's path. Our land subjugated and our king forcefully removed, we bended completely to our new overlord as if we never had been anything else than a mere colony for all this time. \n\nOne day perhaps, Siam will recover its lost prestige and freedom. But for now on, our nation is condemned to be nothing but a hollowed puppet of London. A shadow of its former self."
