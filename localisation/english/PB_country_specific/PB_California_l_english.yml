  PB_CAL_Californicacion: "Californicación"
  PB_CAL_Californicacion_desc: "California serves a testatment to a growing anomaly within the social world, serving as a point where East meets West, where the sun rises in the east it may find itself eventually appropriated, and setting in the west. In the aftermath of such troubling events one may hear in the Asian continent, it's not unreasonable to know that a majority of the incoming population consists of Asians, Filipino, Korean, Japanese, and Chinese have all made their homes in California, contributing their own part to the social meltingpot.\n\nHowever another form of social change has taken root within California, long enamoured by the wild tales of the West and the exotic Orient, California has served as a hub for the Cinemas, fomenting a sense of Global Metropolitanism that would serve a heartattack to any simple yeoman, yet a boon to the more cosmopolitan and worldly aquainted."
