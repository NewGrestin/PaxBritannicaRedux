  # EVENTS
  philippines.diplomacy.1.t: "The Philippines Requests Guns"
  philippines.diplomacy.1.d: "Our Souther Neighbor of the Philippines Requests Guns in their pursuit of the liberation of their fellow Filipinos."
  philippines.diplomacy.1.a: "Send them guns!"
  philippines.diplomacy.1.b: "We dont have much to spare"

  philippines.diplomacy.2.t: "[FROM.GetName] refuses to give us weapons"
  philippines.diplomacy.2.d: "[FROM.GetName] Refuses our offer for guns in our liberation"
  philippines.diplomacy.2.a: "A sad choice."

  philippines.diplomacy.3.t: "[FROM.GetName] Agrees to give us guns"
  philippines.diplomacy.3.d: "The Government of the [FROM.GetName] has accepted our plee for weapons"
  philippines.diplomacy.3.a: "Thank heavens!"

  philippines.intro.1.t: "General Luna's Southern Plan"
  philippines.intro.1.d: "General Antonio Luna has put forward a long-awaited plan for the invasion of the southern Philippines, consisting of a series of rapid offensives aimed at routing German forces and dismantling their control over the archipelago. As the nation’s foremost general and Head of the Armed Forces, Luna argues that we must press forward with this offensive if we are to achieve a truly independent Philippines, free from German involvement."
  philippines.intro.1.a: "Soon we will all be in Davao, soon.."

  philippines.intro.5.t: "Troops in Dagupan assaulted by Cofradias!"
  philippines.intro.5.d: "Our troops in and around Dagupan have reported numerous assaults on supply routes leading into the city by Cofradías of the Guardia de Honor de María. Founded during the outbreak of the Revolution in 1898, these Cofradías have continued to swear loyalty to the Catholic Church and the Spanish cause. Though not as heavily armed as regular forces, they nonetheless pose a serious threat to our troops.\n\nLocal governor and war hero Francisco Macabulos has requested our immediate assistance in clearing the approaches to Dagupan, fearing that the Cofradías have already infiltrated the city and may be planning a major attack in the coming weeks.**"
  philippines.intro.5.a: "Send a notice, be wary of Colorums on route to dagupan."
  philippines.intro.5.b: "Tell General Macabulos that Dagupan must be secured, clear out the entrances to the city."
