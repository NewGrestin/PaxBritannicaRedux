  PB_NPR_Resistance:0 "Those Who Resist"
  PB_NPR_Resistance_desc:0 "When Bernadotte attempted to subdue Australie to his petty tyranny, we arose to prevent the endarkenement he promised to all. We fought restlessly, the spirits of 1789 granting us the will to stand tall despite our opponent's vast military superiority. \n\nAbandoned by all and surrounded by nothing but enemies of freedom, diminished and desperate to the point of being forced to withdraw to the Northern country, it first appeared we wouldn't be able to withstand the storm despite our many sacrifices. Then, jumping in like a vulture on dead bodies, Germany suddenly offered its mediation — threatening to intervene should a compromise not be found. In a strange twist of fate, the hated Austrians, guided solely by the desire to further undermine the already derelict Bourbon colonial Empire, saved us with a stroke of the pen. Left independent in the northernmost part of our former country, we soon became a beacon for those oppressed not only in the Regency, but everywhere in Australia — attracting exiles from all corners of the continent, all ready to serve the cause even in death. \n\nShould the despot attempt to stifle our experiment once more, he will be met with the renewed resistance of our people and our reconstituted arsenal. For New Provence patriots would rather see their newfound haven burnt to the ash than relinquishing a single Right to the tyrants of this world."
  PB_NPR_Cher_Pays:0 "Cher Pays de mon Enfance"
  PB_NPR_Cher_Pays_desc:0 "If it is said that people are to be bound to lands and traditions, then the people of New Provence assuredly diverge from the norm. Pushed to the path of exile from mainland France — sometimes from much further away — only to be once again expelled from their homes southward, the citizens of the small Republic have been uprooted on numerous occasions. Despite strong civic traditions and a sense of duty emulated through their grueling struggle against Bernadotte's Regency, most inhabitants remain apathetic — their minds filled with nostalgia and fantasised images of the past. \n\nThe cultural life of New Provence is largely dominated by such homesickness; a trait which often translate into outright desperation that only drugs and other grotesque entertainments are able to suppress. \n\nIn the end however, the Spleen remain everpresent, recalled by vision of a homeland close to the heart, yet distant from everything else."
  
