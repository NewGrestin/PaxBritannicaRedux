PB_NZL_king_movement:0 "The Kingitanga"
PB_NZL_king_movement_desc:0 "The Kingitanga (Maori King Movement) is one of the most successful challenges against British Imperialism in the last 100 years. Awarding the country not with the status of ‘Possession’ but of ‘Dominion’. The line of Maori kings now represents hope and stability for the increasingly larger Maori Population of Aotearoa. Many Pakeha (White Men) have also come to respect, and admire the Kingitanga for its actions and its statesman like conduct."
PB_NZL_spectre_of_the_royal_navy:0 "The Spectre of the BGNZ"
PB_NZL_spectre_of_the_royal_navy_desc:0 "For long any attempt for further independence has been met by British interference, so much so that their presence looms over Aotearoa. In Kororāreka a Royal Navy Gunboat was able to halt a Maori attack in its tracks, and threw the warriors back like beaten dogs; in 1908 a challenge by the Aotearoan Parliament against the British was answered by the sudden arrival of HMS Dreadnought in Tāmaki (Auckland) Harbour. Following the Great War, the strong protests for autonomy both in New Georgia and Aotearoa led to London installing military garrisons in both regions, under the premise of 'safety'. British soldiers extranged and uninterested in local affairs now regularly monitor each street and house. The Aotearoans are scared to response, yet as each day passes they're equally scared of intransigent British colonialism."
PB_NZL_language_question:0 "Two Language Question"
PB_NZL_language_question_desc:0 "Aotearoa has no official language, with the nation's governments always choosing to kick the problem further down the line, rather than alienate either half of the Dominion’s population. A man born in New Zealand may walk down a street, and be completely unable to make conversation on one block, but fluent on the next. The issues have spilled over into the Armed forces, with some drill instructors unable to converse with recruits."
