  ### IDEAS ###
  PB_BHU_hermit_kingdom:0 "The Hermit Kingdom"
  PB_BHU_hermit_kingdom_desc:0 "On the fringes of the Himalayan mountain range lay a kingdom unknown to most. Bhutan, most commonly referred to as the “Hermit kingdom”, is a country that lacks far behind the rest of the world in terms of mostly everything. Although connections have been established with Great Britain over the end of the nineteenth century, the kingdom's relative inaccessibility and fierce traditionalism have prevented any serious commercial or cultural exchanges with the outside. \n\nWith Russia spreading its tendrils northward of Tibet and the ever-pressing need for London to secure its assets in India, this situation might come to be dramatically altered however."
  