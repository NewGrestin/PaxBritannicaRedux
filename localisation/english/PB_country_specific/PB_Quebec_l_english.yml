 QUE_fire_anglo_politicans_desc:0 ""
 QUE_reasure_the_british:0 "Reasure the British..."
 QUE_reasure_the_british_desc:0 ""
 QUE_and_the_americans:0 "...And the Americans"
 QUE_and_the_americans_desc:0 ""
