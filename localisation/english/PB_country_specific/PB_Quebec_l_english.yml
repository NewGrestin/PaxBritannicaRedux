 ############
 QUE_hibernian_brigades:0 "Hibernian Brigades"
 QUE_hibernian_brigades_desc:0 "Our ties to the Irish are undeniable, coming from our shared Catholicism, there has always been a current of Irish immigration to Quebecs cities and countryside. Many soldiers in the Great War fighting under Quebecs flag were of Irish descent and perhaps we can have that spirit reignited for the coming troubles."
 QUE_the_beating_heart_slows:0 "The Beating Heart Slows"
 QUE_the_beating_heart_slows_desc:0 "The beating heart of Quebec's political scene, the United Quebec Party, has reached a breaking point. Almost 20 years since its formation, it has become less and less cohesive as three main factions compete for influence over the state. We need to trim the fat and let some politicans go. While it will make our party smaller and less dominant in parliment, we will finally be able to have the necessary cohesion to decide on what approach we must take for Quebec's future."
 QUE_concord_with_the_ultramontanes:0 "Concord With the Ultramontanes"
 QUE_concord_with_the_ultramontanes_desc:0 "Perhaps, the Ultramontanes were right all along. If Quebec is to defend its identity and nationhood, we must double down on what makes us different from our imperial siblings. Charles Gault may be hesitant, but he himself understand the power and influence the Ultramontanes hold over the Quebecois people."
 QUE_rely_on_the_rich:0 "Rely on the Rich"
 QUE_rely_on_the_rich_desc:0 "We cannot allow radicals to dictate our policies lest we end up in a disaster not seen since 1909. The Château Clique has good connections with Anglois politicans and British industiralists, and their policies seem sensible and just what Quebec needs for continued and improved economic prosperity which will hopefully decrease the radicalization taking place among the Quebecois and Anglois people."
 QUE_declare_politcal_amnesty:0 "Declare Political Amnesty"
 QUE_declare_politcal_amnesty_desc:0 "Ever since 1909, many radical groups, particularly nationalist ones, have risen up as powerful political forces. The White League and especially the Quebec National Independece Party come to mind but also the infamous Anglois Borelian Independence Party. With them taking on a more moderate course and many people pledging their allegiance to these movements, perhaps it would be right to forgive them for any transgressions caused in the past. By repealing the “Electoral Safety Act” which banned all political groups with paramilitaries and releasing the arrested members of these movements, we can bring these movements closer to the political establishment and hopefully get them to deradicalize."
 QUE_reshuffle_the_cabinet:0 "Reshuffle the Cabinet"
 QUE_reshuffle_the_cabinet_desc:0 "With the new state of the United Quebec Party, some cabinet members that belonged to the now kicked out political faction of the UQP may not be so keen on doing their job properly as a form of protest. We cannot let this happen and the prime minister will appoint more loyal members of the factions still belonging to the party."
 QUE_fund_the_quebec_city_memorial:0 "Fund the Quebec City Memorial"
 QUE_fund_the_quebec_city_memorial_desc:0 "It's been 24 years since the Quebec City rebellion happened. After a botched reconstruction and neglect from the government, the prople of the city deserve a memorial for all those who had fallen in the war for Quebec and all that happened afterwards. Some may say its too little too late, but better late than never."
 QUE_shepard_the_flock:0 "Shepard the Flock"
 QUE_shepard_the_flock_desc:0 "The Catholic Church is one of the most influential instituions in all of Quebec, to the delight of some and chagrin of others. The Anglois population is the most dissatisfied with this state of affairs, however if we were to change the status quo, it would most certainly anger the Ultramontanes. We have to choose our approach wisely."
 QUE_tolerate_the_orange_order:0 "Tolerate the Orange Order"
 QUE_tolerate_the_orange_order_desc:0 "The Orange Order is a political and religious fraternal society in Quebec that defended Protestantism and the British connection while providing mutual aid to the Anglois population. It's influence extends to all the Anglois states and has large sway over the non Quebecois territories. We will have to let them be if we wish to preserve good relations with the Anglois, even if the more hawkish members of the party may be angered by this."
 QUE_the_universal_church:0 "The Universal Church"
 QUE_the_universal_church_desc:0 "We should make it clear that the church of Quebec is the Catholic church and ONLY the Catholic church, members of the other denominations are not welcome in our government and civil service."
 QUE_an_envoy_to_paris:0 "An Envoy to Paris"
 QUE_an_envoy_to_paris_desc:0 "With tensions rising across the world, perhaps it is due time we reestablish relations with the French state across the pond. While Britain may not be enthusiastic over this, if worst comes to worst, we may have a reliable partner in an increasingly uncertain geopolitical situation."
 QUE_a_discussion_with_duplessis:0 "A Discussion With Duplessis"
 QUE_a_discussion_with_duplessis_desc:0 "Our party, despite now being more united than before, is still having disagrements over policy and the future of the party. The leader of the most powerful faction besides the Blues, Maurice Duplessis of the Ultramontanes, is willing to negotiate over any disagreements in our party."
 QUE_the_plight_of_the_cityfolk:0 "Plight of the Cityfolk"
 QUE_the_plight_of_the_cityfolk_desc:0 "The cities of Quebec have turned into sprawling urban areas with crime, poverty and homelessnes not being too uncommon. Many trade unions have used this fact to push egalitarian propaganda and radicalize the workers and the urban population at large. We must extend a hand to our cities, clearing the slums, passing safety regulations and other quality of life improvements in the cities."
 QUE_prioritize_rural_development:0 "Prioritize Rural Development"
 QUE_prioritize_rural_development_desc:0 "The past decade has saw a lot of investement into our cities and urban areas, greatly boosting their development and industrial output, but at the expense of all our rural areas. Some rural areas have never left the 19th century and overall this has caused resentment and anger from our farmers and empowered natioanlist and right wing elements of society. We must help these regions and develop them to be on par with the urban areas."
 QUE_loyalty_through_prosperity:0 "Loyalty Through Prosperity"
 QUE_loyalty_through_prosperity_desc:0 "As unfortunate as it is, the best way to ensure loyalty of the Quebecois to the British Empire is through material prosperity. While we all wish to have more sovereignty to make our own decisions without Londons interference, it is much better to be under the Lions care than to be alone and exposed to the dangers of the Eagles' ambitions on our Anglois territories."
 QUE_glorify_the_veterans:0 "Glorify the Veterans"
 QUE_glorify_the_veterans_desc:0 "Despite how negatively the Great War is percieved by our entire population, we have undoubtedly contributed much to the war effort. It is high time we recognize this and make it clear in school books, magazines and the people as a whole."
 QUE_a_pan_imperial_identity:0 "A Pan Imperial Identity"
 QUE_a_pan_imperial_identity_desc:0 "Even though there is a great devide between Quebec and its Anglo imperial siblings, we have a lot more in common than at first glance and our place is firmly within the Empire."
 QUE_the_governor_generals_demands:0 "The Governor Generals Demands"
 QUE_the_governor_generals_demands_desc:0 "Quebec, like all the other commonwealths in the Empire, has a Governor General. Prince Arthur has many government powers at his disposal, like prorouging and dissolving the parliment to name a few. He has come to the government to ask for special permissions for more urgent meassures to be implemented as he sees fit, namely, the right to declare martial law. With Quebecs political situation worsening, he believes this would be the best way to ensure stability and prevent radical regimes from taking over without needing parliaments approval."
 QUE_tariff_american_goods:0 "Tariff American Goods"
 QUE_tariff_american_goods_desc:0 "The government is strapped for cash, and we have learned from Lomer Gouin's mistake of taxing the population excessively in the Anglois taxation protests of 1914/1915. Instead, we could begin placing higher tariffs on our southern neighbors goods to get extra income. While this will undoubtebly worsen our relations with the UCA, perhaps getting Quebec's population less dependent on American goods by making them more expensive will pay off in the long run."
 QUE_no_shortage_of_londons_money:0 "No Shortage of London’s Money"
 QUE_no_shortage_of_londons_money_desc:0 "The government is strapped for cash, and we have learned from Lomer Gouin's mistake of taxing the population excessively in the Anglois taxation protests of 1914/1915. Instead, our overlords and benefactors may be willing to hand out some cheap loans to fund some government projects we have. Besides, are the British not resposnible for the wellbeing of its subjects?"
 QUE_sectarian_synchronicity:0 "Sectarian Synchroncity"
 QUE_sectarian_synchronicity_desc:0 "While many hold the Catholic Church in high regard among the Quebecois population, we cannot have it interfering with the governments actions and policy. The church and state should be seperate, especially after Pope Alexanders dubious morals."
 QUE_court_the_anglois_elite:0 "Court the Anglois Elite"
 QUE_court_the_anglois_elite_desc:0 "The Anglois represent a large portion of our population and some have become very wealthy and very influential. We would do well to have cordial relations with the Anglois elites of the major cities of Chicagou, Detroit, Toronto which are major population and industrial centers."
 QUE_emulate_the_square_mile:0 "Emulate the Square Mile"
 QUE_emulate_the_square_mile_desc:0 "As a gesture to their aid and support, it would be wise to implement some reforms to urban governance of Quebecs cities to be more like that of London to reduce waste and emulate Londons successes."
 QUE_one_party_oncemore:0 "One Party Oncemore"
 QUE_one_party_oncemore_desc:0 "After much work and compromises, we have finally managed to deal with the crippling factionalism present in the United Quebec party."
 QUE_disaster_at_our_shores:0 "Disaster at our Shores"
 QUE_disaster_at_our_shores_desc:0 "As the rapidly evolving crises of Automation and the Smogbowl have reached their zenith in Quebec, we must find a way to deal with them. Due to the nature of these crises, the government can prioritize only one at a time before dealing with the other. A difficult choice is ahead of us."
 QUE_cry_of_the_workless:0 "Cry of the Workless"
 QUE_cry_of_the_workless_desc:0 "People are out in the streets, with no way to ensure even basic living conditions without work, which is especially dangerous during this time where the toxic air can be deadly for anyone without protection. We must focus on this issue first before it gets out of hand."
 QUE_the_choking_horizon:0 "The Choking Horizon"
 QUE_the_choking_horizon_desc:0 "With the large smokestacks plaguing Quebecs landscape, nature has made itself heard in the wind patterns that caused massive amounts of smog to accumulate in the air, making some regions uninhabitable. This is the greatest public health risk our nation ever faced and it must be solved before anything else."
 QUE_sustain_the_steel_belt:0 "Sustain the Steel Belt"
 QUE_sustain_the_steel_belt_desc:0 "The steel belt between Chicagou and Toronto is the backbone of the Quebecois economy. Many workers have been laid off, especially in the Anglois region. Despite many issues persisting in non Anglois regions, we must prioritize these regions to keep national stability and increase domestic consumption in a region more prone to consumerism."
 QUE_fix_our_crown_jewel:0 "Fix 0ur Crown Jewel"
 QUE_fix_our_crown_jewel_desc:0 "Montreal is the pride of the Commonwealth of Quebec, no matter what some detractors say. However, we do need to recognize its flaws of which there are many. High crime rates, poverty and homelessnes has only been exacerbated by the Automation Crisis and now is the perfect time to rectify all of this and turn it into a true model city. Not just for the nation, but for the whole world!"
 QUE_incentivise_the_megacorps:0 "Incentivise the Megacorps"
 QUE_incentivise_the_megacorps_desc:0 "The origin of the Automation crisis comes from the corporations which employed mass use of machines for manual labour. With government incentives to use human workers over machines as well as favorable conditions for their profit margins to not decrease, we treat the root cause rather than just cutting off the vines of the crisis"
 QUE_soup_and_shelter:0 "Soup and Shelter"
 QUE_soup_and_shelter_desc:0 "Despite the fact we know corporations are the source of the crisis, the truth is that it would politically very difficult to give any incentives and benefits to the corporations that many people believe are responsible for their current suffering. We must help the people first."
 QUE_a_white_collar_renassiance:0 "A White Collar Renassiance"
 QUE_a_white_collar_renassiance_desc:0 "There are many groups opposing the onset of automation, but the truth is that automation is next step of human civilizaton, liberating us from manual labour. The future of human labour is office and administrative work, making sure the machines working for us are running smoothly. It may be politically costly, but it must be done."
 QUE_halt_futher_automation:0 "Halt Further Automation"
 QUE_halt_futher_automation_desc:0 "There are many groups opposing the onset of automation, and they are right. Automation reduces the value of human labour and depresses wages for anyone unwilling to do office work, which is a lot more people than one might think."
 QUE_a_bitter_harvest:0 "A Bitter Harvest"
 QUE_a_bitter_harvest_desc:0 "The smog in the air has caused many crops to begun failing with a lack of sun reaching them. If the current situation isn't resolved, we will experience a possible shortage of food and hunger. We can attempt to save as much food as we can and invest further into agroponics complexes and possibly make it easier to avoid going outside for citizens."
 QUE_restrict_working_hours:0 "Restrict Working Hours"
 QUE_restrict_working_hours_desc:0 "We must avoid the people being exposed to the smog as much as possible. The best way to do this is to restrict the amount of people being outside during nighttime when everyone is heating their homes and creating more smog in the air. We also need to keep our industry stable and not let it fall by completely prohibiting people from leaving their homes."
 QUE_establish_the_cleanup_squads:0 "Establish the Cleanup Squads"
 QUE_establish_the_cleanup_squads_desc:0 "The government must be responsible to establish cleanup squads that will clear out the areas with the highest concetration of smog and help the people."
 QUE_remember_to_wear_your_masks:0 "Remember to Wear Your Masks"
 QUE_remember_to_wear_your_masks_desc:0 "The people have to also be responsible for their own health and that means wearing masks and staying indoors as much as possible." 
 QUE_combat_respiratory_diseases:0 "Combat Respiratory Diseases"
 QUE_combat_respiratory_diseases_desc:0 "Our hospitals are flooded with people that have gained many respiratory issues due to so much smog. We must find the best ways to cure them and alleviate the strain on the healthcare system."
 QUE_distribute_nutrition_supplements:0 "Distribute Nutrition Supplements"
 B_QUE_Distribute_Nutrition_Supplements_desc:0 "In order to help people with staying indoors as much as possible, we will distribute nutrition supplements that will have enough calories rationed for the average family to live off of."
 QUE_the_path_to_recovery:0 "The Path to Recovery"
 QUE_the_path_to_recovery_desc:0 "We have finally managed to pass the crisises. Many thought that Quebec would falter after such double trouble, but we prevailed and are now greater than ever!"

 QUE_le_chef_se_leve:0 "Le Chef Se Lève"
 QUE_le_chef_se_leve_desc:0 "When news of an 'Automation Crisis' in the United Kingdom reached Quebec, the people had a similar reaction to our neighbors in the United Commonwealh, shrugging it off as nothing major. Once the Quebecois branch of the EIEC began advertising its androids to Quebec's own major corporations, more and more people began finding themselves out of a job, replaced by machines. Whats even worse is "
 QUE_maitres_chez_nous:0 "Maitres Chez Nous"
 QUE_maitres_chez_nous_desc:0 ""
 QUE_war_on_the_economy:0 "War on the Economy"
 QUE_war_on_the_economy_desc:0 "Our economy shall be reorganized to fit more in line with Quebecois' interests. That way we revive the economy where it matters for our future goals."
 QUE_move_the_industry:0 "Move the Industry"
 QUE_move_the_industry_desc:0 "The Anglois provinces cannot be allowed to weild such capital and influnce from industry in a nation for Quebecois. We shall correct this by moving many industrial facilities into the more stable and less unruly provinces of the north."
 QUE_plough_the_fields:0 "Plough the Fields"
 QUE_plough_the_fields_desc:0 "Big industry has been a disaster for our great nation. It placed the money and the influecne in the hands of prefidious Anglois and our British masters across the sea. We shall correct this and promote farming to create a virtuous peasant nation, just how nature inteded, and dismantle the tools of power that Anglois use to undermine us."
 QUE_redline_anglois_neighbourhoods:0 "Redline Anglois Neighborhoods"
 QUE_redline_anglois_neighbourhoods_desc:0 "One way we can decrease the growth of the Anglois economy is to create regulations and raise taxes so that any investment into the southern provinces is more expensive and unappealing. This will also ensure more foreign investemt flows north."
 QUE_promote_migration_down_south:0 "Promote Migration Down South"
 QUE_promote_migration_down_south_desc:0 "To many provinces in the south that weild much strenght speak English and are opposed to our goals. We can somewhat rectify this by encouraging migration of Quebec's true patriots down south into Anglois provinces."
 QUE_break_the_compromise:0 "Break the Compromise"
 QUE_break_the_compromise_desc:0 "The compromise agreement between Quebec and the United Commonwealth that allowed free trade and movement between the two nations is clearly working in America's favor and is hodling back our nation by tying our economy to the Commonwealth and allowing Americans to quickly migrate into our territory. We shall break this agreement in order to let Quebec be truly free."
 QUE_under_the_table_deals:0 "Under the Table Deals"
 QUE_under_the_table_deals_desc:0 "While our greatest wish is to be freed from the Anglo world and America's capitalists, we cannot deny the benefits that trade with the prosperous United Commonwealth brings to our populations. Perhaps a few less offical deals here and there wouldn't hurt."
 QUE_nationalize_american_assets:0 "Nationalize American Assets"
 QUE_nationalize_american_assets_desc:0 "For the quest of liberating Quebec of foreign shackles, we must get rid of all American capitalist intrudors. All American assets will nationalized and used rightfully by Quebec's people."
 QUE_a_quebecer_economy:0 "A Quebecer Economy"
 QUE_a_quebecer_economy_desc:0 "We have made a great achievement! Finally, for the first time, Quebec's economy is for Quebec only. No more will foreign capitalists exploit our economy for their own beenfit!"
 QUE_subsidize_southern_farming:0 "Subsidize Southern Farming"
 QUE_subsidize_southern_farming_desc:0 "Industrial expansion in the southern provinces had been very profitable for the Anglois and American capitalists. To achieve our virtuous peasant state, we will subisdize farming especially in the southern provinces to make it more profitable than industrial growth and thus stifle the Anglois provinces' power."
 QUE_hand_in_hand_with_unions:0 "Hand in Hand With Unions"
 QUE_hand_in_hand_with_unions_desc:0 "While working with socialist unions may seem counteractive to our goals, that is exactly what's needed to ruin industrialist's dreams as their workers demand more and more concessions until they leave."
 QUE_a_nothern_axis:0 "A Nothern Axis"
 QUE_a_nothern_axis_desc:0 "More and more of our nations industry will be tooled to serve Montreal and Quebec instead of our advesary Philadelphia."
 QUE_kill_capitalism:0 "Kill Capitalism"
 QUE_kill_capitalism_desc:0 "Capitalism is a system invented and used by Anglos to undermine nations like ours by connecting everything to themsleves. We will adopt a more French system of corporatism in order to be more free."
 QUE_quebecs_greatest_son:0 "Quebec's Greatest Son"
 QUE_quebecs_greatest_son_desc:0 ""
 QUE_support_from_the_ultramontanes:0 "Support From the Ultramontanes"
 QUE_support_from_the_ultramontanes_desc:0 "In our effort to bring back the glory of olf France, we will work with the Ultramontanes to help stabilize and make our government more popular with the people, especially of Catholic background."
 QUE_concord_with_the_establishment:0 "Concord With the Establishment"
 QUE_concord_with_the_establishment_desc:0 "With the monarchy reinstated, many politicans and our Anglo overseers are quite uncertain with the direction of Quebec. We must be pragmatic and slowly establish connections and alliances in the political landscape of Quebec so that we don't get overthrown."
 QUE_secure_the_anglois_states:0 "Secure the Anglois States"
 QUE_fraternite:0 "Fraternité"
 QUE_fraternite_desc:0 ""
