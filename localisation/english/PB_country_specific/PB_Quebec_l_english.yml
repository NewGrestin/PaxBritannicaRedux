 Quebec_Neoimps.10.t:0 "Quebec Leaves the Compromise Agreement"
 Quebec_Neoimps.10.d:0 "The government of our northern neighbor Quebec has delivered us a message that the 'Compromise Agreement', established in 1902 to allow free trade and movement of goods and people between the two countries, is now no longer in effect. This has come slightly as a suprise to our govenrment but it's nothing that concerns us much. The United Commonwealth of America is far larger and it will be mostly their loss to end this agreement. However, this has casued some worry with many invesors that Quebec's government may be planning to further cut economic ties with us."
 Quebec_Neoimps.10.a:0 "What are they doing up there?"
 Quebec_Neoimps.11.t:0 "Quebec Nationalized our Assets!"
 Quebec_Neoimps.11.d:0 "We have recieved news that the government of Quebec has nationalized almost all our assets in their nation. This has caused much outrage from the American republic and many government officals, not just with the current decision of the new government of Quebec but their previous actions as well. We must respond properly if we wish to prevemnt such occurances from happening again."
 Quebec_Neoimps.11.a:0 "Fine! We can play this game. Block all Quebecois products from entering here!"
 Quebec_Neoimps.12.t:0 "America Blocks our Products!"
 Quebec_Neoimps.12.d:0 "As a retaliation for our nationalization efforts, the American government has decided to block any and all sale of Quebecois products within their territory. The United Commonwealth is the largest consumer market not just in the Empire, but all of the world and losing access to it will greatly hurt profits of many of our nation's companies and even government revenue. This has outraged many people in the Anglois provinces who make a living from selling products to America. While we can recover from this by reorienting sale of products exclusively to the domestic market, this will still hurt our finances for some time."
 Quebec_Neoimps.12.a:0 "We can survive without them."
 Quebec_Monarchists.10.t:0 "Reconstruction of Quèbec a Disappointment"
 Quebec_Monarchists.10.d:0 "Once the government of Quebec announced a new program to completely rebuild Quèbec City, the Quebecois population had high hopes, that is until now. Once the reconstruction was declared seemingly finished, many were confused if it was a mistake, but it turned out it was a premature decision. Disappointment is a common feeling among the Quebecois and especially the citizens of Quèbec City and the newly instated monarchy has taken a great hit in it's popularity and public perception."
 Quebec_Monarchists.10.a:0 "We should have done better"
 Quebec_Monarchists.13.t:0 "Reconstruction of Quèbec an Incredible Success!"
 Quebec_Monarchists.13.d:0 "With the new monarchy vowing to restore Quebec to greatness, it was only natural to restore the symbol of Quebec itself, Quèbec City. Great effort was made to bring back the city to what it once was and further add to it, but it is finally complete. No longer shall the scars of Anglois tyranny etch themselves onto Quebec's great city, as the people are hopefull that the monarchy will bring further prosperity and freedom to Quebec."
 Quebec_Monarchists.13.a:0 "À ta santé!"
 Quebec_flavor.1.t:0 "High Frequency of Smog Above the Great Lakes Detected"
 Quebec_flavor.1.d:0 "Today at 8AM on the 15th of January 1933, the Quebec Meteorological Service (Service météorologique du Québec) had detected an unusal amount of smog and pollutants in the air above lake Erie.\n\n These kinds of occurances aren't uncommon around the Steel Belt or Industrial Triangle that reaches the great metropolises of Montreal, Melbourne and Chicagou in one large triangle, with many other industrial and wealthy cities inbetween such as Detroit, Toronto, Buffalo, Frontenac, which all produce heavy machinery and industrial goods, subsequently emiting large swathes of smoke and smog.\n\n However, the cloud of smog that had managed to accumulate above the lake, around 50 kilometers north of Melbourne, has been detected to contain a ludicrous 550 micrograms of pollutants per cubic meter, making any region this cloud passes by almost unlivable. Many weather experts claim this cloud should eventually dipserse with wind heading in different directions but this has certainly worried many meteorologists on whether this is an isolated case or a warning for what's to come if no action to resolve the issue is taken."
 Quebec_flavor.1.a:0 "I'm sure it will be fine."
 Quebec_flavor.2.t:0 "The Sun Fails to Rise in Montreal"
 Quebec_flavor.2.d:0 "As February arrived and a cold breeze swept across Quebec, Montreal remained in its curious bubble of heat. Its people enjoyed the unseasonable warmth, eating ice cream, some even sunbathing in the streets. But on the morning of the 2nd, what should have been a bright, sunny day became one of darkness and choking haze. There were no clouds above—only the city’s great dome, now filled with its own smog. The dome’s filtration mechanisms had ceased to function, and when operators investigated, they discovered a peculiar truth. The air outside the dome was just as thick and poisonous as the air within."
 Quebec_flavor.2.a:0 "That's strange."
 Quebec_flavor.3.t:0 "The Cloud Has Teeth"
 Quebec_flavor.3.d:0 "What began as a dull, choking haze over the Industrial Triangle has grown darker and more alive. In recent days, witnesses in Melbourne, Toronto, and Detroit have reported shapes moving within the smog—serrated outlines, tendrils curling down side streets, and flashes of light like teeth in a gaping mouth. Scientists claim these are optical illusions, the product of electric arcs from the wireless power grid refracting through dense particulates. Yet whole neighborhoods have emptied overnight, their residents claiming the smog 'hunted' them in their sleep.\n\nThe newspapers dismiss it as panic, but the morgues tell another story."
 Quebec_flavor.3.a:0 "Just an illusion... right?"
 Quebec_flavor.4.t:0 "Terror at Noon! Daylight Black as Night!"
 Quebec_flavor.4.d:0 "At exactly twelve o’clock today, the bells of Chicagou rang for the noon hour—but the streets were already as dark as midnight. Witnesses describe the smog thickening in seconds, swallowing light, muffling sound, and bringing an unnatural stillness over the city. Gas lamps and electric streetlights flickered on, their glow swallowed by the haze. Panic broke out as shops shuttered and crowds stumbled blindly through the streets, clutching handkerchiefs to their mouths.\n\nBy nightfall, the death toll was already in the hundreds from trampling, suffocation, and collisions. No one can explain why the cloud descended so suddenly—or why it refuses to lift."
 Quebec_flavor.4.a:0 "We must do something!"
 Quebec_Conservatives.1.t:0 "The Spliting Party"
 Quebec_Conservatives.1.d:0 "Parti Québec Uni has been one of the largest and most influential parties in Quebec for a long time and it has certainly seen better days. With it being such a large party, many different interests have begun competing as a wide range of political doctrines have sprung up in the party's now multiple factions.\n\nThere are the Bleus faction which is the most influential, they represent a more moderate part of the party, their values based on Quebec's strain of conservatism which espouses the values of Quebecois autonomy within the Empire, a robust industrial economy, and fiscal and cultural conservatism as well as support for the Catholic church. Then there are the Ultramontanes which represent the reactionary side of the party which wishes to see supreme papal authority in matters of spirituality and governance. Ultramontanism rejected modern ideals in favour of the supremacy of Catholicism and the Catholic Church in public life as well as complete Quebecois independence. And last are the Château Clique which represent the Anglophone merchant community. Their loyalty stands with money and wealth more than Quebecois nationhood but that does not mean it does not care for the prosperity of all Quebecois and Anglois as well.\n\nWith so many opposing beliefs within the same political party, it has caused much disunity and dysfunction with the opposite political sides of the party calling for the removal of the other. Perhaps, we may have to chose which side we let go."
 Quebec_Conservatives.1.a:0 "We better trust the Ultramontanes to help leading Quebec."
 Quebec_Conservatives.1.b:0 "The Château Clique will help us enrich our populace!"
 Quebec_Conservatives.2.t:0 "A New Start"
 Quebec_Conservatives.2.d:0 "As the Château Clique faction of the United Quebec Party has been kicked out of the party, almost all their influnce in the country has vanished. But that didn't stop them from forming a brand new party in Quebec. It is called Parti de la prospérité du Québec (Quebec Prosperity party) and it's focused on reducing goverment intervention in the economy, granting citizens fundemental rights as well as cooperating with our British benefactors. \n\n The party is not very popular in Quebec however and the most recent polls show barely over 1% of vote share in the Quebecois provinces so far, but who knows if that may change in the future."
 Quebec_Conservatives.2.a:0 "Good riddance!"
 Quebec_Conservatives.3.t:0 "Quèbec City Memorial"
 Quebec_Conservatives.3.d:0 "Some months after Charles Gault ordered a memorial in Quèbec City be constructed, it is now finished. It is meant to represent and recognize all the Quebecois soldiers who fought and died in the Great War for the British Empire. \n\nMany who live in the still ruined Quèbec City are not so pleased. The tragic rebbelion of 1909 is still in many residents' living memory and only now does the government wish to recognize their sacrifice? Even though large portions of the city are yet to be properly reconstructed even 24 years later. To many, this is nothing but a token concession. It is too little, too late and has even risen support for more nationalist parties and organisations of Quebec.\n\nYet there are others who still appreciate the gesture and are glad to be finally noticed by the government in Montreal. Some hope this is a sign that Quebec's native sons are finally getting their due's and in time will be treated equally in the predominatly English empire they are a part of."
 Quebec_Conservatives.3.a:0 "Some good news at least..."
 Quebec_Conservatives.4.t:0 "The Church in Quebec"
 Quebec_Conservatives.4.d:0 "The Roman Catholic Church or just 'Church' as it's reffered to in Quebec is an overwhelmingly influential instituion within all parts of the Commonwealth of Quebec that have a significant French speaking population. Many, especially the ultramontanes, see it as one of the three major pillars of Quebecois identity, that of faith. What distinguished the faith of the Quebecois from the others on the continent is that they were Roman Catholics, whereas the others were Protestants.\n\nThe Catholic church is responsible for many services like schooling (especially in rural areas), hospitals and other such critical services, much to the ire of radical liberals and progressives. Most Quebecois are contnet with this state of affairs and view the church as a divine instituion that provides safety and familiarity during time of uncertainty.\n\n However, the Anglois population is not quite fond of this dominance by a foreign church on their land. Many organisations and people, from the Orange Order, to radical liberals, seek to curtail the influence of the Catholic Church in their areas. Our goverment now has the capability to decide which way they should approach this issue, after all..."
 Quebec_Conservatives.4.a:0 "...faith is what defines us."
 Quebec_Conservatives.5.t:0 "An Envoy to Paris"
 Quebec_Conservatives.5.d:0 "There have been calls from the more nationalist elements within out party to diplomatically reach out to France. Our position as a major Francophone nation within the British empire means that we weren't allowed to have cordial relations with France, especially during the Great War. However, Quebec has become much stronger economically and politically ever since the Great War and with Britain stagnating and France resurging, perhaps opening diplomatic relations with our distant relatives in a world with rising tensions may borne fruit."
 Quebec_Conservatives.5.a:0 "Maurice Duplessis is on his way"
 Quebec_Conservatives.6.t:0 "Le Chef Arrives in Paris"
 Quebec_Conservatives.6.d:0 "Due to the nature of the diplomatic relations between France and the British Empire ever since Doriot took power, Charles Ernest Gault cannot go himself as a representative of the Commonwealth of Quebec, but Maurice Duplessis who is not at the helm, can. He arrived at the zeppelin station in Montreal early in the morning. The trip would be to Frankfurt, or Germania, as some call it. From there, another flight by zeppelin would be taken to Paris itself. As Duplessis flew down in the zeppelin toward the City of Lights, he saw the damaged Eiffel tower out in the distance of the massive megalopolis. Even the great city of Montreal couldn't compare to what Duplessis was seeing in front of him."
 Quebec_Conservatives.6.a:0 "The cradle of Franchophone civilization..."
 Quebec_Conservatives.7.t:0 "Onto Important Matters"
 Quebec_Conservatives.7.d:0 "The next morning, Duplessis left his hotel room to go the Élysée Palace in order to meet [FRA.GetLeader], the leader of France. This was Duplessis' first time ever visiting a foreign nation for a diplomatic exchange and his usual calm and firm demeanor gave way for a more shaky and uncertain voice, but he would do his best for Quebec.\n\nFor the first meeting, Duplessis and [FRA.GetLeader] talked about normalizing relations and reopening their embassies but also to expand relations through trade deals and political support."
 Quebec_Conservatives.7.a:0 "Let's start with a trade deal..."
 Quebec_Conservatives.7.b:0 "Perhaps just reopening relations would be fine..."
 Quebec_Conservatives.8.t:0 "Political Support?"
 Quebec_Conservatives.8.d:0 "An interesting proposal was made by [FRA.GetLeader] at the end of the meeting, the proposal is that France will offer covert political support, especially to pro independence parties and factions like Ultramontanes which Duplessis is a part of himself. This could grealty bolster the chances for Duplessis taking power, but if Britian were to find out, they would undoubtebly be furious."
 Quebec_Conservatives.8.a:0 "Yes, that would be great"
 Quebec_Conservatives.8.b:0 "Uh, Britain wouldn't like that if they found out"
 Quebec_Conservatives.9.t:0 "A Successful Trip"
 Quebec_Conservatives.9.d:0 "Duplessis' trip to Paris has finally concluded. He can confidently say that he did his mission and is glad to have gotten such an opportunity to travel to Paris. Perhaps, Quebec may one day stand with France in a new world order."
 Quebec_Conservatives.9.a:0 "That was interesting"
 Quebec_Conservatives.10.t:0 "A (Mostly) Successful Trip"
 Quebec_Conservatives.10.d:0 "Duplessis' trip to Paris has finally concluded. He can assuredly say that he did his mission and is glad to have gotten such an opportunity to travel to Paris. Still, his choice to refuse political support from the only major Francophone power that can stand to the British may have been a mistake, at least he knows that this will keep stability in the Empire and not come back to haunt him."
 Quebec_Conservatives.10.a:0 "That was interesting"
 Quebec_Conservatives.11.t:0 "Discussion With Duplessis"
 Quebec_Conservatives.11.d:0 "With the Ultramontanes demands of fulfilling the promises of Charles Gault to center the Catholic Church in the political sphere, many in Charles Gault's own faction have proposed that he organize a meeting with Maurice Duplessis, the representative of the Ultramontanes to appease them.\n\nDuplessis himself seems eager to hold a discusion and hopes to get a few concessions from the ruling faction."
 Quebec_Conservatives.11.a:0 "Let's all be reasonable here"
 Quebec_Conservatives.12.t:0 "Métis Integration?" 
 Quebec_Conservatives.12.d:0 "The first proposal for the government of Quebec by Duplessis is to petition for integration of the Métis people as true Quebecois citizens due to their French heritage. Most of the Métis population however, lives in the Confederacy of Free Tribes, particularly the Assiniboia region. Duplessis' solution? Claim their territory as rightfully Quebecois. While this might be controversial even with our British overlords who want to keep the Confederacy stable, Duplessis hasn't mentioned any war with them to take the land, only claim it. Should we go through with this?"
 Quebec_Conservatives.12.a:0 "Uh, sure, I guess?"
 Quebec_Conservatives.12.b:0 "What? No, thats absurd!"
 Quebec_Conservatives.13.t:0 "More Media Exposure for Duplessis?"
 Quebec_Conservatives.13.d:0 "The next proposal by Duplessis is to give him more media coverage by the press working for the United Quebec party. He wishes to show himself off to the Quebecois population as a proper Catholic who has the best interests of Quebec in mind."
 Quebec_Conservatives.13.a:0 "Yes, we're the same party after all"
 Quebec_Conservatives.13.b:0 "I'm not so convinced"
 Quebec_Conservatives.14.t:0 "Rural Investment?"
 Quebec_Conservatives.14.d:0 "The third proposal put forward was a long time issue for Duplessis and many in the Ultramontanes faction. They argue that the funding for infrastructure development should be prioritized to rural areas for now as well as skewing the amount of funds in a certain province for development towards the rural villages.\n\n This will certainly alienate many cityfolk from the United Quebec part but the gains in the rural areas, especially by making a deal with Duplessis, could be worthwhile for us to consider, especially as it would weaken his own standing by having us do what he always promises to."
 Quebec_Conservatives.14.a:0 "Perhaps you have a point..."
 Quebec_Conservatives.14.b:0 "No, the cities are too important"
 Quebec_Conservatives.15.t:0 "A Deal with the Clergy?"  
 Quebec_Conservatives.15.d:0 "Maurice Duplessis has suggested strengthening ties with the Catholic Church by granting them more control over education and welfare services in rural areas. This move, he argues, would reinforce Catholic values among the population and ensure greater support for the Ultramontanes. However, critics within the United Quebec party warn that this could alienate the more progressive factions and set a dangerous precedent of religious interference in governance.\n\nShould we allow this partnership to proceed?"  
 Quebec_Conservatives.15.a:0 "The Church knows what's best for our people."  
 Quebec_Conservatives.15.b:0 "This is a step too far." 
 Quebec_Conservatives.16.t:0 "A Proposal for a Separate Quebecois Army"  
 Quebec_Conservatives.16.d:0 "In a bold move, Duplessis has proposed the formation of a Quebecois regional army under British oversight. He argues that such a force would instill pride in Quebec’s heritage, provide local security, and act as a stepping stone toward greater autonomy. However, the idea has sparked controversy. Some view it as a veiled attempt at militarizing for future independence, while others fear it could strain relations with both the British Crown and neighboring states.\n\nIs this proposal worth pursuing, or should we shut it down?"  
 Quebec_Conservatives.16.a:0 "An army for Quebec is a great idea."  
 Quebec_Conservatives.16.b:0 "This will only cause trouble."  
 Quebec_Conservatives.17.t:0 "Duplessis Discussion"
 Quebec_Conservatives.17.d:0 "After lengthy negotiations, Duplessis isn't very pleased with our conduct. With Charles Ernest Gault disagreeing with most of Duplessis' suggestions on government policy, Duplessis has denounced Gault as an Anglo agent masquerading as a man of the Quebecois people. This outrageous claim has caused much damage and friction within the Quebecois parts of the nation, with Duplessis' associates, who lead prominent news outlets like the *Action Française* monthly magazine, running with the story and exaggerating many parts of it.\n\nMuch of the rural population, who see Duplessis as an honest man fighting for Quebec, believe his words and have begun to look at Charles's reign with suspicion. Our coalition is undeniably damaged, with the Ultramontanes only staying with the party out of necessity as they hope to influence the government again at a better time."
 Quebec_Conservatives.17.a:0 "Well damn him!"  
 Quebec_Conservatives.18.t:0 "Duplessis Discussion"  
 Quebec_Conservatives.18.d:0 "After a long and tense negotiation, Maurice Duplessis has expressed his satisfaction with the agreements reached. Charles Ernest Gault's willingness to listen to Duplessis' proposals and find common ground has bolstered the unity of the United Quebec party, at least for now. The Ultramontanes are pleased with their influence increasing in governemnt affairs as they hope to one day become the dominant faction of the United Quebec Party.\n\nThis resolution has not only stabilized the coalition but also improved the government's standing among Quebecois conservatives, especially in rural communities. While challenges remain, this agreement marks a significant step toward consolidating support within the party."  
 Quebec_Conservatives.18.a:0 "A united Quebecois front, for now." 
 Quebec_Conservatives.19.t:0 "Hit The Ground Running"
 Quebec_Conservatives.19.d:0 "As the Ultramontanes of the United Quebec Party have been kicked out of the party, the balance between the factions has been greatly shifted as the Ultramontanes were a very powerful group in the party. With Mauirce Duplessis being a very influential figure, he has saw it fit to create a new political party purely out of the former Ultramontanes. It is called the National Union or Union Nationale, a conservative and nationalist party focused on Catholic social teachings. \n\n The National Union is predicted to gain many seats in the next election and heavily contest the United Quebec Party as many rural voters and Quebecois nationalists are expected to flock to it."
 Quebec_Conservatives.19.a:0 "Lets hope they don't cause trouble."
 Quebec_Conservatives.20.t:0 "Curtailing the Primacy of the Catholic Church"
 Quebec_Conservatives.20.d:0 "For almost a century now, the Catholic church has been seen as one of the main pillars of Quebecois society, which allowed the Francophone region to resist Anglo encroachment. \n\n However, this century has allowed much consolidation of power from the Church onto the government, and is responsible for many services like schooling (especially in rural areas), hospitals and other such critical services. This has led to much institutional abuse and unsatisfactory service. If we wish to progress into the 20th century, the Commonwealth of Quebec must adopt the ideas of the Enlightenment dating back to the 17th century of seperation between church and state. \n\n While many will not appreaciate this gesture, and will have difficulty finding support even among the Bleus, it will most certainly cool relations with the Anglois and proivde more control to the government if need be."
 Quebec_Conservatives.20.a:0 "Harsh but necessary"
 Quebec_Conservatives.21.t:0 "Ultramontanes Political Demands"
 Quebec_Conservatives.21.d:0 "The Ultramontanes faction within the United Quebec party has submited a set of demands from the Charles Gault governemnt to comply with. If they are not met, the letter says, Charles' own faction cannot expect support for any policies in parliment from the Ultramontanes."
 Quebec_Conservatives.21.a:0 "Can't they see we are already in crisis?"
 Quebec_Conservatives.22.t:0 "Château Cliques Political Demands"
 Quebec_Conservatives.22.d:0 "The Château Clique faction within the United Quebec party has submited a set of demands from the Charles Gault governemnt to comply with. If they are not met, the letter says, Charles' own faction cannot expect support for any policies in parliment from the Château Clique."
 Quebec_Conservatives.22.a:0 "Can't they see we are already in crisis?"
 Quebec_Conservatives.23.t:0 "The Automation Crisis in Quebec!"
 Quebec_Conservatives.23.d:0 "When the papers and radio stations in the Commonwealth of Quebec first heard of the automation crisis in the United Kingdom, it had a similar reaction to United Commonwealth. It was nothing major, at least compared to the developing issue of air pollution rapidly increasing. However, once the Quebecois EIEC branch began selling off machines to domestic companies, the issue became apparent.\n\n Countless factories with thousands of workers, suddenly were empty of life, replaced by machines. Both Quebecois and the Anglois populations faced disaster and began blaming each other as usual. The massive increase of relativelt cheap labour drove down wages of the average citizen, reducing purchasing power and demand, causing deflation.\n\nThe worst scenario had come true, Quebec was to face an economic, a social and a public health crisis when its government could least afford it."
 Quebec_Conservatives.23.a:0 "More troubles? Bah!"
