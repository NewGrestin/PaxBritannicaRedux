 QUE_Legacy_1909:0 "Legacy of 1909"
 QUE_Legacy_1909_desc:0 "1909 would prove to be a turning point in Quebec. The disastrous losses in the Great War, a war many felt to be an “Englishman’s war,” fuelled a fire that would end up burning through Quebec City. The people of Quebec City raised the flag of revolt against Laurier’s pro-war government and were met with Anglo-American guns. The fire would soon become literal as Anglo-American troops razed the city and burned any bridges that connected the Quebecois people and her imperial siblings. The flames of 1909 have ignited a burning fire inside Quebec that will not, cannot be extinguished by any force of foreign arms."
 QUE_Legacy_1909_1:0 "Legacy of 1909"
 QUE_Legacy_1909_1_desc:0 "1909 would prove to be a turning point in Quebec. The disastrous losses in the Great War, a war many felt to be an “Englishman’s war,” fuelled a fire that would end up burning through Quebec City. The people of Quebec City raised the flag of revolt against Laurier’s pro-war government and were met with Anglo-American guns. The fire would soon become literal as Anglo-American troops razed the city and burned any bridges that connected the Quebecois people and her imperial siblings. The flames of 1909 have ignited a burning fire inside Quebec that will not, cannot be extinguished by any force of foreign arms."
 QUE_Great_White_North:0 "Great White North"
 QUE_Great_White_North_desc:0 "The Great White North has been a constant feature of the Americas since the Ice Age. Following the receding of the glaciers, the land was flayed and scarred, revealing a bountiful harvest of metals and materials. The region has become an El Dorado for the people of Quebec, both in its sheer potential wealth and in its unattainability. The region’s climate makes habitation impossible and large-scale resource extraction a fantasy. But nature is no match for the human mind as Program ‘Aeternus Solaris’ caused many to speak in hushed tones of taming the northern wastelands. Now, the country speaks louder, demanding that the government take every action to establish Quebec’s city on a hill."
 QUE_Anglois_Tensions_Very_Low:0 "Anglois Tensions - §1Very Low§!"
 QUE_Anglois_Tensions_Very_Low_desc:0 "The Anglois provinces are a strange exclave of Anglo-American civilization in a local sea of Quebecois culture. Having been given significant autonomy in 1837 during the Centralization Era of Quebecois history, the Anglois provinces have long fought for autonomy and independence with both their words and their rifles. The relationship between the Anglois minority and Quebecois majority has fluctuated over the years; currently, there is a very low amount of tension between the two groups."
