 QUE_charles_gault:0 "Charles Ernest Gault"
 QUE_charles_gault_desc:0 "§YBorn:§! 9/19/1861\n\n§YCharles Ernest Gault§! is the fading patriarch of Quebec's old order. Born to working-class Scots-Irish immigrants in the heart of Montreal, Gault has seen the city change alongside him over the decades as it warped from the provincial capital of thousands of his past to the megacity of millions of his present. Similarly, Gault himself has undergone significant changes; starting as a clerk and eventually rising to Vice President of the Montreal Stock Exchange, he later volunteered as a soldier in Imperial Expeditions across Africa and eventually became the staunch voice of Quebecois conservatism. His political career began as a Conservative assembly member and later as the economic minister, serving in five ministries across two centuries. This remarkable tenure earned him the moniker “Old Man of Quebecois Politics,” a nod to both his age and his old-fashioned views. As 1930 came to Quebec, Gault secured his own ministry as the head of the Parti Québec Uni, a union of right-wing groups ranging in their political views from nationalist monarchism to anarcho-capitalists.\n\nHowever, Gault's prominence has waned as calls for his resignation have come from all sides. His ministry, which rode into power on a wave of optimism at the start of the new decade, has yet to achieve much in its three years in power. Now, Gault focuses more on maintaining his fracturing coalition, his key to power, than accomplishing his popular promises. Despite being Anglois himself, tensions between the central government and the Anglois provinces have only intensified, with many viewing him as a traitor to his heritage. The working class, whom he once represented, denounce him as a sellout. The Duplessis faction and the Ultramontanes within his own party accuse him of the ultimate betrayal: subservience to Britain. Universally blamed for the economic stagnation and weakened central government, Gault is widely seen as a failure. His re-election prospects appear bleak, and the pressing question on everyone's mind is: §Rwho will succeed him?§!"
