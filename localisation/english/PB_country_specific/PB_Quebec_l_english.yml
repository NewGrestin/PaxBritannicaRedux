 PB_QUE_Rebuilding_Quebec_desc:0 "\n \n \n \n \n \n Quèbec City is still in shambles after the 1909 rebellion and the occupation that followed. Even 24 years after the rebbelion, the city still hasn't returned to it past strength. What little effort to rebuild the city in these 24 years has only made the city bareable to live in. We must work hard to restore it to its previous state. The public perception of our efforts will reflect on how much we did to rebuild the city. \n Current reconstruction score is [?quebec_city_reconstruction|Y.0]§Y/10§!"
