 PB_Culture_Montrealais_tt:0 "Montrealais"
 PB_Culture_Montrealais_tt_delayed:0 "Few words could better describe the Montrealais people better than contemplative, creative, and charismatic. After all, Montreal has fostered Quebec’s greatest thinkers, artists, and orators and is the international face of the country. However, the face of the country has evolved to slowly diverge from the body as the Montrealais people find themselves to be an increasingly minor voice of reason that’s drowned out by the thundering of Quebec’s demagogues. The result is a culture that is clearly rooted in but has diverged significantly from its surroundings, a people that reach for the future while all those around them look back towards the past, a group that, like Cassandra of Troy, can see the future but is helpless to stop it."

