 QUE_Political_Tug_Of_War:0 "Political Tug of War"
 QUE_Political_Tug_Of_War_desc:0 "\n \n \n \n \n \n The political situation in Quebec ever since the Great War and the events of 1909 can only be characterized as unstable and chaotic. The Quebecois population is increasingly  turning more radical and towards the right while the Anglois population and many  residents of Montreal are trying to push a progressive agenda and turn Quebec into a more liberal parlimentary democracy. Only one side can come out on top and shape the future of Quebec. \n \nCurrent political strenght of the §tLeft§!:[?left_power|Y]   §CCentre§!:[?centre_power|Y]  §gRight§!:[?right_power|Y] \n\nThe §tLeft§! and §CCentre§! both have a united goal of perserving democracy and weakening the §gRIght§!'s power so they will work together in order to increase their chances of succedding. However, how strong either faction comes out in the case of victory will have significant consequences. \n\nCurrent combined power of the §CCentre§!-§tLeft§! is  §Y[centre_left_power]§!."
 QUE_Automation_Crisis_Smogbowl:0 "Automation Crisis/Smogbowl"
 QUE_Automation_Crisis_Smogbowl_desc:0 "\n \n \n \n \n \n Quebec has found itself in a crisis worse than the Rebellion of 1909. Our people stand on polluted streets, waiting in line for bread crusts and soup. Those lucky enough to still have work are seeing their wages plummet to unprecedented depths, causing deflation of the Quebecois pound as purchasing power collapses. Hospitals are overflowing with patients suffering from a wave of respiratory diseases caused by deadly levels of smog.\n\nWe stand on thin ice—never has Laurier’s dream of a §2Quebecois Century§! felt more distant. If we fail to weather this storm, there may not be a Quebec left on this Earth. The Anglois population is growing restless, demanding government aid, while our own native sons suffer under the same dire conditions.\n\nWe must choose carefully which group to prioritize, and which crisis to confront first.\n\n§RMay God help us all.§!"
