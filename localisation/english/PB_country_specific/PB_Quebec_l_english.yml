 QUE_Black_Sheep:0 "Black Sheep of the Empire"
 QUE_Black_Sheep_desc:0 "Quebec is unique among the commonwealths of the British Empire for being what some have generously called “the adopted, Gallic bastard.” Quebec speaks French in a realm where English is the dominant tongue, her churches house catholic cardinals in an empire where the Anglican Church is the word of God, and her people hail from the sun-baked Mediterranean in an empire that breathes in the Atlantic breeze. Quebec has always been the strange child of the empire, and she will remain that way as long as she stays in it."
 QUE_Black_Sheep1:0 "Black Sheep of the Empire"
 QUE_Black_Sheep1_desc:0 "Quebec is unique among the commonwealths of the British Empire for being what some have generously called “the adopted, Gallic bastard.” Quebec speaks French in a realm where English is the dominant tongue, her churches house catholic cardinals in an empire where the Anglican Church is the word of God, and her people hail from the sun-baked Mediterranean in an empire that breathes in the Atlantic breeze. Quebec has always been the strange child of the empire, and she will remain that way as long as she stays in it."
