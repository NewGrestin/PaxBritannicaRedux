 QUE_legacy_of_the_ancien_regime_desc:0 ""
 QUE_our_own_path:0 "Our Own Path"
 QUE_our_own_path_desc:0 ""
 QUE_expand_churchs_power:0 "Expand Church's Power"
 QUE_expand_churchs_power_desc:0 ""
 QUE_this_is_not_a_coup:0 "This is Not a Coup"
 QUE_this_is_not_a_coup_desc:0 ""
 QUE_the_humble_farmer:0 "The Humble Farmer"
 QUE_the_humble_farmer_desc:0 ""
 QUE_an_end_to_the_abominations:0 "An End to the Abominations"
 QUE_an_end_to_the_abominations_desc:0 ""
 QUE_a_glorious_quebec:0 "A Glorious Quebec"
 QUE_a_glorious_quebec_desc:0 ""
 QUE_death_of_the_anglois:0 "Death of the Anglois"
 QUE_death_of_the_anglois_desc:0 "The Anglois are a fake race, made up by the Americans and British to destory Quebec's culture. We will not let this happen, the Anglois will be dealt with."
 QUE_the_church_knows_best:0 "The Church Knows Best"
 QUE_the_church_knows_best_desc:0 "The Catholic church can be best trusted with helping us change the minds of Anglois to be more in line with Quebecois culture and customs."
 QUE_use_the_montrealais:0 "Use The Montrealais"
 QUE_use_the_montrealais_desc:0 "If the Anglois don't want to adopt the more rural and patriotic customs of regular Quebecois, then the people of Montreal, or Montrealais, are a perfect example of an industrious French speaking culture for the Anglois to emulate."
 QUE_all_equal_under_the_fleurdelise:0 "All Equal Under the Fleurdelisé"
 QUE_all_equal_under_the_fleurdelise_desc:0 "Every man living in Quebec will know his place in society. Everyone will be equal under Quebec's flag, wether they want it or not."
 QUE_a_catholic_education:0 "A Catholic Education"
 QUE_a_catholic_education_desc:0 "In order for the Cahtolic chruches help to bear fruit, we must first instil catholic values in the people of the Anglo provinces and introduce catholic classes in school for children to grow up trusting the Catholic church, instead of the Anglican impostors. Catholicism is the only way."
 QUE_integration_not_extermination:0 "Integration not Extermination"
 QUE_integration_not_extermination_desc:0 "It must be made clear to the Anglois population that we do not wish to exterminate ot get rid of them in any way. Instead, we wish for the Anglois to finally learn how to be like Quebecois and fully integrate into the greater society, or else."
 QUE_vous_parlez_francais:0 "Vous Parlez Français"
 QUE_vous_parlez_francais_desc:0 "No matter what we try, the Anglois are stubborn. They do no wish to integrate and adopt our customs and they keep grumbling and agitating together. Very well then, we shall take away what allows them to do this, their language. English will be exterminated from use in schools, shops, and any public places. Quebec's offical language is French, and only French."
 QUE_lessons_from_laicite:0 "Lessons From Laicite"
 QUE_lessons_from_laicite_desc:0 "The state is the greatest instument in affecting people's lives and behaviour. Some may say that the church would be better at subtly affecting the people, but that is too slow! In all Anglois provinces, the government will ruthlessly assimilate the entire population into proud Quebecois."
 QUE_ban_offical_use_of_english:0 "Ban Offical Use of English"
 QUE_ban_offical_use_of_english_desc:0 "The English language will be completely rooted out off all govermental and educational uses. English will be taken out of schools, hospitals, shops, roadsigns and French will be the only language left."
 QUE_the_scoop:0 "The Scoop"
 QUE_the_scoop_desc:0 "With how stubborn the people of the Anglois provinces are, our assimilation policies are not working as well as we would have hoped. A radical approach may be necessary, the plan is to take young, impressionable children from Anglois parents and raise them as pure Quebecois. This may not be without consequences however."
 QUE_embrace_the_cult_of_personality:0 "Embrace the Cult of Personality"
 QUE_embrace_the_cult_of_personality_desc:0 "Many people of the Anglois provinces are looking towards the United Commonwealth for salvation from our rightful policies. This will not suffice, they shall instead look towards Adrien Arcand, our glorious leader, for inspiratiot though government sponsored non-stop propaganda in the southern provinces."
 QUE_learn_with_beatings:0 "Learn With Beatings"
 QUE_learn_with_beatings_desc:0 "If they won't learn the nice way, they will learn the hard way. Anyone who opposes our policies will be silenced or liqiufied."
 QUE_from_one_a_million:0 "From One a Million"
 QUE_from_one_a_million_desc:0 "Unfortunately as it is, Quebecois population count is still smaller than the Anglois. Nevertheless, with new technologies that are discovered, we may be able to tip the scales."

 QUE_quebecs_armed_forces:0 "Quebec's Armed Forces"
 QUE_quebecs_armed_forces_desc:0 "Quebec is well known around the world for having a rather small, but highly professional army. That much was proven in the Iberian campaign during the Battle of Reinosa where Quebecois soldiers fought in the town room by room against the Spanish forces and defeating them decisively."

