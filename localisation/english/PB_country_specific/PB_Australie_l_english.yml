  ### LEADERS ###
  AST_francois_bernadotte: "Jean François Bernadotte"
  AST_henry_drenay_sandoval: "Henry Drenay Sandoval"

  ##########################
  # IDEAS
  ##########################
  PB_AST_Head_Upside_Down:0 "Le Monde à l'Envers"
  PB_AST_Head_Upside_Down_desc:0 "“C'est le monde à l'envers” — roughly translated as “It's a topsy-turvy world” — is a popular expression commonly used to describe a situation in which common sense is flipped over and where all kinds of logic have seemingly vanished as a result. It is also certainly what best describes the ongoing Bernadotte rule over the former French ultramarine territory of Australie. \n\nAlthough he may like to fashion himself as nothing but a benevolent Regent in a country left without a King, the eternal marshal has in fact consolidated near absolute power since the end of the Great War. Such iron-fisted governance came with its many quirks — leftovers of a Victorian mindset impervious to any kind of social progress, ingrained in a half-mechanical brain which cannot die nor evolve past the last century. \n\nWhile the neighboring Magellania likes to fashion itself as a dictatorship in modern clothing, Australie appears like a product of past Capetian absolutism in that regard. Once a beacon of social and cultural progress akin to its Southward, English-speaking relative, Australie now lives under the oversight of militarymen and self-proclaimed aristocrats. An unwilling testing ground for a feudal system in which neither women nor indigenous people exist as individuals; a land where any labour regulation is but a distant memory, any freedom stifled, whereas the sound of military marches and production lines remains the sole rhythms that can be heard in a nation otherwise silenced. \n\nBut Bernadotte's ambitions surely does not stop at the border of his own domain. With repeated threats toward not only the New Provence separatists, but the many nations of Australia, neighboring powers fear the worst should the Regency be left unchecked by the complacent and overextended German authorities."
  
  PB_AST_German_Economic_Dominance:0 "German Economic Dominance"
  PB_AST_German_Economic_Dominance_desc:0 "While Australie is officially independent, its economy is completely dominated by German interests. The German Pacific Commonwealth directly controls all major Australien ports, and with it all Australien imports and exports. This immense economic influence is felt throughout much of Australien society, and is doing little to endear the German 'protectors' to the populace."
  PB_AST_Forced_Demilitarisation:0 "Forced Demilitarisation"
  PB_AST_Forced_Demilitarisation_desc:0 "Australie was heavily demobilised following the Great War, and is still allowed little more than a token force by its German masters. As a result, the country is totally reliant on the German Pacific Commonwealth for protection and lacks any sort of basis for an officer corps or doctrinal evaluation."
  PB_AST_Rising_Unrest:0 "Rising Unrest"
  PB_AST_Rising_Unrest_desc:0 "Conditions in Australie have hardly improved since the Great War, with local rights and reforms frequently curtailed by German officials for their own benefits or short-term gains. Many fear tensions in Australie are reaching a boiling point, and may result in a widespread revolt against German authority if pushed too far."
  
  PB_AST_Brevie_Government:0 "The Brévié Government"
  PB_AST_Brevie_Government_desc:0 "Jules Brévié's collaborator government is the only stabilising force in the country's increasingly restless social climate. While his attempts at reform are usually subverted or vetoed by the German authority, Brévié remains an assertive and principled governor capable of maintaining some semblance of harmony between the Australiens and their German 'protectors'. Many both within and out of the government see him as the only thing standing between Australie and total disorder."

  PB_AST_Resistance:0 "Those Who Resist"
  PB_AST_Resistance_desc:0 "When Bernadotte attempted to subdue Australie to his petty tyranny, we arose to prevent the endarkenement he promised to all. We fought restlessly, the spirits of 1789 granting us the will to stand tall despite our opponent's vast military superiority. \n\nAbandoned by all and surrounded by nothing but enemies of freedom, diminished and desperate to the point of being forced to withdraw to the Northern country, it first appeared we wouldn't be able to withstand the storm despite our many sacrifices. Then, jumping in like a vulture on dead bodies, Germany suddenly offered its mediation — threatening to intervene should a compromise not be found. In a strange twist of fate, the hated Austrians, guided solely by the desire to further undermine the already derelict Bourbon colonial Empire, saved us with a stroke of the pen. Left independent in the northernmost part of our former country, we soon became a beacon for those oppressed not only in the Regency, but everywhere in Australia — attracting exiles from all corners of the continent, all ready to serve the cause even in death. \n\nShould the despot attempt to stifle our experiment once more, he will be met with the renewed resistance of our people and our reconstituted arsenal. For New Provence patriots would rather see their newfound haven burnt to the ash than relinquishing a single Right to the tyrants of this world."
  PB_AST_Cher_Pays:0 "Cher Pays de mon Enfance"
  PB_AST_Cher_Pays_desc:0 "If it is said that people are to be bound to lands and traditions, then the people of New Provence assuredly diverge from the norm. Pushed to the path of exile from mainland France — sometimes from much further away — only to be once again expelled from their homes southward, the citizens of the small Republic have been uprooted on numerous occasions. Despite strong civic traditions and a sense of duty emulated through their grueling struggle against Bernadotte's Regency, most inhabitants remain apathetic — their minds filled with nostalgia and fantasised images of the past. \n\nThe cultural life of New Provence is largely dominated by such homesickness; a trait which often translate into outright desperation that only drugs and other grotesque entertainments are able to suppress. \n\nIn the end however, the Spleen remain everpresent, recalled by vision of a homeland close to the heart, yet distant from everything else."
