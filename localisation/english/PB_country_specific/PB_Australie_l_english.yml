  FST_francois_bernadotte: "Jean François Bernadotte"

  ### ADMIRALS ###
  FST_francois_bernadotte: "Jean François Bernadotte"

  ##########################
  # IDEAS
  ##########################
  FST_Head_Upside_Down:0 "Le Monde à l'Envers"
  FST_Head_Upside_Down_desc:0 "“C'est le monde à l'envers” — roughly translated as “It's a topsy-turvy world” — is a popular expression commonly used to describe a situation in which common sense seems flipped over and where all kinds of logic have seemingly disappeared as a result. It is also certainly what best describes the ongoing Bernadotte rule over the former French ultramarine territory of Australie. \n\nAlthough he may like to fashion himself as nothing but a benevolent Regent in a country left without a King, the eternal marshal has in fact consolidated near absolute power since the end of the Great War. Such iron-fisted governance came with its many quirks — leftovers of a Victorian mindset impervious to any kind of social progress, ingrained in a half-mechanical brain which cannot die nor evolve past the last century. While the neighboring Magellania likes to fashion itself as a dictatorship in modern clothing, Australie appears like a product of past Capetian absolutism in that regard. Once a beacon of social and cultural progress akin to its Southward, English-speaking relative, Australie now lives under the oversight of militarymen and self-proclaimed aristocrats. An unwilling testing ground for a feudal system in which neither women nor indigenous people exist as individuals; a land where any labour regulation is but a distant memory, any freedom stifled, whereas the sound of military marches and production lines remains the sole rhythms that can be heard in a nation otherwise silenced. \n\nBut Bernadotte's ambitions surely does not stop at the border of his own domain. With repeated threats toward not only the New Provence separatists, but the many nations of Australia, neighboring powers fear the worst should the Regency be left unchecked by the complacent and overextended German authorities."
  
  FST_German_Economic_Dominance:0 "German Economic Dominance"
  FST_German_Economic_Dominance_desc:0 "While Australie is officially independent, its economy is completely dominated by German interests. The German Pacific Commonwealth directly controls all major Australien ports, and with it all Australien imports and exports. This immense economic influence is felt throughout much of Australien society, and is doing little to endear the German 'protectors' to the populace."
  FST_Forced_Demilitarisation:0 "Forced Demilitarisation"
  FST_Forced_Demilitarisation_desc:0 "Australie was heavily demobilised following the Great War, and is still allowed little more than a token force by its German masters. As a result, the country is totally reliant on the German Pacific Commonwealth for protection and lacks any sort of basis for an officer corps or doctrinal evaluation."
  FST_Rising_Unrest:0 "Rising Unrest"
  FST_Rising_Unrest_desc:0 "Conditions in Australie have hardly improved since the Great War, with local rights and reforms frequently curtailed by German officials for their own benefits or short-term gains. Many fear tensions in Australie are reaching a boiling point, and may result in a widespread revolt against German authority if pushed too far."
  
  FST_Brevie_Government:0 "The Brévié Government"
  FST_Brevie_Government_desc:0 "Jules Brévié's collaborator government is the only stabilising force in the country's increasingly restless social climate. While his attempts at reform are usually subverted or vetoed by the German authority, Brévié remains an assertive and principled governor capable of maintaining some semblance of harmony between the Australiens and their German 'protectors'. Many both within and out of the government see him as the only thing standing between Australie and total disorder."
