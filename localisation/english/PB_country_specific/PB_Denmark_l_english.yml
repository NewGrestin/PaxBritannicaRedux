  ### LEADERS ###
  DEN_wilhelm_i: "Wilhelm I"
  DEN_wilhelm_i_leader_desc: "§HBorn:§! §Y10/8/1844 in Copenhagen, Kingdom of Denmark§!\n\n§YKing Vilhelm I§!, born Prince Vilhelm of Hesse-Kassel, was the only son of King Frederick VIII of Hesse-Kassel and Grand Duchess Alexandra Nikolaevna of Russia — a mother he never knew, for she died bringing him into the world. It is said this loss shadowed him from birth, and that his maternal grandparents, the Grieving Alexander I and Alexandra Feodorovna grieving a daughter they had married off with such hope, never fully forgave the distant northern kingdom that had taken her from them. Wilhelm grew up acutely aware of the weight his birth carried: he was not merely a prince, but a living debt owed to Russia, the price of an alliance paid in his mother's life.\n\nHis father's ascension as Frederick VIII had come out of the Schleswig-Holstein succession crisis, a resolution that delighted St. Petersburg, whose youngest daughter of Nicholas I had sat as queen in Copenhagen, drawing Denmark tightly into the Second League of Armed Neutrality and, by extension, into Russia's orbit — a position that defied both the Bourbon and British spheres and had, for a time, made Denmark feel untouchable.\n\nWhen Wilhelm came to the throne in 1884 following his father's abdication and death, he carried with him not policy but inheritance of a certain feeling — a son's need to honor a mother he never met by proving himself worthy of her family's trust. He opened Bornholm to Russian warships bound for war with Japan , as if repaying a debt only he could feel the weight of. He believed, perhaps desperately, that Denmark and Russia stood as equal partners bound by blood and sacrifice.\n\nThat belief had soon sought to break him. When Russia abandoned Denmark during the '26 War with Sweden, Danish soldiers watched northern Norway torn away and folded into Swedish hands, while Swedish guns held Copenhagen's straits under siege. Germany and Britain, long since estranged from Russia after the Great War split them apart, offered nothing — Denmark had backed a friendship it treated as family, and family had let it drown. For Wilhelm, this was not merely a strategic betrayal but a personal one, committed by cousins he had trusted in St. Petersburg. He withdrew from public life afterward, seen rarely and trusted fewer, a king who had spent his reign trying to settle an inherited grief, only to be handed a new one of his own, similar in percieved naivity as he was when he was born." 
 
