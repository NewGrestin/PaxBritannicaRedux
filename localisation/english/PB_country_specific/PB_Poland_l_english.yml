PB_POL_Project_Archangel:0 "Project Archangel"
PB_POL_Project_Archangel_desc:0 "\n\n\n\n\n\nShortly after the fall of the First National Awakening, in the age of great breakthroughs in bioengineering, the idea arose to give individuals with no hope of rehabilitation a chance to redeem their crimes. Thieves, murderers, rapists, perverts, deviants, and terrorists would atone for their sins by sacrificing their bodies. The human brain is the closest thing to a perfect analytical machine that humanity currently possesses. What if we applied the right conditioning, took this treasure from those who do not deserve it, and found a more responsible role for it?\nThus the Archangel Project was born — a plan to create synthetic beings whose task would be to protect the population from all threats, especially those linked to moral decay. The initiative was considered in the early 1920s but, unfortunately, was abandoned rather quickly. Today, with the death of Roman Dmowski and the scales seemingly fallen from everyone’s eyes, it can be said with certainty: the Archangels hour has come.\n\nNumber of available prisoners: §Y[?POL.POL_Archangel_Prisoners]§!"
