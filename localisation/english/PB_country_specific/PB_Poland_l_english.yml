PB_POL_Rebirt_Of_The_Archangel_Project_desc:0 "§OTrapped within these walls\nYou left our souls to drip away\nThe ink decays\nThe walls at bay\nBut the reckoning has come today§!"
PB_POL_We_See_You:0 "We See You..."
PB_POL_We_See_You_desc:0 "§OWe're just cartoons for your portrayal\nTo tell some tale about a boat and sail\nBut sure this inevitably unveils the fail\nSplashes of eternal hate\nWill flood the floor and clean the slate§!"
PB_POL_We_Hear_You:0 "We Hear You..."
PB_POL_We_Hear_You_desc:0 "§ONod your head to the beat of death\nAs you draw your last eternal breath\nSensations\nOf an invasion\nStart to course right through our veins§!"
PB_POL_We_Live_In_Your_Walls:0 "We Live in Your Walls..."
PB_POL_We_Live_In_Your_Walls_desc:0 "§OSo prepare for adventure\nWe're a whole new creature from the darkest side\nYou can't take away the pain we feel\nCreated as monsters that come to life§!"
PB_POL_We_Are_You:0 "WE ARE YOU"
PB_POL_We_Are_You_desc:0 "§OI am alive\nImmortalized\nYou're the creator\nYou traitor\nThere's no vaccine\nTo cure our dirty needs\nFor now you must\nBuild up our machine\nYou die tonight§!"
