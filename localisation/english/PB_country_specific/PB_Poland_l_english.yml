a_ownership] costs: §Y[?POL.OIL_Salt_Balka_Price]§!\n[get_Malgobekneft_ownership] costs: §Y[?POL.OIL_Malgobekneft_Price]§!\n[get_Oysungur_ownership] costs: §Y[?POL.OIL_Oysungur_Price]§!\n[get_Aleksandrovskoye_ownership] costs: §Y[?POL.OIL_Aleksandrovskoye_Price]§!\n[get_North_Maykop_ownership] costs: §Y[?POL.OIL_North_Maykop_Price]§!\n[get_South_Maykop_ownership] costs: §Y[?POL.OIL_South_Maykop_Price]§!"

