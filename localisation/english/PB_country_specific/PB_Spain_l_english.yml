  PB_SPR_Iberia_Annihilated:0 "Scars of the Iberian Campaign"
  PB_SPR_Iberia_Annihilated_desc:0 "The Invasion of Iberia by the Imperial Powers during the Great War was, indisputably, one of the most destructive events in the history of the region. While the Iberian Campaign remains a traumatic memory to Anglo-American troops across the pond, the people of Iberia continue to experience it acutely every day. More than two decades on from the war, Northern Spain remains a blasted hellscape outside the Basque region, with Livewire infestation and chemical residue leaving whole tracts of land uninhabitable.\n\nThe trauma of the Invasion and Occupation weighs heavy on the civilian population, who suffered from Zeppelin terror bombings and reprisals by British troops, who were often demoralized by Spanish resistance attacks. Though efforts have been made to re-establish control over the North, the Spanish government still maintains a series of large exclusion zones around Great War battlefields."
  PB_SPR_Starvation:0 "Living On Bread Alone"
  PB_SPR_Starvation_desc:0 "Ever since the Overlord Campaign, Spain has continued to be prone to starvation in much of the country.\n\nMore than half of the cultivated land and ninety percent of the wheat supply were lost to the Containment Zones, and the resulting famine claimed almost twice as many lives as the Great War that had just come upon it.\n\nAlthough global imports have continued to flow into Spain in an effort to alleviate the humanitarian catastrophe, the nation still falls far below the threshold of human decency—breeding a generation of farmers’ sons who had to witness the struggles of their fathers, angry yet without a proper instrument to channel it into.\n\nThe government’s lackluster response has brought them to the brink of annihilation on many occasions. Now, with growing angst and desperation among the population, Inquisitor-aligned Cofraternities and groups across the Order have declared a mass hunger strike, demanding a crackdown on Jacobins and sweeping concessions on food controls.\n\nWith such a vast portion of the population participating, it is not unreasonable to think that Spain’s famines and massacres might soon be the least of their worries."
  PB_SPR_Mongrel_State:0 "Disorderly Orders"
  PB_SPR_Mongrel_State_desc:0 "\n\n£GFX_SPR_Disorderly_orders\n\n\n\n At the summerset of the Fatima Revolutions, as the sun danced in the sky to the tune of trumpets echoing from heaven and the voices of millions rising in song below, the government's response was underwhelming. Dismissing the event as little more than a charade that had gained too much traction, they failed to grasp its significance. In response, a wave of protests erupted across Spain.\n\nThe four great military orders—Santiago, Calatrava, Alcántara, and Montesa—had long been stripped of their power after the monarchy’s fall at Tours. But now, sensing an opportunity in the government’s fervent and heretical agenda, they seized the moment. Violence flared as they called for an all-out revolution, mirroring the upheaval in Portugal. New paramilitary factions emerged, functioning as de facto orders, though their loyalty lay not with the Church’s central authority, but with the revolution in Fatima.\n\nYet, as chaos spread, the old orders found unexpected allies among the monarchists, uniting to overthrow the Republic. Once in power, they swiftly cracked down on rogue factions, forcing them to fall in line. But even as they restored order, a lingering fear remained—would the revolution they had ignited one day turn against them?"
  PB_SPR_Civil_War_Aftermath:0 "Pecador, Contempla"
  PB_SPR_Civil_War_Aftermath_desc:0 "\n\n\n\n\n\n\n£GFX_TT_Apostasy_to_Sanity\n\n\n\n\n\n\n\n\nThe mania that engulfs Spanish society can all be attributed to one thing — a trauma response. For each time the Spanish people face war, revolution, humiliation, and torture, the nation lies dormant, separated from reality and locked in a state of complete paralysis. Like a martyr too long upon the rack, Spain no longer cries — she forgets how. \n\nComplete paranoia consumes her children. Infants are dressed in vestments without a single thought as to why, hollow rites professed without a hint of insight, Processions wind through every street night and day, incense choking the air, bells tolling for no one. At the mere whisper of sin, men fall to their knees — begging, weeping, screaming for mercy in repentance for what is effectively a punishment extending to every soul in the Spanish state. \n\nAnd yet Spain lives, somehow. In her stillness, she replays every invasion, every treaty, every misstep as if reliving an unending Passion. It is not history, but a judgment — one great trial stretching toward the end of days. She pleads nothing, sitting still in silence but not for submission, but expectation. \n\nAnd if the memory of Spain is not one of conquest or empire — it is one of condemnation. Her body may rot in chains, but her heart beats like the Sacred Heart itself: surrounded by thorns, afire, and still bleeding."
  

  
