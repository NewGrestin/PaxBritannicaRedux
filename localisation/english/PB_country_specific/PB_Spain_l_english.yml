  spain.1.t:0 "Embattled, Yet Hopeless?"
  spain.1.d:0 "With the Fall of France and our Enemies gather at every border and shore around our Holy State, we have to come to terms with the fact that we might not be wholely undefeatable, perhaps it was God's wishes for Spain to bring the world under his command, but today might not be that day, and this war may not be that war, perhaps another day."
  spain.1.a:0 "God gives us one more chance, another time."
  spain.1.b:0 "God's wishes are unfallible, and our resolve is the same, to the death!"
  spain.2.t:0 "The Spanish request an exit to the war"
  spain.2.d:0 "The Spannies have finally deemed this war unresolvable, and have come to their senses. They send off to us an offer of peace between old and brutal rivals, and have resolved to focus their efforts elsewhere. \n\nthough this may be an ammicable and perhaps reasonable idea, we may never truly know the nature of Spain's plans, alas."
  spain.2.a:0 "Not another Valladolid!"
  spain.2.b:0 "The Spannies will answer for their Crimes!"

