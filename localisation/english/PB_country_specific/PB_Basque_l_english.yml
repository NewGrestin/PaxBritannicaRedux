  ### LEADERS ###
  BSQ_aguirre: "José Antonio Aguirre"
  BSQ_aguirre_desc: "While Luis de Arana y Goiri may have been the first president of the Basque country after its independence in 1917, Aguirre is what most would recognise as the true \"Father of Euskadi\". A relative outsider to politics before joining the CNV in the '20s, having ran his family chocolate business during the Great War and maintaining a short career in Basque football, Aguirre would be the wonderchild to build upon the CNV's legacy and give it new purpose after Basque independence had been won. Under his leadership, the CNV won the election of 1927 against the EAE and gave form to a proper christian-democratic party. \n\nSince then, the Aguirre government has followed up on its promises of a caring and prepared state. The Basque country's HDI increased above Spain, Portugal and France with the introduction of the basic Basque welfare scheme and the national healthcare provisions. At the same time, Aguirre introduced a mandatory conscription period for all men of fighting age in 1931 as a way to bolster the reserves, fearing the increasingly revanchist and irredentist tones from Paris and Madrid. These ideas may accumulate into a true threat to the Basque people and their way of life. It will take a lot of effort for Aguirre to defend this country, this house of his father, against wolves, drought, usury and justice."
  BSQ_candido_saseta: "Cándido Saseta"
