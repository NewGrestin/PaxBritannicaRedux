  PB_VIN_Rebellion:0 "The War of Independence"
  PB_VIN_Rebellion_desc:0 "Under Phan Boi Chau's wise guidance, we have launched a full-scale operation seeking to destroy what remains of European imperialism in Indochina. London can only seethe as large swaths of Tonkin's population and comrades from neighboring lands have all rallied under our banner. Although this popular coalition is as large as it is politically diverse — with monarchists, nationalists and revolutionaries finding themselves next to each other, their shared disdain toward London and its Siamese lapdog is enough for them to cast aside their rivalries for the time being. \n\nWhile our struggle may appear like one of David against Goliath, the general apathy toward Britannia's feeble rule and commitment from our Asian brethren has opened a window of opportunity like never before. \n\nThe French fell against our spirit of resistance, and so shall the British experience the same fate."
  PB_VIN_Revolution_Lifeline:0 "Lifeline of the Revolution"
  PB_VIN_Revolution_Lifeline_desc:0 "Once secluded within the jungles of Annam with scraps as equipment and their sole will as ally, our proud freedom fighters have recently been blessed by the helping hand of the newly-established Japanese Republic. Eager to light the flame of revolution in every corner of Asia, our brethren in Tokyo have been generously supplying both the Filipino insurgents and us as such. Exploiting the porous borders of China and the unsecured seas around, infiltrated partisans and unregistered ships provides weaponry and logistics on a daily basis — with London unable to oppose such deliveries thanks to sheer wideness and inhospitality of said territories. \n\nAs efficient as they might be for our cause, these lines of supply have gradually turned into leashes of some sort — with most of our scarce economy now dependent on the land of the Rising Sun’s generosity. It is to fear the helping hand might very much turn into an iron fist should we choose our own destiny away from the pan-asianist creed."
  
  PB_VIN_Revolutionary_Compromise:0 "National Coalition, Perpetuated"
