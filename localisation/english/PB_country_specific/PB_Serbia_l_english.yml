  SER_danilo_ii: "Danilo II"
  SER_danilo_ii_leader_desc: "§HBorn:§! §Y29/6/1871, Cetinje, Kingdom of Serbia-Montenegro§!\n\nSince his ascension to the throne, §YDanilo II§! has been an ambitious ruler who sought to match the prestige of his father. Governance initially remained stable as he resided comfortably within the royal palace overlooking Podgorica. However, the Serbian regions gradually felt more or less neglected as state funding and resources were increasingly directed toward Montenegro.\n\nHis opportunity for glory came when Hungarian authority collapsed into civil war, leaving Croatia in chaos. §YDanilo II§! personally took charge in ordering military forces to occupy as much Bosnian territory as possible. This decision sparked mass protests in Belgrade over governmental neglect, forcing §YDanilo II§! into a critical moment where decisive action became unavoidable."
