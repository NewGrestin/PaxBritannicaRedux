  PB_SER_Serbian_Clans:0 "The Serbian Clans Problem"
  PB_SER_Serbian_Clans_desc:0 "§O“Only Unity Saves the Serbs” — Popular Serbian motto§! \n\nTraditional Clans have been a thorn in the monarchy's foot when it came about evolving the newborn Serbian-Montenegrin State from a collection of tribes loosely bound by feudal rights into a proper Nation-State. With familial ties and communal affiliations superseding both the central authority and government-imposed cultural norms, nation-building efforts have been but vains attempts after vains attempts against the myriad of organic communities populating the Dinaric Alps and its surroundings."

  PB_SER_Iden_Crisis:0 "Identity Crisis"
  PB_SER_Iden_Crisis_desc:0 "For centuries, the South Slavs lived under foreign empires — from Bulgaria and Byzantium to Hungary and the Ottomans. In every moment of chaos, most failed to secure lasting independence.\n\nAll but one.\n\nMontenegro survived. Emerging in the 1500s as a Serbian Prince-Bishopric, it preserved its autonomy and slowly expanded amid Habsburg–Ottoman wars. It later united with Serbia as had originally hoped, with the Habsburgs giving way after crushing the second Koča's Frontier revolt.\n\nBut unity bred tension. Power centralized under the House of Petrović-Njegoš, while many Serbs felt sidelined. Now, as South Slavic nationalism rises, the Kingdom must decide its future: unity, dominance, or division."

