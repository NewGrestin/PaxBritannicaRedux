##########################
# IDEAS
##########################

 PB_HOL_flanders_fields: "In Flanders Fields, The Poppies Blow"
 PB_HOL_flanders_fields_desc: "The south of the country has remained ruined since the end of the Great War, with entire villages still left barren and old battlefields scarring the landscape. The psyche of Flanders too is scarred; with countless widows mourning both husband and son, while the younger generations retreat into crime and cheap pleasures to escape from the war’s lingering shadow."
 PB_HOL_sapphire_revolution: "Echoes Of The Sapphire Revolution"
 PB_HOL_sapphire_revolution_desc: "When the waves of reformation and revolution swept Europe in the last century we too were not left untouched. Following France’s adoption of liberalism the House of Orange found itself challenged by the radical Patriotten; with them demanding an end to the hereditary statholderate and the return to true republican values.\n\nThe so-called “§RPatriottentijd§!” continued until 1795 when a string of riots and subsequent crackdowns led to their violent seizure of Amsterdam. In a bid for peace the Kingdom of France intervened to save the republic from anarchy, hoping to prevent the ambitions of its own radicals by snuffing out the Dutch Jacobins and instituting the aristocratic “§CSapphire Revolution§!”. Although the statholderate was abolished among these reforms, the dreams of the Patriotten were crushed as the French reinforced the old oligarchy that was hoped to be overturned.\n\nNow over a hundred years later the same calls for change are being echoed by a new generation of radicals. Riots flood the streets as the people grow uncontrollably restless, having grown impatient by our government’s reluctance to democratise. We can only hope to weather the storm at this point."
 PB_HOL_krakatoa_consequences: "Shadow of the Krakatoa Catastrophe"
 PB_HOL_krakatoa_consequences_desc: "The Krakatoa volcanic eruption shattered our colonial domain in Insulindia, turning the once profitable East Indies into a field of ash soon to be torn apart by petty sultans and warlords. Already weakened by the Great War, our economy choked as Asian trade declined substantially while most of our ventures fell in the hands of the rabble-rousers. With Great Britain unwilling to assist us beyond securing a few key locations and the already tense situation at home, we have been forced to relinquish our former colonial glory.\n\nDecades later, the situation hasn't improved much despite our past efforts. Diminishing commercial outlets and an ever-increasing reliability on our neighbours to compensate for the losses still effectively cripples our industrial capacity."
 PB_HOL_slum_sprawl: "The Slum Sprawl"
 PB_HOL_slum_sprawl_desc: "\n\n£GFX_TT_HOL_1\n\n\n\nThough the Second Renaissance brought many scientific marvels into this world, it had an unfortunate side-effect. With infant mortality greatly reduced and food more plentiful than ever, the Dutch population rapidly increased to an unsustainable level for such a small country. This left our cities incapacitated by the rampant poverty, crime and overcrowding.\n\nWork is almost impossible to find, and the influx of new automatrons has only exacerbated this already dire situation. Housing is a problem too; some tenements house up to five families each, while the homeless live in one of the many shanty towns that have begun to litter the urban peripheries."
 PB_HOL_dualistic_system: "Dualistic System"
 PB_HOL_dualistic_system_desc: "The provinces of the Dutch Republic can be roughly categorised into two types, The first are the “regenten” provinces, where representatives to the States General are elected by noblemen and Regenten families. Holland is the most influential among these and often acts as the kingmaker in who becomes Grand Pensionary.\n\nSecond are the “free” provinces which have public referendums to elect their representatives, although laws within these provinces may differ in who is enfranchised. For most of the republic’s modern history these have been rural regions without an entrenched aristocratic class such as Frisia.\n\nHowever in the late 19th century more of these free provinces were admitted and since then these two provincial blocs have been locking horns, both vying to stymie the other’s power and impose their grand visions for the republic."

