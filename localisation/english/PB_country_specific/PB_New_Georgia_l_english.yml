  PB_CNG_Shades_Of_Red:0 "Two Shades of Red"
  PB_CNG_Shades_Of_Red_desc:0 "Emerging deeply shaken from the Great War and its countless atrocities, New Georgians would be among the first of Great Britain's many possessions to obtain the establishment of a truly universal suffrage. Earned through hard-fought struggle, this expanded franchise would be followed by the sweeping victory of labour-sponsored candidate Alfred Smith soon after  — an event never seen before within the Anglosphere. Terrified by what they perceived as the first seed of a revolution akin to the Japanese one, landed aristocrats and industrialists intensely lobbied for an armed intervention against the so-called red threat; a prospect excluded by Westminster, who sought to pursue a more peaceful relationship with its dominion instead. \n\nNew Georgia has remained a strange hybridation within the Imperial Commonwealth since then. Proletarian yet colonial, republican yet monarchical, independent yet still bound to its former overlord... The “labourist” experiment is a living contradiction in itself. Not radical enough for the hardline reformists and vehemently despised by the old elites, it nonetheless receives the support of the masses whose living conditions have largely improved thanks to “Al” Smith social policies and public work programs. \n\nAfter all, the worker cares little about petty politics and supposed ambivalence as long as there's a meal on the table."
  