  ROC_li_dazhao: "Li Dazhao"
  
  ######################
  ####    IDEAS     ####
  ######################
  
  PB_ROC_Southern_Expedition_Failure:0 "Aftershocks of the Southern Expedition"
  PB_ROC_Southern_Expedition_Failure_desc:0 "The Qing Empire fell in 1912, allowing the rise of the current people’s revolution in China. It was during this time that the Directory believed they could simply sweep south and undo the European-imposed division of China with the support of the people. Thousands of conscripts and revolutionaries moved south, eager to topple the Heavenly Emperor and carry the banner of the republic all the way to Dali.\n\nReality is often disappointing.\n\nThe Revolutionary Army was slammed by Imperial Forces in Hefei, who fought viciously to retain the city at any cost. The second blow came shortly thereafter, when the Quadrilateral Commission stepped into the war and proceeded to unleash the full arsenal of multiple European powers against us. Chemical warfare amalgamates and mechanized infantry broke the Army’s rear defenses and routed our forces all the way back to the pre-war border. Another blow was expected to fall and crush the revolution, but instead the Commission offered an off-ramp. The encircled force would be disarmed and allowed to return, but in exchange we would be forced to cede anything South of the Yellow River to the Harmonious Empire.\n\nThe Directory took the olive branch, believing it was more valuable to survive to repudiate the humiliation later than die fighting. The consensus was that the Commission lacked the manpower or will for major adventurism in China, and this had bought us time to consolidate.\n\nDespite putting a brave face on it, this was still a catastrophic defeat, and the Directory has since spent considerable effort into modernizing the Revolutionary Army. One day, the opportunity will arise to strike back against the Europeans and the Imperials, and when that day comes, we will be ready."
  PB_ROC_Second_Southern_Expedition:0 "Second Southern Expedition"
  PB_ROC_Second_Southern_Expedition_desc:0 " "
  PB_ROC_Revolution_Unrealized:0 "A Revolution Unrealized"
  PB_ROC_Revolution_Unrealized_desc:0 "The Anarcho-Republican Revolution in China has been an exercise in managing expectations. Since the Qing were overthrown, the state has hobbled from one crisis to another attempting to prevent everything from famine to outright counter-revolution. The one thing that can be said is that the people have maintained enthusiasm for the revolution.\n\nThat enthusiasm has kept the state afloat, for the most part, but people’s bellies can’t be filled with promises. If the Association remains dysfunctional, then the Directory and the people they claim to represent may find themselves violently opposed to one another."
  PB_ROC_First_Sister:0 "The First Sister Republic"
  PB_ROC_First_Sister_desc:0 "The Revolutionary Association is the second revolutionary state to emerge from Asia since the fall of the Japanese Empire. This places us in the unique position of being Tokyo’s favored son, at least for the moment. Japanese advisors are common throughout the military, as are Japanese investments and citizens. In a prior time, Beijing and Tokyo would have no common ground, but since the collapse of our respective autocrats, we’ve found common ground.\n\nThis isn’t to say the relationship is entirely born out of republican brotherhood.\n\nWhile Japan may be our allies for now, the future is uncertain, and we must ensure they do not become too comfortable lest they gain too much influence over the Directory. At the same time, the assistance of Japan is needed to modernize our fledgling military, and so we must simultaneously ensure that we do not upset the Japanese enough to force them to withdraw."

