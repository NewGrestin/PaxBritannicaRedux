  ######################
  ####  CHARACTERS  ####
  ######################

  ### LEADERS ###
  SGH_quadrilateral_commission: "Quadrilateral Commission"
  SGH_tcheng_yu_hsiu: "Tcheng Yu Hsiu"
  
  ######################
  ####    IDEAS     ####
  ######################
  
  PB_SGH_Unrestrained_Greed:0 "Unrestrained Oligarchy"
  PB_SGH_Unrestrained_Greed_desc:0 "The Quadrilateral Commission is run, principally, by corporate entities and oligarchs. This system, while extremely profitable for those involved, is less than stable as a state. The Commission itself functions more as a rubber stamp for the megacorporations, who have used the country as a trojan horse to hijack vast portions of the Harmonious Empire’s economy.\n\nThe corporations are concerned more with profitability over anything, and thus the Commission remains staunchly opposed to any future adventurism in China. The focus remains on maintaining South China as a captive economic partner for Anglo-European interests over any sort of reform. This system is, for the moment, functional, but the looming threat of general war in Asia has created a greater need for reform than ever.\n\nIt remains to be seen if the powers behind the Commission will anticipate the coming danger, however."
  PB_SGH_Corporate_Kingdom:0 "Corporate Kingdom"
  PB_SGH_Corporate_Kingdom_desc:0 "Tsingtao is the gateway for the West in China, and through it has poured all the bounties and failures that Europe can offer. While the Commission’s territories maintain a higher level of employment than the rest of China, worker’s rights are nonexistent and, in some areas, resemble rebranded serfdom. Factory complexes are jammed with underpaid Chinese workers, processing the raw goods of the Southern Empire for export to the wider world. Unions, or rather those that attempt to form, are frequently subject to intense scrutiny by local officials, most of whom are bought out by the megacorporations.\n\nFor the average American or European investor, the region is an untapped gold mine of manpower and material. For the Chinese, the proverbial dark of said gold mine is all they’ve known. The class consciousness of the Commission territory is still nascent, but as the anarchists in the North prepare for a second Southern Expedition, it seems primed to erupt in violent fashion."
  PB_SGH_Private_Army:0 "Soldiers of Fortune"
  PB_SGH_Private_Army_desc:0 "Officially, the Commission Territorial Army is a small force of only a handful of divisions. In reality, the official force is bolstered by a substantial army of paid mercenaries. Ranging from recruited Triads to ex-Pinkertons or exiled Portuguese soldiers, the pseudo-army of the Commission is a diverse force unified in their allegiance to the almighty Pound Sterling. Of course, maintaining the force is a major drain on capital, as is ensuring that it doesn’t act out.\n\nIt will be critical to keep the coffers full to ensure our so-called “Army” remains loyal. Defaulting on their paychecks without a recourse will likely have serious consequences for the health of the Commission’s leaders."
