  PB_MAG_Lusosyncretism:0 "The Lusosyncretic Experiment"
  PB_MAG_Lusosyncretism_desc:0 "In stark contrast to the segregationist or assimilationist policies endorsed on much of the continent, Magellania has come to tolerate the aboriginals and even embrace some of their customs. Although this cultural syncretism remain subsumed to the interests of the Portuguese-led State, and the indigenous more or less forced to adopt catholicism as their primary faith, Magellania likes to fashion itself as an example of successful lusotropicalism as theorized by Gilberto Feyre and the pan-lusophone intelligentsia. \n\nPrestige is but one reason behind this shift away from traditional forms of colonialism however. Perceived as a culturally diverse and tolerant nation, Magellania has been able to establish ties with natives beyond its borders as a result — building relationships with autochthonous armed groups in New Holland while permeating civil movements on much of the Northern continent. Should war erupt with neighboring powers, the small nation might reveal itself a greater foe than it looks."
  
