  ### LEADERS ###
  BCL_hugh_dyer: "Hugh Dyer" 
  BCL_hugh_dyer_desc:0 "§YBorn:§! 1/28/1861\n\n§YHugh Marshall Dyer§! is not someone anyone expected to get this far. Born in Ireland, son to a Royal Navy captain he moved to the Western edges of British North America, stablishing a farm in Athabasca. He was always connected to the local militia, keeping a close eye on the border with the Indians just south of them. When the Great War erupted, he joined the Northwestern Division, serving with great distinguishment throught the war. After returning home, Dyer found himself a war hero and possibly the most well known man from the Territory, and so the British offered him the role of Chief Administrator of the territory, an offer Dyer accepted.\n\n His tenure has been mostly quiet but popular, building up defenses against the Russians in the north, the Trekkers to the south and the Indians to the East, but he's also worked on improving the infraestructure and livelihoods of the people, particularly in his old home out in the overlooked eastern Plains of the Territory."
