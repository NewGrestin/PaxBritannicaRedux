#ideas

BCL_PB_Borealia_In_Heart: "Borealia in heart, rifle in hand"
BCL_PB_Borealia_In_Heart_desc: "Borealia was never a name to be associated with a nation or a culture. Borealia was just the dumpster of the Empire, the farthest and northernmost colony from London. People there identified themselves as British, never bothering the thousands-mile distance from actual Britons.That was until 1929, where the populace united during the Queens City Strikes to oppose the Military-Hudsonite Regime which was plaguing the territory and treating those who lived on it as assets. The people, united, started feeling Borealian, not British, intertwining their new-found nationalism with left-wing and utopian values. The Queens City Movement, mostly led by the FLP and BNA, is still active, and so far is the only movement proud to be Borealian. Its people have Borealia in heart, and a rifle in hand."

BCL_PB_Cold_Hearted_Money: "Cold Hearted Money"
BCL_PB_Cold_Hearted_Money_desc: "'Cold-Hearted Money' is a derogatory term coined by various medias to refer to the Borealian Economy. The only source of income in Borealia comes trough the exploitation of its land, and of its people; yet, the only gain seen is the constant influx of modern equipment to maximise the destruction of its territory; and also an unmanageable influx of citizens, coming from all the anglo-saxon world, in the coastal regions of the nation, thirsty for money as words of a 'Mineral Rush' in Borealia. Borealian trees are cut for houses in Philadelphia, Ice is shipped for Londoner fridges, and the ores are dug for the gain of men which will never feel as part of the Great North. Just like the temperature from their place of origin, Borealian assets tell the story of cold-hearted magnates who exploit a nation for a few extra zeros in their bank accounts."

BCL_PB_Frontier: "The Frontier against the Russian Bear"
BCL_PB_Frontier_desc: "The North American Tundra has never been so cold, yet so hot. It shall be the direct frontline between Saint Petersburg and London. An empty wasteland, covered for what one might think is an entire universe by snow, will be where men will be sent to die, in cold trenches, seeing the horrors of modern warfare. As empty as it is, it shall be in the near future as full, of both men and defenses. This is the reason why Philadelphia, London and even Quebec are investing in the Borealian Military and sending local detatchments near the Alaskan Border."

BCL_PB_Rotting_Cerberus: "The Rotting Cerberus"
BCL_PB_Rotting_Cerberus_desc: "Borealia has been led in the last years by a coalition of three cliques, or as simply put by locals, Cerberus, which is constantly beheading reformists and wildlife alike. These three cliques, or heads, are the Militaries, the Magnates, and the Freemen's Party. But now the Cerberus is rotting, and people see the heads biting eachother. The interests aren't the same anymore, after all. The corrosion of the lands led by the magnates is becoming untolerable for the Militaries and the Social Creditists, which are becoming an issue in the coalition for their diplomatic stances. One last argument, a casus belli, is needed to completely euthanize Cerberus, and bring down the rotten structure he has built."
  