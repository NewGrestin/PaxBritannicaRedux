  ##########################
  # FOCUS
  ##########################
  INS_the_last_stand_of_holland:0 "The Last Stand of Holland"
  INS_the_last_stand_of_holland_desc:0 "Maybe its been years since we've had a solid hold upon this land, since the people of this island have come to greet us as their overlord.\nMany would believe that such efforts would have ended then and there.\nBut Alas, we have duty to uphold for our fatherland. This land will be ours by any means necessary."
  INS_consolidate_the_frontier:0 "Consolidate the Frontier"
  INS_consolidate_the_frontier_desc:0 "Raiders, Bandits, Petty Brigands raiding our citizens and colonial holdings are a non stop problem we face among our remnant territories.\nIf we can barely hold onto our current lands, how can we expect to retake the the rest of the former Dutch East Indies.\nThis must be rectified immediately."
  INS_root_out_indonesian_nationalists:0 "Root Out Nusantaran Nationalists"
  INS_root_out_indonesian_nationalists_desc:0 "Within the lands of the [ROOT.GetName] there are many denizens who may believe the propaganda from the Siren-like revolutionaries outside of our borders.\nThese denizens are very much a threat to our people, and way of life. We cannot allow them to continue living, like a cancer, we will cut out the tumor."
  INS_our_wayward_territory:0 "Our Wayward Territories"
  INS_our_wayward_territory_desc:0 "Between the many inland territories that exist upon our former colonies, there are a handful that still remain relatively nominal in relation to us.\nThough we are not necesarily in a position to regain direct control over these areas, we can provide standardized stabilization provisions for these areas to ensure we retain control over the regions on paper."
  INS_coerce_the_papuans:0 "Coerce the Papuans"
  INS_coerce_the_papuans_desc:0 "One of the largest remaining territories from our former colonial holdings is amongst the New Guineans, in West Papua. \nThis already stable and large community, though it may lie far away from much of the fighting; it would be greatly useful for us to expand our connections to allow for the potential of goods and trade to expand between our two communities."
  INS_retrain_our_military:0 "Retrain our Military"
  INS_retrain_our_military_desc:0 "For the last several years the region of the [ROOT.GetName] has been busy licking her wounds, not necesarily expanding the capabilities and modernization of our military. \nWith the modern day quickly approaching, we are growing in capability by the coming day. \nThough previously it was not feasible to expand the development of our military, we should definitely expand it now for the upcoming conflicts."
  INS_united_in_purpose_and_fervor:0 "United in Purpose and Fervor"
  INS_united_in_purpose_and_fervor_desc:0 "Though many may not realize it, reguardless of our political backgrounds, many of our peoples and communities do in fact fight for the same thing. No matter our political divisions, we all continue to fight for our homes, families, and our heritage. \nThat much has not changed, in these past years. Our people will realize that soon enough."
  INS_avenge_the_tragedy_of_1915:0 "Avenge the Tragedy of 1915"
  INS_avenge_the_tragedy_of_1915_desc:0 "Eighteen years ago the forces of nature disrupted all of our colonial ambitions and capabilities of the Dutch East Indies. \nThough we have not forgotten the distruptions of our ambitions, we have also not given them up. \nThough these petty natives have exploited the opportunity to defy us, we will not give up our dreams and ambitions to them. \nWe will avenge those lost dreams and the East Indies will be under our grasp once again."
  INS_the_east_indies_secured:0 "The East Indies, Secured"
  INS_the_east_indies_secured_desc:0 "We have secured the lands of Indonesia. \nIt is time for us to unite with our other autonomous regions, and finally be united as a colony once again."
  INS_three_cheers_for_van_rappard:0 "Three Cheers for Van Rappard!"
  INS_three_cheers_for_van_rappard_desc:0 "It was not the Netherlands who united this lands, but it was Van Rappard and his soldiers. \nWhy should we be loyal to a much smaller kingdom thousands of miles away from us, it is we who have united this land and it is we who will rule it!"
  INS_demand_the_rest_of_papua:0 "Demand the Rest of Papua"
  INS_demand_the_rest_of_papua_desc:0 "The lands of New Guinea are rightfully ours! \nThey do not belong to those inglorious bastards that are the Germans. \n [ROOT.GetName] Will Not Be Divided! \nDemand the rest of the island now!"
  INS_the_natural_rulers_of_the_east:0 "The Natural Rulers of the East"
  INS_the_natural_rulers_of_the_east_desc:0 "At a time our lands had fallen far from the grace of rule over the Pacific. \nThese are not olden days! We have conquered this land, and we have shown to the world that we have the means and dedication to own it. \nIt is ours and no one else's!"
  INS_our_place_in_the_dutch_empire:0 "Our Place in the Dutch Empire"
  INS_our_place_in_the_dutch_empire_desc:0 "Though we might have been the ones who united this land, it is our fore fathers who hailed from the motherland of the Netherlands where we owe our true heritage to. \nIt is the Dutch guns that we fought with and it is for certain Dutch blood that was spilled for her unity. \nWe must repay the debt that we owe to our ancient home, it is our kingdom as well after all!"
  INS_rebuild_geothermal_plants:0 "Rebuild Geothermal Plants"
  INS_rebuild_geothermal_plants_desc:0 "Though many believe that it was the Geothermal plants that caused the Krakatoan explosion, in reality it was our incompetency that caused the explosion. \nThe resource that the Geothermal Plants can provide is invaluable, though we of course should regulate the plants, we of course shouldn't deny their use. \nThey will be rebuilt and expanded."
  INS_the_pacific_front_of_the_war:0 "The Pacific Front of the War"
  INS_the_pacific_front_of_the_war_desc:0 "Between the rising threat of Australie and the growing ambitions from the Republic in Japan, many around the world believe that the lands of Indonesia may eventually be one of the many battlegrounds fought as the world slowly burns in the embers of war. \nThough no war has broken out between us and our neighbors quite yet, we shouldn't wait for our lands to be shelled and our people killed to begin our preparations. \nIt will likely prove useful for our populace to begin their preparations for the coming years."
  INS_a_final_housecall:0 "One Final Housecall"
  INS_a_final_housecall_desc:0 "The British and the Dutch have had a long history of being allies. Not only that, but so too do we now hold common enemies, with the growing threat of the Republic in Japan. \nWe must reach out to our ancient ally, and we must stand with them if we are to survive any conflict in the Pacific."

  INS_Unlock_Unification_Decisions:0 "§YUnlocks§! £decision_icon_small to Restore the Dutch East Indies"

