  ### LEADERS ###
  NBT_louis_beel: "Louis Beel"
  NBT_abraham_johannes_muste: "Abraham Johannes Muste"
  NBT_abraham_johannes_muste_desc: "§YBorn:§!08/01/1885\n\nA clergyman by nature, political philosopher by trade has granted §YAbraham Johannes Muste§! all the tools necessary to efficiently run New-Holland as a beacon of business and democracy. Born in Zierikzee, Zeeland, Muste embraced the urban lifestyle much like his fellow siblings had, taking odd jobs here and there before landing a great deal with a dutch merchant company. Overseeing market values in Asia and the Pacific made him well accustomed to the climates and people who lived there. Eventually being chosen as the economic minister for the then young New-Holland colony a few years later.\n\nAs time continued the popularity of Muste only increased and he soon took up position of PM, now being in his second year of his four year limit. While foreign markets continue to plummet New-Holland has remained relatively stable, even seeing minor growth in some areas such as mining and shipping. Though not all is perfect for the relatively independent Dutch dominion. Nations under British, French, and German influence vie for dominance over the Oceanic region and war seems to be a likely outcome as the days pass by."
  
