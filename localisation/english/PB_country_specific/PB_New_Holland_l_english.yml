  # IDEAS
  ##########################
  PB_NBT_Economy:0 "Thriving Economy"
  PB_NBT_Economy_desc:0 "The New Holland economy has seen an explosion of success. The large deposit of rare minerals on mainland Oceania has greatly attributed to this fact, that as well as the competency of the ruling government that has ensured the small colony stays relevant in Asian-Pacific affairs. Everyday a new factory is opened up and hundreds are employed in sustainable, well paying jobs; continously feeding the colonies thirst for new settlers and skilled labour."
  
  PB_NBT_Outback_Howls:0 "Howls in the Outback"
  PB_NBT_Outback_Howls_desc:0 "To oversee New Holland's vast extents is a daunting task indeed. Beyond key cities and a few safe havens, mother nature appears in her most cruel attires. With pests of various shapes and sizes multiplying unopposed in the outback on one side and terrible diseases slaughtering both men and cattle on the other, this land is truly a challenge for whoever intends to carry on the civilizing duty inland. \n\nFortunately enough, God and science gifted us with a blessing when it came to deal with Emus and other hindrances. By releasing repurposed Combatagates designed solely to eradicate hostile fauna into the wild, we could finally secure new arable lands, laying the foundations for a pacified, prosperous outback in which all would thrive without having to fear the now-vanquished scions of nature. \n\nIf only this radiant vision hadn't gone horribly wrong.\n\nMimicking the British East Africa's way of dealing with native revolts, we massively released modified Combatagates in New Holland inner-territories in hope of helping settlers' efforts. What seemed to work with great efficiency at first turned against us in a matter of years as the artificial lifeforms slowly became the ultimate parasites among those we sought to destroy. Worse was the fact that the beasts somehow outgrew their own limitations in the process, with Combatagates surviving far past their normal lifespan while showing increasingly aggressive instincts towards men — a trait supposedly suppressed. While the man-made plague has somehow been contained within a few scarcely-populated regions, fear ramps up every days at the prospect of cannibalistic monstrosities taking over the countryside in an orgy of violence. \n\nAs the wilderness slowly falls silent, only to be torn apart by the sinister screams of unnatural entities, we must be prepared should this fateful hypothesis came into fruition."
  
  PB_NBT_Stable_Nation:0 "Stable Nation"
  PB_NBT_Stable_Nation_desc:0 "The Constitution that enshrines the New Holland colony is one of fairness, equality, and opportunity. The continued successes of previous and current governments have maintained a prestigious political atmosphere that has bled into the New-Hollander consciousness, citizens remain confident in bureaucratic workings leading to great stability and freedoms rarely seen in the modern world. "
  
