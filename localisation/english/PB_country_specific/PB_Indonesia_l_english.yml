  PB_CCO_Bandit_Alliances:0 "Bandit Alliances"
  PB_CCO_Bandit_Alliances_desc:0 "Elements of the former East Indies Navy and local pirate groups combined into a multi-island thalassocracy. An extremely diverse alliance of bandit groups hailing from as far as North America, India, China and Indochina now threaten trade through Indonesia. Their current aim is to consolidate their rule and power and expand the profits from piracy, maybe eventually expending their influence and establish a martime pirate republic."
  PB_BOR_The_Long_Bawan_Track:0 "The Longbawan Track"
  PB_BOR_The_Long_Bawan_Track_desc:0 "Along the jungles of northern Borneo lies the Longbawan Track, stretching from Miri to Tarakan. It stands as the single most important railway on the island, supplying Bertram with a steady flow of weapons for his escapades and make-believe adventures. Cutting through Dayak territory, the track remains a volatile bottleneck—one that, for now, restrains Bertram Brooke from unleashing his wrath upon the local populace."
  PB_BOR_Bertram_Playground:0 "The Jungle King"
  PB_BOR_Bertram_Playground_desc:0 "Bertram Willes Dayrell Brooke—an odd but nonetheless prevalent type. The sort of man who does not simply follow adventure, but drags it with him wherever he goes. His lifestyle, in many ways, defines the Raj itself sparse in population compared to the north, yet rich—almost overflowing—in rubber.But Brooke was never without his share of mistakes. Notoriously remembered for his brutal antics, he was known to deploy livewire with alarming frequency and seemingly no reason at all. And yet, for all the chaos and cruelty that clung to him, one certainty remained he was here. And for Bertram Brooke, that alone was enough of an adventure."
  PB_BOR_Bad_Blood:0 "Bad Brotherly Blood"
  PB_BOR_Bad_Blood_desc:0 "Bertram suffers from what the scientific community calls "a seething hatred for his brother". Sidelined from the crown despite their father's wishes, he convinced himself he had been robbed. He packed his things, brought a brigade of soldiers and attempted a coup — which failed. Rather than execute his brother, as is common in such feuds, Bertram was exiled east to Borneo. There, amid Dutch disarray, he hired soldiers and forged a paradise of flames — an arrangement always doomed to end badly. At some point someone will die, and it certainly won’t be Bertram."
  PB_USS_Pakubuwono_Ascendency:0 "The Pakubuwono Ascendency"
  PB_USS_Pakubuwono_Ascendency_desc:0 "The Susuhunan of Surakarta found itself in a surprisingly advantageous position when it became one of the first Javanese courts to embrace the Second Renaissance, with cybernetics, genetic refinement and biological enhancement spreading rapidly among its nobility. In doing so, Surakarta aligned itself with the emerging technological order and secured the backing of Ottoman reformist circles in the East.\n\nAt the same time, the court of Yogyakarta refused technological ascension on ethical and spiritual grounds, preserving immense cultural authority but withdrawing from direct temporal governance. An accord between the two followed, Yogyakarta would remain a neutral mediator among the Javanese sultanates’ affairs, while executive authority was consolidated under Surakarta, which relocated its administrative and industrial center toward Surabaya to take advantage of its rapid development and growing strategic importance."
  PB_ACE_Vestigial_Limb:0 "Vestigial Limb of the Sublime Porte"
  PB_ACE_Vestigial_Limb_desc:0 "The history of Aceh’s alliance with the rightful Sultan of the Ummah stretches back to the sixteenth century, when the Ottomans aided the Acehnese struggle against Portuguese and later Dutch encroachment. Though the Sublime Porte has since suffered humiliation in Europe and the loss of Egypt and Arabia, Banda Aceh remains its final instrument for projecting influence upon the world stage, a distant but defiant outpost of Ottoman prestige in an age of imperial decline. That bond, however, was eventually broken by Aceh itself, as the Sultanate renounced Ottoman reformism and rejected the tide of industrial modernisation, casting aside Tesla's discovery in favor of a hermit doctrine of uncompromising faith.\n\nUnder this new order, Aceh turned inward. Industry was tightly constrained, foreign influence expelled, and technological ascension condemned as spiritual corruption in defiance of the Quran. Yet this retreat did not diminish its will; instead, it reshaped the Sultanate into a militant fundamentalist power, convinced that purity demands struggle beyond its own borders to cleanse the world from this new vice. In the chaos unleashed by the eruption of Krakatoa and the weakening grip of the colonial powers, the warriors of Darussalam prepare once more to move outward, not as heirs to those decadent Ottomans, but as the rightful heir of the original Caliphate, intent on unifying the Indonesian archipelago beneath the banner of Allah."
  PB_MKS_Burn_Brightly_Red:0 "To Burn Brightly Red"
  PB_MKS_Burn_Brightly_Red_desc:0 "“Firstly\nWe the sons and daughters of Indonesia, acknowledge one motherland, Indonesia.\nSecondly\nWe the sons and daughters of Indonesia, acknowledge to be of one nation, the nation of Indonesia.\nThirdly\nWe the sons and daughters of Indonesia, uphold the language of unity, Indonesian language.”\n— The Youth Pledge, 1928\n\nThe Makassar Students’ Alliance are a disparate group of workers, students and intellectuals with the vision of a united Indonesia from Sabang to Merauke. With the eruption of Krakatoa in 1915 and the reactionary Rappard’s dictatorship seizing control of Batavia in the 1920s, many of the students fortunate enough to evade the fallout and crackdowns of the colonial regime fled to Makassar with the help of sympathetic sailors from Sulawesi, landing with a sense of invigorated anger.\n\nSeizing the important port city from the Dutch and repelling the attempts of British authorities to quell their uprising solely on the back of their fanatical determination, the students has attracted the attention of Japan in their own dream of Pan-Asianism, Japanese-made Arisaka rifles and Nambu pistols are a common sight among the Alliance’s militias alongside industrial support and technical advisors to help the Indonesian achieve their dreams of a unified archipelago."
  PB_HAR_Sickle_for_every_Hand_desc:0 "The Year Without Summer was a catastrophe unseen in recorded history, famines and drought followed the flames, starvation and hunger was commonplace amongst the suffering survivors, many of them thought that it was a blessing to be buried by the fire of Krakatoa rather to live in the end of times.\n\nYet, mankind must soldier on, whatever the circumstances may be. Seeing the sins of industrialisation and individual egoism, many farmers from Padang to Pekanbaru banded together, scrounging anything that remained in the aftermath to help and feed each other and their families, fostering a sense of social cohesion made in spite of their situation, these peasants formed the backbone of a new society based on the principles of agrarianism and local democracy in rejection of rampant industry and commercialism of Palembang."
  PB_HAR_Sickle_for_every_Hand:0 "A Sickle for Every Hand"
  PB_KRA_Mother_Krakatoa:0 "Mother Krakatoa"
  PB_KRA_Mother_Krakatoa_desc:0 "Beneath your feet they press and sway\nCrowding closer day by day\nStanding tightly in a line\nAwaiting time\n\nWithin the coldness of your hold\nWrapped in stone so dark and cold\nSlowly fading from the light\nInto night.\n— Semayam, Bin Idris\n\nIt is the end of days! Mother Krakatoa has had enough of the foreigners suckling on her bosoms that was meant to be bounty for her children, Indonesia has suffered for too long as slaves and our mother sacrificed herself by belching her stomach in full to expel the Dutch from our lands. Now with Her wrath unshackling us from their yoke, we must finish what she started and purify the earth from these barbarians.\n\nWe have found our Satrio Piningit in the Lord of Cinders, and he will lead forth our crusade to unify the Nusantara and then the world. If the requirements to create our Kingdom of Happiness is blood and cinders then so be it.\n\n§RLet the World Burn§!"
  PB_DEL_Greatest_Folly:0 "The Greatest Folly"
  PB_DEL_Greatest_Folly_desc:0 "Greed. Greed is the word that could aptly describe the way of thinking of the world since the dawn of time, be it the rampant European empires’ hunger for virgin lands and resources, the greed of warlords and kings in Africa and Asia, or the greed of the megacorporations that seek to increase their profit graphs whatever the cost.\n\nIt can be argued, however, that all of this pales in comparison to the greed of the Vereenigde Oostindische Compagnie, the pioneers of modern capitalism and one of the first concerted efforts to bring disparate islands to heel of a colonial administration. Their greatest project, the Krakatoa Geothermal Plant, brought annihilation to an entire region and smothered the world in fog, ushering in the Year Without Summer.\n\nWhat followed can only be described as a decade of nightmares, as entire cities and lives were buried under ash and the jewel of the Dutch empire was swallowed and buried in rubble. In the aftermath, the VOC coalesced in the island of Sumatra, seemingly being too large to be brought down by Mother Nature.\n\nYet its future remains uncertain. Many lay the blame for the catastrophe squarely at its feet, and calls grow within the Staten-Generaal for the company to be dissolved and governance returned directly to the state. Whether the megacorporation can survive the consequences of its own ambition remains to be seen."
  PB_PNG_Parliamentary_Remnant:0 "Parliamentary Remnant"
  PB_PNG_Parliamentary_Remnant_desc:0 "Stability is a precious thing in the ruins of an empire. And even rarer is a stability that is not imposed forcefully upon the populace with the barrel of a gun in the name of order, but in West Papua this dream remains flickering, however fragile.\n\nThough much of the rest of the country has fallen into the hands of military strongmen, undisciplined insurgents and absolute monarchs, the Free State remains as the last bastion of parliamentarism in Insulindia, with the Volksraad and much of the civilian bureaucracy relocating in the city of Manokwari after the Year Without Summer.\n\nIt was especially evident when Herman van Rappard seized the city of Batavia and imposed his own martial rule and supremacist ideas, even by contemporary standards, over the still scarred capital. With the Volksraad condemning his actions and refusing to acknowledge his authority, the two sides remain in a tense standoff over who is the legitimate leader of the Dutch East Indies remnant, though the question is seemingly postponed until stability fully returns to the colony."
  PB_SUL_British_Bias:0 "British Bias"
  PB_SUL_British_Bias_desc:0 "Though ostensibly a joint British and Dutch effort to stabilise the island of Sulawesi, it is clear who holds the actual reins of power in Manado. With Dutch soldiers tied up elsewhere, more and more men from Sarawak, Guangdong and Malaya under the British banner flock to fill the vacuum and secure the rich deposits of rubber for London, to the chagrin of Den Haag, who has repeatedly petitioned for the full administration to be returned to Holland, while paradoxically requesting more assistance in securing the island."
  PB_SUL_Failures_of_Palopo:0 "Failures of the Palopo Offensive"
  PB_SUL_Failures_of_Palopo_desc:0 "Sutton's attempted blitz towards Makassar ended in a dismal failure through the sheer determination of the Indonesian defenders. The Major General even lost one of his arms in the operation, earning him the nickname of "One-Arm Sutton." Now, with the British expeditionary force thrown back to the other side of Mount Latimojong, the rabble-rousers have been able to regroup and secure their den of Japanese-style Jacobins. It is pertinent then, as the shadow of Japan looms ever larger, that these agitators be put down quickly, lest the wildfire they sparked grows ever larger.\n\nNew plans have been proposed to focus on an amphibious assault, bypassing the mountainous terrain and echoing the grand offensives of Overlord in Iberia and playing to the strength of the British forces. However, many have urged caution, as this daring plan might end up being a bloodbath if not planned carefully."
  PB_INS_Remnants_of_The_Empire:0 "Remnants of the Empire"
  PB_INS_Imperial_Nostalgia_desc:0 "No one wanted the unenviable position to lead Batavia after the Krakatoan explosion; from lines of communication that is buried under volcanic waste, mass starvation and practically nonexistent revenue streams, it is a living hell as it is, not to mention the frenzied natives who want every single Dutch heads on a spike for reasons that are quite obvious, yet someone must, and someone did.\nIt is very unfortunate then that it was Ernst Herman van Rappard and his clique who stepped up in the vacuum. A group of what can charitably be described as nostalgic imperialists yearning for a return to the Golden Age of Holland, Rappard took the job that nobody else wanted with the sole goal of reunifying the archipelago under Dutch rule no matter the means or methods.\n\nTaking a page out of the nightmare that is the Zheltorossiyan textbook, Rappard seeks to yank Indonesia back with a cruel hand to the days before the Ethical Policy and back to period of Cultuurstelsel, with new policies that seeks to completely eliminate Indonesian culture and replace it with the purer Dutch culture, outlawing language and cultural practices and aggressively persecuting Islam and native religions in favour of Christianity, to the point that many even in Europe consider him nothing more than a rogue warlord no better than Yudenich or Denikin.\nMartial law, curfews, disappearances and even firing squads are common in Rappard’s administration, with many people choosing to flee to the neighbouring sultanates, swim across to the other islands or even join the cult in the corpse of Krakatoa than live under his rule."
  PB_SWK_White_Rajahs_Of_Sarawak:0 "The White Rajahs of Sarawak"
  PB_SWK_White_Rajahs_Of_Sarawak_desc:0 "The story of how Sarawak fell into the hands of the Brooke family can scarcely be described as a calculated conquest. Rather, it emerged from circumstance, opportunism and the fractured politics of Borneo itself. When James Brooke arrived upon the island’s shores, he did so not as the head of an imperial expedition, but as an adventurer. Through naval superiority, diplomacy and the support of influential Sarawakian Malay datus, Brooke secured what had been promised to him by the Sultan of Brunei, the governorship of Sarawak.\n\nNearly a century has passed since that fateful agreement. The Raj of Sarawak now stands as one of the strangest political entities in the East, neither wholly colonial nor truly native. Beneath the banner of the White Rajahs, the peoples of Sarawak have known a degree of autonomy rare among the territories of Southeast Asia. The Brooke dynasty cultivated loyalty among Malays, Dayaks, Chinese merchants, and coastal communities alike through a mixture of paternal rule, pragmatic reform and harsh suppression of piracy and rebellion.\n\nYet the foundations of the Raj grow increasingly uncertain. To some, the White Rajahs are benevolent guardians who shield Sarawak from exploitation by distant empires. To others, they remain relics of an age that the modern world is swiftly leaving behind."
  PB_SWK_Significant_Chinese_Minority:0 "Significant Chinese Minority"
  PB_SWK_Significant_Chinese_Minority_desc:0 "Since the early days of the Raj, Sarawak has been a destination for Chinese migrants seeking opportunity beyond the crowded ports of southern China. Drawn by trade, mining and agriculture, Chinese communities have established themselves as a vital part of the colony’s economic life. Over time, they have become indispensable intermediaries in commerce, connecting inland producers with coastal markets and foreign merchants.\n\nThough culturally distinct from both the Malay coastal elite and the indigenous Dayak populations, the Chinese communities of Sarawak have carved out a stable position within the Brooke administration. Many have adopted a pragmatic loyalty to the Raj, valuing its relative order and commercial freedoms compared to the turbulence of neighboring regions.\n\nHowever, their growing economic influence has also created tensions. Questions of representation, cultural autonomy and political trust linger beneath the surface of Sarawakian society. While the Brooke government continues to rely heavily upon Chinese enterprise, it must carefully balance this dependence with the sensitivities of other communities within the Raj."
  PB_KAL_Longhouse_Legacy:0 "Legacy of the Longhouses"
  PB_KAL_Longhouse_Legacy_desc:0 "The political authority in the Alliance of Dayak tribes is not expressed through cities or fortresses, but through a dense web of kinship-based longhouse communities that bind the forests of Kalimantan together.\n\nFor centuries, Dayak society has organised itself around extended communal dwellings that function as political, economic and military units simultaneously. Chiefs are not absolute rulers but coordinators among equals, their authority dependent on consensus of the whole and reputation in the community rather than formal coercion. This structure has proven remarkably resilient in resisting outside domination, as any attempt to disrupt governance must contend not with a single centre of power, but with hundreds of interconnected communities scattered deep within the rainforest.\n\nHowever, this same strength complicates modernisation. Central planning is slow, taxation is uneven and large-scale industrial coordination struggles against local autonomy, with much of the economy still relying in slash-and-burn agriculture, fishing and subsistence farming."
  PB_KAL_Headhunting_Spectre:0 "Spectre of Headhunting"
  PB_KAL_Headhunting_Spectre_desc:0 "Long before borders were drawn or uniforms standardised, warfare in the Kalimantan interior was personal. In this older world, the practice of headhunting was not senseless brutality but also a ritualised form of warfare sacred to the Dayak.\n\nThough the modern Dayak state has formally abandoned such practices, the legacy of that martial culture has not disappeared. Even in contemporary formations, this legacy manifests as an uncanny aptitude for ambush, infiltration and psychological warfare, which has proven itself repeatedly as Dayak auxiliaries have been sighted in the Raj of Sarawak or even British formations, appreciating the importance of these in the Sarawak Rangers or Iban Trackers."
  PB_LAN_Throne_Of_Tin_And_Gold:0 "Throne of Tin and Gold"
  PB_LAN_Throne_Of_Tin_And_Gold_desc:0 "The so-called Empire of Lanfang is, in truth, a recent invention, not the result of an ancient mandate, but the outcome of migration and ambition carried across the seas. It began with the arrival of Oei Tjie Sien to the island of Borneo.\n\nThough he aligned himself with the victorious Taiping cause, the aftermath proved far less triumphant than he expected. The rebellion left southern China shattered, its wealth siphoned away by European concessions and foreign monopolies tightening their grip over every viable avenue of domestic enterprise and he realised that the future no longer lay within the ruins of China.\n\nSo Oei Tjie Sien left.\n\nHe moved south, into the porous world of Southeast Asian trade routes, plantations and mining concessions. It was he who founded the family enterprise of Kian Gwan, but it was his son, Oei Tiong Ham, who transformed it into something unprecedented. Under his direction, it evolved into the Oei Tiong Ham Concern, a commercial colossus that came to dominate much of Southeast Asia by the dawn of the twentieth century and placed its founder among the wealthiest men in Asia.\n\nWith endless capital and control of ports, mines and plantations, Oei Tiong Ham did what no merchant house had previously achieved. And with the Lanfang Republic absorbed into his commercial empire. A crown followed and with it, Oei Tiong Ham proclaimed himself the Nanhai Emperor, despite the ineffectual protests that came from distant Tianjing."

  CCO_Corsair_Raiders:0 "Corsair Raiders"




