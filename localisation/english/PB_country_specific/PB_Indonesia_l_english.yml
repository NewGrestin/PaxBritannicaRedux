  PB_CCO_Bandit_Alliances:0 "Bandit Alliances"
  PB_CCO_Bandit_Alliances_desc:0 "Elements of the former East Indies Navy and local pirate groups combined into a multi-island thalassocracy. An extremely diverse alliance of bandit groups hailing from as far as North America, India, China and Indochina now threaten trade through Indonesia. Their current aim is to consolidate their rule and power and expand the profits from piracy, maybe eventually expending their influence and establish a martime pirate republic."
  PB_BOR_The_Long_Bawan_Track:0 "The Longbawan Track"
  PB_BOR_The_Long_Bawan_Track_desc:0 "Along the jungles of northern Borneo lies the Longbawan Track, stretching from Miri to Tarakan. It stands as the single most important railway on the island, supplying Bertram with a steady flow of weapons for his escapades and make-believe adventures. Cutting through Dayak territory, the track remains a volatile bottleneck—one that, for now, restrains Bertram Brooke from unleashing his wrath upon the local populace."
  PB_BOR_Bertram_Playground:0 "The Jungle King"
  PB_BOR_Bertram_Playground_desc:0 "Bertram Willes Dayrell Brooke—an odd but nonetheless prevalent type. The sort of man who does not simply follow adventure, but drags it with him wherever he goes. His lifestyle, in many ways, defines the Raj itself sparse in population compared to the north, yet rich—almost overflowing—in rubber.But Brooke was never without his share of mistakes. Notoriously remembered for his brutal antics, he was known to deploy livewire with alarming frequency and seemingly no reason at all. And yet, for all the chaos and cruelty that clung to him, one certainty remained he was here. And for Bertram Brooke, that alone was enough of an adventure."
  PB_BOR_Bad_Blood:0 "Bad Brotherly Blood"
  PB_BOR_Bad_Blood_desc:0 "Bertram suffers from what the scientific community calls "a seething hatred for his brother". Sidelined from the crown despite their father's wishes, he convinced himself he had been robbed. He packed his things, brought a brigade of soldiers and attempted a coup — which failed. Rather than execute his brother, as is common in such feuds, Bertram was exiled east to Borneo. There, amid Dutch disarray, he hired soldiers and forged a paradise of flames — an arrangement always doomed to end badly. At some point someone will die, and it certainly won’t be Bertram."


  CCO_Corsair_Raiders:0 "Corsair Raiders"




