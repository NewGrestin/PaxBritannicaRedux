  ##########################
  # LEADERS 
  ##########################
  NHW_peter_kawananakoa: "Peter Kalākaua Kawānanakoa"
  NHW_peter_kawananakoa_leader_desc: "§HBorn:§! §Y10/3/1904 in Lihu'e, Kauai, Kingdom of Taua'i§!\n\n§YThe young king of Taua'i, Peter Kalākaua Kawānanakoa, is a greatly promising leader for his homeland and an excellent military officer. He is married to Russian princess Maria Pavlovna, in the hopes of uniting both royal houses and furthering the nation's long history of partnership with Russia. Peter was once a rowdy and aggressive young man, plagued with mental issues, until his 18th birthday party, when a friend of his dared him to bite and swallow a plum which had been in spiritus for 2 whole years. Not one to back down from a challange, he ate not one, but five of them, which was followed by five days of constant and intense hungover, from which he emerged a changed man. He became a much more quiet, serious and intelligent man, and a great tactician as well. He is known to have once bested four of Russia's best chess players, without even haveing played chess before. When questioned how he managed to accomplish this, he only responded that he could somehow feel and hear the chess pieces."
