  # TAUAI GENERALS
  ##########################
  NHW_alexander_mikhailovich: "Alexander Mikhailovich"
  NHW_innocent_semjonovic_smolin: "Innokentii Smolin"
  NHW_viktorin_mikhaylovich: "Viktorin Mikhaylovich"
  NHW_diterikhs_mikhail_konstantinovich: "Mikhail Diterikhs"
  NHW_john_mahia_kaneakua: "John Mahi'ai Kāneakua"

  ##########################
  # IDEAS
  ##########################
  PB_NHW_Polynesia: "Polynesia's Maiden Hope"
  PB_NHW_Polynesia_desc: "The people of Polynesia once ruled every island from New Zealand to Rapa Nui, until the European colonists robbed us from our birthright, pillaging our once pristine islands for all their worth. Even here in Hawaii, our southern neighbors are nothing but a glorified British puppet, but we are different. We stand as the last truly free Polynesian nation, and we must carry this burden with reverence and honor. We must invite any and all of our brothers from across the waves who wish to be free from foreign colonialism, and let them settle down on our islands, both natural and man-made, to create a true Polynesian state. Besides the extra manpower and population will be needed to unite our homeland."
  PB_NHW_Russian_Protection: "Under the Wings of a Double-Headed Eagle"
  PB_NHW_Russian_Protection_desc: "Ever since the Russian Schäffer expedition secured our independence from the kingdom of Hawai'i, we've been grateful to the Russian Empire and helped them however we could, sometimes even against our true will. The truth is, Russian influence over the country has been steadily growing, as they are seeing us as a valuable Pacific fortress to extend their sphere of influence outwards. While investments into industry, technology and the armed forces are very appreciated, their influence may also lead to us becoming a full puppet soon if we do nothing to halt their growth. But some say it's too late to stop the double-headed Eagle from nesting atop our mountains."
  PB_NHW_PMC: "The Kanaloa"
  PB_NHW_PMC_desc: "Originally a Russian idea, the Kanaloa program is an ambitious plan to both expand and create new islands under our domain, open for settlement and future growth. By dumping massive amounts of sand, gravel and rocks into the coasts of the nation we can massively expand our total landmass, both for industrial development funded by our Russian allies, and for the settlement of our Polynesian bretheren."
  
  ##########################
  # EVENTS
  ##########################
  tauai_politics.2.t: "The Kings's Strange Behaviour"
  tauai_politics.2.d: "King Peter, troubled with mental issues all his life, has started to behave more strangely as of late. He became irritable and distant, a few times having angry outbursts during official meetings. Also, for some reason King ordered to increase security around him. It seems that the stress stemming from the demanding rule of entire nation has finally got to him. The King needs to juggle interests of his own Kingdom and Russian Empire, placate Slavic and Polynesian cliques and deal with competing religious institutions, where Orthodox, Catholic and Gnostic Churches are all throwing stones at each other. Figuratively so far, thankfully."
  tauai_politics.2.a: "Perhaps he needs a vacation?"
  tauai_politics.3.t: "Report On King Peter's Behaviour"
  tauai_politics.3.d: "Both our advisers and hidden agents in King Peter's inner circle report about his suddenly changed demeanor - he became irritable and distant, sometimes having angry outbursts during official meetings. Agents also indicate that the King seems to have started to grow wary of something, as he is personally checks his guards' stations and ordered to increase security around his residence. During private talks with his confidants King Peter refuses to talk about such matters, so our agents cannot get an exact reasoning behind King's actions. One proposed theory suggests that latent mental issues are causing a paranoia to be developed in King's mind."
  tauai_politics.3.a: "Monitor the situation."
  tauai_politics.4.t: "The King Is Thinking"
  tauai_politics.4.d: "Peter was contemplating about a meeting that was held earlier today, in the morning. Another meeting about the potential war with Hawai'i. About logistics and possible points of invasion and defence. Taua'i and Hawai'i shared a border after all. And Peter noticed that on the meeting the majority of attendees were Russians. Military mostly, with a few civilians here and there. Before, he didn't think about it much. After all, Russia was an ally. A benefactor of sorts. But now he was worried. Worried that they were planning behind his back. Planning to do something, without his permission, outside his observant eye. Sure, they talked much and shared information, but what's important - what they did not share about? Peter decided to observe them a bit longer, without raising any suspision. Just like he did today. With his flawless acting, no one noticed that he was secretly keeping an eye on everyone there."
  tauai_politics.4.a: "He will work it out."
  tauai_politics.5.t: "Report On King Peter's Behaviour: Part II"
  tauai_politics.5.d: "King Peter's behaviour continues to stay abnormal. During meeting he remains distant and reticent and during dinners he becomes lively and talkative, too much even. Some of our officers report that the King rather clumsily tried to follow them around the palace. They tactfully pretended to not notice the King, so as to not upset him further. Our medical specialists are convinced that paranoia has really been developing in King Peter's mind. They recommend to immediately start the treatment, which includes drug administration, rest and refreshing cold shower."
  tauai_politics.5.a: "Someone give him medicine!"
  tauai_politics.6.t: "The King Is Deciding"
  tauai_politics.6.d: "For an entire month Peter was watching like a hawk for every movement of Russian officers. During meetings and dinner parties he carefully observed what they were talking about, how they behaved and what expressions they did make. Sometimes he even tailed some officers after meeting were over. Of course, they didn't notice anything. Peter decided to work alone, without attracting help from his servants. It's not like he didn't trust his servants, many worked under him for many years after all, but they lacked ability to act inconspicuously and could alert his targets.\n\nFinally, after a month of observatations and careful probing while talking with Russians, the King arrived to conclusion..."
  tauai_politics.6.a: "Indeed, they are planning something."
  tauai_politics.6.b: "There was nothing suspicious in the end."
  tauai_politics.7.t: "The King Is Taking Initiative"
  tauai_politics.7.d: "Peter was grateful, of course. Russia helped Taua'i many times in the past. But the key word - was. The more he watched and the more he observed, the more Peter was convinced that Russian military was getting ready to do something. He didn't know what exactly, but surely it couldn't be good for Taua'i. And for himself too. He needed to counteract Russians, to do something. One variant was to remove them from his presence, get them out of capital and out of sight by giving Russian military some mission. Maybe sending them all to border with Hawai'i or something similar. Another variant is to just send them home and voice protest in Russia's meddling in Taua'i's internal affairs."
  tauai_politics.7.a: "Give them some mission."
  tauai_politics.7.b: "Send them out of the country!"