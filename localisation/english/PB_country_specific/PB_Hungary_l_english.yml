  HUN_opening_screen_picture: "GFX_PB_HUN_opening_picture"
  HUN_country_opening_subname: "We vow, that we wont be slaves any longer!"
  HUN_country_opening_lore: "Since the Hungarian defeat at the Battle of Mohács in 1526, the Hungarian nation has lived under the shadow of foreign empires. In their struggle for survival, many Hungarians first supported the House of Habsburg in the long wars against the Ottoman Empire and the princes of Transylvania. Yet when the Ottomans were finally driven back, the promise of Hungarian self-rule never came. Resentment soon turned to rebellion. During the early 18th century, Francis II Rákóczi led the Kuruc uprising in the Rákóczi's War of Independence. But with the defeat of the rebels and the signing of the Treaty of Szatmár, Habsburg rule was secured once more—supported by a Hungarian nobility willing to preserve its privileges in exchange for loyalty.\n\nYet ideas cannot be defeated so easily. Inspired by the spirit of the French Reformations, secret societies and reformist thinkers began spreading radical ideas throughout Hungary. Figures such as Ignác Martinovics and Miklós Wesselényi helped nurture a growing national awakening that quietly spread through intellectual circles. For decades these ideas smoldered beneath the surface. But in 1848, as the reformation spreads through Hungary, and war broke out in Italy in the First Italian War of Independence, the Habsburg Empire found itself distracted and vulnerable.\n\nAt last, Hungary’s moment had arrived.\n\nas the Hungarians, unhappy with the current Diet would see the Kossuth Lajos and the Peasantry's would begin calling for a revolt on Pest to force the Austrian to accept their “Twelve Points” Demands, After the Rejection of the Twelve Points and the both Collapse and Resignation of Batthyany and his remnants of the loyalist aristocratic supporters, Lajos Kossuth would decide out of his way to become the Mantle of the Revolution.\n\nafter the Hungarian independence, the Kossuth dreams could finally be achieved. And the implementation of the Kossuth Liberal Experiment (Kossuthism) would turns out to be a resounding success, shocking the European Order. but later faced a wall as the old Party of Aristocrats and the Monarchist factions within the new Hungarian State furiously opposed the idea of a purely Republicanary State, But with the unexpected success of the Kossuth Experiments would put off any Monarchist movement from resurfacing over on Hungary.\n\nThe long dominance of the Kossuth Liberals gradually began to lose momentum. The weaknesses of parliamentary democracy became clear when a devastating plague spread across Europe. The government's slow response—combined with Lajos Kossuth’s reluctance to treat the crisis seriously—cost many lives and severely damaged public trust. This failure allowed the conservative opposition to regain strength. After winning the 1891 elections, shortly after Kossuth’s death, the Conservatives returned to power, marking the beginning of a new era in Hungary. A Reactionary one.\n\nAlthough the Conservatives publicly promised to respect the parliamentary system, aristocrats and reactionaries within the government slowly began weakening it from within. Reforms introduced during the Kossuth era were gradually reversed, legal safeguards were eroded, and new laws were introduced that protected conservative elites and restored privileges to the old aristocracy. Later on discontent with the current position over Hungary and the several of the safeguard laws preventing the new oligarchic Aristocrats from truly dominating the rule over Hungary would cause a Reactionary coup in 1903, as Itsvan Tisza and his crownies would order the military to take key buildings and restore the ThoHUNnd year old Kingdom of Hungary. Afterwards installing the House of Esterhazy, Miklos II as the King of Hungary."
  HUN_country_opening_lore_1: "By 1931, unrest within the Kingdom of Hungary had reached a breaking point. A series of crop failures, a deepening economic crisis, and the Conservative government’s complete refHUNl to provide relief pushed the country toward collapse. Many Hungarians felt openly betrayed having bled alongside the Habsburg Germans during the First Great War despite decades of Conservative vows, echoing Lajos Kossuth, that Hungary would never again fight under Austrian command. When the economic downturn triggered bread riots in Budapest, the government ordered troops to open fire on protesters. This massacre ignited a wave of mass unrest across the kingdom.\n\nThe situation spun out of control as entire units of the Hungarian army defected rather than repeat the shootings. Once it was confirmed that the violence had been ordered directly by the Conservative cabinet, Prime Minister István Tisza attempted unsuccessfully to suppress the uprising. Discredited and unable to regain control, he and Miklos II fled the capital, but Tisza was captured on his way to Sopron and executed back in Buda. In the chaos that followed, a coup brought to power a new Jacobin Liberal Dual Government, with the Jacobin faction leading the coalition and Imre Csernyák installed as Head of State.\n\nHowever, Csernyák’s attempts to push his doctrine of “Authoritarian Jacobinism” quickly provoked fierce resistance. Both Moderate Jacobins and Liberals rejected the ideology outright, and growing internal pressure forced Csernyák to resign. His departure created a dangerous power vacuum at the heart of the revolution, allowing the Galileo Circle to assume control though without a clear, unified leader to guide the movement.\n\nIn practice, Szabó Ervin emerged as the de facto head of the new Jacobin Government. He worked tirelessly to stabilize Hungary while fighting the counter-revolutionary White Army. Yet his attempts to unite the two branches of the Forradalmi Tanács (FT)—the Reformist faction and the Syndicalists—failed repeatedly. Liberals and Republican intellectuals remained openly hostile to Jacobinism, their opposition spearheaded by Oszkár Jászi and his influential Freemason network.\n\nBy late 1931, the Galileo Circle found itself paralyzed, unable to present a coherent direction for the revolutionary coalition. Even the prospect of defeating the Whites brought little unity: nobody could agree on who would rule Hungary afterward, and Szabó Ervin’s compromises satisfied no one. The only force keeping the fractured alliance together was the Kuruc Youth paramilitary, whose leadership was notorious for their reign of terror and their support from the previous Csernyák Cabinet.\n\n"On your feet Hungary! the homeland calls!"\n\n"The time is here, now or never! Shall we be slaves or free? We vow, We vow, that we won't be slaves any longer!" - Sándor Petőfi "

