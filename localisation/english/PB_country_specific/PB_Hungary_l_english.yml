  ##########################
  
  PB_HUN_Reign_Of_Terror:0 "Reign of Terror"
  PB_HUN_Reign_Of_Terror_desc:0 "Despite the resignation of Imre Csernyák, the Kuruc Youth Organization remained a looming force over the Hungarian Parliament. Their true potential was restrained only by Tibor Szamuely, who secured his own position within Hungary by striking a bargain with Szabó Ervin, easing the pressure on the Hungarian populace. Yet if Szabó Ervin fails to properly reform Hungary and revive the economy, the Kuruc Youth—under the command of Tibor Szamuely—could revolt at any moment and attempt to seize control of the government. Should that day come, neither Szabó Ervin nor the other Hungarian parties spared during his earlier purges of the nobility may escape the guillotine in the Kuruc Youth's next bloody reckoning."
  
  PB_HUN_Crab_Mentality:0 "Crab Mentality"
  PB_HUN_Crab_Mentality_desc:0 "In the post-mortem aftermath of the Hungarian Revolution, the new, blood-tinted regime would cave in on itself almost immediately. Imre Csernyák presided over a period of complete fracture in the Jacobin Machine, as cooperation with Republicans and the Galileo Circle became a necessity. Not even they were spared: each faction of the ever-blinking eye of 'Providence' dragged down anyone who rose above it, with György Lukács and other members of the club continuing to demand Csernyák's resignation.\n\nThis granted opportunities to various movements, like the Freemasons in Oszkár Jászi’s Civic Radical Club and the Kossuth Republicans under Mihály Károlyi. Culminating in Csernyák finally stepping down from his position—and just like that, the lid of the barrel had been lifted, §Rand the crabs would start climbing§!"
  
  PB_HUN_German_Disarmament:0 "German Imposed Disarmament"
  PB_HUN_German_Disarmament_desc:0 "Our Republic has agreed to accept the terms of the German Ultimatum and disarmed its army. This has greatly reduced the stability and popular support of the Republic."
  
  PB_SER_German_Disarmament:0 "German Imposed Disarmament"
  PB_SER_German_Disarmament_desc:0 "Our Empire has agreed to accept the terms of the German Ultimatum and disarmed its army. This has greatly reduced the stability and popular support of the Empire."
  
  PB_HUN_German_Eco_Treaty:0 "German Economic Treaty"
  PB_ROM_German_Eco_Treaty:0 "German Economic Treaty"
  
  HUN_Danube_PR:0 "Danubian Peasants and Workers Republic"
  
  PB_HUN_Balkan_Powderkeg:0 "The Balkan Powderkeg"
  PB_HUN_Balkan_Powderkeg_desc:0 "The Balkans have always been a region of conflict, and the years since the war have seen the region descend into armed camps, mimicking the web of alliances prior to the larger global conflict. With a revanchist Romania and an expansionist Serbia, revolutionary fervor in Bulgaria, and a fractured Dinaric region, the Balkans are a single crisis away from exploding into general war. The coming conflict has been predicted by nearly every advisor in every Balkan capital."
  
  HUN_spirit_of_rebellion:0 "Spirit of Rebellion"
  
  PB_HUN_onward_from_1848:0 "Onwards from 1848"
  PB_HUN_onward_from_1848_desc:0 "'Hungary is, in a word, in a state of war against the Habsburg dynasty, a war of legitimate defence, by which alone it can ever regain independence and freedom.' — §YLajos Kossuth§!\n\nThe Fraternal Vanguard of Hungary is the only major revolutionary republic in continental Europe. Following the Great War, allegiance to the Habsburgs and the Tisza Regime had cost Hungary nearly a million lives and left the nation in economic ruin. The Revolution ignited in 1931 when the Royal Hungarian Army attempted to suppress protests in Budapest. Veteran militias quickly turned the tables, plunging the nation into civil war. The regime that emerged rejected imperial obligation and bourgeois capitalism, embracing revolutionary republicanism. Hungary now stands as the vanguard of revolution in the Balkans."
  
  PB_HUN_heart_of_nations:0 "The Vanguard of the Minorities"
  PB_HUN_heart_of_nations_desc:0 "Although Kossuth introduced reforms granting minorities the right to use their mother tongue in administration, courts, and schools, István Tisza reversed these measures through aggressive Magyarization. Even when limited concessions were later offered, minorities remained marginalized. After the 1931 Revolution, the fall of the nationalist aristocracy and the rise of Szabó Ervin brought a more inclusive government. While some groups sought autonomy or independence, others—particularly those suffering under reactionary occupation—rallied behind the Jacobin radicals, placing their hopes in the Young Vanguard State. Should that state fail to honor its promises, this fragile unity may yet collapse."
  