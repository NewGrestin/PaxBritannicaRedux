  PB_HUN_faction_management_category:0 "Council of the Revolution"
  PB_HUN_faction_management_category_desc:0 "Party Influence: [?HUN.HUN_party_influence|Y]\nNeutral Influence: [?HUN.HUN_neutral_influence|Y]\nOpposition Influence: [?HUN.HUN_opposition_influence|Y]\n\n Clubs:\n §tGalilei Circle§! Loyalty: [GetLoyaltyGal] Influence §Y[?HUN.HUN_galilei_club_influence|0]§!\n\n §748's§! Loyalty: [GetLoyaltyInd] Influence: §Y[?HUN.HUN_independent_and_48s_club_influence|0]§!\n\n §3Revisionists§! Loyalty: [GetLoyaltyRev] Influence: §Y[?HUN.HUN_revisionist_club_influence|0]§!\n\n §8Civic Radicals§! Loyalty: [GetLoyaltyCiv] Influence: §Y[?HUN.HUN_civic_radical_club_influence|0]§!\n\n [GetMilitaTextHun]§RKuruc Youth§! Loyalty: [?HUN.HUN_kuruc_youth_loyalty|+] Activity: §Y[?HUN.HUN_kuruc_youth_activity|%%]§!"

 HUN_club_meetings:0 "Jacobine Assembly"
 HUN_club_meetings_desc:0 "The Jacobine Assembly has become a battlefield of influence between the various clubs that make up the Revolutionary Government. By negotiating, praising, integrating, or suppressing these factions, we may determine the future of the Revolution."
 HUN_bribe_club_members:0 "Bribe the Assembly"
 HUN_bribe_club_members_desc:0 "The Jacobine Assembly has become a battle of influence between squabbling clubs seeking power in Hungary. If we are to survive the factionalism and the growing threat of the Kuruc Youth, perhaps unconventional means are necessary."
 HUN_private_talks_galilei:0 "A Quiet Conversation"
 HUN_private_talks_galilei_desc:0 "Approach the Galilei Circle behind closed doors and seek to strengthen our relations with Szabó Ervin's Vanguardists."
 HUN_publicly_praise_galilei:0 "Praise the Vanguard"
 HUN_publicly_praise_galilei_desc:0 "Publicly endorse the Galilei Circle and its revolutionary vision, strengthening the Vanguardists' position within the Jacobine Assembly."
 HUN_integrate_galilei:0 "Unite the Revolutionary Vanguard"
 HUN_integrate_galilei_desc:0 "Bring the Galilei Circle further into the government and unite Szabó's Vanguardists behind the Revolutionary Government."
 HUN_undermine_galilei:0 "Expose the Vanguardists"
 HUN_undermine_galilei_desc:0 "Expose the Galilei Circle's authoritarian tendencies and weaken its influence before the Vanguardists gain too much control over the Revolution."
 HUN_imprison_galilei_members:0 "Purge the Szabóists"
 HUN_imprison_galilei_members_desc:0 "Arrest the most influential members of the Galilei Circle and purge Szabó's supporters from the Jacobine Assembly."

 HUN_private_talks_48s:0 "An Appeal to the Republic"
 HUN_private_talks_48s_desc:0 "Approach Mihály Károlyi and the 48's privately, appealing to their Kossuthist ideals in the hope of securing their cooperation with the Revolutionary Government."
 HUN_publicly_praise_48s:0 "Praise the Kossuthists"
 HUN_publicly_praise_48s_desc:0 "Publicly praise the 48's and their Kossuthist legacy, strengthening their position and recognizing their vision for a Liberal Nationalist Republic."
 HUN_integrate_48s:0 "Reconcile the Revolution"
 HUN_integrate_48s_desc:0 "Bring the 48's closer into the Revolutionary Government and reconcile their Kossuthist vision with the future of the Revolution."
 HUN_undermine_48s:0 "Expose the Bourgeois"
 HUN_undermine_48s_desc:0 "Expose the bourgeois interests and liberal compromises of the 48's, weakening their influence within the Jacobine Assembly."
 HUN_imprison_48s_members:0 "Arrest the Liberal Reactionaries"
 HUN_imprison_48s_members_desc:0 "Suppress the 48's by arresting its most influential members and removing their Liberal Nationalist influence from the Assembly."

 HUN_private_talks_revisionists:0 "A Meeting of Minds"
 HUN_private_talks_revisionists_desc:0 "Open a private dialogue with György Lukács and the Revisionists, seeking common ground between their Technocratic Meritocracy and the wider Revolution."
 HUN_publicly_praise_revisionists:0 "Praise the Technocrats"
 HUN_publicly_praise_revisionists_desc:0 "Publicly recognize the Revisionists' commitment to science, education, and technological progress, strengthening their influence within the Assembly."
 HUN_integrate_revisionists:0 "Empower the Meritocrats"
 HUN_integrate_revisionists_desc:0 "Give the Revisionists a greater role in the Revolutionary Government and allow the most capable and educated minds to guide the future of Hungary."
 HUN_undermine_revisionists:0 "Expose the Technocrats"
 HUN_undermine_revisionists_desc:0 "Challenge the Revisionists' technocratic vision and expose the dangers of placing too much power in the hands of an educated elite."
 HUN_imprison_revisionists_members:0 "Purge the Revisionists"
 HUN_imprison_revisionists_members_desc:0 "Arrest the leading Revisionists and remove Lukács's supporters from the Jacobine Assembly before their technocratic vision can take root."

 HUN_private_talks_radicals:0 "A Private Understanding"
 HUN_private_talks_radicals_desc:0 "Open a private dialogue with Oszkár Jászi and the Civic Radicals, seeking common ground with their vision of a secular, scientific, and federal Hungary."
 HUN_publicly_praise_radicals:0 "Praise the Civic Radicals"
 HUN_publicly_praise_radicals_desc:0 "Publicly recognize the Civic Radicals' commitment to scientific progress, secularization, and equal rights for Hungary's national minorities."
 HUN_integrate_radicals:0 "Embrace Civic Progress"
 HUN_integrate_radicals_desc:0 "Bring the Civic Radicals further into the Revolutionary Government and give Jászi's vision of a secular, progressive, and federal Hungary a greater role in the Revolution."
 HUN_undermine_radicals:0 "Expose the Federalists"
 HUN_undermine_radicals_desc:0 "Challenge the Civic Radicals' vision for a federal Hungary, weakening their influence before their demands for ethnic autonomy threaten the unity of the Revolutionary State."
 HUN_imprison_radicals_members:0 "Purge the Civic Radicals"
 HUN_imprison_radicals_members_desc:0 "Arrest the leading members of the Civic Radicals and suppress Jászi's supporters before their influence can spread throughout the Jacobine Assembly."
 HUN_galilei_help_desc:0 "Support the Galileists' vision of revolutionary modernization and encourage scientific, educational, and social progress throughout Hungary."

 HUN_48s_help:0 "The Home is Calling"
 HUN_48s_help_desc:0 "Call upon the Kossuthist tradition to rally the Hungarian people around the defense and reconstruction of their homeland."
 HUN_revisionists_help:0 "Repurpose Old Equipment"
 HUN_revisionists_help_desc:0 "Allow the Revisionists to put Hungary's old equipment and resources to new use, applying their technocratic expertise to the needs of the Revolution."
 HUN_radicals_help:0 "Release Welfare Funds"
 HUN_radicals_help_desc:0 "Release funds for welfare programs aimed at the Commoners, allowing the Radicals to strengthen their support among the people."

 HUN_private_kuruc_operation:0 "A Private Arrangement"
 HUN_private_kuruc_operation_desc:0 "Arrange a secret operation with the Kuruc Youth, allowing us to make use of their organization while keeping their involvement hidden from the wider Assembly."
 HUN_kuruc_guard_joint_operation:0 "The Revolution's Guardians"
 HUN_kuruc_guard_joint_operation_desc:0 "Allow the Revolutionary Government and the Kuruc Youth to conduct a joint operation in defense of the Revolution, bringing the Assembly and Szamuely's forces together for a common cause."

