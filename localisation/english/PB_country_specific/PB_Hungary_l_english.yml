  PB_HUN_Reign_Of_Terror: "Reign of Terror"
  PB_HUN_Kossuth_Nightmare: "Kossuth's Nightmare"
  PB_HUN_Crab_Mentality: "Crab Mentality"
  PB_HUN_Crab_Mentality_desc:0 " In the post-mortem aftermath of the Hungarian Revolution, the new, blood-tinted regime would cave in on itself almost immediately. Imre Csernyák presided over a period of complete fracture in the Jacobin Machine, as cooperation with Republicans and the Galileo Circle became a necessity. Not even they were spared: each faction of the ever-blinking eye of 'Providence' dragged down anyone who rose above it, with György Lukács and other members of the club continuing to demand Csernyák's resignation.\n\n This granted opportunities to various movements, like the Freemasons in Oszkár Jászi’s Civic Radical Club and the Kossuth Republicans under Mihály Károlyi. Culminating in Csernyák finally stepping down from his position—and just like that, the lid of the barrel had been lifted, §Rand the crabs would start climbing§!"

  PB_HUN_German_Disarmament: "German Imposed Disarmament"
  PB_HUN_German_Disarmament_desc: "Our Republic has agreed to accept the terms of the German Ultimatum and disarmed it's army. This has greatly destroyed the support and stability of the Republic."
