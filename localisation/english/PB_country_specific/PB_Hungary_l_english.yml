  PB_HUN_Balkan_Powderkeg:0 "The Balkan Powderkeg"
  PB_HUN_Balkan_Powderkeg_desc:0 "The Balkans have always been a region of conflict and the years since the war have seen the region descend into armed camps, mimicking the web of alliances prior to the larger global conflict. With a revanchist Romania and expansionist Serbia, revolutionary fervor in Bulgaria and the Dinarics having split, the Balkans are a single crisis away from exploding into general war. The coming conflict has been predicted by nearly every advisor in every Balkan capital, and thus a palpable sense of tension has overtaken the region. No one knows quite when the Great Balkan War will begin, but everyone is jockeying to be in a position to fire the first shot."
  
  HUN_spirit_of_rebellion:0 "Spirit of Rebellion"
  PB_HUN_onward_from_1848:0 "Onwards from 1848"
  PB_HUN_onward_from_1848_desc:0 "'Hungary is, in a word, in a state of war against the Habsburg dynasty, a war of legitimate defence, by which alone it can ever regain independence and freedom.' - §YLajos Kossuth§!\n\nThe Fraternal Vanguard of Hungary is the only major revolutionary republic in existence in continental Europe and, if the reactionary powers had their way, it would be the last. Following the Great War, Hungary found itself in crisis. Their allegiance to the Habsburg and the Batthyány Government had cost nearly a million lives, economic collapse and reduced much of the nation to near famine conditions. The touchpaper of the Revolution was easily lit in 1909, when the Royal Hungarian Army attempted to crack down on protests in Budapest.\n\nVeteran's militias, trained and hardened by fighting on the French and North Italian fronts, quickly turned the tables on the Batthyány government. Within a matter of days, the nation descended into civil war and revolutionary violence. The regime that emerged from the revolution would be one founded not on Imperial obligations or bourgeois capitalism, but on revolutionary republicanism. Hungary is the vanguard of the revolution in the Balkans, and her people are dedicated to the ideas upon which the new republic was founded."
  PB_HUN_heart_of_nations:0 "The Heart of Nations"
  PB_HUN_heart_of_nations_desc:0 ""
  PB_HUN_Reign_Of_Terror_desc:0 "Despite the Resignation of Ferenc Münnich, the Robespierre Boys would still prove to be a looming force over the Hungarian Parliement, only holding off its true potential from Tibor Szamuely, which keep it from rampaging around chaos in-exchange for his position within Hungary to be kept from Szabó Ervin himself and putting the pressure off from the Hungarian Populace.\nIf Szabó Ervin fails to properly reformed Hungary and get the Economy running, the Robespierre Boys would under the Command of Tibor Szamuely, could revolt at any time and attempt to take over the Hungarian Government. and Szabó Ervin, or even maybe the rest of the Hungarian Parties that were spared on Ervin earlier purges of the Nobility, could possibly not be spared in the Guillotine in their next purge."



