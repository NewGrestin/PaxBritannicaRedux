  PB_HUN_Balkan_Powderkeg:0 "The Balkan Powderkeg"
  PB_HUN_Balkan_Powderkeg_desc:0 "The Balkans have always been a region of conflict and the years since the war have seen the region descend into armed camps, mimicking the web of alliances prior to the larger global conflict. With a revanchist Romania and expansionist Serbia, revolutionary fervor in Bulgaria and the Dinarics having split, the Balkans are a single crisis away from exploding into general war. The coming conflict has been predicted by nearly every advisor in every Balkan capital, and thus a palpable sense of tension has overtaken the region. No one knows quite when the Great Balkan War will begin, but everyone is jockeying to be in a position to fire the first shot."
  
  HUN_spirit_of_rebellion:0 "Spirit of Rebellion"
  PB_HUN_onward_from_1848:0 "Onwards from 1848"
  PB_HUN_onward_from_1848_desc:0 "'Hungary is, in a word, in a state of war against the Habsburg dynasty, a war of legitimate defence, by which alone it can ever regain independence and freedom.' - §YLajos Kossuth§!\n\nTThe Fraternal Vanguard of Hungary is the only major revolutionary republic in existence in continental Europe and, if the reactionary powers had their way, it would be the last. Following the Great War, Hungary found itself in crisis. Their allegiance to the Habsburg and the Tisza Regime had cost nearly a million lives, economic collapse and reduced much of the nation to near famine conditions. The touchpaper of the Revolution was easily lit in 1931, when the Royal Hungarian Army attempted to crack down on protests in Budapest. Veteran's militias, trained and hardened by fighting on the French and North Italian fronts, quickly turned the tables on the Tisza Regime. Within a matter of days, the nation descended into civil war and revolutionary violence. The regime that emerged from the revolution would be one founded not on Imperial obligations or bourgeois capitalism, but on revolutionary republicanism. Hungary is the vanguard of the revolution in the Balkans, and her people are dedicated to the ideas upon which the new republic was founded."
  PB_HUN_heart_of_nations:0 "The Vanguard of the Minorities"
  PB_HUN_heart_of_nations_desc:0 "Although Kossuth introduced reforms granting minorities the right to use their mother tongue in local administration, courts, schools, and even within non-Magyar national guard councils, Istvan Tisza reversed these measures. In a Faustian bargain with the nobility, he entrenched Magyarization policies that suppressed minority cultures. Even when The Tisza Regime later offered limited concessions, alternative parties still favored Magyarization, forcing minorities to cooperate with his government until the rise of Jászi Oszkár and his Freemasonry movement. After the 1931 Revolution, minorities finally experienced relief. The fall of the nationalist aristocracy and Szabó Ervin’s rise brought a more inclusive government. While some, like the Transylvanians opposed or even sought outright independence, others sees the Slovaks suffering under reactionary northern occupation, which unified the rest of the Ethnic Minorities to threw their support behind the Jacobin radicals, placing their hopes in the Young Vanguard State. If that state fails to honor its promises, however, the fragile unity may collapse."
  PB_HUN_Reign_Of_Terror_desc:0 " Despite the resignation of  Imre Csernyák, the Kuruc Youth Organization remained a looming force over the Hungarian Parliament. Their true potential was restrained only by Tibor Szamuely, who secured his own position within Hungary by striking a bargain with Szabó Ervin, easing the pressure on the Hungarian populace. Yet if Szabó Ervin fails to properly reform Hungary and revive the economy, the Kuruc-Youth—under the command of Tibor Szamuely—could revolt at any moment and attempt to seize control of the government. Should that day come, neither Szabó Ervin nor the other Hungarian parties spared during his earlier purges of the nobility may escape the guillotine in the Kuruc-Youth's next bloody reckoning."



