  HUN_ervin_szabo: "Szabó Ervin"
  HUN_ervin_szabo_leader_desc: "§HBorn:§! §Y7/14/1877 in Szlanica, Árva County, 1st Hungarian Republic§!\n\nOn the Aftermath of Csernyák resignation, Szabó Ervin has always been a notable Politician in Hungary even before the Revolution even came. But who is Szabó Ervin? is he a Radical Revolutionary Jacobin who seeks to overthrow the current and wicked Esterhazy establishment? or is he a tyrant, wanting to bring the downfall of Hungary? Could he handle such a task that was left after Csernyák Resignation? Well.. \n\nBorn into a Jewish family, §YSzabó Ervin§! rose to prominence as a writer for Népszavá, the paper of the Hungarian §RRadical Egalitarians Circle§!, before earning his doctorate in 1899. Joining the Budapest § Metropolitan Library, he quickly distinguished himself with his librarian and statistical work and became one of the spiritual leaders of the Galileo Circle, which he personally shaped into what he called the 'reshaping of the Hungarian social concept.' During these years, Ervin abandoned Radical Egalitarians, embracing §RJacobinism§! and contributing to Jacobin journals. When the §YSecond Hungarian Revolution§! erupted in 1932, he took leadership of the Galileo Circle, organized student movements, and helped stage the his rise after the ousting of Imre Csernyák after the promotion of the Kuruc' Youth from a Paramilitary into the secret police. Which as expectedly, quickly turned to extortion and massacres of minorities, sparking outrage. Ervin was forced to return as a temporary head of administration after the Resignation of Imre Csernyák.\n\nToday, Szabó Ervin walks a dangerous tightrope - attempting to reconcile Syndicalists, Technocrats, and disillusioned Liberals. Whether he can turn Hungary into a true Internationale-Revolutionary state or be forced to resign under pressure from rival factions remains uncertain."
