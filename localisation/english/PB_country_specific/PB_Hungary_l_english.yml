  ### LEADERS ###
  HUN_ervin_szabo: "Ervin Szabó"
  HUN_ervin_szabo_leader_desc: "§HBorn:§! §Y7/14/1877 in Szlanica, Árva County, Kingdom of Hungary§!\n\nBorn into a Jewish family, §YSzabó Ervin§! rose to prominence as a writer for §YNépszavá§!, the paper of the Hungarian Social Democratic Party, before earning his doctorate in 1899. Joining the Budapest Metropolitan Library, he quickly distinguished himself with his librarian and statistical work and became one of the spiritual leaders of the §YGalileo Circle§!, which he personally shaped into what he called the 'reshaping of the Hungarian social concept.'\n\n§YIn 1908§!, Ervin became director of the Budapest Metropolitan Library and worked to make the institution accessible to all Hungarians, especially the socially disadvantaged. His efforts earned him immense popularity among students and intellectuals, and under his leadership, a modern social science library network was born — earning him the title of 'Father of Hungarian Library Science.'\n\nDuring these years, Ervin abandoned Social Democracy, embracing §YRevolutionary Syndicalism§! and contributing to Jacobin journals. When the §YSecond Hungarian Revolution§! erupted in 1909, he took leadership of the Galileo Circle, organized student movements, and helped stage the Jacobin coup that established the new Republic.\n\nIn power, Ervin initiated purges of the aristocracy and nobility, redistributed land to the commoners, and forced the conservative §YHonvédség§! to flee to the White Hungarian Movement, securing Jacobin dominance. Despite his radicalism, Ervin refused to purge liberal parties, seeking cooperation to unify the nation against European reactionaries.\n\nResigning in the 1920s, he handed power to §YFerenc Münnich§! but retained influence over the Jacobin Party. Under Münnich, the §YRobespierre Boys§! secret police were created to fight corruption, but they quickly turned to extortion and massacres of minorities, sparking outrage. Ervin was forced to return as a temporary head of administration to restore order and prevent another crisis.\n\nToday, Szabó Ervin walks a dangerous tightrope — attempting to reconcile Syndicalists, Reformists, and disillusioned Liberals. Whether he can turn Hungary into a true Anarcho-Revolutionary state or be forced to resign under pressure from rival factions remains uncertain."

