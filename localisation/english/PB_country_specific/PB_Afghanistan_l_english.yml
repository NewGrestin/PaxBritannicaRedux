  # IDEAS
  ##########################
  
  PB_AFG_Great_Game:0 "The Great Game Which Never Ends"
  PB_AFG_Great_Game_desc:0 "The Afghan realm has always been a transit area for a myriad of empires since aeons. From Alexander the Great to the Sasanian and the Mughals, these lands have endured all sorts of conquerors — none of which would withstand the test of time despite their pretension. \n\nSince the nineteenth however, we slowly found ourselves to be a crossing point no more, but rather the epicenter of a great game of influence between nowadays khans. Although their predecessors used to rule with brutality and negligence, the new Ozymandias had an inclination for vicious struggles of influence instead; and so, they decided to settle their rivalry with coercion and low blows rather than outright confrontation. Pressured by Victoria in the South and the Tsar in the North, our country soon fractured into pieces as entire regions fell under foreign influence. \n\nThe ability of Russia to secure the ruling dynasty’s loyalty and fall of Persia to revolutionaries in the late 1910’s should have bring such struggle to its end. But the Great Game isn’t a fair game, and those playing it would rather throw off the board than admitting defeat. \n\nCornered in Balochistan with little to no leverage left, London discarded its previous policy of influence to directly supply anyone willing to oppose the Durrani sovereigns. From dissatisfied tribes to outright separatists and even some radicals, everything was good if it meant Russia couldn’t access the warm sea. \n\nAs the Russian bear and its puppet in Kabul respond with harsher and harsher means to this seditious threat, it is to fear the struggle for Afghanistan might only conclude itself in blood."
  PB_AFG_Ethnic_Divides:0 "Ethnic Divides"
  PB_AFG_Ethnic_Divides_desc:0 "Although the principles of nationhood and State centralization came to be widely endorsed on the globe, Afghanistan has nonetheless remained hermetic to such ideas. While the mountainous landscapes of our realm hardens any efforts in building up a unified administration, the myriad of ethnicities inhabiting these lands stands as the main hindrance in establishing a proper national identity. At best, our country is a collection of tribes rather than a nation in being. Perhaps it could have remained as such — after all, Afghanistan had already been successful in establishing its independence and expanding its borders despite these internal divides. \n\nBut when foreign influence comes to be felt at any level of the State, and the country slowly turns into a playground for opposing powers, such strife can rapidly degenerate into something far more violent — tearing down the few remaining bonds which kept the peoples together. \n\nDisgusted by their own condition as second class citizens in Pashtun-dominated lands, the Hazara, Turkmen and Baloch tribes have long dismissed the idea of being part of anything resembling a homeland along their oppressors. As independence becomes a possibility thanks to British arms and Persian aids, the Russian-backed Durrani appear to be in dire straits. For the remaining question is not whether the ethnic conflagration may occur, but rather when it will."
  
