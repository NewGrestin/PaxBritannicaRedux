  PB_AFG_Graveyard_Empire:0 "Empire of Graveyards"
  PB_AFG_Graveyard_Empire_desc:0 "Victory, says our benefactor! Victory for our empire, victory for our nation, victory for our people! Indeed, victorious, at last.\n\n Victorious, but at what cost? \n\nEntire valleys swept away, drowned in the green mist. Villages once vibrant, now laying silent as tombstones. So many voices shut and so many lives stifled. Even vegetation won't grow anymore where it used to, whereas flocks are now but mass graves avoided even by vultures and pests. \n\nDoomed by imperial ambitions, sacrificed on the altar of realpolitik, our country is rotting away like a dead man's corpse. As the old and young are struck by this nightmare, even those yet unborn find themselves condemned to endure the curse plaguing this land — their flesh and bones destined to be twisted by the unnatural fiend. \n\nPerhaps Afghanistan was not a nation in the proper sense; too divided, too prone to infighting, bound only by violence and resentment. But now, Afghanistan is no more at all — condemned to rust, and dissolve, and vanish entirely. \n\nOur story ends here. This is over."
  
  PB_AFG_Civil_War:0 "The Afghan Civil War"
  PB_AFG_Civil_War_desc:0 "With Afghanistan falling into a state of civil war, we are forced to take a stance in the battle between the Durrani dynasty's regime and the various ethnic and revolutionary militias seeking to overthrow the former. However, the situation at home might deteriorate as we involve ourselves further — throwing men and materials in a country most of our citizens really cares about."
