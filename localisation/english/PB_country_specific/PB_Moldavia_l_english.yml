  MOL_Prussia_Of_The_Balkans: "Prussia of the Balkans"
  MOL_Prussia_Of_The_Balkans_desc: "Much like the oft-mentioned Prussians, Moldavia has lived deep into the National Awakening as one of its screaming children—kept in captivity and shaped by constant pressure. The state remains in a near-permanent national crisis, with no friendly faces wherever it turns. With little comfort in the present, Moldavia looks to the past for moments of joy. This longing is easily seen in Moldavian literature, filled with tales of what Moldavia once was, and what it might have been, in spite of what it is now. Perhaps these young, frenzied, and desperate people will yet have their own time of joy—a time when they can look upon themselves as they are and speak with open glee and pride: 'I am Moldavian.'"

