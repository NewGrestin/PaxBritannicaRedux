  flavour.3.t: "Phantom in the Snow"
  flavour.3.d: "In restless dreams lay a white fur landscape\nThe sky and ground meld into one\nThey are nothing but a mindless escape\nFor here there is nothing that ever begun\n\nAll hope is gathered in the gloom\nThe cold shapeless nights erase all thats left of you\nWhether your personality remains is left to assume\nThe worlds that exists split you in two\n\nAt the edge of time you wander endless corridors\nAnd what you once were is left frozen in the ice"
  flavour.3.a: "Formless, I am"

