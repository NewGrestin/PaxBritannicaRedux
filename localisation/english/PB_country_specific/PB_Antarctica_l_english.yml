  AAA_at_the_edge_of_time: "At The Edge of Time"
  AAA_at_the_edge_of_time_desc: "Be strong Bernadette\nNobody will ever know\nI came here for a reason\nPerhaps there is a life here\nOf not being afraid of your own heart beating\nDo not be afraid of your own heart beating\nLook at very small things with your eyes and stay warm\nNothing outside can cure you but everything's outside\nThere is great shame for the world in knowing\nYou may have gone this far\nPerhaps this is why you love the presence of other people so much\nPerhaps this is why you wait so impatiently\nYou have nothing more to teach\nUntil there is no more panic at the knowledge of your own real existence\nAnd then only special childish laughter to be shown\nAnd no more lies no more\nNot to find you no\nMore coming back and more returning\nSouthern journey\nSmall things and not my own debris\nSomething to fight against\nAnd we are all very fluent about ourselves\nOur own ideas of food, a Wild sauce\nThere's not much point in its being over, but we do not speak them\nI had written: 'the man who sewed his soles back on his feet'\nAnd then I panicked most at the sound of what the wind could do to me,\nif I crawled back to the house, two feet give no position,\nif the branches cracked over my head and their threatening me,\nif I covered my face with beer and sweated till you returned\nIf I suffered what else could I do...\n\n-Bernadette Mayer, 1992"

  #TOOLTIPS

  AAA_focus_tt: "§LBe strong Bernadette...§!"

