  PB_MRN_heirs_of_brown_toussaint:0 "Heirs of Brown and Toussaint"
  PB_MRN_heirs_of_brown_toussaint_desc:0 "Our nation was born when we sought our liberty, neither by compromise nor protest, but by military action. We follow the steps of the Ayitians, who carried the flame of liberty for our people wherever they were oppressed, and we honor the legacy of Brown, who left his home in a great crusade upon the great devil of slavery. \n\nAnd as the Lord died to make men holy, let us die to make men free."

