  PB_GER_Far_Eastern_Crisis: "The Far Eastern Showdown"
  PB_GER_Far_Eastern_Crisis_desc: "\n\n\n\n\n\nOur eastern colonies have erupted in rebellion. In this fleeting hour of need for our subjects overseas, one thing is clear: under no circumstances will we allow this revolt to succeed — we cannot afford the humiliation on the international stage.\n\nLaw is only law when backed by sanction. The Far Eastern Commandos must be mobilised to secure the road to Rabaul. If we can secure enough states in the Far East, so much the better. When the countdown expires the Far East will rise, and we will be able to send only volunteers to reinforce our brave fighters there.\n\nThe Fernost Commandos are our ready hand in the case of this, if they reach a state of maximum readiness we will be able to quash the rebels, if their readiness falls to 0 we will be forced to surrender without a fight.\n\n\n\n[get_FernostReadiness]"
 

  PB_DAS_Far_Eastern_Crisis: "The Far Eastern Showdown"
  PB_DAS_Far_Eastern_Crisis_desc: "\n\n\n\n\n\nThe Far East can stand on its own, yet the distant homeland refuses to release its grip. Its leaders still believe they can command our fate from across the world, tightening old chains at the first sign of independence.\n\nIf this frontier is to survive, we must act decisively. The homeland must not be allowed to dictate our future, and the Far East will provide whatever means are necessary to ensure its own freedom.\n\nThe Fernost Commandos are our first obstacle in our war for independence, if they reach a state of maximum readiness we will be put at a disadvantage, if their readiness falls to 0 they will be forced to surrender without a fight.\n\n\n\n[get_FernostReadiness]"

