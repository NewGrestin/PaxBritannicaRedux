  PB_Idea_DAS_Fleet_East: "The German Fleet in the East"
  PB_Idea_DAS_Fleet_East_desc: "\n\n£GFX_TT_DAS_Fleet\n\n\n\nWe are the German Fleet in the East. \n\nEverything in between the Arafura Sea and the Luzon Strait is our domain. Among theses waters, our prerogatives are limitless and our reputation well established. Although the British persist in seeing us as a second-class navy, our success in supporting counter-insurgency operations across East Asia has forced them to reconsider our strength on numerous occasions. \n\nIronically enough, London might see us under a better light than our own government does. Nevertheless, Bureaucrats may howl against Dönitz and the fleet's “humongous” budget, Frankfurt knows very well it needs us around to keep the oversea colonies afloat. \n\nAs Germany's ugly daughter, our armada does not have the luxury to fail and start anew. Either we win or else we shall succumb to Frankfurt's political bickering."
  PB_Idea_Philippine_Emergency: "Philippine Emergency"
  PB_Idea_Philippine_Emergency_desc: "\n\n£GFX_TT_Kokoda \n\n\nAs of Now the Current Situation in the Philippines is not one to Envy, we have lost contact with numerous outposts on the Frontline, and Manila has not been able to provide us with an update, we have refrained from referring to this as a War, and as of now not even Frankfurt knows of this, whether this facade can continue, we are not sure. but something must be done in the coming months. whether it be on our terms, or on theirs, the Future does not tell."
