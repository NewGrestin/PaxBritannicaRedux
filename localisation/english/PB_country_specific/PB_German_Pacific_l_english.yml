  DAS.1.a: "Uh-huh."

  DAS.2.t: "The Status of the Overbeck Territory"
  DAS.2.d: "The Overbeck Territory—encompassing Northern Borneo, the Sulu Islands, and Maguindanao—consists of a loosely connected ring of personal fiefdoms under the Overbeck name.\n\nOriginally acquired through concession rights from British-American firms in 1877 by Gustav Overbeck, he would later be granted the titles of Datu and eventually Rajah over these regions, in a manner not dissimilar to the Southern Rajahs of Borneo.\n\nThe current head of the family, Baron Oscar Karl Maria von Overbeck, has long asserted that German settlers recognize his domain as a separate and distinct administration. With the situation in the region becoming more volatile, now may be the right moment to formalize his rule—and secure his loyalty to our broader strategic goals."
  DAS.2.a: "Uh... yeah, sorry about that."
  DAS.2.b: "Took them long enough. (Play as Overbeck)"

  DAS.3.t: "Approaching the Magdalo Faction"
  DAS.3.d: "The recent offensive from the Philippine rebels has indeed caused us immense strain, but it has also exposed cracks in the unity of the insurrectionists.\n\nThe conservative Magdalo Faction has long played second fiddle to the Magdiwang in various matters of the war, facing fierce criticism for their more \"lax\" approach to conflict—hoping to resolve the bloodshed with diplomacy and appeasement.\n\nIt could be in our interest to open the opportunity for the Magdalo to force the government into negotiations. With the Prince of Löwenstein having friendly ties to the Magdalo, we now possess the back channel necessary to offer such a proposal, and perhaps settle this long-fought war without losing another bastion to the Japanese."
  DAS.3.a: "Send a proposal through Sir Löwenstein"

