  #GEA_Orders.1.a:
  GEA_Orders.2.t: "German East Asia Requests Arms"
  GEA_Orders.2.d: "The naval administration in German East Asia has submitted a formal request for military support to continue their campaign in the Philippine islands. However, many lawmakers in the Bund argue the campaign is a futile effort—draining resources, costing lives, and bringing shame and disorder to our overseas administration.\n\nThe matter is now in our hands."
  GEA_Orders.2.a: "Uhhh... how about I get back to you later?"
  GEA_Orders.2.b: "Fine, take the guns—just don’t ask for more."
  
  GEA_Orders.3.t: "Arms Shipment Arrives"
  GEA_Orders.3.d: "A military shipment has arrived from the homeland, though with strict oversight. The aid was delivered discreetly, under the condition that nothing is wasted and the weapons aren’t simply lost in the jungle.\n\nRegardless, the campaign receives a new breath—though some fear it's just more fuel for a fire no one can control."
  GEA_Orders.3.a: "You're not my dad—I’ll waste as many guns as I want."
  
  GEA_Orders.4.t: "Major Disturbance in the East"
  GEA_Orders.4.d: "Alarming news has reached us: intense guerrilla attacks have erupted across the islands, reportedly supported by foreign interests. Civilian evacuations are now underway in several affected zones.\n\nThe Bund is furious. Many blame the naval leadership in Rabaul for the growing chaos and have begun blocking any attempts to escalate the conflict further. Some demand an investigation—others want resignations."
  GEA_Orders.4.a: "Get Donitz on the line. We need an explanation—now."
  
  GEA_Orders.5.t: "Frankfurt Angered"
  GEA_Orders.5.d: "The government in Frankfurt has summoned our delegation for an urgent explanation over the spiraling situation in the islands. With the deadline for previous leniencies drawing near, the frustration is palpable.\n\nThey have made their stance clear: if order is not restored immediately, our administration will be dissolved and replaced. Force has not been ruled out."
  GEA_Orders.5.a: "I just need more time!"
  
  GEA_Ceasefire.3.t: "Drawing Lines in the Sand"
  GEA_Ceasefire.3.d: "We are faced with a defining moment in the ceasefire negotiations. The role of the New Philippine Government in the world must now be decided. Though our war has sown chaos, the promise of a lasting peace finally emerges. Whether our future brings prosperity or suffering depends on the path we choose."
  GEA_Ceasefire.3.a: "Offer Them Our Protection"
  GEA_Ceasefire.3.b: "Establish Détente with Japan"
  GEA_Ceasefire.3.c: "We’ve Lost… Let Them Join Japan"
  
  GEA_Ceasefire.4.t: "Germany Offers Friendship"
  GEA_Ceasefire.4.d: "Germany is open to our cooperation and seeks to bind us as allies. They offer military support, territorial integrity, and political legitimacy in exchange for alignment. Our response will dictate the nature of our future relations."
  GEA_Ceasefire.4.a: "Refuse the Offer"
  GEA_Ceasefire.4.b: "Accept the Offer"
  
  GEA_Ceasefire.5.t: "The Case for Neutrality"
  GEA_Ceasefire.5.d: "Germany acknowledges our desire to remain neutral in this conflict. They warn that neutrality comes with uncertainty and lack of protection, but also offers us autonomy. Which way shall we go?"
  GEA_Ceasefire.5.a: "Reject Neutrality"
  GEA_Ceasefire.5.b: "Pursue Neutrality"
  
  GEA_Ceasefire.6.t: "An Alliance with Japan"
  GEA_Ceasefire.6.d: "Faced with German proposals, Japan has responded with its own. They are willing to accept us into their sphere and provide protection. Aligning with them may bring conflict with Germany, but also strength in unity."
  GEA_Ceasefire.6.a: "Join Japan"
  
  GEA_Ceasefire.7.t: "The Consequences of Refusal"
  GEA_Ceasefire.7.d: "Our refusal has not gone unnoticed. The German authorities are convening once more to evaluate the situation and determine their next steps. Their reaction may not be favorable."
  GEA_Ceasefire.7.a: "Prepare for what comes next"
  
  GEA_Ceasefire.8.t: "Welcome to the Fold"
  GEA_Ceasefire.8.d: "Our support for Germany has solidified a new chapter in our nation’s journey. Now we await the formal integration and future cooperation that will follow."
  GEA_Ceasefire.8.a: "We are ready"
  
  GEA_Ceasefire.9.t: "Reconsidering Neutrality"
  GEA_Ceasefire.9.d: "Following heated debate and reconsideration, we are offered another chance to vote on our alignment."
  GEA_Ceasefire.9.a: "Remain Neutral"
  GEA_Ceasefire.9.b: "We've made our point clear, were going with Japan"
  
  GEA_Ceasefire.10.t: "No Middle Ground"
  GEA_Ceasefire.10.d: "The Philippines has responded our offer of Neutrality unkindly, standing by their goal of joining Japan's Revoloution with no strings attatched, it seems we really have lost trust."
  GEA_Ceasefire.10.a: "Welp, we tried"
  GEA_Ceasefire.10.b: "This cannot happen, mobilize immediately!"
  
  GEA_Ceasefire.11.t: "The Future is Decided"
  GEA_Ceasefire.11.d: "The time for debate is over. Our alignment is set, and the powers involved have begun reshaping the political landscape. Our sovereignty, territory, and alliances will change forever."
  GEA_Ceasefire.11.a: "Let it be done"
  
