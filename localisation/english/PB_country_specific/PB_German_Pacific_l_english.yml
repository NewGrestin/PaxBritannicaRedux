  DAS_Diplomacy.8.t: "The Second Batavia Expedition"
  DAS_Diplomacy.8.d: "With our land embroiled in conflict, the German Pacific has proposed an expedition between the two nations to cooperate in counter-insurgency programs and further cooperation."
  DAS_Diplomacy.8.a: "A welcome help."
  DAS_Diplomacy.8.b: "Let not the Pacific speak on instability! madness!."

  DAS_Diplomacy.9.t: "The Dutch Agree to Cooperate"
  DAS_Diplomacy.9.d: "The government of the Dutch East Indies has formally agreed to support our Batavia Expedition. With cooperation secured, the operation can proceed far more smoothly. Dutch officials have expressed willingness to coordinate militarily and diplomatically to ensure the expedition’s success."
  DAS_Diplomacy.9.a: "Excellent! This will help immensely."

  ### Batavia Expedition – Dutch Decline ###
  DAS_Diplomacy.11.t: "The Dutch Decline to Cooperate"
  DAS_Diplomacy.11.d: "The Dutch East Indies authorities have rejected our request to collaborate on the Batavia Expedition. Their refusal complicates the geopolitical situation in the region and may hinder our operational plans. Their stance is seen as a deliberate obstruction of our objectives."
  DAS_Diplomacy.11.a: "They will regret this."

  DAS_FarEastCrisis.2.t: "Oddities"
  DAS_FarEastCrisis.2.d: "Today, at approximately 17:55 local time, Naval Intelligence reported that Generalmajor Ferdinand von Bredow has attended an abnormal 62 meetings in the past three weeks and has transmitted roughly 233 telegrams across the Pacific theatre. Of those telegrams, 27 were addressed to Bernhard Dernburg, a known confidant of the general and a member of the Tourism Board of Directors. This surge in private correspondence began immediately following Head Admiral von Spee’s appointment."
  DAS_FarEastCrisis.2.a: "Unimpressive, really. All admirals have friends, don’t they?"

  DAS_FarEastCrisis.3.t: "The Dernburg Dossier"
  DAS_FarEastCrisis.3.d: ""
  DAS_FarEastCrisis.3.a: "Are we the baddies?"

  DAS_CondorClub.2.t: "[From.GetAdjective] Government Accepts Condor Club Invitation"
  DAS_CondorClub.2.d: "The [From.GetAdjective] government has formally accepted the invitation to join Condor, signaling their willingness to cooperate with our administration and participate in joint initiatives."
  DAS_CondorClub.2.a: "Welcome aboard."

  DAS_CondorClub.3.t: "[From.GetAdjective] Government Declines Condor Club Invitation"
  DAS_CondorClub.3.d: "The [From.GetAdjective] government has declined our invitation to join Condor, citing concerns over sovereignty, policy differences, or other priorities."
  DAS_CondorClub.3.a: "A disappointing outcome."

  DAS_CondorClub.4.t: "[From.GetAdjective] Government Joins as Condor Club Observer"
  DAS_CondorClub.4.d: "The [From.GetAdjective] government has agreed to participate in Condor as an observer, allowing them to monitor proceedings and engage in limited cooperation without full membership."
  DAS_CondorClub.4.a: "A cautious step forward."

  PBNews.336.t: "STATE OF EMERGENCY IN ASIA!"
  PBNews.336.d: "The United Colonies of the German Pacific has declared a state of emergency in the Philippine Archipelago, ordering thousands of tourists to evacuate in the coming weeks as guerrilla campaigns intensify. German troops continue to struggle against the growing insurgency, and many in Frankfurt are already urging the government to cut its losses and withdraw. Concerns remain high that the revolutionaries could align themselves with the broader wave of Jacobin uprisings sweeping across the world. Despite this, the government in Rabaul has announced that it has no plans to withdraw in the near future."
  PBNews.336.a: "Can't we all just get along?"

  PBNews.337.t: "LOW PREASSURE AREA IN PACIFIC"
  PBNews.337.d: "Weather Stations in the Pacific have detected an unusual amount of activity off the coast of Guam, while common in the Pacific, great concern has been requested by many in the Scientific Community, with a heavy trash influx on course to intercept its path, and an unusually warm climate in the region, its set to become the most impactful typhoon to hit the Philippines in years, concerns ramping up as Evacuation orders have been urged to cancel in anticipation for landfall, however Pacific Leadership has reassured the public that there is no need to cease counter-insurgency opperations. and estimated death tolls are projected in the tens of thousands."
  PBNews.337.a: "Thoughts and Prayers!"
  ### German Pacific - Peace with Japan
  PBNews.339.t: "PEACE IN THE EAST"
  PBNews.339.d: "German Troops have withdrawn from the Philippine Islands today, under a new agreement with the Japanese and Philippine Governments, the Philippines will be granted independence in what some call a 'Strategic Defeat' for Germany, bringing the Archipelago under Jacobin rule as the first Republic of Asia joins its brothers in China and Japan, the deal comes under contreversial fire as many consider it a defeatist move to give the Germans a way out of the nearly 40 years of occupation."
  PBNews.339.a: "So they just left?"

  ### German Pacific - Peace with Germany
  PBNews.340.t: "PEACE IN THE EAST"
  PBNews.340.d: "Philippine Rebels have agreed to lay down arms in a new agreement that grants the Philippines significant autonomy, with Germany agreeing to withdraw its forces from the archipelago. The deal comes after months of negotiations, with both sides eager to end the conflict that has ravaged the islands for years. Under the terms of the agreement, the Philippines will be allowed to govern itself with a German Viceroy, with Germany providing military support and political legitimacy in exchange for closer cooperation."
  PBNews.340.a: "And what of Japan?"

  ### German Pacific - Detente
  PBNews.341.t: "GERMAN-JAPANESE DETENTE"
  PBNews.341.d: "German and Japanese Delegations have agreed to enter a detente over the Philippine Islands, with both sides agreeing to cease hostilities and withdraw their forces from the archipelago. with both nations agreeing to guarantee the independence of the Philippine Republic, and an agreement to avoid further diplomatic incidents in the Indo-Pacific, the deal comes as German troops peacefully withdraw from the Archipelago."
  PBNews.341.a: "It takes two to tango!"

  ### Zitronella Advertisement
  PBNews.342.t: "ZITRONELLA TONIC"
  PBNews.342.d: "Zitronella Tonic has made an unexpected resurgance in German Markets after nearly 5 years under a nationwide Ban, often considered the underdog of the Cola Wars, Zitronella has seen a exponential rise in market share in particularly Chinese and Australian Markets, the drink itself is labelled a 'Healthier alternative' to other beverages with sugar, The Drink is considered a miracle ichor, with claims of curing everything from the common cold to the Plague."
  PBNews.342.a: ""

