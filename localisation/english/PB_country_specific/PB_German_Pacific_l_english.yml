   GEA.1.t: "The Far Eastern Fleet"
   GEA.1.d: "WIP"
   GEA.1.a: "Uh-huh."

   GEA.2.t: "The Status of the Overbeck Territory"
   GEA.2.d: "The Overbeck Territory—encompassing Northern Borneo, the Sulu Islands, and Maguindanao—consists of a loosely connected ring of personal fiefdoms under the Overbeck name.\n\nOriginally acquired through concession rights from British-American firms in 1877 by Gustav Overbeck, he would later be granted the titles of Datu and eventually Rajah over these regions, in a manner not dissimilar to the Southern Rajahs of Borneo.\n\nThe current head of the family, Baron Oscar Karl Maria von Overbeck, has long asserted that German settlers recognize his domain as a separate and distinct administration. With the situation in the region becoming more volatile, now may be the right moment to formalize his rule—and secure his loyalty to our broader strategic goals."
   GEA.2.a: "Uh... yeah, sorry about that."
   GEA.2.b: "Took them long enough. (Play as Overbeck)"`
