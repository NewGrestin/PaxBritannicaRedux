  DAS_YANCO_tt_delayed: " \n\n\n\n£GFX_ideology_anlib_banner\n\n\n\n[GetZitronellaLock]\n[GetZitronellaLock_Phil_Ceasefire]\n\n§YYanco United§! is the umbrella organization for a sprawling network of Sangley enterprises under the Sangley General Trade Confederation, headquartered in the heart of Manila Bay. Led by the influential Teodoro Yanco, the corporation has risen to prominence through ruthless price-cutting and sharp maneuvering, sparking an intense rivalry with old Creole dynasties such as the Ayala family. Filipino and Creole nationalists alike denounce Yanco United as a threat to national security, citing alleged ties to organized crime, the Taiping Consulate, and shadowy Chinese trading cliques.\n\nThe Confederation's rapid growth has inflamed racial tensions across Luzon—most violently during the Manila Wet Market War of 1922, which erupted into gunfights between Sangley-owned stalls, Filipino shopkeepers, and Creole-backed enforcers.\n\nTeodoro’s father, Luis Yanco—once dubbed the 'King of Manila Bay'—was a known financier of Filipino revolutionary groups during the Great War. Many suspect that this legacy has bought the Yanco clan a certain leniency, if not quiet support, from elements within the current government."
  
