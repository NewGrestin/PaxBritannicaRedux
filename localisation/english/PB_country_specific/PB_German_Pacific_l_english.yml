  DAS.17.t: "Disturbance in the Bismarck Archipelago"
  DAS.17.d: "Urgent Reports have concluded that an Unusual Amount of Activity has been observed amongst German Garrisons in the East, with numerous Brigades already cutting off contact and others in Tense standoffs across the Entire Island Chain.\n\nThese Reports have also been recorded in Papua, Palau, and Guam. However, we are unable to verify these—it seems the Bundestag wasn't all bark after all, and they are making ready to deliver on old promises..."
  DAS.17.a: "The Left Arm of the Law"
  DAS.17.b: "Or the Red Right Hand"

  #DAS_Orders.1.t:
  #DAS_Orders.1.d:
  #DAS_Orders.1.a:
  DAS_Orders.2.t: "German East Asia Requests Arms"
  DAS_Orders.2.d: "The naval administration in German East Asia has submitted a formal request for military support to continue their campaign in the Philippine islands. However, many lawmakers in the Bund argue the campaign is a futile effort—draining resources, costing lives, and bringing shame and disorder to our overseas administration.\n\nThe matter is now in our hands."
  DAS_Orders.2.a: "Uhhh... how about I get back to you later?"
  DAS_Orders.2.b: "Fine, take the guns—just don’t ask for more."
  
  DAS_Orders.3.t: "Arms Shipment Arrives"
  DAS_Orders.3.d: "A military shipment has arrived from the homeland, though with strict oversight. The aid was delivered discreetly, under the condition that nothing is wasted and the weapons aren’t simply lost in the jungle.\n\nRegardless, the campaign receives a new breath—though some fear it's just more fuel for a fire no one can control."
  DAS_Orders.3.a: "You're not my dad—I’ll waste as many guns as I want."
  
  DAS_Orders.4.t: "Major Disturbance in the East"
  DAS_Orders.4.d: "Alarming news has reached us: intense guerrilla attacks have erupted across the islands, reportedly supported by foreign interests. Civilian evacuations are now underway in several affected zones.\n\nThe Bund is furious. Many blame the naval leadership in Rabaul for the growing chaos and have begun blocking any attempts to escalate the conflict further. Some demand an investigation—others want resignations."
  DAS_Orders.4.a: "Get Donitz on the line. We need an explanation—now."
  
  DAS_Orders.6.t: "Plea for an Extension"
  DAS_Orders.6.d: "The Eastern Fleet has requested an extension to the current mandate, citing the need for more time to stabilize the situation in the Philippines. They argue that a premature withdrawal would lead to chaos and a power vacuum, allowing foreign powers to exploit the islands.\n\nHowever, the Bundestag is growing impatient with the ongoing conflict and demands results. The question now is whether we can convince them to give us more time."
  DAS_Orders.6.a: "See if we can have something in order."

  DAS_Orders.7.t: "Fineprint"
  DAS_Orders.7.d: "The Bundestag has resolved to give us another chance to handle the Situation, seeing it as necessary to avoid a global Humiliation, but they Request one thing, the Suspension of Admiral Donitz' Position and a Probe into the War in the coming months.\n\nThe matter as to how we are to achieve calm is unspecified, but our orders stipulate a replacement for the Sacked Admiral, and a Re-orientation from the Previous approach.\n\nSecond in Command Von Bredow has declared his Nomination for the Position, proposing a Mediated approach to seek an Amicable agreement with the Philippines and secure East Asia's position in the light of its current vulnerability.\n\nHowever, a proposal from Venerated and Beloved Admiral Maximilian Von Spee has requested a show of Strength approach, to ensure that the Philippines are not able to compete and the Japanese are scared away by German Military Might, though questions of Von Spee's loyalty are questionable due to his background in the Prussian Navy."
  DAS_Orders.7.a: "Von Bredow is a reasonable choice."
  DAS_Orders.7.b: "Von Spee is our Man."

  DAS_Orders.5.t: "Frankfurt Angered"
  DAS_Orders.5.d: "The government in Frankfurt has summoned our delegation for an urgent explanation over the spiraling situation in the islands. With the deadline for previous leniencies drawing near, the frustration is palpable.\n\nThey have made their stance clear: if order is not restored immediately, our administration will be dissolved and replaced. Force has not been ruled out."
  DAS_Orders.5.a: "I just need more time!"
  
  DAS_Ceasefire.3.t: "Drawing Lines in the Sand"
  DAS_Ceasefire.3.d: "We are faced with a defining moment in the ceasefire negotiations. The role of the New Philippine Government in the world must now be decided. Though our war has sown chaos, the promise of a lasting peace finally emerges. Whether our future brings prosperity or suffering depends on the path we choose."
  DAS_Ceasefire.3.a: "Offer Them Our Protection"
  DAS_Ceasefire.3.b: "Establish Détente with Japan"
  DAS_Ceasefire.3.c: "We’ve Lost… Let Them Join Japan"
  
  DAS_Ceasefire.4.t: "Germany Offers Friendship"
  DAS_Ceasefire.4.d: "Germany is open to our cooperation and seeks to bind us as allies. They offer military support, territorial integrity, and political legitimacy in exchange for alignment. Our response will dictate the nature of our future relations."
  DAS_Ceasefire.4.a: "Refuse the Offer"
  DAS_Ceasefire.4.b: "Accept the Offer"
  
  DAS_Ceasefire.5.t: "The Case for Neutrality"
  DAS_Ceasefire.5.d: "Germany acknowledges our desire to remain neutral in this conflict. They warn that neutrality comes with uncertainty and lack of protection, but also offers us autonomy. Which way shall we go?"
  DAS_Ceasefire.5.a: "Reject Neutrality"
  DAS_Ceasefire.5.b: "Pursue Neutrality"
  
  DAS_Ceasefire.6.t: "An Alliance with Japan"
  DAS_Ceasefire.6.d: "Faced with German proposals, Japan has responded with its own. They are willing to accept us into their sphere and provide protection. Aligning with them may bring conflict with Germany, but also strength in unity."
  DAS_Ceasefire.6.a: "Join Japan"
  
  DAS_Ceasefire.7.t: "The Consequences of Refusal"
  DAS_Ceasefire.7.d: "Our refusal has not gone unnoticed. The German authorities are convening once more to evaluate the situation and determine their next steps. Their reaction may not be favorable."
  DAS_Ceasefire.7.a: "Prepare for what comes next"
  
  DAS_Ceasefire.8.t: "Welcome to the Fold"
  DAS_Ceasefire.8.d: "Our support for Germany has solidified a new chapter in our nation’s journey. Now we await the formal integration and future cooperation that will follow."
  DAS_Ceasefire.8.a: "We are ready"
  
  DAS_Ceasefire.9.t: "Reconsidering Neutrality"
  DAS_Ceasefire.9.d: "Following heated debate and reconsideration, we are offered another chance to vote on our alignment."
  DAS_Ceasefire.9.a: "Remain Neutral"
  DAS_Ceasefire.9.b: "We've made our point clear, were going with Japan"
  
  DAS_Ceasefire.10.t: "No Middle Ground"
  DAS_Ceasefire.10.d: "The Philippines has responded our offer of Neutrality unkindly, standing by their goal of joining Japan's Revoloution with no strings attatched, it seems we really have lost trust."
  DAS_Ceasefire.10.a: "Welp, we tried"
  DAS_Ceasefire.10.b: "This cannot happen, mobilize immediately!"
  
  DAS_Ceasefire.11.t: "The Future is Decided"
  DAS_Ceasefire.11.d: "The time for debate is over. Our alignment is set, and the powers involved have begun reshaping the political landscape. Our sovereignty, territory, and alliances will change forever."
  DAS_Ceasefire.11.a: "Let it be done"
  
  DAS_Zitronella_Deal.3.t: "Begin Negotiations?"
  DAS_Zitronella_Deal.3.d: ""
  DAS_Zitronella_Deal.3.a: "Yes, begin negotiations"
  DAS_Zitronella_Deal.3.b: "No, not yet"

  DAS_Zitronella_Deal.9.t: "Ost Hansa Report"
  DAS_Zitronella_Deal.9.d: "Report on suspected criminal activities in East Asia within territories managed by the Eastern Franchise of the Hanseatic League\n\nSummary: Various officials, both in Germany proper and the Far Eastern Territories, have made frequent complaints about the conduct of Ost Hansa in the region. Government agents have since spent the last few months investigating the matter, and what has been discovered is quite troubling.\n\nClear evidence has been found to confirm that Ost Hansa is guilty of various offenses aimed at both political and economic opponents. The two largest being intimidation and uncompetitive practices.\n\nThe first of these takes the form of using private security forces to enforce their control. Shutting down local businesses that threaten their interests or intimidating people away from the more well-entrenched opponents. Those who attempt to take their business elsewhere find themselves unable to do so. Bosses or workers who fail to comply with Ost Hansa rules often find their homes destroyed, their lives threatened, or even physically assaulted.\n\nUncompetitive practices are also used to combat any potential local rivals. These include but are not limited to: price fixing with aid from businesses within their sphere of influence, forcing all other businesses to go through Ost Hansa to make deals outside German territories, and securing a technological monopoly on new innovations related to their businesses.\n\nIt is highly recommended action be taken but done so cautiously, as Ost Hansa controls most of Tsingtao and many critical trade routes in the Pacific Territories."
  DAS_Zitronella_Deal.9.a: "Keep an eye on that"

  DAS_Zitronella_Raid.3.t: "ZT Place of Interest 21: Debriefing Report"
  DAS_Zitronella_Raid.3.d: "ZT POI 21 has been cited in multiple declassified auditory records as an early industrial waste repository for flammable byproducts used in the manufacture of Zitronella-brand chemical products (see: Zitronella Auditory Report #2335, Declassified 1929). The legal land rights to this region were transferred in 1876 to an unidentified holding company, believed to be incorporated under Spanish colonial jurisdiction. This acquisition predates both the establishment of the Zitronella Company (circa 1891) and any recorded German industrial or military interests in the Philippines.\n\nThe facility is situated on the island of Samar, within the Mt. Yugcon – Mt. Schoton forest region. The terrain is characterized by dense, semi-tropical forestation intersected by multiple narrow dirt access paths. Within the compound, observers have documented several controlled burn sites, each consisting of plastic landfill mounds ignited and maintained at regular intervals approximately 6 meters apart.\n\nThe primary access point to the site is a single wooden structure, with no permanent security personnel observed within the visible perimeter. However, regular convoy activity—primarily logistical in nature—was documented until operations abruptly ceased in 1931, with no formal dissolution records found to date.\n\nRecent soil composition tests indicate the area suffers from severe nutrient depletion, rendering it barely capable of sustaining the surrounding flora. Attempts to conduct subsurface scans using Experimental Ground-Penetrating Radar (GPR) have not revealed any anomalies or subterranean cavities up to a depth of 12.2 meters."
  DAS_Zitronella_Raid.3.a: "Let the games begin."

  DAS_Normal_Path.3.t: "The Papuan Question"
  DAS_Normal_Path.3.d: "The Papuan Union has long been a contentious issue that has halted development of the island, in our quest to civlize these men, why must we withhold progress from them? to the behest of self entitled Russian conversationists who had lived not a day of hardship in these lands?\n\nThe time has come to dissolve this archaic union, and allow for the true potential of Papua to be realized, we can no longer allow these sentimental fools to dictate policy in our overseas territories."
  DAS_Normal_Path.3.a: "Dissolve the Union"
  DAS_Normal_Path.3.b: "Maintain the Status Quo"

  DAS_Normal_Path.2.t: "The Tropic Line"

