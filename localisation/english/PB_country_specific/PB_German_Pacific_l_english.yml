  PB_DAS_Influence_category:  "The Philippine Emergency"
  PB_DAS_Influence_category_desc: "\n\n\n\n\n\nThe Philippine Occupation has grown into a little more than a liability,\noriginally planned to be a temporary peacekeeping mission to ensure the fledgling Philippine Republic is able to govern itself with responsibility,\nthe bounds of our occupation has inflated drastically.\n\nAfter the Japanese Revolution and subsequent collapse of the Qing,\nany withdrawal would incur an immediate gain for the Japanese,\npotentially triggering a domino effect in other colonies.\nIf the Philippines falls, who else would?\n\nBut with the realisation of the troubles of occupying a land thousands of miles from home,\nthe Bundestag has called on numerous occasions to end the bloodshed.\nWith every failed quota or deadline, it grows impatient, unruly, and irrational.\n\nWe are only able to continue our mission with short-sighted deals with Zitronella,\nbut if we are unable to please the Bundestag...\nwe might soon have to face reality. \n\nIf §GBundestag Impatience§! reaches 6, we will be branded a rogue colony."
  PHI_War_Countdown: "Bundestag Grows Angrier..."
