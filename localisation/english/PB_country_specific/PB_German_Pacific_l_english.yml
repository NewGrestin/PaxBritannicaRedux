  #DYNAMIC MODIFIERS
  PB_DAS_Russian_Guinea: "Papuan Union" 
  PB_DAS_Russian_Guinea_desc: "\n\n\n\n\n\n£GFX_TT_DAS_Ivan_Baylaev\n\n\n\n\n\n\n\n\n§YLeader:§! Ivan Timofeyevich Baylaev\n\nThe Papuan Union, Founded in 1875 by Russian Anthropolgist Nikolay Nikolaevich Miklouho-Maclay after his extensive research across the Papuan Coast, under the threat of French and later British Exploitation in nearby Colonies, and the general practice of Blackbirding in the Pacific, Maclay Petitioned Tsar Alexander II to establish a Russian Protectorate. extending Russia's Pacific Colonies. The Papuan Union Functions in a loosely controled Confederation based out of Fort Mikhlouho, with a strict ban on Land Exploitation and a focus on Ecological Preservatiom, to prop up the local Economy, the Union pursued a limited subsistence fruit and nut trade. as the Great war occured, the Papuan Union sought German Protection as Russia was caught up in the Siberian front, and has since remained under German Protection, contributing to the breakdown in Russian-German Relations"
  PB_DAS_Overbeck_Sulu: "Overbeck Concessions - Sultunate of Sulu" 
  PB_DAS_Overbeck_Sulu_desc: "\n\n\n\n\n\n£GFX_TT_DAS_Overbeck\n\n\n\n\n\n\n\n\n§YLeader:§! Oscar Karl Maria von Overbeck\n\nThe Overbeck Concessions comprise several properties and directly owned feudal lands held by the Maharaja of Sabah and the Rajah of Gaya and Sandakan. Often considered the 'first white raja' of Borneo, German interest in the region dates back to the Labuan Trading Company and later the firm of Overbeck & Dent. The Concessions served as one of the earliest cases where German adventurers planted flags wherever they could, representing one of the least regulated and most chaotic methods of colonization. The Philadelphia Times described them as 'the most important transfer obtained by a commercial company since the days of the British East India Company.' Overbeck, however, remained only nominally independent from Frankfurt. The continued cooperation between Overbeck and the Dent Brothers fostered animosity and anxiety, with many fearing that such collusion with British traders could become a timebomb waiting to explode."