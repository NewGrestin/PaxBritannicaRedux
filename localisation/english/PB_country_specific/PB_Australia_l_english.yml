  DAS_Aussie.1.t: "Our Unruly Populace Down Under"
  DAS_Aussie.1.d: "Our bastard of a son that is the held provinces and islands that make up our holdings on the continent of Australia have long been held as unruly as the island itself. \n\nThough the populace there is quite young, not fully grasping their identity quite as well as the other European Holdings in the Southern Continent, despite this the German settlements on the island have rather regularly held themselves to be an odd thorn in our side. One especially that the [DAS.GetName] Government never found themselves quite sure what to do with.\nThe island of Vandiemensland has been a somewhat regular port for Antarctic Research deployments, but with other ports and territories on the mainland they have proven to be a continuous oddity that we maintain an inability to to properly address. \n\nNowadays, however, with the growing unrest from the insurrections in the Philippines; the Australien issue once more comes up.\nFeeling that the ports and islands are more of a strain on our administration than boon, several members of our government feel as though it would be better to give these people semi autonomy from our dominion as we continue to deal with issues that plague our nation."
  DAS_Aussie.1.a: "That Will be One Less Issue to Deal With..."
