  PB_BRA_Order_And_Progress:0 "Order and Progress"
  PB_BRA_Order_And_Progress_desc:0 "§O“Love as principle and order as basis; progress as goal”§! \n\nBrazil stands as a lighthouse in a sea of obscurantism and superstition. While our neighbors may have either devolved toward religious fanaticism and bend to the Bourbon's autocratic rule, we chosed to follow the wisdom of Auguste Comte instead. \n\nAlthough moral and social backwardness may still exist within the confines of our grand country, the bold action of our government to impose the positivist faith and the utopian ideals of class collaboration and rational governance bore its fruit in most of our cities. As the religion of humanity's temples now dominates Sao Paulo and Rio de Janeiro epicenters, and the blessings of scientific truth are provided from the cradle to the grave by a benevolent State apparatus, Brazil's metamorphosis from an oppressed backwater into a spearhead of enlightenment in the New World enters its final phase. \n\nThere's still much to be done however. As the tyrant's armies ready themselves for the upcoming conflagration once more, and the lunatics of Fordlandia still stain rightful brazilian lands with their greed, we must prepare for the ultimate struggle against the forces of reaction. \n\nFor either we succesfully bring the lights of universalism and Reason to all of Ibero-America, or we die trying."
  PB_BRA_Cosmic_Race:0 "Cradle of the Cosmic Race"
  PB_BRA_Cosmic_Race_desc:0 "As we pursue the ideal of a universal republic, it appears the human condition itself is a hindrance on the road to global fraternity. Although we have long rejected the ethno-nationalist creed upheld by the enemies of progress, we can only notice that the races inhabiting Brazil still remain divided whatsoever. As the white, the black and the indigenous remain hostiles against each others despite our many efforts, the necessity to go further beyond a mere racial democracy is all but proven. \n\nFortunately enough, the Second Renaissance has blessed us with the tools to fix mother nature’s greatest mistakes. \n\nUnder the patronage of our brightest minds, Brazil has initiated a long-term plan aimed at removing these debilitating divides for good. Through socio-genetic studies, applied race mixing and other, less acceptable means, we can ultimately get rid of the obstacles blocking the path toward brotherly unity by engineering a race of men perfected in any regards. \n\nThe uninitiated may yell about the nature of our experiment, but we have long dismissed their uneducated opinions. None shall prevent us to usher in the age of the cosmic race, for only it may finally reach the Mündigkeit we sought for so long."
  PB_BRA_Cafe_com_Leite:0 "Cafe Com Leite's Sweet Venom"
  PB_BRA_Cafe_com_Leite_desc:0 "Although we tried to conjure the diseases several times before, the poisons of coronelismo and landowners' lobbies still runs deep into the veins and heart of our Republic. Holding tight their control over the politics of Minas Gerais and Sao Paulo, the agrarian barons of coffee and milk businesses have long tainted local and national politics to better serve their petty pecuniary interests. With everything they touch rotting away, it hasn't been a surprise to learn that our previous, softer policies came to be little to non-effective against their bribery. \n\nWith the long-promised industrialization subsequently stunted and the masses remaining victims of quasi-feudal spoliation, this situation cannot continue indefinitely else the disease might take over the whole body. \n\nAnd if no cure is to be found, then better cut off the infected limbs than giving up our ideal to the venomous oligarchs."
