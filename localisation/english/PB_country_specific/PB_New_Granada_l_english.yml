  ##########################
  # IDEAS
  ##########################

  PB_COL_Cyber_Cruzada:0 "Jaimes' Conquistadors"
  PB_COL_Cyber_Cruzada_desc:0 "In our brother nation to our south, there still exists the Ferdinandists.\n-A line that has long held the throne and crown of Spain. \n\n §OThough with their rule we have experienced defeat after defeat. \nUnder their orders have we seen the traditions, territories, our fathers and sons fallen and lost.§! \n\nThe answer is quite clear to many, we need another king.\nAnother line, one who will defend us like the Crusaders defending the faith and traditions like knights of old.\n§OJaime is that Line.§! \nIt is he that shall defend the lands of the Spanish Empire, her faith, traditions and her sons!\n\nHe is the future of our Empire, and we shall follow him till death!"
  PB_COL_1v1_lilbro:0 "Hundred Years' War"
  PB_COL_1v1_lilbro_desc:0 "Ever since Francisco de Miranda landed on the shores of Venezuela and proclaimed the Colombian Empire, has the lands of Granada and Colombia been in a state of war, in some form or another between our two territories. \n\nFor a hundred years now, generation after generation of families have fallen, son after father, on the front between our two nations.\n\n Despite skirmish after skirmish being faced along the lines of our nations, §RIt is Not the 1800s.§! \nWar has changed, there exists new weapons of a new age to wage war.\n\nWeapons that our fore fathers did not bear. \nThis war might have lasted a hundered years, but it will end within this decade...\n §OAs long as long as there is such nations as Colombia or Granada a struggle must go on.§!"
  # INTERNAL STATES
  PB_COL_Captaincy_Santo_Domingo: "General Captaincy of Santo Domingo"
  PB_COL_Captaincy_Santo_Domingo_desc: "\n\n\n\n\n\n\n£GFX_TT_COL_Octavio_Rojas\n\n\n\n\n\n\n\n\n§YLeader:§! Octavio Antonio Beras Rojas\n\nThe General Captaincy of Santo Domingo has always lived an extremely volatile existence. During the Ferdinandist War, it served as a Carlist launching pad against the Ferdinandists for forty years following the Spanish Interregnum, before eventually being ousted by Pedro Santana and swearing fealty to King Ferdinand. This shift was made possible through the key—though begrudging—support of Dominican friars, who would later become deeply entrenched in Santo Domingo’s politics. Despite its loyalty, the colony was largely sidelined for years, remaining a General Captaincy while the Viceroyalty of New Spain retained its status, even though New Spain had been reduced to a mere shadow of its former glory. The contrast was stark: Santo Domingo had nearly twice the population of New Spain, yet continued to bow in submission. For now, it remains obedient—but just across the strait lies Ayiti, ever ready to strike should Santo Domingo dare to make a bid for independence."
  PB_COL_Viceroy_New_Spain: "Viceroyalty of New Spain"
  PB_COL_Viceroy_New_Spain_desc: "\n\n\n\n\n\n\n£GFX_TT_COL_Ramon_Basterra\n\n\n\n\n\n\n\n\n§YLeader:§! Ramón de Basterra y Zabala \n\nThe Viceroyalty of New Spain is the last vestige of what was once the largest contiguous entities in North America. Now, depending on who you ask, it’s one of the smallest. The Viceroy survived only thanks to reinforcements from New Granada, which brought thousands of Spaniards loyal to the crown, and later waves of refugees from the wars of Central America. Over time, New Spain became a tourism hub, far safer and more accessible than the distant Andes or the volatile Santo Domingo, earning a reputation as a new center for peninsulares. Still, challenges like the construction of the Nicaragua Canal remain points of debate, with both pros and cons. New Spain has benefited not just from the influx of Spaniards nostalgic for older times and from being one of the most stable regions in Central America, but also from Ramón Basterra’s Hispanidad policies and his support for the arts of the new age."
  PB_COL_Audiencia_Quito: "Real Audiencia of Quito"
  PB_COL_Audiencia_Quito_desc: "\n\n\n\n\n\n\n£GFX_TT_COL_Leopoldo_Marin\n\n\n\n\n\n\n\n\n§YLeader:§! Leopoldo Saro Marín\n\n."

