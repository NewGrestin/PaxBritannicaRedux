  # INTERNAL STATES
  PB_NWG_Captaincy_Santo_Domingo: "General Captaincy of Santo Domingo"
  PB_NWG_Captaincy_Santo_Domingo_desc: "\n\n\n\n\n\n\n£GFX_TT_NWG_Octavio_Rojas\n\n\n\n\n\n\n\n\n§YLeader:§! Octavio Antonio Beras Rojas\n\nThe General Captaincy of Santo Domingo has always lived an extremely volatile existence. During the Ferdinandist War, it served as a Carlist launching pad against the Ferdinandists for forty years following the Spanish Interregnum, before eventually being ousted by Pedro Santana and swearing fealty to King Ferdinand. This shift was made possible through the key—though begrudging—support of Dominican friars, who would later become deeply entrenched in Santo Domingo’s politics. Despite its loyalty, the colony was largely sidelined for years, remaining a General Captaincy while the Viceroyalty of New Spain retained its status, even though New Spain had been reduced to a mere shadow of its former glory. The contrast was stark: Santo Domingo had nearly twice the population of New Spain, yet continued to bow in submission. For now, it remains obedient—but just across the strait lies Ayiti, ever ready to strike should Santo Domingo dare to make a bid for independence."
  PB_NWG_Viceroy_New_Spain: "Viceroyalty of New Spain"
  PB_NWG_Viceroy_New_Spain_desc: "\n\n\n\n\n\n\n£GFX_TT_NWG_Ramon_Basterra\n\n\n\n\n\n\n\n\n§YLeader:§! Ramón de Basterra y Zabala \n\nThe Viceroyalty of New Spain is the last vestige of what was once the largest contiguous entities in North America. Now, depending on who you ask, it’s one of the smallest. The Viceroy survived only thanks to reinforcements from New Granada, which brought thousands of Spaniards loyal to the crown, and later waves of refugees from the wars of Central America. Over time, New Spain became a tourism hub, far safer and more accessible than the distant Andes or the volatile Santo Domingo, earning a reputation as a new center for peninsulares. Still, challenges like the construction of the Nicaragua Canal remain points of debate, with both pros and cons. New Spain has benefited not just from the influx of Spaniards nostalgic for older times and from being one of the most stable regions in Central America, but also from Ramón Basterra’s Hispanidad policies and his support for the arts of the new age."
  PB_NWG_Audiencia_Quito: "Real Audiencia of Quito"
  PB_NWG_Audiencia_Quito_desc: "\n\n\n\n\n\n\n£GFX_TT_NWG_Leopoldo_Marin\n\n\n\n\n\n\n\n\n§YLeader:§! Leopoldo Saro Marín\n\n."
  
