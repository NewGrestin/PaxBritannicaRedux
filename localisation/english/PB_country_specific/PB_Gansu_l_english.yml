 ##########################
 # IDEAS
 ##########################
 PB_GAN_coalition:0 "The Armed Oxymoron"
 PB_GAN_coalition_desc:0 "The Mongolian insurgency, while united against Russia, is an armed oxymoron; for the insurgency is one of the few times reactionaries and revolutionaries are cooperating. The alliance is comprised of the Revolutionaries, under Ulanhu, and the Reactionaries, under th Bogd Khan. For now, the Bhuddists have provisionally accepted Ulanhu as the face of the rebellion, but, shall the Russians be kicked, it is clear both sides will fight to achieve total control over Mongolia."
 PB_GAN_spirit_of_the_steppes:0 "Spirit of the Steppe"
 PB_GAN_spirit_of_the_steppes_desc:0 "For two decades now, the Mongolian people have been in a constant fight for their freedom, first from the Chinese imperialists, and now from the Russian colonists and their boot licking puppets. They think their weapons and their collaborators will win them the war, rest assured that it won't. \n\nAs long as a single Mongol lives, the war continues. We have rode through these steppes for a millenia, and in another millenia we will still be here while their bodies lie cold in their motherlands. Even if it might take twenty or two hundreds years, Mongolia will one day be free again and her people will ride forevermore under the eternal sky."
 PB_MON_Expedition:0 "The Manchurian Expedition"
 PB_MON_Expedition_desc:0 "The Manchurian Expedition, created by Andrei I in Zheltorossiya, is the main force able to fight Ulanhu. But such help isn't a gift. Andrei wants to consolidate Mongolia under himself, and the Expedition both forces Demchugdongrub to make bigger concessions each day, and settles ethnic Russians in Urga, almost colonizing Mongolia. Shall Ulanhu be crushed, Mongolia will become a Zheltorossiyan asset."
 PB_MON_Foreign_Invaders:0 "Foreign Occupation"
 PB_MON_Foreign_Invaders_desc:0 "The Mongolian Principality is nothing but a Façade for Russian presence in the region. Following the Collapse of Qing China, Russia quickly moved in the steppes, allowing Demchugdongrub to lead a vassal in Urga. With few to no ethnic Mongolian soldiers willing to fight against their brothers, most of Urga's divisions are mainly comprised of Russo-Manchurian militaries and mercenaries. This strongly illegitimizes the Principality, and keeps the nation in a never-ending occupation; which is now dependent on to survive."
 GAN.1.t: "Skirmishes in Mongolia"
 GAN.1.d: "We've won against the Russians, but the National Unity Government has already crumbled, and the Revolutionaries are shooting at the Bhuddists, and vice versa. Large contingents of the two movements have already met in the capital to see who'll get to lead Mongolia."
 GAN.1.a: "The MSS marches on!"
 GAN.1.b: "The RPGM wins!"
 GAN.1.c: "The Bogd Khan survives!"