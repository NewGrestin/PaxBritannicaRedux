 PB_GAN_spirit_of_the_steppes:0 "Spirit of the Steppe"
 PB_GAN_spirit_of_the_steppes_desc:0 "For two decades now, the Mongolian people have been in a constant fight for their freedom, first from the Chinese imperialists, and now from the Russian colonists and their boot licking puppets. They think their weapons and their collaborators will win them the war, rest assured that it won't. \n\nAs long as a single Mongol lives, the war continues. We have rode through these steppes for a millenia, and in another millenia we will still be here while their bodies lie cold in their motherlands. Even if it might take twenty or two hundreds years, Mongolia will one day be free again and her people will ride forevermore under the eternal sky."