  HWI_emma_rooke: "Emma Na'ea Rooke"
  HWI_emma_rooke_desc: "Queen Emma Kalanikaumaka'amano Kaleleionalani was born to a noble Owyhee household at a critical point in the islands' history. Her father was closely tied with British military missions, and Emma was afforded a much-needed education when many natives lacked such opportunity.\n\nHer governess of English blood nurtured a love for reading, writing, and scholarship. Emma also became a skilled equestrian, famed for her riding feats even into her advanced years.\n\nMarried to Kamehameha IV, she proved instrumental in founding the Church of Owyhee, a breakaway branch of Anglican faith. At court she mastered diplomacy and intrigue, securing the royal family's dominance over rival houses.\n\nIn 1865, Queen Emma met Queen Victoria, forging a bond that endures to this day. Some whisper it is Victoria's medicine and augmentations that sustain Emma's strength. She survived the Royal Elections of the 1870s, defeating usurpers she claims still languish in her prison cells as a warning to pretenders.\n\nYet now rumors of ill health circulate. How long Emma's earthly form will endure remains uncertain."
