  # HAWAII GENERALS
  ##########################
  HWI_john_harris_soper: "John Harris Soper"
  HWI_samuel_nowlein: "Samuel Nowlein"
  ##########################
  # IDEAS
  ##########################
  PB_HWI_Mele_Kaua: "To the Tune of Mele Kaua"
  PB_HWI_Mele_Kaua_desc: "\n\n£GFX_TT_HWI_1\n\n\n\nAfter the success of Schäffer expedition in 1815, the Kingdom of Taua'i managed to regain its freedom from Hawai'is influence, and even managed to expand into the island of O'ahu, creating a land border between the two kingdoms. Now both of them prepare for another inevitable war to finalise what King Kamehameha I couldn't do, finally uniting the archipelago."
  PB_HWI_Fifth_Column: "A House built on Fifth Columns"
  PB_HWI_Fifth_Column_desc: "\n\n£GFX_TT_HWI_2\n\n\n\nThe large scale economic growth of the Kingdom of Hawai'i has become a double-edged blade. On one side, our plantations and factories are more profitable and productive than ever, bringing Hawaii to a position in which it can confidently sustain itself, But on the other side, the massive excess of slaves and foreign workers we have brought into the island have become one of the goverments greatest headaches to date, specially seeing as most of them come from Asia, China and the Philippines in particular. Rumors spread of Japanese involvement, funding and perhaps even arming this Jacobin fifth column, and few doubt that they wouldn't take their shot at a Hawai'ian revolution if given the opportunity."
  PB_HWI_Harbour_Of_Pacific: "Open Harbour of the Pacific"
  PB_HWI_Harbour_Of_Pacific_desc: "\n\n£GFX_TT_HWI_3\n\n\n\nThe location of our home, the Hawaiian archipelago, grants it perhaps it's greatest advantage, being the center of Pacific trade  and thus making us, and specially our capital in Lahaina, the natural harbour for all passing ships. However, it may also be our biggest weakness alwell, as if our northern rivals in the kingdom of Taua'i start a war against us, our entire position as a safe harbour and throwing the production of our largest export, plumbs, into chaos. If a war not only occurs but also drags on for longer than we can sustain, §Rthe consequences may catasthrophic, be they coming from direct British intervention, or from our growing internal Jacobin issue.§!"
  PB_HWI_Masons: "The Hale Nauā"
  PB_HWI_Masons_desc: "\n\n£GFX_TT_HWI_4\n\n\n\nFormed under the tutelage of Prince Kalākaua before his passing, the Hale Nauā functions as a secret society of Hawai‘i’s intellectuals and elites, dedicated to the pursuit of knowledge and the betterment of the Hawaiian people. Its members are drawn from various fields, including science, art, and politics.\n\nPrior to Kalākaua’s death, it had amassed much of the aristocratic opposition to Queen Emma’s ascension to the throne, remaining influential after the royal election and into the present day. However, the society now faces an imminent challenge: the growing importation of foreign workers and perceived outsiders, as well as uncertainty over whether the Kingdom’s relationship with Britain will endure beyond the Queen’s oncoming death.\n\n Concerns in recent days have been over the percieved split between Kalākaua’s old allies and the new generation of masonic elements spurned by occultism both hawaiian and foreign, and the so called Kaʻonaites and their Prophet, rumored to be the prophecised ruler of all Owyhee."
  PB_NHW_Polynesia: "Polynesia's Maiden Hope"
  PB_NHW_Polynesia_desc: "The people of Polynesia once ruled every island from New Zealand to Rapa Nui, until the European colonists robbed us from our birthright, pillaging our once pristine islands for all their worth. Even here in Hawaii, our southern neighbors are nothing but a glorified British puppet, but we are different. We stand as the last truly free Polynesian nation, and we must carry this burden with reverence and honor. We must invite any and all of our brothers from across the waves who wish to be free from foreign colonialism, and let them settle down on our islands, both natural and man-made, to create a true Polynesian state. Besides the extra manpower and population will be needed to unite our homeland."
  PB_NHW_Russian_Protection: "Under the Wings of a two headed Eagle"
  PB_NHW_Russian_Protection_desc: "Ever since the Russian Schäffer expedition secured our independence from the kingdom of Hawai'i, we've been grateful to the Russian Empire and helped them however we could, sometimes even against our true will. The truth is, Russian influence over the country has been steadily growing, seeing us as a valuable Pacific fortress to extend their sphere of influence outwards. While investmeents into industry, technology and the armed forces are very appreciated, their influence may also lead to us becoming a full puppet state soon if we do nothing to halt their growth, but some say it's too late to stop the double-headed eagle from nesting atop our mountains."
  PB_NHW_PMC: "The Kanaloa"
  PB_NHW_PMC_desc: "Originally a Russian idea, the Kanaloa program is an ambitious plan to both expand and create new islands under our domain, open for settlement and future growth. By dumping massive amounts of sand, gravel and rocks into the coasts of the nation we can massively expand our total landmass, both for industrial development funded by our Russian allies, and for the settlement of our Polynesian bretheren."
  
  ##########################
  # EVENTS
  ##########################
  hawaii_politics.2.t: "The Queen's Declining Health"
  hawaii_politics.2.d: "The medical team that tirelessly monitors Her Majesty Emma’s health reports a gradual deterioration of her condition. The situation is exacerbated by Her Majesty’s advanced age and the limitations of augmentations and medications. Specialists additionally summoned from the United Kingdom have yet to find a way to resolve the situation, and according to their preliminary estimates, Her Majesty is likely to live for barely less than a year. The government is already taking measures in response to the impending emergency. Law-enforcement authorities are holding drills in case of social disturbances and senior officials are making various preparations, among them planning the funeral of Queen Emma and the announcements to the nation and the world."
  hawaii_politics.2.a: "God, save the Queen!"
  hawaii_politics.3.t: "The Queen Passed Away"
  hawaii_politics.3.d: "Last night Queen Emma passed away in her sleep, succumbing to her advanced age. Queen Emma, who has died in the age of 98, reigned for 64 years, bringing peace and prosperity to the whole nation. Her whole life was dedicated to country and memory of Queen Emma will be forever etched in the memory of people. Government, already have been prepared for such emergency, declared a national mourning period of 10 days, with Robert Wilcox stepping up as a regent. At the same time preparations for an election day are underway, as various political parties are rallying behind their chosen candidates."
  hawaii_politics.3.a: "Mournful times, but nation endures."
  hawaii_politics.4.t: "Candidates And Their Platforms"
  hawaii_politics.4.d: "Queen Emma didn't left any direct descendants, so there are only two contenders for the Hawai'ian throne. They are: Victoria Kawēkiu Ka'iulani from the House of Kalākaua and Robert Keōua Wilcox, son of the current Regent and whose mother came from House of Laʻanui. The parties behind them run different political paltforms and draw support from different groups of population. Victoria Ka'iulani champions workers rights, social protection and enjoys a wide support of common people, especially among the workers. Robert Wilcox is less popular among the population, but aristocrats, large companies and military circles do support his conservative platform. Both candidates and their respective parties are getting ready to start electoral campaign, waiting for the 10 day national mourning to end."
  hawaii_politics.4.a: "Let's hope everything will go smoothly."
  hawaii_politics.5.t: "Election Day Of 1934"
  hawaii_politics.5.d: "The fateful day of elections finally came. Both candidates spent a large amount of time and resources in order to tip the scale in their own favor. Both of them also were sure in their victory, awaiting in their summer palaces for the good news.\n\nWith each passing minute tension in the air increased, becoming almost palpabale. Finally, a few minutes past 3 pm, a group of legislators left Lahaina Courthouse and loudly announced to the crowd that have been gathered before the building..."
  hawaii_politics.5.a: "...Victoria was chosen a Queen!"
  hawaii_politics.5.b: "...Robert was chosen as a King!"
  hawaii_politics.6.t: "The New Queen Of Hawai'i"
  hawaii_politics.6.d: "Cheers erupted among the gathered people, drowing out the dissatisfied shouts and protests of the defeated side. Journalist immediately rushed away, in a hurry to deliver news to the whole country. And soon celebrations all across the towns and villages followed, as most were sure that the new era of prosperity will follow. The lost side had enough grace and sensibility to accept the defeat and letter of congratulation from Robert Keōua Wilcox were delivered to Her Majesty Victoria."
  hawaii_politics.6.a: "Long live the Queen!"
  hawaii_politics.7.t: "The New King Of Hawai'i"
  hawaii_politics.7.d: "The announcement was met with a few cheers, but they were easily silenced by the dissatisfied shouts of the defeated side. The shouts about Regent Wilcox stealing the throne for his son reverbated through an air. Soon the crowd surged forward, as if threatening to engulf the legislators, who immediately turned back and run into the Courthouse. It took barely a minute for the crowd to break down the door and windows and enter the building. The now wild mob ransacked the Courthouse, searching for the legislators. Unfortunately, though most legislators escaped, a few were caught and beaten by the mob. Shortly after the police reinforcments stationed nearby arrived and dispersed the angry mob, arresting most of them."
  hawaii_politics.7.a: "Long live the King?"
  hawaii_politics.8.t: "The Disconent Spreads"
  hawaii_politics.8.d: "The news about Rober Keōua Wilcox being chosen as a king and the arrests of people in Courthouse spread through the nation like a fire. Immediately opposition to the new king was formed, as they insisted on elections being a sham, merely a way for the Regent to secure Hawai'i for himself. People surged on the streets and already there are reports of clashes between the police and the protesters. The hurriedly formed new government urged for the population to disperece and return to their homes. The new King delivered a speech through radio, but it seems that it did little to calm the people."
  hawaii_politics.8.a: "Surely, people won't do anything drastic?"
  hawaii_politics.9.t: "Revolution In The Making"
  hawaii_politics.9.d: "Clashes between protesters and the police have turned into full-blown bloody fights, with both sides suffering casualties. After few days of indecision, government finally called in military to supress the protests and declared an emergency. But these decisions only intensified the fights, with more and more people joining the protesters. Residents of the capital barricaded the streets of the capital and Jacobins groups came out from the underground, using unrest to join forces with the people. Right now, the current scale of events cannot be called simple protests anymore. It's a revolt, a revolt swiftly consuming the entire Kingdom."
  hawaii_politics.9.a: "Call the reinforcements! From anywhere!"
  hawaii_politics.10.t: "Culmination Of Revolution"
  hawaii_politics.10.d: "Battles raged all over Lahaina for a week. Jacobins forces managed to take large parts of Front Street, with small pockets of government forces still holding out in the buildings. Lahainaluna Road saw heavy fighting for it, as it was a street where majority of government buidlings were situated, like Lahaina Courthouse. Most of the Lahainaluna Road is under government's control and this is where government's HQ was established. Now, the last stage of battle is near, as both sides exhausted from the fighting are gathering forces for one final push. Jacobins are openly radioing all across the country for the people to come and join the fight.\n\nElsewhere, battles are ungoing too, with the most bloody one having happened in the community Olowalu. There Filipino workers organised strikes, using the elections as a pretext to voice their grievances against plantation owners. The arrived police didn't stand on ceremony and broke the strike, leaving behind a few dozen dead plantation workers. The enraged workers, led by renown Pablo Manlapit, fought back and overrun the police and strikebreakers. Quickly they gathered forces from the plantations and villages and decided to march on capital."
  hawaii_politics.10.a: "The government forces pushed before Jacobin's reinforcements arrived."
  hawaii_politics.10.b: "Reinforcements from Olowalu arrived in time!"
  hawaii_politics.11.t: "Revolution Was Crushed"
  hawaii_politics.11.d: "Our forces managed to break through barricades around Lahainaluna Road and reliefed the surrounded troops at the Front Street. Jacobins forces retreated from the capital, leaving behind their numerous fallen comrades. We also managed to capture many of their leaders. Our victory was in time, as Jacobin's reinforcements from the west of Lahaina arrived. We hastily organised defences and Jacobins, not even trying to rest after the march, striked at us. Though our troops were tired after days of fighting, we managed to weather out the first assault. And then the second. And the third one. After their failures to break through our defences, it seems the morale of Jacobins hit the ground and they just run away right and left."
  hawaii_politics.11.a: "It's finally over..."
  hawaii_politics.12.t: "Triumph Of Revolution"
  hawaii_politics.12.d: "Our forces arrived at the capital just in time, as government threw bodies at the barricades and tried to crash our fellow comrades. Quickly we striked at their flanks, overruning their positions and capturing Lahaina. The remained government forces surrendered and from this moment we decide the fate of country. Before us stands many problems that must be decided, among them organizing a new government. But this time, it will government for the people.\n\nPablo Manlapit hailed as the saviour of the Revolution, due to his forces helping to give a final and decisive blow at the tyrants, took the reins of leadership."
  hawaii_politics.12.a: "Long live the revolution!"
  
  
