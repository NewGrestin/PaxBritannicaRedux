  # LEADERS 
  ##########################
  HWI_emma_rooke: "HM Emma"
  HWI_emma_rooke_leader_desc: "§HBorn:§! §Y2/1/1836 in Lahaina, Maui, Kingdom of Hawai'i§!\n\n§YQueen Emma Kalanikaumaka'amano Kaleleionalani was born to a noble Hawaiian household at a critical point in the islands' history. Her father was closely tied with British military missions, and Emma was afforded a much-needed education when many natives lacked such opportunity.\n\nHer governess of English blood nurtured a love for reading, writing, and scholarship. Emma also became a skilled equestrian, famed for her riding feats even into her advanced years.\n\nMarried to Kamehameha IV, she proved instrumental in founding the Church of Hawai'i, a breakaway branch of Anglican faith. At court she mastered diplomacy and intrigue, securing the royal family's dominance over rival houses.\n\nIn 1865, Queen Emma met Queen Victoria, forging a bond that endures to this day. Some whisper it is Victoria's medicine and augmentations that sustain Emma's strength. She survived the Royal Elections of the 1870s, defeating usurpers she claims to still languishing in prison cells as a warning to pretenders.\n\nYet now the old queen finds herself closer to death than ever before, following a failed attempt to become eternal. Trapped inside her own body for months after the failed inmortalization procedure left her in a deep coma, many believe the queen will never will never wake up, and are preparing for the aftermath of such an event."
  HWI_robert_william_wilcox: "Robert William Kalanihiapo Wilcox"
  HWI_robert_william_wilcox_regnal: "Regent Robert William Kalanihiapo Wilcox"
  HWI_victoria_kauilani: "Victoria Kawēkiu Ka'iulani"
  HWI_victoria_kauilani_regnal: "HM Victoria I"
  HWI_victoria_kauilani_leader_desc: "§HBorn:§! §Y16/10/1875 in Lahaina, Maui, Kingdom of Hawai'i§!\n\n§YQueen Victoria Kauilani's life has been defined by her sickness. Though she tried to stay healthy and active with sports like surfing and swimming, her chronic illnesses became grdually worse during her twenties. Because of this, she was sent for treatment in Britain for several years, though she was not fully healed. To this day, she is under constant treatment and supervision, leading to her constant use of heavy makeup to hide signs of poor health and of treatment. In 1911 she married Japanese prince Yamashina Kikumaru, though he would soon become an exile from his own homeland following the Japanese revolution. The pair has, unfortunately, never been able to produce a child due to her illnesses, as the intensity of some of her treatments could carry the possibility of the treatment killing the child, making her unable to give birth. Still, the new queen is determined to lead the people of Hawai'i as best she can, chronic illnesses be dammed."
  HWI_robert_keoua_wilcox: "Robert Kalanikupuaikalaninui Keōua Wilcox"
  HWI_robert_keoua_wilcox_regnal: "HM Robert I"
  HWI_pablo_manlapit: "Pablo Manlapit"
  HWI_pablo_manlapit_leader_desc: "§HBorn:§! §Y17/1/1891 in Lipa, Batangas, Philippines§!\n\n§YPablo Manlapit arrived at Hawai'i in 1910, where he find a job as a plantation worker. Though he quickly got promoted from the simple field worker to foreman, Manlapit was dissatisfied with the conditions in which Filipino workers were at. Low payment, high cost of living and terrible housing conditions plagued the plantation workers. Pablo Manlapit left the work of plantation foreman and started studying the law, at the same time working different jobs and even publishing Filipino newspaper. After he passed the attorney exams and obtained license to practice law, Manlapit started organizing the fight for the workers' rights. He helped with the foundation of Filipino Labor Union and led the strikes against plantation owners and big capital."
  NHW_peter_kawananakoa: "Peter Kalākaua Kawānanakoa"
  NHW_peter_kawananakoa_leader_desc: "§HBorn:§! §Y10/3/1904 in Lihu'e, Kauai, Kingdom of Taua'i§!\n\n§YThe young king of Taua'i, Peter Kalākaua Kawānanakoa, is a greatly promising leader for his homeland, a great military officer, and even married to Russian princess Maria Pavolvna, in the hopes of uniting both royal houses and furthering the nation's long history of partnership with Russia. Peter was once a rowdy and aggressive young man, plagued with mental issues, until his 18th birthday party, when a friend of his dared him to bite and swallow a plum which had been in spiritus for 2 whole years. Not one to back down from a challange, he ate not one, but five of them, which was followed by five days of constant and intense hungover, from which he emerged a changed man. He became a much more quiet, serious and intelligent man, and a great tactician as well. He is known to have once bested four of Russia's best chess players, without even haveing played chess before. When questioned how he managed to accomplish this, he only responded that he could somehow feel and hear the chess pieces."
