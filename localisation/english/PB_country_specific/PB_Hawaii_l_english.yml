  # HAWAII GENERALS
  ##########################
  HWI_john_harris_soper: "John Harris Soper"
  HWI_samuel_nowlein: "Samuel Nowlein"
  ##########################
  # IDEAS
  ##########################
  PB_HWI_Mele_Kaua: "To the Tune of Mele Kaua"
  PB_HWI_Mele_Kaua_desc: "After the success of Schäffer expedition in 1815, the Kingdom of Taua'i managed to regain its freedom from Hawai'is influence, and even managed to expand into the island of O'ahu, creating a land border between the two kingdoms. Now both of them prepare for another inevitable war to finalise what King Kamehameha I couldn't do, finally uniting the archipelago."
  PB_HWI_Fifth_Column: "A House built on Fifth Columns"
  PB_HWI_Fifth_Column_desc: "The large scale economic growth of the Kingdom of Hawai'i has become a double-edged blade. On one side, our plantations and factories are more profitable and productive than ever. But on the other side, the massive amounts of workers we have brought into the island have become one of the goverments greatest headaches, specially seeing as most of them come from Asia, China and the Filipines in particular. Rumors spread of Japanese involvement, funding and perhaps even arming this Jacobin fifth column, and few doubt that they wouldn't take their shot at a Hawai'ian revolution if given the opportunity."
  PB_HWI_Harbour_Of_Pacific: "The Harbour of the Pacific"
  PB_HWI_Harbour_Of_Pacific_desc: "The location of our home, the Hawaiian archipelago, grants it perhaps it's greatest advantage, being the center of Pacific trade  and thus making us, and specially our capital in Lahaina, the natural harbour for all passing ships. However, it may also be our biggest weakness alwell, as if our northern rivals in the kingdom of Taua'i start a war against us, our entire position as a safe harbour and throwing the production of our largest export, plumbs, into chaos. If a war not only occurs but also drags on for longer than we can sustain, §Rthe consequences may catasthrophic, be they coming from direct British intervention, or from our growing internal Jacobin issue.§!"
  PB_HWI_Masons: "The Hale Naua"
  PB_HWI_Masons_desc: ""

  PB_NHW_Polynesia: "Polynesia's Maiden Hope"
  PB_NHW_Polynesia_desc: "The people of Polynesia once ruled every island from New Zealand to Rapa Nui, until the European colonists robbed us from our birthright, pillaging our once pristine islands for all their worth. Even here in Hawaii, our southern neighbors are nothing but a glorified British puppet, but we are different. We stand as the last truly free Polynesian nation, and we must carry this burden with reverence and honor. We must invite any and all of our brothers from across the waves who wish to be free from foreign colonialism, and let them settle down on our islands, both natural and man-made, to create a true Polynesian state. Besides the extra manpower and population will be needed to unite our homeland."
  PB_NHW_Russian_Protection: "Under the Wings of a two headed Eagle"
  PB_NHW_Russian_Protection_desc: "Ever since the Russian Schäffer expedition secured our independence from the kingdom of Hawai'i, we've been grateful to the Russian Empire and helped them however we could, sometimes even against our true will. The truth is, Russian influence over the country has been steadily growing, seeing us as a valuable Pacific fortress to extend their sphere of influence outwards. While investmeents into industry, technology and the armed forces are very appreciated, their influence may also lead to us becoming a full puppet state soon if we do nothing to halt their growth, but some say it's too late to stop the double-headed eagle from nesting atop our mountains."
  PB_NHW_PMC: "The Kanaloa"
  PB_NHW_PMC_desc: "Originally a Russian idea, the Kanaloa program is an ambitious plan to both expand and create new islands under our domain, open for settlement and future growth. By dumping massive amounts of sand, gravel and rocks into the coasts of the nation we can massively expand our total landmass, both for industrial development funded by our Russian allies, and for the settlement of our Polynesian bretheren."