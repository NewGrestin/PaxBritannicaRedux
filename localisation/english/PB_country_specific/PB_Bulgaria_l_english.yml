  ######################
  ####  CHARACTERS  ####
  ######################
  
  ### LEADERS ###
  BUL_nikolay_ii:0 "Nikolas II"
  BUL_nikolay_ii_desc:0 "§HBorn:§! §Y30/12/1876 in Greater Sankt Petersburg, Russian Empire§!\n\nHaving served in the Foreign Ministry of the Russian Empire, Nikolas II was well-versed in diplomacy long before ascending the throne. Upon the death of Niko I of Bulgaria, he was enthroned as Tsar of the Bulgars, inheriting the prestige his father had built in Mingrelia through wars against the Ottomans and struggles with the Cantacuzino family over Wallachia and the lingering claim to the Byzantine legacy.\n\nHe was often described as a relaxed—even complacent—Tsar. After marrying Ioana Cantacuzino, Nikolas II continued his reforms while maintaining Bulgaria’s massive army reserves, upholding his self-styled title as the 'Balkan Police' against Greece, Montenegro-Serbia, and Hungary. Yet the collapse of the Hungarian order and the rise of Jacobin influence across the region exposed Bulgaria’s internal weaknesses. Years of poor economic management and the failure to pursue mass industrialization had left the middle class small and fragile, creating fertile ground for radical ideas.\n\nNow, Nikolas II faces a choice. He could crush the Jacobins and lead an anti-Jacobin coalition against Hungary — or seize the moment and attempt the unthinkable…"
  BUL_no_leader:0 "No Leader"
  
  ### GENERALS ###
  BUL_nikola_zhekov:0 "Nikola Zhekov"
  
  ######################
  ####    IDEAS     ####
  ######################
  
  PB_BUL_Greatest_Heights:0 "At Its Greatest Heights"
  PB_BUL_Greatest_Heights_desc:0 "§O“God save the Tsar!” — Nicholas Romanov§! \n\nAt the onset of the Crimean War, Bulgaria was established under Russian protection, later granted the lands of San Stefano after the Russo-Turkish War of 1878. When Alexander I of Bulgaria resigned, their true rise began. Proud and emboldened by Russia, Bulgaria expanded its navy and built a powerful military presence. \n\nAs the Dadiani took control, revolts in Wallachia against the Russian prince forced Bulgaria to crush the dissent. Through careful negotiation, the Cantacuzinos were placed on the Wallachian throne, tied by marriage to the Dadiani. This personal union strengthened Bulgarian claims, stretching their influence all the way to the legacy of the Byzantine Empire. And would leave the Bulgars as being the “Balkan Police” in enforcing Russian rule over the Balkans."
  PB_BUL_Spolied_Child:0 "Spolied Child"
  PB_BUL_Spolied_Child_desc:0 "Since Russia’s promise of “Balkan Liberation,” Bulgaria has enjoyed the sympathy of not only Saint Petersburg, but the whole Western world itself — from Britain to the Habsburgs and the myriad of kingdoms in between. For most, such unflinching support was but well deserved; had not the Ottomans repeatedly crushed any Bulgarian dissent, committing countless atrocities along the way? Yet Bulgaria was later granted vast lands without ever having to lift a finger for them. \n\nBy succumbing to such complacency, the young kingdom overlooked an essential factor every newly born nation needs the most: innovation. Though large and proud, the Bulgarian military remains subject to outdated strategists — armed with relics from the Balkan War of 1878 both in equipment and spirit. \n\n As overreliance on agricultural production and foreign capital remains a reality for the kingdom's frail economy, the nation’s past glories could quickly become its greatest weaknesses should war erupt once more."
  PB_BUL_Third_Estate:0 "Revolt in the Third Estate"
  PB_BUL_Third_Estate_desc:0 "As the Hungarian revolution of the thirties sent shockwaves throughout the Balkans, Bulgaria began experiencing its own radical resurgence in the shape of secret meetings and informal societies banding together. Emboldened by the Magyar experiment and the post-war situation, small middle-class and white collars workers rapidly rallied to the Republican ideal — eager for land redistribution and the promise of long-awaited economic reforms the Bulgarian sovereigns had postponed in fear of aristocratic backlash. \n\nWhile Revolution may have seemed unlikely in past decades, peasants' inability to compete with foreign exports the kingdom is so reliant upon has progressively enlarged the broad coalition of classes willing to shatter the calcified monarchical order. This Bulgarian Third Estate might be tempted to take matters into its own hands should no meaningful changes be put at the agenda."
  
  PB_BUL_Russian_Order:0 "The Russian Solution to the Eastern Question"
  PB_BUL_Russian_Order_desc:0 "§O“The Danubian principalities are in fact an independent State under my protection. Serbia may receive a similar form of government, and Bulgaria likewise.” — Nicholas I of Russia§! \n\nSince the destruction of the Ottoman Empire in the 1850s, the Russian Empire stand as the dominant force over the Balkans. Driven by Pan-Slavism, Saint-Petersburg's influence now extends far beyond Mother Russia itself — stretching far into the Haemus heights, the Danube and its multitude of realms. Russia has reshaped the remaining local states into loyal allies, such as the Montenegrin-led Serbia; while Bulgaria, granted vast swathes of land in the San Stefano treaty, has been elevated as the region’s enforcer. This arrangement has finally secured Russia’s long-sought warm-water naval access in Europe — fulfilling one of its oldest and most crucial ambition in the grand struggle for European dominance. \n\nNevertheless, a dominion which stretching from Vladivostom to the Adriatic Sea brings its own, peculiar problems. \n\nThe collapse of the old order in Hungary combined with escalating rivalries in the Balkans threatens Russian's dominance on the region in a way unconceivable since the last balkanic wars. While Greece grows increasingly alarmed by Bulgaria’s rising ambitions, Serbia-Montenegro finds itself surrounded on all sides any room of expansion; the secession of Moldavia only bringing more fuel to the fire which threaten to consume the whole region.\n\nMay God Save the Tsar's Order in the Balkans — for no one else can."
