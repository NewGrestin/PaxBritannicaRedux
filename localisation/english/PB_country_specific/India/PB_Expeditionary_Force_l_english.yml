# focuses

BAN_reap_what_we_sow: "We Reap what we Sow"
BAN_reap_what_we_sow_desc: "We Reap what we Sow. The fate of our men, of our supplies and food is entirely in the hands of our performance in the defeat of the revolutionaries. To ensure efficiency and victory, we must ask for full autonomy from Churchill and London."
BAN_rally_our_men: "The Cuttack Expedition"
BAN_rally_our_men_desc: "Permission has been granted by Colonials and home politicians alike for another contingency of British men being given the duty to terminate the jacobin uprising in the mountains."
BAN_request_aid: "Churchill's aid"
BAN_request_aid_desc: "Churchill thinks he can gain much from aiding our expedition, and is interested in sending us various shipments from his administration to aid us. We just need to make sure to not become dependent on his supposed 'kindness' to fellow British military personnel."
BAN_towards_the_mountains: "Towards the mountains"
BAN_towards_the_mountains_desc: "The time is perfect to end our unifnished business. Just at the turn of the decade we were sent to kick out the revolutionaries, but they hid in the mountains. Now, with more aid and men, we should put the final nail in the coffin for these pan-indian partisans."
BAN_gujarat_plan: "The Gujarat Plan"
BAN_gujarat_plan_desc: "With the partisans having been defeated, we have found a new task: to facilitate commerce, transport of British goods and strengthening the Empire, we have been tasked which reaching the other side of the Indian Coast: the Gujarat Commission, controlled by the germans. We shall deal with those between us, tough."
BAN_exit_sandman: "Exit Sandman"
BAN_exit_sandman_desc: "The first 'Warlord' to dethrone is the mysterious Mister Sandman in the Central Provinces. Originally a tributary of London, it seems our weak grasp in the continent in these times gave him the chance to become fully independent. But let's be frank; this man is just thirsty for money, and is far from being a pan-indian or able to form a rival government against us. A proposal sent with some carts of gold could be enough to make him stand down. If not, the carts will come back with the bodies of him and his men."
BAN_salvadore: "Ending the Bhopal Claims"
BAN_salvadore_desc: "In the Bhopal region the leading dynasty, currently under Salvadore III, is strongly related to the Bourbons and is obviously tied with Maurras and his thugs in France. Them being in the way is the perfect excuse to end Bourbon presence in India."
BAN_document: "To Document and to Erase"
BAN_document_desc: "The Indian continent is by no means as known as Europe or North America. Few things are known from key nations, cities and few personal experiences of European explorers. Our trans-indian march can finally bring the chance for Europe to know India. And we'll be able to sell the image we want of the document, by erasing proof of Indian modernity and selling them off as savages.If we gain by popularizing the story of the 'White man's burden' then why shouldn't we facilitate its justification?"
BAN_colonize: "To civilize and Pacify"
BAN_colonize_desc: "Few places in India, especially outside of the coast, have European settlers, or people who tolerate us as rightful leaders. We can incentivize European folks to come in India to start a new life, and also make the Indians understand that we are the rightful leaders of the continent."
BAN_gujarat_linked: "Frankfurt so near, yet so far"
BAN_gujarat_linked_desc: "We did it. Just outside of our farthest military camps we can see Frankfurt. We can see the German eagle. We can see, Frankfurt. Or maybe, just an asset of Frankfurt. Indeed. We are seeing Gujarat; a colony of Germany. No matter the flag, who leads the place, we are far from Frankfurt, and thus far from our homes. Given the distance, its too late to go back, and we have the chance to do more than this simple link. We can finally colonize India."

#events

ban.1.t: "The arrival of the Cuttack Expedition"
ban.1.d: "This morning various British military personnel landed in Cuttack, and have instantly been organized into the Cuttack Brigade under Sir Arthur Rowlatt; an ambitious and deeply indiophobhic General. The Death Brigade, another branch of Dryer's units, has already shifted in loyalty to Rowlatt. With Rowlatt being pro-Churchill, it seems he will soon pose an inside threat to Dryer."
ban.1.a: "Stupid bootlickers."

ban.2.t: "The Bihar Uprising"
ban.2.d: "With the region of Bihar being previously held by the Swarajya, it was obvious they still had partisans and members of the organization in the area. With our not-so kind handling of public discontent, it seems the local Indian workers have managed to organize into an effective combat unit and rise up. Some theorize the Righteous Union in the north has also been involved."
ban.2.a: "Bihar shall burn."
ban.3.t: "The British Expedition asks our submission!"
ban.4.t: "Sandman bows down"
ban.4.d: "It seems Mister Sandman has understood that we are stronger than him and took happily our 'presents'. It has been confirmed that we'll be able to administer his territory and move troops freely- for he is happy as long as he has his mansion and the loads of money we gave him. Cheers to Enter, i mean, Mister Sandman"
ban.4.a: "Cheers!"
ban.5.t: "Sandman stands his ground!"
ban.5.d: "Reports came that our envoy has been brutally massacred, and the gold stolen. Sandman hasn't answered to our requests, but, by these violent murders, has sent a clear message: he wants war. And we are ready."
ban.5.a: "We'll bury him with his gas mask."