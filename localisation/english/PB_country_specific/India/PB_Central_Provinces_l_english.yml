  JBP_sand_castle:0 "The Sand Castle"
  JBP_sand_castle_desc:0 "Once a mere alliance of mercenaries, colonists and deported criminals loosely tied together by an uncontrollable desire for riches, the United Provinces have since become a truly organized structure akin to Britannia's most sophisticated dominions. Yet, old habits still survive behind the curtain of respectability this “civilizing mission” has earned over time. As bands of die-hard mercenaries plummet the land, sycophants of all sorts gather to feast on the pillage. \n\nAtop this pyramid of mediocrity and violence stands a man of mythical stature. Having earned his nickname through his ample usage of drugs and chemicals as a mean to manage the colonized populace, the mysterious Mister Sandman rules the provinces like his own feudal fiefdom. Revered like a god by the locals, the enigmatic figure nevertheless remains unknown to most of the outside world — hidden behind layers of false bureaucracies and powerless representatives acting in his name. \n\nEconomically tied to this colonial mafia, Westminster has turned a blind eye on this unorthodox management as such; and the EEIC, obsessed with profits, would rather encourage it as long as resources continue to flow. And so, the sand castle remains unshattered, its knights of despair free to run wild under the gaze of their masked king."
  JBP_brain_drain:0 "Brain Drain"
  JBP_brain_drain_desc:0 "As demand for wetware components surges through the empire, the United Provinces stands as one of the world's sole suppliers of said materials — providing for the EEIC's gargantuan needs at a cost no Russian laboratories nor American facilities could ever beat. Officially gathered through “genetic harvesting” and other techniques unknown to most, the organic products are, in truth, stolen from the locals themselves. Roaming the land, dedicated units extract everything they can from the living and dead alike — leaving trails of desecrated cemeteries and headless corpses behind them. \n\nAlthough these methods leave traces no cleansing could ever erase, the veil surrounding the United Provinces has allowed this brutish but lucrative harvest to continue unopposed. Camouflaged even to the British government, the brain snatching shall continue as long as the automation boom lasts."