    sikh.1.t: "Annals of Court Intrigue"
    sikh.1.d: "The Sikh Empire has long been relegated to its holdings in the Highlands, ever since it was expelled from Punjab when Durrani and, later, Mughal armies marched upon the region as the Maratha Confederacy crumbled in a matter of days.\n\nWhat remains of our lands may no longer even deem itself one with the Sikh Heartland; we occupy little more than a sliver of territory between the valleys of Kashmir and the lands below, with the Dogra Monarchy holding Jammu to the south of Srinagar, and Kashmir and Baltistan to our north. These territories, once our tributaries, now belong to the Dogras, though they still recognize our nominal authority.\n\nOur precarious position has placed the Dogras at a considerable advantage. Had it not been for our mutual distrust of the Durranis, we surely would have found ourselves in an even greater reversal of fortune. Yet the Dogras and their Brahmin allies have continued to subvert our authority for their own benefit, with the policy of begar further expanded and used against the Muslims of the region, agitating the two Islamic powers to our south.\n\nThe Army, too, has begun seeking its own way out of this predicament. Having consolidated its power within the capital, it seems that the last hopes of the Sikh Empire may suffocate within itself before it can take a single step forward."
    sikh.1.a: "It will all come to pass..."

