# Events (ULTRA NEW!!!!!!!) #

PBNews.345.t: "THE 1933 MAHA KUMBHA MELA"
PBNews.345.d: "Millions of Hindu pilgrims, mystics, and tourists from across India and the world have descended on the confluence of the Ganga, Yamuna, and Saraswati Rivers to partake in the ritual dip and enjoy the festivities.\n\nThis year, thousands of foreign visitors have arrived to experience the exotic display of culture. While concerns remain over its delay in 1932, as well as the extensive pollution flowing through the Ganges, the festival continues unimpeded. With caste tensions running high, a 10,000-man garisson has been deployed to prevent any incident"
PBNews.345.a: "Sundar!"
