# Events (ULTRA NEW!!!!!!!) #

PBNews.345.t: "THE 1933 MAHA KUMBHA MELA"
PBNews.345.d: "Millions of Hindu pilgrims, mystics, and tourists from across India and the world have descended on the confluence of the Ganga, Yamuna, and Saraswati Rivers to partake in the ritual dip and enjoy the festivities.\n\nThis year, thousands of foreign visitors have arrived to experience the exotic display of culture. While concerns remain over its delay in 1932, as well as the extensive pollution flowing through the Ganges, the festival continues unimpeded. With caste tensions running high, a 10,000-man garisson has been deployed to prevent any incident"
PBNews.345.a: "Sundar!"

maratha.1.t: "The Maha Kumbha Mela"
maratha.1.d: "This year’s Maha Kumbha Mela has begun in Prayag. Millions of devotees from across India have arrived to bathe in the Ganges. The scale of the gathering has led to concerns over sanitation, order, and the ability of local authorities to maintain control. \n\nMaratha officials are present to oversee security and logistics, while religious leaders have called for calm and cooperation among pilgrims. Despite the challenges, the event continues without major incident so far."
maratha.1.a: "for now.. atleast."

maratha.2.t: "MASSACRE! MASSACRE! MASSACRE!"
maratha.2.d: "It was the tenth day of the celebrations. From the watchtower, I noticed a small boat crossing the river — a few men at first, nothing unusual for the Mela. Then another boat. And another. Within minutes, there were dozens. I called to my fellow guardsmen to report it, but before anyone could respond, the first gunshots echoed over the water.  \n\nI grabbed my rifle and ran to the barricade, but my superior pulled me down just as a bullet tore through my cap. I shouted at him, begged him to let me return fire, but he held my collar and yelled for me to stay down. His voice shook: “I can’t let you get yourself killed. My wife and son are out there, but if we lift our heads, we’re dead too.”  \n\nI called him a coward. I pushed him aside and raised my rifle over the sandbags — and there i saw, oh what i wish i could'nt have seen."
maratha.2.a: "Oh my."

maratha.3.t: ""
maratha.3.d: ""
maratha.3.a: ""

maratha.4.t: "Blood in the Water"
maratha.4.d: "The holy Ganga herself runs red today. From across the river, we have witnessed the slaughter of the faithful — pilgrims gunned down as they gathered to honor the divine.  \n\nInitial reports from our watchers claim the culprits were not soldiers, but the untouchable mobs from within the Maratha lands. These heretics, emboldened by false promises of equality, have turned their wrath upon the devout.  \n\nThe Righteous Union of Bharat cannot tolerate such desecration. Their crimes are not only against man, but against Dharma itself. Let the call go out — the sinners shall answer for this with blood and fire."
maratha.4.a: "The Ganga will have justice."

maratha.5.t: "Never a worse day"
maratha.5.d: ""
maratha.5.a: ""

maratha.6.t: "The Maha Kumbha Massacre"
maratha.6.d: "The Royal Court of Gorkha has received reports of violence during the Kumbh Mela along the Ganges. The accounts detail widespread panic and bloodshed among pilgrims. While verification is ongoing, the news seems to be a prelude to something worse.  \n\nHis Majesty’s advisors are reviewing the situation carefully, and border units have been placed on alert to ensure the safety of Gorkha territories."
maratha.6.a: "Unbelievable."

