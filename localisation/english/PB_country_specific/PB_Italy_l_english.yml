  # IDEAS
  ##########################
  
  ##D'ANNUNZIO ITALY'S NATIONAL SPIRITS
  PB_IST_Last_Leg:0 "Last Leg"
  PB_IST_Last_Leg_desc:0 "The Italian civil war has been a long conflict. Many men have died. Many guns have failed their users. Many boys have been sacrificed for the greatness of Italy. All is in vain. \n\nMuch of the North, which joined us on the first days of the war, has been lost. The Monarchists have retaken Lombardy and most of Venice. Losing the North could be our end. We might be on our last leg."
  
  ##KINGDOM OF ITALY NATIONAL SPIRITS
  PB_ITA_North_South_Divide:0 "Peninsular Disharmony"
  PB_ITA_North_South_Divide_desc:0 "The Kingdom is divided between a heavily industrialized North and the more agrarian South, a situation that has manifested a significant politico-cultural divide in the nation. The North is a maximalist industrial zone, covered in large part by the Milanese Sprawl that extends across most of the region. Life in the North is harsh, dirty and often short. The South is, by contrast, a virtually undeveloped region. Agriculture and viticulture are dominant industries, poverty remains common alongside organized crime. \n\nBoth regions have begun to develop their own ideologies and identities, running counter to Italy’s outward appearance as a unified state. If this situation is allowed to escalate, it may result in the country becoming permanently divided."
  PB_ITA_Last_Standing:0 "Last Man Standing"
  PB_ITA_Last_Standing_desc:0 "The Kingdom is the last remnant of the Latin Entente, the military-political alliance of France, Spain and Italy during the Great War. Spared invasion during the conflict, Italy brokered a separate peace that saved the country from outright occupation. Though not officially a defeat, the loss in the war was nonetheless internationally humiliating for the Italian state. In saving itself, Italy ruined their reputation with the French and Spanish successor states. Post-war, Italy has struggled to establish itself in the new Anglo-Russian-German hierarchy of Europe. \n\nIf Italy is to survive the inevitable future conflict, it must re-establish itself within the international community and either rejoin the Latin powers or align against them."
  PB_ITA_Alexandrian_Papacy:0 "The Alexandrian Papacy"
  PB_ITA_Alexandrian_Papacy_desc:0 "The Papacy under Alexander IV is a rot on the heart of Italy and Christendom, though most do not realize the extent of it. Everything short of selling indulgences has become normalized and the Church is a glorified bank for the Pope’s lackeys. In spite of this, the Pope is surprisingly popular with the Italian working class. Churches offer soup kitchens for the poor, financial support for needy communities, and enjoy a revered status amongst those unaware of their seedier inner workings."
  PB_ITA_Carnival_Society:0 "The Dancing Shadows of Venice"
  PB_ITA_Carnival_Society_desc:0 "The whispering voices of the Serenissima tells the tale of a lingering curse plaguing the city's very soul. A colourful malediction born out of a celebration whose roots intertwine with those of Venice itself. Quietly gestating behind the myriad of masks and fancy attires of the century-old Carnival, this evil finally grew up in sufficient strength as the Great War shattered what little remained of common decency. Unleashed upon the queen of the Adriatic's corpse like a faceless animal, the so-called §OCarnival Society§! swiftly asserted its rule upon the Venetian province — using the disbelief and confusion of post-war politics to secure both municipal and regional power for itself. \n\nA decade later, Venice stands as a testament to the Society's commitment to reshape everything in the most radical ways conceivable. Tightly monitored by the initiated members of the cult, the populace now obeys a strict hierarchy founded on musical and mystical principles — one's assignment in this “social orchestra” being displayed by the mask it has to wear in public. Corporate and capitalist rule can be felt more than anywhere else in Italy, with the city itself transformed by the sputum of factory chimneys and new portuary infrastructures growing on the estuary like a cancer of steel and concrete. \n\nThe ultimate purpose of such extreme social and urban metamorphosis remains unclear however. Is the Society simply a bunch of eccentric madmen united solely by their common disdain for past morality and Austrian hegemony, or is there a deeper, more obscure aim hidden beneath the disguise? What are those rumours of secret cells and hidden facilities, those flickering shadows which spies on the kingdom's greatest minds and finest rulers? Only time will tell if it was all just a play of light and shade, or the outline of a dagger wielded against the country."
  PB_ITA_Federal_Military:0 "A Federated Military"
  PB_ITA_Federal_Military_desc:0 "Under the kingdom’s extreme decentralization, Italy’s military has become somewhat underdeveloped to say the least. Generals from North and South are unable to agree on doctrine, debating endlessly about the value of mechanized forces or bio-warfare. Compounding this situation, Italy’s period of relative peace following the Great War has allowed high command to stagnate. \n\nWhile many generals from the war are long since retired or dead, their spirit remains in an unmotivated and uninventive command."
  
  ##FORMER NATIONAL SPIRITS
  PB_ITA_treaty_of_anzio:0 "Treaty of Anzio"
  PB_ITA_treaty_of_anzio_desc:0 "While Italy did support the Entente at the end of the war, it was always clear that this loyalty was forced upon Italy through Entente pressure. Thus, Italy had to pay for their crimes against the winning powers of Europe and for joining the Bourbon-alliance against the Entente powers. However, due to Italy’s support in the later years of the war, the great powers actively decided to not unreasonably punish Italy, like they did with France. Instead, Italy was forced to demobilize its army and put future restrictions upon its army, such as restricting the use of chemical warfare and experimental tank warfare. The Italian navy and airforce also were decreased due to the treaty and Italy had to pay a small amount to the winning powers. \n\nWhile the treaty has only been a political issue with the ANI gaining its main succes from opposing the entire concept of the Anzio treaty, the civil war has turned it into a bigger issue, with Italy starting the conflict without a proper army. Eventual agreements have given way to loosening the rules of Anzio, allowing Italy to combat the current neo-imperialist splinter with an armed force."

  PB_ITA_Considerable_Political_Violence:0 "Unstable Young Democracy"
  PB_ITA_Considerable_Political_Violence_desc:0 "Despite adopting some liberal and progressive ideas of democracy and liberalism prior to the Great War, Italy's experience with democracy has been limited at best, hindered by the previous absolutist tendencies of the monarchy and the surpression of liberalism under the previous regime. However, the Great War left the Italian people without any faith in the traditional system and the old monarch resigned, leaving Gerdinand III to handle the aftermath. Combined with the general distrust of the Bourbons post-war in the UK and Germany and it became a recipe for governmental and societal change. Italy, if it liked it or not, would be dragged towards democracy by the allied powers, despite its kicking and screaming. \n\nWith the establishment of Italian democracy in 1912 and the PLI coming to power, Italian society would experience extensive changes. The wind of liberalism swept across the country: young women ditched conservative clothing for more fashionable and slightly revealing options, young men went against the grain and listened to British and German jazz and a fair few cities even became hotbeds of these new age ideas. Experimentalism regarding politics, identity and sexuality are palpable in Rome, Pisa and other big cities, showing the societal changes that have occured with our new democracy, something some celebrate and others detest. \n\nHowever, young democracy is never stable. The late 20s and the economic stagnation of the era turned the people sour. As unemployment grew, so did extremism. The growing blueshirt movement on one end of the spectrum and the jacobin movement on the other, Italy would turn into a battlefield between these two extremes. Paramilitary groups of many jacobin, socialist, nationalist and imperialist groups dominated the streets for years. Violence would soon turn to treason and the ANI, with the support of the French, staged a violent coup d'état in 1929, kickstarting the Italian Civil War. \n\nViolence has characterized our younger years, but perhaps it's time to grow up and confront these demons."

  PB_ITA_Slow_Recovery:0 "The War Crawl"
  PB_ITA_Slow_Recovery_desc:0 "Italy has only recently unified under the rule of the Bourbons and, is thus, quite agrarian compared to other European powers. Where the British, French and Germans heavily invested to industrialize as fast as possible, Italy had to deal with others problems surrounding the economy, such as the fuedal-style relations between farmers and landlords and other inefficencies in the agricultural system. Industrialization only started slowly in the early 20th century, only to be hindered by the eventual Great War and the vast economic consequences this war would have. \n\nDespite its agricultural nature, Italy was able to musture a force equal to the other European powers and fight on almost equal footings to them. However, compared to France, Britain and Germany, Italy would continue to feel the economic and financial consequences of the war deep into the 30s, with a vast government debt, many young men killed in the war and infrastructure in a relatively bad state. Vast reforms would follow the rule of the PLI with the liberalization of the market, leading to an increasingly bad position for the agricultural sector. In 1933, the economy is still crawling towards recovery with many farmers either leaving their farms for the city or leaving Italy altogether for the New World, hoping to find a new way of life there. Untill active measures are taken, Italy will continue to suffer under the heavy problems left by the war." 

