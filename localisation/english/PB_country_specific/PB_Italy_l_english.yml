# Civitas Leonina

PB_Soldier_Pope:0 "Soldier Pope"
TISSERANT_DESC:0 "§YBorn:§! 24/3/1884 \n\nBorn Eugène-Gabriel-Gervais-Laurent Tisserant, the new pope Pius XI is one of the first non-Italian popes in recent memory, born in the city of Nancy and studying theology in that very same city. An eager student of almost anything, Tisserant is fluent in Amharic, Arabic, Akkadian, English, French, German, Greek, Hebrew, Italian, Latin, Persian, Russian and Syriac. It is perhaps through his linguistic skills that he was given the roll of intelligence officer in the French army during the first Great War. \n\nWhile a French patriot through and through, Tisserant now stays in the Civitas Leonina as the world outside has changed significantly. France's devolution into ultranationalistic totalitarianism was especially heart-breaking to the new pope, who has since then given refuge to multiple French anti-government intellectuals in Rome. As the pick of the more liberal faction of cardinals in the Civitas Leonina, Pius XI is expected to be a serious departure from the more stable rule of Benedict XVI's compromise. A pope so staunchly anti-totalitarian and with experience in war, Pius XI promises to be a fresh change in the Holy See."
CLEMENT_DESC:0 "§YBorn:§! 31/5/1885 \n\nBorn in the Austrian city of Graz, Alois Karl Hudal's German nationality would help him gain a position in the Anima during Benedict XVI, as the pope sought to preserve German dominance of the institution instead of letting it fall in Dutch or Belgian hands. From his position in the Anima, Hudal would go on to become one of the largest proponents of the French system of national chauvinism inside the Catholic Church, with his magnum opus \"The Foundations of Moral Nationalism\" approving of Doriot, D'Annunzio and other nationalists and their commitment to the Church. He's also a big proponent of anti-semetic conspiracies, applauding Doriot's policies regarding the Jewish and Protestant populations of France. \n\nHis vocal support for these kinds of regimes has split the cardinals. While a large selection of anti-revolutionary cardinals picked the new Clement XV, the more liberal faction of cardinals heavily oppose his appointement. They have failed to stop Hudal's selection as the next pope. \n\nThe Catholic Church is about to find itself in rocky waters in the coming decade and it is unclear if Hudal will keep the ship afloat or if he will personally help it to the bottom of the sea."

flavournews.1.t:0 "NEW POPE: PIUS XI"
flavournews.1.d:0 "With the recent death of Pope Benedict XVI emptying his holy seat in the Civitas Leonina, the papal conclave of [GetYear] has come together and agreed upon a new pope. Despite the differences among the cardinals on the details of doctrine and what kind of personality the next pope should be, a decision was made to appoint Eugène Tisserant, a relatively new cardinal. \n\nPicking the papal name of Pius, Pius XI will be the first French pope since Gregory XI in 1370. Pius XI is also an extraordinary pope in his politics, as, while a French patriot, Pius has consistently opposed the Doriot regime and has helped anti-government intellectuals before becoming pope."
flavournews.1.a:0 "A new face in Rome..."
flavournews.2.t:0 "NEW POPE: CLEMENT XV"
flavournews.2.d:0 "With the recent death of Pope Benedict XVI emptying his holy seat in the Civitas Leonina, the papal conclave of [GetYear] has come together and agreed upon a new pope. Recent times have seriously split the Church, however, as the eventual pick of German bishop Alois Hudal was marked with controversy. \n\nThe new Pope Clement XV is mainly controversial for his views on Doriot and D'Annunzio, being a staunch proponent of their new way of government. Clement XV has written essays on the matter, often describing the men as defenders of Christianity against foreign forces. His anti-semetism has also marked the new pope as a problematic candidate."
flavournews.2.a:0 "A new face in Rome..."
