  ### IDEAS ###

  PB_VEN_Lodge_Rational: "The Lodge of Rational Knights"
    PB_VEN_Lodge_Rational_desc: "Ever since our youthful beginnings in the 19th century among our glorious revolution against the Spanish Tyrants, with us stood an ancient group of revolutionaries. \n\nGreat in its goal of spreading the Enlightenment to our former masters holdings in South America, §Ythe Lautaro Lodge§! would eventually deliver the gifts of liberation to us. \nHeroes of our nation, patriots, thick and thin who would be members of this fraternity centuries ago; Francisco de Miranda's Libertadores one and all would eventually come to free our nation from the Spanish yoke. \n\nWith the liberation of our territory, the heroes who emancipated it would not forget the fraternity who gave us that freedom."

