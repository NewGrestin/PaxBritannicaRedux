  ###ADVISORS & SCIENTISTS TRAITS


  ###MILITARY TRAITS





  egotist: "Egotistical"
  egotist_desc: "This general holds a disproportionately high opinion of themselves, and will make sure anyone around them knows it, whether they want to or not."
  questionable_methods: "Questionable Methods"
  questionable_methods_desc: "This general is willing to use methods, tactics and equipment that would be considered ethically dubious at best and morally bankrupt at worst."

  suspected_moscow_circle: "Suspected Moscow Circle Acolyte"
  suspected_moscow_circle_desc: "The Moscow Circle is the name given to an almost invisible secondary organ of the Russian Armed forces. The exact circumstances under which it was founded are unknown, it is unknown who leads the group, and it is unknown how many members it contains. All that is known to the Russian Intelligence Services is that the Circle are a faction of arch-reactionaries and ultranationalists, dedicated to worming their way into the nascent democratic government to undermine and ultimately dismantle it.\n\nThe Circle is extremely elusive, and the intelligence services only have a vague idea of who may or may not be part of the organization. The insular nature of the group and the self-protecting nature of the Russian military have made attempts at infiltration exceptionally difficult. All that can be said for certain is the Moscow Circle exists, and it has likely infected many higher levels of the Russian military."
  cossack_heritage: "Cossack Heritage"
  cossack_heritage_desc: "This general descends from a lineage of Cossacks, a self-governing class of semi-nomadic peoples often functioning in a military capacity for the Russian Empire or Eastern European nations."
  ukrainian: "Ukrainian"
  ukrainian_desc: "This General is of Ukrainian descent"
  polish: "Polish"
  polish_desC: "This General is of Polish descent"
  georgian: "Georgian"
  georgian_desc: "This General is of Polish descent"
  azeri: "Azeri"
  azeri_desc: "This General is of Azeri descent"
  armenian: "Armenian"
  armenian_desc: "This General is of Armenian descent"
  finnish: "Finnish"
  finnish_desc: "This General is of Finnish descent"
  baltic_german: "Baltic German"
  baltic_german_desc: "This General is of Baltic German descent"

  Recursive_Immortality: "Recursive Immortality"
  Recursive_Immortality_desc: "This general has undergone the Recursive Decantering Process, implanting their nervous system in a new replicated body. Due to this, they are far less likely to suffer illnesses or be meaningfully wounded in combat."
  Clinical_Immortality: "Clinical Immortality"
  Clinical_Immortality_desc: "This general has undergone internal organs transplantation significantly rejuvenating and strengthening his organism. Due to this, they are far less likely to suffer illnesses or be meaningfully wounded in combat."
  trait_SPR_Order_Santiago: "Knight of the Order of Santiago"
  trait_SPR_Order_Santiago_desc: "The Order of Santiago, founded in the 12th century, is one of Spain's most prestigious military orders. Initially formed to protect Christian pilgrims traveling to the shrine of St. James in Santiago de Compostela, it gained immense influence through its participation in the Reconquista and later colonial expeditions. Members were highly regarded as defenders of faith and royal authority. Honor and valor define this order."
  trait_SPR_Order_Calatrava: "Knight of the Order of Calatrava"
  trait_SPR_Order_Calatrava_desc: "The Order of Calatrava, established in the 12th century, was a leading military order of the Spanish Middle Ages. It was created to defend the Calatrava castle from Muslim forces and played a key role in the Reconquista. Its knights were noted for their military discipline and religious devotion. Chivalric discipline and sacrifice are central to this order."
  trait_SPR_Order_Alcantara: "Knight of the Order of Alcántara"
  trait_SPR_Order_Alcantara_desc: "Founded in 1156, the Order of Alcántara was a critical force in the Reconquista and the protection of Spanish territories. The knights were known for their courage in battle and their commitment to protecting the lands along the Tagus River. Bravery and honor were the hallmarks of this order, which was instrumental in securing Spain's borders."
  trait_SPR_Order_Montesa: "Knight of the Order of Montesa"
  trait_SPR_Order_Montesa_desc: "The Order of Montesa, established in 1317, rose from the disbanding of the Knights Templar. Based in the Kingdom of Aragon, the order defended Spain's eastern borders and fought in the Crusades. The knights of Montesa were known for their resilience, strategic brilliance, and deep devotion to their cause, making them a symbol of unwavering faith."
  logistical_planification_matrix: "Logistical Planification Matrix"
  logistical_planification_matrix_desc: "This general's cognitive abilities largely surpass those of a normal human being, allowing for extensive planning and precisely calculated logistics. Such abilities comes at the detriment of an overreliance on wetware components and large inflow of energy however."