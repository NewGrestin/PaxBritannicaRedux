l_english:
 LOADING_TIP_0: "No committee ever has, or ever will, run a revolution.\n- §YAnnie Kenney§!"
 LOADING_TIP_1: "We should have known better after the first war.\n- §YGerd von Rundstedt§!"
 LOADING_TIP_2: "Maybe this world is another planet’s hell.\n- §YAldous Huxley§!"
 LOADING_TIP_3: "A nation regenerates itself only upon heaps of corpses.\n- §YLouis Antoine de Saint-Just§!"
 LOADING_TIP_4: "Why worry about Wallonia?\n- §YGerman Anti-War Slogan§!"
 LOADING_TIP_5: "It was written I should be loyal to the nightmare of my choice.\n- §YJoseph Conrad§!"
 LOADING_TIP_6: "France has no friends, only interests.\n- §YCharles de Gaulle§!"
 LOADING_TIP_7: "I call on God Almighty to have mercy on the German people.\n- §YWilhelm Keitel§!"
 LOADING_TIP_8: "The Japanese are infidels. The might of Holy Russia will crush them.\n- §YNicholas Romanov§!"
 LOADING_TIP_9: "If we do not wish Russia to collapse, we must continue the struggle and we must advance. Otherwise we shall witness a grotesque sight.\n- §YAnton Denikin§!"
 LOADING_TIP_10: "This is the hour of the charlatans, of the confidence tricksters, of the grand promises that will never be fulfilled.\n- §YAntonio Gramsci§!"
 LOADING_TIP_11: "§rCognitive dissonance is an uncomfortable feeling caused by holding two conflicting ideas simultaneously.§!"
 LOADING_TIP_12: "Golf always makes me so damned angry.\n- §YGeorge V§!"
 LOADING_TIP_13: "Too bad about the young blood.\n- §YErich Luddendorf§!"
 LOADING_TIP_14: "If you don't have ammunition, you have bayonets! Fix bayonets!\n- §YMustafa Kemal Atatürk§!"
 LOADING_TIP_15: "A republican form of government is not suited to the Italian people.\n- §YVittorio Emanuele di Savoia§!"
 LOADING_TIP_16: "Why can't I play with my friends today mom?\n- §YMichael I§!"
 LOADING_TIP_17: "The only thing more heroic than death in battle is death furthering the goal of Romania.\n- §YCorneliu Codreanu§!"
 LOADING_TIP_18: "You might forget the gas and shell, but you'll nev'r forget the Mademoiselles.\n- §YMademoiselle From Armentières§!"
 LOADING_TIP_19: "Just blow your nose, and dry your tears, We'll all be back in a few short years.\n- §YMademoiselle From Armentières§!"
 LOADING_TIP_20: "The government in a revolution is the despotism of liberty against tyranny.\n- §YMaximilien Robespierre§!"
 LOADING_TIP_21: "Citizens, did you want a revolution without a revolution?\n- §YMaximilien Robespierre§!"
 LOADING_TIP_22: "Occasionally words must serve to veil the facts.\n- §YNiccolò Machiavelli§!"
 LOADING_TIP_23: "It is not titles that make men illustrious, but men who make titles illustrious.\n- §YNiccolò Machiavelli§!"
 LOADING_TIP_24: "The more ruthlessly war is conducted, the more merciful is it in fact, for it finishes the war the sooner.\n- §YFranz Von Papen§!"
 LOADING_TIP_25: "This is not a peace. It is an armistice for 20 years.\n- §YFerdinand Foch§!"
 LOADING_TIP_26: "The philosophers have only interpreted the world, in various ways. The point, however, is to change it.\n- §YKarl Marx§!"
 LOADING_TIP_27: "Hegel remarks somewhere that all great world-historic facts and personages appear, so to speak, twice. He forgot to add that the first time as tragedy, the second time as farce.\n- §YKarl Marx§!"
 LOADING_TIP_28: "Let us therefore trust the eternal Spirit which destroys and annihilates only because it is the unfathomable and eternal source of all life.\n- §YMikhail Bakunin§!"
 LOADING_TIP_29: "When the people are being beaten with a stick, they are not much happier if it is called the People's Stick.\n- §YMikhail Bakunin§!"
 LOADING_TIP_30: "Either we all live in a decent world, or nobody does.\n- §YEric Arthur Blair§!"
 LOADING_TIP_31: "To remain a great nation or to become one, you must colonise.\n- §YLéon Gambetta§!"
 LOADING_TIP_32: "Take up the White Man's burden— Send forth the best ye breed— Go bind your sons to exile— To serve your captives' need.\n- §YThe White Man's Burden§!"
 LOADING_TIP_33: "Among the causes of the tremendous confusion characterizing present-day Europe is the transplantation of British institutions to the Continent.\n- §YKlemens von Metternich§!"
 LOADING_TIP_34: "Let the people everywhere take heart of hope, for the cross is bending, the midnight is passing, and joy cometh with the morning.\n- §YEugene V. Debs§!"
 LOADING_TIP_35: "One murder makes a villain. Millions a hero.\n- §YBeilby Porteus§!"
 LOADING_TIP_36: "It is infinitely better to vote for freedom and fail than to vote for slavery and succeed.\n- §YEugene V. Debs§!"
 LOADING_TIP_37: "You, the Poles, have a funny nature. When the people going along the road are attacked by a dog with its insistent and noisy barking, you immediately feel like jumping off the vehicle, standing on all fours and starting to bark back at it.\n- §YJózef Piłsudski§!"
 LOADING_TIP_38: "France cannot be France without greatness.\n- §YCharles de Gaulle§!"
 LOADING_TIP_39: "We crave for new sensations but soon become indifferent to them. The wonders of yesterday are today common occurrences.\n- §YNikola Tesla§!"
 LOADING_TIP_40: "There are two kinds of scientific progress, the methodical experimentation and categorization which gradually extend the boundaries of knowledge, and the revolutionary leap of genius which redefines and transcends those boundaries.\n- §YNikola Tesla§!"
 LOADING_TIP_41: "What, pray tell, will we do when these little homunculi awaken one day announce that they have no further need for us?\n- Except, §YArguments against Automation§! 1921"
 LOADING_TIP_42: "And what of the immortal soul in such transactions? Can this machine transmit and reattach it as well?\n- Excerpt, §YPope Gregory XVII§!, 1922 Papal Dispensation"
 LOADING_TIP_43: "We shall take only the greatest minds, the finest soldiers, the most faithful servants. We shall multiply them a thousandfold and release them to usher in a new era of glory.\n- Excerpt, §YThe Doctrine of Sociogenetics§!, 1862"
 LOADING_TIP_44: "Not only does God play dice, the dice are loaded.\n- §YAlbert Einstein§!"
 LOADING_TIP_45: "Tyranny, you say? How can you tyrannize someone who cannot feel pain?\n- Excerpt, §YCombat Amalgamate Sapience Study§!, 1932"
 LOADING_TIP_46: "Energy is the currency of the future.\n- §YSir Thomas Edison§!"
 LOADING_TIP_47: "In former times the energy monopoly was called The Power Company; we intend to give this name an entirely new meaning.\n- §YSir Thomas Edison§!"
 LOADING_TIP_48: "By what right does this forgotten future seek to deny us our birthright? None I say! Let us take what is ours, chew and eat our fill.\n- §YSir Thomas Edison§!"
 LOADING_TIP_49: "The French people are a compound. It is better than a race. It is a nation.\n- §YJacques Bainville§!"
 LOADING_TIP_50: "Throughout history the world has been laid waste to ensure the triumph of conceptions that are now as dead as the men that died for them.\n- §YHenry de Montherlant§!"
 LOADING_TIP_51: "The colonizer, who in order to ease his conscience gets into the habit of seeing the other man as an animal [...] tends objectively to transform himself into an animal.\n- §YAimé Césaire§!"
 LOADING_TIP_52: "A great nation, only the people are cunts.\n- §YJózef Piłsudski§! on §YPoland§!"
 LOADING_TIP_53: "Sweat saves blood, blood saves lives, but brains saves both.\n- §YErwin Rommel§!"
 LOADING_TIP_54: "Specialists without spirit, sensualists without heart; this nullity imagines that it has attained a level of civilization never before achieved.\n- §YMax Weber§!"
 LOADING_TIP_55: "The fate of our times is characterized by rationalization and intellectualization and, above all, by the disenchantment of the world.\n- §YMax Weber§!"
 LOADING_TIP_56: "It is well enough that people of the nation do not understand our banking and monetary system, for if they did, I believe there would be a revolution before tomorrow morning.\n- §YHenry Ford§!"
 LOADING_TIP_57: "Labour must be performed as if it were an absolute end in itself, a calling.\n- §YHenry Ford§!"
 LOADING_TIP_58: "Rich people are no longer respectable people; they are nothing more than flesh eating animals, jackals and vultures which wallow in the people's blood.\n- §YFrantz Fanon§!"
 LOADING_TIP_59: "A dull, decent people, cherishing and fortifying their dullness behind a quarter of a million bayonets.\n- §YEric Arthur Blair§! on §YBritish Burma§!"
 LOADING_TIP_60: "And Englishmen like posing as gods.\n- §YEdward Morgan Forster§!"
 LOADING_TIP_61: "Time and space died yesterday. We already live in the absolute, because we have already created eternal, omnipresent speed.\n- §YFilippo Tommaso Marinetti§!"
 LOADING_TIP_62: "Let the divine reign of Electric Light finally commence, liberating Venice from its venal moonlight of furnished rooms.\n- §YFilippo Tommaso Marinetti§!"
 LOADING_TIP_63: "Modern society needs supermen.\n- §YAlexis Carrel§!"
 LOADING_TIP_64: "We have carried on the good tradition from the Zulus, I suppose.\n- §YJosiah Wedgwood§!"
 LOADING_TIP_65: "The Colonial peoples must be assured that they are progressing to the fullest political responsibility in their own local affairs.\n- §YWalter Guinness§!"
 LOADING_TIP_66: "Our responsibility to the native races remains a real one.\n- §YWinston Churchill§!"
 LOADING_TIP_67: "§rThe horror! The horror!§!"
 LOADING_TIP_68: "He wanted to become a sort of scientific substitute for God.\n- §YKarel Capek§! on §ryou, the player§!"
 LOADING_TIP_69: "And this Thing I saw! How can I describe it? A monstrous tripod, higher than many houses, striding over the young pine trees, and smashing them aside in its career.\n- §YHerbert George Wells§!"
 LOADING_TIP_70: "The end of the human race will be that it will eventually die of civilization.\n- §YHerbert George Wells§!"
 LOADING_TIP_72: "We see the strongest guarantee of peace for Europe in a policy of expansion.\n- §YGustav Stresemann§!"
 LOADING_TIP_73: "The day the peasants will be educated in the truth, tyrants and slaves will be impossible on earth.\n- §YGiuseppe Garibaldi§!"
 LOADING_TIP_74: "The danger is not in the multiplication of machines, but in the ever-increasing number of people accustomed to desiring only what machines can give.\n- §YGeorges Bernanos§!"
 LOADING_TIP_75: "It is better to have a war for justice than peace in injustice.\n- §YCharles Peguy§!"
 LOADING_TIP_76: "Tyranny is always better organized than freedom.\n- §YCharles Peguy§!"
 LOADING_TIP_77: "The movement is everything, the final goal is nothing.\n- §YEduard Bernstein§!"
 LOADING_TIP_78: "Dynastic succession creates the coherence of all the strength of an empire.\n- §YCharles Maurras§!"
 LOADING_TIP_79: "At last they've killed that scoundrel Rasputin!\n- §YPyotr Wrangel§!"
 LOADING_TIP_80: "I prefer to die honourably on the field of battle so that I may not see the shame and degradation of our Russian land.\n- §YLavr Kornilov§!"
 LOADING_TIP_81: "It is possible to peel men from the inside like the hollow of a melon.\n- §YJean Coutrot§!"
 LOADING_TIP_82: "To weld the people into one single unconquerable and all-destructive force – this is our aim, our conspiracy, and our task.\n- §YSergey Nechayev§!"
 LOADING_TIP_83: "The pens which write against disarmament are made with the same steel from which guns are made.\n- §YAristide Briand§!"
 LOADING_TIP_84: "We will fight on the Loire, we will fight on the Garronne, we will fight even in the Pyrenees. And if at last we are driven off the Pyrenees, we will continue the war at sea.\n- §YGeorges Clemenceau§!"
 LOADING_TIP_85: "We learn from history that we do not learn from history.\n- §YGeorg Hegel§!"