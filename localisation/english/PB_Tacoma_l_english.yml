    WWW_Tacoma.6.t:0 "Another Ethan Allen?"
            WWW_Tacoma.6.d:0 "On the surface if you looked at the history of the American Confederation, it would seems as though it was on it's last legs and that it was a Nation of the past. Long ago, similar to the United Colonies during the first revolution, or the many dead Empires and Republics of Olden Days. \n\n Like the Byzantines once spanning a large scale Territories, here in the Pacific Northwest, to a diminutive scale of the last American stronghold of Libertalia and Portland.\n\n If you asked many on the American Continent, they would say the American Confederation exists like it's dream and the Founding Fathers memory. Dead if not dying, leaving in its ashes and wake many fledgling nations like Tabernacle, Fredonia, and New Walden. A certified age of strife, poverty, greed, violence and destruction.\n\nTruth be told though, though there may be cracks, they aren't as deep as some may believe. In the mountains, the hills of New Walden the Spirit of ‘76 can still be heard. The struggle of Americans can be heard among the white capped mountains of the Cascades, a hymn that rings eerily similar to the one sung among the Green Mountaineers over two-hundred years ago. These Revolutionaries still hold the Ideals of the Founding Fathers supreme. If America is to be reclaimed, and the tune of freedom is to continue. It must be sung together."
            WWW_Tacoma.6.a:0 "Cheer, Cheer, the Green Mountaineer"
    WWW_Tacoma.7.t:0 "Sins of Our Fathers"
        WWW_Tacoma.7.d:0 "Since the founding of the American Confederation, and the instatement of the 2nd American Constitution, the country has faced issues from its very dawn just like the First Republic. \n\nIt would prove to loose, the nation incapable of carrying out the tasks of leaving to much power in the name of our states, the incapabilities of our government to correctly provide the necessities and proper governance that any nation on this earth requires. \n\nWe became too disorganized, too fragile to exist. It simply couldn't last. It was the action of Commander and Chief Leonard Wood with the distinct suggestions and support of other politicians to declare martial law once we saw the mistakes we had made.\n\n And so here we are, backs against the wall struggling to hold on to the very idea of Liberty and Control of our nation. Just like the first Declaration of Independence and the First Revolution, falters once more and the sun begins to set on the American Experiment once more. Time will have to tell if dusk will finally come for us once again."
        WWW_Tacoma.7.a:0 "Maybe America is a Failed Experiment..."
        WWW_Tacoma.7.b:0 "She's a Little Rough Around the Edges, but She's Still Our America!"
