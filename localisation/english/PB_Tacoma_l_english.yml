    NVI_News.1.t:0 "AMERICA JOINS THE PACT"
    NVI_News.1.d:0 "Following the end of the Continental War and the total collapse of the American Commonwealth, the Continentals in America have declared war on the Great Britain. Such an act, likely an opportunity for America to expand her influence, return payment for France for French assistance during the Continental War, and perhaps even as a desire to humiliate the British for 200 Years of Shame. \n While there has been a perceived stalemate during the Second Great War, due to French incapabilities to cross the British Channel, the stake of America joining the Fray, now leads to the Industrial Might of the Continentals now being aimed directly at Britain."
    NVI_News.1.a:0 "'Lafayette, We Are Here!'"