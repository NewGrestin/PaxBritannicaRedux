    WWW_Tacoma.11.t:0 "Maintaining Control"
        WWW_Tacoma.11.d:0 "Though our primary enemy is most definitely the Pacifica Firsters we absolutely must keep tabs on other potential insurgents and traitors in our midst. The Cabalists have claimed support of our anti insurgency inactive, but we still retain main differences. Most notably their spurning and rejection of Washington, while we may be buddy buddy now, who's to know what will happen once the Pacificans are Dealt With?\n\n From here on out we won’t exclude the Cabalists, Wide Awakes, or American Liberation Front from monitoring. \n\n From here on out, we'll consider sending Agents into their organization as well."
        WWW_Tacoma.11.a:0 "Send Robert Wood to Monitor the Cabalists..."
  WWW_Tacoma.12.t:0 "President Wood Signs Ex Order. 5827"
        WWW_Tacoma.12.d:0 "On the Eve of this morning the Commander and Chief of the American Confederation, Leonard Wood has signed an executive order to double down efforts to increase actions taken on internal insurrectionary groups.\n\n Military Support has been allotted to police forces, curfews have been emplaced, and from what it seems Habeas Corpus has been suspended.\n\nThough the actions taken seem to be drastic, Wood receives much support from the other politicians, senators, and Loyalists in the American Confederation."
        WWW_Tacoma.12.a:0 "American Will Never Die, Not on Our Watch!"       
  WWW_Tacoma.13.t:0 "News Report Raids on Public Meetings"
    WWW_Tacoma.13.d:0 "With our decision incite military police raids on public buildings, seeking to wipe out the forces of insurrection within the Greater Portland region, it turns out many journalists and photographers have taken initiative to report such raids as a violation of the American Constitution, Freedom of Speech and Assembly.\n\n While such reports are typically tolerated, but given the circumstances some politicians have suggested taking action against such reports."
    WWW_Tacoma.13.a:0 "Mayber we Should Shut them Down..."
    WWW_Tacoma.13.b:0 "Take a Good Look at America Being Saved Citizens!"
 WWW_Tacoma.14.t:0 "Cabalists Protests Our Decision"
    WWW_Tacoma.14.d:0 "Today following the Governmental decision to provide amnesty towards many known Pacifica Firsters, our uneasy allies under the Cabalists Clique have issued a protest towards such an initiative. \n\nThe choice of such an action has invited Instability and division into the Cabalists there's been talks that the Cabalists should back out of supporting the Government and others believing that Unity with them is in the best interest of the Cabalists. The decision has led to numerous issues within the Clique, notably the downfall of Clare Hoffman as leader of the Clique. While this weakens our support somewhat, it also allows the inter party balance to be less divided."
    WWW_Tacoma.14.a:0 "Good or Bad? I'll Let you Decide."
 WWW_Tacoma.15.t:0 "Meeting Between Two Chiefs"
    WWW_Tacoma.15.d:0 "A temporary command pavilion at the edge of Hupa territory. The summer sun is low in the sky, casting long shadows over the sandstone and sagebrush. President Leonard Wood, in full military uniform adorned with campaign medals and a silver eagle clasp on his chest, sits across from Chief Redcloud, a middle aged man draped in a black wool coat stitched with ceremonial designs, but with hints of New Virginian decoration as a sign of respect. A guard stands outside the tent, rifle slung at his shoulder.\n\nLeonard Wood; Chief Towner, we are men who understand what it means to preserve order in a disordered world. And to that I propose a mutual agreement. One that will secure your people’s future and end this cancer of rebellion eating at the American Confederation.\n\n Chief Redcloud; By title, you will refer to me as Redcloud. I did not come to be flattered, Mr. Wood. You’ve walked into sacred land bearing medals and guns, not peace. My people have heard promises from men like you before. They were carved in paper and washed away in blood, no different than the Commonwealth or Russians to the North.\n\nWood; I am not of the Commonwealth. I am not the Bureau of Indian Affairs. I’m a soldier, and I know the value of loyalty. You have influence. Fighters who understand the land better than any conscript I can muster. The insurrectionists melt into the trees, lands and villages—Hupa trackers could smoke them out like rats. We would compensate your tribe well. Arms. Medicine. Land rights, honored in deed and honor, not just word.\n\nChief Redcloud; You speak of honor, but I hear desperation. Your troops are stretched thin. You wage war on ghosts. And your ‘deeds’ have marched over more tribes than I can name. The snake still hisses, even if it wears your boots now.\nYour nationalism echoes through our lands. It stirs the young ones, those who believe there may yet be a place for the Hupa in your iron republic. But you cannot demand our hands while still bleeding our dignity. The treaty you made with the other first nations were broken not a month after ink met parchment, no? I am…sympathetic to your methods, yes. I believe in tradition, in unity. But tradition must grow from soil that remembers who walked it first. You want our help? Then show my people they will not be swept aside in your march toward empire.\n\nLeonard Wood; Then tell me what you want, Chief. I am not above making concessions to preserve the Republic. If a gesture, a pardon, even a post in my cabinet will buy peace—and your aid—I will make it.\n\n Chief Redcloud; A general pardon for the resistance fighters who lay down arms. Recognition of the Hopi lands as autonomous territory within New Virginia, governed by tribal law. And a public declaration—delivered by you—that the indigenous nations are partners, not subjects.\n\nYou grant this, and we will give you the aid you desire.\n\nLeonard Wood; Your support…and a loyal blade in my hand. You’ll have your declaration. But if your people betray me, Redcloud—if even one Hupa leads a rebel through my lines—I’ll come back with fire. No more meetings. No more talks.\n\nChief Redcloud; Then let us hope, Mr. President, that your fire never needs to cross our lands."
    WWW_Tacoma.15.a:0 "The Hupa Will Fight for Now..."
 WWW_Tacoma.16.t:0 "Subject Electrosphere Testing Report"
        WWW_Tacoma.16.d:0 " OBSERVED PHENOMENA\n -While no measurable neurological output (e.g., remote viewing, thought projection) was verified, ES-Delta did produce unexpected anomalies during three documented test sessions:\n -Telemetry Echo Event (4 Months in Trial Phase) Subject's brainwave patterns were mirrored, within microseconds, by dormant receivers in an adjacent shielded lab chamber—no clear explanation.\n -EM Pulse Discharge (6 Months in Trial Phase); Spontaneous discharge of stored current from lab equipment during subject agitation—believed to be due to equipment fault, but ES-Delta claimed, “...I overloaded the room.”\n -Personnel Contagion Event (9 Months in Trial Phase); Two monitoring staff reported vertigo, auditory hallucinations, and intrusive thoughts after prolonged exposure to ES-Delta’s signal feedback loops. Both were relieved of duty and reassigned.\n\n ADDENDUM; PSYCHOLOGICAL DEGRADATION\n -Subject's mental state deteriorated rapidly following augmentation; Developed echolalia, communicating only in phrases heard from radio chatter.\n -Claimed to perceive “electrical storms” inside other people, sometimes weeping after contact.\n -Repeatedly drew spiraling antenna structures accompanied by glyphs that do not match any known written language.\n -By late stages of Trial Phases, ES-Delta was diagnosed with severe cortical disintegration syndrome and total identity dissolution. EEG readings no longer showed normal delta or alpha rhythms. Subject's waking brain resembled seizure activity, despite apparent calm behavior.\n -Final recorded statement, whispered repeatedly; "We are the echo of something louder."\n\n -TERMINATION REPORT\n -Following the incident 13 Months in Trial Phase, during which the subject was found attempting to wire his own limbs into a junction box, ES-Delta was placed under medical stasis and permanently removed from the trial roster. Deemed non-viable for re-entry into public or controlled society.\n Subject ES-Delta officially declared inactive, and in Vegetative State. Neural Mesh Alpha remains stored in Containment Vault 9.\n CONCLUSION AND RECOMMENDATION\n -Though no practical Neurological abilities were acquired, Electrosphere represents the closest Songbird came to generating measurable environmental effects. The telemetry echo, while unrepeatable, remains unexplained\n -All research into artificial EM enhancement of cognition may be able to provide sufficient results under more contained assessments.. The line between signal and psychosis has proven too narrow to safely explore. Subject should not be referenced in future briefings unless cleared under further experimentation procedures."
        WWW_Tacoma.16.a:0 "Do you Think God Stays in Heaven Because he, too, Lives in Fear of what he's Created here on Earth?"
        
    WWW_Tacoma.17.t:0 "Subject Electrosphere Initial Report"
        WWW_Tacoma.17.d:0 "INTEL REPORT: SUBJECT ELECTROSPHERE –  \nFile ID: SB9621-THETA\nDate: [GetDateText]\nSecurity Classification: TOP SECRET // ULTRA VIOLET \n\nSUBJECT: Primary Report on Project Songbird\n\n I. OBJECTIVE SUMMARY\n -Subject SB-73, codenamed ES-Delta, was designated for experimental trials involving neurological augmentation and artificial modulation of electromagnetic (EM) fields as a means of inducing or stimulation of Neurological and EM phenomena. This vector diverged from the chemical or sensory-deprivation-based methodologies of other Songbird cases. The hypothesis, based on fringe Russian and Montauk based telemetry theories, suggested that human consciousness could be amplified or "tuned" via targeted EM stimulation, effectively turning the subject into a living broadcast-receive antenna for unknown mental frequencies.\n\n II. EXPERIMENTAL PROCEDURE: \nES-Delta underwent the following procedural phases:\n Cranial implantation of EM-reactive transducers and conductive mesh (designated Neural Mesh Alpha).\n Exposure to oscillating magnetic fields (3Hz to 150Hz) under controlled chamber conditions.\n Simultaneous stimuli from white-noise audio induction and stroboscopic visual pulses to destabilize sensory processing.\n Interference patterns recorded via magnetoencephalography (MEG) and full-spectrum RF telemetry.\n\nAttempts made to “sync” Electrosphere's EM patterns with remote targets (both human and non-human).\n\nSubject was isolated for 39 consecutive days under continuous telemetry in Phase IV trials. Reported subjective experiences included:\n -Auditory hallucinations in Morse code.\n -Sensations of “identity displacement” and “waveform bleed.”\n -Claims of interacting with "electric ghosts" in the modulation feedback."
        WWW_Tacoma.17.a:0 "Continued in Testing Report"
        
    WWW_Tacoma.18.t:0 "Answering the Call"
        WWW_Tacoma.18.d:0 "The rain had been falling all night, the kind that soaks your hat brim and washes the sins off the street just long enough to make room for new ones.\nEastbridge was a city born in smoke and iron—on the map, it hugged the coast just north of Libertalia, but nobody talked much about that. Eastbridge had a way of keeping its own secrets. A port town turned steel city turned something stranger. People came here to disappear, or worse, to remember what they’d been trained to forget.\n\n I lived alone above a closed-down pawn shop on 47th and Grail. It wan’t the best, but after leaving the Continental Army, it was the first thing I saw available. \nThat night though, coming home to see a few more flyers and newsletter regarding some sort of veteran's organization, it made me feel nostalgic about my time in the army I suppose. Something was off though. The answering machine blinked red. Three short flashes. A Message? No one used the phones this time of night unless someone was dead—or about to be. \n\nI lit a cigarette, pressed the play button. The tape whirred.\n\n > ‘Good evening, Mr. Foster. This is Rose from Primrose Laundry. We wanted to let you know your special order has arrived; three shirts, red-starched, with the collars turned up. They’ll be ready for collection by sunrise. Please use the Grail Street entrance.’\n\nClick.\n\n No name. No voice I recognized. But it hit like a brick in the chest. Something eerily familiar.\n\nWe were patriots once, or maybe just ghosts trained to pull the trigger on command. They said we were protecting the Republic from what came in on foreign ships. Later, it felt more like we were protecting something *older*—something buried under this country like bones under cobblestones. \nThey always called through the phone. And they always used metaphor. Because that’s how you wake up a dreamer.\n\nIt was still dark when I left the apartment. I didn’t bother shaving. Just threw on my coat and fedora, loaded the snub-nosed revolver I kept in the drawer behind the bourbon, and stepped into the night."
        WWW_Tacoma.18.a:0 "Three PFF Members would be found the Following Morning Dead..."
    WWW_Tacoma.19.t:0 "The Remaining Traitors"
        WWW_Tacoma.19.d:0 "While a majority of the Pacifica First Front has been destroyed and is currently situated as no-factor, there's still the question as to what to with the many other factions within the American Confederation.\n\n Such factions include the Hamiltonians, Burrites, Libertarians, and many of the Freemasons who chose to stay on the fence or simply distanced themselves from us. \n\n Now that the main issues have been dealt with we now face the decision on whether we should either bring such organization back into our fold, or purge them for choosing the wrong factions."
  
    WWW_Tacoma.20.t:0 "All Roads..."
        WWW_Tacoma.20.d:0 "The investigation within the former Pacifican Firsters compound, as ordered by the Federal Government, had been issued not too long ago and Agent Nathaniel White had already begun making progress.\n\n He had begun making way into the damp basement, it still smelt like burning powder and you could see some blood splatters on the wall from previous attempted raids against the complex. \n\n As he reaches the floor of the basement he could see quite a mess that had occurred during the raid. \nHell, there must've been well over a hundred casing on the ground, apparent scorch marks and burnt out crates could be seen, unsure if the crates were there before or after the raid. \n\nIt was hard to make out the lettering and message on the crate since it had been burnt so badly, unsure if by Pacificans prior to the raid or from an accidental incendiary grenade that popped off from a federal grenade. He could almost make out a logo, almost. \nThough upon closer inspection he could make out a few more crates, all of which had the same letterings and logos; all of which burned to various degrees. \nHe had taken out a sketchpad to try and create some sort of puzzle by drawing whatever non-burnt markings remained. \nOnce he was done, there was still a few blank areas, but he could make out what it was trying to to say finally.\n It was a rifle on a banner either lettering on it that read, ‘C-m- -nd Ta– -t.’ Though it still wasn't entirely clear, he very much could put the pieces together on who the crates came from. He had seen that flag before, even if it was burned to bloody hell.\ nAnd he had enough evidence he needed to send back to HQ."
        WWW_Tacoma.20.a:0 "Prepare for Mobilisation Against Fredonia"      
    WWW_Tacoma.21.t:0 "Cabalists Announce New Leader"
        WWW_Tacoma.21.d:0 "A rather new member of the Cabalists has to the surprise of many has risen to become the actual leader of the Clique. \n\nFormer member of the Continental Army Government, internal intelligence agent of the American Confederation, and notable America First defender no less. After attending several meetings, Robert Wood would eventually become a popular firebrand and speaker of the party. \n\nPrior to leadership of the clique, Wood would become eventually impressed by the party’s ideas of rallying the nation under one party, along with some of their more unsavory beliefs. \nWood, upon defending some of the cliques in an oratory debate, impressed many of the higher ups and would eventually be directly invited into the party, where he would find himself developing quite the following amongst nationalists, patriots, army veterans, and even some Freemasons! This skill would lead to him becoming a propaganda minister for the party, alongside an orator at numerous public speaking events. n\nWith many arguments regarding the Cabalist’s position during the Pacifican Insurrection, their indecisive decision would allow for numerous leaders to fall, and for an almost complete destruction of the party. \n\nIf it wasn't for Wood that is."
        WWW_Tacoma.21.a:0 "Maybe He'll Prove more Loyal than Hoffman?"
    WWW_Tacoma.22.t:0 "Question of Traitorous Freemasons"
    
    WWW_Tacoma.23.t:0 "When the Day is Done"
        WWW_Tacoma.23.d:0 "The battle is over, the day has finally come and the sun has finally come up beyond the horizon. \nWe have won, the first struggle at least. Parades echo throughout the Confederation, and speeches have been heard upon every corner of the nation, but one rings within the heart of every American. The most important speech of the day was Leonard Woods announcement of retirement, and while confetti falls, fireworks pop and red white and blue banners wave all over the country, and while behind the scene movements are already being made by politicians to see who shall succeed him, there still lies a question in the minds of everyone in the nation…"
        WWW_Tacoma.23.a:0 "What Comes Next?"
