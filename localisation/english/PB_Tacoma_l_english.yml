    TAC_Cincinnatus_AtLast1:0 "Our Cincinnatus at Last"
        TAC_Cincinnatus_AtLast1_desc:0 "The Campaigns have been won, though there is but one final question Leonard Wood holds. The years have gone, and in service to his nation Wood grows weary as the years catch up to him.\nLooking to return to his private life as his last action as Commander and Chief, such an action truly proves his humility and total desire towards the true restoration of Founding Fathers dreams."
    TAC_Revive_American_Dream:0 "Reviving the American Dream"
        TAC_Revive_American_Dream_desc:0 ""
    TAC_Nation_Sword:0 "The Sword of Our Nation"
        TAC_Nation_Sword_desc:0 "The Spirit of America and the absolute defense of her values have been the very backbone of our nation for the longest of times. \nThe ideals and defense of them have also proved to be a characteristic of of the civil service of every American Citizen. \nThough aiding them in this aspect would prove only helpful to our nation's spirit."
    TAC_Nation_Vigiliance:0 "A Nation of Vigilance"
        TAC_Nation_Vigiliance_desc:0 "The price of freedom is to be the absolute viligant in the eyes of Freedom and Liberty and to always prepare for her grand defense. \nIf America is to endure these times, every able bodied citizens must be ready to defend her at all cost."
    TAC_Nation_Shield:0 "The Shield of Our Nation"
        TAC_Nation_Shield_desc:0 "America's Industry has always been the grand ideal to her strength. \nThe American worker, proud in production towards the awakening of the sleeping giant, is what will win the wars of tomorrow. \nIf reclaiming the East is to come to fruition, it will be won by American Brawn."
    TAC_Peoples_Fighter:0 "The People's Fighter"
        TAC_Peoples_Fighter_desc:0 "Robert Minor has been of great assistance to the American cause from even before his birth, being a descendant of the American Revolution \n-His mother being related to one of Jefferson's supporters.\nEven today, before the American Confederation's collapse did he remain at fair Columbia's side, such as during the Seattle War's where he supported vast labor strikes in the heart of Seattle - looking for American Annexation.\nHe is in the minds of numerous of our nation's working class, to no doubt Minor has the American Worker on his side, and if we're going to win, We're going to need his help."
    TAC_Move_Past_Rebellion:0 "Moving Past the Rebellion"
        TAC_Move_Past_Rebellion_desc:0 "The legacy of The Last Rebellion has made the spirit of America Groan and made her national spirit ultimately weary and melancholic. \nDo not fear America. Good Times are finally here again!"
    TAC_Remember_Roots:0 "Remembering Our Roots"
        TAC_Remember_Roots_desc:0 "Though the First American Revolution was nearly One and Half Centuries ago, the meanings we have fought for and the aspects of the Founding Fathers remain true in our fight, despite what many may say.\nThe fight will go on, the dreams of Washington have not fallen. We must continue the fight, lest we fail."
    TAC_Address_Crisis_Confidence:0 "Addressing the Crisis in Confidence"
        TAC_Address_Crisis_Confidence_desc:0 "With the passing of the past several decades, you really couldn'y blame the American populace in having doubts in their government. \nFrom one folly after another, the ultimate malaise within the spirit of America has only grown more and more with each passing crisis. \n\nThose times are over, now and forever."
    TAC_National_Caucus:0 "A National Caucus"
        TAC_National_Caucus_desc:0 "The Nation cannot remain leaderless forever, America must have her President\nHer Commander and Chief.\nWithout it, the main idea of America is gone!"
    
    TAC_Dont_Rock_Boat:0 "Don't Rock the Boat"
        TAC_Dont_Rock_Boat_desc:0 "The Continental Army have been the very backbone of our nation from even during the First Revolution. \nMany of the founders retained military backgrounds, and the very continuation and existence of our nation could not exist without the Legions of America.\nIt only makes sense for the nation to continue its Military Traditions of rule."
    TAC_Militarize_Culper_Ring:0 "Militarize the Culper Ring"
        TAC_Militarize_Culper_Ring_desc:0 "The Sons of Liberty could not have won the Last Revolt, without the almighty assistance of the Culper Ring. \nAnd thanks to their great assistance, does it continue to exist. Through the great effect of empowering and militarizing them, can we hope that the Great American Experiment can continue."
    TAC_Republican_Guardians:0 "Guardians of the Republic"
        TAC_Republican_Guardians_desc:0 "The Military man is of noble character. \nThere aren't man who would stalwartly defend in the institutions of the nation's principles be it the Constitution or all aspects of the sovereign democratic principles of the state. \nSuch characters need to be worshipped greatly as heroes of the nation."
    TAC_Fed_Legacy:0 "Legacy of the Federalist Papers"
        TAC_Fed_Legacy_desc:0 "The Federalist Party of the United States was a political party long ago during the First Revolution founded by founder Alexander Hamilton, which promoted a strong national Government and a general centralization. \nFunnily enough, not too different from what we have currently. \nIf we promote the Federalist Papers and the goals of the enlightnment, it will only help to further our legitimacy."
    TAC_Washington_Memoirs:0 "Memoirs of Washington"
        TAC_Washington_Memoirs_desc:0 "There are many things that can be said about George Washington, former Founding Father of the United States. \nBut one of the most notable characteristics that he carried the most is his humility\n-A truly down to Earth leader, when most in the world dreamed of gold, riches and more importantly power.\nTruth be told, there are many in the nation who need to learn from Washington's Lessons. Corporationists, landlords, and all forms of tyranny of the day."
    TAC_America_Legions:0 "The Legions of America"
        TAC_America_Legions_desc:0 "Those noble enough to defend the valiant sons of our nation are most absolutely heroes to Mother Liberty. \nAmericans, Sons and Countrymen most capable of carrying and picking up a rifle to defend this great nation with their very blood and lives, to those who give oath to defend the Constitution will be forever enshrined in the hearts and minds of our people, as such is the way for American Life."
    TAC_More_Perfect_Union:0 "Towards a More Perfect Union"
        TAC_More_Perfect_Union_desc:0 "The American Confederation and her predecessor, the United States are not perfect. \nEven the Founding Fathers believed that the system needed changes and adjustments from time to time to ensure the dreams of Liberty can survive, no matter how blasphemous it may sound. \nAnd though the aspects and tenets of the foundations of our nation remain to be imperfect, we can still strive for its perfections. \nIt is a unique system and we simply need to strive make it more easier for the citizens of our nation to make it better for every good American."
    TAC_Nation_Defenders:0 "Defenders of the Nation"
        TAC_Nation_Defenders_desc:0 "The Continental Army stands as the shield of the republic and the embodiment of patriotic virtue. \nThrough parades, speeches, and public remembrance, we will remind the people who kept the nation alive\n—not the politicians who nearly broke it before, not revolutionaries, but the brave few in uniform."
    TAC_America_First_Decl:0 "America First Declaration"
        TAC_America_First_Decl_desc:0 "The United States is a soon to be giant on the world stage, though before its rebirth there are many nations around the world who would believe our nation to be on sale, and that we would just be another pawn for them on the board.\nLet it be known to the world, America is not for sale and will never be. \nAs long as the land of North America and the American Dream lives on, the sovereignty of the Free, unwavering priority of the US will here and always be 'The US'"
    TAC_Another_Wood:0 "Another Wood on the Stage"
    
        TAC_Another_Wood_desc:0 "The chaos of democracy has yielded only paralysis. Parties bicker, old institutions rot, and the nation stumbles toward ruin. But in the wings stands a man ready to command the stage; Robert Wood\n—a figure of discipline, vision, and uncompromising patriotism. The people cry out for order, and he answers."
    TAC_Young_Patriots:0 "Fund the 'Young Patriots' Organization"
        TAC_Young_Patriots_desc:0 "The youth of our nation are like soft-moldable wax. \nA symbol of future perfections.\nShould we not mold them to fit within the desire of our future societies?\nSoldiers, scientists and those working to build a better tomorrow.\n-For America"
    TAC_NSL_Only:0 "No One, but the Sons of Liberty"
        TAC_NSL_Only_desc:0 "The Formation of Political Parties have only allowed for the Crises of the previous years to form.\n Their existence has only further divided and polarized our nation, and it is for that reason, they cannot continue existing.\nBesides, who else in the nation could save America other than the Sons of Liberty."
    TAC_Corporate_Support:0 "Bring in Corporate Support"
        TAC_Corporate_Support_desc:0 "The Corporation of the American Confederation have long been potential allies to the American Experiement, the First Revolution in of itself was founded off of the principles of a free economy and by numerous businessmen. \nWe can declare our support for deregulation of these corporations and allow them to expand their influences into the Government.\nOnly good can come from their support, and besides. \nWe could use their Almighty Dollar."
    TAC_Red_Purge:0 "No Room for the Red Flag"
        TAC_Red_Purge_desc:0 "§Y'There is no room for the Red flag -- Smash it! ...America First must be stamped on every heart.'§!\n§B-Leonard Wood§!"
    TAC_Cult_Personality:0 "Forge a Cult of Personality"
        TAC_Cult_Personality_desc:0 "The Speaker, the Rallies, the very sould of the nation resides within Robert Wood. \nHis graces, his spirit is devoted to America solely. There is nobody who can guide us into the future other than him.\nHe Alone carries the Torch of Columbia! It is with him that our resolve must be emplaced.\nWhithout Robert Wood, there would be no America!"
    TAC_Mil_Heritage:0 "Glorify Our Military Heritage"
        TAC_Mil_Heritage_desc:0 "The Military History of the United States has been that of Glory and Amazement, worthy of being praised by all in the nation.\nWe truly could not be the greatest in the world without our boys in blue. \nJust ignore all those times where we've lose, we're erasing those from the history books anyways."
    TAC_America_Above_All:0 "Americans Above All"
        TAC_America_Above_All_desc:0 "In times of fracture and doubt, one truth must be made clear; the nation survives only when its people stand united as Americans. Not as factions, not as ideologues, not as immigrants or elites, but as one people bound by shared blood, sacrifice, and history.\nIt is through that sacrifice that makes America superior to all other forces, all other nations, truly no nation can stand above America."
        
    TAC_Fightin_Bob:0 "Victory for the American Worker"
        TAC_Fightin_Bob_desc:0 "For too long, the American worker has borne the burden of a system rigged against them—cast aside by distant elites, squeezed by collapsing wages, and ignored by those who claim to lead. Yet in the factories, fields, and foundries, it is their hands that keep the nation alive."
    TAC_Red_Star:0 "Red Star of the West"
        TAC_Red_Star_desc:0 "The Republican and Cause for the Liberation of the working class in the name of Freedom, Liberty and the Pursuit of Happiness are very much coincided, and very much American Values worth fighting for.\nLet America be the shining symbol of Liberty for all. May she reign supreme in her cause."
    TAC_Red_Founders:0 "Paint the Founders Red"
        TAC_Red_Founders_desc:0 "The ideals of the Founding Fathers and the Ideals of the Republican Enlightenment in truth are not too far away from eachother.\nFigures like Jefferson and Adams are already heralded among our groups as philsophers of the Republican Ideals of the People. \nJust with a little bit of highlighting, we can be sure to promote these similarities."
    TAC_Reachout_Farmer:0 "Reaching Out to Our Farmers"
        TAC_Reachout_Farmer_desc:0 "The Farmers of our nation are the bulwark of the Jeffersonian ideals and tenets that remain true to this very day. \nMany though, despite feeding our nation and being heroes to the American Dream, still have many of their issues remained unanswered by any political group in the Government.\nThis can't be America, if our farmer's woes remain unanswered, can we truly say we're standing true for the Jeffersonian Ideal?"
    TAC_Mass_Nationalization:0 "Mass Nationalization"
        TAC_Mass_Nationalization_desc:0 "Though the foundations of America were made on the principles of a free economy, there are those who would hope to abuse these principles for their own gain.\nRobber Barons who would acclaim to be nothing more than tyrants and kings in all but name. \nAnd who is to stop them? Why no one other than your friendly man in the Government of course!"
    TAC_Force_PP_Union:0 "Reunite the Freemasons"
        TAC_Force_PP_Union_desc:0 "Through the past few years, through the actions of the Federal govenment has led to mnay of our nation's Freemasons to distance themselves from us.\nWhile we can't blame them for this, as many actions commited have been away from the securities of free Democracy.\n-These actions taken to secure it's safety and order only temporariliy.\nThough it should be noted that the Masons still hold vast influence over thousands of our citizens, alongside many within our Government.\nWe should absolutely make motion to make amends with them."
     TAC_Elevate_RBOR:0 "Elevate the Red Bill of Rights"
        TAC_Elevate_RBOR_desc:0 "The Bill of Rights was created as a docment and list of liberties and freedoms that was written during the First Revolution, planned to be integrated into the Constitution as a list of unalienable rights for citizens.\nThough this list was never outright integrated, that doesn't mean it can't now. And while we're at it, we might as well expand listings and make small edits to be more adequate to our sociopolitical issues of the modern day alongside additional worker charters."
    TAC_Industrial_Federalism:0 "Industrial Federalism"
        TAC_Industrial_Federalism_desc:0 "Only through the expansion of workplace democracy can the light of Liberty reach every corner of the nation.\nThrough the expansion of Unions amongst all workers, can the American Dream come to fruition."
    TAC_Japanese_Help:0 "Legacy of the Democratic-Republican Societies"
        TAC_Japanese_Help_desc:0 "During the First Revolution, the Democratic-Republican Societies were founded as an organization to promote the free aspects of liberty and democracy, notably having many ties to the Jacobins and Republican movments of France.\nThe organizations were known to promote Revolutionary Thought and promote abolitionist ethos during times when slavery was the norm. Though these societies were considered radical at the time, today this ethos proves to be a very shining symbol for today's America."
    TAC_Red_Beacon:0 "Red Beacon of Liberty"
        TAC_Red_Beacon_desc:0 "Though we are rather young and new in the world of left wing governments around the world, we have to show them that we're not just some inexperienced charlatan.\nLet it be known to the world through the words of the Founding Fathers, that we are and have always been the true heralds of Freedom."
 ###DECISION###
    TAC_WWW_MIC_Category:0 "Malheur Insurrection Crisis Intervention "
        TAC_WWW_MIC_Category_desc:0 "\n\n\n\n\n\n\nDespite several beliefs that the United Confederation has been nearly wiped from the face of the Earth, to our surprise there still exists numerous agents and freedom fighters who still cling to the memory and beliefs of the §OOld Glory§! banner.\n\nMany such children of the American Revolution still fight and continue resistance against the so called §R'saviors of democracy'§! to the East in New Walden, under the forename §G'The Green Mountain Boys'§! these patriots only need a helping hand to achieve their dream..."
    TAC_WWW_MIC_Mission1:0 "§YOperation:§! §CPAUL REVERE§!"
    TAC_WWW_MIC_Mission2:0 "§YOperation:§! §OFREEDOM'S LIGHT§!"
    TAC_WWW_MIC_Mission3:0 "§YOperation:§! §GGREEN MOUNTAINEER§!"

  ###Military Focuses###
    TAC_Modernize_Continental_Army:0 "Modernize the Continental Army"
        TAC_Modernize_Continental_Army_desc:0 "Our nation has been in numerous conflicts in the past few decades. And as of the past few years, it has been a series of defeats and losses. \nWe are running with outdated equipment and tactics. If we are going to survive the future conflicts that await us, we are going to need to modernize."
    TAC_Cleaning_Up_Seattle_Nightmare:0 "Cleaning Up the Nightmare of Seattle"
        TAC_Cleaning_Up_Seattle_Nightmare_desc:0 "The stain of our attempted annexation of the Seattle Territories has proven to be an ugly mess for our national pride, and will continue to do so until we address the necessary changes required to overhaul the Continental Army."
    TAC_Columbias_Call:0 "Columbia's Call"
        TAC_Columbias_Call_desc:0 "The Seccessionist efforts of the Libertalian Rebellions have placed thousands of potential enemies at our doorstep. Our ideals, our principles and our countrymen must be defended to the upmost degree, and to aid in this we will increase our recruitment efforts."
    TAC_Freedom_Price:0 "The Price of Freedom"
        TAC_Freedom_Price_desc:0 "It doesn't matter if we have millions of soldiers to defend our homeland. If we don't have the proper arms and equipment, all of our efforts will be for not."
    TAC_Vacant_Ranks:0 "Fill the Vacant Ranks"
        TAC_Vacant_Ranks_desc:0 "Within our territories and beyond there are thousands of soldiers willing to fight for our ideals, and the tenants of the Enlightenment. And who are we to deny them? Let us press them into service"
    TAC_Calling_SOL:0 "Calling Every Son of Liberty"
        TAC_Calling_SOL_desc:0 ""
    TAC_Rebuild_Navy:0 "Rebuilding the 2nd Continental Navy"
        TAC_Rebuild_Navy_desc:0 "During the Seattle War we lost several of our defensive and coastal fleets, not to mention numerous sailors would defect in allegiance to the surrounding seccessionist movements. We should focus on rebuilding and reinforcing our naval forces again."
    TAC_Patriots_One_All:0 "Patriots One and All"
        TAC_Patriots_One_All_desc:0 ""
    TAC_Nations_Bounty:0 "Our Nation's Bounty"
    TAC_Reviving_Colossus:0 "Reviving a Colossus"
    TAC_Eagle_Soars:0 "The Eagle Soars"
    TAC_Columbia_Reborn:0 "Columbia Reborn"
    TAC_Refurbish_Fort_Washington:0 "Refurbishing Fort Washington"
        TAC_Refurbish_Fort_Washington_desc:0 "With all of the recent developments in aeronautics and military developments, we should really consider establishing multiple new deparments, offices, and renovations in Fort Washington"
    TAC_Renaissance_Catchup:0 "Catching up to Other 2nd Renaissance Armies"
    TAC_Second_To_None:0 "Second to None"
    TAC_Wulfpads_Runways:0 "Wulfpads and Runways"
    TAC_Revolution_High_Seas:0 "Revolution on the High Seas"
    TAC_Project_Atlas:0 "PROJECT: §RATLAS§!"
        TAC_Project_Atlas_desc:0 "While the ideals of the Marines have been at the center of our Nation even before its founding.\n\nIt is unfeasable to believe that the reconquest of the American Federation and the rest of America - over mountains and deserts - can be relied on a bunch of soldiers specialized in Marine Warfare. \n\nWith such realization during our Modernization efforts, a clique of Fort Washington's Military Researchers have suggested utilizing the advancments in researching the Russian Advancements of §RPowersuits§! to advance our Military Might."
    TAC_Wild_Blue_Yonder:0 "Into the Wild Blue Yonder"
    TAC_Continental_Air_Cavalry:0 "Authorize the Creation of the Continental Air Cavalry"
    TAC_Project_Bigsky:0 "PROJECT: §CBIGSKY§!"
        TAC_Project_Bigsky_desc:0 "The skies of North America are free for the taking. \n\nWhile the British Empire may hold grasp on the Oceans, and the Russian Empire may hold domain over the Lands. It is us who would hold the skies as our domain. \n\nIt is highly believed that this development would be able to provide an opening into an entirely new front, capable of striking our enemies from the backlines. Creating fear and chaos among our foes. "
    TAC_Project_Bluewater:0 "PROJECT: §BBLUEWATER§!"
        TAC_Project_Bluewater_desc:0 "The American Confederation Marines have long been the very backbone of our elite professional soldiers. \n\nThis group of professional soldiers have been proved as our very vital in our independence - even going forth to being a very symbol of our Nation's Pride and Spirit of Independence and its defense. \n\nWith such a belief, Field Marshall Daniel Daly has proposed that instead of replacing the Marines with Hardsuit Division, to instead completely overhaul their training to be capable in successfully being capable in matching the necessary feats we may face in reconquering North America. \n\n§B"COME ON YOU SONS OF BITCHES, DO YOU WANT TO LIVE FOREVER"§!"
    TAC_Anchors_Aweigh:0 "Anchors Aweigh"
    TAC_JP_Jones_Spirit:0 "Spirit of John Paul Jones"
    TAC_Deadliest_Weapon:0 "Deadliest Weapon on Earth"
    TAC_Project_Songbird:0 "PROJECT: §PSONGBIRD§!"
        TAC_Project_Songbird_desc:0 "A very radical and experimental in developing and modernizing our army is to allow for the development of Psionics within our division. \n\nProject Songbird aims to explore and harness psionic abilities—mental powers such as telepathy, telekinesis, and precognition—which could potentially revolutionize intelligence gathering, battlefield control, and psychological operations. While the concept of psionics has long been associated with science fiction, recent advancements in neuroscience and quantum physics have reignited interest in these phenomena.\n\nPerhaps with this development, the nation will have an edge against even the Empire in Britain. \n\n§RProvided it works...§!"
    TAC_Project_Icarus:0 "PROJECT: §YICARUS§!"
        TAC_Project_Icarus_desc:0 "It is to no surprise that the Empire of the Far East has planes, bombers, and supplies of untold numbers. Bombardments and the total annihilation of our cities is an inevitable that may await us when a conflict comes to our doors.\n\n §RWe cannot let this happen.§! \n\nThanks to our scientists, a very interesting idea has came forth, with the advancements of things such as Lasers, Teslan-Weapons, Ballistics, and Military Modernizations - we can utilize these technologies in the creation of a long range, anti-air weapon, under the pseudonym §Y'Project Icarus'§!\nWith this our skies stand no chance of being shattered by the enemy."
