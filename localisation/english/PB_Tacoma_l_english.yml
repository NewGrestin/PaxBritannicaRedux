    WWW_Tacoma.27.t:0 "Return of the Federalists"
        WWW_Tacoma.27.d:0 "Once a faction during the First American Revolution, the Federalists ideas have been largely brought back and restored into the folds of guiding the national government. \n\n Alexander Hamilton’s ideas of promoting a central authority to promote the welfare and security of our nation, while we have of course been doing this for a while now, our announcement of the Federalists Revival has only further cemented our legitimacy in the eyes of our people.\n\n On top of all of this though, with the return of the these papers, it has also brought about a mass interest into the work of the Founding Fathers. Several citizens have begun acquiring a newly published book featuring much information regarding the Federalists Papers, alongside featuring numerous quotations, essays and works from the Founding Fathers.\n This book has exploded all over the nation, and its publishing has led to a smaller edition being provided to citizens by the government, featuring a notably binding in the color blue, due to such a decision the book has been nicknamed, ‘The Little Blue Book.’"
        WWW_Tacoma.27.a:0 "Do Not Lose Faith in the Founders, Their Guidance is Still With Us!"
