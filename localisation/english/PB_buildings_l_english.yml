l_english:
 infrastructure: "Infrastructure"
 infrastructure_plural: "Infrastructure"
 infrastructure_desc: "This building provides the state with improvement of infrastructure. It increases your supply power in strategic regions and increases your divisions' speed, as well as increasing your raw resource extraction."
 arms_factory: "Arms Factory"
 arms_factory_plural: "Arms Factories"
 arms_factory_desc: "This building provides the state with industry for production of new military equipment. Can be converted to civilian industry if needed."
 dockyard: "Naval Dockyard"
 dockyard_plural: "Naval Dockyards"
 dockyard_desc: "This building provides the state with industry for building new ships."
 dam: "Dam"
 dam_plural: "Dams"
 dam_desc: "Dams provide additional power to a state, improving industry and resource output."
 dam_mountain: "$dam$"
 dam_mountain_plural: "$dam_plural$"
 dam_mountain_desc: "$dam_desc$"
 canal_kiel: "Holsteiner Canal Locks"
 canal_kiel_plural: "$canal_kiel$"
 canal_kiel_desc: "The Holsteiner Canal Locks are needed in place in order for the canal to operate at full capacity, and destroying them would hinder shipping and movement for a long time."
 canal_panama: "Nicaragua Canal Locks"
 canal_panama_plural: "$canal_panama$"
 canal_panama_desc: "The Nicaragua Canal Locks are needed in place in order for the canal to operate at full capacity, and destroying them would hinder shipping and movement for a long time."
 canal_australia: "Janszoon Canal Locks"
 canal_australia_plural: "$canal_australia$"
 canal_australia_desc: "The Janszoon Canal Locks are needed in place in order for the canal to operate at full capacity, and destroying them would hinder shipping and movement for a long time."
 industrial_complex: "Industrial Complex"
 industrial_complex_plural: "Industrial Complexes"
 industrial_complex_desc: "This building provides the state with industry for production of civilian goods or construction of new buildings. Can be converted to military industry if needed."
 air_base: "Air Base"
 air_base_plural: "Air Bases"
 air_base_desc: "This building provides the state with deployment for your air forces."
 naval_base: "Naval Base"
 naval_base_plural: "Naval Bases"
 naval_base_desc:1 "Extends the range of your fleet and provides repair services for it. Allows overseas supply and export of resources. Higher levels increases the supply throughput."
 bunker: "Land Fort"
 bunker_plural: "Land Forts"
 bunker_desc: "This building inflicts an attack penalty of $VALUE|+%0$ for each fort level on the attacker in combat. Attacking from multiple directions will reduce forts effect."
 coastal_bunker: "Coastal Fort"
 coastal_bunker_plural: "Coastal Forts"
 coastal_bunker_desc: "This building inflicts an attack penalty of $VALUE|+%0$ for each fort level on the attacker in naval invasion combat."
 anti_air_building: "Anti-Air"
 anti_air_building_plural: "Anti-Air"
 anti_air_building_desc: "This building provides the state with protection from enemy bombers and ability to fire at attacking aircraft."
 synthetic_refinery: "Synthetic Refinery"
 synthetic_refinery_plural: "Synthetic Refineries"
 synthetic_refinery_desc: "This building provides the state with"
 synthetic_refinery_amount: "$VALUE|Y0=$"
 synthetic_refinery_resource: "£resources_strip|$FRAME$"
 radar_station: "Radar Station"
 radar_station_plural: "Radar Stations"
 radar_station_desc: "Radar allows you to gain intel on enemy troops in nearby states.\nA higher radar level in a state increases the effective range of the radar.\nRadar also provides the state with better detection of enemy air forces, giving your planes a better chance to engage them.\nIn addition radar increases the detection of enemy fleets at sea."
 rocket_site: "Rocket Site"
 rocket_site_plural: "Rocket Sites"
 rocket_site_desc: "This building provides the state with deployment for produced rockets."
 nuclear_reactor_heavy_water: "Heavy Water Nuclear Reactor"
 nuclear_reactor_heavy_water_plural: "Heavy Water Nuclear Reactors"
 nuclear_reactor_heavy_water_desc: "This building provides the state with production of enriched Uranium for use in Nuclear weapons.\nNuclear reactors using Heavy Water are somewhat cheaper to build than Graphite Reactors, but produce less material that can be used to produce nuclear weapons."
 nuclear_reactor: "Nuclear Reactor"
 nuclear_reactor_plural: "Nuclear Reactors"
 nuclear_reactor_desc: "This building provides the state with production of enriched Uranium for use in Nuclear weapons."
 commercial_nuclear_reactor: "Civilian Nuclear Reactor"
 commercial_nuclear_reactor_plural: "Civilian Nuclear Reactors"
 commercial_nuclear_reactor_desc: "This building provides the state with enriched uranium for nuclear weapons and produces electricity for the civilian economy."
 nuclear_facility: "Nuclear Research Facility"
 nuclear_facility_plural: "Nuclear Research Facilities"
 nuclear_facility_desc: "Experimental Facilities for Nuclear Research allow you to start research projects relating to the use nuclear power."
 air_facility: "Aerodynamics and Avionics Facility"
 air_facility_plural: "Aerodynamics and Avionics Facilities"
 air_facility_desc: "Experimental Facilities for Aerodynamics and Avionics allow you to start research projects for aircraft, rockets and related electronics."
 naval_facility: "Naval Engineering Facility"
 naval_facility_plural: "Naval Engineering Facilities"
 naval_facility_desc: "Experimental Facilities for Naval Engineering allow you to start research projects related to Surface Ships and Submarines.\nA Naval Engineering Facility can only be created in a coastal province."
 mega_gun_emplacement: "Multi-Charge Large Caliber Gun"
 mega_gun_emplacement_plural: "Multi-Charge Caliber Guns"
 mega_gun_emplacement_desc: "Operating on the principle of multi-charge propulsion, this large caliber gun is designed to achieve unparalleled ranges in bombardment. Utilizing a series of underground tunnels, it accelerates shells to supersonic speeds before launching them towards distant targets."
 stronghold_network: "Stronghold Network"
 stronghold_network_plural: "Stronghold Networks"
 stronghold_network_desc: "An extensive defensive system of massive bunkers and strongly fortified positions, designed to repel enemy advances and secure key strategic areas."
 land_facility: "Land Warfare Facility"
 land_facility_plural: "Land Warfare Facilities"
 land_facility_desc: "Experimental Facilities for Land Warfare  allow you to start research projects related to various aspects of land warfare, such as special tanks, or artillery."
 biochem_facility: "Bioengineering and Chemistry Facility"
 biochem_facility_plural: "Bioengineering and Chemistry Facilities"
 biochem_facility_desc: "Experimental Facilities for Bioengineering and Chemistry  allow you to start research projects related living organism, chemical compunds and augmentation."

 farm: "Agroponics Complex"
 farm_plural: "Agroponics Complexes"
 farm_desc: "This building improves the food situation of the surrounding state, granting additional agriculture resources."
 medical_center: "Medical Center"
 medical_center_plural: "Medical Centers"
 medical_center_desc: "This building improves the medical situation of the surrounding state, requiring some weekly manpower for upkeep but decreasing the experience units lose upon taking damage"
 research_center: "Research Campus"
 research_center_plural: "Research Campuses"
 research_center_desc: "This building improves the scientific situation of the surrounding state, requiring some weekly manpower for staffing and upkeep and providing §Y$MODIFIER_RESEARCH_SPEED_FACTOR$:§! §G+0.5%§!"
 colonial_outpost: "Colonial Outpost"
 colonial_outpost_desc: "This building helps to recruit local forces for our cause, requiring some weekly manpower for staffing and upkeep but increasing local non core manpower."
 steel_mill: "Synthetic Mineral Fabricator"
 steel_mill_plural: "Synthetic Mineral Fabricators"
 steel_mill_desc: "This building produces small amounts of synthetic mineral resources, specialized via technology research."
 tesla_tower: "Tesla Tower"
 tesla_tower_plural: "Tesla Towers"
 tesla_tower_desc: "This building allows a state to be connected to the Global Wireless Network, a system designed to allow for easily accessible wireless power. States that are not connected to the network suffer penalties to industrial capacity and supply."
 fuel_silo: "Fuel Silo"
 fuel_silo_plural: "Fuel Silos"
 fuel_silo_desc: "This building provides your nation with more room for stockpiling §HFuel§!."

  ### LANDMARKS ### 
  # please keep the same order as in PB_landmarks.txt
 # EUROPE
 landmark_big_ben_pax: "Big Ben"
 landmark_big_ben_pax_plural: "$landmark_big_ben_pax$"
 landmark_big_ben_pax_desc: "The clock tower at Westminster, colloquially known as Big Ben after the bell housed within it, was originally built in 1847 in the Gothic Revival style and became a symbol of the British Empire. In the 1920s, the tower underwent a major reconstruction that raised its height above London's upper canopy, added Art Deco elements, and replaced the clock with an illuminated digital display."

 landmark_imperialhalle: "Imperialhalle"
 landmark_imperialhalle_plural: "$landmark_imperialhalle$"
 landmark_imperialhalle_desc: "The seat of government was established in 1834 following more than a decade of reconstruction in the historic center of Frankfurt. After Austria's conquest and the transformation of the Holy Roman Empire into the United Kingdoms of Germany, the new imperial government sought to honor the Golden Bull of 1356 by relocating the capital to the traditional city of the emperors' coronation. Today, the Imperial Hall serves as the venue for the coronation of successive emperors and for the sessions of the Imperial Assembly, in which representatives of every constituent state take part."

 landmark_cologne_cathedral: "Cologne Cathedral"
 landmark_cologne_cathedral_plural: "$landmark_cologne_cathedral$"
 landmark_cologne_cathedral_desc: "The most iconic cathedral in this part of Europe. Its construction took more than 600 years in total, finally being completed in 1844. It serves as a symbol for Catholics throughout the German Empire."

 landmark_hofburg_palace_pax: "Hofburg Palace"
 landmark_hofburg_palace_pax_plural: "$landmark_hofburg_palace_pax$"
 landmark_hofburg_palace_pax_desc: "The Hofburg was the former principal palace of the Habsburgs. After the imperial capital was transferred to Frankfurt, it now serves only a local administrative and ceremonial role."

 landmark_charlemagne_monument: "Monument of Charlemagne"
 landmark_charlemagne_monument_plural: "$landmark_charlemagne_monument$"
 landmark_charlemagne_monument_desc: "A towering 185-meter statue of Charlemagne, to which France claims exclusive rights. Completed in 1893, the monument build from granite with gilded accents, dominates the northwestern edge of the Champ de Mars, right beside the Seine. During the Great War, it was damaged, and after restoration the French deliberately left a breach in the area of the great leader's heart. It is meant to remind them of the injustice of the Treaty of Tours and of the suffering of the French nation."

 landmark_colossus_of_liberty: "Colossus of Liberty"
 landmark_colossus_of_liberty_plural: "$landmark_colossus_of_liberty$"
 landmark_colossus_of_liberty_desc: "A colossal statue standing by the port of Nice was an initiative of France, Italy, and Spain as a symbol of the brotherhood and independence of these nations. It was made of bronze and erected in 1887."

 landmark_joanne_darc_monument: "Joanne d'Arc Monument"
 landmark_joanne_darc_monument_plural: "$landmark_joanne_darc_monument$"
 landmark_joanne_darc_monument_desc: " "

 landmark_notre_dame: "Notre-Dame"
 landmark_notre_dame_plural: "$landmark_notre_dame$"
 landmark_notre_dame_desc: "The seat of the Archdiocese of Paris, this cathedral is located on an island in the Seine and is one of the most iconic buildings in Paris. During the Great War, a significant part of it was destroyed by fire as a result of bombardments. It was later rebuilt based on sketches made several years earlier, which had been preserved in the basement of a Parisian house."

 landmark_colosseum_pax: "Colosseum"
 landmark_colosseum_pax_plural: "$landmark_colosseum_pax$"
 landmark_colosseum_pax_desc: "Located in the center of Rome, this is the largest Roman amphitheatre, once used by gladiators. Today it serves as a tourist attraction, an occasional sports venue, and a monument preserving the memory of the great empire. Neglected and looted for centuries, it became a focal point for archaeologists and architects following the unification of Italy in the second half of the 19th century."

