###################
PB_social_development.20.t: "Poverty Level Decreased"
PB_social_development.20.d: "Living conditions improve as poverty rates decline, offering a brighter outlook for the population."
PB_social_development.20.a: "A welcome change."
PB_social_development.10.t: "Poverty Level Increased"
PB_social_development.10.d: "Economic hardship spreads, leaving many citizens struggling to meet basic needs."
PB_social_development.10.a: "A troubling sign."
PB_social_development.21.t: "Industrialization Level Improved"
PB_social_development.21.d: "Factories expand and production surges, signaling progress in industrial development."
PB_social_development.21.a: "Industry marches forward."
PB_social_development.11.t: "Industrialization Level Worsened"
PB_social_development.11.d: "Industrial activity falters, slowing the pace of modernization and growth."
PB_social_development.11.a: "A step backward."
PB_social_development.22.t: "Literacy Level Improved"
PB_social_development.22.d: "Education spreads through society, with more citizens gaining access to reading and learning."
PB_social_development.22.a: "Knowledge is power."
PB_social_development.12.t: "Literacy Level Worsened"
PB_social_development.12.d: "The spread of education slows, leaving parts of society in ignorance and disadvantage."
PB_social_development.12.a: "A worrying decline."
PB_social_development.23.t: "Economic Health Level Improved"
PB_social_development.23.d: "Markets stabilize and prosperity grows, strengthening the nation's economic foundation."
PB_social_development.23.a: "The economy thrives."
PB_social_development.13.t: "Economic Health Level Worsened"
PB_social_development.13.d: "The economy weakens, with instability threatening prosperity and growth."
PB_social_development.13.a: "Dark times loom."
PB_social_development.24.t: "Military Modernization Level Improved"
PB_social_development.24.d: "New tactics, weapons, and organization bring the military closer to modern standards."
PB_social_development.24.a: "Our forces advance."
PB_social_development.14.t: "Military Modernization Level Worsened"
PB_social_development.14.d: "Outdated doctrine and equipment hinder the effectiveness of the armed forces."
PB_social_development.14.a: "A dangerous weakness."
PB_social_development.25.t: "Civilization Status Elevated"
PB_social_development.25.d: "Recognition of cultural and societal progress elevates the nation's standing in the world."
PB_social_development.25.a: "A mark of progress."
PB_social_development.15.t: "Civilization Status Lowered"
PB_social_development.15.d: "Cultural stagnation and decline lower the nation's prestige and international image."
PB_social_development.15.a: "A blow to our stature."
