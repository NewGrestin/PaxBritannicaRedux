l_english:

##########################
# SOCIAL DEVELOPMENT LAWS
##########################

development: "Social Development"

poverty_rate: "Poverty Rate"
PB_socdev_minor_poverty: "Minor Poverty"
PB_socdev_minor_poverty_desc: "Poverty exists only in isolated pockets, with most citizens maintaining access to basic goods, employment, and public services."
PB_socdev_noticeable_poverty: "Noticeable Poverty"
PB_socdev_noticeable_poverty_desc: "Economic hardship affects a visible portion of society, creating local strain while remaining broadly manageable at the national level."
PB_socdev_widespread_poverty: "Widespread Poverty"
PB_socdev_widespread_poverty_desc: "A substantial share of the population struggles with income and access to essential goods, limiting economic growth and social stability."
PB_socdev_rampant_poverty: "Rampant Poverty"
PB_socdev_rampant_poverty_desc: "Poverty is deeply entrenched across society, weakening productivity, straining institutions, and increasing unrest."
PB_socdev_extreme_poverty: "Extreme Poverty"
PB_socdev_extreme_poverty_desc: "Severe deprivation defines daily life for the majority, critically undermining national development, cohesion, and state authority."

industrialization: "Industrialization"
PB_socdev_post_industrialized: "Post-Industrialized"
PB_socdev_post_industrialized_desc: "Advanced industry and services dominate the economy, characterized by high urbanization, technological sophistication, and diversified production."
PB_socdev_industrialized: "Industrialized"
PB_socdev_industrialized_desc: "Mechanized industry and large-scale production form the backbone of the economy, sustaining extensive urban employment and industrial capacity."
PB_socdev_semi_industrialized: "Semi-Industrialized"
PB_socdev_semi_industrialized_desc: "Industrial development is present but uneven, with modern sectors operating alongside significant rural and traditional economies."
PB_socdev_agrarianism: "Agrarianism"
PB_socdev_agrarianism_desc: "Agriculture constitutes the primary economic base, with limited industrial infrastructure and a largely rural population."
PB_socdev_subsistence_agrarianism: "Subsistence Agrarianism"
PB_socdev_subsistence_agrarianism_desc: "Small-scale subsistence farming dominates economic life, producing minimal surplus and supporting only rudimentary industrial capacity."

literacy: "Literacy"
PB_socdev_illiteracy_abolished: "Illiteracy Abolished"
PB_socdev_illiteracy_abolished_desc: "Universal literacy has been achieved, ensuring broad access to education, administration, and skilled employment across society."
PB_socdev_low_illiteracy: "Low Illiteracy"
PB_socdev_low_illiteracy_desc: "The vast majority of the population is literate, with only minor disparities in education access between regions or social classes."
PB_socdev_moderate_illiteracy: "Moderate Illiteracy"
PB_socdev_moderate_illiteracy_desc: "A significant portion of the population lacks formal education, limiting administrative efficiency and economic specialization."
PB_socdev_high_illiteracy: "High Illiteracy"
PB_socdev_high_illiteracy_desc: "Large segments of society remain unable to read or write, constraining industrial growth, governance, and social mobility."
PB_socdev_severe_illiteracy: "Severe Illiteracy"
PB_socdev_severe_illiteracy_desc: "Illiteracy is widespread and systemic, severely undermining national development, institutional capacity, and technological progress."

economic_health: "Economic Health"
PB_socdev_booming_economy: "Booming Economy"
PB_socdev_booming_economy_desc: "Rapid growth, rising investment, and strong consumer demand drive expanding production, employment, and state revenues."
PB_socdev_stable_economy: "Stable Economy"
PB_socdev_stable_economy_desc: "Economic activity remains steady and predictable, with balanced growth, manageable inflation, and consistent industrial output."
PB_socdev_stagnant_economy: "Stagnant Economy"
PB_socdev_stagnant_economy_desc: "Growth has slowed considerably, with limited investment and weak expansion constraining productivity and development."
PB_socdev_underperforming_economy: "Underperforming Economy"
PB_socdev_underperforming_economy_desc: "Persistent inefficiencies and weak demand suppress production and employment, reducing national competitiveness."
PB_socdev_collapsing_economy: "Collapsing Economy"
PB_socdev_collapsing_economy_desc: "Severe economic contraction disrupts industry, trade, and public finances, threatening social stability and state authority."

military_modernization: "Military Modernization"
PB_socdev_fully_modernized_military: "Fully Modernized Military"
PB_socdev_fully_modernized_military_desc: "Armies operate as a seamless combination of mechanized brigades, automat regiments, landships, and augmented troops, coordinated by sophisticated command networks and supported by dominant air and naval forces."
PB_socdev_semi_modernized_military: "Semi Modernized Military"
PB_socdev_semi_modernized_military_desc: "Units blend modern mechanized battalions with conventional infantry, supplemented by more advanced automats and structured air support, enabling flexible combined-arms operations across varied terrain."
PB_socdev_transitional_military: "Transitional Military"
PB_socdev_transitional_military_desc: "Traditional cavalry and infantry are gradually integrated with mechanized units and standardized automat detachments, while limited aviation provides reconnaissance and tactical support."
PB_socdev_great_war_military: "Great War Era Military"
PB_socdev_great_war_military_desc: "Armies mass infantry and artillery under industrial-era doctrines, deploying the first landships and experimental automats in specialized assaults, with early mechanized detachments supporting static and mobile operations."
PB_socdev_pre_great_war_military: "Pre Great War Military"
PB_socdev_pre_great_war_military_desc: "Forces rely on disciplined cavalry, line infantry, and standard artillery, organized around mid-Victorian doctrines, with no mechanization or aviation, emphasizing traditional formations and massed firepower."

westernization_level: "Westernization Level"
PB_socdev_fully_westernized_nation: "Fully Westernized Nation"
PB_socdev_fully_westernized_nation_desc: "All institutions, governance, and social structures conform to Western models, with codified laws, professional administration, and widespread formal organization."
PB_socdev_predominantly_westernized_nation: "Predominantly Westernized Nation"
PB_socdev_predominantly_westernized_nation_desc: "Western systems dominate most sectors of governance and society, with only minor traditional practices persisting in isolated areas."
PB_socdev_moderately_westernized_nation: "Moderately Westernized Nation"
PB_socdev_moderately_westernized_nation_desc: "Western and traditional practices coexist roughly equally, with many institutions showing modern organization while others remain customary."
PB_socdev_partially_westernized_nation: "Partially Westernized Nation"
PB_socdev_partially_westernized_nation_desc: "Early adoption of Western governance and social structures is evident in select sectors, but traditional systems still shape the majority of society."
PB_socdev_traditional_nation: "Traditional Nation"
PB_socdev_traditional_nation_desc: "Society retains little to no Western influence, with governance, social organization, and cultural practices following longstanding indigenous traditions."
