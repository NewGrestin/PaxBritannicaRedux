  PB_HUN_Great_Balkan_War:0 "The Great Balkan War"
  PB_HUN_Great_Balkan_War_desc:0 "Once again, the Balkans have been torn apart under the shadow of general war. This conflict will be the final one to decide, once and for all, who shall dominate the region. All those involved will mobilize en masse to achieve victory in this total war.\n\n§YFor the Anti-Hungarian Pact to achieve victory, they must capture Budapest.\n\nFor the Budapest Entente to achieve victory, they must capture Bucharest and Belgrade.§!"
  PB_HUN_Great_Balkan_War_Disarmament:0 "The Treaty of Belgrade"

  PBNews.385.t: "PARTITION OF ALBANIA"

  balkwar_news_events.1.t:0 "THE LITTLE COALITION"
  balkwar_news_events.1.d:0 ""
  balkwar_news_events.1.a:0 "those who had nothing united in common envy, and those who had anything united in common terror."
  balkwar_news_events.1.b:0 "Thought precedes the deed as lightning precedes thunder."
  balkwar_news_events.1.c:0 "The allied kings threaten us; we hurl at their feet, as a gage of battle, the head of a king!"

  balkwar_news_events.2.t:0 "DANUBE SPILLS RED"
  balkwar_news_events.2.d:0 ""
  balkwar_news_events.2.a:0 "Do you not feel that a wind of revolution is in the air?"
  balkwar_news_events.2.b:0 "I carry in my heart the mourning of the monarchy, whose remains will now be the prey of the factious."

  balkwar_news_events.3.t:0 "LITTLE COALITION VICTORIOUS"
  balkwar_news_events.3.d:0 ""
  balkwar_news_events.3.a:0 ""
  balkwar_news_events.3.b:0 ""

  balkwar_news_events.4.t:0 "NEW REVOLUTIONARY CURRENTS"
  balkwar_news_events.4.d:0 ""
  balkwar_news_events.4.a:0 "The old Europe is at its end."