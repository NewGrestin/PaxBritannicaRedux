  PB_WMD_Decisions: "Special Weapons Division"
  PB_WMD_Decisions_desc: "\n\n\n\n\n\nThe Great War introduced the world to many new and destructive weapons, most notably chemical weaponry. In the time since, there have been significant advancements in the development of various weapons of mass destruction. Researching and developing these weapons could give us a significant edge in future conflicts, although the ethical ramifications of developing such implements are questionable at best."
  PB_Launch_Chemical_Attack: "§YDeploy Chemical Weapons§!"
  PB_Acquire_Chemical_Agents: "Develop Noxious Chemical Agents"
  PB_Acquire_Chemical_AgentsII: "Develop Choking Agents"
  PB_Acquire_Chemical_AgentsII_desc: "Chemicals like Phosgene and Chlorine are vital in the development of compounds intended to restrict breathing and induce pulmonary edema"
  PB_Acquire_Chemical_AgentsIII: "Develop Nerve Agents"
  PB_Acquire_Chemical_AgentsIII_desc: "Sarin, Tabun and Methylphosphonothioic Acid are components of Nerve Agents, which even in small doses can induce extreme respiratory distress. Higher exposure can result in confusion, brain damage and death."

