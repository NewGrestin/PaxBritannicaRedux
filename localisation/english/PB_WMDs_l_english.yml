  chemweapons_paranoia_bomb: "Paranoia Bomb"
  chemweapons_paranoia_bomb_desc: "An advancement on typical nonlethal chemical agents, a Paranoia Bomb is a tasteless, colorless gas that induces intense feelings of paranoia in affected individuals. Effectively creating a form of Substance-Induced Psychosis, the mixture easily causes disruptions in military operations by effectively turning personnel against one another. The Induced Psychosis, in turn, can cause individuals to resort to incredible violence against one another. The lack of discretion caused by the compound can lead to rioting, inter-family violence, and in extreme cases even cannibalism and autocannibalism."

