l_english:
 return_cores_to_ally: "Return [From.GetAdjective] Lands"
 return_cores_to_ally_desc: "The [Root.GetAdjective] government has been discussing what to do with the [From.GetAdjective] lands we currently occupy - land which we have no rightful claim to. Should we return the land to our [From.GetAdjective] allies?"
 return_cores_to_subject: "Return [From.GetAdjective] Lands"
 return_cores_to_subject_desc: "The [Root.GetAdjective] government has been discussing what to do with the [From.GetAdjective] lands we currently occupy - land which we have no rightful claim to. Should we return the land to our subjects in [From.GetNameDef]?"

 PB_DA_generic.4.t: "The [From.From.GetAdjective] Lands"
 PB_DA_generic.4.d: "The [Root.GetAdjective] government has been discussing what to do with the [return_to.GetAdjective] lands we currently occupy - land to which we have no rightful claim. Should we return this land to them?"
 PB_DA_generic.4.a: "Yes, return all land to them"
 KR_will_return_all: "All coastal or contiguous owned states which are [return_to.GetAdjective] cores or claims will be returned to §Y[return_to.GetNameDef]§!.\n\nNote this will §Rnot§! include states that are [Root.GetAdjective] §Yclaimed§! or §Ycore§! states."
 PB_DA_generic.4.b: "Yes, return land to them... but keep the most vital states"
 KR_will_return_rest: "All coastal or contiguous owned states which are [return_to.GetAdjective] cores or claims will be returned to §Y[return_to.GetNameDef]§!.\n\nNote this will §Rnot§! include states that are [Root.GetAdjective] §Yclaimed§! or §Ycore§! states, nor will it include §Yvital§! states such as canals."
 PB_DA_generic.4.c: "Return their core lands only"
 KR_will_return_cores: "All coastal or contiguous owned states which are [return_to.GetAdjective] cores will be returned to §Y[return_to.GetNameDef]§!.\n\nNote this will §Rnot§! include [Root.GetAdjective] §Yclaimed§! or §Ycore§! states, nor §Yvital§! states such as canals. Any [return_to.GetAdjective] §Yclaims§! will also be retained."
 PB_DA_generic.4.e: "We will keep it all!"
 KR_will_not_return: "We will §Rnot§! return any of their lands, nor will we be asked to do so again."

 PB_DA_generic.5.t: "[From.GetNameDefCap] Returns [Root.GetAdjective] Land"
 PB_DA_generic.5.d: "Our allies in [From.GetNameDefCap] have returned some of our proper lands to us!"
 PB_DA_generic.5.a: "Great!"

 PB_DA_generic.1.t: "An Alliance with [FROM.GetNonIdeologyNameDef]?"
 PB_DA_generic.1.d: "International relations are often fluid, with agreements and alignments quickly shifting from generation to generation. Sometimes even within a generation, pacts are signed and then discarded as interests change. The instability fostered after Black Monday and other political developments around the world has heightened fears in many weaker nations that the great powers coming to blows will catch them in the crossfire.\n\nWhile some turn to isolation either because of their own domestic turmoil or in hopes that neutrality will make them not worth the time for various powers to prey upon them, [FROM.GetNameDefCap] has taken the opposite approach. With any internal issues now resolved, the people in [FROM.GetNameDefCap] are now looking outwards hoping to find protection alliances provide. We, perhaps due to superior geographic conditions, military power or ideological consistency are [ROOT.GetFactionName]'s choice of ally.\n\nThe question now remains, do we accept them? Another ally in our pact does mean further resources contributed to our combined forces, though any additional dangers they add for our faction is danger that will be taken into common. Any competing claims need to be taken into consideration, and any discord they may cause between faction members. What should be our decision?"
 PB_DA_generic.1.a: "Stronger together!"
 PB_DA_generic.1.c: "On second thought, no..."

 PB_DA_generic.2.t: "[FROM.GetNonIdeologyNameDefCap] Has Accepted!"
 PB_DA_generic.2.d: "Having heard our request to enter their alliance, [FROM.GetNameDef] has accepted our application and we are now set to become a member of [FROM.GetFactionName]. This will hopefully increase our safety in these troubling times, as we strive to ensure our people's safety from outside powers and foreign meddling.\n\nThat is not to say however this agreement comes for free. We have certain expectations now placed upon us to contribute to the common defence of the nations of [FROM.GetFactionName] and will likely be drawn into conflicts involving this pact. This includes the possibility of being brought into wars initiated by members of this pact.\n\nWe go now into the future together, our fates now intertwined both by words and by force of arms. With any luck, we will gain far more out of this agreement that we have lost in autonomy."
 PB_DA_generic.2.a: "Excellent!"

 PB_DA_generic.2.t: "[FROM.GetNonIdeologyNameDefCap] Has Refused!"
 PB_DA_generic.2.d: "Despite our convincing appeals that we could be an effective contributor and member of their alliance, to our chagrin [FROM.GetNameDef] has refused our request to join the [FROM.GetFactionName]. In some ways, this can be expected: alliances are often delicate and fraught with dangers, and some caution is to be expected when making them. Still, this rejection leaves us in a sore spot. Either they have no intentions of defending us or more cynically they see us as a future target on the battlefield.\n\nWe must hurry then to find a working means of national security. Whether this means finding another alliance to shield us from invasion, appealing to multiple factions as a benevolent neutral mediator or whether it means turning inwards to an armed defence, we need to ensure our people's security. The [FROM.GetFactionName] may or may not regret rejecting us, but it is essential that we do not regret this outcome."
 PB_DA_generic.2.a: "Their loss."

 China_invade_west: "Invade the [FROM.GetName]"
