########################
### MEGACORPORATIONS ###
########################

## -------- Names and Descriptions -------- ##
 megacorp_edison_imperial_electric_company: "Edison Imperial Electric Company"
 megacorp_edison_imperial_electric_company_desc: "§CEdison Imperial Electric Company§! was founded in 1880 as Edison Industries in London, as part of an electrification incentivization program. While initially only concerned with electrification, Edison grew throughout the Second Renaissance to control vast portions of the British Empire's wireless infrastructure.\n\nOver time, the company diversified into various other fields, establishing the Edison Armworks and Edison Medical subsidiaries in the early 1900s. As of 1933, the EIEC is the largest corporate entity on the planet, rivaled only by Tesla Electriworks. It commands whole industries, ranging from mining and manufacturing to medicine and munitions.\n\nAt one time, Edison Electric was simply the power company, but today that term takes on an §Rentirely new meaning§!."
 megacorp_tesla_electricworks: "Tesla Electricworks"
 megacorp_tesla_electricworks_desc: "§GTesla Electricworks§! was founded in 1897 in Moscow by Nikola Tesla, with subsidies from the government of the Russian Empire. The answer to the Anglo-American Edison Corporation, Tesla Electricworks served as Russia's primary infrastructure and armaments developer throughout the Second Renaissance. Most notably, Tesla Electricworks would pioneer the concept of Teleforce and Arc Thrower weaponry, the latter of which would be a critical part of Russia's Great War military doctrine.\n\nAfter Nikola Tesla's disappearence from public life, de-facto control of the company was handed to the Board of Directors in 1925. While Tesla maintains significant shares in Electricworks, he has been unwilling to interact with the company outside the occasional telegram or carrier pigeon.\n\nAs of 1933, Tesla Electricworks has expanded to be the leading infrastructure and armaments company of the Russian sphere, as well as limited investments in the Balkans and the Middle East."
 megacorp_imperial_fruit: "Anglo-American Imperial Fruit Company"
 megacorp_imperial_fruit_desc: "The §OAnglo-American Imperial Fruit Company§! was established in 1851 via the consolidation of various fruit and agricultural concerns in the British Empire. One of the first Imperial Corporations, IFC is the world's largest producer and distributor of fruit, vegetable and organic substitute products.\n\nThe IFC holds a near undisputed monopoly over Cental America, where its' influence is acutely felt by any government that rocks the boat a bit too much. Since 1860, the IFC has additionally gone on to establish ventures in La Plata's States, granting it a foothold in the region despite New Spain and Brazil both opposing such incursion."
 megacorp_standard_oil: "Union Standard Oil Company"
 megacorp_standard_oil_desc: "The §rUnion Standard Oil Company§! was founded in 1870 by John D. Rockefeller in the province of Ohio, in the United Commonwealth. A precursor to Edison Electric, Standard Oil was the model upon which many future Megacorporations would follow. Unlike many companies of the time, Standard Oil controlled the entire logistics line of their products, cutting out excess costs by managing every stage of their interests.\n\nWhile not nearly as influential in the United Commonwealth as the EIEC, Standard Oil maintains a symbiotic relationship with Edison by virtue of their dominance in Oil extraction. Oil and oil products continue to be the dominant means of energy production in the first world, and thus the EIEC and Standard Oil remain begrudging partners."
 megacorp_carnegie_steel_company: "Carnegie Steel Company"
 megacorp_carnegie_steel_company_desc: "The §BCarnegie Steel Company§! was established in 1892 by Andrew Carnegie, and quickly grew to become a major corporate entity during the Second Renaissance. The company would be most notable for their lifted steel processes, which would revolutionize construction and manufacturing, paving the way for the modern megaplexes of the first world.\n\nCarnegie Steel would also play a pivotal role in the Green Sahara Project, of which Andrew Carnegie was a significant donor. Carnegie Steel would be the skeleton upon which New Alexandria was built, and Carnegie himself would supposedly lobby to have the new Commonwealth named after himself, although his estate claims that Carnegie originally refused the title.\n\nCarnegie Steel would find a new home in the developing world and now resides primarily in Carnegia, where lifted steel is now used to bring the dark continent into the modern industrial future."
 megacorp_zaibatsu_exiles: "Exiled Zaibatsus"
 megacorp_zaibatsu_exiles_desc: "Prior to the Japanese Revolution, §YZaibatsu§! was a term used to refer to industrial and financial conglomerates in Imperial Japan. The largest of these groups were Sumitomo, Mitsui, Mitsubishi and Yasuda, some of which could trace their lineage back to the Japanese Edo period.\n\nAs the Japanese Empire went up in flames, many of these conglomerates chose to flee into exile wherever they could. Most would simply migrate to the Korean Empire, where they quickly found a financial base among wealthy Japanese emigres. Korea's infrastructure was demolished by the Great War, and thus began the so-called Second Colonization, as Korea found itself divided by Russian and Japanese interests once more.\n\nZaibatsu continue to be a prevalent economic force in the Pacific, with influence reaching as far as the American West Coast and Hawaii. While they remain one of the lesser Megacorporate forces, they still hold enough influence to justifiably be labeled as such."
 megacorp_debeers: "Beit Diamond Mining and Extraction Corporation"
 megacorp_debeers_desc: "§YBeit Diamond Mining and Extraction Corporation§! was established in 1887 by Alfred Beit, a German gold and diamond magnate from Hamburg. The company would primarily be focused on the South African Diamond Belt, encompassing the Cape Colony republics of Goshen and the Orange Free State. Secondary concerns would be established in German Central Africa and Portuguese Africa, prior to the latter becoming the home of the Portuguese monarchy.\n\nThe Beit Corporation would become the primary rival of the IACA, as both battled for control of Africa's many resources. In many cases, these battles would be quite literal, as both sides maintain large mercenary forces drawn from across the globe. Beit's principle concerns lie in Southern Africa, where it uses a combination of corporate power, slave labor and forced augmentation to squeeze diamonds from Africa, ethical quandaries be damned."
 megacorp_big_three: "Big Three Combine"
 megacorp_big_three_desc: "The §YBig Three Combine§! is a term used in reference to the combined monopolies of the British Coal and Steel Company, the British Tea and Coffee Manufacturing Concern and the Asian Opium industries. These companies predominantly control Britain's Indian colonies and protectorates, with interests in Insulindia and China.\n\nBritish Coal and Steel functions as the primary resource extraction corporation of these regions, while British Tea and Coffee serves as the primary cash crop producer. These companies primarily rely on lax colonial labor laws, allowing them to effectively enforce indentured servitude on their employees. Augmentation legislation is similarly lax, in extreme cases allowing the companies to mandate workers be given life altering augmentations to improve their output.\n\nLess official are the Opium industries, which while technically illegal in many nations are nonetheless a major arm of British power in Asia. Opium is heavily traded in the Golden Triangle, the region shared between Siam, Indochina and Burma. This area allows for transport into China, which continues to be one of the world's largest opium importers."
 megacorp_africa_association: "International Association for the Civilization of Africa"
 megacorp_africa_association_desc: "The §RInternational Association for the Civilization of Africa§! was formed in 1885 as, officially, a private charity venture to promote literacy and European culture in Africa. The IACA spreads Christianity through missionaries, builds infrastructure, and helps to bring the African peoples the best that Europe can offer.\n\nThis is, of course, a lie.\n\nIn truth, the IACA is the largest corporate entity on the African continent, lead by a board of directors based out of Europe. Using their economic power and European backing, the IACA has managed to establish an empire of their own in Africa. Smuggling, blood diamonds, war profiteering, prostitution, and ivory trading are the least of the IACA's crimes. While Europe falls back into armed military camps, the Association is content to act with near legal impunity in a blind spot of the world, bringing unimaginable suffering in the process.\n\nEven among typically amoral megacorporations, the Association remains one of the most reviled open secrets of the global economic system."
 megacorp_reichswerke: "Reichswerke-Hugenberg"
 megacorp_reichswerke_desc: "The §gReichswerke Hugenberg§!, also known as Hugenberg-Konzern, was established in 1920 by the steel baron and media mogul Alfred Hugenberg. Grouping metallurgical companies, colonial ventures and media conglomerates together, the Reichswerke operates in all German possessions, including African outposts and even within the neighboring Wallonia and Switzerland.\n\nPosessing a vast array of newspapers, radios and even one of the three German telescreen channel, the company exercise considerable influence over the United Kingdoms' political life. As Hugenberg himself is known to be a staunch reactionary, the Reichswerke's media apparatus have come to embrace his views in full — its many newspapers constantly criticizing the reformist government through a combination of fake news, sensationalism and aggressive rhetoric openly praising antisemitism and ultra-nationalism.\n\nAlthough abundantly criticized as such, the Reichswerke has been able to fend off any serious penalties thanks to the lax federal legislation — and will continue doing so until serious measures are taken to oppose Hugenberg's ideological crusade."
 megacorp_ford: "Ford Motor Company"
 megacorp_ford_desc: "The §gFord Motor Company§!, founded in 1903 by Alexander Malcomson and Henry Ford, has long been one of the most influential and innovative corparations in the face of the planet. From humble origins as one of many early automotive manufacturers throughout the united Commonwealth, Ford would dramatically grow following the release of the Model T in 1908, inmediately becoming extremely successful and the sheer demand would necessitate for another innovation, the assembly line.\n\nThis meteoric rise from a small manufacturer to the western world's premier automobile brand in a few decades has not been without impact, as cars which were once a luxury afforded only by the eccentric and wealthy suddendly became the favorite of the middle class, as millions of Ford cars flood the streets, fields, and farms of the world, but Ford's ambition doesn't end there.\n\nFollowing the Great War, Henry Ford acquired the Guyanas to ensure a steady supply of rubber for tires for the corporation, effectively granting him his own corporate dominion. Here, he would found a city among the jungle, Fordlandia, to become the new capital of Ford's automobile empire."
 megacorp_affarsimperiumen: "Affärsimperiumen"
 megacorp_affarsimperiumen_desc: "While not a singular corporate entity, the §BAffärsimperiumen§!, or the Augmentation Cartels, are a group of seven massive Swedish corporations: Bollider AB, Epiroc, Bofors, Uddelholms AB, LKAB and Kreuger and Toll\n\nThese are often grouped together due to their similar policies and focus on augmentations, as well as holding large influence over the Swedish economy as a whole. Though their goals sometimes clash, their overall policies and goals are more often than not, the same, and so this informal alliance to maximize their joint influence was born."
 megacorp_voc: "Vereenigde Oostindische Company"
 megacorp_voc_desc: "The §OVereenigde Oostindische Company§!, also known as the VOC, or the United East India Company is, to some, the first example of a true megacorporation. Established in 1602 and granted a monopoly on Asian trade by the Dutch government, the VOC rapidly grew and began taking on governmental duties, such as war and colonization of faraway lands.\n\nThough the company slowly stagnated throughout the 18th century, several reforms to it's internal policy allowed for its continued existence, until a drastic change breathed new life into the company.\nThe VOC began diversifying, focusing more on global shipping and retailing, which would turn out to be a great move as profits soared and their influence grew.\nNow, there's a higher chance anthing that travelled on sea did so through the VOC, their flag can be seen in ports from Quebec to Shanghai, and their great warehouses became standard on every major city, but this is all built on a house of cards.\n\nThe company is bankrolled mostly by the Dutch mainland, chasing the dream of the potential of a fully productive Indonesia, leading to their greatest megaproject, the Krakatoa Geothermal Plant. But man's greatest folly was thinking it could control the planet it inhabits, and as the Krakatoa erupted and took the Dutch East Indies with it, the future of not only the VOC but the Dutch economy as a whole hangs by a thread."
 megacorp_zitronella: "Zitronella"
 megacorp_zitronella_desc: "§RZitronella§! is as ambiguous as the flavor of its tonic. Formed sometime between the beginning of the universe and yesterday—we honestly don’t know. The corporation took its current shape in 1870 as the Zitronella United Sugar Refineries, Mining and Commercial Works Joint-Stock Company.\n\nIts first notable appearance came in 1914, when it began producing carbonated drinks and colas, already mired in scandals over repeated health code violations. In truth, Zitronella is a pharmaceutical conglomerate. It operates numerous underground facilities around the world, with its only known site in the Philippines.\n\nIt has been involved in several biogenetic initiatives, pioneering early stem cell research later linked to the Tuskegee Experiments, alongside many unnamed breakthroughs, accolades, and condemnations.\n\nThe company is the foremost interest group in the Philippine conflict, having lobbied for direct German intervention and allegedly threatened anti-war ministers. Though rarely listed among the world's great megacorporations, its presence is felt—and will continue to be felt—for years to come."
 megacorp_quadcom: "Quadrilateral Commission"
 megacorp_quadcom_desc: "The now known as §CQuadrilateral Commission§!, originally known as the Chinese Reconstruction Management Council was formed during the First Peking Conference in 1870, though it was renamed and reorganized after the Great War led to the expulsion of several members, though its goal has remained the same throughout the years: Ensuring European influence in China and unity between the European Concessions.\n\nThe influence of the so-called QuadCom is clear throughout China, as its logos, bureaucrats and mercenaries can be seen in almost every production activity in the nation, from a factory to a rice field and a a tea plantation.\n\nHowever, the Commission isn’t all powerful. Following the fall of the Qing and the failed Southern Expedition, the QuadCom’s influence has declined, reduced to the Heavenly Empire in the South, as well as the port cities, like Shanghai and Tsingtao, where it holds near total control over."
 megacorp_cartel: "Haciendas Cártel"
 megacorp_cartel_desc: "The §rHacienda Cártels§! of Spanish America have long been hugely economically important, and while they’re not a singular corporate entity, but rather an entire semi-standardized system.\nDeveloped during the Reconquista, Haciendas truly became what they were in the 16th and 17th centuries in the new World, as large land grants were granted for development, growing sugar, cocoa, and many more profitable crops for centuries.\n\nAs the Fernandists relocated to the Americas, there were several changes to the system, such as a greater number of indigenous hacendados throughout the continent, the overall structure barely changed. The system of fuero, where hacendados and other wealthy and powerful men are legally not punishable by law, ensures their abuses of power go unchecked, letting their already massive wealths continue to grow at the backs of their workers with no end in sight."
 megacorp_lacerda: "Companhia Lacerda"
 megacorp_lacerda_desc: "Established in 1873, §GCompanhia Lacerda§! soon became one of the world’s largest agricorps in a few decades, dominating the Brazilian economy and reporting worldwide.\nIt is a surprisingly decentralized business, with local landowners having some autonomy regarding exactly what and how to cultivate, as long as profits and quotas keep up, Lacerda is more than willing to allow freedom to its subsidiaries.\n\nFocused primarily on crops such as coffee, cocoa and sugar, though with arms extended into other forms of agriculture and ranching, Lacerda’s influence is keenly felt by every Brazilian, from the workers toiling to keep up profit margins to the wealthy bureaucrats who rely on the company to ensure the nation’s finances, and most of all, the local politicians of the regions the company is most powerful in. Lacerda is known for backing small time politicians to ensure their interests in a region are safe, from funding their campaigns to assassinating rivals, the company's interests must always prevail."
 megacorp_orlen: "CKN Orlen"
 megacorp_orlen_desc: "§RCesarski Koncern Naftowy Orlen S.A.§! was established in recent years on the foundations of two enterprises founded in the latter half of the nineteenth century — MacGarvey Oil and Łukasiewicz Chemicals. Although both companies were pioneers in oil extraction in the Caucasus — with Łukasiewicz’s firm in particular making a decisive contribution to the development of extraction technologies — both suffered significant decline as a result of the Great War.\n\nThrough substantial financial support from the government of the Polish Autonomy, an aggressive policy of acquiring Caucasian oil fields, and prudent corporate governance, the company was able to defeat the historic leaders of the industry, called the Great Three. Now, it is the undisputed leader in the region, controlling over 50% of the Empire’s oil production. Command over fuel is, in practice, command over every sector of the Russian economy — a power which the company’s board is keen to wield."
 megacorp_skn: "Oil Extractors Congress Council"
 megacorp_skn_desc: " "

 megacorp_no_megacorp: "§gNo megacorp§!"
 megacorp_no_megacorp_desc: "There's no particular megacorp currently dominating this country's economy."

