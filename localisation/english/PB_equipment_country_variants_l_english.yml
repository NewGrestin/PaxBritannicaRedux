 techno_janissary_equipment_0: "Janissary Engine-Assisted Armor"
 techno_janissary_equipment_0_short: "Janissary E.A.A"
 techno_janissary_equipment_0_desc: "Similar to a conventional Hardsuit in terms of general design, the Engine-Assisted Armor prioritize the use of heavy pistons and mechanical components when it comes to physical enhancement — with little electronics onboard as a result. \n\nWhile bulkier and more primitive than its European counterpart, such armor effectively provides a non-negligeable firepower thanks to its embarked flamethrowers and mounted machinegun."