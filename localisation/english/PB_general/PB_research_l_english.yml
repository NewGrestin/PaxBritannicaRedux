 sp_armored_advanced_flamethrower_tech: "Advanced Flamethrower"
 sp_armored_advanced_flamethrower_tech_desc: "$advanced_flamethrower_desc$"
 sp_armored_lc_high_impact_obliterator_cannon_tech: "High-Impact Obliterator Cannon"
 sp_armored_lc_high_impact_obliterator_cannon_tech_desc: "$lc_high_impact_obliterator_cannon_desc$"
 sp_armored_lc_naval_engine_conversion_tech: "Naval Engine Conversion"
 sp_armored_lc_naval_engine_conversion_tech_desc: "Utilizing naval engineering techniques such as reinforced crankshafts, high-torque transmissions and specialized cooling systems can enhance the power output and durability of Land Cruiser engines, allowing them to better manage the immense weight and stress."
 sp_armored_lc_transmission_improvements_tech: "Transmission Improvements"
 sp_armored_lc_transmission_improvements_tech_desc: "Refined gear ratios, clutch mechanisms and torque converters to create more efficient transmissions capable of handling the extreme power and weight of Land Cruisers, improving overall mobility and reducing mechanical strain."
 sp_armored_lc_specialized_field_manuals_tech: "Specialized Field Manuals"
 sp_armored_lc_specialized_field_manuals_tech_desc: "Developing detailed training manuals tailored for Land Cruiser crews, covering unique operational procedures, maintenance protocols, and complex battlefield tactics required to effectively command these giant war machines."
 sp_armored_lc_weapon_fire_control_tech: "Weapon Fire Control"
 sp_armored_lc_weapon_fire_control_tech_desc: "Implementing advanced targeting optics, rangefinders, and gyroscopic stabilizers to enhance weapon accuracy and firing coordination, ensuring the guns can effectively engage targets despite their massive recoil and slow maneuverability."

 armor_tech_1: "Basic Armor Protection"
 armor_tech_1_desc: "Landships and automts during the Great War only had to contend with enemy small arms. As such, they got away with fairly thin armor. A new generation of anti-armor weaponry has made the battlefield a much more dangerous place for any armored unit, and much heavier protection is needed."
 armor_tech_2: "Improved Armor Protection"
 armor_tech_2_desc: "With heavier and heavier anti-armor weapons being fielded around the world, the next generation of armored units will require even better protection."
 armor_tech_3: "Advanced Armor Protection"
 armor_tech_3_desc: "While the limit of deployed anti-armor guns has likely been reached, a new generation of armored units will carry more advanced weaponry, which is able to pierce any current level of protection at long range."
 armor_tech_4: "Modern Armor Protection"
 armor_tech_4_desc: "During the war, the threats faced by armored units have multiplied, from enemies, anti-armor guns, dedicated armor destroyers, all the way to modern infantry weapons firing shaped charges that can penetrate even heavy armor. We must develop new protection methods to keep our own armored units alive in the face of these threats."
 engine_tech_1: "Basic Engine"
 engine_tech_1_desc: "Where the landships of the Great War were slow, lumbering beasts, the modern armored units rely very much on speed and mobility to achieve victory."
 engine_tech_2: "Improved Engine"
 engine_tech_2_desc: "With bigger guns and heavier armor, the new generation of armored units requires a more powerful engine to remain mobile."
 engine_tech_3: "Advanced Engine"
 engine_tech_3_desc: "Mechanized warfare is a form of combat that requires fast decision making and fast movement of troops and supplies. If our armored units are to carry modern weapons and enough armor to survive on the battlefield, they require powerful engines to keep up with the motorized infantry."
 engine_tech_4: "Modern Engine"
 engine_tech_4_desc: "The numerous new additions to armored units made necessary by modern warfare have increased the weight of the vehicle substantially. To move all that mass around, we require engines that have a lot of power behind them."

