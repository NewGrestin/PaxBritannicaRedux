 ## ARTILLERY ##
 # ARTILLERY #
 interwar_artillery: "Inter-War Artillery"
 interwar_artillery_desc: "Lessons learned in the development of different types of artillery can be cross-applied to the design of other pieces."
 artillery1: "Artillery I"
 artillery1_desc: "With more modern materials and mechanisms, howitzers and field guns from the Great War can be rechambered and modernized for modern warfare."
 artillery2: "Improved Artillery Upgrade I"
 artillery2_desc: "Upgrading old pieces can only get us so far. New howitzer designs will be needed, taking advantage of new hydraulic recoil devices and longer barrels."
 artillery3: "Improved Artillery Upgrade II"
 artillery3_desc: "To enable heavier guns on lighter carriages, muzzle brakes can be included in howitzer designs."
 artillery4: "Artillery IV"
 artillery4_desc: "Developing light-weight artillery capable of being broken down for transport will make it possible to bring artillery support to areas previously difficult to reach."
 artillery5: "Advanced Artillery Upgrade"
 artillery5_desc: "Artillery designs with lower silhouettes will be more difficult for the enemy to target."
 artillery6: "Advanced Proximity Fuze"
 artillery6_desc: "The Advanced Proximity Fuze is a fuze that detonates an explosive devices automatically when the distance to the target becomes smaller then a predetermined value. It works for all kind of artillery or anti air shells and can be made used with rockets. Recent observations have shown that the lethality with this fuze increase by 5 to 10 times compared to the common contact fuze."
 sp_artillery_rocket_assisted_projectiles_tech: "Rocket-Assisted Projectiles"
 sp_artillery_rocket_assisted_projectiles_tech_desc: "Enhanced projectiles for super-heavy howitzers, designed to extend range and improve impact through rocket propulsion."
 sp_artillery_purpose_built_gun_motor_carriages_tech: "Purpose-Built Gun Motor Carriages"
 sp_artillery_purpose_built_gun_motor_carriages_tech_desc: "Specialized vehicles designed to transport and support super-heavy howitzers, ensuring mobility and easiness of battlefield deployment."

 # ANTI-AIR #
 antiair1: "Anti-Air Upgrade"
 antiair1_desc: "With faster reloading mechanisms, anti-air guns carrying large rounds can still maintain necessary firing rates."
 antiair2: "Anti-Air II"
 antiair2_desc: "To target high-flying aircraft, longer cartridges and barrels will be needed on anti-air guns."
 antiair3: "Improved Anti-Air Upgrade I"
 antiair3_desc: "As radar systems improve, employing radar direction of anti-aircraft guns becomes more viable. Keeping up with this technology will allow us to make some of the most accurate anti-air systems available."
 antiair4: "Improved Anti-Air Upgrade II"
 antiair4_desc: "Combining modern systems of radar, computerization and autoloaders will be necessary to react quickly against faster aircraft."
 antiair5: "Anti-Air V"
 antiair5_desc: "Surface-to-air missiles are the future of anti-aircraft warfare. Developing a mobile platform for these should be our next goal."
 sp_shock_hardening_techniques: "Shock-Hardening Techniques"
 sp_shock_hardening_techniques_desc: "By using various Shock-Hardening Techniques, and utilizing stress equalizers for our components, we lowered the rate of premature detonations, making our projectiles more reliable and effective"
 sp_variable_time_fuze_shells: "Variable Time Fuze Shells"
 sp_variable_time_fuze_shells_desc: "With adapting Variable Time Fuze Shells - we have made our field artillery devastating against our opponents. Shells explode before reaching the ground, thus creating much bigger kill-zone."

 # ANTI-ARMOR #
 interwar_antitank: "Anti-Armor"
 antitank1: "Anti-Armor Upgrade"
 antitank1_desc: "The importance of effective anti-armor weapons was established in the Great War. Introducing a new generation of these weapons will be necessary to combat modern landships and automats designs."
 antitank2: "Anti-Armor II"
 antitank2_desc: "Most anti-armor guns are so far fairly light. Larger caliber guns will be required to combat heavier landships and automats with sloped armor."
 antitank3: "Improved Anti-Armor Upgrade I"
 antitank3_desc: "HEAA (high-explosive anti-armor) rounds can be used in anti-armor artillery to make up for limited muzzle velocity."
 antitank4: "Improved Anti-Armor Upgrade II"
 antitank4_desc: "New versatile anti-armor guns employing armor-piercing discarding sabot shots can penetrate the armor of nearly any armored unit."
 antitank5: "Anti-Armor V"
 antitank5_desc: "By combining different kinds of new ammunition technology with guns with higher muzzle velocities, we can be prepared for whatever new armor our enemies may develop."
 sp_advance_sabot_shells: "Advanced Sabot Rounds" 
 sp_advance_sabot_shells_desc: "The additional resources granted toward armor penetrating ammunition research has given us insight in how to improve Sabot stabilization in a multitude of use cases."

 # ROCKET ARTILLERY #
 rocket_artillery2: "Rocket Artillery Upgrade I"
 rocket_artillery2_desc: "Self-propelled artillery utilizing multiple rockets will be able to cause large-scale destruction rapidly, while maintaining mobility to avoid counter-fire."
 rocket_artillery3: "Rocket Artillery Upgrade II"
 rocket_artillery3_desc: "Sacrificing range for impact, we can mount heavier rockets on larger vehicles. Operating in teams, these artillery batteries can cooperate to reload and relocate quickly."
 rocket_artillery4: "Rocket Artillery III"
 rocket_artillery4_desc: "Spin-stabilized rockets can increase the range of lighter artillery batteries."

 # NUCLEAR ARTILLERY #
 nuclear_artillery_upgrade_1: "Micro-Nuke Launchers"
 nuclear_artillery_upgrade_1_desc: "Military and nuclear theorists believe that with a more compact unstable isotope artillery guns would theoratically be able to launch these so called \"Micro-Nukes\" from a safe distance whilst still delivering a deadly payload. If we were to fully harness the atom then god knows what these Micro-Nukes will be capable of."
 nuclear_artillery_upgrade_2: "Dedicated Scouting Tactics"
 nuclear_artillery_upgrade_2_desc: "By having a team of reconnaissance experts dedicated purely to finding acceptable shelling areas for our Micro-Nuke launchers we could expect greater planning and deployment speeds of this devestating weapons."
 nuclear_artillery_upgrade_3: "M.A.D Launchers"
 nuclear_artillery_upgrade_3_desc: "Does God have mercy on those that use weapons confined only to the Heavens? Doesn't matter though, we are already going to hell for dreaming up such destructive technologies, might as well use them."

