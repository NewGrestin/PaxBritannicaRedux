 sp_armored_mpd_naval_engine_conversion_tech: "Naval Engine Conversion"
 sp_armored_mpd_naval_engine_conversion_tech_desc: "Utilizing techniques used in naval engines such as reinforced crankshafts, high-torque transmissions and specialized cooling systems allow us to enhance the power output and durability of Megapods engines, allowing them to better manage the immense weight and stress."
 sp_armored_mpd_all_terrain_footpads_tech: "All-Terrain Footpads"
 sp_armored_mpd_all_terrain_footpads_tech_desc: "Advanced mechanism used in machine footpads allow it to travserse through various enviroments while handling immense weight of it."
 sp_armored_mpd_specialized_field_manuals_tech: "Specialized Field Manuals"
 sp_armored_mpd_specialized_field_manuals_tech_desc: "Distributing detailed training manuals and instruction among the crews of Megapods, covering unique operational procedures, maintenance protocols, and complex battlefield tactics required to effectively command these enormous walking machines."
 sp_armored_mpd_high_caliber_devastator_cannon_tech: "High-Caliber Devastator Cannon"
 sp_armored_mpd_high_caliber_devastator_cannon_tech_desc: "This powerful cannon was specifically designed to destroy heavily armored targets, fortifications, or even masses of enemy infantry. Its broad variety of shell types makes it an effective weapon against any land target."
 sp_armored_mpd_weapon_fire_control_tech: "Weapon Fire Control"
 sp_armored_mpd_weapon_fire_control_tech_desc: "Implementing advanced targeting optics, rangefinders, gyroscopic stabilizers and brand new gun pods mechanism to enhance weapon accuracy and firing coordination, ensuring the guns can effectively engage targets despite their massive recoil and slow maneuverability."
 sp_armored_mpd_stabilization_mechanism_tech: "Advanced Stabilization Mechanism"
 sp_armored_mpd_stabilization_mechanism_tech_desc: "Installing a set of digital and mechanical systems to guarantee maximum stability for the Megapod, preventing it from falling or tripping during movement or combat."
