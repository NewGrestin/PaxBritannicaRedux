 special_project_primordiform_desc: "Traditionally, primates or primate adjacent species are avoided when mixing genetics. Frankly this is short-sighted and unimaginative, and thus the Primordiform was born. An unholy union of ape, human and mutated DNA, these armed creatures are exceptional shock cavalry."

