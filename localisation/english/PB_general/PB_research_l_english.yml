 PB_Chemweapons_Advanced_Psychadelic_Effect_tt: "£Generic_Gas_Mask §GDeployed Chemical Weapons will produce the following effects on states deployed in:§!\n\n§R-25% Manpower\n\n-25% Army Speed for Controller§!"
 PB_Chemweapons_Mindbreaker_Bomb_Effect_tt: "£Generic_Gas_Mask §GDeployed Chemical Weapons will produce the following effects on states deployed in:§!\n\n§R-50% Manpower\n\n-50% Army Speed for Controller\n\n50% Chance of Factory Sabotage\n\n+50% Local Intelligence to Enemies§!"
 PB_Mindbreaker_Bomb_Available_tt: "£Generic_Skull §GMelter Bombs can now be deployed§!\n\n"
 
 bioweapons_basic_1: "Laboratory Conditions for Germ Growth"
 bioweapons_basic_1_desc: "With the field of epidemiology still being very young, germ theory still has a lot to be desired. One of the first steps towards researching the smallest parts of our biology is the right conditions for laboratory experiments."
 bioweapons_basic_2: "Early Gestation Procedures"
 bioweapons_basic_2_desc: "As research in laboratories continue, new methods have been found to speed up the process of gestation among most viruses. By applying this new knowledge, we can continue to discover the wonderful information of epidemics."
 bioweapons_basic_2_lab: "Establish Laboratory Conditions"
 bioweapons_basic_2_lab_desc: "With research on germs and viruses continueing to mature, new methods of handling these dangerous things are created. With improved methods of handling biological weapons in the lab, more research can be done to uncover their mysteries."
 bioweapons_basic_2_grow_vats: "Growth Vats"
 bioweapons_basic_2_grow_vats_desc: "The creation of a virus can be a tedious process, sometimes taking months while we need them in weeks. By applying our research on gestation and introducing new insights on virus creation, we can create the perfect conditions for specific viruses to thrive."
 bioweapons_basic_2_dispersal: "Dispersal Methods"
 bioweapons_basic_2_dispersal_desc: "If we seek to weaponize God's green earth into biological bombs, we first need to understand the best way to spread out deadly disease in a military setting. By using planes and carefully constructed bombshells, we can disperse these microscopic threats among enemy armies."
 
 bioweapons_anthrax: "Breed Anthrax Colonies"
 bioweapons_anthrax_desc: "Anthrax is a nasty bacterium. First showing up like a common fever, an airborne strain of anthrax can easily wipe out battalions, wielding a fatality rate of between 60 and 80% when untreated. With the complications of treating anthrax in the field, soldiers can drop like flies when the anthrax bombs are dropped."
 bioweapons_smallpox: "Bio-Engineered Smallpox"
 bioweapons_smallpox_desc: "Smallpox was the virus that wiped out the Atlantic indians, lacking the immunity of the Old World. This posed the horrifying question: what if we could weaponize smallpox in a similar manner for every man on earth? Thus, bio-engineering produced megapox, a strain of smallpox with a fatality rate reaching the 90%."
 bioweapons_botulism: "Botulinum Growth Genome"
 bioweapons_botulism_desc: "An unorthodox disease, botulism paralyses the victim in a matter of days. Caused by the bacteria clostridium botulinum, botulism has a small fatality rate but is possible to transmit through soil and water. Deploying such a weapon can thus potentially damage a region for months."
 bioweapons_Influenza: "Influenza Variant Testing"
 bioweapons_Influenza_desc: "The flu is a highly infectious disease, excellent for making bioweaponry. Disabling soldiers to the point that they cannot continue fighting, influenza is rarely fatal. However, using such an infectious disease can easily backfire, especially when it spreads to our side through combat."
 
 PB_Bioweapons_Warning_tt: "£Generic_Skull §RBiological Weapons are an extremely dangerous course of development. Exercise extreme caution.§!\n\n"
 PB_Bioweapons_Warning_Anthrax_tt: "£Generic_Skull §RAnthrax will produce the following effects on states it is deployed in\n\n-25% Local Manpower\n\n-50% Local Non Core Manpower\n\n+25% Attrition for Controller of Affected State§!\n\nDue to the nature of how Anthrax is deployed, it will not spread outside the deployed state."
 PB_Bioweapons_Warning_Smallpox_tt: "£Generic_Skull §RSmallpox will produce the following effects on states it is deployed in\n\n-50% Local Manpower\n\n-75% Local Non Core Manpower\n\n-50% Supplies in Affected States§!\n\nDue to the nature of Smallpox and its' methods of transmission, it is §YLIKELY§! it will spread to other states."
 PB_Bioweapons_Warning_Botulism_tt: "£Generic_Skull §RBotulism will produce the following effects on states it is deployed in\n\n-25% Local Resources\n\n-25% Local Non Core Manpower\n\n-50% Supplies in Affected States§!\n\nDue to the nature of Botulism and its' methods of transmission, it cannot spread beyond the deployed state."
 PB_Bioweapons_Warning_Influenza_tt: "£Generic_Skull §RInfluenza will produce the following effects on states it is deployed in\n\n-25% Local Manpower\n\n-25% Local Organization Regain§!\n\nDue to the nature of Influenza Variants and their methods of transmission, it is §RVERY LIKELY§! it will spread to other states."
 
 wmd_livewire: "Livewire Deployment"
 wmd_livewire_desc: "Livewire is a cruel weapon, having seen deployment during the Great War on both sides. Through biological engineering and early experimentation with amalgamates, livewire became a weapon used on the fronts of Iberia and France. Unlike boring barbed wire, livewire responds to stimulants, like a soldier touching the wire, leading to it wrapping around the poor soul and extensive pressure being put on him, like a boa constrictor with razors across its entire body."
 PB_Livewire_Available_tt: "£Generic_Skull §RLivewire can now be deployed§!"
 
 # STIMULANTS #
 infantry_drugs: "Basic Stimulant Manufacturing"
 infantry_drugs_desc: "Utilizing a combination of various medical science developments, chemistry and electronics, our technical teams can begin creating a whole galaxy of multi-colored uppers, downers, screamers, laughers and mindbreaking psychedelics for combat and civilian use. All under the table and very legal, of course."
 infantry_drugs_pep_pills: "Pep Pills"
 infantry_drugs_pep_pills_desc: "Pep pills will give our men on the field a much needed boost in speed, although these pills do have the added side affect of possible addiction."
 infantry_drugs_thalasin: "Thalasin"
 infantry_drugs_thalasin_desc: "Thalasin soothes the mind and soul and could be used to ease an unruly populace from revolt."
 infantry_drugs_melange: "Melange"
 infantry_drugs_melange_desc: "Melange also known as 'brown beer' increases the drinkers perception to even the most minute of details."
 infantry_drugs_victory_tonic: "Victory Tonic"
 infantry_drugs_victory_tonic_desc: "Victory Tonic is capable of bringing even the most tired and saddened of individuals back to a tip-top shape."
 infantry_drugs_2: "Industrial Grade Stimulant Manufacturing"
 infantry_drugs_2_desc: "By expanding our stimulant manufacturing processes we can allow more of our soldiers to utilize our advancements in drug development."
 infantry_drugs_soma: "Soma"
 infantry_drugs_soma_desc: "Soma makes its users less likely to deviate from group thinking and makes them less inclined to question higher authorities."
 infantry_drugs_obetrol: "Obetrol"
 infantry_drugs_obetrol_desc: "Obetrol limits the human bodies natural demand for food, it effectively adds a level of artifical fullness."
 infantry_drugs_milk_plus: "Milk Plus"
 infantry_drugs_milk_plus_desc: "Milk plus is essentialy just milk with just opioids in it. Simple yet very effective."
 infantry_drugs_substance_f: "Substance F"
 infantry_drugs_substance_f_desc: "Substance F is made with wide combination of different drugs that boosts potential brain usage."
 infantry_drugs_3: "Enhanced Industrial Stimulant Manufacturing"
 infantry_drugs_3_desc: "The final form of stimulant manufacturing would be mass industrial production on a scale never seen before"
 infantry_strength_booster: "Musculo-Skeletal Gene Treatment"
 infantry_strength_booster_desc: "By injecting our soldiers with a special musculo-skeletal gene treatment we can expect increased muscle growth in only a few hours."
 infantry_intelligence_booster: "Ocular Injected Hypothalamus Therapy"
 infantry_intelligence_booster_desc: "Ocular Injected Hypothalamus Therapy is considered to be a unique form of shock therapy where participants will experience heightened mental functioning."
 
 ## NAVAL ##
 # CARRIERS #
 early_ship_hull_carrier: "Deck Conversions"
 early_ship_hull_carrier_short: "Deck Conversions"
 early_ship_hull_carrier_desc: "Conversions of old hulls allow for cheap experiments with naval aviation to gain experience in building and operating carriers. These ships will be less capable than a purpose-built carrier, but far quicker to create."
 # TECHNOLOGIES #
 smoke_generator: "Smoke Generators"
 smoke_generator_desc: "Some minor modifications to the engines and smokestacks of light and medium ships allow them to make a lot of smoke to avoid or break contact with the enemy."

 basic_depth_charges: "Basic Depth Charges"
 basic_depth_charges_desc: "A simple explosive container with a pressure-sensitive trigger explodes when it hits a pre-set depth.$depth_charges_advice_tt$"
 improved_depth_charges: "Depth Charge Thrower"
 improved_depth_charges_desc: "A simple mechanical device that tosses a depth charge a set distance away from the ship. This means that the destroyer no longer has to drive directly across the target to hit it.$depth_charges_advice_tt$"
 advanced_depth_charges: "Depth Charge Mortar"
 advanced_depth_charges_desc: "A mortar on board the destroyer can throw an explosive charge much further, allowing the ship to maintain sonar contact with the submarine throughout the attack and dramatically increasing its accuracy.$depth_charges_advice_tt$"
 modern_depth_charges: "Improved Depth Charge Mortar"
 modern_depth_charges_desc: "A larger propellant charge throws a proper depth charge set to a specific depth at a submarine from quite a distance.$depth_charges_advice_tt$"
 depth_charges_advice_tt: "\n\nMounting a §YDepth Charge§! module on §YLight Ships§! and §YCruisers§! will allow them to attack enemy §YSubmarines§!."

 sonar: "Passive Sonar"
 sonar_desc: "A basic set of hydrophones allows tracking of underwater targets through detecting the sound they make.$sonar_advice_tt$"
 improved_sonar: "Active Sonar"
 improved_sonar_desc: "Using modulated sound waves, this system can accurately measure bearing and distance to a submerged target.$sonar_advice_tt$"
 advanced_sonar: "Advanced Sonar"
 advanced_sonar_desc: "Refined hydrophone arrays and active sonar pinging techniques offer significant improvements to the accuracy and range of the enemy submarines. $sonar_advice_tt$"
 modern_sonar: "Modern Sonar"
 modern_sonar_desc: "Advances in signal filtering and directional scanning give this new sonar model unmatched precision, allowing us to hunt enemy submarines with deadly precision. $sonar_advice_tt$"
 sonar_advice_tt: "\n\nMounting a §YSonar§! module on §YLight Ships§! and §YCruisers§! will allow them to detect enemy §YSubmarines§!."

 basic_cruiser_armor_scheme: "Basic Cruiser Armor Scheme"
 basic_cruiser_armor_scheme_desc: "An armor scheme that copies the split between belt and deck armor seen in Capital Ships and offers some protection against splinters and small-caliber guns.$cruiser_armor_advice_tt$"
 basic_heavy_armor_scheme: "Inclined Belt Armor Scheme"
 basic_heavy_armor_scheme_desc: "By placing the belt armor at an angle, the same weight and thickness of armor are much harder to pierce.$heavy_armor_advice_tt$"
 improved_heavy_armor_scheme: "All-or-Nothing Armor Scheme"
 improved_heavy_armor_scheme_desc: "This scheme focuses on only protecting the most vital areas of the ship, while ignoring the unimportant parts.$heavy_armor_advice_tt$"
 cruiser_armor_advice_tt: "\n\nMounting a better §YArmor§! module on §YCruisers§! improves their ability to withstand damage."
 heavy_armor_advice_tt: "\n\nMounting a better §YArmor§! module on §YHeavy Ships§! improves their ability to withstand damage. §YBattleships§! and §YBattlecruisers§! are defined by their different §YArmor Schemes§!, with Battlecruisers generally having worse armor."

 basic_submarine_snorkel: "Basic Submarine Snorkel"
 basic_submarine_snorkel_desc: "A simple airtube running from the engine room to the control tower. Extended, it allows the submarine to run its engines and charge its batteries while still submerged.\n\nMounting this module on §YSubmarines§! reduces their §YVisibility§!, making them harder to detect."
 improved_submarine_snorkel: "Improved Submarine Snorkel"
 improved_submarine_snorkel_desc: "An improved design prevents any water from being sucked into the engines and also reduces the radar signature of the snorkel head.\n\nMounting this module on §YSubmarines§! reduces their §YVisibility§!, making them harder to detect."
 snorkel_advice_tt: "\nMounting §YSnorkels§! on §YSubmarines§! dramatically reduces their §YVisibility§!, making them harder to see and engage for enemy ships."

 sp_aip_engine_improved_tech: "AIP-Diesel Combination Engines"
 sp_aip_engine_improved_tech_desc: "With further refinement of the AIP technology, we are seeing improvement both in terms of the performance as well as the material consumption used by the engines"
 sp_aip_engine_advanced_tech: "High-Speed Walter Engines"
 sp_aip_engine_advanced_tech_desc: "Our experience and understanding of the Air-Independent Propulsion System have allowed us to develop state of the art engines. Silent, fast and deadly."
 sp_refined_pykrete: "Refined Pykrete"
 sp_refined_pykrete_desc: "With the further refinement of Pykrete, we are now able to have much better insulation and protection for our aircraft aboard the Ice Carrier."
 sp_ice_composite_runawayas: "Ice Composite Runways"
 sp_ice_composite_runawayas_desc: "With the continued development of ice composites, we are looking for the best materials and construction techniques to provide protection for our carrier and planes."

 # HIDDEN #
 heavy_battleship2: "Super-Heavy Battleship II"
 heavy_battleship2_desc: "An improvement on our earlier super heavy design with stronger weapons and improved fire control systems."

 ## NAVAL SUPPORT ##
 # ARMAMENTS #
 basic_battery: "Naval Gunnery"
 basic_battery_desc: "Basic design for the training and elevation mechanics of naval guns."

 basic_light_battery: "Basic Light Battery"
 basic_light_battery_desc: "An open, powered mount for a small-caliber gun for use on smaller ships.\n\nMounting this module increases §YLight Gun Attack§!, which helps in engaging enemy §YScreening Ships§!."
 improved_light_battery: "Improved Light Battery"
 improved_light_battery_desc: "A closed, powered mount for a small-caliber gun gives the crew some protection from the elements and shell splinters. \n\nMounting this module increases §YLight Gun Attack§!, which helps in engaging enemy §YScreening Ships§!."
 advanced_light_battery: "Advanced Light Battery"
 advanced_light_battery_desc: "An advanced twin mount brings significantly more firepower to bear under armored protection.\n\nMounting this module increases §YLight Gun Attack§!, which helps in engaging enemy §YScreening Ships§!."
 basic_light_shell: "Small-Caliber Semi-Armor Piercing Shell"
 basic_light_shell_desc: "A compromise between armor-piercing performance and explosive power, this shell does significantly more damage after punching through the weak armor of light ships."
 improved_light_shell: "Small-Caliber Armor Piercing Shell"
 improved_light_shell_desc: "A proper armor-piercing shell for small caliber guns gives destroyers and other light ships a fighting chance against armored opponents."

 basic_heavy_battery: "Basic Heavy Battery"
 basic_heavy_battery_desc: "A gigantic turret housing massive guns under heavy armor. \n\nMounting a §YHeavy Battery§! module increases a ship's §YHeavy Gun Attack§!, improving performance against enemy §YCapital Ships§!."
 improved_heavy_battery: "Improved Heavy Battery"
 improved_heavy_battery_desc: "Power Rammers increase the loading speed of heavy guns while automatic flash-tight doors improve safety. \n\nMounting a §YHeavy Battery§! module increases a ship's §YHeavy Gun Attack§!, improving performance against enemy §YCapital Ships§!."
 advanced_heavy_battery: "Advanced Heavy Battery"
 advanced_heavy_battery_desc: "Improved Recoil Reduction Mechanisms and delay coils reduce interference of shells in flight and dramatically increase accuracy. \n\nMounting a §YHeavy Battery§! module increases a ship's §YHeavy Gun Attack§!, improving performance against enemy §YCapital Ships§!."
 basic_heavy_shell: "Armor-Piercing Capped Shell"
 basic_heavy_shell_desc: "By fitting a ballistic hood, shells can be made more aerodynamic while still maintaining their armor-piercing performance."
 improved_heavy_shell: "Super-Heavy Armor Piercing Shell"
 improved_heavy_shell_desc: "Weighing well over a ton, these massive shells strike with unprecedented power and pose a dire threat to even the heaviest armor."

 basic_dp_light_battery: "Basic Dual-Purpose Battery"
 basic_dp_light_battery_desc: "Combining anti-ship and anti-air guns in a single mount allows for more flexibility and saves weight.\n\nMounting this module increases §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§!, which helps in engaging enemy §YScreening Ships§!. These modules also increase §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§!.\nMounting a §YSecondary Battery§! Module gives a §Y$ship_hull_cruiser$§!, §Y$ship_hull_carrier$§!, or §Y$ship_hull_heavy$§! a small amount of §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! and allows it to engage a second target."
 improved_dp_light_battery: "Improved Dual-Purpose Battery"
 improved_dp_light_battery_desc: "Powered fully enclosed Twin gun mounts greatly increase firepower and protection while saving weight.\n\nMounting this module increases §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§!, which helps in engaging enemy §YScreening Ships§!. These modules also increase §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§!. \nMounting a §YSecondary Battery§! Module gives a §Y$ship_hull_cruiser$§!, §Y$ship_hull_carrier$§!, or §Y$ship_hull_heavy$§! a small amount of §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! and allows it to engage a second target."
 advanced_dp_light_battery: "Advanced Dual-Purpose Battery"
 advanced_dp_light_battery_desc: "Automated Rapid fire enclosed gun mounts greatly increase firepower.\n\nMounting this module increases §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§!, which helps in engaging enemy §YScreening Ships§!. These modules also increase §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§!. \nMounting a §YSecondary Battery§! Module gives a §Y$ship_hull_cruiser$§!, §Y$ship_hull_carrier$§!, or §Y$ship_hull_heavy$§! a small amount of §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! and allows it to engage a second target."

 light_battery_advice_tt: "\n\nMounting §YLight Battery§! modules on §YLight Ships§! and §YCruisers§! improves their §YLight Gun Attack§!, which helps with destroying enemy §YScreen Ships§!. §YLight Batteries§! generally perform poorly against armored ships such as §YCruisers§! and §YHeavy Ships§!"
 medium_battery_advice_tt: "\n\nMounting §YLight Medium Battery§! or §YMedium Battery§! modules on §YCruisers§! improves their §YLight Gun Attack§! or §YHeavy Gun Attack§!, enabling them to fight enemy §YScreen Ships§! or §YCapital Ships§!. Mounting any §YMedium Battery§! will designate a ship as a §YHeavy Cruiser§!, while mounting only §YLight Medium Battery§! will designate a ship as a §YLight Cruiser§!."
 heavy_battery_advice_tt: "\n\nMounting §YHeavy Battery§! modules increases a §YHeavy Ship§!'s §YHeavy Gun Attack§!, allowing it to engage and destroy enemy §YCapital Ships§!. §YHeavy Batteries§! generally perform poorly against smaller vessels such as §YLight Ships§! and §YLight Cruisers§!."

 # TORPEDOES #
 basic_torpedo: "Basic Torpedo"
 basic_torpedo_desc: "A self-propelled weapon with an explosive warhead that runs on a pre-determined course until it hits the target below the waterline.\n\nMounting this module on §YLight Ships§! or §YCruisers§! allows them to do significant damage to enemy §YCapital Ships§!."
 magnetic_detonator: "Magnetic Detonator"
 magnetic_detonator_desc: "A new detonator detects the shift in the earth's magnetic field when the torpedo passes under the target. An explosion directly under a ship causes much more damage and often breaks the keel of the target, sinking it instantly."
 homing_torpedo: "Homing Torpedo"
 homing_torpedo_desc: "Equipped with an acoustic detector, the torpedo can home in on the biggest source of noise ahead of it - usually the target."
 electric_torpedo: "Electric Torpedo"
 electric_torpedo_desc: "Instead of leaving an easily-detected trail of bubbles, a torpedo with an electrical engine remains practically invisible until it hits. This also means that there is no trail leading back to the launching submarine."
 improved_ship_torpedo_launcher: "Improved Ship Torpedo Launcher"
 improved_ship_torpedo_launcher_desc: "Stronger motors allow more tubes to be installed in a single mount and be trained on target faster.\n\nMounting this module on §YLight Ships§! or §YCruisers§! allows them to do significant damage to enemy §YCapital Ships§!."
 advanced_ship_torpedo_launcher: "Advanced Ship Torpedo Launcher"
 advanced_ship_torpedo_launcher_desc: "Larger diameter tubes allow for bigger torpedoes with heavier warheads.\n\nMounting this module on §YLight Ships§! or §YCruisers§! allows them to do significant damage to enemy §YCapital Ships§!."
 modern_ship_torpedo_launcher: "Modern Ship Torpedo Launcher"
 modern_ship_torpedo_launcher_desc: "Powerful compressed air charges allow heavier torpedoes to be launched at higher speeds.\n\nMounting this module on §YLight Ships§! or §YCruisers§! allows them to do significant damage to enemy §YCapital Ships§!."
 torpedo_advice_tt: "\nMounting §YTorpedo Launchers§! on §YLight Ships§! or §YCruisers§! allows them to do significant damage to enemy §YCapital Ships§! in the §YBattleline§! if they can overwhelm the enemy §YScreening Group§!."

 # DAMAGE CONTROL #
 damage_control_1: "Fire Fighting Drills"
 damage_control_1_desc: "Every member of a ship's crew, from the Captain down to the simple sailor, must be able to help in containing and fighting fires onboard the ship."
 damage_control_2: "Separate Fire Mains"
 damage_control_2_desc: "By separating the main water lines around the ship, the probability of a hit rendering the ship completely unable to fight fires is much reduced."
 damage_control_3: "Diesel-powered Emergency Pumps"
 damage_control_3_desc: "With heavy pumps usually dependent on the main engines for power, a single and fairly light hit in the engine room may render the ship unable to stay afloat."

 # FIRE CONTROL #
 fire_control_methods_1: "Bracket Shooting"
 fire_control_methods_1_desc: "To hit the target, the first step is to straddle it by firing a few guns at a time until the impacts hit on both sides of the target."
 fire_control_methods_2: "Ladder Shooting"
 fire_control_methods_2_desc: "Instead of firing over the target and losing track of the impacts behind the enemy ship, shots are deliberately dropped short of the target and the distance between impact and target measured to determine the range."
 fire_control_methods_3: "Shell Dyes"
 fire_control_methods_3_desc: "Adding small color packages to the shells when they are fired colors the impacts around the target and allows multiple ships to engage the same target without being confused by each other's impacts."

 # TRANSPORTS #
 transport: "Transport Ship"
 transport_desc: "Ship designed solely for troop movement, without any defensive capabilities."
 landing_craft: "Landing Craft"
 landing_craft_desc: "Dedicated invasion craft make landing in hostile territory slightly less of a headache."
 tank_landing_craft: "Advanced Landing Craft"
 tank_landing_craft_desc: "Advanced Landing craft means that our boys can get on the beach quicker and more effectively during an invasion."
 mtg_transport: "$transport$"
 mtg_transport_desc: "$transport_desc$."
 mtg_landing_craft: "$landing_craft$"
 mtg_landing_craft_desc: "$landing_craft_desc$"
 mtg_tank_landing_craft: "$tank_landing_craft$"
 mtg_tank_landing_craft_desc: "$tank_landing_craft_desc$"
 sp_multi_product_supply_ships: "Multi-Product Supply Ship"
 sp_multi_product_supply_ships_desc: "With the use of the newly produced supply ships, we can ensure smoother transfer of the fuel, ammunition and supplies."
 sp_standard_tenshioned_replenishment_alongside_method: "Standardized Tensioned Replenishment Alongside Method"
 sp_standard_tenshioned_replenishment_alongside_method_desc: "Standardized Tensioned Replenishment Alongside Method or STREAM is a further evolution of ensuring a steady resupply of our long range naval operations"

 # MINES #
 basic_naval_mines: "Contact Mine"
 basic_naval_mines_desc: "A simple floating bomb, anchored to the sea floor. The mine explodes when it comes into contact with a ship."
 improved_naval_mines: "Magnetic Mine"
 improved_naval_mines_desc: "This sophisticated mine explodes when it detects changes in the magnetic field stemming from a passing ship."
 advanced_naval_mines: "Acoustic Mine"
 advanced_naval_mines_desc: "This type of naval mine detonates when its sensors detect the noise of a nearby ship."
 modern_naval_mines: "Pressure Mine"
 modern_naval_mines_desc: "This highly advanced mine detects small changes in water pressure caused by a ship moving nearby."
 degaussing: "Degaussing"
 degaussing_desc: "By installing powerful electro-magnetic coils, a ship's magnetic signature can be dramatically reduced, making it far less vulnerable to magnetic mines."
 submarine_mine_laying: "Minelaying Submarine"
 submarine_mine_laying_desc: "By installing special equipment to hold and release mines, a specially-designed submarine can deploy mines while submerged and, hopefully, undetected."
 improved_submarine_mine_laying: "Torpedo-tube Mine Deployment"
 improved_submarine_mine_laying_desc: "Redesigning mines to fit into torpedo tubes allows any submarine to become a minelayer, albeit at the expense of torpedoes carried."
 airdrop_mines: "Aerial Minelaying"
 airdrop_mines_desc: "By fitting the mines with a small parachute, they can be safely dropped from airplanes, allowing quick and efficient creation of minefields."
 airdrop_mines_bba: "$airdrop_mines$"
 airdrop_mines_bba_desc: "$airdrop_mines_desc$"
 airsweep_mines: "Aerial Minesweeping"
 airsweep_mines_desc: "Airplanes can be fitted with special equipment to detect and safely detonate naval mines from the air."
 airsweep_mines_bba: "$airsweep_mines$"
 airsweep_mines_bba_desc: "$airsweep_mines_desc$"

 # HIDDEN / SPECIAL PROJECT #
 nuclear_naval_mine_tech: "Nuclear Naval Mines"
 nuclear_naval_mine_tech_desc: "Nuclear warheads adapted for naval mines, capable of devastating enemy fleets and disrupting access to strategic waterways."

