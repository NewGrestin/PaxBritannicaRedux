 # WEAPONRY #
 early_bombs: "Bombs"
 early_bombs_desc: "Since the early days of the Great War, airplanes have been increasingly used to drop explosives onto enemy targets. Over time, this has developed more and more into a fundamental aspect of aerial warfare."
 heavy_bombs: "Heavy Bombs"
 heavy_bombs_desc: "Modern Warfare requires airplanes increasingly used larger bombs on enemy targets. Over time, this has developed more and more into a fundamental aspect of aerial warfare."
 armor_piercing_bombs: "Armor Piercing Bombs"
 armor_piercing_bombs_desc: "Warships have steadily increased their deck armor. To defeat this, specialized bombs must be developed to penetrate such armor."
 incendiary_bombs: "Incendiary Bombs"
 incendiary_bombs_desc: "Incendiary bombs capable of starting widespread fires, causing severe damage to infrastructure, industry, and agricultural production."

 aa_lmg: "Light MG"
 aa_lmg_desc: "Rifle-caliber machine guns have formed the mainstay of air-to-air weaponry since the days of the Great War."
 aa_hmg: "Heavy MG"
 aa_hmg_desc: "Modern planes are capable of withstanding significantly more punishment than older models, while also offering fewer opportunities to score hits. Each hit must therefore do the maximum amount of damage, requiring a bigger cartridge."
 aa_cannon_1: "Cannons I"
 aa_cannon_1_desc: "A cannon shell can punch through even the toughest airplane, while potentially carrying enough explosives to do crippling damage when it hits."
 aa_cannon_2: "Large Cannons"
 aa_cannon_2_desc: "With a higher caliber and a bigger shell, these cannons can bring down even large planes in a single hit."
 aa_cannon_3: "Cannons II"
 aa_cannon_3_desc: "With A modern cannon firing a large shell at high velocity, we can bring down even the toughest aircraft."
 rotary_cannons: "Rotary Cannons"
 rotary_cannons_desc: "A multi-barreled gun that rotates at very high speed, delivering devastating firepower."

 air_torpedoe_1: "Air Launched Torpedoes"
 air_torpedoe_1_desc: "Lightweight torpedoes can be carried by any capable aircraft in order to extend our ability to strike at sea."
 air_torpedoe_2: "Improved Air Launched Torpedoes"
 air_torpedoe_2_desc: "Standardized mounts and ratings allow the development of larger, more powerful torpedoes as well as increasing their general utility."
 air_torpedoe_3: "Advanced Air Launched Torpedoes"
 air_torpedoe_3_desc: "The development of lightweight fittings designed to be shed upon entering the water gives aerial torpedoes significantly greater accuracy as well as enhanced safety for the aircraft performing a drop."
 photo_reconnaisance: "Photo Reconnaissance"

 photo_reconnaisance_desc: "The first clear military purpose of the aeroplane was to find the enemy and report their location to the Generals on the ground. This still remains one of the most common tasks of military aviation."

 survivability_studies: "Survivability Studies"
 survivability_studies_desc: "By carefully analyzing the battle damage on returning planes, we can accurately determine which parts of a plane are really vital."
 aircraft_construction: "Aircraft Construction"
 aircraft_construction_desc: "We have come a long way since the days of plywood and fabric in aircraft manufacture. New technologies allow for planes that are better suited for specific roles."

 # ENGINES #
 engines_1: "Engines I"
 engines_1_desc: "Airplane engines must be powerful, but lightweight and reliable. This engine type provides enough power to get a plane in the air, but somewhat limits it from reaching its full potential."
 engines_2: "Engines II"
 engines_2_desc: "The rapid growth of airplanes requires a corresponding growth of engine power."
 engines_3: "Engines III"
 engines_3_desc: "$engine_3_1x_desc$"
 engines_4: "Engines IV"
 engines_4_desc: "$engine_4_1x_desc$"
 range_improvements: "Range Improvements"
 range_improvements_desc: "While it seems obvious that adding more fuel capacity will increase the range of an airplane, actually adding that capacity to a plane without impacting flight performance too much is far from trivial."
 sp_centrifugal_jet_tech: "Centrifugal Jet"
 sp_centrifugal_jet_tech_desc: "Centrifugal jets use a single stage compressor to compress the intake air, before blasting it out to create thrust. This results in smaller, more easily maintained engines."
 
 # HIDDEN TECHS #
 reinforced_wings_mothership: "Reinforced Mothership Wings"
 reinforced_wings_mothership_desc: "Without their mothership, the fighters are essentially stranded in the air, severely limiting their operational effectiveness. Strengthening the mothership's air wings is the most cost-effective strategy to enhance the survivability of the entire squadron."
 miniature_fighters: "Miniature Fighters"
 miniature_fighters_desc: "With smaller fighters we will be able to carry more of them into battle without sacrificing much firepower, as well as reducing the weight of the Motherships load"
 aerial_hangars: "Aerial Hangars"
 aerial_hangars_desc: "Aerial Hangars attached to the mothership allows us to fit even more miniature fighters onto the top of the aircraft, allowing for increased firepower and further reach."

 ## AIRPLANES NON BBA ##
 naval_bomber1: "Naval Bomber I"
 naval_bomber2: "Naval Bomber II"
 naval_bomber3: "Naval Bomber III"

 suicide_craft: "Suicide aircraft"
 suicide_craft_desc: "Rocket powered suicide aircraft"
 cv_suicide_craft: "$suicide_craft$ (Carrier)"
 cv_suicide_craft_desc: "$suicide_craft_desc$"

 ## ROTORCRAFTS ##
 # TECHS #
 helicopter_engine: "Helicopter Engine"
 helicopter_engine_desc: "Based on the early works of Dutch inventor Albert Gillis von Baumhauer and like-minded men of genius, different engine allows us to field a new type of aircraft, more capable of dangerous manuevers and transportation than any previous design."

 ## ELECTRONICS ##
 electrical_engineering: "Magnetic Relay Coils"
 electrical_engineering_desc: "Electricity need not merely power our machines, but control them. Magnetic relays allow electrical signals to direct mechanical systems with unprecedented precision, opening a new age of automated calculation."

 # COMPUTING #
 computing_1: "Molybdenum Gas Tubes"
 computing_1_desc: "The mechanical limits of calculation can be overcome by harnessing the movement of electrons themselves. Gas tubes will allow machines to process information with a speed and complexity previously thought impossible."
 computing_2: "Magnetic Deflection Collars"
 computing_2_desc: "If electrons can be made to flow, they can also be guided. By manipulating electron streams with magnetic fields, we can greatly expand the complexity of calculations these machines are capable of performing."
 computing_3: "Crystal Rectifiers"
 computing_3_desc: "Not all electrical components need to rely upon moving parts or heated tubes. Certain crystals can control the flow of electricity themselves, offering the first glimpse of a smaller and more durable future for computing."
 computing_4: "Germanium Point-Regulators"
 computing_4_desc: "The remarkable properties of germanium allow electrical signals to be controlled within a solid material. These tiny regulators may finally free computing from the enormous machines upon which it has depended."
 computing_5: "Gallium-Nitride Channelling Modules"
 computing_5_desc: "The demands placed upon our machines have outgrown conventional materials. Gallium-nitride can endure immense electrical and thermal stresses, allowing computing systems to reach powers previously considered unattainable."
 computing_6: "Aluminum-Nitride Ceramic Monoliths"
 computing_6_desc: "The boundaries between component and machine are beginning to disappear. Aluminum-nitride allows vast quantities of computing circuitry to be consolidated into incredibly dense structures, bringing us closer to machines limited only by the electricity that powers them."

 # RADIO #
 radio: "Radio"
 radio_desc: "The principles of radio have become firmly established across the industrial world. By refining the work of pioneering radio operators and expanding the use of frequency modulation, our engineers can reduce interference and discover ever more uses for wireless communication."
 improved_radio: "Improved Radio"
 improved_radio_desc: "Stronger transmitters and more sensitive receivers allow radio signals to travel farther and remain intelligible under increasingly difficult conditions. What was once a specialized technology is becoming an indispensable instrument of modern communication."
 advanced_radio: "Advanced Radio"
 advanced_radio_desc: "Continued advances in radio engineering have brought greater range and reliability while reducing the size of transmitting and receiving equipment. Compact sets can now accompany soldiers and vehicles into the field, bringing rapid wireless communication wherever it is needed."
 semi_modern_radio: "Semi-Modern Radio"
 semi_modern_radio_desc: "The increasing sophistication of our electrical technology has transformed the radio from a simple communications device into a precise electronic instrument. Improved frequency control, miniaturized components, and more reliable circuitry allow wireless networks to operate with unprecedented clarity and flexibility."
 modern_radio: "Modern Radio"
 modern_radio_desc: "The culmination of years of engineering has produced radio equipment of remarkable range, reliability, and compactness. Advanced electronic components allow signals to be transmitted and received with extraordinary precision, making wireless communication an essential part of every modern military and industrial system."

 # RADARS #
 early_radar: "Early Radio Detection"
 early_radar_desc: "The ability to detect distant objects through radio waves marks the beginning of a new age in observation. By measuring the echoes returned from the air and sea, we can locate targets that would otherwise remain hidden beyond the limits of sight. RADAR - Radio Detection and Ranging technology is the future."
 decimetric_radar: "Decimetric Radar"
 decimetric_radar_desc: "The development of the magnetron allows us to harness powerful high-frequency radio waves with unprecedented efficiency. Decimetric wavelengths permit the construction of more directional radar systems, opening the way to practical fire control and the detection of targets at useful ranges."
 centimetric_radar: "Centimetric Radar"
 centimetric_radar_desc: "The use of centimetric wavelengths brings radar to an entirely new level of precision. Smaller antennas can produce narrower beams, allowing distant objects to be located with greater accuracy while opening possibilities previously beyond conventional radar."
 doppler_radar: "Doppler Radar"
 doppler_radar_desc: "An echo contains more information than merely the location of its source. By measuring the changes in frequency caused by a moving target, Doppler radar can determine its motion and distinguish moving objects from their surroundings with unprecedented reliability."
 monopulse_radar: "Monopulse Radar"
 monopulse_radar_desc: "Accurate tracking requires more than knowing where a target lies. Monopulse radar compares multiple signals received from the same transmission, allowing the position of a target to be determined with exceptional angular precision and greatly improving automated fire control."
 millimetric_radar: "Millimetric Radar"
 millimetric_radar_desc: "The continued refinement of microwave technology has brought radar into the millimetric range. These extremely short wavelengths permit highly focused beams and compact apparatus, providing exceptional precision for the most demanding detection and tracking applications."
 phased_array: "Phased Array"
 phased_array_desc: "Mechanical movement need no longer determine where a radar looks. By coordinating numerous individual radiating elements, phased-array systems can steer their beams electronically and almost instantaneously, allowing a single installation to observe, track, and respond to many targets with unprecedented speed."

 # IFF #
 iff_1: "Basic Identification, Friend or Foe"
 iff_1_short: "IFF I"
 iff_1_desc: "Early identification equipment allows aircraft to distinguish friendly contacts from potential enemies. This reduces the risk of friendly fire and improves coordination during interception and air combat."
 iff_2: "Improved Identification, Friend or Foe"
 iff_2_short: "IFF II"
 iff_2_desc: "Improved identification equipment provides more reliable recognition of friendly aircraft, particularly during crowded engagements and difficult operating conditions."
 iff_3: "Advanced Identification, Friend or Foe"
 iff_3_short: "IFF III"
 iff_3_desc: "Advanced identification systems provide rapid and reliable recognition of friendly aircraft, improving coordination and reducing confusion during large-scale air operations."
 ecm: "Electronic Countermeasures"
 ecm_short: "ECM"
 ecm_desc: "Electronic countermeasures interfere with enemy detection and targeting systems, making aircraft more difficult to track and engage while operating in hostile airspace."
 # RDF #
 rdf_1: "Basic Radio Direction Finder"
 rdf_1_short: "RDF I"
 rdf_1_desc: "Basic radio direction-finding equipment allows aircraft and naval vessels to determine the approximate direction of radio transmissions, assisting navigation and the location of transmitting stations."
 rdf_2: "Improved Radio Direction Finder"
 rdf_2_short: "RDF II"
 rdf_2_desc: "Improved direction-finding equipment provides greater accuracy when locating radio transmissions, aiding aircraft navigation while allowing naval vessels to better determine the position and bearing of distant transmitters."
 rdf_3: "Advanced Radio Direction Finder"
 rdf_3_short: "RDF III"
 rdf_3_desc: "Advanced direction-finding systems provide highly accurate bearings from radio transmissions, greatly improving navigation and allowing aircraft and naval vessels to locate distant transmitters with greater reliability."
 loran: "Long Range Navigation"
 loran_short: "LORAN"
 loran_desc: "Long-range navigation uses synchronized radio signals from fixed transmitters to determine position over considerable distances. Primarily valuable to naval vessels operating far from shore, it also provides aircraft with reliable navigation when visual landmarks are unavailable."

 # CRYPTOLOGY #
 basic_encryption: "Encryption - Polyalphabetical Ciphers"
 basic_encryption_desc: "With new methods of communication comes new risks for interception. Rotor cipher machines can be used to allow for rapid, complex encryption."
 improved_encryption: "Encryption - Cyclic Permutations"
 improved_encryption_desc: "Limitation in the randomization of cipher machines can be exploited to break the ciphers. By improving the randomness of the rotor mechanics, we can make this kind of cryptanalysis more difficult."
 advanced_encryption: "Encryption - Pulse-code Modulation"
 advanced_encryption_desc: "Technological improvements and hard-earned experience allows us to implement more traffic flow security measures in our communication."
 basic_decryption: "Decryption - Frequency Analysis"
 basic_decryption_desc: "Cryptanalysis is increasingly becoming an advanced mathematical science. Systems like card catalogs and devices like cyclometers can aid the necessary work."
 improved_decryption: "Decryption - Side-channel Attack"
 improved_decryption_desc: "The development of more sophisticated computers allows for new applications of cryptanalysis methods like differencing, which can be used to break advanced cyphers when combined with new hand codebreaking methods."
 advanced_decryption: "Decryption - Automated Deduction"
 advanced_decryption_desc: "The increased computation power that improved our cryptanalysis so far threatens to create nearly unbreakable ciphers in the future. To stay ahead, we must be prepared to work more aggressively on gaining inside information on the technology."
 basic_encryption_with_lar: "$basic_encryption$"
 basic_encryption_with_lar_desc: "$basic_encryption_desc$"
 improved_encryption_with_lar: "$improved_encryption$"
 improved_encryption_with_lar_desc: "$improved_encryption_desc$"
 advanced_encryption_with_lar: "$advanced_encryption$"
 advanced_encryption_with_lar_desc: "$advanced_encryption_desc$"
 basic_decryption_with_lar: "$basic_decryption$"
 basic_decryption_with_lar_desc: "$basic_decryption_desc$"
 improved_decryption_with_lar: "$improved_decryption$"
 improved_decryption_with_lar_desc: "$improved_decryption_desc$"
 advanced_decryption_with_lar: "$advanced_decryption$"
 advanced_decryption_desc_with_lar: "$advanced_decryption_desc$"

 # FIRE CONTROL SYSTEMS #
 basic_fire_control_system: "Basic Fire Control System"
 basic_fire_control_system_desc: "The first electronic calculating systems allow information from the ship's rangefinders and directors to be processed far faster than by mechanical methods alone, improving the speed and consistency of ballistic calculations."
 improved_fire_control_system: "Improved Fire Control System"
 improved_fire_control_system_desc: "By entering course, speed and distance of a target, a mechanical computer can accurately predict where the target will be when the next salvo is ready to fire."
 advanced_fire_control_system: "Advanced Fire Control System"
 advanced_fire_control_system_desc: "A large and complex mechanical computer that tracks a large number of inputs about both the target, the firing ship as well as weather conditions and sea state allows very accurate ballistic calculations."
 integrated_fire_control_system: "Integrated Fire Control System"
 integrated_fire_control_system_desc: "By linking rangefinders, directors and ballistic computers into a unified system, information from multiple instruments can be continuously combined and updated. This allows firing solutions to account for changing target movements and firing conditions with greater consistency."
 electronic_fire_control_system: "Electronic Fire Control System"
 electronic_fire_control_system_desc: "Powerful electronic computers can process enormous quantities of information in real time, rapidly recalculating firing solutions as targets manoeuvre and environmental conditions change. The reduced delay between observation and correction allows ships to maintain accurate fire against distant and fast-moving targets."
 automated_fire_control_system: "Automated Fire Control System"
 automated_fire_control_system_desc: "Highly integrated computing systems can continuously track targets, calculate ballistic solutions and transmit corrections directly to the ship's guns. With much of the engagement process automated, gunnery crews can supervise target selection and firing while the system handles the calculations and adjustments required to maintain accurate fire."

 # FORTIFICATIONS #
 basic_fortification_tech: "Basic Fortification"
 basic_fortification_tech_desc: "By using stronger materials and metal reinforcements within the structures, we can construct larger fortifications without having to worry about them collapsing."
 land_fort_tech_1: "Improved Land Forts"
 land_fort_tech_1_desc: "By making better use of the land surrounding our fortifications, and incorporating new technology to boot, we can strengthen our existing structures and expand them even further."
 land_fort_tech_2: "Advanced Land Forts"
 land_fort_tech_2_desc: "By learning from past mistakes and reinforcing not only the structure itself, but also its base foundations, we will be able to construct much larger fortifications, that will be able to hold off even the most seasoned enemies."
 coastal_fort_tech_1: "Improved Coastal Fortifications"
 coastal_fort_tech_1_desc: "By making better use of the land surrounding our coastal fortifications, and incorporating new technology to boot, we can strengthen our existing structures and expand them even further."
 coastal_fort_tech_2: "Advanced Coastal Fortifications"
 coastal_fort_tech_2_desc: "By building our bunkers and fortifications further into the cliff-sides and hills, we can construct even larger complexes that have the ability to repel even the greatest of naval invasion forces."

 # ATOMIC RESEARCH #
 atomic_research: "Atomic Research"
 atomic_research_desc: "In nuclear fission, splitting the atom yields enormous amounts of energy and limitless destructive capability."

 # ROCKETERY #
 experimental_rockets: "Experimental Rockets"
 experimental_rockets_desc: "Advancing the science of rocketry by improving the range and reliability of liquid-fuel rockets will teach us enough about the technology to allow the construction of launch sites for more advanced models."

 sp_rockets_dual_chamber_rocket_engine_1: "Dual Chamber Rocket Engines"
 sp_rockets_dual_chamber_rocket_engine_1_desc: "By adding a second combustion chamber to the engine, we can improve the flight time and effectiveness of our rocket engines."
 sp_rockets_dual_chamber_rocket_engine_2: "Advanced Dual Chamber Rocket Engines"
 sp_rockets_dual_chamber_rocket_engine_2_desc: "Further refinements of the dual combustion engine may lead to even greater improvements in the design's effectiveness."
 sp_rockets_improved_guidance: "Improved Guidance"
 sp_rockets_improved_guidance_desc: "Better guidance systems for rockets, will allow us to send our flying bombs further, making them an even bigger threat to our enemies. By improving the guidance systems for smaller rockets, our rocket artillery will be able to improve their aim as well."
 sp_rockets_rocket_bomber: "$rocket_propelled_bombs$"
 sp_rockets_rocket_bomber_desc: "$rocket_propelled_bombs_desc$"
 sp_rockets_improved_rocket_bomber: "$improved_rocket_propelled_bombs$"
 sp_rockets_improved_rocket_bomber_desc: "$improved_rocket_propelled_bombs_desc$"
 
 # HIDDEN/SP TECHS #
 rocket_engines: "Rocket Engines"
 rocket_engines_desc: "Knowledge of rocket propulsion is reaching a point where we can construct flying bombs and rocket-powered aircraft, operating at previously unreachable speeds."
 improved_rocket_engines: "Improved Rocket Engines"
 improved_rocket_engines_desc: "The first long-range ballistic missiles can be built and made ever more precise, reaching distant enemy cities and even into space."
 advanced_rocket_engines: "Advanced Rocket Engines"
 advanced_rocket_engines_desc: "The future of rocketry opens up possibilities like intercontinental missiles, the range of which knows few limits while the payloads grow more lethal."

 jet_engines: "Jet Engines"
 JET_ENGINES_SPECIAL: "The development of Jet Engines is an essential prerequisite for the development of jet powered aircraft. This must be researched before you can research advanced aircraft"
 jet_engines_desc: "A breakthrough in propulsion technology, the Jet Engine will enable the development of an entirely new generation of aircraft."

 nukes: "Nuclear Bombs"
 nukes_desc: "A project to construct an atomic bomb will be one of the most secretive and difficult tasks a nation can undertake, but, if successful, may change not only the course of today's wars but of the future of the world."

 thermonuclear_bombs: "Thermonuclear Bombs"

 oth_radar_tech: "Over The Horizon Radar"
 oth_radar_tech_desc: "By reflecting radio waves off the ionosphere, over-the-horizon radar can detect distant aircraft and naval forces far beyond the reach of conventional radar."

 ## INDUSTRY ##

 # PRODUCTION #
 basic_machine_tools: "Basic Machine Tools"
 basic_machine_tools_desc: "A variety of newly developed milling machines can be used in military production, from the small and versatile types available to any machine shop to the large scale, advanced models that push the technological limits."
 improved_machine_tools: "Improved Machine Tools"
 improved_machine_tools_desc: "Turret lathes are proving indispensable for mass production. Ensuring efficient construction and use of the lathes themselves will give us a significant industrial advantage."
 advanced_machine_tools: "Advanced Machine Tools"
 advanced_machine_tools_desc: "Automating machine tools using servomechanisms has been discussed before. Putting these ideas into practice allows making use of other advancements in automation, such as computers."
 assembly_line_production: "Assembly Line Production"
 assembly_line_production_desc: "The powered assembly line, already in use in many industries, can change the course of war by allowing an unprecedented avalanche of production."
 flexible_line: "Flexible Line"
 flexible_line_desc: "As well-oiled a machine as the assembly line may be, it is still manned by humans, which allows for adaptation when needed. We should make use of this in our industrial production."
 streamlined_line: "Streamlined Line"
 streamlined_line_desc: "The standardization and rigid structure of the assembly line are keys to its efficiency and safety. These should be the key aspects to develop in our industrial production."
 improved_equipment_conversion: "Pulverized Coal-Firing Boilers"
 improved_equipment_conversion_desc: "By using finely powdered coal to heat our boilers, we can achieve much higher combustion efficiency, resulting in better energy production for our industry."
 advanced_equipment_conversion: "High-Efficiency Turbines"
 advanced_equipment_conversion_desc: "Adopting improved generator designs will allow them to operate at much higher pressures and temperatures, thereby drastically increasing energy efficiency of our coal plants."

 # INDUSTRY TYPE #
 concentrated_industry: "Concentrated Industry I"
 concentrated_industry_desc: "Focusing our industrial production to a few key sites will allow us to dramatically improve its efficiency.\n\n"
 concentrated_industry2: "Concentrated Industry II"
 concentrated_industry2_desc: "Further concentrating manufacturing will help driving down the costs."
 concentrated_industry3: "Concentrated Industry III"
 concentrated_industry3_desc: "Infrastructural expenses can be lowered by adapting networks to our more focused industry."
 concentrated_industry4: "Concentrated Industry IV"
 concentrated_industry4_desc: "Keeping the key points in our industry close to each other increases the impact of these concentrated sites."
 concentrated_industry5: "Concentrated Industry V"
 concentrated_industry5_desc: "Major industrial complexes now combine many parts of our industry, minimizing the costs of transports and labor."
 dispersed_industry: "Dispersed Industry I"
 dispersed_industry_desc: "By spreading out our industries, we can ensure that it becomes difficult for the enemy to target in times of war.\n\n"
 dispersed_industry2: "Dispersed Industry II"
 dispersed_industry2_desc: "Further decentralizing our manufacturing makes it harder to strike at specific parts of it."
 dispersed_industry3: "Dispersed Industry III"
 dispersed_industry3_desc: "Having factories operate under the guise of other operations will decrease the risk of direct attacks."
 dispersed_industry4: "Dispersed Industry IV"
 dispersed_industry4_desc: "Camouflaging and scattering our factories creates a network which is very difficult to completely disrupt."
 dispersed_industry5: "Dispersed Industry V"
 dispersed_industry5_desc: "By having not only our industry, but the infrastructure tying it together operate in secrecy, we can make it even more difficult to destroy through aerial attacks."

 # CONSTRUCTION & EXCTRACTION #
 construction1: "Construction I"
 construction1_desc: "Improved methods and materials allow us to construct buildings, both civilian and military, faster."
 construction2: "Construction II"
 construction2_desc: "Modernizing our tools and equipment will further aid our construction efforts."
 construction3: "Construction III"
 construction3_desc: "Adoption of modern vehicles and experience from our advancements in construction can be applied to make repairs vastly quicker."
 construction4: "Construction IV"
 construction4_desc: "A higher degree of mechanization and better routines further improves building construction speeds."
 construction5: "Construction V"
 construction5_desc: "The future of efficient construction will require more extensive planning for individual projects as well as standardized solutions wherever possible."
 excavation1: "Excavation I"
 excavation1_desc: "Advancements in drilling techniques allows us to excavate resources that were impossible to reach earlier."
 excavation2: "Excavation II"
 excavation2_desc: "New techniques help us collect resources more efficiently. We no longer taint the resources upon extraction, leading to a greater yield."
 excavation3: "Excavation III"
 excavation3_desc: "Progress in geology helps us determine the location of resources. We can now focus our extraction efforts in places where there is a greater chance that large amounts of natural resources will be found."
 excavation4: "Excavation IV"
 excavation4_desc: "Automation of key processes and advancement within mechanics makes all our resource sites much more efficient."
 excavation5: "Excavation V"
 excavation5_desc: "Advancements in fields such as surface mining gives us a greater yield of resources from our current extraction sites."
 materiosynthetics1: "Materiosynthetics I"
 materiosynthetics1_desc: "Advanced methods of metal fabrication by synthetically creating monocrystals. Allows more efficient production of resources in a §YSynthetic Mineral Fabricator§!."
 materiosynthetics2: "Materiosynthetics II"
 materiosynthetics2_desc: "Intensive research has revealed more efficient methods of producing synthetic metals."

 # SYNTHETIC OIL #
 fuel_silos: "Fuel Storage"
 fuel_silos_desc: "Mass Storage of fuel requires a complex set of tanks, pipes, and valves to ensure it is both secure and readily available."
 fuel_refining: "Fuel Refining I"
 fuel_refining_desc: "Advancements in chemical cracking allow for better yield of light fuels from oil."
 fuel_refining2: "Fuel Refining II"
 fuel_refining2_desc: "Better planning of refinery layouts reduce wastage of fuels."
 fuel_refining3: "Fuel Refining III"
 fuel_refining3_desc: "Improved reclamation methods allow refining fuel from by-products."
 fuel_refining4: "Fuel Refining IV"
 fuel_refining4_desc: "New developments in chemical engineering allow the refining of fuel from new sources."
 fuel_refining5: "Fuel Refining V"
 fuel_refining5_desc: "Using new methods and improved layouts in the construction of refineries dramatically increases throughput while reducing wastage."
 synth_oil_experiments: "Synthetic Oil Experiments"
 synth_oil_experiments_desc: "To reduce dependence on oil, processes to manufacture substitutes from other substances and materials can be researched."
 early_refining: "Early Refining"
 early_refining_desc: "Crude oil can be refined into a number of substances and materials vital to any modern war. Staying ahead in these methods will be necessary to build a modern industry."
 oil_processing: "Oil Processing"
 oil_processing_desc: "A network of factories for synthetic distillation and refining of oil products is the next step towards ensuring the fuel supply for our nation."
 improved_oil_processing: "Improved Oil Processing"
 improved_oil_processing_desc: "Moving previously experimental methods for distillation to large-scale operations will allow us to adapt better to available materials and needs."
 advanced_oil_processing: "Advanced Oil Processing"
 advanced_oil_processing_desc: "New experimental purification techniques like hydrotreating can be used in oil manufacturing to greatly improve the final product."
 modern_oil_processing: "Modern Oil Processing"
 modern_oil_processing_desc: "Our oil refineries can be further improved with new advanced oil processing methods like hydrocracking, alkylation, mercaptan oxidation and isomerization."
 rubber_processing: "Rubber Processing"
 rubber_processing_desc: "Industrial processing of synthetic rubber is needed to reduce our dependency on natural rubber."
 improved_rubber_processing: "Improved Rubber Processing"
 improved_rubber_processing_desc: "Large scale production of synthetic rubber is possible with new processes to accelerate dehydrogenation reactions."
 advanced_rubber_processing: "Advanced Rubber Processing"
 advanced_rubber_processing_desc: "A general purpose synthetic rubber recipe with improved processes such as dodecyl mercaptan polymerization modifiers will allow us to expand synthetic rubber production."
 modern_rubber_processing: "Modern Rubber Processing"
 modern_rubber_processing_desc: "Moving to more optimized polymerization processes will result in lower costs and higher output."

 # AGRICULTURE #
 expanded_farms1: "Expanded Agroponics Complexes I"
 expanded_farms1_desc: "The standardization of basic agroponic practices through dedicated seedbeds improves consistency and yield, allowing controlled agriculture to move beyond experimental installations and into structured production."
 expanded_farms2: "Expanded Agroponics Complexes II"
 expanded_farms2_desc: "Replacing horizontal seedbeds with stacked cultivation systems greatly increases crop variety and output, optimizing the use of space through regulated lighting, nutrient flow, and continuous growth cycles."
 expanded_farms3: "Expanded Agroponics Complexes III"
 expanded_farms3_desc: "Large-scale sealed domes enable fully regulated agroponic environments, supporting diversified cultivation and the introduction of low-maintenance livestock and insects within enclosed, nutrient-recycling ecosystems."
 expanded_farms4: "Expanded Agroponics Complexes IV"
 expanded_farms4_desc: "The mechanization and integration of agroponic, livestock, and aquaculture systems transforms controlled agriculture into a self-sustaining agro-industrial complex, capable of producing food at scale even under prolonged isolation."
 nutrients_research1: "Nutrient Enrichment Research"
 nutrients_research1_desc: "Early nutritional studies aimed at identifying essential vitamins and minerals, as well as methods for enriching staple foods to reduce overall dietary requirements."
 nutrients_research2: "Food Fortification Programs"
 nutrients_research2_desc: "The large-scale application of nutritional research through the fortification of staple foods with vitamins, minerals, and dietary supplements, improving efficiency and resilience of food supply systems."
 nutrients_research3: "Optimized Nutrient Formulations"
 nutrients_research3_desc: "Advanced dietary planning focused on designing food compositions around minimal yet sufficient nutrient intake, allowing populations and armed forces to be sustained on significantly reduced food quantities."