 victorian_artillery: "Early Victorian Artillery"

 ## MOBILE INFANTRY ##

 ## AUGMENTS AND HORRORS ##

 # COMBATAGATES #
 combatagate_upgrade_1: "Muscle Growth Factor"
 combatagate_upgrade_1_desc: "By introducing genes from larges predatory felines, we can expand the cardiovascular system of the basic combat amalgamate and increase overall muscle growth. Improved lung capacity will allow for faster movement in combat.\n\n"
 combatagate_upgrade_2: "Hive Hierarchy Development"
 combatagate_upgrade_2_desc: "The hierarchy of Bee Hives is an excellent template for improving the combat communication and coordination of combat amalgamates, granting them greater organizational skills.\n\n"
 combatagate_upgrade_A: "Neuron Complexity Theorem"
 combatagate_upgrade_A_desc: "As we further our goal of understanding nature, more insight has been given to us about the way animals \"think\". As an animal grows more complex, more complex neurons are needed for demanding tasks. By introducing the genes of the common housedog, Combatagates are more able to be properly used for military purposes.\n\n"
 combatagate_upgrade_4: "Cephalopod Chromatophores"
 combatagate_upgrade_4_desc: "Shock and surprise are everything in war and our amalgamates should truly embody that principle. Through experimentation, we have come to a feasible solution in the form of the octopus: using groups of cells to change the colour of their skin, octopus genetics may proof usefull for amalgamates designed for ambushes and reconnaissance.\n\n"
 combatagate_upgrade_5: "Carcinisation Principle"
 combatagate_upgrade_5_desc: "Nature's mysteries are truly countless. Discovered by Lancelot Borradaile in 1916, the Carcinisation Principle goes as follows: \n\n\"Given enough time, every crustacean eventually evolves into a crab\". \n\nUsing this knowledge, we can improve the tough skin of our amalgamates.\n\n"
 combatagate_upgrade_6: "Full Spectrum Analysis"
 combatagate_upgrade_6_desc: "As newly-introduced weaponry can decimates armies without even being seen or anticipated, it appear clear that the human perception is sufficient no more when dealing with the reality of a modern battlefield. \n\nBy enhancing the amalgamate's own sight, smell and nervous system, we might be able to design a creature able to sense danger and threats with an accuracy no men could ever reach.\n\n"
 combatagate_upgrade_7: "Lyssavirus Implant Procedure"
 combatagate_upgrade_7_desc: "The Lyssavirus is a genus of RNA viruses housing the rabies virus. A truly terrifying disease for over millenia at this point, rabies has become the focus of our attention for its applicability in military scenarios. By injecting such a virus into our amalgamates before battle, we can create feral beasts that absolutely shred the enemy.\n\n"
 
 combatagate_upgrade_8: "Crocodylidae Bite Force"
 combatagate_upgrade_8_desc: "Crocodiles and Alligators have captured the imagination of men for decades, as their powerful jaws can crush bones without effort. To militarize such a bonecrushing force would be danting, but unexpectedly fruitful. Through serious gene-manipulation, we can grant almost any amalgamate the crushing bite of the Crocodylidae.\n\n"
 combatagate_upgrade_9: "Aquatic Oxygen Processing"
 combatagate_upgrade_9_desc: "Similarly to what batracians' respiratory functions allows, our amalgamates shall be able to breath both in air and underwater. With lungs' width forcefully increased to match these characteristics, we might be able to make the frightening prospect of an amphibian creature able to dive and hide within water a reality.\n\n"
 combatagate_upgrade_10: "Kevlar Dermal Implants"
 combatagate_upgrade_10_desc: "With continued research in the field of body armor, kevlar has become an experiment that caught our attention. While still not promising for individuals, kevlar can be useful for our amalgamate experiments. By implanting kevlar under the skin of our combat amalgamates, we can keep its vital organs save even if the animal was to be (theoretically, of course) skinned alive.\n\n"
 combatagate_upgrade_11: "Streamlined Primordium Recycling"
 combatagate_upgrade_11_desc: "Through careful experimentation, our scientists have been able to create amalgamates that are able to be recycled. By keeping vital cells protected from the most serious war trauma, an amalgamate's corpse can be utilized for the creation of a new amalgamate in a matter of days.\n\n"

 # HARDSUITS #
 hardsuit: "Hardsuits"
 hardsuit_desc: "Developed in 1928 through a joint British-Swedish effort, Hardsuits evolved from the mechanical principles of Automats, with rare Swedish metals enabling the construction of the first human-sized powered armor. Though early suits were bulky and unreliable, they offered unprecedented protection and allowed their pilots to survive extreme environments. However, operating a Hardsuit placed immense strain on the human body and mind, necessitating specialized training, surgery, and genetic enhancement to safely interface with the machine."
 hardsuit_upgrade: "Improved Assault Servos"
 hardsuit_upgrade_desc: "Improved Assault Servos\n\n"
 hardsuit_upgrade2: "Expanded Visual Sensors"
 hardsuit_upgrade2_desc: "Through expanded research on the spectrum of light, science has been able to enable certain parts of the brain of a hardsuit-user, allowing them to view the world in 11 different spectrums of light.\n\n"
 hardsuit_upgrade3: "Automated Health Assessments"
 hardsuit_upgrade3_desc: "Using a range of medical equipment, the hardsuit can keep an eye on the vital organs of its user. Through this mechanic, dangerous wounds can easily be detected early, keeping the user save.\n\n"
 hardsuit_upgrade4: "Improved Radio Transmitters"
 hardsuit_upgrade4_desc: "A rather simple but important upgrade, improving the radio transmitter of the hardsuit allows for more range to coordinate between hardsuit users and the high command.\n\n"
 hardsuit_upgrade5: "Air Conditioning Sensors"
 hardsuit_upgrade5_desc: "As the metal of the hardsuit can, in certain conditions, prove to be useful in other climates, temperature remains a serious issue for the pilote. Through outer sensors, the hardsuit's air conditioning can regulate the temperature of the pilote.\n\n"
 hardsuit_upgrade6: "Kinetic-Resistant Formed Armor"
 hardsuit_upgrade6_desc: "With new insight on kinetics and increasing application of this knowledge in warfare, new designs for the hardsuit often include \"crumpling zones\", designed to keep the pilote and the mechanical wiring of the hardsuit save from kinetic trauma.\n\n"
 
 # RAZORMAIDENS #
 razormaiden_upgrade1: "Combat Infiltrator Module"
 razormaiden_upgrade1_desc: "Designed to be more able in the infiltration behind enemy lines, combat infiltrator modules are special upgrades for razormaidens seeking to act as special ops. Expanding their range of motion, the razormaiden is more able to move silently. \n\n"
 razormaiden_upgrade2: "Rusalka Protocols"
 razormaiden_upgrade2_desc: "Named after the mythological Slavic entities, the Rusalka Protocols are a design philosophy rooted in the idea of femme fatale. Beautiful on the outside yet beyond deadly on the inside, Rusalka-Razormaidens are wonderous warriors on the battlefield, acting as graceful shocktroops.\n\n"
 razormaiden_upgrade3: "Full Body Weaponization"
 razormaiden_upgrade3_desc: "Being behind frontlines is a dangerous job, encircled by enemies on all sides. Razormaidens, however, can be specialized in these situations. Through the wonders of modern engineering, an array of guns, blades, ammo and teleforce propelled bullets can be stored inside their body.\n\n"
 razormaiden_upgrade4: "Chameleonic Gene Splicing"
 razormaiden_upgrade4_desc: "While the Razormaiden is a product of the Automatic revolution, the potential of bio-engineering has not gone unnoticed. As a small step towards further bio-engineering, razormaidens have been augmented with chameleon DNA, allowing these femme fatales to change the colour of their skins to their surroundings.\n\n"
 razormaiden_upgrade5: "Modular Bodily Construction"
 razormaiden_upgrade5_desc: "Standardization is the language of costs. To standardize the entire body of a razormaiden would allow us greater potential, unlocking the ability to replace losses quickly and without trouble, while improving the integrated skin-armor set of the razormaiden.\n\n"
 razormaiden_upgrade6: "Bio-Tech Evolutionary Synthesis"
 razormaiden_upgrade6_desc: "Biological engineering and mechanical engineering are children of the same mother and nowhere can this be clearer than with the razormaidens. Through our mastering of bio-engineering, the razormaidens of today can become paintings of biological and mechanical symbiosis.\n\n"

 # JET TROOPERS #
 jet_trooper_suit: "Jet Trooper Suit"
 jet_troopers: "Jet Troopers"
 jet_troopers_desc: ""
 
 jet_trooper_suit_upgrade1: "Expanded Jet Capacitors"
 jet_trooper_suit_upgrade1_desc: "By using heavily condensed helium instead of the traditional hydrogen-water vapours we are able to store larger quantites of fuel for our Jet Troops to use."
 jet_trooper_suit_upgrade2: "Micro-Missile Launchers"
 jet_trooper_suit_upgrade2_desc: "The light weight micro-missile launcher will make short work of fleshy targets within medium to long ranges, not recommended to be used indoors."
 jet_trooper_suit_upgrade3: "Integrated Comms Systems"
 jet_trooper_suit_upgrade3_desc: "Having every communication device within the Jet Troopers arsenal will mean greater unit capabilities and planning no matter the enviroment or sitation."
 jet_trooper_suit_upgrade4: "Radium Plates"
 jet_trooper_suit_upgrade4_desc: "Radium Plates are the finest lightweight armour choice for any special forces unit to equip themselves with, although it does have the added side effect of causing radiation sickness."
 jet_trooper_suit_upgrade5: "Belt-fed Heavy Weaponary Systems"
 jet_trooper_suit_upgrade5_desc: "Let the big guns do the talking with the newly designed belt-fed heavy weapons systems located just below the arm rack of the Jet suit."
 jet_trooper_suit_upgrade6: "Long Range Thermal Scanners"
 jet_trooper_suit_upgrade6_desc: "With Long Range Thermal Scanners no enemy will be able to hide from our Jet Troopers, no matter how far, small, or cold they may be."

 # GUNSLINGERS/JAGERS #
 gunslingers_tech: "Gunslingers"
 gunslingers_tech_desc: "The Wild West has been home to hardended criminials since the establishment of the colonial regimes in North America. These gunslingers shoot quick and kill quicker making them effective military units amongst the terrain of the mid-west, even if they are typically just hired guns with little political or moral motivations. Or maybe that’s a benefit?"
 gunslingers_tech_1: "8-Shot Revolvers"
 gunslingers_tech_1_desc: "The bigger the cylinder the more lead that can enter our enemies skull, its simple math really."
 gunslingers_tech_2: "Dedicated Supply Wagons"
 gunslingers_tech_2_desc: "With our reliance on these hired guns increasing as the days go by it has become increasingly neccesary that the state provides these units with munitions and rations."
 gunslingers_tech_3: "Engineer Teams"
 gunslingers_tech_3_desc: "Many gunslingers lack basic defense building materials, some don't even have shovels. Let us correct this wrong and provide them with what they desperately need."
 gunslingers_tech_4: "XL Water Packs"
 gunslingers_tech_4_desc: "Canteens simply can't hold enough water to sustain our gunslingers amongst the brutal heat of the American Mid-West, larger Water Packs will be neccesary if we plan on maintaining large numbers of Gunslingers."
 gunslingers_tech_5: "Makeshift AP Rounds"
 gunslingers_tech_5_desc: "While the Wild West is home to many makeshift materials none are more popular than the American made AP rounds, of which originate somewhere around Boomtown. These bullets pack a bigger punch than the standard calibre and can easily penetrate thin armour types."
 gunslingers_tech_6: "Looter Teams"
 gunslingers_tech_6_desc: "By establishing dedicated 'looter' teams our hired guns will be more efficient in raiding urban settlements and even major cities."
 gunslingers_tech_7: "Kelly Armour"
 gunslingers_tech_7_desc: "The enduring legacy of Ned Kelly has fruited various advancements in Cowboy military technology. The most influential advancement that Kelly offered the Wild West was his signature metal plated armour, something that has become widely adopted throughout the Wild West."
 gunslingers_tech_8: "Horseback Onslaught Tactics"
 gunslingers_tech_8_desc: "Many gunslingers travel on horseback but there efficiency is questionable at best, at least in terms of discipline. We can integrate their love of speed with traditional cavarly tactics to make them a formidable force."

 PB_can_research_gunslingers_tt: "Is eligible to research Gunslingers technology"
 
 
 jager_tech: "Sturmtruppe Infantry"
 jager_tech_desc: "Jägers in Germany, Corps Francs in France, Arditis in Italy... The Great War may have been a bloody and painful experience for most, but birthed a legacy of heroes and hothead on rare occasion. Those bold enough to fight and hunt through the mud of Verdun and the forests of the Ardennes would soon be organized into specialized units skilled in both deep strike and frontal assault.\n\nNowadays refered to as Sturmtruppe Infantry, these highly-trained units excel in securing key locations and dislodging entrenched opponents alike."
