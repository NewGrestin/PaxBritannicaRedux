 ## HEAVY AIRFRAMES ##
 heavy_airframe: "Heavy Airframe"
 heavy_airframe_desc: "Heavy Airframe based planes"

 large_plane_airframe: "$strat_bomber_equipment$"
 large_plane_airframe_desc: "A large airframe with plenty of space, capable of mounting up to six engines and carrying large payloads over long distances."
 large_plane_airframe_0: "Inter-War Large Airframe"
 large_plane_airframe_0_desc: "This very large airframe has plenty of space to carry bombs or fluel tanks. However, it is clear that its development potential is severely limited. New generations of strategic bombers are already on the horizon."
 large_plane_airframe_1: "Basic Large Airframe"
 large_plane_airframe_1_desc: "This airframe was designed to test the potential of a true strategic bomber, able to attack industrial targets deep inside enemy territory, and bring its crew back alive."
 large_plane_airframe_2: "Improved Large Airframe"
 large_plane_airframe_2_desc: "With the concept of a strategic bomber now well proven, this airframe was designed to improve payload and range, while having sufficent potential for future growth."
 large_plane_airframe_3: "Advanced Large Airframe"
 large_plane_airframe_3_desc: "Optimized for very long range flying at very high altitude, this airframe is capable of carrying a sizable payload deep into the heart of enemy territory."
 large_plane_airframe_4: "Modern Large Airframe"
 large_plane_airframe_4_desc: "Jet propulsion offers a quantum leap in performance. This airframe was designed to take advantage of this."

 large_plane_maritime_patrol_plane_airframe: "Naval Patrol Bomber"
 large_plane_maritime_patrol_plane_airframe_desc: "$large_plane_airframe_desc$"
 large_plane_maritime_patrol_plane_airframe_0: "Inter-War Maritime Patrol Airframe"
 large_plane_maritime_patrol_plane_airframe_0_desc: "The fleet needs long-ranged planes to find their enemies far from shore. While somewhat outdated, this airframe offers the necessary range to cover large stretches of ocean."
 large_plane_maritime_patrol_plane_airframe_1: "Basic Maritime Patrol Airframe"
 large_plane_maritime_patrol_plane_airframe_1_desc: "The advent of more powerful carrier planes makes it necessary to find and destroy enemy fleets far from shore. The first step for this is to find them far out in the ocean, necessitating a new type of plane."
 large_plane_maritime_patrol_plane_airframe_2: "Improved Maritime Patrol Airframe"
 large_plane_maritime_patrol_plane_airframe_2_desc: "The dual threat of submarines and raiding cruisers requires patrolling vast stretches of ocean. This airframe is optimized for this."
 large_plane_maritime_patrol_plane_airframe_3: "Advanced Maritime Patrol Airframe"
 large_plane_maritime_patrol_plane_airframe_3_desc: "Radar and other sensors make it possible to find enemy fleets even in poor weather or dark nights, but all the new equipment requires a bigger airframe to carry it."
 large_plane_maritime_patrol_plane_airframe_4: "Modern Maritime Patrol Airframe"
 large_plane_maritime_patrol_plane_airframe_4_desc: "With the dawn of the missile age, maritime patrol planes must be capable of operating even further from shore, and for longer durations."

 ### ROTARY AIRCRAFTS ###
 ## SCOUT HELICOPTERS ##
 scout_helicopter: "Scout Helicopter"
 scout_helicopter_desc: "After the Great War, it became apparent that small helicopters were ideally suited for aerial reconnaissance. Specifically designed to be as lightweight as possible by eliminating unnecessary components and reducing rotor noise, these aircraft evolved into small and fast scout helicopters capable of carrying a pilot and, in some cases, a second crew member."

 scout_helicopter_equipment_0: "Early Helicopter Designs"
 scout_helicopter_equipment_0_desc: "First iterations of a vertically ascending aircraft. Known as helicopters, these machines first entered production in the second half of the Great War.\nCalled “buzzards” by Americans and the British, they played an important role during Operation Overlord and the battles in Italy. They were primarily used as reconnaissance assets, but experiments were also conducted with mounting weapons and transporting supplies."
 scout_helicopter_equipment_1: "Basic Scout Helicopter"
 scout_helicopter_equipment_1_desc: "$scout_helicopter_desc$"
 scout_helicopter_equipment_2: "Improved Scout Helicopter"
 scout_helicopter_equipment_2_desc: "$scout_helicopter_desc$"
 scout_helicopter_equipment_3: "Advanced Scout Helicopter"
 scout_helicopter_equipment_3_desc: "$scout_helicopter_desc$"

 ## TRANSPORT HELICOPTERS ##
 transport_helicopter: "Transport Helicopter"
 transport_helicopter_desc: "Engineers decided to significantly enlarge the helicopter, often adding an additional engine. Various tandem configurations helped these aircraft carry larger numbers of troops, supplies, or even defensive armament within their cargo compartments.\nDesigned with long-range operations in mind, these helicopters sacrificed speed in favor of endurance and payload capacity. Their effectiveness was demonstrated in the smaller conflicts of the 1910s and 1920s."

 transport_helicopter_equipment_1: "Basic Transport Helicopter"
 transport_helicopter_equipment_1_desc: "$transport_helicopter_desc$"
 transport_helicopter_equipment_2: "Improved Transport Helicopter"
 transport_helicopter_equipment_2_desc: "$transport_helicopter_desc$"
 transport_helicopter_equipment_3: "Advanced Transport Helicopter"
 transport_helicopter_equipment_3_desc: "$transport_helicopter_desc$"

 ## ATTACK HELICOPTERS ##
 attack_helicopter: "Attack Helicopter"
 attack_helicopter_desc: "Only relatively recently, in the late 1920s, engineers succeeded in developing an effective attack helicopter. The pilot and an additional crew member are capable of delivering fairly effective fire from onboard weapons, primarily machine guns mounted in the fuselage or carried on external mounts. These aircraft can also provide support to ground forces through externally mounted bombs or, more rarely, bombs carried in an internal bomb bay."

 attack_helicopter_equipment_1: "Basic Attack Helicopter"
 attack_helicopter_equipment_1_desc: "$attack_helicopter_desc$"
 attack_helicopter_equipment_2: "Improved Attack Helicopter"
 attack_helicopter_equipment_2_desc: "$attack_helicopter_desc$" 
 attack_helicopter_equipment_3: "Advanced Attack Helicopter"
 attack_helicopter_equipment_3_desc: "$attack_helicopter_desc$"

 ## NAVAL HELICOPTERS ##
 naval_helicopter: "Naval Helicopter"
 naval_helicopter_desc: "By far the rarest, though gradually gaining popularity, is this type of helicopter. It is designed for operations over bodies of water, focusing on detecting and engaging both surface and submerged units through the use of depth charges and torpedoes. Due to the nature of their onboard weaponry and payload requirements, these are among the largest helicopters in service."

