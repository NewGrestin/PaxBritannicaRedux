 ## MODULES ##
 # ENGINES #
 engine_1_1x: "1x Engine I"
 engine_1_1x_desc: "This basic engine is reliable and cheap, but not particularly powerful."
 engine_1_2x: "2x Engine I"
 engine_1_2x_desc: "Twin engines give the plane a significant increase in thrust, but at a cost."
 engine_1_3x: "3x Engine I"
 engine_1_3x_desc: "Three engines give more thrust than a pair of them, without the additional cost of a fourth engine."
 engine_1_4x: "4x Engine I"
 engine_1_4x_desc: "A quartet of engines provides enough thrust to lift a heavy plane and allow it to carry a significant payload."
 engine_1_6x: "6x Engine I"
 engine_1_6x_desc: "With six engines, any plane can be made to carry a significant payload over a long range, at a decent speed.
 engine_1_8x: "8x Engine I"
 engine_1_8x_desc: "Eight engines allow the largest aircrafts to rise along with a significant payload."
 engine_2_1x: "1x Engine II"
 engine_2_1x_desc: "A larger and more powerful engine allows for higher speed and greater payload."
 engine_2_2x: "2x Engine II"
 engine_2_2x_desc: "$engine_1_2x_desc$"
 engine_2_3x: "3x Engine II"
 engine_2_3x_desc: "$engine_1_3x_desc$"
 engine_2_4x: "4x Engine II"
 engine_2_4x_desc: "$engine_1_4x_desc$"
 engine_2_6x: "6x Engine II"
 engine_2_6x_desc: "$engine_1_6x_desc$"
 engine_2_8x: "8x Engine II"
 engine_2_8x_desc: "$engine_1_8x_desc$"
 engine_3_1x: "1x Engine III"
 engine_3_1x_desc: "Incorporating advanced features such as methanol-injection and automatic mixture, this engine is able to put out significantly more power."
 engine_3_2x: "2x Engine III"
 engine_3_2x_desc: "$engine_1_2x_desc$"
 engine_3_3x: "3x Engine III"
 engine_3_3x_desc: "$engine_1_3x_desc$"
 engine_3_4x: "4x Engine III"
 engine_3_4x_desc: "$engine_1_4x_desc$"
 engine_3_6x: "6x Engine III"
 engine_3_6x_desc: "$engine_1_6x_desc$"
 engine_3_8x: "8x Engine III"
 engine_3_8x_desc: "$engine_1_8x_desc$"
 engine_4_1x: "1x Engine IV"
 engine_4_1x_desc: "With extensive engineering to capitalize on every possible performance boost, this engine represents the absolute pinnacle of piston-driven engine technology."
 engine_4_2x: "2x Engine IV"
 engine_4_2x_desc: "$engine_1_2x_desc$"
 engine_4_3x: "3x Engine IV"
 engine_4_3x_desc: "$engine_1_3x_desc$"
 engine_4_4x: "4x Engine IV"
 engine_4_4x_desc: "$engine_1_4x_desc$"
 engine_4_6x: "6x Engine IV"
 engine_4_6x_desc: "$engine_1_6x_desc$"
 engine_4_8x: "8x Engine IV"
 engine_4_8x_desc: "$engine_1_8x_desc$"

 jet_engine_1x: "1x Jet Engine"
 jet_engine_1x_desc: "With a completely different approach to powering an airplane, this complex and temperamental engine still offers a large increase in thrust and speed."
 jet_engine_2x: "2x Jet Engine"
 jet_engine_2x_desc: "$engine_1_2x_desc$"
 jet_engine_3x: "3x Jet Engine"
 jet_engine_3x_desc: "$engine_1_3x_desc$"
 jet_engine_4x: "4x Jet Engine"
 jet_engine_4x_desc: "$engine_1_4x_desc$"
 jet_engine_6x: "6x Jet Engine"
 jet_engine_6x_desc: "$engine_1_6x_desc$"
 jet_engine_8x: "8x Jet Engine"
 jet_engine_8x_desc: "$jet_engine_1x_desc$"

 jet_engine_axial_1x: "1x Axial Jet Engine"
 jet_engine_axial_1x_desc: "Mounting multiple compressors, one after another the Axial Engine is able to multiply the amount of thrust generated by a simple single-stage jet engine."
 jet_engine_axial_2x: "2x Axial Jet Engine"
 jet_engine_axial_2x_desc: "$engine_1_2x_desc$"
 jet_engine_axial_3x: "3x Axial Jet Engine"
 jet_engine_axial_3x_desc: "$engine_1_3x_desc$"
 jet_engine_axial_4x: "4x Axial Jet Engine"
 jet_engine_axial_4x_desc: "$engine_1_4x_desc$"
 jet_engine_axial_6x: "6x Axial Jet Engine"
 jet_engine_axial_6x_desc: "$engine_1_6x_desc$"
 jet_engine_axial_8x: "8x Axial Jet Engine"
 jet_engine_axial_8x_desc: "$engine_1_8x_desc$"

 rocket_engine_1: "Rocket Engine I"
 rocket_engine_1_desc: "Utilizing a number of very volatile fuels and a similarly unstable oxidizer, this engine is capable of putting out a very large amount of thrust to propel a plane to high speeds, at the cost of range."
 rocket_engine_2: "Rocket Engine II"
 rocket_engine_2_desc: "Improvements in the combustion chamber and slight alterations in the fuel mixture allow even higher performance, with a corresponding drop in range."
 rocket_engine_3: "Rocket Engine III"
 rocket_engine_3_desc: ""

 # ARMAMENT #
 light_mg_2x: "2x Light Machine Gun"
 light_mg_2x_desc: "A set of two rifle-caliber machine guns gives a little added firepower against air targets for a very moderate cost."
 light_mg_4x: "4x Light Machine Gun"
 light_mg_4x_desc: "What this set of four rifle-caliber weapons lacks in destructiveness, it makes up for in sheer volume."
 heavy_mg_2x: "2x Heavy Machine Gun"
 heavy_mg_2x_desc: "A pair of heavy machine guns allows penetrating the toughened outer skin of modern airplanes."
 heavy_mg_4x: "4x Heavy Machine Gun"
 heavy_mg_4x_desc: "A quartet of heavy machineguns offers terrifying firepower, both in individual performance and in sheer volume of fire."
 aircraft_cannon_1_1x: "1x Cannon I"
 aircraft_cannon_1_1x_desc: "An automatic cannon offers a significant amount of firepower against air targets, but the added weight makes the plane both slower and less maneuverable."
 aircraft_cannon_1_2x: "2x Cannon I"
 aircraft_cannon_1_2x_desc: "Two automatic cannons give a plane a fearsome forward-firing armament against air and soft ground targets, at considerable cost in weight and agility."
 aircraft_cannon_2_1x: "1x Cannon II"
 aircraft_cannon_2_1x_desc: "A modern cannon firing a large shell at high velocity, this weapon can bring down even fighters and strategic bombers all the same."
 aircraft_cannon_2_2x: "2x Cannon II"
 aircraft_cannon_2_2x_desc: "Twin cannons give a plane a significant amount of punch, while the increased volume of fire makes scoring crippling hits even easier."
 large_aircraft_cannon_1x: "1x Large Cannon"
 large_aircraft_cannon_1x_desc: "Firing a larger and more powerful shell than previous iterations of autocannons but at slower velocities, this weapon can bring down even a large airframe in a single hit."
 large_aircraft_cannon_2x: "2x Large Cannon"
 large_aircraft_cannon_2x_desc: "Twin cannons give a plane a significant amount of punch, while the increased volume of fire makes scoring crippling hits even easier."
 rotary_cannon_1x: "1x Rotary Cannon"
 rotary_cannon_1x_desc: "Small caliber rotary cannons mounted in the fuselage of advanced aircraft. Highly effective."
 rotary_cannon_2x: "2x Rotary Cannon"
 rotary_cannon_2x_desc: "Small caliber rotary cannons mounted in the fuselage of advanced aircraft. Highly effective."
 fighter_rocket_rails: "Fighter Rocket Rails"
 fighter_rocket_rails_desc: "Unguided missiles hung under the wings. It's hard to aim them at a target flying at high speed, but if they do hit, destruction of the enemy aircraft is almost guaranteed."
 homing_missile: "Homing Missile"
 homing_missile_desc: "Thermally guided air-to-air missile with rocket propulsion. It is guided by the heat generated by the flying vehicle. It is very difficult to dodge it, however, a trained pilot should be able to manage without any problems with the help of maneuvers."

 tank_buster_1: "Anti-Tank Cannon I"
 tank_buster_1_desc: "Adapted from an anti-tank gun used by the Army, this gun can destroy even modern tanks with well-placed shots. However, its heavy weight and awkward construction severely limit the aircraft's performance."
 tank_buster_2: "Anti-Tank Cannon II"
 tank_buster_2_desc: "The heavier tanks now in service require a much larger gun to combat. While extremely heavy and unwieldy, it is very capable as a weapon for attacks against enemy positions."
 large_rotary_cannon: "Large Rotary Cannon"
 large_rotary_cannon_desc: "High caliber rotary cannon using incendiary or explosive rounds. Lethal to anything on the ground. A known fact is that if you managed to hear its sound then you were not targeted."
 rocket_rails: "Rocket Rails"
 rocket_rails_desc: "Unguided projectiles hung under the wings. Since they are fired ahead of the attacking plane, it is a lot easier for the pilot to aim them at the target compared to bombs."

 bomb_locks: "Bomb Locks"
 bomb_locks_desc: "Mountings for small bombs under the wings or the fuselage allow the plane to attack ground targets with some hope of success."
 armor_piercing_bomb_locks: "Armor Piercing Bomb Locks"
 armor_piercing_bomb_locks_desc: "Mountings for large armor piercing bombs under the wings or the fuselage allow the plane to attack Naval targets with great effect."
 incendiary_bomb_locks: "Incendiary Bomb Locks"
 incendiary_bomb_locks_desc: "Mountings for small incendiary bombs under the wings or the fuselage allow the plane to attack ground targets with some hope of success."
 heavy_bomb_locks: "Heavy Bomb Locks"
 heavy_bomb_locks_desc: "Mountings for large bombs under the wings or the fuselage allow the plane to attack ground targets with great effect."
 guided_anti_tank_bomb: "Guided Anti-Landship Bomb"
 guided_anti_tank_bomb_desc: "An anti-landship bomb with a rocket engine. It is guided by radio waves. Highly accurate and deadly."

 small_bomb_bay: "Small Bomb Bay"
 small_bomb_bay_desc: "A small bay to carry bombs. Being inside the fuselage reduces drag, but the structural changes necessary for it mean the plane can not do radical maneuvers in air combat."
 medium_bomb_bay: "Medium Bomb Bay"
 medium_bomb_bay_desc: "A mid-sized bomb bay allows carrying enough ordnance to strike a wide variety of targets."
 large_bomb_bay: "Large Bomb Bay"
 large_bomb_bay_desc: "A large bay to carry enough ordnance to damage or destroy even extensive factories and other hard targets."
 small_incendiary_bomb_bay: "Small Incendiary Bomb Bay"
 small_incendiary_bomb_bay_desc: "A small bay to carry incendiary bombs. Being inside the fuselage reduces drag, but the structural changes necessary for it mean the plane can not do radical maneuvers in air combat."
 medium_incendiary_bomb_bay: "Medium Incendiary Bomb Bay"
 medium_incendiary_bomb_bay_desc: "A mid-sized bomb bay allows carrying enough ordinace to burn a wide variety of targets."
 large_incendiary_bomb_bay: "Large Incendiary Bomb Bay"
 large_incendiary_bomb_bay_desc: "A large bay to carry enough ordinace to burn and destroy even the biggest cities and farms."

 earthshaker_bomb_release: "Earthshaker Bomb Release Mechanism"
 earthshaker_bomb_release_desc: "A bomb rack and release mechanism for the gigantic earthshaker bombs that are designed to penetrate the ground on impact and explode underground, causing great structural damage to their target."
 rocket_propelled_bombs: "Rocket Propelled Bombs"
 rocket_propelled_bombs_desc: "Rocket propelled unguided bombs can inflict considerable damage on ships and similar armoured larger targets."
 improved_rocket_propelled_bombs: "Heavy Rocket Propelled Bombs"
 improved_rocket_propelled_bombs_desc: "Even larger rocket propelled unguided bombs, carrying a heavier payload, able to penetrate their targets even more effectively."

 torpedo_mounting: "Light Torpedo Mountings"
 torpedo_mounting_desc: "Hardpoints to allow a lightweight torpedo to be mounted under the fuselage. This gives the plane a potent weapon to use against enemy ships."
 torpedo_mounting_2: "Medium Torpedo Mountings"
 torpedo_mounting_2_desc: "Hardpoints to allow a Medium weight torpedo to be mounted under the fuselage. This gives the plane a potent weapon to use against enemy ships."
 torpedo_mounting_3: "Heavy Torpedo Mountings"
 torpedo_mounting_3_desc: "Hardpoints to allow a heavy weight torpedo to be mounted under the fuselage. This gives the plane a potent weapon to use against enemy ships."
 guided_anti_ship_missile: "Guided Anti-Ship Missile"
 guided_anti_ship_missile_desc: "Effectively an anti-ship bomb with a rocket engine and radio guidance, this new weapon of war is a serious threat to all ships currently afloat."

 recon_camera: "Recon Camera"
 recon_camera_desc: "A set of cameras with special lenses, allowing the plane to take accurate pictures of enemy formations and installations even from high altitude."
 airdropped_mines: "Airdropped Mines"
 airdropped_mines_desc: "A set of naval mines equipped with a parachute, which allows them to be dropped from a plane."
 demining_coil: "Demining Coil"
 demining_coil_desc: "A large coil mounted on the airframe allows the plane to project a powerful magnetic field, which causes magnetic mines in its flightpath to explode."
 fixed_explosive_charge: "Fixed Explosive Charge"
 fixed_explosive_charge_desc: "A fixed hollow charge turns the plane into a flying bomb. If the plane is steered into an enemy ship, it would cause dramatic destruction, but at the cost of the plane and the crew both being lost."

 # SPECIAL MODULES #
 armor_plate_small: "Armor Plates"
 armor_plate_small_desc: "Steel plating behind the pilot seat and around the engine give the plane increased survivability against ground fire and attacks from behind."
 armor_plate_medium: "$armor_plate_small$"
 armor_plate_medium_desc: "Armor around the engines and the more fragile parts of the fuselage gives the plane significantly better survivability, at the cost of range."
 armor_plate_large: "$armor_plate_small$"
 armor_plate_large_desc: "Extensive steel plating protects the engines, fuel tanks, and the crew compartment to allow the plane to shrug off anything but a direct hit from anti-aircraft fire, as well as making it a very tough target for fighters to shoot down."

 non_strategic_materials_small: "Non-Strategic Materials Usage"
 non_strategic_materials_small_desc: "By substituting specially-treated wood or fabric for aluminum wherever possible, we can drastically reduce the usage of strategic materials. However, wood and fabric don't stand up very well to modern weapons."
 non_strategic_materials_medium: "$non_strategic_materials_small$"
 non_strategic_materials_medium_desc: "$non_strategic_materials_small_desc$"
 non_strategic_materials_large: "$non_strategic_materials_small$"
 non_strategic_materials_large_desc: "$non_strategic_materials_small_desc$"
 floats: "Floats"
 floats_desc: "A set of floatation devices mounted under the airframe allows the plane to land on water. This makes scouting missions for enemy naval assets easier, but also drastically reduces agility."
 flying_boat_medium: "Flying Boat"
 flying_boat_medium_desc: "Instead of mounting a landing gear, the underside of the plane can be shaped to be able to land on water. This makes scouting missions over water much easier."
 flying_boat_large: "$flying_boat_medium$"
 flying_boat_large_desc: "$flying_boat_medium_desc$"

 dive_brakes_small: "Dive Brakes"
 dive_brakes_small_desc: "A set of spoilers along the trailing edge of the wing deploy when the plane enters a dive, reducing overall speed and allowing the plane to pull out of steep dives without ripping its wings off. This, in turn, allows the plane to attack from a near-vertical dive, drastically increasing accuracy."
 drop_tanks: "Drop Tanks"
 drop_tanks_desc: "Small, disposable tanks that hold extra fuel give our fighters some extra range when on offensive missions. Since they are dropped before combat, they don't impede combat performance."

 fuel_tanks_small: "Extra Fuel Tanks"
 fuel_tanks_small_desc: "Devoting more internal space of the airframe for fuel increases the plane's range, but it also makes the plane a lot more flammable."
 fuel_tanks_medium: "$fuel_tanks_small$"
 fuel_tanks_medium_desc: "$fuel_tanks_small_desc$"
 fuel_tanks_large: "$fuel_tanks_small$"
 fuel_tanks_large_desc: "$fuel_tanks_small_desc$"
 self_sealing_fuel_tanks_small: "Self-Sealing Fuel Tanks"
 self_sealing_fuel_tanks_small_desc: "By adding a layer of specially-treated rubber around the fuel tanks, a hit to the fuel tank does not cripple an airplane as the tank will seal itself over time, preventing loss of fuel."
 self_sealing_fuel_tanks_medium: "$self_sealing_fuel_tanks_small$"
 self_sealing_fuel_tanks_medium_desc: "$self_sealing_fuel_tanks_small_desc$"
 self_sealing_fuel_tanks_large: "$self_sealing_fuel_tanks_small$"
 self_sealing_fuel_tanks_large_desc: "$self_sealing_fuel_tanks_small_desc$"

 lmg_defense_turret: "Light MG Defense Turret"
 lmg_defense_turret_desc: "While somewhat underpowered for air-to-air combat, a light machine gun in a turret will make any attack against this plane a more dangerous undertaking."
 lmg_defense_turret_2x: "Light MG Defense Turret 2x"
 lmg_defense_turret_2x_desc: "A set of two light machine guns in electrically-powered turrets cover more angles and make the plane a much harder target to attack."
 hmg_defense_turret: "Heavy MG Defense Turret"
 hmg_defense_turret_desc: "A heavy machine gun in a rotating turret allows the defender to fight back against a fighter armed with similar weapons with some hope of success."
 hmg_defense_turret_2x: "Heavy MG Defense Turret 2x"
 hmg_defense_turret_2x_desc: "A set of two powered turrets with heavy machine guns present any attacking fighter with a dangerous target."
 cannon_defense_turret: "Cannon Defense Turret"
 cannon_defense_turret_desc: "A modern cannon in a traversable turret significantly alters the balance of power between the defender and the attacker in air combat. Few fighters can withstand a direct hit from a modern cannon and continue to fight."
 cannon_defense_turret_2x: "Cannon Defense Turret 2x"
 cannon_defense_turret_2x_desc: "Two turrets armed with automatic cannons give the plane a fearsome defensive punch that would make any fighter attack on it a very dangerous prospect indeed."

 bomb_sights_1: "Bomb Sights I"
 bomb_sights_1_desc: "A complex mechanical computer that takes into account wind drift, terminal velocity and altitude allows the bombardier to drop bombs with a high degree of accuracy."
 bomb_sights_2: "Bomb Sights II"
 bomb_sights_2_desc: "Where previous generations of bomb sights often required a lengthy set-up process before they arrived at their targeting solutions, this fully stabilized bomb sight only takes a few seconds and can even compensate for shallow dives."
 bomb_sights_3: "Bomb Sights III"
 bomb_sights_3_desc: "An advanced stabilized sight with automatic corrections for aircraft motion and changing flight conditions allows accurate bombing during high-speed and less predictable attack runs."

 radio_navigation_1: "Radio Navigation I"
 radio_navigation_1_desc: "A radio receiver listening for the crossing of two fairly simple radio-navigation beams, making it possible to find a target even in perfect darkness."
 radio_navigation_2: "Radio Navigation II"
 radio_navigation_2_desc: "A radio receiver that also includes a number of distance measuring aides, telling the bombardier the exact moment that the bombs should be released, even if he can not see the target."
 radio_navigation_3: "Radio Navigation III"
 radio_navigation_3_desc: "An advanced radio-navigation receiver combines multiple beacons and precise distance measurements, allowing the bombardier to determine the aircraft's position and release bombs accurately without visual contact."

 air_ground_radar_1: "Air-Ground Radar I"
 air_ground_radar_1_desc: "An airborne radar set that gives the navigator an accurate picture of the surface below the plane, allowing for precise navigation even in darkness or bad weather."
 air_ground_radar_2: "Air-Ground Radar II"
 air_ground_radar_2_desc: "With a higher resolution than previous models, this radar set allows precision bombardment even through cloud cover."
 air_ground_radar_3: "Air-Ground Radar III"
 air_ground_radar_3_desc: "An advanced radar set provides a detailed picture of ground features and installations, allowing the crew to identify and accurately attack targets through cloud cover and poor visibility."

 air_air_radar_1: "Air-Air Radar I"
 air_air_radar_1_desc: "A set of radar antennas on the airplane allows a trained operator to find an airborne target even in darkness."
 air_air_radar_2: "Air-Air Radar II"
 air_air_radar_2_desc: "With a more powerful transmitter, this radar set can detect targets over a longer distance."
 air_air_radar_3: "Air-Air Radar III"
 air_air_radar_3_desc: "Improved antenna arrays and signal processing provide more reliable detection and tracking of airborne targets at greater distances, even in poor visibility and amid ground interference."

air_iff_1: "IFF Transporder I"
air_iff_1_desc: "A basic transponder system allows equipped aircraft to identify themselves to friendly radar operators, helping distinguish friendly aircraft from unknown contacts."
air_iff_2: "IFF Transporder II"
air_iff_2_desc: "Improved transponders provide more reliable identification and faster responses, helping friendly forces distinguish their aircraft from unknown contacts during crowded engagements."
air_iff_3: "IFF Transporder III"
air_iff_3_desc: "Advanced identification equipment uses more sophisticated electronic responses to improve recognition reliability and reduce confusion during large-scale air operations."
air_ecm: "Electronic Countermeasures"
air_ecm_desc: "Electronic jamming equipment interferes with enemy radar detection and tracking, making aircraft harder to locate and engage in hostile airspace."