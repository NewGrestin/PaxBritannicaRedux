 ## LANDSHIP MODULES ##
 # ENGINES #
 tank_steam_engine: "Steam Engine"
 tank_steam_engine_desc: "Engine from the previous era powered by the steam, generate enough power to somehow move the armored vehicle."
 tank_gasoline_engine: "Gasoline Engine"
 tank_gasoline_engine_desc: "An Engine running on gasoline will be faster for a given Engine Size, but the fuel will be much more prone to catching fire."
 tank_diesel_engine: "Diesel Engine"
 tank_diesel_engine_desc: "An Engine running on Diesel fuel is more reliable than a gasoline engine, but not as fast for the same Engine Size."
 tank_petrol_electric_engine: "Petrol-Electric Engine"
 tank_petrol_electric_engine_desc: "A combination of a petrol-driven engine providing power to an electric motor. Complex, expensive and unreliable, it does however offer unmatched performance in tactical movements."
 tank_gas_turbine_engine: "Gas Turbine"
 tank_gas_turbine_engine_desc: "A turbine developed from jet engines. High fuel consumption, but the highest speed of any engine at a given Engine Size."

 # ARMOR #
 tank_makeshift_armor: "Makeshift Armor"
 tank_makeshift_armor_desc: "Armor made with every metal sheet that could be used and afforded to provide some defense."
 tank_riveted_armor: "Riveted Armor"
 tank_riveted_armor_desc: "Armor Plates bolted to the frame and held together by rivets driven into the edges. A very proven technology that is fairly cheap, but the rivetted edges provide weakpoints in the armor and might hurt the crew if the rivets are hit."
 tank_cast_armor: "Cast Armor"
 tank_cast_armor_desc: "The entire Chassis, including armor, is cast as a single unit. An expensive and time-consuming process that allows for much thicker armor with fewer weakpoints."
 tank_welded_armor: "Welded Armor"
 tank_welded_armor_desc: "Armor plates are welded to the chassis. A faster process than casting, while still providing good protection."
 tank_composite_armor: "Composite Armor"
 tank_composite_armor_desc: "Armor consisting of layers of different materials. Protection of this type is lighter than other types but the overall volume of the armor is greater."
 tank_em_reactive_armor: "EM Reactive Armor"
 tank_em_reactive_armor_desc: "Reactive armor is composed of multiple blocks that reduce the damage from projectiles hitting it. In addition, the electromagnetic field is capable of slowing down a projectile in flight or completely neutralize the danger."
 
 # SUSPENSION #
 tank_torsion_bar_suspension: "Torsion Bar"
 tank_torsion_bar_suspension_desc: "A fairly reliable suspension system of metal bars fixed to the vehicle chassis that provides a smoother ride than other suspension types."
 tank_christie_suspension: "Christie Suspension"
 tank_christie_suspension_desc: "Developed by an American inventor, this suspension allows for exceptionally high speeds."
 tank_bogie_suspension: "Bogie Suspension"
 tank_bogie_suspension_desc: "A simple and fairly cheap type of suspension in which the roadwheels are mounted individually, allowing them to be easily replaced if damaged."
 tank_interleaved_suspension: "Interleaved Roadwheels"
 tank_interleaved_suspension_desc: "By overlapping the roadwheels, more of them can be fit in the same length of the hull, thereby improving mobility as well as providing some additional protection in the flanks."
 tank_hydropneumatic_suspension: "Hydropneumatic Suspension"
 tank_hydropneumatic_suspension_desc: "By combining the benefits of pneumatics and hydraulics, this type of suspension achieves an efficient ride even in the harshest conditions."

 tank_wheeled_suspension: "Wheeled Suspension"
 tank_wheeled_suspension_desc: "Derived from a truck chassis, this suspension is very limited in its carrying capacity and has limited cross-country performance, but has the advantage of being very cheap to make."
 tank_half_track_suspension: "Half-track Suspension"
 tank_half_track_suspension_desc: "A hybrid between a fully-tracked vehicle and a regular wheeled suspension, this setup has a pair of wheels up front for steering and a tracked rear axle to improve cross-country performance. While limited in its carrying capacity, it is still cheaper than a fully-tracked design."

 # TURRET #
 fixed_superstructure_desc: "A fixed superstructure only allows the main armament to traverse in a small arc without turning the entire vehicle. However, it allows the vehicle to mount a bigger armament while being overall of smaller size, making the vehicle perfect for ambushes."
 one_man_turret_desc: "A small turret barely large enough to hold a single crew member, who is tasked with aiming and loading the main armament as well as keeping watch for targets and threats."
 two_man_turret_desc: "A turret that allows for two crew members to share the work of operating the armament and observing the situation. It still does not allow for an effective division of labor amongst the crew."
 three_man_turret_desc: "A turret big enough for the three crew members to divide the tasks of loading and aiming the main armament as well as staying aware of the situation around them."
 four_man_turret_desc: "A massive turret with additional space for a second loader to service the main gun."

 tank_makeshift_turret: "Makeshift Turret"
 tank_makeshift_turret_desc: "It can house a gun and rotate at a limited angles."
 tank_front_plate_turret: "Front-Plated Gun Mount"
 tank_front_plate_turret_desc: "A simple gun mount protected by a frontal armor plate, providing basic protection without the weight of an enclosed turret."
 tank_platform_turret: "Open Gun Platform"
 tank_platform_turret_desc: "An exposed gun platform offers ample space for larger weapons and easy access for the crew, at the cost of protection from enemy fire."
 tank_tankette_fixed_superstructure_turret: "Crawler Fixed Superstructure"
 tank_tankette_fixed_superstructure_turret_desc: "A compact, fixed gun housing usen in Gun Crawlers designs provides modest protection and a low profile, but limits the gun's traverse."
 tank_light_one_man_tank_turret: "One Man Turret"
 tank_light_one_man_tank_turret_desc: "$one_man_turret_desc$"
 tank_light_two_man_tank_turret: "Two Man Turret"
 tank_light_two_man_tank_turret_desc: "$two_man_turret_desc$"
 tank_light_three_man_tank_turret: "Three Man Turret"
 tank_light_three_man_tank_turret_desc: "$three_man_turret_desc$"
 tank_light_fixed_superstructure_turret: "Light Fixed Superstructure"
 tank_light_fixed_superstructure_turret_desc: "$fixed_superstructure_desc$"
 tank_medium_one_man_tank_turret: "$tank_light_one_man_tank_turret$"
 tank_medium_one_man_tank_turret_desc: "$one_man_turret_desc$"
 tank_medium_two_man_tank_turret: "$tank_light_two_man_tank_turret$"
 tank_medium_two_man_tank_turret_desc: "$two_man_turret_desc$"
 tank_medium_three_man_tank_turret: "$tank_light_three_man_tank_turret$"
 tank_medium_three_man_tank_turret_desc: "$three_man_turret_desc$"
 tank_medium_fixed_superstructure_turret: "Medium Fixed Superstructure"
 tank_medium_fixed_superstructure_turret_desc: "$fixed_superstructure_desc$"
 tank_heavy_two_man_tank_turret: "$tank_light_two_man_tank_turret$"
 tank_heavy_two_man_tank_turret_desc: "$two_man_turret_desc$"
 tank_heavy_three_man_tank_turret: "$tank_light_three_man_tank_turret$"
 tank_heavy_three_man_tank_turret_desc: "$three_man_turret_desc$"
 tank_heavy_fixed_superstructure_turret: "Heavy Fixed Superstructure"
 tank_heavy_fixed_superstructure_turret_desc: "$fixed_superstructure_desc$"
 tank_super_heavy_four_man_tank_turret: "Four Man Turret"
 tank_super_heavy_four_man_tank_turret_desc: "$four_man_turret_desc$"
 tank_super_heavy_three_man_tank_turret: "$tank_light_three_man_tank_turret$"
 tank_super_heavy_three_man_tank_turret_desc: "$three_man_turret_desc$"
 tank_modern_tank_turret: "Modern Turret"
 tank_modern_tank_turret_desc: "A well-laid out turret allows three crew members to efficiently operate the main armament and keep track of their surroundings."
 
 # ARMAMENTS #
 tank_anti_armor_rifle: "Basic Anti-Armor Rifle"
 tank_anti_armor_rifle_desc: "A heavy-caliber rifle designed to penetrate light armor and disable enemy vehicles at close range."
 tank_anti_armor_rifle_2: "Improved Anti-Armor Rifle"
 tank_anti_armor_rifle_2_desc: "$tank_anti_armor_rifle_desc$"
 tank_heavy_machine_gun: "Heavy Machine Gun"
 tank_heavy_machine_gun_desc: "A machine gun provides decent anti-infantry capability for a low cost. Even with special armor-piercing ammunition, its anti-armor performance leaves a lot to be desired."
 tank_close_support_gun: "Close Support Gun"
 tank_close_support_gun_desc: "A small weapon designed to fire high-explosive shells against enemy field fortifications to help the infantry on the attack. While capable of engaging tanks, its short barrel and limited ammunition make it unable to deal with more powerful enemy tanks."
 tank_small_tesla_cannon: "Small Tesla Cannon"
 tank_small_tesla_cannon_desc: "$tank_tesla_cannon_desc$"
 tank_tesla_cannon: "Tesla Cannon"
 tank_tesla_cannon_desc: "Further research into tesla coil technology led to the development of a powerful electric anti-infantry weapon mounted on landships."

 flamethrower: "Flamethrower"
 flamethrower_desc: "A device to project a stream of burning liquid. While very useful in urban combat and against fortifications, it offers no anti-armor capability and has to be used by a specially-trained crew in a separate unit to be effective."
 advanced_flamethrower: "Advanced Flamethrower"
 advanced_flamethrower_desc: "Enhanced flamethrower systems, ideal for clearing fortified positions and inflicting devastating damage in close-quarters combat."

 tank_auto_cannon: "Automatic Cannon"
 tank_auto_cannon_desc: "Adapted from a fast-firing anti-air gun, this automatic cannon can lay down a hail of fire that is devastating to soft targets. The small caliber does limit its anti-armor performance."
 tank_auto_cannon_2: "Improved Automatic Cannon"
 tank_auto_cannon_2_desc: "$tank_auto_cannon_desc$"
 tank_small_cannon: "Small Cannon"
 tank_small_cannon_desc: "A small and cheap cannon, able to fire both anti-infantry and anti-armor rounds. Its small caliber limits its usefulness."
 tank_small_cannon_2: "Improved Small Cannon"
 tank_small_cannon_2_desc: "$tank_small_cannon_desc$"
 tank_medium_cannon: "Medium Cannon"
 tank_medium_cannon_desc: "A general-purpose weapon well suited to a wide variety of tasks. It excels at neither anti-infantry nor anti-tank work, but it provides a vehicle with a lot of flexibility."
 tank_medium_cannon_2: "Improved Medium Cannon"
 tank_medium_cannon_2_desc: "$tank_medium_cannon_desc$"
 tank_heavy_cannon: "Basic Heavy Cannon"
 tank_heavy_cannon_desc: "A weapon that can fire a large shell. With exceptional armor penetration and decent performance against soft targets, its biggest drawbacks are the sheer size and cost, which make it too unwieldy to be mounted in most vehicles not specifically designed to carry it."
 tank_heavy_cannon_2: "Improved Heavy Cannon"
 tank_heavy_cannon_2_desc: "$tank_heavy_cannon_desc$"
 tank_heavy_cannon_3: "Advanced Heavy Cannon"
 tank_heavy_cannon_3_desc: "$tank_heavy_cannon_desc$"
 tank_super_heavy_cannon: "Super-Heavy Cannon"
 tank_super_heavy_cannon_desc: "An absurdly large weapon with unmatched performance. There are very few things that this weapon can not destroy, and none of them have any business shooting at a tank."

 tank_anti_air_cannon: "Basic Anti-Air Gun"
 tank_anti_air_cannon_desc: "A fast-firing automatic gun designed to engage aircraft. It has limited potential as a fire-support weapon against ground targets."
 tank_anti_air_cannon_2: "Improved Anti-Air Gun"
 tank_anti_air_cannon_2_desc: "$tank_anti_air_cannon_desc$"
 tank_anti_air_cannon_3: "Advanced Anti-Air Gun"
 tank_anti_air_cannon_3_desc: "$tank_anti_air_cannon_desc$"
 tank_anti_air_rockets: "Anti-Air Rocket System"
 tank_anti_air_rockets_desc: "Anti-aircraft battery mounted on the landship's turret which allows for the firing of up to 8 unguided or guided rockets in one burst."

 tank_medium_howitzer: "Medium Howitzer"
 tank_medium_howitzer_desc: "A medium field howitzer adapted to be mounted in a vehicle. Its primary purpose is indirect fire support against soft targets, but it can be fired directly at a target if necessary. Carrying only a small amount of armor-piercing ammunition, it is ill-suited for anti-armor work."
 tank_medium_howitzer_2: "Improved Medium Howitzer"
 tank_medium_howitzer_2_desc: "$tank_medium_howitzer_desc$"
 tank_heavy_howitzer: "Heavy Howitzer"
 tank_heavy_howitzer_desc: "A heavy field howitzer adapted to be mounted in a vehicle. Its primary purpose is indirect fire support against soft targets, but it can be fired directly at a target if necessary. Carrying only a small amount of armor-piercing ammunition, it is ill-suited for anti-armor work."
 tank_medium_mortar: "Medium Mortar"
 tank_medium_mortar_desc: "A large-bore cannon that fires a big-caliber projectile along an arc line. Highly effective against unarmored targets and buildings."
 tank_heavy_mortar: "Heavy Mortar"
 tank_heavy_mortar_desc: "A large cannon that fires a large-caliber projectile along an arc line. It is able to inflict massive damage to enemy infantry and lowers buildings and fortifications with ease."
 tank_rocket_launcher: "Rocket Launcher"
 tank_rocket_launcher_desc: "A multi-barrelled launcher for unguided, high-explosive rockets. The high volume of fire gives it excellent performance against soft targets, but even direct hits do little against armored targets."
 tank_rocket_launcher_2: "Improved Rocket Launcher"
 tank_rocket_launcher_2_desc: "While there are a number of improvements to accuracy, the main advantage of this improved rocket launcher is that it can hold more rockets to fire at the enemy."

 tank_high_velocity_cannon: "Basic High-Velocity Cannon"
 tank_high_velocity_cannon_desc: "A cannon specifically designed to achieve a high muzzle velocity. Using specialized ammunition, it has superb anti-armor characteristics, but its performance against soft targets suffers."
 tank_high_velocity_cannon_2: "Improved High-Velocity Cannon"
 tank_high_velocity_cannon_2_desc: "$tank_high_velocity_cannon_desc$"
 tank_high_velocity_cannon_3: "Advanced High-Velocity Cannon"
 tank_high_velocity_cannon_3_desc: "$tank_high_velocity_cannon_desc$"
 tank_railgun_cannon: "Railgun Cannon"
 tank_railgun_cannon_desc: "A modern weapon that use electromagnetic force to fire a projectile at tremendous speed. The projectile, which reaches velocities of mach 3 to mach 8 depending on its size, is capable of piercing the thickest armor and destroying flying vehicles with a single shot. The projectile's immense speed and range means that kinetic force alone is enough to destroy targets."

# SPECIAL FEATURES #
 secondary_turret_hmg: "Heavy Machine Gun"
 secondary_turret_hmg_desc: "A heavy machine gun in a secondary turret. The placement of the turret limits its arc of fire, lowering the gun's overall effectiveness, but it does allow the tank to engage more targets. This is particularly useful when on the attack."
 secondary_turret_small_cannon: "Small Cannon"
 secondary_turret_small_cannon_desc: "A small cannon in a secondary turret. The placement of the turret limits its arc of fire, lowering the gun's overall effectiveness, but it does allow the tank to engage more targets. This is particularly useful when on the attack."
 secondary_turret_close_support_gun: "Close Support Gun"
 secondary_turret_close_support_gun_desc: "A close support gun in a secondary turret. The placement of the turret limits its arc of fire, lowering the gun's overall effectiveness, but it does allow the tank to engage more targets. This is particularly useful when on the attack."

 tank_radio_1: "Basic Radio"
 tank_radio_1_desc: "A basic two-way radio allows tanks to coordinate their tactical maneuvers on a small scale."
 tank_radio_2: "Improved Radio"
 tank_radio_2_desc: "An improved radio allows commanders effective control over larger formations of tanks, permitting large-scale operational maneuvers."
 tank_radio_3: "Advanced Radio"
 tank_radio_3_desc: "With a more powerful transmitter and better reception, this radio allows communications over dozens of kilometers and in the face of enemy jamming."
 tank_radio_4: "Semi-Modern Radio"
 tank_radio_4_desc: "Improved frequency control and more reliable components provide clearer communications, allowing large formations to coordinate complex maneuvers with fewer interruptions."
 tank_radio_5: "Modern Radio"
 tank_radio_5_desc: "Compact, high-performance radio equipment provides reliable long-range communications, rapid transmission of orders and improved resistance to enemy interference."
 ground_aa_radar_1: "Basic AA Radar"
 ground_aa_radar_1_desc: "A compact radar set detects approaching aircraft and provides approximate range and direction, helping crews acquire aerial targets beyond visual range."
 ground_aa_radar_2: "Tracking AA Radar"
 ground_aa_radar_2_desc: "Improved radar equipment tracks aerial targets more reliably, providing continuous range and bearing measurements to assist aiming and interception."
 ground_aa_radar_3: "Advanced Fire-Control Radar"
 ground_aa_radar_3_desc: "An advanced radar set continuously tracks aerial targets and supplies precise targeting data, allowing vehicle-mounted weapons to engage fast-moving aircraft more effectively."

 amphibious_drive: "Amphibious Drive"
 amphibious_drive_desc: "A set of floatation devices and a small screw allow this tank to quickly be rigged to traverse water, either from ship to shore or across a river."
 sloped_armor: "Sloped Armor"
 sloped_armor_desc: "Armor placed at an angle to an incoming shell has a much greater effective thickness than the same amount of armor placed vertically. It also increases the chance that the shell will simply bounce off harmlessly. However, it requires the entire tank to be designed around it, making the vehicle more difficult to assemble."
 armor_skirts: "Armor Skirts"
 armor_skirts_desc: "A set of thin metal plates mounted on the side of the vehicle, giving additional protection against anti-tank rifles and shaped charges."
 dozer_blade: "Dozer Blade"
 dozer_blade_desc: "A dozer blade allows the vehicle to quickly build a fighting position in the field without the support of engineers."

 # SHARED W AUTOMATS #
 stabilizer: "Stabilizer I"
 stabilizer_desc: "A mechanical device to keep the gun pointing in the same direction when the tank is moving. While not advanced enough to allow accurate firing on the move, it does allow the gunner to fire accurately during a short stop, without having to re-acquire the target."
 stabilizer_2: "Stabilizer II"
 stabilizer_2_desc: "An improved stabilization system compensates for vehicle movement more effectively, allowing the gunner to maintain aim while moving and engage targets more quickly during short halts."
 smoke_launchers: "Smoke Launchers"
 smoke_launchers_desc: "A battery of pyrotechnic devices that can be triggered from inside the tank to create a thick cloud of smoke to hide the tank. Very useful when on the defensive or after driving into an ambush."
 extra_ammo_storage: "Extra Ammunition Storage"
 extra_ammo_storage_desc: "Additional racks of ready ammunition allow the tank to stay in the fight much longer without resupply. However, if the armor is penetrated, the results are likely to be catastrophic. This is particularly problematic when attacking."
 wet_ammo_storage: "Wet Ammunition Storage"
 wet_ammo_storage_desc: "Water jackets added to ammunition racks dramatically reduce the risk of the ammunition exploding after the tank is hit, which is greatly appreciated by the crews."
 squeezebore_adaptor: "Squeeze-bore Adaptor"
 squeezebore_adaptor_desc: "A special adaptor at the end of the gun lowers the diameter of the barrel and squeezes a shell down to a smaller caliber. This significantly increases muzzle velocity and thereby the penetration power of the gun. It does require special ammunition made from rare materials."
 auto_loader: "Auto Loader"
 auto_loader_desc: "An automatic mechanism that loads shells and allows the tank to keep a high rate of fire for a prolonged period of time."
 easy_maintenance: "Easy Maintenance"
 easy_maintenance_desc: "Hatches around the vehicle give access to many different components of the vehicle, and allow the crew to perform even complex maintenance fairly easily."
 additional_machine_guns: "Additional Machineguns"
 additional_machine_guns_desc: "A set of machineguns in sponsons and special pintle mounts give the vehicle improved defense against close-in infantry attack."
 active_protection_system: "Active Protection System"
 active_protection_system_desc: "A module that detects threats incoming toward the vehicle. It neutralizes them by firing special countermeasure projectiles."
 armor_night_vision: "Night Vision Optics"
 armor_night_vision_desc: "Night vision optics significantly improve the effectiveness of the night combat."
 spotting_optics: "Spotting Optics"
 spotting_optics_desc: "Improved spotting optics significantly allow our crew to spot enemies from longer distance."
 expanded_fuel_tank: "Fuel Drum"
 expanded_fuel_tank_desc: "An externally mounted fuel drum designed to extend the operational range of an armored vehicle."

 # LAND CRUISER SPECIFIC #
 lc_heavy_naval_guns: "Heavy Naval Guns"
 lc_heavy_naval_guns_desc: "The standard main armament for such a massive armored vehicle, these powerful naval-grade cannons are adapted for direct confrontation, delivering devastating firepower against both armored and fortified targets."
 lc_super_heavy_railway_gun: "Super-Heavy Railway Gun"
 lc_super_heavy_railway_gun_desc: "This massive gun, originally built for railway platforms, is capable of bombarding targets from extreme ranges with unparalleled destructive power."
 lc_high_impact_obliterator_cannon: "High-Impact Obliterator Cannon"
 lc_high_impact_obliterator_cannon_desc: "Specifically designed to penetrate extremely thick armor, this weapon’s high kinetic energy makes it a formidable counter against other super-heavy tanks."
 lc_heavy_anti_air_platform: "Heavy Anti-Air Platform"
 lc_heavy_anti_air_platform_desc: "A platform mounting multiple high-caliber flak guns, designed to defend against enemy bombers and reconnaissance aircraft that threaten the Land Cruiser."
 lc_medium_naval_guns: "Medium Naval Guns"
 lc_medium_naval_guns_desc: "Offering a balanced combination of rate of fire and firepower, this guns are effective at engaging lighter vehicles and providing support against unarmored targets."
 lc_hull_mounted_railway_gun: "Hull-Mounted Railway Gun"
 lc_hull_mounted_railway_gun_desc: "A repurposed railway gun built directly into the hull for maximum stability, it provides heavy fire support and can engage distant targets with high precision."
 lc_super_heavy_howitzer: "Super-Heavy Howitzer"
 lc_super_heavy_howitzer_desc: "A massive howitzer designed to smash fortifications and urban defenses. This variant specializes in delivering high-explosive shells, ideal for clearing entrenched positions and obliterating fortified structures."
 lc_heavy_high_velocity_cannons: "Heavy High-Velocity Cannons"
 lc_heavy_high_velocity_cannons_desc: "Anti-tank guns designed to engage and destroy enemy armor with pinpoint accuracy. Their high-velocity projectiles ensure excellent penetration at long ranges."
 lc_heavy_anti_air_battery: "Heavy Anti-Air Battery"
 lc_heavy_anti_air_battery_desc: "An anti-air battery equipped with large-caliber guns to target high-speed and high-altitude aircraft, providing a defensive bubble around the vehicle."
 lc_medium_cannon_turret: "Coaxial Medium Cannon"
 lc_medium_cannon_turret_desc: "A standard turret-mounted cannon, capable of engaging infantry and light vehicles. Its compact design makes it versatile for close-quarters combat and secondary roles."
 lc_assault_gun: "Assault Gun"
 lc_assault_gun_desc: "Designed for close-range urban warfare and bunker busting. This weapon delivers powerful, high-explosive shells to clear out infantry and hardened targets."
 lc_high_velocity_cannon_turret: "Coaxial High-Velocity Cannon"
 lc_high_velocity_cannon_turret_desc: "A turret fitted with a high-velocity cannon to engage enemy armor. Its smaller size allows it to provide quick and responsive fire support against lighter armored threats."
 lc_light_anti_air_battery: "Light Anti-Air Battery"
 lc_light_anti_air_battery_desc: "A light anti-aircraft battery designed to target low-flying aircraft and protecting the vehicle from strafing runs and dive-bombers."
 lc_flamethrower_turret: "Flamethrower Array"
 lc_flamethrower_turret_desc: "A specialized turret that projects a stream of fire, perfect for clearing out fortified positions, infantry, and ambush points. Ideal for close-quarters engagements in dense urban environments."
 lc_rocket_launcher: "Rocket Launcher"
 lc_rocket_launcher_desc: "A modular rocket system mounted on the Land Cruiser, delivering devastating rocket barrages to suppress enemy defenses and overwhelm large formations."
 lc_radio_1: "$tank_radio_1$"
 lc_radio_1_desc: "$tank_radio_1_desc$"
 lc_radio_2: "$tank_radio_2$"
 lc_radio_2_desc: "$tank_radio_2_desc$"
 lc_radio_3: "$tank_radio_3$"
 lc_radio_3_desc: "$tank_radio_3_desc$"
 lc_radio_4: "$tank_radio_4$"
 lc_radio_4_desc: "$tank_radio_4_desc$"
 lc_radio_5: "$tank_radio_5$"
 lc_radio_5_desc: "$tank_radio_5_desc$"
 lc_command_center: "Command Center"
 lc_command_center_desc: "A fully integrated command center that transforms the Land Cruiser into a mobile headquarters, equipped with advanced communication systems to coordinate large-scale military operations."
 lc_radar: "Radar"
 lc_radar_desc: "An early detection system that increases awareness of enemy aircraft and nearby forces, allowing the Land Cruiser to prepare for potential aerial or ground threats."
 lc_aircraft_catapult: "Aircraft Catapult"
 lc_aircraft_catapult_desc: "A launch system for small reconnaissance aircraft, enabling the Land Cruiser to scout distant areas and provide real-time battlefield intelligence."
 lc_helipad: "Helipad"
 lc_helipad_desc: "A platform for launching helicopters, designed to provide advanced aerial reconnaissance and improved situational awareness on the battlefield."
 lc_armored_skirts: "Armored Skirts"
 lc_armored_skirts_desc: "Reinforced armor plating mounted along the sides to protect vulnerable tracks and suspension systems from anti-tank weapons and small arms fire."
 lc_bunker_emplacement: "Bunker Emplacement"
 lc_bunker_emplacement_desc: "An internal fortified structure, transforming the Land Cruiser into a mobile bunker. It allows the crew to hold defensive positions and fire back at the enemy, even when under heavy fire."
 lc_obstacle_clearance_gear: "Obstacle-Clearance Gear"
 lc_obstacle_clearance_gear_desc: "Heavy-duty attachments, such as massive bulldozer blades and cranes, designed to clear debris, create paths through difficult terrain, and assist in entrenchment operations."
 lc_internal_fuel_tanks: "Internal Fuel Tanks"
 lc_internal_fuel_tanks_desc: "Expanded fuel compartments within the hull, increasing the vehicle’s operational range and reducing the need for frequent refueling stops during extended campaigns."
 lc_internal_ammunition_compartments: "Internal Ammunition Compartments"
 lc_internal_ammunition_compartments_desc: "Reinforced storage areas for carrying additional ammunition, allowing the Land Cruiser to sustain prolonged engagements without resupply."
 lc_wet_ammunition_storage: "Wet Ammunition Storage"
 lc_wet_ammunition_storage_desc: "Specialized compartments filled with liquid coolant to minimize the risk of ammunition detonations from enemy hits, greatly enhancing crew safety."
 lc_smoke_generators: "Smoke Generators"
 lc_smoke_generators_desc: "A system designed to deploy thick smoke screens, masking the vehicle’s movements and reducing its visibility to both ground and air-based threats."
 lc_stabilizers: "Stabilizers"
 lc_stabilizers_desc: "Mechanical devices that reduce the recoil and maintain gun alignment when firing, allowing for quicker target reacquisition and more accurate shooting during short halts."


