 amphibious_propulsion_desc: "Nozzles mounted on the hull or suspension of the automat allowing it to move faster in the water."
 stabilization_mechanism: "Gyro Stabilization Mechanism I"
 stabilization_mechanism_desc: "An complex system of electronic devices and gyroscopes that prevents the automat from tipping over terrain such as steep slopes or uneven ground."
 stabilization_mechanism_2: "Gyro Stabilization Mechanism II"
 stabilization_mechanism_2_desc: "An improved gyroscopic stabilization system with faster electronic corrections keeps the automat balanced over rough terrain and steep slopes, allowing it to maintain stability during rapid movements and sudden changes in elevation."
 automat_crew_compartments: "Additional Crew Compartments"
 automat_crew_compartments_desc: "Additional crew spaces. Depending on the size of the machine, these are just essential spaces or even entertainment spaces in the large ones."

