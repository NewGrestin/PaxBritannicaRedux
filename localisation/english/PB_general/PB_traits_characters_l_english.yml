# SCA #
SCA_traumatized_by_trek: "Traumatized By The Trek"
SCA_traumatized_by_trek_desc: "This general has seen the worst of the worst of our march west, many have died and for those that have made it, reports of Shell Shock are far from uncommon. The sight of corpses littering the path back to Philadelphia has done more mental damage than the UC could ever hope to military inflict, our people are tired, battered, and bruised."
