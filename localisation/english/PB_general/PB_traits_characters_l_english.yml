# RUS #
siberian_campaign_veteran: "Siberian Campaign Veteran"
siberian_campaign_veteran_desc: "This general served on the Siberian Front during the Great War.\n\nPrincipally between the Russian and Japanese Empires, the Siberian Front saw some of the most intense, bitter fighting of the entire war. Russian forces initially underestimated the military capacity of the Japanese, resulting in a series of major defeats and the Siege of Vladivostok. Emboldened by their initial gains, the Japanese pushed to the Amur River, spending the remainder of that year's winter fortifying in expectation of a Russian counteroffensive. Russia opted to circumvent the Japanese and moved forces through neutral Manchuria, securing control over the Trans-Siberian Railway and pressuring Japan's occupation of Korea.\n\nUltimately the intervention of the Anglo-German Naval Blockade sapped the Japanese Army ability to prosecute the war, forcing them into a fighting retreat across the Far East. Vladivostok, though it never officially fell, was liberated from the stagnant Japanese siege in 1908. Japanese forces continued fighting tenaciously until the final defeat at Busan, where the Japanese officially surrendered to the Russian Empire. Irregular fighting continued for years after, however, as many Japanese troops refused to acknowledge the surrender orders, with the ongoing Japanese Revolution exacerbating matters."
suspected_moscow_circle_acolyte: "Suspected Moscow Circle Acolyte"
suspected_moscow_circle_acolyte_desc: "The Moscow Circle is the name given to an almost invisible secondary organ of the Russian Armed forces. The exact circumstances under which it was founded are unknown, it is unknown who leads the group, and it is unknown how many members it contains. All that is known to the Russian Intelligence Services is that the Circle are a faction of arch-reactionaries and ultranationalists, dedicated to worming their way into the nascent democratic government to undermine and ultimately dismantle it.\n\nThe Circle is extremely elusive, and the intelligence services only have a vague idea of who may or may not be part of the organization. The insular nature of the group and the self-protecting nature of the Russian military have made attempts at infiltration exceptionally difficult. All that can be said for certain is the Moscow Circle exists, and it has likely infected many higher levels of the Russian military."
moscow_circle_acolyte: "Moscow Circle Acolyte"
moscow_circle_acolyte_desc: "For years, the Moscow Circle existed only as whispers within the ranks of the Russian Armed Forces. Once dismissed as an elusive cabal of ultranationalist officers and reactionary ideologues, the organization has now cast aside all secrecy. With the democratic government overthrown, the Circle has emerged from the shadows to assume direct control of the Russian state.\nLittle is still known about its internal hierarchy. The Circle remains as secretive as ever, concealing its leadership behind a web of loyal officers, security officials, and political intermediaries. What is no longer in doubt, however, is its purpose. The coup has revealed years of careful planning, patient infiltration, and unwavering commitment to dismantling Russia's democratic institutions from within.\nThe military, intelligence services, and much of the state apparatus have already been brought under the Circle's influence, leaving organized resistance fragmented and isolated. Russia now stands under the rule of an organization that has spent years preparing for this moment, determined to forge a new order built upon militarism, uncompromising nationalism, and absolute state authority."
