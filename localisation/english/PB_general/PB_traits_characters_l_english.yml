# SPR #
SPR_order_alcantara_trait: "Knight of the Order of Alcántara"
SPR_order_alcantara_trait_desc: "Founded in 1156, the Order of Alcántara was a critical force in the Reconquista and the protection of Spanish territories. The knights were known for their courage in battle and their commitment to protecting the lands along the Tagus River. Bravery and honor were the hallmarks of this order, which was instrumental in securing Spain's borders."
SPR_order_calatrava_trait: "Knight of the Order of Calatrava"
SPR_order_calatrava_trait_desc: "The Order of Calatrava, established in the 12th century, was a leading military order of the Spanish Middle Ages. It was created to defend the Calatrava castle from Muslim forces and played a key role in the Reconquista. Its knights were noted for their military discipline and religious devotion. Chivalric discipline and sacrifice are central to this order."
SPR_order_montesa_trait: "Knight of the Order of Montesa"
SPR_order_montesa_trait_desc: "The Order of Montesa, established in 1317, rose from the disbanding of the Knights Templar. Based in the Kingdom of Aragon, the order defended Spain's eastern borders and fought in the Crusades. The knights of Montesa were known for their resilience, strategic brilliance, and deep devotion to their cause, making them a symbol of unwavering faith."
SPR_order_santiago_trait: "Knight of the Order of Santiago"
SPR_order_santiago_trait_desc: "The Order of Santiago, founded in the 12th century, is one of Spain's most prestigious military orders. Initially formed to protect Christian pilgrims traveling to the shrine of St. James in Santiago de Compostela, it gained immense influence through its participation in the Reconquista and later colonial expeditions. Members were highly regarded as defenders of faith and royal authority. Honor and valor define this order."
