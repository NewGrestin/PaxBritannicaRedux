l_english:
  GRAND_DOCTRINE_SUPREMACY_OF_STEEL: "Supremacy of Steel"
  GRAND_DOCTRINE_SUPREMACY_OF_STEEL_DESC: "Mechanized and armored units are the future of warfare. Fast-moving formations overpower the trench-warfare doctrine of the Great War, allowing armies to outmaneuver the enemy and cut through their supply lines."
  GRAND_DOCTRINE_FIRE_AND_FURY: "Fire & Fury"
  GRAND_DOCTRINE_FIRE_AND_FURY_DESC: "The enemy forces may possess greater mobility; they may even be smarter and more cunning. But nothing can outwit the hellfire unleashed from the barrels of our artillery and heavy-caliber guns."
  GRAND_DOCTRINE_ARCHITECTURE_OF_WAR: "Architecture of War"
  GRAND_DOCTRINE_ARCHITECTURE_OF_WAR_DESC: "The Great War doctrine did work - it was the limitations of the era and its technology that kept it from reaching its full potential. Now, with dedicated planning centers at our disposal, nothing stands in the way of becoming masterful architects of war - in both attack and defense."
  GRAND_DOCTRINE_SUPREMACY_OF_FLESH: "Supremacy of Flesh"
  GRAND_DOCTRINE_SUPREMACY_OF_FLESH_DESC: "To win a war, sacrifice is required - specifically, the sacrifice of our brave soldiers who, together with the hordes of horrors beyond human comprehension unleashed from our laboratories, will storm toward the enemy's positions."




































###################
## OLD DOCTRINES ##
###################
   ## DOCTRINES AND ITS LABELS ##
  SUPREMACY_OF_STEEL_DOCTRINE_LABEL: "SUPREMACY OF STEEL"
  SUPREMACY_OF_STEEL_DOCTRINE_DESC: "The mechanized and augmented weapons of today are the future of warfare: Fast, Brutal and  Uncompromising."
  FIRE_AND_FURY_DOCTRINE_LABEL: "FIRE AND FURY"
  FIRE_AND_FURY_DOCTRINE_DESC: "The enemy may be more maneuverable, they may even be smarter than us, but we've yet to meet anyone  that can outsmart a high caliber artillery shell."
  CULT_OF_THE_OFFENSIVE_DOCTRINE_LABEL: "CULT OF THE OFFENSIVE"
  CULT_OF_THE_OFFENSIVE_DOCTRINE_DESC: "The methods of the Great War were sound in their conception, albeit not in execution. Victory  is impossible without sacrifice."
  SUPREMACY_OF_FLESH_DOCTRINE_LABEL: "SUPREMACY OF FLESH"
  SUPREMACY_OF_FLESH_DOCTRINE_DESC: "With the power to create untold horrors in our labs, we will unleash these beasts upon our enemy  to protect the lives of our troops."
 
  REINFORCED_INFANTRY_LABEL: "REINFORCED INFANTRY"
  MOBILE_ASSAULT_LABEL: "MOBILE ASSAULT"
  MORE_SHELLS_LABEL: "MORE SHELLS"
  MORE_SUPPORT_LABEL: "MORE SUPPORT"
  HINDENBURG_DOCTRINE_LABEL: "HINDENBURG DOCTRINE"
  BULLARD_HAIG_DOCTRINE_LABEL: "BULLARD-HAIG DOCTRINE"
  ASYMMETRY_LABEL: "ASSYMETRY"
  MUTAGENIC_WARFARE_LABEL: "MUTAGENIC WARFARE"
 
  supremacy_of_steel: "Supremacy of Steel"
  supremacy_of_steel_desc: "The age in which we live is nothing if not one of steel. Armored unites such as landships, planes, and  automotats must be focused on above all else if our war machine is to be successful in the coming wars."
  sos_delaying_actions: "Delaying Action"
  sos_delaying_actions_desc: " While the Great War was primarily one of grueling and slow trench warfare, military advances since  then have shown that speed will be the name of the game going forward. While increasing our own speed is important, decreasing that  of the enemy may be even more so. An unprepared, poorly equipped army makes for easy pickings and little bloodshed. Subterfuge and  slowing down the enemy should remain a top priority."
  sos_independent_armor: "Independent Armor Detachments"
  sos_independent_armor_desc: "The Great War demonstrated the obsolesence of a focus on infantry. For years, millions upon millions  of men were simply thrown into the meat grinder to little avail, the war only truly being moving towards an end with the development  of armored units such as landships and automotats. Even then, they were only used as support for infantry. The development and  prioritization of independent mechanical units could very well turn the tide in the next war."
  sos_shock_troopers: "Shock Jockey Hardsuits"
  sos_shock_troopers_desc: "The hardsuit is the latest development in non-vehicular armor, though thus far, it has merely served a  defensive purpose, those placed in them using the same weapons as every one else. However, the addition of shock weaponry to their  arsenal could give them the offensive edge they so desperately need and further accelerate the move towards hardsuits as the armor  of the future."
  sos_armored_core: "An Armored Core"
  sos_armored_core_desc: "Armor is different from the Calvary or Navy they are compared to. They shall be their own units, with their  own commanders, and their own tactics. The Infantry shall fallow behind the Steel Hussars."
  sos_advanced_forces: "Advance Forces"
  sos_advanced_forces_desc: "The key to winning is to be ahead of the enemy by at least a few steps. Or better yet - to leave your  enemy decapitated and unable to fight at all. So far, the most effective measure of recon proved to be Razormaidens. We shall  develop further upon the applications of those ladies in battle operations by creating elite units whose goal shall be to perform  battlefield recon and if necessary- assassinations and sabotage."
  sos_lightning_war: "Lightning War"
  sos_lightning_war_desc: "The best way to prevent the inhumane carnage of endless trench warfare is to end the war as quickly as  possible with one decisive strike that shall decapitate the enemy. By improving the organization of the landship and walker units, their  coordination, and supply chains, our army can theoretically achieve a quick breakthrough, encirclement and total collapse of the  enemy's defences."
  sos_full_mechanization: "Full Mechanization"
  sos_full_mechanization_desc: "The world's economy has moved away from the natural world of agriculture and into the metallic world  of steel. Our military must follow suit. While horses have served the armies of mankind well for centuries, it is time to replace  them with trucks and vehicles. A full mechanized army will never tire, needs only a fraction of the rations and can operate in  almost any environment. The enemy will fall under a tide of steel."
  sos_deep_penetration: "Hunting Parties"
  sos_deep_penetration_desc: "What good are walls of artillery and armor when the enemy has already snuck behind them? Infiltration  is key to a quick and decisive victory in modern warfare."
  sos_indiscriminate_conscription: "Indiscriminate Recruitment"
  sos_indiscriminate_conscription_desc: "It's often been said that all's fair in love and war. This attitude may very well be  applicable to our recruitment standards. To ensure our military has an apple supply of man power, we can expand or even completely  remove the limitations of conscription. Old Men, Convicts, Women, the Disabled and even Children can be sent to the front. Only  those physically incapable of any form of frontline combat will be exempt. "
  sos_mobile_infantry: "Mobile Infantry"
  sos_mobile_infantry_desc: "The Great War showed how fragile a regular human is. Years of training, expensive equipment, and  transportation usually meant nothing as his regular lifespan on the fields of battle lasted only a few hours in the face of machine  guns, barbed wire, and other new means of war. The natural solution therefore is to make every individual soldier immune to that by  issuing a mass production of hardsuits for all branches of the military, making every conscript a modern knight in shining armor."
  sos_night_operations: "Night Operations"
  sos_night_operations_desc: "Ever since ancient times, attacking in broad daylight has ended in slaughter. But night raids or  assaults have always been difficult, it's hard to fight the enemy if you can't see your own hands let alone them. To ensure better  effectiveness for night combat operations, a series of military wide training exercises have been developed. Allowing our troops the  ability to fight in any time of the day. "
  sos_fast_action_units: "Fast Action Units"
  sos_fast_action_units_desc: "Current technological developments favor the attacker disproportionately, meaning that if the enemy  achieves a breakthrough, it becomes almost impossible to stop him. However, it is possible to greatly hamper his advance by  utilizing fast hit-and-run units intended to harass the hostile frontline units. By proliferating light transport and greater weapon  variability, we can slow down the enemy advance enough for the main forces to arrive."
  sos_smash_and_grab: "Smash and Grab Operations"
  sos_smash_and_grab_desc: "As the Great War showed, Logistics are the very core of any modern Western army. However the speed of the  now ever more mechanized armies have lead to struggling supply lines, if our new lighting-speed units however were to cut off enemy  lines, then the playing ground in such deep operations will be evened out in our favor"
  sos_heavier_armor: "Heavier Armor"
  sos_heavier_armor_desc: "A heavier armor doctrine centers on the use of heavily armored units, particularly landships, automats and infantry fighting vehicles, as the primary force in ground combat. This doctrine emphasizes the strategic advantages of superior  firepower, protection, and mobility, allowing these units to break through enemy defenses and carry out deep penetration operations. \n\nSupported by artillery and airpower, these mechanized forces are designed to disrupt and destroy enemy command and supply lines,  effectively crippling their ability to respond. The doctrine relies on the resilience of heavy armor to withstand enemy attacks  while delivering overwhelming force, ensuring the ability to secure and hold critical terrain. It prioritizes the rapid exploitation  of breaches, enabling swift and decisive victories in a variety of combat environments."
  sos_more_dakka: "Heavier Weapons"
  sos_more_dakka_desc: "A doctrine focused on heavier weapons emphasizes the use of large-caliber artillery, long-range missile  systems, and heavy firepower as the central element in military operations, in contrast to the mobility and versatility of armored  mechanized units. This doctrine prioritizes firepower over mobility, relying on the ability to engage and neutralize enemy forces  from a distance through sustained bombardment and precision strikes. Heavier weapons units, such as self-propelled howitzers, rocket  artillery, and long-range ballistic systems, serve to soften or annihilate enemy defenses before ground forces engage, minimizing  their exposure to risk.\n\nUnlike the heavier armor doctrine, which seeks to break through and dominate via mechanized assault with  bulkier, more armored instruments of war, the heavier weapons doctrine focuses on overwhelming the enemy with indirect fire,  reducing their combat effectiveness before maneuver elements advance to secure objectives. This approach tends to be more static but  highly effective in shaping the battlefield from a distance."
 
  faf_fire_and_fury: "Fire and Fury"
  faf_fire_and_fury_desc: "A military doctrine focused on artillery supremacy emphasizes the central role of massed, sustained  artillery fire to dominate the battlefield and weaken the enemy before direct engagements. This doctrine relies on the overwhelming  firepower of a wide range of artillery systems, including howitzers, rocket launchers, and long-range precision missiles, to disrupt  enemy formations, destroy fortifications, and suppress counterattacks. Artillery is used as the decisive factor in shaping the  battlefield by neutralizing enemy forces at a distance, creating favorable conditions for advancing infantry or armored units."
  faf_fuller_auto: "Fuller Auto"
  faf_fuller_auto_desc: "In the Great War, a common deciding factor in the outcome of a battle was manpower. Whichever side had more  bodies to throw usually ended up winning. Various technological advances have given options to mitigate this but it still remains a  major factor. With the introduction of the 'Fuller Auto' system we can overcome this. By increasing the rate of fire of our heavy  guns, any hostile assault will be severely delayed if not stopped outright before they reach our front lines."
  faf_beans_and_butter: "Beans, Butter and Bullets"
  faf_beans_and_butter_desc: "As the needs of a heavily armed, semi-static force grow, maintaining supply lines is even more  important. In addition to shells, our troops need the four basic food groups: beans, bacon, whiskey and lard."
  faf_more_firepower: "Weaponized Pyromania"
  faf_more_firepower_desc: "A doctrine add-on focused on disabling safety protocols on automatic weapons to increase firepower, often  referred to as \"overclocking\" or bypassing fire rate limiters, aims to maximize the volume of fire in short bursts, particularly in  close-quarters combat or high-intensity firefights. By disabling certain safety mechanisms, automatic weapons can fire more rounds  in less time, theoretically increasing the chance of hitting targets and delivering overwhelming suppressive fire. However, this  comes at the cost of reduced weapon longevity, increased overheating, and a higher risk of malfunctions.\n\nThis add-on would be  most effective in scenarios where overwhelming firepower is needed to quickly overwhelm an enemy force, though it would require  highly trained operators capable of managing the risks associated with weapon degradation and increased recoil. The doctrine would  prioritize short-term tactical gains over long-term sustainability of equipment, making it suitable for elite or specialized units  where rapid, overwhelming engagements are critical."
  faf_combat_team_organization: "Streamlined Stimulant Distribution"
  faf_combat_team_organization_desc: "Improving the efficiency of distributing stimulants to frontline soldiers is designed to  enhance combat performance, endurance, and alertness during prolonged engagements or high-stress operations. This approach would  involve streamlined logistical systems for the rapid and controlled distribution of performance-enhancing drugs, such as stimulants  that increase focus, reduce fatigue, and sharpen reaction times. Innovations could include the integration of stimulants into  rations, portable dispensers, or wearable delivery systems, ensuring that soldiers can access the substances as needed without  logistical delays.\n\nThe doctrine emphasizes maintaining operational readiness during extended combat operations by managing  fatigue and boosting morale, while also implementing safeguards to prevent overuse, addiction, or impaired judgment. This would be  particularly valuable in high-intensity, continuous operations where physical and mental exhaustion could critically impact mission  success. However, the doctrine would require strict oversight to manage the ethical and health implications of widespread stimulant  use."
  faf_thunder_runs: "Thunder Runs"
  faf_thunder_runs_desc: "Thunder Runs adopt rolling artillery bombardment emphasizing continuous, synchronized artillery fire that  move progressively ahead of advancing ground forces to suppress and disorient enemy defenses. This approach, often referred to as a  \"creeping barrage,\" ensures that as infantry or armored units move forward, they are shielded by a curtain of artillery fire that  clears obstacles, disrupts enemy positions, and neutralizes threats before the advancing units engage. The rolling bombardment  creates a dynamic battlefield environment where the enemy has little time to recover or regroup, maintaining constant pressure. \n\nPrecision timing and coordination between artillery and ground forces are crucial, ensuring that the bombardment stays just  ahead of friendly troops while keeping the enemy under relentless attack. This doctrine requires advanced targeting systems,  well-trained artillery crews, and communication networks to ensure synchronization, but when executed effectively, it provides a  powerful method of sustaining momentum in offensive operations while minimizing casualties among advancing forces."
  faf_automated_targeting: "Thinker Targeting Systems"
  faf_automated_targeting_desc: "Thinker Targeting Systems are constructed intelligence (CI) automatons to manage targeting systems  focuses on integrating CI to enhance precision, speed, and adaptability in battlefield engagements. CI-driven targeting systems  would analyze vast amounts of real-time data from sensors, drones, and reconnaissance units, allowing for faster identification of  enemy positions, prioritization of targets, and optimal allocation of firepower. These systems could adjust targeting parameters on  the fly, accounting for changing battlefield conditions such as terrain, enemy movements, and environmental factors.\n\nThe CI would  enable more accurate strikes with reduced collateral damage, especially in complex, high-density environments. Furthermore, it could  autonomously assign fire missions, ensuring that artillery, air support, or precision-guided munitions are deployed in the most  efficient manner possible. This doctrine add-on would drastically reduce human error and decision-making delays while enabling  forces to respond rapidly to emerging threats. However, it would also require rigorous safeguards to prevent malfunctions or  unintended engagements, along with strong measures to protect against potential adversary interference."
  faf_drone_targeting: "Drone Coordination"
  faf_drone_targeting_desc: "Using aerial surveillance drones to monitor the battlefield focuses on leveraging real-time,  high-resolution intelligence gathered from unmanned aerial systems (UAS) to enhance situational awareness and decision-making. This  approach integrates drones at various altitudes and endurance levels, providing constant coverage of key areas of interest, such as  enemy movements, supply routes, and strategic positions. These drones, equipped with advanced sensors—such as thermal imaging,  infrared, and high-definition cameras—can detect hidden or camouflaged forces, monitor changes in terrain, and track the progress of  friendly units. The intelligence collected by drones is relayed in real-time to command centers and frontline units, allowing for  rapid adjustments to tactics, airstrikes, or artillery support.\n\nThis constant aerial surveillance significantly reduces the risk  of ambushes, enhances the precision of strikes, and enables commanders to make informed decisions with a clear, up-to-date view of  the battlefield. By integrating drones into the core of reconnaissance and target acquisition efforts, this doctrine improves both  offensive and defensive operations, increasing the overall effectiveness and safety of military engagements."
  faf_shock_and_awe: "Shock and Awe"
  faf_shock_and_awe_desc: "Undermining enemy morale through sheer firepower emphasizes the psychological impact of overwhelming,  continuous, and devastating attacks to break the enemy's will to fight. This approach combines massed artillery, airstrikes, and  heavy weapons to create an unrelenting barrage that leaves the enemy with little time to regroup or recover. By maintaining constant  pressure, the enemy's sense of security and cohesion is eroded, leading to confusion, fear, and diminished combat effectiveness. The  goal is to not only inflict physical damage but to demoralize enemy forces by demonstrating overwhelming superiority, making them  believe that resistance is futile.\n\nThis doctrine would leverage the shock-and-awe effect, where the intensity and scale of  firepower cause disorganization and panic, encouraging surrender or retreat. Additionally, it integrates psychological operations  (PSYOPS) alongside the firepower to maximize the emotional and mental toll on the enemy, ensuring that even if they survive the  bombardment, their morale is too broken to continue effective resistance."
  faf_firestorm_assaults: "Firestorm Assaults"
  faf_firestorm_assaults_desc: "Since ancient times, fire has been a devastating weapon against most foes. Even as its continued usage  became increasingly controversal in the international community, the strategic value of such weapons remains clear. Forestorm  Assaults, as the name implies, makes heavy use of incendiary weapons. Not only devastating entire squads of soldiers but crippling  the morale of the survivors."
  faf_burnout_doctrine: "Burn Em' Out"
  faf_burnout_doctrine_desc: "Improving the quality of flamethrower technology focuses on enhancing the range, fuel efficiency, and  safety of these weapons to make them more versatile and effective in modern combat. Advances in fuel composition could allow for  longer-range streams of flame, extending the reach and lethality of the weapon while reducing the risk to operators. Improvements in  ignition systems, fuel storage, and delivery mechanisms would make flamethrowers more reliable, lighter, and safer to use, allowing  for better maneuverability in urban, jungle, or bunker-clearing operations. Enhanced heat-resistant materials could further protect  operators from potential backblast or weapon malfunctions.\n\nThis upgraded flamethrower technology would be especially valuable in  close-quarters combat, clearing fortified positions, and psychologically impacting enemy forces through the fear and destructive  power associated with fire. The doctrine would also integrate flamethrower units with other mechanized and infantry forces to  exploit its effectiveness in specific tactical scenarios, providing a specialized tool for breaching entrenched defenses or denying  enemies cover in difficult terrain."
  faf_indiscriminate_fire: "Indiscriminate Assault"
  faf_indiscriminate_fire_desc: "A military strategy centered on indiscriminately bombarding enemy positions prioritizes maximum  destruction over precision to overwhelm and incapacitate opposing forces. This approach involves unleashing heavy artillery,  airstrikes, and rocket barrages on enemy territories with minimal regard for specific targets, aiming to saturate the area with  firepower. By flooding the battlefield with relentless bombardment, the goal is to ensure no enemy strongholds, supply routes, or  hidden forces can survive or regroup.\n\nThis tactic seeks to maximize efficiency by creating an environment where enemy forces are  constantly under threat, unable to mount coordinated resistance or counterattacks. While this method may cause significant  collateral damage, it is employed to achieve rapid dominance, using overwhelming force to break the enemy's capacity to fight and  leaving them too scattered or disorganized to continue effective operations."
  faf_combined_arms_warfare: "Combined Arms Warfare"
  faf_combined_arms_warfare_desc: "Combined arms warfare is a military strategy that integrates different types of combat units—such  as infantry, armor (landships), artillery, and air support—into a cohesive operation to maximize their strengths and minimize their  weaknesses. This approach allows forces to exploit the complementary capabilities of each unit type: infantry can secure and hold  ground, landships provide mobile firepower and protection, artillery offers long-range bombardment, and air support delivers precision  strikes.\n\nBy coordinating these elements, a military force can create overwhelming pressure on the enemy, making it difficult for  them to respond effectively and increasing the chances of achieving strategic objectives. The concept of combined arms warfare has  evolved over time, but it remains a cornerstone of modern military doctrine, emphasizing the importance of coordination, timing, and  flexibility on the battlefield."
 
  cof_cult_of_the_offensive: "Cult of the Offensive"
  cof_cult_of_the_offensive_desc: "Though technology and tactics have changed over the centuries, one fact remains absolute. Wars are  won not by machines, but by men. It is men who will lead us to victory, and our combat doctrine must reflect this. Even the most  powerful landships, aircraft and fleet can be destroyed by simple Infantry if given the right equipment. It's imperative that this idea  be maintained and expanded upon."
  cof_infiltration_troops: "Infiltration Tactics"
  cof_infiltration_troops_desc: "While massive assaults and vast fortifications are of course an important part of any campaign, the  role of the few cannot be over looked. Deployed with precision and possessing highly specialised training, our infilitration squads  can sneak through the enemy's front lines. Once there they can wreck havoc that would normally cost hundreds to lives to achieve  conventionally."
  cof_hindenburg_doctrine: "Hindenburg Doctrine"
  cof_hindenburg_doctrine_desc: "While it is said that the best defence is a good offence, that does not mean we should disregard  defensive tactics completely. Our souls must be trained in how to create entrenchments and temporary fortifications both quickly and  effectively. If done well, this will allow our soldiers to consolidate their control over territory they have occupied. Or at least  hold it until more permeant defences and garrison forces can be sent in."
  cof_bullard_doctrine: "Bullard-Haig Doctrine"
  cof_bullard_doctrine_desc: "A wise man once said that best defence is a good offence, and the static lines of the Great War have  proved the results of just digging in and waiting. Our military must be one of action, not patience. Our soldiers must be taught to  attack enemy lines in the most effective way possible. Exploting gaps and weakened parts of it in order to achieve crtiical  breakthroughs that shall leave our forces to victory."
  cof_unified_planning: "Unified Planning Committees"
  cof_armored_core: "A Brotherhood of Steel"
  cof_storm_of_steel: "Storm of Steel"
  cof_stormtroopers: "Stormtrooper Tactics"
  cof_allied_mastercomputing: "Allied Mastercomputing"
  cof_diffuse_command: "Diffuse Command"
  cof_chemical_attrition: "Chemical Attrition"
  cof_rapid_containment: "Rapid Containment"
  cof_shellshock_rotation: "Shellshock Rotation"
  cof_shellshock_rotation_desc: "The horrors of the Great War have spawned a new illness, one not of the body but of the mind.  Soldiers forced to fight day after day lose so much of themselves they can hardly be called men. If we want our soldiers to be at  full strength they must be allowed time to rest. To absorb and accept the horrors they find on the frontlines. Lest we get walking  corpses who just wish for death"
  cof_field_therapies: "Field Anti-Septic Therapy"
 
