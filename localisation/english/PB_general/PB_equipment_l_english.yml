 armored_car_equipment: "Armored Car"
 armored_car_equipment_desc: "Light-weight armored wheeled vehicles. Common for reconnaissance and resistance suppression, but can be fitted with heavier armaments." 
 gw_armored_car_equipment: "Interwar Armored Car"
 gw_armored_car_equipment_desc: "Where previous armored cars were simple commercial models with thin steel plating, this model was designed from the ground up to carry armor and light armament."
 armored_car_equipment_1: "Basic Armored Car"
 armored_car_equipment_1_desc: "An improved internal layout and additional ammunition storage creates a more effective armored car."
 armored_car_equipment_2: "Improved Armored Car"
 armored_car_equipment_2_desc: "Changes on the battlefield require a much heavier armament and thicker armor to defeat enemy light units and survive to report back."
 armored_car_at_equipment: "Anti-Landship Armored Car"
 armored_car_at_equipment_desc: "Our light mechanized units will come into contact with enemy landships forces at some point. Developing a special anti-landship variant would give them a fighting chance."
 armored_car_aa_equipment: "Anti-Air Armored Car"
 armored_car_aa_equipment_desc: "We can utilize armored cars as fairly reliable and cheap anti-air defenses. Developing a special anti-air variant would help us to take down enemy aircrafts."


 train_equipment: "Train"
 train_equipment_desc: "Trains transport supplies from the Supply Capital to Supply Hubs connected by rail."
 train_equipment_1: "Civilian Train"
 train_equipment_1_desc: "Taken over by the military from regular civilian freight duty, this train engine is well-suited to move a large amount of supplies over long distances. However, its civilian construction makes it vulnerable."
 train_equipment_2: "War Austerity Train"
 train_equipment_2_desc: "A simplified design that ommits many features commonly found on regular freight trains for the sake of cheaper production. It is still every bit as vulnerable as a regular train, but can more easily be replaced."
 train_equipment_3: "Armored Train"
 train_equipment_3_desc: "A train engine encased in heavy armor to make it less vulnerable to enemy attack. It can carry as much cargo as any other design, but is more expensive to produce."
 railway_gun_equipment: "Railway Artillery"
 railway_gun_equipment_desc: "A heavy cannon mounted on a railway carriage for transportation."
 railway_gun_desc: "Railways offer an opportunity to move heavy guns far inland at a reasonable speed, allowing us to bombard enemy position at great range and with good effect."
 railway_gun_equipment_1: "Railway Gun"

 super_heavy_railway_gun_equipment: "Super-Heavy Railway Gun"
 super_heavy_railway_gun_equipment_short: "SH. Railway Gun"
 super_heavy_railway_gun_equipment_desc: "A colossal weapon of unmatched power and precision, which will stand as a testament to relentless pursuit of military superiority of our country."
 super_heavy_railway_gun_equipment_1: "Super-Heavy Railway Gun"
 super_heavy_railway_gun_equipment_1_short: "SH. Railway Gun"
 super_heavy_railway_gun_equipment_1_desc: "$super_heavy_railway_gun_equipment_desc$"

 ### HORRORS ###
 combatagate_equipment: "Combatagates"
 combatagate_equipment_0: "Experimental Combatagate"
 combatagate_equipment_0_desc: "Created in the 1920s due to failed cattle yield experiments, Combatagates function as biological shock cavalry. The creatures are released on the enemy in a highly agitated state, and after between twelve to fourteen hours will die from organ failure via an imprinted biological timer, requiring little cleanup or need for extermination."
 combatagate_equipment_1: "Combatagate Assault Forms"
 combatagate_equipment_1_desc: "Created either to spit in the face of god or prove he has abandoned us, Assault Combatagates are the unnatural evolution of Amalgate Genetics. Less of a real animal and more a violent soup of genes, new model Combatagates are extremely unstable and begin to decompose within minutes of oxygen exposure. The existential horror of their approaching death seems to improve combat performance."
 combatagate_equipment_2: "Venator Class Amalgamate"
 combatagate_equipment_2_desc: "Nicknamed Venators, latin for Hunter, these Amalgamates are the cutting edge of bio-genetic science. Every cell and molecule is meticulously designed to maximize killing potential and combat sustainability. Higher brain functions remain dulled, allowing handlers to direct swarms using chemical markers and electric shocks."

 primordiform_equipment: "Primordiform Amalgamates"
 primordiform_equipment_desc: "Traditionally, primates or primate adjacent species are avoided when mixing genetics. Frankly this is short-sighted and unimaginative, and thus the Primordiform was born. An unholy union of ape, human and mutated DNA, these armed creatures are exceptional shock cavalry."
 primordiform_equipment_0: "Primordiform Amalgamates"

 hardsuit_equipment: "Hardsuit"
 hardsuit_equipment_desc: "$hardsuit_desc$"
 hardsuit_equipment_0: "$hardsuit_equipment$"
 hardsuit_equipment_0_desc: "$hardsuit_desc$"

 razormaiden_augments_equipment: "Razormaiden Augmented Body Parts"
 razormaiden_augments_equipment_0: "Razormaiden Augmented Body Parts"
 razormaiden_augments_equipment_0_short: "Razormaiden A.B.P"
 razormaiden_augments_equipment_0_desc: "While never seeing wartime service, the interwar saw many gearheads experiment on themselves, chasing the perpetually unachievable high of being faster, stronger and deadlier. This practice lead to the development of Razormaidens, a unique class of special operations units largely composed of heavily augmented women. Every appendage is augmented, turning these units into incredibly fast killing machines, in some instances literally armed to the teeth."

 jet_trooper_suit_equipment: "Jet Trooper Suit"
 jet_trooper_suit_equipment_0: "$jet_trooper_suit_equipment$"
 jet_trooper_suit_equipment_0_desc: "Jet Trooper Suit is evolution of well-known paratroopers. It allow units after specialized training achieve incredible speed and versatility. Users can conduct airborne drops, infiltration operations, and flights from sea-based transport units. Suit consists of Jet Packs propelled with a hydrogen-water chemical mixture at speeds and heights only imagined in the world of science fiction, personal weaponry and advanced targetting visors."

 replicated_biomass_equipment: "Replicated Biomass"
 replicated_biomass_equipment_desc: "The dream of any military is a soldier who is willing to accept any order without question. With modern science, we can achieve this dream, at least to some extent. Replicoids are functionally lobotomized of higher brain functions, but they retain enough intelligence to follow any order, no matter how ridiculous.\n\nWith this, we can supplement divisions with disposable lobotomites and focus on a higher quality core military."
 replicated_biomass_equipment_0: "Replicated Biomass"

