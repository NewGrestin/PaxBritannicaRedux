 ## DUOPOD ##
 duopod_automat_archetype: "Duopods"
 duopod_automat_equipment_1: "Duopod I"
 duopod_automat_equipment_1_desc: "The Duopod is the culmination of fixing the mistakes of our Great War automats. Fixing the instability of the design and turning it into a faster, sleaker weapon. While it still sports the thin armor of its predecessor, the Duopod remains a cheap and fast option to add to our impressive arsenal." 
 duopod_automat_equipment_2: "Duopod II"
 duopod_automat_equipment_2_desc: "The Mark II of the Duopod is furthering the design philosophy of the very first Duopod. Turning the flaws of the first Automats on their head, the Mark II further stabilizes the wonky \"legs\" of the machine, allowing for greater speeds and breakthrough. While the light armor gets a slight improvement over the old Duopod design, the Mark II still sports a slender and light armor design, allowing it to be produced even cheaper than the old Duopods."
 duopod_automat_equipment_3: "Duopod III"
 duopod_automat_equipment_3_desc: "The third variant of the Duopod exemplifies the perfecting of a craft. Mark III improves upon the characteristics of the old Duopods immensely, using more standardized parts that keep production costs low and the machine reliable. The perfecting of the Duopod's two legged transportation allows this version to reach speeds of 11/km per hour, turning it into a speed devil unmatched to most on the battlefield."

