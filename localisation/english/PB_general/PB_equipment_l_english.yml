 ### AUTOMATS NSB ###
 ## GW ##
 gw_automat_chassis: "Great War Automat Development"
 gw_automat_chassis_short: "GW Automats"
 gw_automat_chassis_desc: "The Great War spawned many new creations in warfare, the most famous one being the Automat Machines of various kinds. Developed by Imperial Powers to quickly outflank the enemy and accurately hit static or slow moving enemy targets, especially landships. The Automat is one of the greatest breakthroughs in military history making it great counter against landships, guns and ammunition designed specifically to penetrate thick armor and inflict damage to the hull. However the Great War designs have several flaws. The armor is too thin, the structure too unreliable, the engines consume to much fuel for a short distance and furthermore there are still problems with the stability of the legs. But it is solid foundation. A foundation which we can improve upon."

