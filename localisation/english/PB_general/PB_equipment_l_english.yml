 motorized_equipment: "Truck"
 motorized_equipment_desc: "Trucks used for transporting troops, supplies, and for division motorization."
 motorized_equipment_0: "Early Truck"
 motorized_equipment_0_desc: "Early attempts at motorizing the army using civilian trucks began in the late 19th century. These vehicles were used for transporting troops, equipment, and supplies, as well as towing artillery."
 motorized_equipment_1: "Truck"
 motorized_equipment_1_desc: "The first military trucks marked a step toward the mechanization of the army. Larger and more durable vehicles enabled the motorization of the military on a broader scale. This greatly increased the strategic mobility of infantry units, which could now rely on wheels instead of feet."

 mechanized_equipment: "Mechanized"
 mechanized_equipment_short: "Mechanized"
 mechanized_equipment_desc: "Mechanized infantry is infantry equipped with armored personnel carriers (APCs) or infantry fighting vehicles (IFVs) for transport and combat. Mechanized infantry is distinguished from motorized infantry in that its vehicles provide a degree of protection from hostile fire, as opposed to soft-skinned wheeled vehicles (trucks or jeeps) for motorized infantry."
