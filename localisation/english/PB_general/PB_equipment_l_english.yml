 ## TRIPOD ##
 tripod_automat_equipment_1: "Tripod I"
 tripod_automat_equipment_1_desc: "The Tripod is an unusual weapon, created out of a compromise of the old Great War automats: the issues of stabilization, light armor and fuel usage forced designers into either two camps of either Duopods or Quadrupods. The Tripod breaks this trend as a jack-of-all-trades: more stable than the duopods and faster than the quadrupod. However, as a compromise, the Tripod doesn't exhibit the heavy armor or firepower of the Quadrupod, nor does it have the speed or low production cost of the Duopod."
 tripod_automat_equipment_2: "Tripod II"
 tripod_automat_equipment_2_desc: "Being a big improvement on the original compromise of the Tripod I, the Mark II of this weapon expands upon the original design in every way. Heavier armor, bigger guns, better material and even slightly faster, the Tripod II was made to be the ultimate weapon on the battlefield."
