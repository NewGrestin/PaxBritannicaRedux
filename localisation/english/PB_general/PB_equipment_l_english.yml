 modern_tank_chassis: "Main Battle Landship Chassis"
 modern_tank_chassis_short: "MBL Chassis"
 modern_tank_chassis_desc: "A modernized chassis that borrows heavily from previous medium landships, but puts a much bigger emphasis on speed and maneuverability, while also allowing for more armor and bigger guns than usually carried on medium landships. The result is a vehicle that can fill a wide variety of roles."
 main_battle_tank_chassis_desc: "Experience has shown that the designs of light, medium, and heavy landship are converging more and more. heavy landships have gotten more mobile, while light landships are carrying heavier armament and armor to survive. there is therefore value in unifying all three designs into a single type, which will be a universal Main Battle Landship."
