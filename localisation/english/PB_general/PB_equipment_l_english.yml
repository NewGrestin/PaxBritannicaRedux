 quadrupod_automat_equipment_1_desc: "Few things can truly spit in the face of God, but one can easily count the Quadrupod among these god-smiting things. Solving the Great War issue of the automats with the answer of \"more legs, more armor\", the Quadrupod is simply a walking battleship, equiped with guns previously used on cruisers. Still the design has flaws, as the Quadrupod currently stands as a big, slow object, making it a prime target for artillery and planes." 
