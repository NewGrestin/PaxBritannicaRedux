canal_desc: "are needed in place in order for the canal to operate at full capacity, and destroying them would hinder shipping and movement for a long time."
canal_kiel: "Holsteiner Canal Locks"
canal_kiel_plural: "$canal_kiel$"
canal_kiel_desc: "The $canal_kiel$ $canal_desc$."
canal_panama: "Nicaragua Canal Locks"
canal_panama_plural: "$canal_panama$"
canal_panama_desc: "The $canal_panama$ $canal_desc$."
canal_australia: "Janszoon Canal Locks"
canal_australia_plural: "$canal_australia$"
canal_australia_desc: "The $canal_australia$ $canal_desc$."


















