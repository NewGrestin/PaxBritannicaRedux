 ## DESTROYERS ##
 ship_hull_light: "Light Hull"
 ship_hull_light_desc: "The lightest screening vessel. Its job is to defend larger ships and to find and destroy submarines."
 ship_hull_light_1: "Early Destroyer"
 ship_hull_light_2: "Basic Destroyer"
 ship_hull_light_3: "Improved Destroyer"
 ship_hull_light_4: "Advanced Destroyer"
