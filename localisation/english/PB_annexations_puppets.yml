l_english:

  annex_puppets_rus.1.t: "The Future of Yugoslavian Authority"
  annex_puppets_rus.1.d: "With Yugoslavia put under our protection indefinately, our next step is to ensure our claws stay firmly in the country's affairs, with the proposal to restore Danilo II as the monarch, while retaining military and economic control to ensure compliance. On the other hand, Prince of the Imperial Blood Yovan Konstantinovich Romanov, has been put forward as a candidate for his wife's ties to both the Serbian and Montenegrin throne."
  annex_puppets_rus.1.a: "Let's go with Yovan."
  annex_puppets_rus.1.b: "Danilo II is the only choice."
  annex_puppets_rus.1.c: "We should keep Wrangl as regent for now."