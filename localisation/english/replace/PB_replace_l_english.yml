  steel_desc: "Basic metals (Iron, Copper, Carbon, Manganese and others), are used in the construction of most types of military machinery - from infantry weapons, through landships, all the way to ships."
  aluminium_desc: "Those metals (Aluminium, Titanium, Magnesium, Zinc and others) excel wherever both low weight and high durability are required. They are commonly used in aircraft components, automats machinery, and internal armor plates for combatagates, providing a strong yet lightweight structural foundation for advanced military technology."
  tungsten_desc: "High-strength elements (Tungsten, Vanadium, Niobium, Tantalum and others), are used wherever exceptional durability, heat resistance, and structural integrity are required. These alloys are essential in the production of high-pressure mechanical components, reinforced armour plating, artillery parts, and specialized weapon systems as well as advanced tools, allowing military machinery to withstand extreme stress and battlefield conditions."
  chromium_desc: "Composed of advanced high-performance elements (Chromium, Nickel, Molybdenum, Cobalt and others), are engineered to maintain exceptional strength and stability under extreme temperatures and stress. These materials are indispensable in high-output engines, reactive propulsion systems, advanced war machines, and cutting-edge energy weapons, where ordinary alloys would fail. Superalloys provide the thermal resilience and structural reliability needed for the most demanding military technologies."
  grain_desc: "Agriculture products needed for food and rations production."

