 ### SHORT TERM ###
 ### MEDIUM TERM ###
 ## FACTION EXCLUSIVE ##
 # PACTE #
  renounce_treaty_of_tours_goal_name: "Renounce the Treaty of Tours"
  renounce_treaty_of_tours_goal_desc: "The Treaty of Tours was deeply humiliating for us. It is high time we renounce it and reclaim what is ours!"
 # IMPERIAL POWERS #
  complete_nicaragua_canal_goal_name: "Complete construction of the Nicaraguan Canal"
  complete_nicaragua_canal_goal_desc: "The completion of the canal's construction will make it possible to create a connection between the Atlantic and the Pacific through Central America."
 ## GENERIC ##
  a_military_base_goal_name: "Expand Military Industry"
  a_military_base_goal_desc: "The crusade against our enemies requires guns. In order to produce guns in large quantities we need a strong military industry."
  tesla_tower_network_expansion_goal_name: "Expand Tesla Towers Network"
  tesla_tower_network_expansion_goal_desc: "We must keep up with the spirit of the times and gradually replace traditional power lines with the magnificent invention that is the Tesla Tower, which transmits energy wirelessly."
  healthcare_development_goal_name: "National Medical Infrastructure Expansion"
  healthcare_development_goal_desc: "The driving force behind our country, our industry, and our faith in the nation is none other than our people. We must build cutting-edge medical facilities that will allow for safe childbirth and advanced treatments."
  research_jet_engine_goal_name: "Research Jet Engine"
  research_jet_engine_goal_desc: "The era of propeller aircraft is coming to an end, it is time to switch to more advanced jet engines."
 ### LONG TERM ###
 ## GENERIC ##
  the_thermonuclear_race_goal_name: "Build the First Thermonuclear Bomb"
  the_thermonuclear_race_goal_desc: "We have harnessed the power of atomic fission, but before us lies something even more formidable, capable of wiping our enemies from the face of the earth - the power of atomic fusion. With it, the world will fall at our feet."
