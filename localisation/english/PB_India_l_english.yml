  #FOCUS TREE

  generic_india_focus_one: "The Indian Patchwork"
  generic_india_focus_one_desc: "The mighty lands of the Indian Subcontinent, though they have been disunited for the longest time the coming effort of colonization has united many of the people towards a dream of unity. \nThough we may not all agree on the method of unification, there are many among us who believe that a conflict in the coming future is inevitable. \nIf our territory is going to survive the potential coming conflict, we should definitively prepare our people for the years to come."
  RAJ_aleviate_poverty: "Alleviate Poverty"
  RAJ_aleviate_poverty_desc: "Between the remnants of the caste system and general poverty from the ages prior, poverty can definitively be seen as a serious problem among our lands.\nIf we are to ensure that our nation's citizens do not flee to neighboring provinces, we definitively need to alleviate our people's woes."
  RAJ_industrialize_the_soil: "Industrialize the Soil"
  RAJ_industrialize_the_soil_desc: "Despite India's size and populace, there is much of our lands that are not quite industrialized. \nAs our lands still retains a largely agrarian based economy. If we as a people are to truly prosper, we must seek an expansion of our nation's efforts in modernization and industrialization."
  RAJ_open_the_banks: "Open the Banks"
  RAJ_open_the_banks_desc: "The development of a national banking system all around the world has proven great capabilities in the development of a standarized national economy. \nIf we as a people are to ever stand on the national stage we must expand our developments of a banking system of our own."
  RAJ_acquire_foreign_weaponry: "Acquire Foreign Weaponry"
  RAJ_acquire_foreign_weaponry_desc: "India may have the people to create an astounding army, we at the moment do not have a means to arm such an army. \nAs we are in the process of growing our national economy, it may prove useful to purchase some of the surplus arms from other nations in order to continue the development of both parties."
  RAJ_declare_government: "Declare a Rival Indian Government"
  RAJ_declare_government_desc: "We as a people of India must stand united together, though we will not stand if we are stuck beneath the boot of a colonial overlord. \nThere can be no other option, we must declare our nation in opposition to the European colonies abroad."
  RAJ_align_with_the_indian_hegemon: "Align with the Indian Hegemony"
  RAJ_align_with_the_indian_hegemon_desc: "Despite all our efforts to unite our people and expand our economy; it is not pragmatic thinking to believe that we can oppose the might of the European Empires. \nIt can be believed that we both can develop and benefit mutually from befriending eachother."
  
