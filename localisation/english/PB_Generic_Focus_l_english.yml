l_english:


######################################
### NEW GENERIC FOCUS TREE BY OHIO ###
######################################

######################
### POLITICAL TREE ###
######################
generic_our_home_in_1933: "Our Home in 1933"
generic_our_home_in_1933_desc: "As 1933 rolls around, it becomes increasingly clear the next decade will be crucial in not only our nation but the entire world, with the consequences of the Great War and the Second Rennaissance becoming even more notable year after year. While many are nervous, many more are hopeful, working towards a better future for the entire nation. Only time will tell of the country's fate, let us pray it is a good one."

### LEFT WING BRANCH ###
generic_for_the_liberation_of_the_people: "For The Liberation Of The People"
generic_for_the_liberation_of_the_people_desc: "For centuries, the people of the nation have lived oppressed, living in squalor and fear while the aristocrats get fatter and fatter by profiting from the poor's labor. No more. Whispers of revolution grow louder among the workers of the nation, from the fields to the factories, and soon they shall be come a rallying cry for the entire country."

generic_a_revolution_of_the_masses: "A Revolution Of the Masses"
generic_a_revolution_of_the_masses_desc: "From the shoemaker struggling to keep his shop open, to the farmer who can't compete with the agricorps, and to the factory worker who lost his finger in an accident, every worker in the nation is a barrel of gunpowder, ready to blow and destroy it's oppressors, but they only lack the spark to blow. We will ensure the people, the basis of the nation, know of the revolution and are ready for it."

generic_the_message_of_robespierre: "The Message Of Robespierre"
generic_the_message_of_robespierre_desc: "Over a hundred years ago, during the French Reformation, the great thinker Maximilien Robespierre postulated that reform was not enough, that the true way to freedom was revolution, and a complete rejection of the monarchy. While during his time, his ideas remained niche, the 20th century has seen a revival of his ideas throught the world, from Japan to Hungary to Brazil, Jacobin regimes emerge and flourish, and we shall be among them as well. We shall spread Robespierre's great words in newspapers, speeches, waivers and anywhere else we can get our hands on. "

generic_an_end_to_kings: "An End to Kings"
generic_an_end_to_kings_desc: "From their towers and palaces, the aristocrats that have bled the people dry are listening to our song. They grab their bags of gold as they run to foreign shores, knowing their days stealing from us are coming to an end. The kings look in awe from their palaces, hoping their armies will defend them, but it's of no use, for the people are greater than any army. They try to flee and hide, for they hear the people sing a song of liberty 140 years in the making."

generic_form_the_peoples_militias: "Form the People's Militias"
generic_form_the_peoples_militias_desc: "Unfortunately, the world we live in is one hostile to republicanism and our government. While in time, all people in the world may bask in freedom and liberty, today our priority is defending our own nation and her people from the reactionaries beyond our borders. We must arm and train our people into a great people's militia, ready to fight for our dreams of a free republic."

generic_seize_corporate_assets: "Seize Corporate Assets"
generic_seize_corporate_assets_desc: "The royalists and reactionaries were not the only oppressors of our people, no, it was also the great megacorporations of the world who enslaved us, keeping the workers chained to the polluted and unsafe factory floors, and all that only to further line their own pockets, but no more. Today, we shall seize and nationalize all corporate assets within the country, from offices to factories, and put them in the hands of the people to further our nation's progress."

generic_liberation_of_all_peoples: "Liberation of all Peoples"
generic_liberation_of_all_peoples_desc: "While our main revolutionary struggle has always been the workers of the nation, there are other groups who had been equally oppressed by the ruling classes. Be they women, kept away from politics and at the hands of their husbands, the many minorities, ethnic or religious, kept down out of the fear of what they could achieve once free, but these injustices end now. We shall ensure all peoples in the country, no matter their origin or situation, are equal, as there is much more that unites us than there is dividing us."

generic_invite_revolutionary_thinkers: "Invite Revolutionary Thinkers"
generic_invite_revolutionary_thinkers_desc: "The progress of the human race is very important to the global jacobin movement, and so as to contribute to our scientific growth, we have invited scientists, researches and philosophers from around the world to our nation. Be they from friendly jacobin states sharing their research with like-minded scientists or from reactionary states, seeking asylum and freedom to conduct their studies, they are all welcome here."

generic_strive_for_the_people: "Strive for the People"
generic_strive_for_the_people_desc: "We must never forget why and how we came to power in the first place: The People. They were the ones who supported the revolution, the ones who work tirelesly for the improvement of our nation, they are the sole reason Jacobinism as an ideology exists. We must never forget the people and ensure they have all they could possibly need, be it food, medicine or education, we are here for the needs of the people."

generic_never_another_king: "Never Another King"
generic_never_another_king_desc: "While our nation has managed to free itself from it's autocrats and despots, many others around the world still lay under the shadow of oppression, but their wait shall soon be over. We must embark on our most ambitious goal yet, to bring the light of liberty to all peoples across the world. It will be hard, but our people yearn to bring freedom to their foreign comrades, and are ready to strike at the reactionary word. Like we did not too long ago, we must once again spark the fires of revolution, but this time, our nation as a whole shall be the flame."

### RIGHT WING BRANCH ###
generic_an_end_to_weakness: "An End to Weakness"
generic_an_end_to_weakness_desc: "For too long has our once proud nation been held back by the ineffective democratic government, but that won't remain true for long. A movement of patriots, intellectuals and soldiers have come to realize the ills of democracy and the weakness it brings, and they won't stand aside while the nation is demolished brick by brick anymore."

generic_gather_loyalists_in_the_military: "Gather Loyalists in the Military"
generic_gather_loyalists_in_the_military_desc: "Our movement aims to rebuild our nation and propel it to new heights. This, naturally, involves military action. By promising massive increases to the military budget and promising greatness and glory to both officers and soldiers, we can get further support from the nation's armed forces."

generic_ignite_the_flames_of_reaction: "Ignite the Flames of Reaction"
generic_ignite_the_flames_of_reaction_desc: "The people of the country are dulled by liberalism and democracy, made into a weak parody of their ancestors, but this doesn't have to be this way. We will rebuild the people, restore their pride, their honor, their natural desire for greatness. We will promise them victory, and they shall deliver it themselves."

generic_the_strong_act: "The Strong Act"
generic_the_strong_act_desc: "As we get closer and closer each day to complete power over the nation, an argument has begun among our ranks. Currently, we are a coalition between the more radical Neo-Imperialist groups, focused on military buildup and expansion outwards, and the more moderate Despots, more focused on securing and building up the nation from inside. This coalition grows more and more unstable, and soon, as we take hold of power in the nation, we will be forced to decide which faction sahll lead the nation into the future."
## DESPOTIMS SUB BRANCH ##
generic_the_sensible_force: "The Sensible Force"
generic_the_sensible_force_desc: "At last, the nation is once again under a safe and strong hand. The future of the world may look rough and dangerous, but we will maintain order and stability our people never even thought possible under the weak democratic governance of the past."

generic_mobilize_a_war_industry: "Mobilize War Industry"
generic_mobilize_a_war_industry_desc: "To keep our nation and people safe, it is necessary to expand the country's military industry to ensure our army is fully equipped to defend our nation."

generic_a_loyal_workers_duty: "Loyal Workers Duty"
generic_a_loyal_workers_duty_desc: "We must instill a sense of pride and joy in the country's workers. From the farmer keeping our soldiers and children fed, to the steel worker thinking of how many new buildings and homes he's helping build. A proud worker is a happy worker, and a happy worker is a productive worker."

generic_expel_subversive_elements: "Expel Subversive Elements"
generic_expel_subversive_elements_desc: "Unfortunately, our proud nation is filled with people who aren't proud on being part of us. From socialist terrorists to liberal protesters and secessionist minorities, we will no longer tolerate these. We will offer them the generous choice between leaving our nation in two feet, or in a coffin."

generic_educate_the_youth: "Educate the Youth"
generic_educate_the_youth_desc: "It is a well known fact that children are the future of every nation, and therefore education must be a priority to any goverment that intends to last. We will ensure the future generations will be proud and loyal servants of their nation, working for her and defending it with their lives if needed."

generic_restrict_anti_patriotic_ideas: "Restrict Anti-Patriotic Ideas"
generic_restrict_anti_patriotic_ideas_desc: "Our nation is plagued by terrible propagandists, no doubt backed by our foreign enemies to weaken our nation from the inside. We will ban any and all publications which aim to instill Anti-Patriotic beliefs within our citizens, and make sure those found spreading these seditious lies get their deserved punishment."

generic_prevent_degenerate_politics: "Prevent Degenerate Politics"
generic_prevent_degenerate_politics_desc: "Until recently, the country was besieged by weak and degenerate policy. Democratic mob rule, degenerate liberalism, and socialism were all commonplace, but today, those are all unthinkable. The nation is mightier and prouder than ever under our rule, now it is time to ensure it will never again fall to weakness and degeneracy."
## NEO IMPERIALIST SUB BRANCH
generic_rise_of_a_new_dawn: "Rise of a New Dawn"
generic_rise_of_a_new_dawn_desc: "We have finally succeeded. For long, we have waited to seize our chance at ruling this nation, but we were pushed back by the liberals and socialists time and time again, deceiving the people with their lies, but no more. The people have woken up from their lies, and now we must guide them like sheperds into this brand new dawn for the nation."

generic_incite_revanchist_ideals: "Incite Revanchist Ideas"
generic_incite_revanchist_ideals_desc: "Long ago, our nation was much greater than it is today. Both from the incompetence of previous governments and the schemes and tricks from foreign nations, oour nation finds itself in this weakened and humilliated state. We must make sure our people know the names of our lost lands, and of our old enemies. They will yearn for vengeance, and we shall deliver it."

generic_the_glory_of_the_nation: "The Glory of the Nation"
generic_the_glory_of_the_nation_desc: "Our nation and our people are, of course, the greatest in all the world, but sadly, many still are unaware of this. We will teach in schools, in the newspapers and radio, that we are indeed superior and greater than others. Our proud people will be filled with a new hope and enthusiasm, just from the knowledge of their own nations greatness."

generic_ready_the_economy: "Ready the Economy"
generic_ready_the_economy_desc: "Our economy is, currently, simply not up to scale of our grander military projects. We will divert resources from producing unneeded and hedonistic items to more vital products and military equipment. Our people will, of course, understand the necessary changes for the sake of our shared goal of national greatness"

generic_enact_mandatory_conscription: "Enact Mandatory Conscription"
generic_enact_mandatory_conscription_desc: "The one thing that makes all armies equal is their main resource: Manpower. For this, we will introduce a new conscription mandate, making it a mandatory duty to serve in our armed forces. While this will take away resources from the home front, victory in the field of battle is much more vital at this moment."

generic_ban_the_liberal_do_gooders: "Ban the Liberal Do-Gooders"
generic_ban_the_liberal_do_gooders_desc: "Even after all we've done, all the greatness we've achieved, the liberals and the socialists still oppose us. They call us tyrants and despots, but their cries shall finally end. We will find these terrorists and make sure they never again cause us trouble, by any means necessary."

generic_the_birth_of_a_new_nation: "The Birth of a New Nation"
generic_the_birth_of_a_new_nation_desc: "After all we've done in so short a time, we can look upon our beautiful nation and finally feel proud. Finally, we can look together into a great and glorious future for our nation and for our people. Today marks not just a new beginning for our country, but the birth of a new nation altogether."

### CENTRIST BRANCH ###
generic_the_voice_of_liberty: "The Voice of Liberty"
generic_the_voice_of_liberty_desc: "We must not let radicals, be they left or right, destroy our nation and our democracy. We must safeguard our democratic institutions and do our best to discourage radicalism within all sectors of our population."

generic_lift_restrictions_on_parties: "Lift Restrictions on Parties"
generic_lift_restrictions_on_parties_desc: "How can we call ourselves a democracy if we don't allow certain political parties to participate? We must lift restrictions and end bans on political parties that were previously considered dangerous or radical to allow for a truly free democracy to flourish."

generic_depoliticize_the_military: "Depoliticize the Military"
generic_depoliticize_the_military_desc: "Unfortunately, our armed forces are constantly threatened by radicalism, mostly from right wing and authoritarian groups. Promises of glory, money or power are very convincing, so we must fight back. Demoting known radicals, inserting intelligence operatives to root out propagandists and fostering a sense of democratic pride must be important goals for the government."

generic_hold_snap_elections: "Hold Snap Elections"
generic_hold_snap_elections_desc: "At long last, our nation is ready to celebrate truly free and fair elections. Now it is time for the people to decide who will rule them. Let us hope they choose wisely."
## ANARCHO LIBERAL SUB BRANCH ##
generic_the_free_market_speaks: "The Free Market Speaks"
generic_the_free_market_speaks_desc: "The people have made their choice! The free market supporting Anarcho-Liberals have won out on a platform of supporting free business and private enterprise."

generic_deregulate_corporations: "Deregulate Corporations"
generic_deregulate_corporations_desc: "Regulations only exist to limit a businesses success and profitability. By removing some of these regulations, we can create a much more friendly atmosphere for businesses to grow and emerge, which will no doubt boost our nations economy."

generic_reduce_state_power: "Reduce State Power"
generic_reduce_state_power_desc: "The state is another limitant on the natural growth of businesses. It owns valuable land and manages services which could and should be privatized, not only for the sake of the free market but for simple efficiency. We will make the government smaller and auction and sell government owned land and services."

generic_invite_megacorporation_donations: "Invite Megacorporation Donations"
generic_invite_megacorporation_donations_desc: "One of the most important new developments on the global political and economic developments ever since the Second Rennaissance is the emergence of so called megacorporations. While very controversial worldwide, their influence and power is undeniable. By allowing some investments and donations by some of these corporations we can rapidly and effectively improve our economic situation."

generic_combat_radical_extremism: "Combat Radical Extremism"
generic_combat_radical_extremism_desc: "Everyone knows revolutions and civil wars are bad for business. By fighting radicals, be they wannabe military dictators or Japan-backed revolutionaries, they must be quietly silenced for the good of our nation and economy."

generic_permit_corporate_lobbying: "Permit Corporate Lobbying"
generic_permit_corporate_lobbying_desc: "While controversial, lobbying is not inherently wrong or corrupt, but simply the natural end goal of a liberal democracy. Businesses and organizations can ensures candidates that support them and their goals get as many funds as they need to win elections."
## RADICAL EGALITARIAN SUB BRANCH ##
generic_a_peoples_democracy: "Enlighten to the Ideals of Babeuf"
generic_a_peoples_democracy_desc: "The people have made their choice! The leftist Radical Egalitarian party have made their vision for a red tinted utopian democracy clear. Time will tell if their dreams are sucessful or naive optimism."

generic_alleviate_workers: "Alleviate Workers"
generic_alleviate_workers_desc: "Our nations workers have long been oppressed and mistreated by the upper classes. To help them, we must pass stricter laws and regulations, from safety codes to minimum wages. The businessmen may whine, but it is our workers who make up the majority of the country."

generic_increase_welfare_benefits: "Increase Welfare Benefits"
generic_increase_welfare_benefits_desc: "Today, many of the country's workers live much worse than they deserve, parents leaving their children home long hours to put food on the table and old men literally breaking their backs on factory floors, but it doesn't have to be this way. We will alleviate our nation's most impovrished people with welfare, ensuring even they have access to shelter and substenance."

generic_fight_against_big_business: "A Fight Against Big Business"
generic_fight_against_big_business_desc: "Today's capitalism has a new face: The Megacorporations. While incredibly powerful and influential worldwide, they are not unstoppable. With stricter regulations and by improving our workers situation, we can fight back against them and ensure a fairer society in our nation."

generic_allow_state_owned_companies: "Allow State Owned Companies"
generic_allow_state_owned_companies_desc: "While a controversial move, allowing and forming several state owned companies is an important step towards making a fairer economy. By ensuring the country itself has domain over industries like energy and resource extraction, we can ensure a fairer economy all around as well as ensure national sovereignty."

generic_a_pink_tint_over_the_nation: "A Bed of Roses Over the Nation"
generic_a_pink_tint_over_the_nation_desc: "It may have been a long struggle, but we've done it. Today, the nation rises as a truly egalitarian state, where corporations don't threaten the people and the workers can live happily and fairly treated."
## LIBERAL SUB BRANCH ##
generic_liberals_in_power: "Liberals in Power"
generic_liberals_in_power_desc: "The people have made their choice! The progressive and reform minded liberals have been elected into public office, with an ambitious policy of further democratization and progressive changes to the nation."

generic_restrict_government_overreach: "Restrict Government Overreach"
generic_restrict_government_overreach_desc: "While government influence in the economy is both inevbitable and vital, this doesnt mean the government should have full control of the economic system. We will limit the governments influence to only the parts that concern it the most, such as services and important regulations."

generic_expand_womens_roles_in_society: "Expand Womens' Role in Society"
generic_expand_womens_roles_in_society_desc: "For too long, women have been placed in a submissive and secondary position within our nation's society. While some view this as tradition, we must fight so that women too will be represented, allowing them more representation within our democracy and giving them more rights to further their autonomy."

generic_encourage_industrialization: "Encourage Industrialization"
generic_encourage_industrialization_desc: "In the age we live in, the smoke of factories and the roar of engines become more and more inescable every passing year. While some may grit their teeth, it is clear to us that industry is the way forward for our people. We will subsidize industrial developments and ecourage investments into light and heavy industry alike to create our own small industrial revolution."

generic_make_way_for_future_elections: "Make Way for Future Elections"
generic_make_way_for_future_elections_desc: "One of the key aspects of liberalism is the continuation of free democratic elections within our country. In the future, we will have regular elections within our country and hopefully have been the start of a long and proud democratic tradition, but all that can only start by laying the groundworks for lasting democracy right now."

generic_liberalisms_guiding_hand: "Liberalisms' Guiding Hand"
generic_liberalisms_guiding_hand_desc: "Today, our party's liberal policies have become the status quo within the country. From our progressive reforms being entrenched in the constitution to our relaxed economic policies, these policies and more have become standardized nation wide. Our efforts over the past years have given fruit, and liberalism has truly become a standard aspect of our society."
## CONSERVATIVE SUB BRANCH ##
generic_conservatism_at_the_helm: "Conservatism at the Helm"
generic_conservatism_at_the_helm_desc: "The people have made their choice! The sensible and cautious conservatives have won the election, and now work to fulfill their promises of stability and measured growth. Some call them moderate and calm, while others call them inadecuate to meet the global situation."

generic_discourage_extremist_thought: "Discourage Extremist Thought"
generic_discourage_extremist_thought_desc: "Political extremism is a disease that has long rotten our nations social structure. This simply cannot continue. We will attack Jacobins and military radicals, making them weaker than ever to destroy their influence. We won't stoop down to their level, but they will never even smell power in our country ever again."

generic_promote_patriotic_schooling: "Promote Patriotic Schooling"
generic_promote_patriotic_schooling_desc: "We have a duty to teach our children and future generations to be proud citizens of our country, intelligent and capable to lead our nation into heights we couldn't even dream of today. By ensuring a curriculum that makes our children proud to be future citizens, we can ensure a bright future for all our people."

generic_the_natural_party_of_governance: "The Natural Party of Governance"
generic_the_natural_party_of_governance_desc: "In the short time we've held power so far, we've already become quite entrenched within national politics, becoming something of a 'Natural Ruling Party.' The people see us as the reliable standard for rulership, stable and trustworthy. This is of course, a very beneficial position for us to hold, and we'll make sure we use it wisely."

generic_allow_business_expansion_in_infrastructure: "Allow Business Expansion in Infrastructure"
generic_allow_business_expansion_in_infrastructure_desc: "Businesses are not an inherent threat to our nation, but rather a good opportunity. By attracting investments, specially in the field of infraestructure, we gain important business allys as well as new infraestructure which can benefit all of our people."

generic_the_nation_marches_right: "The Nation Marches Right"
generic_the_nation_marches_right_desc: "With the conservatives in charge of the nation, there has been a clear trend towards the right wing, though unlike other right wing trends worldwide, it is a democratic and truly free rightwards turn. The people live free and stable lives under the government, and the conservatives are proud of their fine work."
## REACTIONARY SUB BRANCH ##
generic_returning_to_our_roots: "Returning to Our Roots"
generic_returning_to_our_roots_desc: "The people have made their choice! Seeing a dangerous and changing world all around them, the people of the nation have chosen reactionary elements to represent them. While some consider them dangerous radicals with no love for democracy, they claim they only wish to ensure a return to tradition and stability in these turbulent times."

generic_ferment_a_red_scare: "Ferment a Red Scare"
generic_ferment_a_red_scare_desc: "The greatest threat to the world and to our nation in particular are the violent and degenerated socialists. They threaten revolution and violence yet they still clamor for their so called rights. The people will know to fear and hate these red roaches, and the government will do all in its' power to stomp them out."

generic_construct_a_great_culture: "Construct a Great Culture"
generic_construct_a_great_culture_desc: "Our nations culture is wonderful and magnificent, but it can be even better. By slowly implanting aspects of our policy into every aspect of society, from schools to work places, we can make it so, eventually, Our policies become a part of our very cultural fabric."

generic_sanction_union_busting: "Sanction Union Busting"
generic_sanction_union_busting_desc: "There are few things as damaging to our nation's economy as unions and syndicates. Constantly striking and violently disrupting our industry, and we've had enough of them. From now on, businesses shall be free to break these strikes however they see git, even violently. Our country cannot afford the lazyness of these entitled workers."

generic_permit_paramilitaries: "Permit Paramilitaries"
generic_permit_paramilitaries_desc: "While some view paramilitary groups as dangerous and a threat to democracy, they can be a very useful tool for the state. From breaking up protest and capturing terroristic dissidents to protecting members of the ruling party, they are an invaluable resource for a nation such as ours."

generic_for_a_safe_and_secure_future: "For a Safe and Secure Future"
generic_for_a_safe_and_secure_future_desc: "Mere years ago, the nation was on the verge of chaos and anarchy, but today we live in peace and order. Our soldiers march through the streets to the cheers o the people, while businesses conduct their operations without fears of leftist strikers. We have brought our home to a new age of properity, peace, and tranquility, and now we must reap all the benefits this brings."

#####################
### ECONOMIC TREE ###
#####################
generic_new_age_new_economy: "New Age, New Economy"
generic_new_age_new_economy_desc: "As the world continues marching forwards into an unpredictable future, so must our home progress in every aspect. Our economy must be ready to face the new world that is emerging, but we must decide our focus. Will we focus on rapid advancements in industry and development, or more carefully develop a long term strategy?"
### AS SOON AS POSSIBLE BRANCH ###
generic_the_here_and_now: "Here and Now"
generic_the_here_and_now_desc: "We must focus our efforts on inmediate industrial growth, seeing as industrialization can grant faster and clearer benefits to our economy. We will invest in and subsidize new manufacturing plants and attract foreign investments to jumpstart an industrial economy."

generic_break_ground_for_resources: "Break Ground For Resources"
generic_break_ground_for_resources_desc: "Modern developments in both surveying and extraction methods have allowed mankind access to resources previously unknown or thought inaccessible. We must survey our land for any mineral depostits we could exploit to furthr both our civilian and military sectors."

generic_streamlining_our_methods: "Streamlining Our Methods"
generic_streamlining_our_methods_desc: "Currently, our industries are plagued by superfluous and inneficient practices which lower our total productivity. We will pass laws that increase our overall efficacy and make our legal and industrial codes simpler and easier to use."

generic_militarization_programs: "Militarization Programs"
generic_militarization_programs_desc: "A nation can only remaian free and sovereign if it can ensure it's borders and people are safe within itself. To ensure this, we'll invest greatly into military industry, ensuring our brave troops have all the necessary equipment and resource to fight for our nation should it come down to it."

generic_increase_employment_benefits: "Increase Employee Benefits"
generic_increase_employment_benefits_desc: "As our nation's industrial capabilities grow, so does it's industrial worker class. To ensure all our new factories are properly staffed, as well as helping out some of the poorer sectors in our society, we will establish create a series of benefits for our industrial workers."

generic_expand_farming_facilities: "Expand Farming Facilities"
generic_expand_farming_facilities_desc: "While most of our focus so far has been in expanding our industrial sector, people can't eat gears or steel beams. We must also invest into new farming equipment and practices to make sure all our people are well fed."

generic_equipment_grants: "Equipment Grants"
generic_equipment_grants_desc: "As our armies grow, we are increasingly in need of more and more military equipment to supply said armies. To solve this, we will grant funding and subsidies to military enterprises within our nation to increase production of arms and other equipment to the government. Any investment into our nations defense is a good investment."

generic_expand_factory_sites: "Expand Factory Sites"
generic_expand_factory_sites_desc: "To must further increase our industrial production, we shall create new industrial zones and expand existing ones to allow for the construction of new plants and factories all around our nation. We've already seen the success of our previous industrial growth, so we must do all we can to further grow in this sector."

generic_ensure_quality_methodology: "Ensure Quality Methodology"
generic_ensure_quality_methodology_desc: "Even after all the development we've witnessed, our nation still suffers from outdated practices and ideas when it comes to economics and industry. We will hire foreign experts to train our industrial managers in new and better methods and strategies to benefit not only our overall production rates, but also the quality of these products."

generic_utilize_the_tech_of_tomorrow: "Utilize the Tech of Tomorrow"
generic_utilize_the_tech_of_tomorrow_desc: "We live in rapidly changing times. 50 years ago, the world and technology within it would be completely fantastical, but today they're on our factory floors. And seeing as this trend doesn't seem to be slowing down and is actually accelerating, we will need to stay on our feet so as to not lag behind foreign competitors and rivals."
### SLOW AND STEADY BRANCH ###
generic_an_industry_of_tomorrow: "An Industry of Tomorrow"
generic_an_industry_of_tomorrow_desc: "Rather than inmediate industrial buildup as some propose, we will instead focus on more subtle but still meaningful reforms and changes to the economy. We will ensure that while we may not have the most factories, we will still have the most productive and efficient ones instead."

generic_purchase_blueprints_from_great_powers: "Purchase Blueprints from Great Powers"
generic_purchase_blueprints_from_great_powers_desc: "Why do our own expensive research when others already have? For a fraction of the cost, we can buy blueprints and documents from other nations which have already done plenty of research into these subjects, saving us plenty of time and resources."

generic_expanding_the_cities: "Expanding the Cities"
generic_expanding_the_cities_desc: "The economic core of any nation are it's cities, where trade is conducted, business deals are arranged and factories operate. Naturally, by expanding our cities we can centralize our economic and industrial growth, as well as making it easier for other companies to open up shop in the future, not to mention all the other benefits that come from an urban population."

generic_laying_down_improved_roads: "Laying Down Improved Roads"
generic_laying_down_improved_roads_desc: "Infraestructure is one of the clearest ways we can improve the country's situation both inmediately and in the long term. By building more modern roads, bridges, and tunnels, as well as improving and maintaining exsisting ones, we can make it much more easy for our people to travel around the country, which in turn allows for the easier transport of goods and resources around. It's crucial for us to have an up-to date infraestructure network."

generic_ensure_continued_growth: "Ensure Continued Growth"
generic_ensure_continued_growth_desc: "While currently we are seeing a healthy and growing economy, these good times may not continue for long. We must be cautious and tempered, and invest our resources into ensuring a safe and healthy economic growth in the future. This way, our nations people will be able to breathe much easier in the future since we started planning as early as possible."

generic_open_immigration_for_experts: "Open Immigration to Experts"
generic_open_immigration_for_experts_desc: "While inmigration is a touchy subject for most, few can deny that there are many pepople out there in the wider world with experience and knowledge we could only dream about. And so, we will invite experts in diverse field to the nation, from mathematicians and economists to engineers and biologists, their skills are all invaluable to our nation."

generic_improved_resource_extraction_methods: "Improved Resource Extraction Methods"
generic_improved_resource_extraction_methods_desc: "Natural resources, from oil to copper, are the basis of any economy, providing raw materials for our transformative industry which can then be sold to foreign markets. To ensure we always have a healthy supply of raw materials, we will invest into and develop new methods to gain the most from our nations resources as we can."

generic_our_own_industrial_titans: "Our Own Industrial Titans"
generic_our_own_industrial_titans_desc: "Our nations businesses have been experienced dramatic growth these last few years, to the point some are even being called titans. While these are of course not close to the monsters like Edison Imperial Electric or Tesla Electricworks, we can still experience plenty of the benefits from having corporate entities so large, with considerably fewer of the drawbacks of being hosts to a megacorp."

generic_increased_r_and_d: "Increase R&D"
generic_increased_r_and_d_desc: "The best way to develop our economy is to make sure it is top-notch and on par with the great powers. Scientific development is one of the key focuses of a nation, specially in times such as the ones we live in where the world a man is born in is completely different from the one he will die in. We must invest into the sciences to stay on top of new developments and apply them to the nations benefit."

generic_open_the_nation_to_investment: "Open the Nation to Investment"
generic_open_the_nation_to_investment_desc: "So far, we've mostly been moving money within our own borders, distributing tax money and inter-corporate investments, but now we are faced with the opportunity of allowing foreign investments into our state. While some call this a surrender to foreign powers or a loss for our own economy at the benefit of theirs, the deals are already underway, and the money will soon come pouring in. We must now thread carefully and hopefully we'll all go home happy and richer than before."

generic_expanding_the_scientific_base: "Establish a New University"
generic_expanding_the_scientific_base_desc: "With all the developments our nation and particularly our economic base have seen recently, we can use our new funds to build and establish a brand new university within our country. The facility will have all the modern equimpment it requires to bring our nation to a new height of technology, benefitting all sectors of the economy alongside it."

#####################
### MILITARY TREE ###
#####################
generic_the_necessity_of_military: "Necessity of a Military"
generic_the_necessity_of_military_desc: "Ever since the first men picked up a stone to bash a lions skull, war has been a constant for humnity, and wether we want it or not, an armed force is a necessity for any state to survive. Regardless of our current forces and capabilities, we must divert more resources towards this increasingly important branch of the state."
### ARMY BRANCH ###
generic_ever_evolving_ground_war: "Ever Evolving Ground War"
generic_ever_evolving_ground_war_desc: "War has changed. No longer is it fought by cavalty and firing lines, won in single decisive battles, but instead by ammassed armies armed with landships and duopods, supported by air and sea. If our nation wishes to continue it's prolongued existance, we must adapt to survive this harsh new military reality."
## OLD SCHOOL SUB BRANCH ##
generic_the_tried_and_tested_strategies: "Tried and Tested Strategies"
generic_the_tried_and_tested_strategies_desc: "We have centuries of combat experience to draw upon and learn from, we would be fools not to do so. THe battlefield may change but the basic remain the same in most cases, regardless of technology. We will focus our efforts on improving the basics of our armed forces, down to the individual solder and cannon."

generic_raining_fire_on_the_front: "Raining Fire on the Front"
generic_raining_fire_on_the_front_desc: "Ever since the invention of gunpowder artillery has been the queen of the battlefield. From sieging forts to stopping enemy advances on their tracks, artillery remains a vital part of military strategy. If we can have more cannons than the enemy and shoot larger shells than the enemy, we can be confident we can beat the enemy."

generic_build_conscription_centers: "New Conscription Methods"
generic_build_conscription_centers_desc: "A single soldier may not turn the tide of a battle, much less a war, but many ten thousand singular soldiers can. As ou army grows, we'll need a steady supply of soldiers to meet this demand, and fortunately we have all the tools of the state for this endeavor. We will proclaim new conscription policy, ensuring we have more than enough soldiers at any given time."

generic_preparing_our_support_units: "Preparing our Support Units"
generic_preparing_our_support_units_desc: "While our soldier's fight on the front lines, it isn't only them who ensure victory. From medics to truck drivers to sappers to scouts, we need to give our troops as much of an advantage as possible. By updating our procedures and equipment, we can make sure that our support units can do their best to help our soldiers win."

generic_preparing_bunker_complexes: "Preparing Bunker Complexes"
generic_preparing_bunker_complexes_desc: "Once upon a time, brave knights took shelter in castles and fortresses, fighting bravely against their enemies. Todays soldiers need their own castles to rely on, but we must be more practical and skip the throne rooms. By building series of bunkers and other defensive structures along our borders and vulnerable areas, we can more easily push back any possible invaders."

generic_study_the_great_war: "Study the Great War"
generic_study_the_great_war_desc: "The Great War was a horrific loss of life for all nations involved, but we can learn from their sacrifice and use it to furthern own own armed forces. By studying both the successes and failures during the Great War we can have experience with several tactics and technologies without having to experience them ourselves. We will never forget the Great War, but now, it is time learn from it."
## NEW SCHOOL SUB BRANCH ##
generic_embrace_the_future_of_war: "Embrace the Future of War"
generic_embrace_the_future_of_war_desc: "When the lions and bears were on top of the food chain, man invented the spear. When the Byzantines thought their walls inpenetrable, the Turks rolled out their cannons. When the Spanish felt safe in their trenches, the British used their gas. We must make sure we are at the delivering end of the next change in technological power, lest we be destroyed like those who were unable to evolve fast enough."

generic_import_foreign_landship_designs: "Import Foreign Landship Designs"
generic_import_foreign_landship_designs_desc: "Landships are some of the most promising new military developments in the world. Mobile bunkers that can shred infantry and counter automats, if used correctly, they can be the spearhead of an entire army. We will buy some older blueprints for some outdated landships from the great powers, from which we can build our own in given time."

generic_fund_scientific_research: "Fund Scientific Research"
generic_fund_scientific_research_desc: "To stay ahead of our enemies, we must always hold the technological edge. Investing into new facilities and equipments, designed specifically for military usage, is a good step towards holding absolute dominance against anyone who may dare strike us."

generic_war_of_shock_and_awe: "War of Shock and Awe"
generic_war_of_shock_and_awe_desc: "Developments in armor and motorized vehicles have inspired several officers and military theorists around the world to the possibility of a new type of combat. The basis of Shock and Awe tactics are overwhelming the enemy and striking before it can even realize whats going on. With large motorised and armored groups, our enemies will be dead before they even realize there's a war going on."

generic_train_for_vehicular_warfare: "Train for Vehicular Warfare"
generic_train_for_vehicular_warfare_desc: "Currently, our soldiers are reliant on their own two legs for transport. In this current day, this simply won't stand. We must make efforts to motorize our army, relying on trucks and vehicles to transport our soldiers to and from the front lines, giving us a clear edge over our less developed enemies."

generic_the_future_is_now: "The Future is Now"
generic_the_future_is_now_desc: "Few before the Great War could imagine what warfare could look like but a few decades later. Armies speed through the country side, supported by incredbly powerful landships to strike at the heart of our enemies. What was once the realm of the imaginary for strategists is now the daily life of our soldiers."
### NAVY BRANCH ###
generic_addressing_the_navy: "Addressing the Navy"
generic_addressing_the_navy_desc: "Our nation is blessed with having a coastline, but while this brings obvious benefits, it is also a vulnerability. We must adress this issue before it's too late and invest into strenghtening our navy, be it tasked with defending our shores or attacking the enemys."

generic_design_new_flagships: "Design New Flagships"
generic_design_new_flagships_desc: "The heart and sould of any navy are it's flagships. True titans of the waves, battleships are capable of demolishing smaller ships and providing support from a distance to our land forces, as well as directing a whole fleet from it's comand tower. Modernising our designs for them is vital for our naval success."

generic_increase_small_ship_production: "Increase Small Ship Production"
generic_increase_small_ship_production_desc: "While not as bombastic as a battleship or aircraft carrier, destroyers and cruisers are the main body of any fleet. From protecting said flagships to escorting supply convoys and even providing some support from the sea, they must not be relegated to a secondary role due to their smaller size."

generic_train_admirals_for_battle: "Train Admirals For Battle"
generic_train_admirals_for_battle_desc: "If it's true that a ship is only as good as it's crew, and a crew is only as good as it's captain, then a fleet is only as good as it's admiral. Our naval high command should be trained in modern naval tactics to stay up to date with the rest of the world. Our new navy will be useless if led by incompetent officers."

generic_expand_dockyard_facilities: "Expand Dockyard Facilities"
generic_expand_dockyard_facilities_desc: "The more ships a navy has, the stronger it shall be. It's simple math really, but by expanding our naval production capacity we can ensure that even if we lack the technological or tactical edge, we'll at least have the numerical superiority."

generic_the_carrier_program: "Our Own Carrier Program"
generic_the_carrier_program_desc: "It is becoming increasingly clear that air power will determine the future of wardare, not only on land but on sea as well. Many nations have already experimented with and proven the effectiveness of the aircraft carrier, and we shall follow suit. It will be costly to develop dedicated ships and aircraft for them, but we believe the results will more than make up for it."

generic_the_merchant_fleet_program: "The Merchant Fleet Program"
generic_the_merchant_fleet_program_desc: "Our navy's primary goal is defending our coasts, but farther away, it must also ensure the openness of sea routes to and from our allies. Convoys will be crucial in transporting people and resources accross oceans, but they are much less armed than a regular navy vessel. To counteract this, we shall simply produce many more onvoys than the enemy can sink."

generic_masters_of_the_sea: "Masters of the Sea"
generic_masters_of_the_sea_desc: "We follow on the footsteps of the Greeks, the Venetians, the Spanish and the British. We have become increbly skilled and lethal when it comes to sea combat, and our people will never look out to the sea with fear of an invation, but rather with pride in our sailors. We have truly become masters of the seas."
### AIRFORCE BRANCH ###
generic_take_to_the_skies: "Take to the Skies"
generic_take_to_the_skies_desc: "Possibly the most significant military development of the century so far is the invention of the airplane. Long has mankind dreamt of taking flight like a bird, but only recently has this become a possibility, and high command is already dreaming of the many tactical applications of such an invention."

generic_deepen_pilot_training_programs: "Deepen Pilot Training Programs"
generic_deepen_pilot_training_programs_desc: "Due to the recency of the invention of air travel, most of our pilots have comparably little experience when put against our soldiers or sailors. To solve this, we must create a comprehensive pilot training program for our future pilots. When it comes down to it on a dogfight, the true battle is not between planes, but between pilots."

generic_innovative_bomber_designs: "Innovative Bomber Designs"
generic_innovative_bomber_designs_desc: "Bombers have been dreamt up by strategists and conquerors for centuries. Dropping fire and death onto the enemy from the heavens was the realm of fantasy and religion until recently. We must take full advantage of aircraft and design the most powerful and lethal bombers we can afford."

generic_improve_fighter_designs: "Improve Fighter Designs"
generic_improve_fighter_designs_desc: "Fighter planes are the core of a nations air force, dominating the skies and giving infantry one less flank to worry about. Making our fighter planes sturdier, better, faster and stronger is among our nascent air force's must crucial worries, and we'll ensure our pilots have the best equipment posible to work with."

generic_designated_aircraft_production_facilities: "Designated Aircraft Production Facilities"
generic_designated_aircraft_production_facilities_desc: "Until recently, our aircraft production has taken place at relatively small workshops and converted factories, but this shall no longer be enough. We will build new dedicated plants designed around aircraft production, leading to higher quality planes and a faster production time overall."

generic_prep_for_naval_targeting: "Preparation for Naval Targeting"
generic_prep_for_naval_targeting_desc: "Aircraft gives us a unique advantage on naval combat. Attacking the unprotected aerial flank of ships, big and small, would be a game changer in naval operations and be a huge relief for the navy. We must develop dedicated technology and aircraft for this sole purpose."

generic_invest_transport_planes: "Strengthen the Transport Fleet"
generic_invest_transport_planes_desc: "The aerial transport of large amounts of people and equipment was for a long time thought impossible, but with recent developments in aircraft motors and design, it has become a reality, opening a whole new flank for our army to use. Creating dedicated airborne units, specially trained to deploy from the air, can give us a crucial advantage in future conflicts."

AIR_at_the_ready: "Air At the Ready"
AIR_at_the_ready_desc: "After a long time, our nations aircraft has proven itself an invaluable resource for the armed forces. After all our investments and developments, we can finally say the nations air stands at the ready to defend our skies!"
## FINAL FOCUS ##
generic_pursuit_of_destruction: "In Pursuit of Destruction"
generic_pursuit_of_destruction_desc: "War has changed. No longer can we afford the moral high ground over our enemies. We must use any and all weapons available to us to reach victory, and the horros mankind has created over the last decades are exactly what we need. Chemical weapons burning their organs, man made viruses decimating their homes, livewire tearing through their insides, all are valuable tools of war."

# Wild West Regionals

generic_the_untamed_frontier: "Living in the Frontier"
generic_the_untamed_frontier_desc: "The [ROOT.GetName] is one of the many independent territories that make up the region that many around the world call the Wild West. \n\nWith that status, there lies many benefits that and opportunities give to us, but also many issues and tasks we must stand up to if we are to ensure that our independence is maintained."
generic_modernize_our_military: "Modernize the Military"
generic_modernize_our_military_desc: "With our nation being so far flung from the proper foundations of any modernized civilizations, it is to no surprise that our military prowess is quite on the back-leg among the many nations of the world. \n\nWith the numerous new ways to wage war that have been created in the past two decades, we must modernize our military might before our would be enemies do it first and presumably crush us."
generic_recruit_roaming_gunslingers: "Recruit Roaming Gunslingers"
generic_recruit_roaming_gunslingers_desc: "Among the many areas of the Wild West there are certainly places and people who can be considered quite dangerous.\nWith such an environment there have been a rise of numerous individuals who have gained a reputation for being highly-skilled with rifles, shotguns, revolvers, and weapons of all sorts.\n\nThese so called Gunslingers luckily would often acquire a reputation for being a sort of hired gun, or mercenaries.\nWith a notable lack of proper military training compared to other nations, it would prove quite useful for our nation to hire these skilled people to defend our territory."
generic_welcome_exiled_bankers: "Industrializing the Wastes"
generic_welcome_exiled_bankers_desc: "The vast industry and might from the non-civilized parts of the world is a clear symbol of their national prestige, and national sovereignty.\n\nIf the [ROOT.GetName] is truly to be free from outside forces, we will need to develop our national economy and industry."
generic_the_struggle_for_sovereignty: "Struggling for Sovereignity"
generic_the_struggle_for_sovereignty_desc: "All around our territory there lies others who would blow us off the face of the earth if they had the choice.\n\nThe Wild West is filled with endless raids and lawlessness, and if we are going to defend our state of existance, we're going to need to put a little more effort in defending our Sovereignity"
generic_ensure_welfare_measures: "Erect State Institutions"
generic_ensure_welfare_measures_desc: "As we continue the expansion of our national territory, we acquire more and more people who we must properly provide the necessary means of national security. \n\nMore townhalls, citizen integration efforts, and application of a proper code of laws and the Wild West will become a little less Wild."
generic_a_frontier_tamed: "A Tamed Frontier"
generic_a_frontier_tamed_desc: "Bandits, Gangs, Cults, and Nature Unchecked. \nThere are many words that could describe the Wild West, though lawlessness is ultimately a large stereotype that can be given to our region, and to no amazement. \n\nThough ceasing such a neverending state of lawlessness has been an impossibility to our people for the past many decades, with modern innovations, such an idea is possible, today!"
generic_nation_on_the_rise: "A Nation on the Rise"
generic_nation_on_the_rise_desc: "The days of the Wild West are ending, and from its ashes rises new nations that the earth has never before seen.\n\n If the [ROOT.GetName] is to continue to dream of being one of the players on the international playing field, it will have to step up its game in industrialization and modernization."
generic_into_the_world: "Into the World"
generic_into_the_world_desc: "As the [ROOT.GetName] comes to be more and more important among the nations of the world, there are many much larger countries that may come to wish to tear up the foundations of our nation and her values.\n\nLike David faces the Goliath, we too can prove our capabilities. It is we who know this land, it is we who have lived here for generations, and through the blood of every able body of our nation shall it continue to do so."
generic_against_the_giant: "Against the Giants"
generic_against_the_giant_desc: "As our people once fled from the tyranny of the [AME.GetName], the fear that the [AME.GetAdjective]s would eventually sweep westward and destroy all that we hold dear never vanished. \n\nAs the world enters a new age, we must remain vigilant in our endeavors to defend our young nation against our people's oldest, yet strongest enemy. \n The [AME.GetName]"

##Balkan Regionals

generic_the_ticking_powderkeg: "The Ticking Powderkeg"
generic_the_ticking_powderkeg_desc: "The Balkans have always been a region of strife and conflict, and today is now different, as the shadow of war looms once more. The Hungarian’s Jacobin cause clashes with the desire for Serbian expansion, not to mention the growing desire for Romanian nationalism. If we want to weather the storm that is coming, we need to prepare our nation the best we can."
generic_preparing_our_armies: "Preparing our Armies"
generic_preparing_our_armies_desc: "If our nation is to survive the conflict to come, we need to ensure our armies are up to scratch. Our government has begun a new program to ready our military, mobilizing the armed forces and diverting funds to their improvement. Modernization, raising preparedness, and more equipment will all contribute to helping defending our homes and attacking our enemies. With hard work, we can ensure that we never heel to another power."
generic_overtures_to_the_great_powers: "Overtures to the Great Powers"
generic_overtures_to_the_great_powers_desc: "Russia, Britain, Germany, these superpowers can decide the outcome of a conflict if they so choose, and thus it is imperative we remain on their good side. Our government, sensing the risks that bad relations could bring, have deployed diplomats to visit the great powers, building rapport and garnering support to our country. With good diplomatic maneuvering, we hope to secure their support to ensure the survival of our nation in the face of conflict."
generic_the_fuse_is_lit: "The Fuse is Lit!"
generic_the_fuse_is_lit_desc: "War has returned to the Balkans, as the great powers of the region clash over ideology and territory. This presents us with a choice, as we must pick between siding with the Jacobin movement in Hungary, or side with the Imperial, reactionary powers of Wallachia and Serbia. No matter which choice we make, we need to be ready to possibly enter this war and defend our home."
generic_for_the_common_man: "For the Common Man"
generic_for_the_common_man_desc: "Reaction and imperial thought has dominated the world, and exploited our nation for much too long. The time has come to throw off the shackles of oppression, and fight for our rights and liberty as a nation of the free world. With Hungary, we stand against the monarchists of the Balkans, and we will fight until the battle is won. Long live freedom, lets bring down the empires!"
generic_appeal_to_japan_for_assistance: "Appeal to Japan for Assistance"
generic_appeal_to_japan_for_assistance_desc: "Japan, once an Imperial nation under the thumb of reaction, freed itself from these shackles and thus understands the plight of the common man in todays world. Our government, recognizing the need for foreign aid, has sent diplomats to Tokyo, hoping to meet with the Japanese to discuss aid, whether in the form of equipment or even soldiers. No matter what happens, we will continue to fight against Imperialism in any form!"
generic_ready_rebouts: "Ready Rebouts"
generic_ready_rebouts_desc: "We need to face the reality that our military may not be able to hold the reactionary horde completely. Tactical retreats are a necessity in war, and to prepare for this, we have begun the construction of fortifications throughout the nation. These redoubt lines will allow us to collect our bearings, reorganize, and counter-attack against the invaders with our full force. With this, we can ensure that even in defeat, our soldiers are still defended and can prepare their next moves."
generic_for_a_great_future: "For a Great Future"
generic_for_a_great_future_desc: "Our nation has been ignored, delegated to a weak state where leftists and Jacobins subvert us from the shadows. This ends today, as we join this conflict with the Serbians and their allies against the Jacobin threat. We will fight, for our nations glory and for the cementation of a new era of the Balkans, one where we stand atop the rest. We will have our place in the sun, even if we must bleed for it."
generic_all_or_nothing_tactics: "All or Nothing Tactics"
generic_all_or_nothing_tactics_desc: "If we are going to secure our nations glory, we can hold nothing back in the war against the decadent Jacobins and their lackeys. Our military has been given express orders to commit every possible unit to the attack, throwing our entire force against the enemy like a tidal wave. While there are some who believe this will result in increased casualties, that is simply the reality of war and the cost we will pay to achieve greatness in the future world."
generic_request_french_support: "Request French Support"
generic_request_french_support_desc: "The fight for our nations greatness will not go unheard, as others whos walked the path can provide assistance. The biggest of these new Imperialists, France, has the potential to help us monetarily and and physically, having a grand military and roaring industrial economy. Diplomats in Paris will meet with the French, requesting aid in the Balkan War to help defeat the Jacobin menace and secure our place in the sun, forever."
generic_the_dust_settles: "The Dust Settles"
generic_the_dust_settles_desc: "It’s over. The Great Balkan War has ended, and with it our nation has emerged victorious. Celebrations have erupted throughout the nation, as the military is partially demobilized and the economy begins to shift towards a peacetime production schedule. While the dead will always be remembered and honored, we must begin to look towards a brighter tomorrow, with the Balkans now united behind once cause."


###ARABIAN###
generic_strife_in_the_holy_land: "Strife in the Holy Land"
generic_strife_in_the_holy_land_desc: "As a new age dawns, blood of Arabs and Muslims is once more spilt on to the Holyland. \n\nWe must address the situation and prepare for great struggle in the future as our people face our fellow brethren turn their rifles against us, lest we die in this desert."
generic_utilize_british_smugglers: "Utilize British Smugglers"
generic_utilize_british_smugglers_desc: "Despite the British destabilizing our region, they can still remain quite useful in aquisition of arms, money, and power. \n\nA clear tool that should not be neglected, we should work towards establishing contact with outside forces and establishing deals with these Englishmen."
generic_picking_up_the_pieces: "Picking Up the Pieces"
generic_picking_up_the_pieces_desc: "As the Crescent of the once great Arabia becomes more and more shattered. Despite everything, we shouldn't give up.\n\nWe need to address our current our nation's current situation, its problems, its woes, and how we can better establish the [ROOT.GetName]'s government."
generic_adapt_to_desert_warfare: "Adapt to Desert Warfare"
generic_adapt_to_desert_warfare_desc: "Sand, its coarse, its rough and it gets everywhere.\nBut, we have lived in its for centuries. \n\nIt is where our home lies, and it is ours to control. \nThough our lands may be shattered, our armies shall not be weakened by such frivolties!"
generic_fixing_arabia: "Fixing Arabia"
generic_fixing_arabia_desc: "Though the lands of Arabia may have been destroyed, divided, and marred, this does not mean it should stay this way.\n\nLet it be known to the world that the [ROOT.GetName] will undergo the great initiative to reunite the holyland!"
generic_rally_islamic_warriors: "Rally Islamic Warriors"
generic_rally_islamic_warriors_desc: "The lands of the Arabian Peninsula might have been fractured, but the Islamic people's spirit can never be broken.\n\nTheir spirit, and patriotism flows through us.\nWe will have our home again, God Wills it!"
generic_utilize_our_peoples_determination: "Utilize our People's Determination"
generic_utilize_our_peoples_determination_desc: "History has shown that the people of the Arabian Peninsula are not weak willed people.\nEven in the dark and grim our of the past years, our people's determination remains strong. \n\nWe simply need direct our national spirit, and through that our strength will only grow."
generic_a_crescent_whole: "A Crescent, Whole"
generic_a_crescent_whole_desc: "At long last, after much blood in spilt in the desert, many brothers dead, we can truly proudly said that our homeland is reunited once more.\n\nThough many lives have been lost, and there is much rebuilding to be done, such an accomplishment is worthy of celebration.\nLet us Rejoice!"
generic_for_the_sultans_cause: "For the Sultan's Cause"
generic_for_the_sultans_cause_desc: "Throughout a majority of the Ottoman Empire's history the people of Arabia have been under their protection. \n\nSuch is tradition, and we shall not change this.\nThe Ottoman's shall once again prove themselves to be our comrade in arms, and we shall send forth an envoy to arrange for a return for their protection."
generic_against_ottoman_domination: "Against Ottoman Domination"
generic_against_ottoman_domination_desc: "Under the Ottoman's thumb have we seen the complete destruction of homelands.\nGutted and ripped apart beyond any recognition.\nNever again.\nTo no doubt have we found in recent years the Egyptians of all people to uphold the Arabic cause, and it is with these potential new found friends that we will find our nation rise once more."
generic_topple_the_kings: "Topple the Kings!"
generic_topple_the_kings_desc: "The notions of kings, their decadence and gluttony.\nThey have butchered our lands and enslaved our people, either by corporate or crown.\n\nWe will never bow, nor bend again.\nLet the voices of the masses reign true, and together we the Arab people will stand together and smash the vices of imperialist yoke!"

##INDONESIAN##
generic_aftershocks_of_krakatoa: "Afterschocks of Krakatoa"
generic_aftershocks_of_krakatoa_desc: "Following the eruption in 1915, the Nusantara Islands were engulfed in a horrific volcanic winter, with crops dying, people starving, and the Dutch colonies fragmenting into scattered pieces. Now, nearly two decades later, we can begin our work to repair what was broken, improving our lands and reasserting ourselves over the shattered lands. Let us work hard to erase the memory of the harsh winter, for good."
generic_tending_the_land: "Tending the Land"
generic_tending_the_land_desc: "The lands of Nusantara are still rich for agricultural purposes, but simply require a little bit of work to get into decent shape again, and begin feeding our citizens who desire full bellies. New farming methods imported from Western nations, and dedicated cleanup teams to clear the land, will work in tandem to bring us a new harvest once more."
generic_increased_relief_task_forces: "Increased Relief Task Forces"
generic_increased_relief_task_forces_desc: "Many of our citizens lack adequate supplies, and are stuck starving without the needed supplies to keep surviving. To alleviate this, our government has ordered the creation and funding of new task forces, meant to provide aid to those in need in our nation and ensure the survival of our people in this new age. With the right work, we can reduce the poverty and despair in our country once and for all."
generic_repair_damaged_munitions: "Repair Damaged Munition Factories"
generic_repair_damaged_munitions_desc: "The Dutch and their companies left many scars on the islands during their time as rulers of the land, but some can still be useful to our goals. Military factories, production centers, and multiple manuals to create high tech equipment lie in weight, just awaiting for our liberating hands. These treasure troves will arm our soldiers, improving our nations power and ability to defend ourselves."
generic_assuring_our_citizens: "Assuring our Citizens"
generic_assuring_our_citizens_desc: "The citizens of our nation have for a long time now, distrusted central authority after the failures of the Dutch colony. If we are to stabalize and improve our home, we need to ensure our people trust us, and will fight for us if needed. New outreach programs, improving social programs, and speeches to our proud people will all work to bring us together in a time of strife."
generic_clearing_out_remaining_debris: "Clearing out Remaining Debris"
generic_clearing_out_remaining_debris_desc: "Although we have done good work so far, there are still numerous destroyed and dilapidated buildings scattered throughout our country. These blights on the land cannot remain, and so the government has refocused our efforts on the clearing of these ruins in order to utilize the land for a greater purpose. With the right measures, we can revitalize the nation into a clean, modern marvel."
generic_krakatoa_quiet_again: "Krakatoa, Quiet Again"
generic_krakatoa_quiet_again_desc: "At long last, we have repaired the worst of Krakatoa's damage, breathing new life into what was once considered a doomed land by many outside pundits. The people smile, not worrying about whether they can eat this day, now focused on working hard for the betterment of society. A new dawn has arrived on [ROOT.GetName], and we must all emerge to bask in its light."
generic_a_military_from_the_literal_ashes: "A Military from the Literal Ashes"
generic_a_military_from_the_literal_ashes_desc: "After the Krakatoan explosion, our country became much more caught up in much more integral importancies - to no surpise of course, feeding and saving a populace from a massive ash cloud becomes much more important than maintaining a standing army.\nHowever, as the modern day grows closer and closer, so too does the inevitability of the greater region of Indonesia and our people being caught in the great fires of war.\n\nIf our country is going to survive the coming conflict its certain that we're going to have to rebuild our military from the ground up."
generic_improve_our_training_programs: "Improve our Training Programs"
generic_improve_our_training_programs_desc: "While our military has much catching up to do into the modern age, it would definitely be of great assistance for us to also improve our military training in the mean time.\nArtillery, Machine guns, and Automized weapons are a creation of a modern age.\nOne that modern militaries have brought forth to give them an edge on the battlefield.\nIf we are going to win the next war and modernize our army we're going to have to train our army with these weapons."
generic_scavenge_dutch_supply_depots: "Scavenge Dutch Supply Depots"
generic_scavenge_dutch_supply_depots_desc: "Despite the Dutch East Indies not being directly under our former Dutch master boots; there are many colonial supplies, buildings, and machines that are still sitting there for use by our nation.\nBy sending dedicated teams of scavengers into these former colonial buildings, we can rather easily acquire these weapons and supplies for our own purposes."
generic_restart_the_arms_race: "Restart the Arms Race"
generic_restart_the_arms_race_desc: "Lasers, flamethrowers, automats, hardsuits, the amount of weapons created in the past few decades are insurmountable, plentiful, and effective!\nMilitary research is certainly a boon to have among the many nations of the world that enter the new day, research and development for weapons of a new age have beared fruit, and it is these weapons we must acquire before our enemies do!"
generic_experimental_design_programs: "Experimental Design Programs"
generic_experimental_design_programs_desc: "If it weren't for the experimental ideas of visionaries and scientists, all of which who created the world of science we find ourselves in today, we wouldn't have half the modern day weapons of curious nature and efficiency we have today.\n\nThough under many circumstances experimental weaponry can be considered naive and wasteful to spend our resources on - history has shown us its impact, and for that we can not lose this opportunity again.\nLet the experiments begin!"
generic_quantity_over_quality: "Quantity over Quality"
generic_quantity_over_quality_desc: "At the end of the day it doesn't matter how many weapons of mass destruction or death of any background we have, it is the soldier who pulls t he trigger.\n\nIt is human beings and soldiers that have won wars and that has not changed. \nWe will need men to power and use these weapons, and it is men that we shall have."
generic_the_islands_defenders: "The Island's Defenders"
generic_the_islands_defenders_desc: "After much fighting, [ROOT.GetName] has shown that it has what it takes to unify the people of Indonesia.\nThough we have been presented many woes in the past years, today is a new day.\nA day that the Indonesian people stand hand in hand and fight to maintain her unity for years to come."



