 generic_focus.10.t:0 "Batavia Demands Integration!"
 generic_focus.10.d:0 "While the Papuan Free State has long existed as a nominal satellite of the Dutch military remnants scattered throughout the archipelago, we believed that independence was something we could gain not long in the future. Unfortunately, it seems these dreams of freedom have been dashed, as our ambassadors returned from Batavia with a simple message: Join or Die. With no real military to speak of, our options are either to be crushed as Dutch boots march onto the island, or submit and hope for the best as Van Rappard prepares whatever he is planning. No matter the choice, it seems the bells of freeedom will be stained by tyranny."
 generic_focus.10.a:0 "We don't really have a choice, do we..."

 generic_focus.11.t:0 "The Dutch East Indies demand Papua!"
 generic_focus.11.d:0 "The turmoil in the East Indies has finally come to an end, as Van Rappard and the Dutch remnants has united the island chain under his command. While we initially believed this may be good for us, seeing as the Dutch have long been allies of the German people, it would appear the opposite is true. Commnications from Batavia indicate that they seek to seize the region of Papua from us, and simply await for us to give in and allow it. \n\nWhile allowing it can avert a possible confronation and another costly war in the Pacific, it means surrendering some of our valuable territory and damaging our administration in the eyes of our people. No matter the choice, we must act soon if we are to avoid a deadly incident."
 generic_focus.11.a:0 "We can't afford more distractions, just give it over"
 generic_focus.11.b:0 "And lose valuable resources? Never!"

 generic_focus.12.t:0 "The Germans Accept"
 generic_focus.12.d:0 "While the Papuan Free State has long existed as a nominal satellite of the Dutch military remnants scattered throughout the archipelago, we believed that independence was something we could gain not long in the future. Unfortunately, it seems these dreams of freedom have been dashed, as our ambassadors returned from Batavia with a simple message: Join or Die. With no real military to speak of, our options are either to be crushed as Dutch boots march onto the island, or submit and hope for the best as Van Rappard prepares whatever he is planning. No matter the choice, it seems the bells of freeedom will be stained by tyranny."
 generic_focus.12.a:0 "United at last!"

 generic_focus.13.t:0 "The Germans Decline!"
 generic_focus.13.d:0 "While the Papuan Free State has long existed as a nominal satellite of the Dutch military remnants scattered throughout the archipelago, we believed that independence was something we could gain not long in the future. Unfortunately, it seems these dreams of freedom have been dashed, as our ambassadors returned from Batavia with a simple message: Join or Die. With no real military to speak of, our options are either to be crushed as Dutch boots march onto the island, or submit and hope for the best as Van Rappard prepares whatever he is planning. No matter the choice, it seems the bells of freeedom will be stained by tyranny."
 generic_focus.13.a:0 "We will not forget this..."