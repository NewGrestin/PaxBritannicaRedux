  basic_encryption_with_lar:1 "Encryption - Polyalphabetical Ciphers"
  basic_encryption_with_lar_desc: "With new methods of communication comes new risks for interception. Rotor cipher machines can be  used to allow for rapid, complex encryption."
  improved_encryption_with_lar:1 "Encryption - Cyclic Permutations"
  improved_encryption_with_lar_desc: "Limitation in the randomization of cipher machines can be exploited to break the ciphers. By  improving the randomness of the rotor mechanics, we can make this kind of cryptanalysis more difficult."
  advanced_encryption_with_lar:1 "Encryption - Pulse-code Modulation"
  advanced_encryption_with_lar_desc: "Technological improvements and hard-earned experience allows us to implement more traffic flow  security measures in our communication."
  basic_decryption_with_lar:1 "Decryption - Frequency Analysis"
  basic_decryption_with_lar_desc: "Cryptanalysis is increasingly becoming an advanced mathematical science. Systems like card  catalogs and devices like cyclometers can aid the necessary work."
  improved_decryption_with_lar:1 "Decryption - Side-channel Attack"
  improved_decryption_with_lar_desc: "The development of more sophisticated computers allows for new applications of cryptanalysis  methods like differencing, which can be used to break advanced cyphers when combined with new hand codebreaking methods."
  advanced_decryption_with_lar:1 "Decryption - Automated Deduction"
  advanced_decryption_desc_with_lar: "The increased computation power that improved our cryptanalysis so far threatens to create  nearly unbreakable ciphers in the future. To stay ahead, we must be prepared to work more aggressively on gaining inside information  on the technology."
 
 
