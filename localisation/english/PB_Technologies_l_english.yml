   ### WMD TECHS ##
  WMDs: "Weapons of Mass Destruction"
  WMDs_desc: "The Great War saw the deployment of weaponry that was considered especially cruel to European civilized standards.  Chemical, biological and livewire weaponry were all used on the field, leading to countless dead youngsters and even more scarred by  the psychological toll."
  PB_WMD_Available_tt: "£Generic_Skull §RTerror Weapon Research is now available§!"
 
  chemweapons_basic_1: "Basic Toxic Chemical Compounds"
  chemweapons_basic_1_desc: "The Great War showed to us the power of the most basic chemical compounds, allowing our enemy to choke  our sons to death. As war comes closer to our region once more, proper research needs to be done on the chilling, yet needed  weaponry of basic chemicals."
 
  chemweapons_basic_irritant: "Respiratory Irritants"
  chemweapons_basic_irritant_desc: "As basic as it gets, respiratory irritants are chemicals that were heavily utilized during the  last war. With our research teams only really needing to weaponize already existing chemicals that irritate the eyes, mouth, skin  and any other hole in one's body, respiratory irritants are a useful tool to limit military encroachment."
  chemweapons_basic_choking_agent: "Pulmonary Agents"
  chemweapons_basic_choking_agent_desc: "Breathing is everything. To take away the oxygen of a man is to neutralize him beyond  repair. Chemicals are exactly useful for this kind of neutralization. Simple compounds can make entire armies gasp for air, allowing  us to keep them at bay."
  chemweapons_basic_psychadelic: "Hallucinogens"
  chemweapons_basic_psychadelic_desc: "Ranging from concentrated chemicals made in labs to experimentation with natural resources  like toloache, ketamine and mushrooms, hallucinogens allow us to neutralize an enemy without much harm. By feeding the dark sides of  the mind with these chemicals, soldiers can turn paranoid and delirious, exhibiting complications comparable to clinical insanity."
 
  chemweapons_advanced_irritant: "Pseudo-Incendiary Inhalants"
  chemweapons_advanced_irritant_desc: "The next step in irritation chemicals, pseudo-incendiary inhalants creates a special chemical  burn that sticks to the inside of a victim's lungs. The feeling of a chemical burn on the inside of their lungs is often enough to  neutralize a target, as treatment of the chemical attack can take months."
  chemweapons_advanced_choking_agent: "Caustic Inhalants"
  chemweapons_advanced_choking_agent_desc: "Chemicals that are caustic or errosive damage tissue or property through contact with  other chemicals, often oxygen. Our newest invention takes this principle and adapts it to our pulmonary agents. Inhaling this  chemical leads to the erosion of the human oxygen system, causing slow and painful death."
  chemweapons_advanced_psychadelic: "Artificial Ego Death Inducement"
  chemweapons_advanced_psychadelic_desc: "The ego is perhaps the most important part of the body. It makes us us and differentiates  us with the rest of humanity. To have an ego is to be human. Through chemicals, we have now discovered the possibility of killing  the ego, at least in the experience of the user, leading to individuals with borderline suicidal wishes, unable to understand  themselves or the world around them."
 
  chemweapons_paranoia_bomb_tech: "Artificially-Induced Paranoid Delusion Compound"
  chemweapons_paranoia_bomb_tech_desc: "AIP(D)-C is the culmination of years upon years of chemical research, searching for the  ultimate weapon of breaking minds. Irritating the user beyond any other chemical, the feeling of inflamation is so bad and painful  to a victim that it hinders the ability to perceive reality objectively. Irritation remains long after use, causing immense paranoia  to the point of replicating symptoms from shell shock."
  chemweapons_melta_bomb_tech: "Area-Dispersed High Grade Caustic Bombardment"
  chemweapons_melta_bomb_tech_desc: "Chemical C-X is a highly caustic compound, which, when inhaled, creates the feeling of burning  alive from the inside for its victims. During this time, all vital organs will slowly erose, shutting them down until the patient  dies due to choking."
  chemweapons_mindbreaker_bomb_tech: "Chemically-Induced Limited Psychotic Compound"
  chemweapons_mindbreaker_bomb_tech_desc: "Chemicals have proven to be beyond frightening. Our most recent breakthrough proves this,  as CILPC-'19 instills a dread into soldiers that cannot be compared. Tests on animals have led to pigs, horses and dogs destroying  themselves with anything in the room. Tests with humans have shown similar results, with 21 out of a group of 22 being succesful in  their attempt."
 
  PB_Chemweapons_Available_tt: "£Generic_Gas_Mask §GChemical Weapons can now be deployed§!\n\n"
  PB_Chemweapons_Irritant_Effect_tt: "£Generic_Gas_Mask §GDeployed Chemical Weapons will produce the following effects on states  deployed in:§!\n\n§R-15% Organization Regain\n\n-15% Local Supplies§!"
  PB_Chemweapons_Advanced_Irritant_Effect_tt: "£Generic_Gas_Mask §GDeployed Chemical Weapons will produce the following effects on  states deployed in:§!\n\n§R-25% Organization Regain\n\n-25% Local Supplies§!"
  PB_Chemweapons_Paranoia_Bomb_Effect_tt: "£Generic_Gas_Mask §GDeployed Chemical Weapons will produce the following effects on states  deployed in:§!\n\n§R-25% Organization Regain\n\n-25% Local Supplies\n\n50% Chance of Factory Sabotage\n\n-50% Local Intelligence to  Enemies§!"
  PB_Paranoia_Bomb_Available_tt: "£Generic_Skull §GParanoia Bombs can now be deployed§!\n\n"
 
  PB_Chemweapons_Choking_Effect_tt: "£Generic_Gas_Mask §GDeployed Chemical Weapons will produce the following effects on states  deployed in:§!\n\n§R-15% Factories\n\n15% Attrition for Controller§!"
  PB_Chemweapons_Advanced_Choking_Effect_tt: "£Generic_Gas_Mask §GDeployed Chemical Weapons will produce the following effects on  states deployed in:§!\n\n§R-25% Factories\n\n25% Attrition for Controller§!"
  PB_Chemweapons_Melta_Bomb_Effect_tt: "£Generic_Gas_Mask §GDeployed Chemical Weapons will produce the following effects on states  deployed in:§!\n\n§R-50% Factories\n\n50% Attrition for Controller\n\n-50% Local Supplies for Controller\n\nDisables Strategic  Redeployment while Active§!"
  PB_Melta_Bomb_Available_tt: "£Generic_Skull §GMelter Bombs can now be deployed§!\n\n"
 
  PB_Chemweapons_Pyschadelic_Effect_tt: "£Generic_Gas_Mask §GDeployed Chemical Weapons will produce the following effects on states  deployed in:§!\n\n§R-15% Manpower\n\n-15% Army Speed for Controller§!"
  PB_Chemweapons_Advanced_Psychadelic_Effect_tt: "£Generic_Gas_Mask §GDeployed Chemical Weapons will produce the following effects on  states deployed in:§!\n\n§R-25% Manpower\n\n-25% Army Speed for Controller§!"
  PB_Chemweapons_Mindbreaker_Bomb_Effect_tt: "£Generic_Gas_Mask §GDeployed Chemical Weapons will produce the following effects on  states deployed in:§!\n\n§R-50% Manpower\n\n-50% Army Speed for Controller\n\n50% Chance of Factory Sabotage\n\n+50% Local  Intelligence to Enemies§!"
  PB_Mindbreaker_Bomb_Available_tt: "£Generic_Skull §GMelter Bombs can now be deployed§!\n\n"
 
  bioweapons_basic_1: "Laboratory Conditions for Germ Growth"
  bioweapons_basic_1_desc: "With the field of epidemiology still being very young, germ theory still has a lot to be desired. One of  the first steps towards researching the smallest parts of our biology is the right conditions for laboratory experiments."
  bioweapons_basic_2: "Early Gestation Procedures"
  bioweapons_basic_2_desc: "As research in laboratories continue, new methods have been found to speed up the process of gestation  among most viruses. By applying this new knowledge, we can continue to discover the wonderful information of epidemics."
  bioweapons_basic_2_lab: "Establish Laboratory Conditions"
  bioweapons_basic_2_lab_desc: "With research on germs and viruses continueing to mature, new methods of handling these dangerous  things are created. With improved methods of handling biological weapons in the lab, more research can be done to uncover their  mysteries."
  bioweapons_basic_2_grow_vats: "Growth Vats"
  bioweapons_basic_2_grow_vats_desc: "The creation of a virus can be a tedious process, sometimes taking months while we need them in  weeks. By applying our research on gestation and introducing new insights on virus creation, we can create the perfect conditions  for specific viruses to thrive."
  bioweapons_basic_2_dispersal: "Dispersal Methods"
  bioweapons_basic_2_dispersal_desc: "If we seek to weaponize God's green earth into biological bombs, we first need to understand  the best way to spread out deadly disease in a military setting. By using planes and carefully constructed bombshells, we can  disperse these microscopic threats among enemy armies."
 
  bioweapons_anthrax: "Breed Anthrax Colonies"
  bioweapons_anthrax_desc: "Anthrax is a nasty bacterium. First showing up like a common fever, an airborne strain of anthrax can  easily wipe out battalions, wielding a fatality rate of between 60 and 80% when untreated. With the complications of treating  anthrax in the field, soldiers can drop like flies when the anthrax bombs are dropped."
  bioweapons_smallpox: "Bio-Engineered Smallpox"
  bioweapons_smallpox_desc: "Smallpox was the virus that wiped out the Atlantic indians, lacking the immunity of the Old World. This  posed the horrifying question: what if we could weaponize smallpox in a similar manner for every man on earth? Thus, bio-engineering  produced megapox, a strain of smallpox with a fatality rate reaching the 90%."
  bioweapons_botulism: "Botulinum Growth Genome"
  bioweapons_botulism_desc: "An unorthodox disease, botulism paralyses the victim in a matter of days. Caused by the bacteria  clostridium botulinum, botulism has a small fatality rate but is possible to transmit through soil and water. Deploying such a  weapon can thus potentially damage a region for months."
  bioweapons_Influenza: "Influenza Variant Testing"
  bioweapons_Influenza_desc: "The flu is a highly infectious disease, excellent for making bioweaponry. Disabling soldiers to the  point that they cannot continue fighting, influenza is rarely fatal. However, using such an infectious disease can easily backfire,  especially when it spreads to our side through combat."
 
  PB_Bioweapons_Warning_tt: "£Generic_Skull §RBiological Weapons are an extremely dangerous course of development. Exercise extreme  caution.§!\n\n"
  PB_Bioweapons_Warning_Anthrax_tt: "£Generic_Skull §RAnthrax will produce the following effects on states it is deployed in\n\n-25%  Local Manpower\n\n-50% Local Non Core Manpower\n\n+25% Attrition for Controller of Affected State§!\n\nDue to the nature of how  Anthrax is deployed, it will not spread outside the deployed state."
  PB_Bioweapons_Warning_Smallpox_tt: "£Generic_Skull §RSmallpox will produce the following effects on states it is deployed  in\n\n-50% Local Manpower\n\n-75% Local Non Core Manpower\n\n-50% Supplies in Affected States§!\n\nDue to the nature of Smallpox and  its' methods of transmission, it is §YLIKELY§! it will spread to other states."
  PB_Bioweapons_Warning_Botulism_tt: "£Generic_Skull §RBotulism will produce the following effects on states it is deployed  in\n\n-25% Local Resources\n\n-25% Local Non Core Manpower\n\n-50% Supplies in Affected States§!\n\nDue to the nature of Botulism  and its' methods of transmission, it cannot spread beyond the deployed state."
  PB_Bioweapons_Warning_Influenza_tt: "£Generic_Skull §RInfluenza will produce the following effects on states it is deployed  in\n\n-25% Local Manpower\n\n-25% Local Organization Regain§!\n\nDue to the nature of Influenza Variants and their methods of  transmission, it is §RVERY LIKELY§! it will spread to other states."
 
  wmd_livewire: "Livewire Deployment"
  wmd_livewire_desc: "Livewire is a cruel weapon, having seen deployment during the Great War on both sides. Through biological  engineering and early experimentation with amalgamates, livewire became a weapon used on the fronts of Iberia and France. Unlike  boring barbed wire, livewire responds to stimulants, like a soldier touching the wire, leading to it wrapping around the poor soul  and extensive pressure being put on him, like a boa constrictor with razors across its entire body."
  PB_Livewire_Available_tt: "£Generic_Skull §RLivewire can now be deployed§!"
 
   ## AUGMENTS AND SPECIAL SPECIAL FORCES ##
  hardsuit: "Hardsuits"
  hardsuit_desc: "Hardsuits were developed near the end of the Great War as a natural evolution of Automat development. Though bulky,  these suits allowed the pilot to survive extreme environments and survive kinetic attacks that would decimate conventional troops. A  consequence of their use, however, is the need to train and provide therapies to pilots.\n\nThe human brain was simply not designed  to handle a second skin, and without proper training and therapy, the suits can be just as dangerous to their user as they are to  the enemy. To remedy this, pilots must undergo various surgeries and genetic enhancements to prepare their mind and body to  interface with the Hardsuit and truly use it as a heavily militarized second skin."
 
 
  hardsuit_upgrade: "Improved Assault Servos"
  hardsuit_upgrade_desc: "Improved Assault Servos\n\n"
  hardsuit_upgrade2: "Expanded Visual Sensors"
  hardsuit_upgrade2_desc: "Through expanded research on the spectrum of light, science has been able to enable certain parts of the  brain of a hardsuit-user, allowing them to view the world in 11 different spectrums of light.\n\n"
  hardsuit_upgrade3: "Automated Health Assessments"
  hardsuit_upgrade3_desc: "Using a range of medical equipment, the hardsuit can keep an eye on the vital organs of its user. Through  this mechanic, dangerous wounds can easily be detected early, keeping the user save.\n\n"
  hardsuit_upgrade4: "Improved Radio Transmitters"
  hardsuit_upgrade4_desc: "A rather simple but important upgrade, improving the radio transmitter of the hardsuit allows for more  range to coordinate between hardsuit users and the high command.\n\n"
  hardsuit_upgrade5: "Air Conditioning Sensors"
  hardsuit_upgrade5_desc: "As the metal of the hardsuit can, in certain conditions, prove to be useful in other climates, temperature  remains a serious issue for the pilote. Through outer sensors, the hardsuit's air conditioning can regulate the temperature of the pilote.\n\n"
  hardsuit_upgrade6: "Kinetic-Resistant Formed Armor"
  hardsuit_upgrade6_desc: "With new insight on kinetics and increasing application of this knowledge in warfare, new designs for the  hardsuit often include \"crumpling zones\", designed to keep the pilote and the mechanical wiring of the hardsuit save from kinetic trauma.\n\n"
  
  
  techno_janissary: "Techno-Janissary"
  techno_janissary_desc: "Techno-Janissary "
 
 
  techno_janissary_upgrade: "Chainsword Charge"
  techno_janissary_upgrade_desc: "\n\n"
  techno_janissary_upgrade2: "Ballistic Shielding"
  techno_janissary_upgrade2_desc: "\n\n"
