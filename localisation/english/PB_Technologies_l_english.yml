   ## RATIONS #
 
  field_kits3: "Improved Meal Supplements"
  field_kits3_desc: "By including supplements in every meal we can expect every soldier to be at their best."
  field_kits4: "Enhanced Water Tablets"
  field_kits4_desc: "Water is an essential part of every humans diet and we should make sure that our soldiers only receive the finest of water."
 
   ## STIMULANTS ##
  infantry_drugs: "Basic Stimulant Manufacturing"
  infantry_drugs_desc: "Utilizing a combination of various medical science developments, chemistry and electronics, our technical teams can begin creating a whole galaxy of multi-colored uppers, downers, screamers, laughers and mindbreaking psychedelics for combat and civilian use. All under the table and very legal, of course."
  infantry_drugs_pep_pills: "Pep Pills"
  infantry_drugs_pep_pills_desc: "Pep pills will give our men on the field a much needed boost in speed, although these pills do have  the added side affect of possible addiction."
  infantry_drugs_thalasin: "Thalasin"
  infantry_drugs_thalasin_desc: "Thalasin soothes the mind and soul and could be used to ease an unruly populace from revolt."
  infantry_drugs_melange: "Melange"
  infantry_drugs_melange_desc: "Melange also known as 'brown beer' increases the drinkers perception to even the most minute of details."
  infantry_drugs_victory_tonic: "Victory Tonic"
  infantry_drugs_victory_tonic_desc: "Victory Tonic is capable of bringing even the most tired and saddened of individuals back to a  tip-top shape."
  infantry_drugs_2: "Industrial Grade Stimulant Manufacturing"
  infantry_drugs_2_desc: "By expanding our stimulant manufacturing processes we can allow more of our soldiers to utilize our  advancements in drug development."
  infantry_drugs_soma: "Soma"
  infantry_drugs_soma_desc: "Soma makes its users less likely to deviate from group thinking and makes them less inclined to question  higher authorities."
  infantry_drugs_obetrol: "Obetrol"
  infantry_drugs_obetrol_desc: "Obetrol limits the human bodies natural demand for food, it effectively adds a level of artifical  fullness."
  infantry_drugs_milk_plus: "Milk Plus"
  infantry_drugs_milk_plus_desc: "Milk plus is essentialy just milk with just opioids in it. Simple yet very effective."
  infantry_drugs_substance_f: "Substance F"
  infantry_drugs_substance_f_desc: "Substance F is made with wide combination of different drugs that boosts potential brain usage."
  infantry_drugs_3: "Enhanced Industrial Stimulant Manufacturing"
  infantry_drugs_3_desc: "The final form of stimulant manufacturing would be mass industrial production on a scale never seen before"
  infantry_strength_booster: "Musculo-Skeletal Gene Treatment"
  infantry_strength_booster_desc: "By injecting our soldiers with a special musculo-skeletal gene treatment we can expect increased  muscle growth in only a few hours."
  infantry_intelligence_booster: "Ocular Injected Hypothalamus Therapy"
  infantry_intelligence_booster_desc: "Ocular Injected Hypothalamus Therapy is considered to be a unique form of shock therapy where  participants will experience heightened mental functioning."
 
   ## SUPPORT COMPANIES TECHS ##
  tech_flamethrower: "Flamethrowers"
  tech_flamethrower_desc: "Developed during the Great War, Flamethrowers utilize a complex chemical process to launch flaming material against targets. While volatile and unwieldy, these weapons are very effective in urban environments."
  tech_flamethrower_2: "Flamethrowers II"
  tech_flamethrower_2_desc: "Further development of Flamethrowers allows for more compact and reliable equipment."
  tech_flamethrower_3: "Flamethrowers III"
  tech_flamethrower_3_desc: "Ongoing improvements to flame equipment provide support units with even greater safety and effectiveness."
  tech_flamethrower_4: "Flamethrowers IV"
  tech_flamethrower_4_desc: "Advanced flamethrowers enabling attacks at greater range with more efficient fuel usage, along with special fire-resistant suits."
 
  tech_shockjockeys_1: "Shock Jockeys"
  tech_shockjockeys_1_desc: "An interwar expansion on tesla coil technology, Shock Jockeys use backpack mounted electrical coils and  magnetized weaponry to direct high-voltage electrical waves towards enemies, causing nerve damage and liquifying soft tissue. As a  result of their electrical use, these weapons are very effective in defending wet environments."
  tech_shockjockeys_2: "Shock Jockeys"
  tech_shockjockeys_2_desc: "Further stages in the development of Tesla coils, increasing their power, have allowed Shockjockeys to deal even greater damage to their targets."
  tech_shockjockeys_3: "Shock Jockeys"
  tech_shockjockeys_3_desc: "Powerful electric weaponry capable of both liquefying and charring soft tissue simultaneously, using more efficient systems that allow for energy savings."
  tech_shockjockeys_4: "Shock Jockeys"
  tech_shockjockeys_4_desc: "Highly advanced electric weaponry, developed under the watchful eyes of scientists and engineers, can now inflict severe damage on unarmored light vehicles and even temporarily disable heavily armed ones."
 
  tech_panzerhounds_1: "Panzer Hounds"
  tech_panzerhounds_1_desc: "Originally known as Panzerhunde in Germany, a mistranslation of the name during their adoption in  Britain lead to the name Panzer Hound, with some incorrectly calling them Panther Hounds. An example of bio-mechanics, these  machines utilize a dog nervous system in a machine body to produce incredibly fast killing machines for wilderness environments."
  tech_panzerhounds_2: "Panzer Hounds"
  tech_panzerhounds_2_desc: "$tech_panzerhounds_1_desc$"
  tech_panzerhounds_3: "Panzer Hounds"
  tech_panzerhounds_3_desc: "$tech_panzerhounds_1_desc$"
  tech_panzerhounds_4: "Panzer Hounds"
  tech_panzerhounds_4_desc: "$tech_panzerhounds_1_desc$"
