   ## INFANTRY EQUIPMENT AND SUBTECHS ##
 
  victorian_infantry_weapons: "Early Victorian Infantry Weapons"
  infantry_standard_rounds: "Standard Munitions"
  infantry_standard_rounds_desc: " "
  infantry_flechette_rounds: "Flechette Munitions"
  infantry_flechette_rounds_desc: "Flechette rounds can penetrate some forms of enemy armour, usually basic light materials such as  thin steel."
  infantry_armor_piercing_rounds: "Armor Piercing Munitions"
  infantry_armor_piercing_rounds_desc: "Armor Piercing rounds have greater piercing potential then their standard munition counterparts."
  infantry_incendiary_rounds: "Incendiary Munitions"
  infantry_incendiary_rounds_desc: "Incendiary bullets can cause minor third degree burns upon impact."
  infantry_explosive_rounds: "Explosive Munitions"
  infantry_explosive_rounds_desc: "Explosive bullets explode on impact causing major skin tissue damage."
  advanced_infantry_weapons_3: "Improved Infantry Equipment III"
  advanced_infantry_weapons_3_desc: "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Further Modernized to include personal Assault Rifles and anti-landship rockets. Improved availability of weapons previously distributed to a limited extent."
  advanced_infantry_weapons_4: "Improved Infantry Equipment IV"
  advanced_infantry_weapons_4_desc: "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Further Modernized to include personal Assault Rifles and anti-landship rockets. Improved availability of weapons previously distributed to a limited extent."

  infantry_at: "Infantry Anti-Landship I"
  infantry_at_desc: "Arming our infantry units with anti-landship rifles will allow them to take out lighter armored vehicles or automats while maintaining mobility."
  infantry_at2: "Infantry Anti-Landship II"
  infantry_at2_desc: "For infantry to effectively engage heavier armored units, high-explosive anti-landship weapons need to be made smaller and lighter."
  infantry_aa: "Infantry Anti-Aircraft I"
  infantry_aa_desc: "Arming our infantry units with basic anti-aircraft launchers will allow them to shoot to low flying-by aircrafts."
  infantry_aa2: "Infantry Anti-Aircraft II"
  infantry_aa2_desc: "Improved technology allows rocket to travel with higher speed thus making shooting aircrafts easier."
