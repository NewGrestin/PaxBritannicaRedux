  # AUTOMAT UPGRADES #
  basic_duopod_upgrade_1: "Reconstituted Gearbox"
  basic_duopod_upgrade_1_desc: ""
  basic_duopod_upgrade_2: "Onboard Fire Suppressors"
  basic_duopod_upgrade_2_desc: "The light armor of the Duopod is unfortunately prone to bursting into flames if hit in the  wrong spot. To remedy this, the crew has been fitted with the equipment to surpress a sudden fire.\n\n"
  basic_duopod_upgrade_1_nsb: "$basic_duopod_upgrade_1$"
  basic_duopod_upgrade_1_nsb_desc: "$basic_duopod_upgrade_1_desc$"
  basic_duopod_upgrade_2_nsb: "$basic_duopod_upgrade_2$"
  basic_duopod_upgrade_2_nsb_desc: "$basic_duopod_upgrade_2_desc$"
  improved_duopod_upgrade_1: "Improved Targeting Optics"
  improved_duopod_upgrade_1_desc: "With the continued progress of military optics, our Duopods are best not left behind.  Utilizing radium-painted crosshairs, the light Duopod is more able to spot enemies, even during a dark afternoon.\n\n"
  improved_duopod_upgrade_2: "Engine Overclocking Protocols"
  improved_duopod_upgrade_2_desc: "With the experience of war teaching us more and more about properly handling our equipment in  the field, protocols can be designed for the light Duopod and its engine in special breakthrough cases, allowing the crew to fully  utilize a military advantage. \n\n"
  improved_duopod_upgrade_1_nsb: "$improved_duopod_upgrade_1$"
  improved_duopod_upgrade_1_nsb_desc: "$improved_duopod_upgrade_1_desc$"
  improved_duopod_upgrade_2_nsb: "$improved_duopod_upgrade_2$"
  improved_duopod_upgrade_2_nsb_desc: "$improved_duopod_upgrade_2_desc$"

  basic_tripod_upgrade_1: "Dominance Horn"
  basic_tripod_upgrade_1_desc: "A combination of the newest research in the fields of psychology and engineering, a  \"dominance horn\" is a tool to demoralise the enemy through sheer terror. Blasting the airhorn on the Tripod is thus important to  assert dominance.\n\n"
  basic_tripod_upgrade_2: "Heat-Ray Prismatic Accelerators"
  basic_tripod_upgrade_2_desc: "Utilizing the newest insight on prism-conductive warfare, the heat-ray accelerators allow  for a truly phenomenal weapon. By concentrating light through a prism and feeding it enough energy through a complex array of tesla  coils, a beam of light capable of damaging planes is created. \n\n"
  basic_tripod_upgrade_1_nsb: "$basic_tripod_upgrade_1$"
  basic_tripod_upgrade_1_nsb_desc: "$basic_tripod_upgrade_1_desc$"
  basic_tripod_upgrade_2_nsb: "$basic_tripod_upgrade_2$"
  basic_tripod_upgrade_2_nsb_desc: "$basic_tripod_upgrade_2_desc$"
  improved_tripod_upgrade_1: "Integrated Radium Optics"
  improved_tripod_upgrade_1_desc: "The Tripods rely in their optics to remain stable and crawl through the fields at their  impressive speeds. The newest insights on radium-painted optics allows the crew of the Tripod to keep their Tripod stable, even in a  darker context. As far as we are aware, long-term effects aren't detrimental. \n\n"
  improved_tripod_upgrade_2: "Expanded Ration Storage Pods"
  improved_tripod_upgrade_2_desc: "With a weapon designed to breakthrough lines like the Tripod, many crews often find themself  far away from our supply lines. With some reports of Tripod crews snacking on their messaging pidgeons, a new design has been drawn  up that allows for more rations to be stored on the tripod. \n\n"
  improved_tripod_upgrade_1_nsb: "$improved_tripod_upgrade_1$"
  improved_tripod_upgrade_1_nsb_desc: "$improved_tripod_upgrade_1_desc$"
  improved_tripod_upgrade_2_nsb: "$improved_tripod_upgrade_2$"
  improved_tripod_upgrade_2_nsb_desc: "$improved_tripod_upgrade_2_desc$"

  basic_quadrupod_upgrade_1: "Repair Kit Standardization"
  basic_quadrupod_upgrade_1_desc: "The Quadrupods are perhaps the most complicated weapon a modern army can wield in the field,  which shines through in the almost impossible task of assembling a standard repair kit for an ordinary crew. However, we've finally  been able to make one. Let's hope our boys in the field don't have issues with the 366 pages of the manual (which excludes the 201  pages of the special engine manual). \n\n"
  basic_quadrupod_upgrade_2: "Onboard Coffee and Tea Maker"
  basic_quadrupod_upgrade_2_desc: "Despite the horrid creations of man tested on the battlefield, mutilating the youngest  generations both physically and mentally, we shouldn't sink below a certain standard. The Quadrupod crews work hard and thus deserve  an occasional break from trampling the enemy soldier. To allow such a break, a field-specialized coffee and tea maker has been  produced. \n\n"
  basic_quadrupod_upgrade_1_nsb: "$basic_quadrupod_upgrade_1$"
  basic_quadrupod_upgrade_1_nsb_desc: "$basic_quadrupod_upgrade_1_desc$"
  basic_quadrupod_upgrade_2_nsb: "$basic_quadrupod_upgrade_2$"
  basic_quadrupod_upgrade_2_nsb_desc: "$basic_quadrupod_upgrade_2_desc$"
  improved_quadrupod_upgrade_1: "Telescreen Relay Targeting"
  improved_quadrupod_upgrade_1_desc: "While an extremely young technology, the Telescreen, or \"Screenie\" as called by our  soldiers, is a promising way of designing optics for our automats. With such an invention, our soldiers can perhaps properly locate  the enemy from inside their land-born battleship. \n\n"
  improved_quadrupod_upgrade_2: "Low Intensity Heat Ray Emitter"
  improved_quadrupod_upgrade_2_desc: "While the use of prism-induced weaponry has grown somewhat popular, the Quadrupods still lack  any design utilizing the energy-costly tool, due to the already high energy cost of fielding a single Quadrupod. Scientists have  thus drawn up a low intensity version of the weapon, able to be used on flesh with relative success. \n\n"
  improved_quadrupod_upgrade_1_nsb: "$improved_quadrupod_upgrade_1$"
  improved_quadrupod_upgrade_1_nsb_desc: "$improved_quadrupod_upgrade_1_desc$"
  improved_quadrupod_upgrade_2_nsb: "$improved_quadrupod_upgrade_2$"
  improved_quadrupod_upgrade_2_nsb_desc: "$improved_quadrupod_upgrade_2_desc$"

  sp_armored_mpd_naval_engine_conversion_tech: "Naval Engine Conversion"
  sp_armored_mpd_naval_engine_conversion_tech_desc: "Utilizing techniques used in naval engines such as reinforced crankshafts, high-torque transmissions and specialized cooling systems allow us to enhance the power output and durability of Megapods engines, allowing them to better manage the immense weight and stress."
  sp_armored_mpd_all_terrain_footpads_tech: "All-Terrain Footpads"
  sp_armored_mpd_all_terrain_footpads_tech_desc: "Advanced mechanism used in machine footpads allow it to travserse through various enviroments while handling immense weight of it."
  sp_armored_mpd_specialized_field_manuals_tech: "Specialized Field Manuals"
  sp_armored_mpd_specialized_field_manuals_tech_desc: "Distributing detailed training manuals and instruction among the crews of Megapods, covering unique operational procedures, maintenance protocols, and complex battlefield tactics required to effectively command these enormous walking machines."
  sp_armored_mpd_high_caliber_devastator_cannon_tech: "High-Caliber Devastator Cannon"
  sp_armored_mpd_high_caliber_devastator_cannon_tech_desc: "This powerful cannon was specifically designed to destroy heavily armored targets, fortifications, or even masses of enemy infantry. Its broad variety of shell types makes it an effective weapon against any land target."
  sp_armored_mpd_weapon_fire_control_tech: "Weapon Fire Control"
  sp_armored_mpd_weapon_fire_control_tech_desc: "Implementing advanced targeting optics, rangefinders, gyroscopic stabilizers and brand new gun pods mechanism to enhance weapon accuracy and firing coordination, ensuring the guns can effectively engage targets despite their massive recoil and slow maneuverability."
  sp_armored_mpd_stabilization_mechanism_tech: "Advanced Stabilization Mechanism"
  sp_armored_mpd_stabilization_mechanism_tech_desc: "Installing a set of digital and mechanical systems to guarantee maximum stability for the Megapod, preventing it from falling or tripping during movement or combat."
