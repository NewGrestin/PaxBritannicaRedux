  incendiary_bombs: "Incendiary Bombs"
  incendiary_bombs_desc: "Incendiary bombs capable of starting widespread fires, causing severe damage to infrastructure, industry, and agricultural production."
  rotary_cannons: "Rotary Cannons"
  rotary_cannons_desc: "A multi-barreled gun that rotates at very high speed, delivering devastating firepower."
 
 
   ## HELICOPTERS ##
  air_rotary_engine: "Rotary Blade Engine"
  air_rotary_engine_desc: "Based on the early works of Dutch inventor Albert Gillis von Baumhauer and like-minded men of genius, the  rotary blade engine allows us to field a new type of aircraft, more capable of dangerous manuevers and transportation than any  previous design."
  bba_air_rotary_engine: "Rotary Blade Engine"
  bba_air_rotary_engine_desc: "$air_rotary_engine_desc$"
 
   ## ARTILLERY ##
  victorian_artillery: "Early Victorian Artillery"
  artillery6: "Advanced Proximity Fuze"
  artillery6_desc: "The Advanced Proximity Fuze is a fuze that detonates an explosive devices automatically when the distance to the  target becomes smaller then a predetermined value. It works for all kind of artillery or anti air shells and can be made used with  rockets. Recent observations have shown that the lethality with this fuze increase by 5 to 10 times compared to the common contact  fuze."
 
  nuclear_artillery_upgrade_1: "Micro-Nuke Launchers"
  nuclear_artillery_upgrade_1_desc: "Military and nuclear theorists believe that with a more compact unstable isotope artillery guns  would theoratically be able to launch these so called \"Micro-Nukes\" from a safe distance whilst still delivering a deadly payload.  If we were to fully harness the atom then god knows what these Micro-Nukes will be capable of."
  nuclear_artillery_upgrade_2: "Dedicated Scouting Tactics"
  nuclear_artillery_upgrade_2_desc: "By having a team of reconnaissance experts dedicated purely to finding acceptable shelling areas  for our Micro-Nuke launchers we could expect greater planning and deployment speeds of this devestating weapons."
  nuclear_artillery_upgrade_3: "M.A.D Launchers"
  nuclear_artillery_upgrade_3_desc: "Does God have mercy on those that use weapons confined only to the Heavens? Doesn't matter  though, we are already going to hell for dreaming up such destructive technologies, might as well use them."

   ## MOBILE INFANTRY ##

  mechanized_rocket_equipment: "Mechanized Rocket Artillery"
  mechanized_rocket_equipment_short: "Mech. R. Artillery"
  mechanized_rocket_equipment_desc: "Multiple rocket   launchers such as these deliver explosives to a target  area more quickly than conventional artillery, but with  lower accuracy and requiring a longer time to reload. Being mounted on armored transporters, this version is able to launch attacks and change positions before the enemy can return fire."
  mechanized_rocket_equipment_1: "Mechanized Rocket Artillery"
  mechanized_rocket_equipment_1_short: "Mech. R. Artillery"
  mechanized_rocket_equipment_1_desc: "Multiple rocket   launchers such as these deliver explosives to a target  area more quickly than conventional artillery, but with  lower accuracy and requiring a longer time to reload. Being mounted on armored transporters, this version is able to launch attacks and change positions before the enemy can return fire."
 
