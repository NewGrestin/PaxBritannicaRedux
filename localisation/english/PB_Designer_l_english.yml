 automat_light_naval_guns: "Light Naval Guns"
 automat_light_naval_guns_desc: "Guns taken from smaller vessels is one of themost powerful armaments available for Automats. Great against both unarmored and armored targets."


 amphibious_propulsion: "Amphibious Propulsion"
 amphibious_propulsion_desc: "Nozzles mounted on the hull or suspension of the automat allowing it to move faster in the water."
 stabilization_mechanism: "Gyro Stabilization Mechanism"
 stabilization_mechanism_desc: "An complex system of electronic devices and gyroscopes that prevents the automat from tipping over terrain such as steep slopes or uneven ground."
