 automat_heavy_four_man_turret: "Four Man Turret"
 automat_heavy_four_man_turret_desc: "A turret that barely holds enough people to operate such a large and complex machine."
 automat_heavy_six_man_turret: "Six Man Turret"
 automat_heavy_six_man_turret_desc: "A six-person turret enough for effective quadrupod working without overtiring operators."
 automat_heavy_eight_man_turret: "Eight Man Turret"
 automat_heavy_eight_man_turret_desc: "A spacious turret that has enough room to accommodate operators who can work in a rotational system without leaving the machine for long periods of time."
 automat_heavy_fixed_turret: "Quadrupod Fixed Turret"
 automat_heavy_fixed_turret_desc: "The fixed turret of the automat allows only slight movement of the main armament in the horizontal and vertical axis."
 automat_modern_automat_turret: "Modern Turret"
 automat_modern_automat_turret_desc: "An advanced turret mounted on the automat pod allows crew members to efficiently operate the main armament and keep track of their surroundings."

