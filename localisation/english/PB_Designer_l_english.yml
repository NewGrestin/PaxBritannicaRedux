 mpd_heavy_naval_guns: "Heavy Naval Guns"
 mpd_heavy_naval_guns_desc: "The standard main armament for such a massive armored vehicle, these powerful naval-grade cannons are adapted for direct confrontation, delivering devastating firepower against both armored and fortified targets."
 mpd_super_heavy_naval_guns: "Super-Heavy Naval Guns"
 mpd_super_heavy_naval_guns_desc: "An extra large main armament for such a massive armored vehicle, these powerful super-heavy naval-grade cannons are adapted for direct confrontation, delivering devastating firepower against both armored and fortified targets."
 mpd_super_heavy_railway_gun: "Super-Heavy Railway Gun"
 mpd_super_heavy_railway_gun_desc: "This massive gun, originally built for railway platforms, is capable of bombarding targets from extreme ranges with unparalleled destructive power."
 mpd_high_caliber_devastator_cannon: "High-Caliber Devastator Cannon"
 mpd_high_caliber_devastator_cannon_desc: "Specifically designed to penetrate extremely thick armor, this weapon’s high kinetic energy makes it a formidable counter against other super-heavy armored targets."
 mpd_heavy_anti_air_platform: "Heavy Anti-Air Platform"
 mpd_heavy_anti_air_platform_desc: "A platform mounting multiple high-caliber flak guns, designed to defend against enemy bombers and reconnaissance aircraft that threaten the Land Cruiser."
 mpd_medium_naval_guns: "Medium Naval Guns"
 mpd_medium_naval_guns_desc: "Offering a balanced combination of rate of fire and firepower, this guns are effective at engaging lighter vehicles and providing support against unarmored targets."
 mpd_hull_mounted_railway_gun: "Hull-Mounted Railway Gun"
 mpd_hull_mounted_railway_gun_desc: "A repurposed railway gun built directly into the hull for maximum stability, it provides heavy fire support and can engage distant targets with high precision."
 mpd_super_heavy_howitzer: "Super-Heavy Howitzer"
 mpd_super_heavy_howitzer_desc: "A massive howitzer designed to smash fortifications and urban defenses. This variant specializes in delivering high-explosive shells, ideal for clearing entrenched positions and obliterating fortified structures."
 mpd_heavy_high_velocity_cannons: "Heavy High-Velocity Cannons"
 mpd_heavy_high_velocity_cannons_desc: "Anti-tank guns designed to engage and destroy enemy armor with pinpoint accuracy. Their high-velocity projectiles ensure excellent penetration at long ranges."
 mpd_heavy_anti_air_battery: "Heavy Anti-Air Battery"
 mpd_heavy_anti_air_battery_desc: "An anti-air battery equipped with large-caliber guns to target high-speed and high-altitude aircraft, providing a defensive bubble around the vehicle."
 mpd_anti_air_barrage: "Anti-Air Barrage"
 mpd_anti_air_barrage_desc: "Set of cannons pointed towards sky to set it on fire and destroy any passing by aerial vehicles."
 mpd_medium_cannon_turret: "Medium Cannon Turret"
 mpd_medium_cannon_turret_desc: "A standard turret-mounted cannon, capable of engaging infantry and light vehicles. Its compact design makes it versatile for close-quarters combat and secondary roles."
 mpd_assault_gun: "Assault Gun"
 mpd_assault_gun_desc: "Designed for close-range urban warfare and bunker busting. This weapon delivers powerful, high-explosive shells to clear out infantry and hardened targets."
 mpd_high_velocity_cannon_turret: "High-Velocity Cannon Turret"
 mpd_high_velocity_cannon_turret_desc: "A turret fitted with a high-velocity cannon to engage enemy armor. Its smaller size allows it to provide quick and responsive fire support against lighter armored threats."
 mpd_light_anti_air_battery: "Light Anti-Air Battery"
 mpd_light_anti_air_battery_desc: "A light anti-aircraft battery designed to target low-flying aircraft and protecting the vehicle from strafing runs and dive-bombers."
 mpd_flamethrower_turret: "Flamethrower Turret"
 mpd_flamethrower_turret_desc: "A specialized turret that projects a stream of fire, perfect for clearing out fortified positions, infantry, and ambush points. Ideal for close-quarters engagements in dense urban environments."
 mpd_rocket_launcher: "Rocket Launcher"
 mpd_rocket_launcher_desc: "A modular rocket system mounted on the Land Cruiser, delivering devastating rocket barrages to suppress enemy defenses and overwhelm large formations."
 mpd_radio_1: "$tank_radio_1$"
 mpd_radio_1_desc: "$tank_radio_1_desc$"
 mpd_radio_2: "$tank_radio_2$"
 mpd_radio_2_desc: "$tank_radio_2_desc$"
 mpd_radio_3: "$tank_radio_3$"
 mpd_radio_3_desc: "$tank_radio_3_desc$"
 mpd_command_center: "Command Center"
 mpd_command_center_desc: "A fully integrated command center that transforms the Land Cruiser into a mobile headquarters, equipped with advanced communication systems to coordinate large-scale military operations."
 mpd_radar: "Radar"
 mpd_radar_desc: "An early detection system that increases awareness of enemy aircraft and nearby forces, allowing the Land Cruiser to prepare for potential aerial or ground threats."
 mpd_aircraft_catapult: "Aircraft Catapult"
 mpd_aircraft_catapult_desc: "A launch system for small reconnaissance aircraft, enabling the Land Cruiser to scout distant areas and provide real-time battlefield intelligence."
 mpd_helipad: "Helipad"
 mpd_helipad_desc: "A platform for launching helicopters, designed to provide advanced aerial reconnaissance and improved situational awareness on the battlefield."
 mpd_armored_legs: "Armored Legs"
 mpd_armored_legs_desc: "Reinforced armor plating mounted along the legs to protect vulnerable footpads and joint systems from anti-armor weapons and small arms fire."
 mpd_bunker_emplacement: "Bunker Emplacement"
 mpd_bunker_emplacement_desc: "An internal fortified structure, transforming the Land Cruiser into a mobile bunker. It allows the crew to hold defensive positions and fire back at the enemy, even when under heavy fire."
 mpd_shockwave_generators: "Shockwave Generators"
 mpd_shockwave_generators_desc: "Special attachments causing any object targeted by it to be destroyed. Can also create holes in the ground for infantry to entrench."
 mpd_internal_fuel_tanks: "Internal Fuel Tanks"
 mpd_internal_fuel_tanks_desc: "Expanded fuel compartments within the hull, increasing the vehicle’s operational range and reducing the need for frequent refueling stops during extended campaigns."
 mpd_internal_ammunition_compartments: "Internal Ammunition Compartments"
 mpd_internal_ammunition_compartments_desc: "Reinforced storage areas for carrying additional ammunition, allowing the Land Cruiser to sustain prolonged engagements without resupply."
 mpd_wet_ammunition_storage: "Wet Ammunition Storage"
 mpd_wet_ammunition_storage_desc: "Specialized compartments filled with liquid coolant to minimize the risk of ammunition detonations from enemy hits, greatly enhancing crew safety."
 mpd_smoke_generators: "Smoke Generators"
 mpd_smoke_generators_desc: "A system designed to deploy thick smoke screens, masking the vehicle’s movements and reducing its visibility to both ground and air-based threats."
 mpd_stabilizers: "Stabilizers"
 mpd_stabilizers_desc: "Mechanical devices that reduce the recoil and maintain gun alignment when firing, allowing for quicker target reacquisition and more accurate shooting during short halts."
 
 engine_1_8x: "8x Engine I"
 engine_1_8x_desc: "Eight engines allow the largest aircrafts to rise along with a significant payload."
 engine_2_8x: "8x Engine II"
 engine_2_8x_desc: "$engine_1_8x_desc$"
 engine_3_8x: "8x Engine III"
 engine_3_8x_desc: "$engine_1_8x_desc$"
 engine_4_8x: "8x Engine IV"
 engine_4_8x_desc: "$engine_1_8x_desc$"

 jet_engine_8x: "8x Jet Engine"
 jet_engine_8x_desc: "$jet_engine_1x_desc$"
 jet_engine_axial_8x: "8x Axial Jet Engine"
 jet_engine_axial_8x_desc: "$engine_1_8x_desc$"

 incendiary_bomb_locks: "Incendiary Bomb Locks"
 incendiary_bomb_locks_desc: "Mountings for small incendiary bombs under the wings or the fuselage allow the plane to attack ground targets with some hope of success."
 small_incendiary_bomb_bay: "Small Incendiary Bomb Bay"
 small_incendiary_bomb_bay_desc: "A small bay to carry incendiary bombs. Being inside the fuselage reduces drag, but the structural changes necessary for it mean the plane can not do radical maneuvers in air combat."
 medium_incendiary_bomb_bay: "Medium Incendiary Bomb Bay"
 medium_incendiary_bomb_bay_desc: "A mid-sized bomb bay allows carrying enough ordinace to burn a wide variety of targets."
 large_incendiary_bomb_bay: "Large Incendiary Bomb Bay"
 large_incendiary_bomb_bay_desc: "A large bay to carry enough ordinace to burn and destroy even the biggest cities and farms."
 rotary_cannon_1x: "1x Rotary Cannon"
 rotary_cannon_1x_desc: "Small caliber rotary cannons mounted in the fuselage of advanced aircraft. Highly effective."
 rotary_cannon_2x: "2x Rotary Cannon"
 rotary_cannon_2x_desc: "Small caliber rotary cannons mounted in the fuselage of advanced aircraft. Highly effective."
 fighter_rocket_rails: "Fighter Rocket Rails"
 fighter_rocket_rails_desc: "Unguided missiles hung under the wings. It's hard to aim them at a target flying at high speed, but if they do hit, destruction of the enemy aircraft is almost guaranteed."
 homing_missile: "Homing Missile"
 homing_missile_desc: "Thermally guided air-to-air missile with rocket propulsion. It is guided by the heat generated by the flying vehicle. It is very difficult to dodge it, however, a trained pilot should be able to manage without any problems with the help of maneuvers."
 large_rotary_cannon: "Large Rotary Cannon"
 large_rotary_cannon_desc: "High caliber rotary cannon using incendiary or explosive rounds. Lethal to anything on the ground. A known fact is that if you managed to hear its sound then you were not targeted."
 guided_anti_tank_bomb: "Guided Anti-Landship Bomb"
 guided_anti_tank_bomb_desc: "An anti-landship bomb with a rocket engine. It is guided by radio waves. Highly accurate and deadly."


 light_ship_nuclear_engine_1: "Nuclear Light Ship Reactor"
 light_ship_nuclear_engine_1_short: "Light Ship Reactor"
 light_ship_nuclear_engine_1_desc: "A small nuclear reactor, capable of powering light ships without need for refuelling."
 cruiser_ship_nuclear_engine_1: "Nuclear Cruiser Reactor"
 cruiser_ship_nuclear_engine_1_short: "Cruiser Reactor"
 cruiser_ship_nuclear_engine_1_desc: "A powerful nuclear reactor, capable of powering cruisers without need for refuelling."

 ship_light_battery_rocket: "Light Anti-Ship Rocket Battery"
 ship_light_battery_rocket_desc: "A ship-mounted rocket battery. The rockets it fires are specially designed to destroy and pierce the hull of ships."
 ship_heavy_battery_rocket: "Heavy Anti-Ship Rocket Battery"
 ship_heavy_battery_rocket_desc: "$ship_light_battery_rocket_desc$"
 ship_anti_air_rocket: "Anti-Air Rocket System"
 ship_anti_air_rocket_desc: "Anti-aircraft battery mounted on the ship hull which allows for the firing numerous unguided or guided rockets in one burst."
