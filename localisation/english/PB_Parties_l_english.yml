 NI_VARIANT_03:0 "§ONational Labourism§!"
 NI_VARIANT_03_desc:0 "\n\n£GFX_ideology_neo_imperialist_banner_03\n\n\n\n§Y“The bourgeoisie does not understand the labour question.”§!\n-§OCharles Maurras§!\n\n§ONational Labourism§! is a socially-aware strain of nationalism centered on the symbiosis of chauvinistic ethos with class struggle. Highly regarded as an alternative to parliamentarianism and petty politics, Trade Unions and labour organizations often find themselves at the helm of such synthesis; working in tandem with a powerful, centralized State to reshape society along new lines. \n\nAlthough such social organization may resemble those wished by Babeufists and radicals, the key factor differentiating National Labourism from conventional revolutionary movements lies in its adherence to authoritarianism in the political sphere, its proximity toward reactionary ideals and the emphasis it put on nationalism instead of universalism. Rather than turning the State upside down, National Labourism seeks to reinvigorate it through the alliance of the so-called “productive classes” — urban workers, small shopkeepers and the peasantry, united by shared customs and their devotion toward the nation. A grand union only made possible through the rejection of everything considered foreign, be it international megacorporations or the workers from other countries."

 NI_VARIANT_04:0 "§OClerical Ultranationalism§!"
 NI_VARIANT_04_desc:0 "\n\n£GFX_ideology_neo_imperialist_banner_04\n\n\n\n§Y“Our struggle is a Crusade; as soldiers of God we carry with us the evangelism of the world!”§!\n-§OFrancisco Franco§!\n\n§OClerical Ultranationalism§! is, as the name implies, a synthesis of religious dogma and chauvinism rooted in deeply messianic and reactionary views on the world. The church, or alternate religious equivalent, holds major value as an organ of the State — legitimizing the existing hierarchies and social norms within it. \n\nDogma is a principle motivating factor in government decisions, but not the sole factor as typical nationalist ideology still holds considerable sway."

 NI_VARIANT_05:0 "§ORevolutionary Nationalism§!"
 NI_VARIANT_05_desc:0 "\n\n£GFX_ideology_neo_imperialist_banner_05\n\n\n\n§Y“It is time to apply to the mystique of revolution the same critical intelligence that has been applied to the mystique of war.”§!\n-§OGiovanni Baldelli§!\n\nSynthesizing the revolutionary ethos of Jacobinism with the ultranationalist aspirations of neo-imperialists movements, §ORevolutionary Nationalism§! stand as an amalgamation of contemporary radicalism in all its manifestations. Birthed during the tumultuous interwar period in France, Revolutionary Nationalism was first envisioned as a mean to reconcile the myriad of agitating forces seeking to overthrow the disgraced monarchy — nationalists, ultras, republicans and the like, all sharing the same disdain for the regime yet unable to reconcile over their own ideological divides. Theoretical alignment and tactical alliances soon morphing into long lasting cooperation on the political field would later bridge the remaining gaps — setting the framework for an ideology whose apparent contradictions became strengths in rallying large swaths of the population. \n\nOften centered around a charismatic figure cementing the movement around its persona, Revolutionary Nationalist cells usually uphold corporatist views on the economy and the society — with the intent to create an harmonious social body preserved from external influences. The adherence of the masses is often seeked through redistributive measures and a general stance against the traditional elites, be it of aristocratic or bourgeois nature. Such posture generally finds itself transposed on the geopolitical scale, with the homeland itself being considered oppressed by an hostile world order. \n\nIf emancipation for the people may be a component of varying importance for Revolutionary Nationalism, militarism and jingoism remains the cornerstones of such doctrine. For only through the total mobilization of the citizens-turned-soldiers may national independence be secured for good."

 NI_VARIANT_06:0 "§ONeo-Colonialism§!"
 NI_VARIANT_06_desc:0 "\n\n£GFX_ideology_neo_imperialist_banner_06\n\n\n\n§Y“The colonial regime owes its legitimacy to force and at no time does it ever endeavor to cover up this nature of things.”§!\n-§OFrantz Fanon§!\n\n§ONeo-Colonialism§! refers to a particularly reckless variant of imperial colonialism. Rather than merely lording over the colonized groups or conducting purely economically motivated imperialism abroad, Neo-Colonialist regimes seek to actively impose their culture and hierarchies on these foreign groups. And if the natives cannot be entirely subjugated, then their gradual erasure is sought through violent means — forced displacements, mass sterilization and outright genocides being but a few options within the wide array of horrific practices conducted in the colonized areas. \n\nA relatively recent ideological construct, Neo-Colonialism is mainly associated with the illegal Russian-Manchurian regime and its zealous colonial initiative disregarding both locals rights and international laws. The doctrine has also gained traction in the Green Sahara colonies, where Europeanization is still maintained in full."

 NI_VARIANT_07:0 "§OUltramilitarism§!"
 NI_VARIANT_07_desc:0 "\n\n£GFX_ideology_neo_imperialist_banner_07\n\n\n\n§Y“I can picture in my mind a world without war, a world without hate. And I can picture us attacking that world, because they'd never expect it.”§!\n-§OJack Handey§!\n\n§OUltramilitarism§! as a concept refers to ultranationalist states organized primarily around the armed forces and an intense focus on aggressive expansionism. Rather than enforcing a conventional military-styled dictatorship, the Ultramilitarist regimes uphold the absolute primacy of the army and its hierarchical structures on all aspects of life, together with an intense focus on territorial expansion whatever might be the costs. If not entirely planned, the economy is to be streamlined in order to sustain the prolonged war effort — much to the detriment of civilian sectors and the people's quality of life. Uttermost patriotism is commonplace, as is an absolute disregard for the individual and the loss of human lives in the name of conquest. Ultramitarist regimes are dangerous not just for their ability to impose a jingoistic ethos on the whole social body, but for their practical capacity to enforce their aims on the world."

 NI_VARIANT_08:0 "§OPrussonationalism§!"
 NI_VARIANT_08_desc:0 "\n\n£GFX_ideology_neo_imperialist_banner_08\n\n\n\n§Y“We Germans have a far greater and more urgent duty towards civilization to perform than the Great Asiatic Power. We, like the Japanese, can only fulfil it by the sword.”§!\n-§OFriedrich von Bernhardi§!\n\n§OPrussonationalism§! emerged as a concept out of the First National Awakening of the 1920s, which tore through Eastern Europe and nearly unraveled the Russian Empire. Prior to the 1920s, Prussia had existed as a divided state, split between Brandenburg-Prussia and Russian Prussia. It was due to this that a newly independent Prussia had no real national identity to speak of, split between the interests of aristocrats and the ethnic minorities that composed much of the nation’s hinterlands. Poles, Lithuanians, Baltic Germans, and a sizable Russian minority all had diluted the previously German dominated region.\n\nThe ideology of Prussonationalism emerged as an effort to reconcile the Germanic Nationalist ideology with the reality of their divided nation. Rejecting the Pan-German ideology of their forebears, the new Prussonationalist state seeks to reunify with their Western brethren and escape the shadow of their former Russian overlords."

 NI_VARIANT_09:0 "§OInfinistocracy§!"
 NI_VARIANT_09_desc:0 "\n\n£GFX_ideology_neo_imperialist_banner_09\n\n\n\n§Y“Illuminism is becoming a great and formidable power, and I fear, in my conscience, that kings and peoples will have much to suffer from it unless foresight and prudence break its frightful mechanism.”§!\n-§OFrancois Charles de Berckheim§!\n\n§OInfinistocracy§! is not an ideology or a system of governance, but an ideal. For centuries, the world has trended towards anarchy under the rule of peasants, demanding greater and greater rights to destroy themselves with increasing effectiveness. With the advent of Recursive Immortality, this will no longer be an issue. The old guard, the captains of industry, the true power behind the nation have shed the shackles of mortality.\n\nA guiding hand now controls the wheel of society, whether it is aware of it or not is irrelevant. Those whose hands are on the wheel are beyond death, and with the restrictions of mortality shed, a new long-term vision for humanity comes into view.\n\nThe meek will beget the strong; the unwashed masses will be led, as they once were, into a shining future built on the blueprints of a deathless conspiracy.\n\n§rThe future only belongs to those who will live to see it.§!"

 NI_VARIANT_10:0 "§OUltranationalist Mysticism§!"
 NI_VARIANT_10_desc:0 "\n\n£GFX_ideology_neo_imperialist_banner_10\n\n\n\n§Y“The student of occult science either knows a thing or suspends his judgment about it; there is no place in his scheme for blind faith.”§!\n-§OCharles Webster Leadbeater§!\n\n§OUltranationalist Mysticism§! is a niche and relatively obscure ideological framework that combines elements of extreme nationalism with mystical or esoteric beliefs. This ideology is characterized by a fervent and often fanatical devotion to one's nation or ethnic group, coupled with a belief in the supernatural or mystical aspects of their national identity. Ultranationalists believe in the superiority and purity of their nation or ethnic group above all others. They often advocate for the preservation and expansion of their culture, often through exclusionary and xenophobic means.\n\nUltranationalist mystics often use symbols, rituals, and ceremonies with deep historical or mystical significance to reinforce their beliefs. These rituals can include elaborate flag ceremonies, worship of ancestral figures, or the use of sacred texts and artifacts. What sets Ultranationalist mysticism apart is its infusion of mystical or spiritual elements into nationalism. Followers may believe in supernatural connections to their nation's past, including claims of divine intervention or mystical ancestry."

 NI_VARIANT_11:0 "§OMartian Supremacism§!"
 NI_VARIANT_11_desc:0 "\n\n£GFX_ideology_neo_imperialist_banner_11\n\n\n\n§Y“And before we judge of them too harshly we must remember what ruthless and utter destruction our own species has wrought, not only upon animals, such as the vanished bison and the dodo, but upon its inferior races. Are we such apostles of mercy as to complain if the Martians warred in the same spirit?”§!\n-§OH.G. Wells§!\n\n§OMartian Supremacism§! relates to the ideology of the Martian extraterrestrials currently occupying Earth. Hailing from a dying planet, the Martians see humans as squandering the Earth after their own homeworld was destroyed by shifting climates and atomic warfare. This attack, with the goal of exterminating mankind and seizing our planet, is the last desperate gasp of a once mighty empire."

 NI_VARIANT_12:0 "§OTechno-Supremacism§!"
 NI_VARIANT_12_desc:0 "\n\n£GFX_ideology_neo_imperialist_banner_12\n\n\n\n§Y“Man has killed man from the beginning of time, and each new frontier has brought new ways and new places to die. Why should the future be different?”§!\n-§OCol. Corazon Santiago§!\n\n§OTechno-Supremacism§! is the belief that technological advancement, particularly in machine augmentation, automation, and genetic manipulation, is the ultimate solution to societal problems and should take precedence over human decision-making, ethics, or traditional governance.\n\nWhile technological supremacy was a critical issue for the European powers during the Second Renaissance, radical voices argued for the need for relentless, absolute progress. In particular, Techno-Supremacists argued that the Second Renaissance highlighted the failures of conventional modes of human governance. It was only after the Great War that Techno-Supremacism took on a revolutionary bent, with adherents believing that humanity’s propensity for war had created a ticking time bomb.\n\nThe only way to defuse this hypothetical bomb being a radical restructuring of society, elevating those willing to shed their humanity to higher positions of authority over the weak-willed fleshlings."

 NI_VARIANT_13:0 "§OInquisitorialism§!" 
 NI_VARIANT_13_desc:0 "\n\n£GFX_ideology_neo_imperialist_banner_13\n\n\n\n§Y“Feed men, and then ask of them virtue! That will be the banner they raise against Thee, with which they will destroy Thy temple”§!\n-§OGrand Inquisitor, Dostoevsky's The Grand Inquisitor§!\n\n§OInquisitorialism§! is the belief that Christ’s gift of free will is flawed—that the majority of humanity cannot comprehend, tolerate, or be trusted with it. By granting free will, God has excluded most of mankind from redemption and doomed it to suffering. Therefore, the multitude must be guided by the few who are strong enough to bear the burden of freedom, promising a life where all may live and die in ignorance, free from anxiety.\n\nTo turn stones into bread, for man will follow that which fills his belly—thus, man shall live by bread alone."

 NI_VARIANT_14:0 "§ORevalationary Fatimism§!"
 NI_VARIANT_14_desc:0 "\n\n£GFX_ideology_neo_imperialist_banner_14\n\n\n\n§YWIP"

 ds:0 "Despotism"
 ds_noun:0 "Despotism"
 ds_desc:0 "Despotic State"

 DS_VARIANT_01:0 "§ODespotists§!"
 DS_VARIANT_01_desc:0 "\n\n£GFX_ideology_despotist_banner\n\n\n\n§Y“Naked force has resolved more conflicts throughout history than any other factor. The contrary opinion, that violence doesn't solve anything, is wishful thinking at its worst. People who forget that always die.”§!\n-§OJean Rasczak§!\n\n§ODespotism§! is a blanket ideology often ascribed to dictatorships, absolute monarchies and other right-wing authoritarian states. Though they can vary wildly in domestic and foreign policy, despotic regimes will always do everything in their power to crush domestic threats to their power.\n\nThese regimes are often extremely militaristic, focusing on a mixture of reactionary values and propaganda to encourage an almost fanatically loyal population, or, at the very least, a population unwilling to openly challenge their dictates."
 
 DS_VARIANT_02:0 "§OAbsolutism§!"
 DS_VARIANT_02_desc:0 "\n\n£GFX_ideology_despotist_banner_02\n\n\n\n§Y“In the days of those kings the God of heaven will set up a kingdom that will never be destroyed. And this kingdom will not be passed on to any other people.”§!\n-§OBook of Daniel§!\n\n§OAbsolutism§! is an overarching ideology to describe nations where a hereditary monarch holds complete power over the entire government. While there may be individuals in an advisory role, an absolutist government will always centralize all power in the hands of the sovereign."

 DS_VARIANT_03:0 "§OPan-African Nationalism§!"
 DS_VARIANT_03_desc:0 "§OPan-African Nationalism§! is a subset of Pan-Africanist thought that focuses on the nationalist aspect of Pan-African theory. Pan-African Nationalists seek to forge a unified African state based on common identity between African peoples, superseding tribal rivalries. This ideology is more common amongst black nationalist circles such as Garveyites in Hispaniola."

 DS_VARIANT_04:0 "§OPan-Arab Nationalism§!"
 DS_VARIANT_04_desc:0 "§OPan-Arab Nationalism§! is a subset of Pan-Arabist thought emphasizing the nationalistic elements of the Arab unification movement. Pan-Arab Nationalists are not typically democratic, pushing for a united nationalist vanguard party with limited social reforms. They chiefly focus on industrialization and secularization of Arab society."

 DS_VARIANT_05:0 "§OTechnocratic Despotism§!"
 DS_VARIANT_05_desc:0 "\n\n£GFX_ideology_despotist_banner_03\n\n\n\n§Y“As industrial processes involve specialized skill and expert technical training, made effective by intelligent co-ordination, it is clear that a humanly efficient Industrial Democracy necessitates leadership by those who possess the requisite knowledge, skill, and technical training.”§!\n-§OWilliam Henry Smyth§!\n\n§OTechnocratic Despotism§! is a system of government by which the country is run in a non-democratic manner by technical or scientific specialists. Technocrats believe that democratic ideals are intrinsically against effective management of the government, and believe almost religiously in a form of scientific meritocracy."

 DS_VARIANT_06:0 "§OAuthoritarian Democracy§!"
 DS_VARIANT_06_desc:0 "\n\n£GFX_ideology_despotist_banner_04\n\n\n\n§Y“Words like freedom, justice, democracy are not common concepts; on the contrary, they are rare. People are not born knowing what these are. It takes enormous and, above all, individual effort to arrive at the respect for other people that these words imply.”§!\n-§OJames Baldwin§!\n\n§OAuthoritarian Democracy§! is a system of government where democracy is conducted by the ruling elite of an authoritarian state in an effort to represent the varying interests of a society. In most cases, this manifests as a form of managed democracy wherin candidates are managed and approved by the ruling government to prevent the manifestation of any anti-government leadership."

 DS_VARIANT_07:0 "§OBolivarian Democracy§!"
 DS_VARIANT_07_desc:0 "§OBolivarian Democracy§! is a unique system of government established under the Bolivarian Empire following the accession of Simon Bolivar as Emperor. Best described as a mix of German Constitutionalism and hegemonic democracy, Bolivarian Democracy is an enigmatic ideology often subject to the interpretations of its' adherents.\n\nDespite being undeniably authoritarian, Bolivarian Democracy has seen a wide variety of variation in policy. Populism has remained a key component of the ideology, being seen as the primary means by which the government maintains the support of Colombia's population."

 DS_VARIANT_08:0 "§ODominant Party Democracy§!"
 DS_VARIANT_08_desc:0 "\n\n£GFX_ideology_conservatism_banner_04\n\n\n\n§Y“Of all forms of tyranny the least attractive and the most vulgar is the tyranny of mere wealth, the tyranny of a plutocracy.”§!\n-§OTheodore Roosevelt§!\n\n§ODominant Party Democracy§! is a system of governance wherein a single party rules without major opposition, even without the need for laws to restrict said opposition.\n\nThis party hegemony may be born out of genuine popularity, or it may be born from there simply being no notable alternatives. In many cases, however, dominant party democracies tend to be defined by corruption and intimidation tactics to maintain control."

 DS_VARIANT_09:0 "§OOrthodox Cosmism§!"
 DS_VARIANT_09_desc:0 "\n\n£GFX_ideology_despotist_banner_05\n\n\n\n§Y“It is man's relation to the cosmos — to the unknown — which alone arouses in me the spark of creative imagination.”§!\n-§OH.P. Lovecraft§!\n\nRussian Cosmism emerged in Russia in the late 19th and early 20th centuries, building off the modernization efforts of Alexander II. It proposed a vision of human existence that combined elements of science, spirituality, and the exploration of outer space.\n\nCentral to Russian Cosmism is the belief in the unlimited potential of human beings and the pursuit of immortality. Cosmists envisioned a future where humans could overcome the limitations of the physical body and achieve eternal life through scientific and technological advancements. Russian Cosmism draws inspiration from diverse sources, including Russian Orthodox Christianity, Western philosophy, and scientific theories of the time. It sought to reconcile scientific progress with spiritual and metaphysical concepts, seeing the exploration of the cosmos as a means to achieve higher states of existence.\n\nThe influence of the Russian Orthodoxy would prove critical in the popularity of the movement. The Fyodorovite branch of the Church would grow in prominence during Russia's modernization, cultivated by many who wanted to see the Church become a force for progress. This has culminated in much of the Russian Orthodox church being dominated by the Fyodorovites, who advocate for a radical restructuring of Russian society around faith and transhumanist science."

 DS_VARIANT_10:0 "§ORasputinite Orthodoxy§!"
 DS_VARIANT_10_desc:0 "Rasputin’s cult of personality had long been a source of problems for Russian authorities in Siberia, yet despite their attempts at suppression he remained strangely popular. Some attributed this to his strange charisma, which helped garner him a surprisingly large group of followers who attended his services and indulged his eccentricities. During the Great War, Rasputin used the influx of Russian troops throughout Siberia as an opportunity to preach and expand his influence. He frequently held mass pre-battle baptisms for troops on their way to the meatgrinder fronts of the Amur and Korea.\n\nAfter the war, Rasputin’s sway over the peasantry of Siberia had grown deeply entrenched. He used the growing technologic development of Russia to his full advantage, growing his flock through radio and Kinegram broadcasts. All of this fell beneath the notice of St. Petersburg, largely due to local officials falling under the sway of the Rasputinite cult, either out of genuine faith or a willingness to take their generous contributions.\n\nBy 1933, the aging Mad Monk had fully wormed his faithful into the organs of the Siberian state and lived in immense luxury off the back of his followers. He maintained an enormous harem of female followers, funded local religious militias, and had most of the local government officials in his pocket. Rasputin’s particular brand of Orthodoxy emphasizes himself as the sole speaker of the faith and his importance as the spiritual guide for the Russian peasantry."

 DS_VARIANT_11:0 "§OInfinistocracy§!"
 DS_VARIANT_11_desc:0 "\n\n£GFX_ideology_neo_imperialist_banner_09\n\n\n\n§Y“Illuminism is becoming a great and formidable power, and I fear, in my conscience, that kings and peoples will have much to suffer from it unless foresight and prudence break its frightful mechanism.”§!\n-§OFrancois Charles de Berckheim§!\n\n§OInfinistocracy§! is not an ideology or a system of governance, but an ideal. For centuries, the world has trended towards anarchy under the rule of peasants, demanding greater and greater rights to destroy themselves with increasing effectiveness. With the advent of Recursive Immortality, this will no longer be an issue. The old guard, the captains of industry, the true power behind the nation have shed the shackles of mortality.\n\nA guiding hand now controls the wheel of society, whether it is aware of it or not is irrelevant. Those whose hands are on the wheel are beyond death, and with the restrictions of mortality shed, a new long-term vision for humanity comes into view.\n\nThe meek will beget the strong; the unwashed masses will be led, as they once were, into a shining future built on the blueprints of a deathless conspiracy.\n\n§rThe future only belongs to those who will live to see it.§!"
 
 DS_VARIANT_12:0 "§OAristocratic Despotism§!"
 DS_VARIANT_12_desc:0 "\n\n£GFX_ideology_despotist_banner_12\n\n\n\n§Y“The first condition of a good government is that it should be a government of the best... those who have a stake in the country [by land].”§!\n-§OLord Salisbury§!\n\n§OAristocratic Despotism§! is an attempt to return to the old ways of Human society, where a moneyed ruling class of blue-blooded individuals ruled the masses of unwashed peasantry. Unlike conventional despotism, this ideology focuses primarily on reinstating the rights and rules of the aristocratic systems that once dominated European politics rather than a conventional civilian or military dictatorship.\n\nTo some extent, democracy may even survive in this system, though likely with restrictions on who can vote and how. Often times landowners are the only voting class or the general population's votes count for less than those of the ruling class. Regardless of the specifics of each instance, Aristocratic Despotism represents a hardcore reaction to the liberalism pushed by the French Reformation and the Constitutionalist Revolutions of the late 1700s."

 DS_VARIANT_13:0 "§OAbsolutism§!"
 DS_VARIANT_13_desc:0 "\n\n£GFX_ideology_despotist_banner_02\n\n\n\n§Y“In the days of those kings the God of heaven will set up a kingdom that will never be destroyed. And this kingdom will not be passed on to any other people.”§!\n-§OBook of Daniel§!\n\n§OAbsolutism§! is an overarching ideology to describe nations where a hereditary monarch holds complete power over the entire government. While there may be individuals in an advisory role, an absolutist government will always centralize all power in the hands of the sovereign."

 DS_VARIANT_14:0 "§OTechno-Janissaries§!"
 DS_VARIANT_14_desc:0 "\n\n£GFX_ideology_despotist_banner_06\n\n\n\n§Y“The Ottoman Empire is the strongest state, for you Europeans try to destroy it from without and we Turks try to destroy it from within, but still it does not collapse”§!\n-§OTurkish Diplomat§!\n\nAs the modern Ottoman Empire declined, however, the military began to regain primacy in politics. The constant demand for war industry to fuel the Ottoman-Egyptian Wars throughout the 1800s and early 1900s created a sizable minority of augmented military officials within the Empire. These groups of highly trained augmented soldiers began developing cliques within the military, and a notable few developed the concept that they were the modern reincarnation of the Janissary Corps, albeit gilded in metal rather than cloth.\n\nThese new §OTechno-Janissaries§! eventually grew to eclipse the influence of the Ottoman military and even the Sultan himself. In 1929, the Great Levantine War ended with a stalemate. The Ottomans had pushed deep into Egyptian-held territory but had failed to land a final killing blow on their perennial enemy. Sensing weakness, the Techno-Janissaries seized their chance and toppled the civilian government, installing a techno-supremacist military dictatorship.\n\nThough perhaps not quite as extreme as the name might imply, the Ottoman Janissary dictatorship is nonetheless a repressive one. The failings of the Empire, they argue, come from a failure to embrace the developments of the Second Renaissance fully. In their eyes, if the Empire is to survive the coming century, its’ foundations must be built on steel, not stone. Augmentation, gene-splicing, all of these and more must be brought in at all costs to ensure a future where the Sublime Porte once again rules the Islamic world."

 DS_VARIANT_15:0 "§OEcclesiastical Militarism§!"
 DS_VARIANT_15_desc:0 "\n\n£GFX_ideology_despotist_banner_07\n\n\n\n§Y“Blessed be the Lord, my rock, who trains my hands for war, and my fingers for battle”§!\n-§OPsalm 144:1§!\n\nA fusion of religious doctrine and martial discipline, §OEcclesiastical Militarism§! upholds the belief that warfare is not only a necessity but a divine mandate. The state is governed by a holy order, theocratic rulers, or a militarized clergy, viewing military service as both a sacred duty and a form of devotion. \n\nThis ideology promotes unwavering loyalty, crusader-like fervor, and the belief that victory is ordained by divine will. While it inspires fanatical devotion among its followers, it also breeds hostility towards those deemed heretical or faithless. The state's policies prioritize military expansion, religious unity, and the suppression of ideological dissent, ensuring that both the sword and scripture shape the destiny of the nation."
 
 DS_VARIANT_16:0 "§OPeripherism§!"
 DS_VARIANT_16_desc:0 "\n\n£GFX_ideology_despotist_banner_08\n\n\n\n§Y“It is only after mature deliberation and thorough preparation that I have decided upon the Program of Revolution and defined the procedure of the revolution in three stages. The first is the period of military government; the second, the period of political tutelage; and the third, the period of constitutional government.”§!\n-§OSun Yat-sen§! \n\nA neologism forged in the late 1910's, §OPeripherism§! encompass a variety of political and economical initiatives aimed toward the self-determination of the so-called “peripheries” — namely, the colonial outreach and countries subjugated by European imperialism alike. \n\nAlthough its practical application tend to diverge from one nation to another, regimes related to Peripherism tend to endorse strong anti-colonial stances, upholding populist agendas and a form of social nationalism as a way to appeal to the disenfranchised masses in their homelands. While it may rely on the peasantry and impoverished classes as such, Peripherism often comes with radical views about industrialization and overall development of the State — seeking to modernize both the economy and culture as a mean to catch up with the imperialist powers while avoiding the poisons of colonial acculturation and societal archaisms. \n\nAgainst petty resistance from within and dangerous influences from without, the government which endorses this bold vision may rely on military strength and political repression as means to enforce its agenda while ensuring national sovereignty isn't threatened by foreign meddling. After all, one cannot make an omelette without breaking eggs, and so the elevation of the peripheries cannot be achieved without sacrifices."

 DS_VARIANT_17:0 "§OCaudillismo§!"
 DS_VARIANT_17_desc:0 "\n\n£GFX_ideology_despotist_banner_09\n\n\n\n§Y“Without distinguishing the good patriots from the hypocrites in that storm of cheers, for we had not yet discovered that the most suspicious were the ones who were shouting louder, long live the stallion, long live the general.”§!\n-§OGabriel Garcí­a Márquez, The Autumn of the Patriarch§!\n\n§OCaudillismo§! is characterized by the leadership of a strongman, known as a caudillo, formed as a manifestation of political barbarism, it exemplifies a type of leadership both militarily dominated and empowered, with an emphasis on violence and personalistic rule. Under caudillismo, political life is reduced to relationships of patronage and submission, where allegiance is owed not to a constitution but to a man. Authority flows downward from his will, and stability depends less on systems than on his continued dominance. In this way, governance becomes inseparable from one's personality, and the fate of the nation is bound to the endurance—or collapse—of a single figure."
 
 DS_VARIANT_18:0 "§OPraetorianism§!"
 DS_VARIANT_18_desc:0 "\n\n£GFX_ideology_despotist_banner_11\n\n\n\n§Y“The death of Galba was followed by no less crime than that which had preceded it. For the soldiers, having once learned that they could make and unmake emperors, were no longer restrained either by respect for the laws or by loyalty to their leaders; they demanded rewards as the price of their services, and when these were refused, they took them by force.”§!\n-§OTacitus§!\n\n§OPraetorianism§! is a condition in which the military, rather than civilian institutions, serves as the ultimate arbiter of political power, able to create, sustain, or destroy governments at will. Yet praetorianism does not always imply direct military rule. It can also exist in subtler forms, where civilian governments formally remain in place but operate under the constant shadow of military intervention. whether through coups, threats, or informal pressure; the erosion of civilian control over the armed forces; the personalization of power, where loyalty to commanders outweighs allegiance to mere institutions."

 rc:0 "Reactionary"
 rc_noun:0 "Reactionaries"
 rc_desc:0 "Reactionary State"

 RC_VARIANT_01:0 "§OReactionary§!"
 RC_VARIANT_01_desc:0 "\n\n£GFX_ideology_reactionary_banner\n\n\n\n§Y“All greatness, all power, all subordination rests on the throne, and the throne on the cross.”§!\n-§OJoseph de Maistre§!\n\n§OReactionaries§! core beliefs lies in the radical rejection of the liberal Reformation Era and its byproducts — be it of political or cultural nature. While many may have endorsed the changes brought by the tumults of the late 18th century, a few hardliners continued to stand against what was perceived as a disruption of the natural order of things. Against the suffragist folly and the chaos brought by the destruction of old hierarchies, answers had to be found in the re-establishment of traditional structures of power.\n\nMarginalized during its early days, the ideology of Reaction gained considerable appeal during the Second Renaissance; the general malaise induced by an age of unrestrained capitalism, the erosion of old solidarities and the proletarianization of populaces once tied to lands and customs fuelling apathy toward the ethos of Progress. The Great War arrived not long after, bringing further change that threatened the long tended order of world affairs. As women entered the workforce, a generation of damaged young men returned home to a world scarred by the vices of modernity. In this environment, Reaction thrives by building its strength on eclectic alliances of old aristocrats and disfranchised middle-classes with the aim of putting the proverbial genie back in the bottle. Such endeavor is often carried through higly authoritarian means, producing corporatist regimes in which most political power is vested upon a single individual being liable to none but God and the organic laws of the country. While provincialism and local customs usually finds themselves upheld, exacerbated nationalism remain a decisive factor in rallying the masses.\n\nReversing the course of history is not a job for the lighthearted, and those who fly the banner of Reaction have their work cut out for them."

 RC_VARIANT_02:0 "§OReligious Fundamentalism§!"
 RC_VARIANT_02_desc:0 "\n\n£GFX_ideology_reactionary_banner_02\n\n\n\n§Y“Be still in the presence of the LORD, and wait patiently for him to act. Don't worry about evil people who prosper or fret about their wicked schemes.”§!\n-§OPsalm 37:7§!\n\n§OReligious Fundamentalism§! is an ideology rooted in extreme devotion to clerical doctrine. Vehemently reactionary in regards to social change, religious fundamentalists court their supporters through a fanatical obsession with their particular sect. Fundamentalist states are often insular, but if goaded, will unleash their zealous population against enemies with a frenzied zeal that many ideologies simply cannot match."
 
 RC_VARIANT_03:0 "§OEthno-Nationalism§!"
 RC_VARIANT_03_desc:0 "\n\n£GFX_ideology_reactionary_banner_03\n\n\n\n§Y“Patriotism is in political life what faith is in religion.”§!\n-§OLord Acton§!\n\n§OEthno-Nationalism§! is a form of nationalism which is defined by an ethnic group, common language or culture. Ethno-Nationalists typically promote assimilation into the preferred culture and can, in extreme circumstances, promote the superiority of their culture in a similar manner to Neo-Imperialists."

 RC_VARIANT_04:0 "§ODominant Party Democracy§!"
 RC_VARIANT_04_desc:0 "\n\n£GFX_ideology_conservatism_banner_04\n\n\n\n§Y“Of all forms of tyranny the least attractive and the most vulgar is the tyranny of mere wealth, the tyranny of a plutocracy.”§!\n-§OTheodore Roosevelt§!\n\n§ODominant Party Democracy§! is a system of governance wherein a single party rules without major opposition, even without the need for laws to restrict said opposition.\n\nThis party hegemony may be born out of genuine popularity, or it may be born from there simply being no notable alternatives. In many cases, however, dominant party democracies tend to be defined by corruption and intimidation tactics to maintain control."

 RC_VARIANT_05:0 "§OSocial Credit§!"
 RC_VARIANT_05_desc:0 "\n\n£GFX_ideology_reactionary_banner_04\n\n\n\n§Y“Provision must be made for a continuous flow of credit . . . The mighty, modern efficiency machinery has removed the burden from the backs of mankind, but has left them without purchasing power to obtain the goods made by the machines which they have invented.”§!\n-§OWilliam Aberhart§!\n\n§OSocial Credit§! advocates for a financial system that places emphasis on the creation and distribution of credit. It contends that the current monetary system, based on debt and interest, creates economic imbalances and inequality. Instead, it proposes a system where the government, rather than banks, has the authority to create and control the money supply to ensure that it serves the needs of the people.\n\nCentral to the party's ideology is the belief in social and economic justice. It promotes the idea of "social credit," which suggests that all citizens should have access to a basic income or dividend to ensure a decent standard of living and address poverty. The party seeks to address economic disparities by distributing the wealth generated through productive activities more equitably."
 
 RC_VARIANT_06:0 "§OInfinistocracy§!"
 RC_VARIANT_06_desc:0 "\n\n£GFX_ideology_neo_imperialist_banner_09\n\n\n\n§Y“Illuminism is becoming a great and formidable power, and I fear, in my conscience, that kings and peoples will have much to suffer from it unless foresight and prudence break its frightful mechanism.”§!\n-§OFrancois Charles de Berckheim§!\n\n§OInfinistocracy§! is not an ideology or a system of governance, but an ideal. For centuries, the world has trended towards anarchy under the rule of peasants, demanding greater and greater rights to destroy themselves with increasing effectiveness. With the advent of Recursive Immortality, this will no longer be an issue. The old guard, the captains of industry, the true power behind the nation have shed the shackles of mortality.\n\nA guiding hand now controls the wheel of society, whether it is aware of it or not is irrelevant. Those whose hands are on the wheel are beyond death, and with the restrictions of mortality shed, a new long-term vision for humanity comes into view.\n\nThe meek will beget the strong; the unwashed masses will be led, as they once were, into a shining future built on the blueprints of a deathless conspiracy.\n\n§rThe future only belongs to those who will live to see it.§!"
 
 RC_VARIANT_07:0 "§OUltra-Luddism§!"
 RC_VARIANT_07_desc:0 "\n\n£GFX_ideology_reactionary_banner_05\n\n\n\n§Y“Beware, you who seek first and final principles, for you are trampling the garden of an angry God and he awaits you just beyond the last theorem.§!\n-§OSister Miriam Godwinson§!\n\n§OUltra-Luddism§! is an ideology birthed almost entirely out of reaction to the Second Renaissance. The rapid and relentless pace of progress threatened the power structures of many nations, terrifying the entrenched leadership. More importantly, automation gradually reduced the need for human intervention in the workforce, resulting in higher and higher unemployment. Most nations lacked the capacity to handle this effectively, letting resentment simmer as people's livelihoods were ground down by the mill of progress.\n\nIt was only natural that a reaction to this would begin, and begin it did. The Ultra-Luddites were born, attacking automated factories and raiding machine workshops in an effort to stall further automation. Unlike moderate §ONeo-Luddites§!, who seek ethical and sustainable technological development, Ultra-Luddites often see little to no redeeming value in modern innovations and may actively resist or sabotage technological infrastructure. While their views are often dismissed as unrealistic or extreme, they serve as a stark critique of the costs of technological dependence and the unintended consequences of rapid industrial expansion."
 
 RC_VARIANT_08:0 "§OLund Conservatism§!"
 RC_VARIANT_08_desc:0 "\n\n£GFX_ideology_reactionary_banner_06\n\n\n\n§Y“All moral commandments, all humanity are superstition and magic; only the animal-human is of interest as an object of study and observation”§!\n-§OElmo Lindholm§!\n\nHaving took shape throughout the 20's, §OLund Conservatism§! represents an openly reactionary, yet rejuvenated approach on Swedish nationalism. \n\nAs past absolutism had long withered away under the malignant influence of the Reformation Era, and mainstream conservatism appeared more and more bloated by parliamentarianism as such, young intellectuals which did not fall for the democratic mirage would turn themselves toward new strains of reaction taking roots abroad. Drawing from the teachings of Charles Maurras and his relentless criticism of the Reformation Era, this new generation of militants would soon espouse both the modernity of chauvinism and quasi-feudal views on matters of social organization, paving the way for a fruitful synthesis between the ancient and the new. \n\nAgainst both the revolutionary conflagration and the icy water of egotistical calculation, Lund conservatism champions the ideal of a corporatist, highly hierarchical yet charitable regime in which Christian solidarity, the centrality of the monarch and a resurrected Catholic Church would act as moral beacons for the folk. Along these traits, the emphasis put on romanticism and the significance of the irrational makes it stand out as vividly opposed to the Second Renaissance's excesses — sometimes bordering Luddism in that regard. \n\nShould Lund Conservatism's proponents succeed in restoring both Catholicism and the so-called “natural inequalities” in a land long corrupted by Lutheranism and decadent liberalism remain to be seen."
 
 RC_VARIANT_09:0 "§OFatimism§!"
 RC_VARIANT_09_desc:0 "\n\n£GFX_ideology_conservatism_banner_08\n\n\n\n§Y“Behold, I am the handmaid of the Lord; let it be to me according to your word.”§!\n-§OGospel of Luke§!\n\nFatimism is a Christian theological and political ideology that emerges from belief in the Fatima Event, the series of Marian apparitions reported by three shepherd children in 1917 in Fatima, Portugal. Fatimists view these apparitions as divine revelations that not only reinforce traditional Catholic teachings but also contain prophetic warnings and prescriptions for global politics. Central to Fatimism is the conviction that nations must adhere to the moral and spiritual directives given by the Virgin Mary at Fatima—particularly the call for repentance, prayer (especially the Rosary), and the consecration of Russia to the Immaculate Heart of Mary—to ensure world peace and prevent divine chastisement. This ideology often emphasizes a struggle between Christian civilization and secular or anti-Christian forces, advocating for a political order rooted in Catholic principles.\n\nIn its most radical expressions, Fatimism can take on apocalyptic or millenarian tones, viewing world events through the lens of Fatima’s warnings and anticipating divine intervention in global affairs."

 RC_VARIANT_10:0 "§OSalafism§!"
 RC_VARIANT_10_desc:0 "\n\n£GFX_ideology_reactionary_banner_07\n\n\n\n§Y“The first generations of this Ummah are the best. Whoever follows them is guided.”§!\n-§OIbn Taymiyyah§!\n\n§OSalafism§! is a purist movement within Sunni Islam that advocates a return to the practices of the Salaf—the righteous forebears of the early Islamic community. It rejects what it sees as religious innovations, cultural distortions, and the compromises of modernity. Salafists emphasize strict monotheism, literal interpretations of scripture, and the emulation of the Prophet Muhammad’s companions. While often seen as apolitical, some branches espouse political activism or even jihadism to establish a state based on their vision of Sharia. The movement is divided between quietists, reformists, and revolutionaries, all claiming fidelity to the same divine truth."

 RC_VARIANT_11:0 "§OCarlism§!"
 RC_VARIANT_11_desc:0 "\n\n£GFX_ideology_reactionary_banner_08\n\n\n\n§Y“God, Fatherland, and King.”§!\n-§OTraditional Carlist Motto§!\n\n§OCarlism§! is a traditionalist and legitimist political movement dedicated to restoring the rule of the Bourbon branch under Don Carlos, declared rightful heir after the exile of Ferdinand VII to Spanish America following the Ferdinandist Wars. Ferdinand's line was declared illegitimate by Carlists. The movement champions conservative Catholic values, regional autonomy through historic fueros, and the defense of monarchy as a divine institution. Carlism remains active both in Spanish and New Granadan political circles, supporting Jaime III of Bourbon as the legitimate monarch to the Spanish throne."

 cn:0 "Conservatives"
 cn_noun:0 "Conservatives"
 cn_desc:0 "Traditionalist State"

 CN_VARIANT_01:0 "§OConservative§!"
 CN_VARIANT_01_desc:0 "\n\n£GFX_ideology_conservatism_banner\n\n\n\n§Y“The events which can not be prevented, must be directed.”§!\n-§OKlemens von Metternich§!\n\n§OConservatism§! as a political ideology began to take shape in the early 19th century, particularly in reaction to the French Reformation and the sweeping changes brought about by the Enlightenment and the rise of liberalism.\n\nAs the Second Renaissance swept Europe, Conservatism was forced to adapt to the rapidly changing pace of technology and social norms.  In some instances, this manifested as a staunch luddite stance, however in other countries the changes of the Renaissance were more openly embraced. This period also saw the rise of "traditional conservatism" as it became more focused on national unity, traditional institutions, and a balanced society.\n\nContemporary conservative movements often focus on defending national sovereignty, limiting government power, upholding traditional family values, and promoting free markets. However, debates within conservatism continue over issues like globalization, augmentation, and the erosion of civil authority by non-state corporate factions."
 
 CN_VARIANT_02:0 "§ORight Wing Populism§!"
 CN_VARIANT_02_desc:0 "\n\n£GFX_ideology_conservatism_banner_02\n\n\n\n§Y“There is no more menacing feature in these modern times than the disinclination of what are called the better classes to assume the burdens of citizenship.”§!\n-§OWilliam Jennings Bryan§!\n\n§ORight Wing Populism§! is, unsurprisingly, a strain of conservative thought that caters more to the masses. While left wing populism may often emphasize the economic element, right wing populism tends to focus on a mix of cultural preservationism and anti-elitist doctrine.\n\nThe line between progressive conservatism and right wing populism can sometimes become blurred, as in some cases either may adopt economically progressive policies while not necessarily being left wing. In either case, there is a general emphasis on appealing to the common man over national elites."

 CN_VARIANT_03:0 "§OProgressive Conservatism§!"
 CN_VARIANT_03_desc:0 "\n\n£GFX_ideology_conservatism_banner_03\n\n\n\n§Y“Progress is only possible by passing from a state of undifferentiated wholeness to differentiation of parts.”§!\n-§OLudwig von Bertalanffy§!\n\n§OProgressive Conservatism§! is a relatively old ideology, finding roots in the Enlightenment era. Progressive Conservatism has been a major driving force behind historic reformist movements, most notably the British push to abolish slavery.\n\nIn many cases, Progressive Conservatives push social reforms and economic policies that would traditionally be seen as left wing or liberal, while maintaining some regressive cultural norms. In some cases, this might manifest as a means to undermine socialist support through competitive welfare policies that pull votes from left wing candidates. In other cases, it might be as unremarkable as a party which maintains conservative fiscal policies while pushing social reforms."

 CN_VARIANT_04:0 "§ODominant Party Democracy§!"
 CN_VARIANT_04_desc:0 "\n\n£GFX_ideology_conservatism_banner_04\n\n\n\n§Y“Of all forms of tyranny the least attractive and the most vulgar is the tyranny of mere wealth, the tyranny of a plutocracy.”§!\n-§OTheodore Roosevelt§!\n\n§ODominant Party Democracy§! is a system of governance wherein a single party rules without major opposition, even without the need for laws to restrict said opposition.\n\nThis party hegemony may be born out of genuine popularity, or it may be born from there simply being no notable alternatives. In many cases, however, dominant party democracies tend to be defined by corruption and intimidation tactics to maintain control."

 CN_VARIANT_05:0 "§OFiscal Conservatism§!"
 CN_VARIANT_05_desc:0 "\n\n£GFX_ideology_conservatism_banner_05\n\n\n\n§Y“Penny saved is a penny got.”§!\n-§OHenry Fielding§!\n\n§OFiscal Conservatism§! is a minor offshoot of conservative thought that advocates for small government and limited intervention in the economy. Many fiscal conservatives push for establishing surplus budgets by slashing government programs and privatizing industries. With the Second Renaissance and the growth of global megacorporations, many fiscal conservatives have begun to advocate for increased cooperation between non government organizations and national governments."

 CN_VARIANT_06:0 "§OOrthodox Zionism§!"
 CN_VARIANT_06_desc:0 "\n\n£GFX_ideology_conservatism_banner_06\n\n\n\n§Y“In Israel, in order to be a realist you must believe in miracles.”§!\n-§ODavid Ben-Gurion§!\n\nAt its core, §OZionism§! promotes the belief in the right of Jewish self-determination and the return of Jews to their ancestral homeland. It emphasizes the importance of a Jewish state as a means to ensure the safety, security, and flourishing of the Jewish people.\n\nWhile Zionism encompasses a range of perspectives, it generally promotes the idea of a democratic and inclusive Jewish state that respects the rights of all its citizens. It seeks to create a society where Jews can freely express their religious, cultural, and national identity while maintaining equal rights and opportunities for all inhabitants, regardless of their religious or ethnic background."

 CN_VARIANT_07:0 "§OConservative Agrarianism§!"
 CN_VARIANT_07_desc:0 "\n\n£GFX_ideology_conservatism_banner_07\n\n\n\n§Y“Ten acres and a mule.”§!\n-§OHoyt's New Cyclopedia Of Practical Quotations§!\n\n§OAgrarianism§!is an ideology rooted in the belief that the agricultural way of life is essential for human well-being and societal harmony. It emphasizes the importance of agriculture as the foundation of a sustainable and just society. Agrarianism emphasizes the direct connection between individuals and the land, promoting a decentralized and self-sufficient approach to farming and rural living.\n\nCentral to agrarianism is the notion that the land is a precious resource that should be respected and protected for future generations. It advocates for responsible stewardship of the environment, focusing on sustainable farming practices, conservation, and the preservation of rural landscapes. Agrarianism seeks to establish a balance between human needs and the natural world, recognizing the interconnectedness of agricultural systems with ecosystems and biodiversity."
 
 CN_VARIANT_08:0 "§OInfinistocracy§!"
 CN_VARIANT_08_desc:0 "\n\n£GFX_ideology_neo_imperialist_banner_09\n\n\n\n§Y“Illuminism is becoming a great and formidable power, and I fear, in my conscience, that kings and peoples will have much to suffer from it unless foresight and prudence break its frightful mechanism.”§!\n-§OFrancois Charles de Berckheim§!\n\n§OInfinistocracy§! is not an ideology or a system of governance, but an ideal. For centuries, the world has trended towards anarchy under the rule of peasants, demanding greater and greater rights to destroy themselves with increasing effectiveness. With the advent of Recursive Immortality, this will no longer be an issue. The old guard, the captains of industry, the true power behind the nation have shed the shackles of mortality.\n\nA guiding hand now controls the wheel of society, whether it is aware of it or not is irrelevant. Those whose hands are on the wheel are beyond death, and with the restrictions of mortality shed, a new long-term vision for humanity comes into view.\n\nThe meek will beget the strong; the unwashed masses will be led, as they once were, into a shining future built on the blueprints of a deathless conspiracy.\n\n§rThe future only belongs to those who will live to see it.§!"
 
 CN_VARIANT_09:0 "§OFatimism§!"
 CN_VARIANT_09_desc:0 "\n\n£GFX_ideology_conservatism_banner_08\n\n\n\n§Y“Behold, I am the handmaid of the Lord; let it be to me according to your word.”§!\n-§OGospel of Luke§!\n\nFatimism is a Christian theological and political ideology that emerges from belief in the Fatima Event, the series of Marian apparitions reported by three shepherd children in 1917 in Fatima, Portugal. Fatimists view these apparitions as divine revelations that not only reinforce traditional Catholic teachings but also contain prophetic warnings and prescriptions for global politics. Central to Fatimism is the conviction that nations must adhere to the moral and spiritual directives given by the Virgin Mary at Fatima—particularly the call for repentance, prayer (especially the Rosary), and the consecration of Russia to the Immaculate Heart of Mary—to ensure world peace and prevent divine chastisement. This ideology often emphasizes a struggle between Christian civilization and secular or anti-Christian forces, advocating for a political order rooted in Catholic principles.\n\nIn its most radical expressions, Fatimism can take on apocalyptic or millenarian tones, viewing world events through the lens of Fatima’s warnings and anticipating divine intervention in global affairs."

