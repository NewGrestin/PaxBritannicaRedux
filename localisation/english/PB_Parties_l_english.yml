 lb:0 "Liberals"
 lb_noun:0 "Liberals"
 lb_desc:0 "Reformist State"

 LB_VARIANT_01:0 "§OLiberalism§!"
 LB_VARIANT_01_desc:0 "\n\n£GFX_ideology_liberalism_banner\n\n\n\n§Y“The end of law is not to abolish or restrain, but to preserve and enlarge freedom.”§!\n-§OJohn Locke§!\n\n§OLiberalism§! has been a major political force since the French Reformation and the Springtime of Nations swept Europe in the 1800s. Advocating for social and economic reforms, Liberal factions are found in nearly every democracy on Earth. Liberal movements throughout Europe and the British Empire were critical in the abolition movement, particularly the British Abolitionist Crusade of the 1800s.\n\nIn the midst of the Second Renaissance and globalization, Liberalism faced something of an existential crisis with the rise of megacorporations and augmentation. The progressive mindset was challenged by the consolidation of wealth and authority in non-state groups, and the increasing ubiquity of augmentation in the general population posed serious questions to laissez faire attitudes within many liberal political establishments.\n\nToday, liberalism remains a powerful but contested ideology. In many parts of the world, it champions issues such as human rights, gender equality, and economic regulation."
 
 LB_VARIANT_02:0 "§ODominant Party Democracy§!"
 LB_VARIANT_02_desc:0 "\n\n£GFX_ideology_conservatism_banner_04\n\n\n\n§Y“Of all forms of tyranny the least attractive and the most vulgar is the tyranny of mere wealth, the tyranny of a plutocracy.”§!\n-§OTheodore Roosevelt§!\n\n§ODominant Party Democracy§! is a system of governance wherein a single party rules without major opposition, even without the need for laws to restrict said opposition.\n\nThis party hegemony may be born out of genuine popularity, or it may be born from there simply being no notable alternatives. In many cases, however, dominant party democracies tend to be defined by corruption and intimidation tactics to maintain control."
 
 LB_VARIANT_03:0 "§ONational Liberalism§!"
 LB_VARIANT_03_desc:0 "\n\n£GFX_ideology_liberalism_banner_02\n\n\n\n§Y“Define it as we may, faith in Progress has been the mainspring of Liberalism in all its schools and branches.”§!\n-§OJohn Morley§!\n\n§ONational Liberalism§! is an ideology that combines elements of classical liberalism with a focus on national identity, cultural values, and social cohesion. It emphasizes the importance of both individual liberty and the well-being of the nation as a whole.\n\nNational liberals believe that a strong and cohesive nation is essential for safeguarding individual rights and freedoms. They advocate for policies that promote a sense of national unity, cultural preservation, and social stability, alongside the principles of economic liberalism."

 LB_VARIANT_04:0 "§OClassical Liberalism§!"
 LB_VARIANT_04_desc:0 "\n\n£GFX_ideology_liberalism_banner_03\n\n\n\n§Y“It only takes 20 years for a liberal to become a conservative without changing a single idea.”§!\n-§ORobert Anton Wilson§!\n\n§OClassical Liberalism§! is an ideology that places a strong emphasis on individual freedom, limited government intervention, and the protection of private property rights. It advocates for a society where individuals have the liberty to pursue their own interests, make voluntary exchanges, and exercise personal autonomy.\n\nClassical liberals advocate for free markets and economic liberalism. They believe that when individuals are free to engage in voluntary economic transactions, the result is increased prosperity, innovation, and overall societal well-being. They argue for limited government intervention in the economy, favoring minimal regulation and taxation to ensure the efficient functioning of markets."

 LB_VARIANT_05:0 "§OGuangdong Liberalism§!"
 LB_VARIANT_05_desc:0 "§OGuangdong Liberalism§! developed as a response to the Taiping Heavenly Kingdom and the division of China under the First Peking Conference. The influx of European concessions into the Kingdom, while deleterious to the Taiping economy, also brought with them a growing intellectual elite. The term itself emerged out of the Guangdong region of China where the merchant class was dominant, infusing money into foreign exchange programs and education. Much of this was born not out of love of Europeanism, but rather out of a desire for a stronger liberalized and most importantly unified China.\n\nGuangdong Liberals have often advocated for a federalist model of governance for China, arguing that the vast nature of the nation makes the more unitary model of the Taiping unsustainable. Conversely, they have rejected the philosophy of the Northern Anarchists, who they argue are far too decentralized. Given time, the Guangdong Liberals aim to create a China that can embrace the ideals of the intellectual enlightenment on its’ own terms and can stand strong enough to resist future European incursions."

 LB_VARIANT_06:0 "§OMarket Liberalism§!"
 LB_VARIANT_06_desc:0 "\n\n£GFX_ideology_liberalism_banner_04\n\n\n\n§Y“In and of itself, the market is not, and must not become, the place where the strong subdue the weak.”§!\n-§OPope Benedict XVI§!\n\n§OMarket liberalism§! is an ideology that places a strong emphasis on free markets, individual liberty, and limited government intervention in economic affairs. It advocates for policies that promote private enterprise, open competition, and the unrestricted flow of goods, services, and capital across national borders.\n\nMarket liberals believe that the market mechanism, driven by supply and demand, is the most efficient and effective means of allocating resources, generating economic growth, and improving overall welfare. They argue that when markets are allowed to operate freely, individuals and businesses are incentivized to make rational choices that lead to optimal outcomes for society as a whole."

 LB_VARIANT_07:0 "§OIslamic Liberalism§!"
 LB_VARIANT_07_desc:0 "\n\n£GFX_ideology_liberalism_banner_05\n\n\n\n§Y“Islam is a religion of continuous personal and societal reform through disciplined worship.”§!\n-§OMahmoud M. Ayoub§!\n\n§OIslamic Liberalism§!, also known as liberal Islam or Islamic reformism, is an ideology that seeks to reconcile Islamic principles with the values of liberalism, including individual freedom, human rights, and democracy. It emphasizes a reinterpretation of Islamic teachings in a way that aligns with modern notions of civil liberties and political pluralism.\n\nIslamic liberals argue that Islam inherently contains principles that support individual rights, social justice, and the rule of law. They advocate for a separation between religion and state, recognizing the importance of religious freedom and the protection of minority rights within an Islamic framework."

 LB_VARIANT_08:0 "§OLiberal Agrarianism§!"
 LB_VARIANT_08_desc:0 "\n\n£GFX_ideology_liberalism_banner_06\n\n\n\n§Y“A liberal is a man or a woman or a child who looks forward to a better day, a more tranquil night, and a bright, infinite future.”§!\n-§OLeonard Bernstein§!\n\n§OAgrarianism§!is an ideology rooted in the belief that the agricultural way of life is essential for human well-being and societal harmony. It emphasizes the importance of agriculture as the foundation of a sustainable and just society. Agrarianism emphasizes the direct connection between individuals and the land, promoting a decentralized and self-sufficient approach to farming and rural living.\n\nCentral to agrarianism is the notion that the land is a precious resource that should be respected and protected for future generations. It advocates for responsible stewardship of the environment, focusing on sustainable farming practices, conservation, and the preservation of rural landscapes. Agrarianism seeks to establish a balance between human needs and the natural world, recognizing the interconnectedness of agricultural systems with ecosystems and biodiversity."
 
 LB_VARIANT_09:0 "§ONarodism§!"
 LB_VARIANT_09_desc:0 "\n\n£GFX_ideology_liberalism_banner_07\n\n\n\n§Y“We are the people's debtors and this debt weighs down on our conscience.”§!\n-§ONikolay Mikhaylovsky§!\n\nThe Russian §ONarodniks§! are a movement that emerged in the 1860s in Russia. The Narodniks seek to address the social and economic issues faced by the peasantry and advocate for radical social change.\n\nThe Narodniks believe in the importance of the rural peasantry, or the narod, as the driving force behind social transformation. They aim to mobilize the peasants and rural workers to challenge the existing power structures and establish a more egalitarian and just society.\n\nOne of the key ideas of the Narodniks is "going to the people", which involves intellectuals and activists living among the peasantry to understand their needs and aspirations better. By doing so, they aim to awaken class consciousness among the peasantry and organize them for collective action."

 LB_VARIANT_10:0 "§OInfinistocracy§!"
 LB_VARIANT_10_desc:0 "\n\n£GFX_ideology_neo_imperialist_banner_09\n\n\n\n§Y“Illuminism is becoming a great and formidable power, and I fear, in my conscience, that kings and peoples will have much to suffer from it unless foresight and prudence break its frightful mechanism.”§!\n-§OFrancois Charles de Berckheim§!\n\n§OInfinistocracy§! is not an ideology or a system of governance, but an ideal. For centuries, the world has trended towards anarchy under the rule of peasants, demanding greater and greater rights to destroy themselves with increasing effectiveness. With the advent of Recursive Immortality, this will no longer be an issue. The old guard, the captains of industry, the true power behind the nation have shed the shackles of mortality.\n\nA guiding hand now controls the wheel of society, whether it is aware of it or not is irrelevant. Those whose hands are on the wheel are beyond death, and with the restrictions of mortality shed, a new long-term vision for humanity comes into view.\n\nThe meek will beget the strong; the unwashed masses will be led, as they once were, into a shining future built on the blueprints of a deathless conspiracy.\n\n§rThe future only belongs to those who will live to see it.§!"
 
 LB_VARIANT_11:0 "§OCyber-Solipsism§!"
 LB_VARIANT_11:0 "\n\n£GFX_ideology_liberalism_banner_08\n\n\n\n§Y“When I considered that the very same thoughts which we experience when awake may also be experienced when we are asleep [...], I supposed that all the objects that had ever entered into my mind when awake, had in them no more truth than the illusions of my dreams”§!\n-§ORené Descartes§!\n\n§OCyber-Solipsism§! represents the ultimate step in the development of the individual as a universe by itself and for itself. \n\nAs the Second Renaissance might have ushered an era of unprecedented technological breakthrough throughout the globe, one could be surprised to realise how little the political and moral authorities may have been receptive to it. Yet, how could one continue to mindlessly bend toward derelict institutions while every certainties — from nationhood to corporeality itself — collapses in front of these marvelous achievements? It is on that basis that Cyber-Solipsism envision the complete transcendence of all social and physical boundaries which previously constrained humanity's brightests into mediocrity. Through machine modifications, implants and artificial environments built in between reality and the ethereal realm of computer-driven havens, the individual shall abolish the boundaries of its existence to elevate itself as an all-powerful being. \n\nAs past liberalism may have indulge in democratic and chauvinistic foolishness, and the jacobin impetus wear down itself in castrating egalitarianism, Cyber-Solipsism doesn't shy away in pushing the existing capitalist rationality to its extreme should it mean unleashing further groundbreaking advances — both in matters of personal emancipation and scientific discoveries. \n\nWill this feverish dream of an “anti-society” of augmented egos achieve its promise of absolute freedom? Or will it devolve into barbarism before reaching its fateful goal instead? Only time will tell."

 an:0 "Anarcho-Liberals"
 an_noun:0 "Anarcho-Liberals"
 an_desc:0 "Anarcho-Liberal State"

 AN_VARIANT_01:0 "§OAnarcho-Liberalism§!"
 AN_VARIANT_01_desc:0 "\n\n£GFX_ideology_anlib_banner\n\n\n\n§Y“And our children will live, Mr. Beale, to see that... perfect world... in which there's no war or famine, oppression or brutality. One vast and ecumenical holding company, for whom all men will work to serve a common profit, in which all men will hold a share of stock.”§!\n-§OArthur Jensen§!\n\n§OAnarcho-Liberalism§! represents the greatest excesses of the Second Renaissance, manifested via corruption and corporate greed. Less of a coherent ideology and more a loose set of principles, Anarcho-Liberals advocate for varying degrees of reduced state control.\n\nModerates, typically found amongst fiscal conservatives, argue for de-regulation and corporate autonomy. Radicals, on the other hand, often push for a Night Watchman or Minarchist state, seeking as little government interference as possible. For many, the Anarcho-Liberals are the barely disguised stooges of Wall Street and the global corporate order.\n\nFor the Anarcho-Liberals, Greed, for lack of a better word, is not only good, it is the guiding light by which society should be organized."
 
 AN_VARIANT_02:0 "§OMarket Conservatism§!"
 AN_VARIANT_02_desc:0 "\n\n£GFX_ideology_anlib_banner_02\n\n\n\n§Y“Like a farmer using a carrot and a stick to coax a donkey forward, the market system deals out profits and losses to induce firms to produce desired goods efficiently.”§!\n-§OWilliam Nordhaus§!\n\n§OMarket Conservatism§! is an offshoot of traditional convservative political thought that focuses specifically on the importance of free market economics."
 
 AN_VARIANT_03:0 "§OFordism§!"
 AN_VARIANT_03_desc:0 "\n\n£GFX_ideology_anlib_banner_03\n\n\n\n§Y“Money doesn't change men. It merely unmasks them. If a man is naturally selfish, or arrogant, or greedy, the money brings it out; that's all.”§!\n-§OHenry Ford§!\n\n§OFordism§! is an extreme form of Anarcho-Liberalism that takes elements from ultranationalism and despotism to create an ultra-patriotic, corporate run state."

 AN_VARIANT_04:0 "§ODominant Party Democracy§!"
 AN_VARIANT_04_desc:0 "\n\n£GFX_ideology_conservatism_banner_04\n\n\n\n§Y“Of all forms of tyranny the least attractive and the most vulgar is the tyranny of mere wealth, the tyranny of a plutocracy.”§!\n-§OTheodore Roosevelt§!\n\n§ODominant Party Democracy§! is a system of governance wherein a single party rules without major opposition, even without the need for laws to restrict said opposition. \n\nThis party hegemony may be born out of genuine popularity, or it may be born from there simply being no notable alternatives. In many cases, however, dominant party democracies tend to be defined by corruption and intimidation tactics to maintain control."

 AN_VARIANT_05:0 "§OEdisonian Conservatism§!"
 AN_VARIANT_05_desc:0 "\n\n£GFX_ideology_anlib_banner_04\n\n\n\n§Y“Everyone steals in commerce and industry. I've stolen a lot, myself. But I know how to steal! They don't know how to steal!”§!\n-§OSir Thomas Edison§!\n\n§OEdisonian Conservatism§! refers to specific brand of American conservatism born out of Thomas Edison's brief, but influential, bid for the office of prime minister. Edisonian conservatives argue for greater influence of megacorporations on public offices, pushing a syncretic model where the line between company and country becomes blurred. More importantly, however, the Edisonian model advocates for technological progressivism, believing that a stable future can be created through this union of private enterprise and the state.\n\nThough some would call this a gross conflict of interest, Edisonian proponents argue that the megacorporations are here to stay, and as the world moves into an unknown future, it would be wise to have powerful allies."

 AN_VARIANT_06:0 "§OCorporatocracy§!"
 AN_VARIANT_06_desc:0 "\n\n£GFX_ideology_anlib_banner_05\n\n\n\n§Y“The time to buy is when there's blood in the streets, even if the blood is your own.”§!\n-§OBaron Rothschild§!\n\n§OCorporatocracy§! is less of an ideology and more of a government system, but in the general sense refers to a government pervasively controlled by corporate entities. Historical examples such as the British East India Company abound, while contemporary examples are somewhat harder to find despite the near inescapable nature of multinational megacorporations.\n\nWhile the specifics may be different Corporatocratic states nonetheless are invariably controlled by one or more corporate groups, sometimes acting under the guise of a democratic system. Votes may still be counted, but they only matter as much as the country's executives allow them to."

 AN_VARIANT_07:0 "§OInfinistocracy§!"
 AN_VARIANT_07_desc:0 "\n\n£GFX_ideology_neo_imperialist_banner_09\n\n\n\n§Y“Illuminism is becoming a great and formidable power, and I fear, in my conscience, that kings and peoples will have much to suffer from it unless foresight and prudence break its frightful mechanism.”§!\n-§OFrancois Charles de Berckheim§!\n\n§OInfinistocracy§! is not an ideology or a system of governance, but an ideal. For centuries, the world has trended towards anarchy under the rule of peasants, demanding greater and greater rights to destroy themselves with increasing effectiveness. With the advent of Recursive Immortality, this will no longer be an issue. The old guard, the captains of industry, the true power behind the nation have shed the shackles of mortality.\n\nA guiding hand now controls the wheel of society, whether it is aware of it or not is irrelevant. Those whose hands are on the wheel are beyond death, and with the restrictions of mortality shed, a new long-term vision for humanity comes into view.\n\nThe meek will beget the strong; the unwashed masses will be led, as they once were, into a shining future built on the blueprints of a deathless conspiracy.\n\n§rThe future only belongs to those who will live to see it.§!"
 
 AN_VARIANT_08:0 "§OCorporate Colonialism§!"
 AN_VARIANT_08_desc:0 "\n\n£GFX_ideology_anlib_banner_06\n\n\n\n§Y“In this century, our civilized society imparts unprecedented values to barbarian communities in other parts of the world.”§!\n-§OLéopold of Saxe-Coburg and Gotha§!\n\nEvolving alongside mainstream colonialism, §OCorporate Colonialism§! isn't as much as an official ideology as it is a principle of governance when it comes about handling the vastness of colonial domains. \n\nHidden behind the so-called “White Man's Burden” often lies a more cruel reality — one of lucrative ventures reliant on ruthless quarrying and blind exploitation of flesh and earth alike. A cold-hearted initiative perhaps, yet a business like any others. As such, why shouldn't those skilled already in the Art of trade be given prevalence in the grand crusade for civilization? With their expertise, the already cluttered State could benefit the best from its remote possessions while avoiding the cost of administering it all. \n\nIt is from such a Faustian pact that Corporate Colonialism is first born, only to deploy its tendrils further as concessions are being lended and reliance on corporate strength becomes a dependency of its own. With profit as the sole guiding light, the colonial entity is therefore prone to rely on forced labor and steel-bounded hierarchies as long as the money flows. Complete disregard toward environmental balance is also a common trait shared along these ventures, with concessions being turned into true hellscapes of boreholes and polluted swamps as exploitation is being intensified. \n\nAs imperialism has come to be questioned over time and revolt against colonial overlords becomes a common occurrence, the perpetuation of Corporate Colonialism is all but challenged. Nonetheless, greed is a strong habit, and sacrifices might be necessary when national prosperity is at stake."

 ss:0 "Radical Egalitarians"
 ss_noun:0 "Radical Egalitarians"
 ss_desc:0 "Radical State"
 
 SS_VARIANT_01:0 "§ORadical Egalitarianism§!"
 SS_VARIANT_01_desc:0 "\n\n£GFX_ideology_statesoc_banner\n\n\n\n§Y“The true citizen prefers the general advantage to his advantage.”§!\n-§OFrançois-Noël Babeuf§!\n\n§ORadical Egalitarianism§! or Babouvisme, is an ideology rooted in the ideas of François-Noël Babeuf, a literary theorist during the French Reformation. Though Revolutionary Republican thought at the time was far from unified, Babeuf dissented from the consensus by advocating a utopian egalitarian future built on democracy and the breaking down of hierarchical barriers.\n\nBabeuf's theories would develop after his death through successive theorists and thinkers, eventually culminating in the split between Orthodox and Revisionist branches of the ideology. Revisionists, emerging following the failure of Republicanism to sweep Europe after the Great War, argued that adherents must work incrementally within existing democratic systems to promote their ideals.\n\nThe Orthodox wing of the Babouvist movement continues to advocate for the revolutionary egalitarian struggle, while speciation of the ideology led to the development of German or British variations like §OKautskyism§! or the §OTechnolabourites§!."

 SS_VARIANT_02:0 "§OBakuninist Collectivism§!"
 SS_VARIANT_02_desc:0 "§OBakuninist Collectivism§! was developed largely as a reaction to the rise of Jacobinism. Developed by Russian revolutionary Mikhail Bakunin, Collectivism rejected the idea of a revolutionary vanguard proposed my most Jacobin theorists. Instead, Bakunin proposed the idea of an nearly stateless society, operating via direct democracy. In the wake of the bloody postwar Jacobin revolutions, many disenchanted socialists embraced Bakuninist Collectivism and its' ideals of revolutionary democracy and worker's self management."

 SS_VARIANT_03:0 "§OReformist Socialism§!"
 SS_VARIANT_03_desc:0 "\n\n£GFX_ideology_statesoc_banner_02\n\n\n\n§Y“The state is therefore everyone; the rules within the state are laws which safeguard the welfare of all and which must originate from the welfare of all.”§!\n-§OGeorg Büchner§!\n\n§OReformist Socialism§! differs from other forms of state socialism by its explicit denial of revolution as a meaningful way towards socialism. Instead, it proposes that socialism can only be brought to the masses by the ballot. Through the democratic process, how much it may favour capitalists, reform can be born and change can be made."

 SS_VARIANT_04:0 "§OAgrarian Socialism§!"
 SS_VARIANT_04_desc:0 "\n\n£GFX_ideology_statesoc_banner_03\n\n\n\n§Y“Nature gave all things in common for the use of all; usurpation created private rights.”§!\n-§OAmbrose of Milan§!\n\n§OAgrarian Socialism§! is a strain of socialism that seeks to combine the socialist goal of seizing the means of production with the rural way of life. Agrarian socialism explicitly rejects the urban and progressive dominance of most socialist movements and instead opts for agrarian lifestyles, including a more localized and traditionalist response to socialism. In general, the agrarian socialist movement prefers a bottom up approach to socialism, instead of the top down state-interventionism of most socialist movements."

 SS_VARIANT_05:0 "§OKautskyism§!"
 SS_VARIANT_05_desc:0 "\n\n£GFX_ideology_statesoc_banner_04\n\n\n\n§Y“Under all circumstances we shall remain the champions of democracy and humanity. We reject as senseless and cruel and ruinous to both our cause and our nation the suggestion that we strive to arrive at humanity by the method of brutality.”§!\n-§OKarl Kautsky§!\n\nKarl Kautsky was a prominent Czech political theorist during the late 19th and early 20th centuries. He played a significant role in shaping the ideology of social democracy and was a leading figure within the pre and post unification German Empire.\n\nKautsky emphasized the importance of the working class as the agent of social change and the need for class solidarity. He advocated for the improvement of working conditions, the protection of workers' rights, and the establishment of social welfare measures to address socioeconomic inequalities within capitalist societies.\n\nKautsky's ideas influenced the nascent German socialist movements, who had been primarily influenced by the concept of Bismarckian Socialism. Ironically, while Bismarck himself was anti-socialist, his policies intended to disenfranchize socialist parties helped birth the electoral platforms those parties would eventually embrace."

 SS_VARIANT_06:0 "§OPan-Arab Socialism§!"
 SS_VARIANT_06_desc:0 "Central to Pan-Arabism is the belief in a common Arab identity that transcends national boundaries. It seeks to foster a sense of Arab nationalism and promote cooperation and collaboration among Arab nations. Pan-Arabists argue for the creation of a unified Arab state or a confederation of Arab countries to protect Arab interests and promote Arab unity on political, social, and cultural levels.\n\nSocialist Pan-Arabism is an ideology that combines the principles of Pan-Arabism with socialist ideals, advocating for the unity of Arab nations and the implementation of socialist economic and social policies. While socialist Pan-Arabism shares common objectives with other socialist ideologies, it specifically focuses on the Arab region and the unique challenges faced by Arab societies. It seeks to combine the principles of socialism and Arab unity to create a more equitable, democratic, and prosperous Arab world."

 SS_VARIANT_07:0 "§OPan-African Socialism§!"
 SS_VARIANT_07_desc:0 "Pan-Africanists argue for the political and economic liberation of Africa, advocating for self-determination and sovereignty for African nations. They call for an end to foreign domination and the equitable distribution of resources and wealth within African societies.\n\nSocialist Pan-Africanism also aligns itself with anti-imperialist and anti-capitalist struggles. It critiques foreign exploitation and economic dependency, advocating for self-determination, sovereignty, and the protection of African resources and interests.\n\nWhile socialist Pan-Africanism shares common principles with other socialist ideologies, it specifically focuses on the African context and the unique challenges faced by African nations. It seeks to combine the principles of socialism and Pan-African unity to create a more equitable, prosperous, and self-reliant Africa."

 SS_VARIANT_08:0 "§ODominant Party Democracy§!"
 SS_VARIANT_08_desc:0 "\n\n£GFX_ideology_conservatism_banner_04\n\n\n\n§Y“Of all forms of tyranny the least attractive and the most vulgar is the tyranny of mere wealth, the tyranny of a plutocracy.”§!\n-§OTheodore Roosevelt§!\n\n§ODominant Party Democracy§! is a system of governance wherein a single party rules without major opposition, even without the need for laws to restrict said opposition.\n\nThis party hegemony may be born out of genuine popularity, or it may be born from there simply being no notable alternatives. In many cases, however, dominant party democracies tend to be defined by corruption and intimidation tactics to maintain control."

 SS_VARIANT_09:0 "§OLabour Socialism§!"
 SS_VARIANT_09_desc:0 "\n\n£GFX_ideology_statesoc_banner_05\n\n\n\n§Y“If one man has a dollar he didn't work for, some other man worked for a dollar he didn't get.”§!\n-§OBill Haywood§!\n\n§OLabour Socialism§! is a variation of socialism focused, naturally, on labour movements. Born out of the poor working conditions of the late 19th century, the labour movement became a pervasive force across the developed world, further accelerated by the Second Renaissance in the late 1800s. As millions migrated from the countryside into vast steel cities and megaplexes, they found the dream of the working man often trod upon by powerful megacorporations. In response to this, many large union groups were formed to fight for fairer conditions.\n\nLabour socialism found its roots in these movements, and in contemporary times is one of the more common forms of popular socialist ideology, concerning itself more with practicalities over a slavish devotion to theory."

 SS_VARIANT_10:0 "§OLabour Zionism§!"
 SS_VARIANT_10_desc:0 "\n\n£GFX_ideology_statesoc_banner_05\n\n\n\n§Y“To maintain the status quo will not do. We have set up a dynamic State, bent upon creation and reform, building and expansion.”§!\n-§ODavid Ben-Gurion§!\n\nLabor Zionism is an ideology that combines the principles of Zionism with socialist ideals, with a particular emphasis on the role of the working class in the establishment of a Jewish homeland.\n\nCentral to Labor Zionism is the belief in social justice, equality, and workers' rights. Labor Zionists advocate for socialist economic policies, including cooperative ownership of land and industries, and the establishment of communal agricultural settlements known as kibbutzim. They prioritize collective labor, egalitarian distribution of resources, and the development of a society that promotes the well-being of all its members. Labor Zionism also places importance on building a Jewish society rooted in democratic values, where civil liberties, cultural expression, and social welfare are upheld. It seeks to foster a sense of community, solidarity, and mutual responsibility among Jews."

 SS_VARIANT_11:0 "§OLeft Narodism§!"
 SS_VARIANT_11_desc:0 "\n\n£GFX_ideology_liberalism_banner_07\n\n\n\n§Y“We are the people's debtors and this debt weighs down on our conscience.”§!\n-§ONikolay Mikhaylovsky§!\n\nThe Russian Narodniks are a movement that emerged in the 1860s in Russia. The Narodniks seek to address the social and economic issues faced by the peasantry and advocate for radical social change.\n\nThe Narodniks believe in the importance of the rural peasantry, or the narod, as the driving force behind social transformation. They aim to mobilize the peasants and rural workers to challenge the existing power structures and establish a more egalitarian and just society.\n\nOne of the key ideas of the Narodniks is "going to the people", which involves intellectuals and activists living among the peasantry to understand their needs and aspirations better. By doing so, they aim to awaken class consciousness among the peasantry and organize them for collective action."

 SS_VARIANT_12:0 "§OInfinistocracy§!"
 SS_VARIANT_12_desc:0 "\n\n£GFX_ideology_neo_imperialist_banner_09\n\n\n\n§Y“Illuminism is becoming a great and formidable power, and I fear, in my conscience, that kings and peoples will have much to suffer from it unless foresight and prudence break its frightful mechanism.”§!\n-§OFrancois Charles de Berckheim§!\n\n§OInfinistocracy§! is not an ideology or a system of governance, but an ideal. For centuries, the world has trended towards anarchy under the rule of peasants, demanding greater and greater rights to destroy themselves with increasing effectiveness. With the advent of Recursive Immortality, this will no longer be an issue. The old guard, the captains of industry, the true power behind the nation have shed the shackles of mortality.\n\nA guiding hand now controls the wheel of society, whether it is aware of it or not is irrelevant. Those whose hands are on the wheel are beyond death, and with the restrictions of mortality shed, a new long-term vision for humanity comes into view.\n\nThe meek will beget the strong; the unwashed masses will be led, as they once were, into a shining future built on the blueprints of a deathless conspiracy.\n\n§rThe future only belongs to those who will live to see it.§!"
 
 SS_VARIANT_13:0 "§OPeripherism§!"
 SS_VARIANT_13_desc:0 "\n\n£GFX_ideology_statesoc_banner_07\n\n\n\n§Y“It is only after mature deliberation and thorough preparation that I have decided upon the Program of Revolution and defined the procedure of the revolution in three stages. The first is the period of military government; the second, the period of political tutelage; and the third, the period of constitutional government.”§!\n-§OSun Yat-sen§! \n\nA neologism forged in the late 1910's, §OPeripherism§! encompass a variety of political and economical initiatives aimed toward the self-determination of the so-called “peripheries” — namely, the colonial outreach and countries subjugated by European imperialism alike. \n\nAlthough its practical application tend to diverge from one nation to another, regimes related to Peripherism tend to endorse strong anti-colonial stances, upholding populist agendas and a form of social nationalism as a way to appeal to the disenfranchised masses in their homelands. While it may rely on the peasantry and impoverished classes as such, Peripherism often comes with radical views about industrialization and overall development of the State — seeking to modernize both the economy and culture as a mean to catch up with the imperialist powers while avoiding the poisons of colonial acculturation and societal archaisms. \n\nAgainst petty resistance from within and dangerous influences from without, the government which endorses this bold vision may rely on military strength and political repression as means to enforce its agenda while ensuring national sovereignty isn't threatened by foreign meddling. After all, one cannot make an omelette without breaking eggs, and so the elevation of the peripheries cannot be achieved without sacrifices."

 SS_VARIANT_14:0 "§OFraternal Egalitarianism§!"  
 SS_VARIANT_14_desc:0 "\n\n£GFX_ideology_statesoc_banner_08\n\n\n\n\n\n§Y“To enlarge the sphere of social happiness is worthy of the benevolent design of a Masonic institution; and it is most fervently to be wished that the conduct of every member of the fraternity, as well as those publications that discover the principles which actuate them, may tend to convince mankind that the grand object of Masonry is to promote the happiness of the human race.”§! \n-§OGeorge Washington§!\n\n§OFraternal Egalitarianism§!, born from the underground movements of France and the Americas after the fizzling out of their native crises, sought to use the framework of fraternity as the foundation for social cooperation and virtue. It envisions a society where all are equals, bound by purpose and a shared commitment to collective progress.\n\nThroughout the §YSecond Renaissance§!—an age of unprecedented technological advancement—the absence of corresponding social change and the diminishing humanist ideals of the past cast a long shadow. Yet, §OFraternal Egalitarianism§! endures, striving to reclaim the long-lost enlightenment once promised in humanity’s unspoken contract with progress."

 SS_VARIANT_15:0 "§OZakatism§!"  
 SS_VARIANT_15_desc:0 "\n\n£GFX_ideology_statesoc_banner_09\n\n\n\n§Y“I am amazed at the man who does not find food in his house and does not come out against the people with his sword.”§! \n- §OAbū Dharr al‑Ghifārī§!\n\n§OZakatism§! is an ideology rooted in Islamic principles, emphasizing social justice, economic equality, and community welfare. Inspired by the concept of Zakat, one of the Five Pillars of Islam, it mandates that wealth and surplus be used to support those in need rather than hoarded. Zakatism advocates for a society where resources are shared to ensure that everyone has access to basic necessities such as food, shelter, healthcare, and education.\n\nFollowers of Zakatism believe that individuals have a moral obligation to contribute to the well-being of their communities, actively engage in acts of charity, and work to reduce poverty and inequality. Beyond economic justice, the ideology emphasizes ethical conduct, compassion, and social responsibility, encouraging citizens to live virtuous lives. Ultimately, Zakatism envisions a harmonious society united by shared values, where prosperity is measured not by accumulation, but by the dignity and welfare of all members."

 SS_VARIANT_16:0 "§OCollegian Socialism§!"
 SS_VARIANT_16_desc:0 "\n\n£GFX_ideology_statesoc_banner_10\n\n\n\n\n\n§Y“.”§! \n-§O!\n\n§OCollegian Socialism§!"
 
 jc:0 "Jacobins"
 jc_noun:0 "Jacobins"
 jc_desc:0 "Revolutionary State"

 JC_VARIANT_01:0 "§OJacobinism§!"
 JC_VARIANT_01_desc:0 "\n\n£GFX_ideology_jacobin_banner\n\n\n\n§Y“Man is born to be happy and free, and everywhere he is enslaved and unhappy! Society exists for the purpose of conserving his rights and perfecting his being, and everywhere society degrades and oppresses him! The time has come to remind him of his true destiny.”§!\n-§OMaximilien Robespierre§!\n\n§OJacobinism§!, often referred to as Revolutionary Republicanism, is an ideology birthed from the European Constitutionalist Revolutions of the mid-late 1700s. The guiding principle of the ideology is the concept of egalitarianism, the firm belief that all men are created equally and that power must rest in the hands of said people. The ultimate end-goal of this doctrine is the “World Republic”, a meritocratic egalitarian state spanning all four corners of the globe.\n\nAs an ideology, Jacobinism is delineated into various schools of thought. The primary school is built on the ideas of Maximilien Robespierre, a French lawyer and political theorist who was imprisoned during the French Reformation for advocating the abolition of the Bourbon monarchy. Robespierre’s papers, known as the Twenty-Two Theses, formed the bedrock of the Jacobin Political Club that developed around him. Robespierre was eventually released, but his consistent attempts at revolutionary agitation earned him an exile from France.\n\nOver time, Jacobin political theory evolved alongside the shifting demands of the people. The World Republic Committee was formed in the late 1800s, creating the first semi-unified doctrine for the Revolutionary Republican movement. In contemporary times, Jacobins are an extremist movement, kept securely contained by the old monarchies in Europe. Outside the continent, Jacobinism finds new lease among the oppressed peoples of the world. The Jacobins offer their adherents one immutable promise:\n\nOne day, the old and famous states of the world will shudder, and their crowns will fall beneath a tide of liberty."

 JC_VARIANT_02:0 "§ORevolutionary Anarchism§!"
 JC_VARIANT_02_desc:0 "§ORevolutionary Anarchism§!, sometimes colloquially referred to as Bakuninism, is a splinter ideology of Jacobin thought. Though the idea of decentralized states predates even the concept of ideology, modern revolutionary anarchism finds its roots in the works of Mikhail Bakunin, Nikolai Tchaikovsky and Henry David Thoreau.\n\nAs with many left wing ideologies, the most basic principles of anarchism vary wildly depending on who you ask. The most dominant school of thought in contemporary times lies with Russian revolutionary Nikolai Tchaikovsky, who advocated for armed resistance to the Tsarist autocracy until his arrest and death in 1906. With a martyr to rally their cause around, the Tchaikovsky Circle would become one of the most notorious terror networks in the Russian Empire.\n\nOutside of Russia, cosmopolitan anarchism remains a niche ideology, while so-called frontier anarchism found success in the North American interior. With the west remaining largely ungoverned, instances of frontier anarchism have sprouted up organically across the region. Most notably, New Walden would arise out of this ideological melting pot, basing their beliefs on Thoreau's eco-anarchism or green anarchism."

 JC_VARIANT_03:0 "§ORevolutionary Imperialism§!"
 JC_VARIANT_03_desc:0 "\n\n£GFX_ideology_jacobin_banner_02\n\n\n\n§Y“The true conquests, the only ones that cause no regret, are those made over ignorance.”§!\n-§ONapoléon Bonaparte§!\n\n§ORevolutionary Imperialism§! is a radical, militant offshoot of Jacobinism arguing for the continued spread of the people's revolution. Revoultionary Imperialists seek to expand into surrounding nations and beyond, creating sister republics dedicated to their liberators' revolutionary ideals. Even among other Jacobins, Revolutionary Imperialists are seen as dangerous radicals, not just for their militancy but their tendency to gain traction within revolutionary militaries."

 JC_VARIANT_04:0 "§ONational Jacobinism§!"
 JC_VARIANT_04_desc:0 "\n\n£GFX_ideology_jacobin_banner_03\n\n\n\n§Y“It is time to apply to the mystique of revolution the same critical intelligence that has been applied to the mystique of war.”§!\n-§OGiovanni Baldelli§!\n\n§ONational Jacobinism§! is the term given to the rightist branch of Jacobin thought. Originating out of Germany, National Jacobinism grew as a rejection of French Classical Jacobinism, which was a distinctly liberal ideology. National Jacobins, instead, appeal to the militaristic and more socially conservative members of society. While still arguing for revolutionary republicanism, National Jacobins are against social reformism and believe in the importance of maintaining societal norms. In this way, National Jacobins are socially reactionary but economically collectivist. In many ways, the militant conservative nature of National Jacobins is more comparable to Neo Imperialist thought than Classical or even Reformist Jacobinist thought."
 
 JC_VARIANT_05:0 "§OClassical Jacobinism§!"
 JC_VARIANT_05_desc:0 "\n\n£GFX_ideology_jacobin_banner_04\n\n\n\n§Y“The tree of liberty must be refreshed from time to time with the blood of patriots and tyrants.”§!\n-§OThomas Jefferson§!\n\n§OClassical Jacobinism§! is an offshoot of traditional Jacobin thought that rejects the vanguardism and political tutelage of more conventional Jacobinism. Classical Jacobinism advocates for the idea of \"Revolutionary Democracy\", under which the majority of power is decentralized among the population and executive power is kept controlled via checks and balances. Though denounced by conventional Jacobins for the rejection of the vanguard, Classical Jacobins remain a prominent offshoot of Revolutionary Republican thought."

 JC_VARIANT_06:0 "§OKokutairon Thought§!"
 JC_VARIANT_06_desc:0 "\n\n£GFX_ideology_jacobin_banner_05\n\n\n\n§Y“The Japanese can only fulfill it by the sword.”§!\n-§OFriedrich von Bernhardi§!\n\n§OKokutairon Thought§! is the primary political philosophy adopted by the Republic of Japan following the Japanese Revolution. \n\nThe ideology creates a uniquely Republican doctrine tailored to the Japanese Martial values, whilst combining the left wing populist tenets into a uniquely syncretist system of government. \nDecrying imperialism, yet defending democratic centralism under their dreams of a Japanese spearheaded Pan-Asia, believing such institutions will eventually pave way for the liberation of all peoples and equality for all states.\n\nPatriotism and devotion to the state are a must for every citizen alongside national galvanization, and progressive economics. The ideology seemingly defies a singular identification. \n\nStalwart defense of the nation’s sovereignty under an ultra patriotic dictatorship and socialism to be quite the same, and that such institutions and developments are a requirement for the advancement of the nation and socialism."

 JC_VARIANT_07:0 "§OSocial Banditry§!"
 JC_VARIANT_07_desc:0 "\n\n£GFX_ideology_jacobin_banner_06\n\n\n\n§Y“All stealing is comparative. If you come to absolutes, pray who does not steal?”§!\n-§ORalph Waldo Emerson§!\n\n§OSocial Banditry§! imitates the beliefs of Robin Hood, steal from the rich and give to the poor. However, this ideology requires the state to effectively always be hostile with all of its neighbours. Conducting raids, robbing banks, and any other avenue of gaining wealth to fund the state.\n\nThere is no real government to speak of and the state completely relies on its army, in the form of gangs to administer the nation in any capacity."

 JC_VARIANT_08:0 "§OTranscendental Naturalism§!"
 JC_VARIANT_08_desc:0 "\n\n£GFX_ideology_jacobin_banner_07\n\n\n\n§Y“Olympus is but the outside of the earth everywhere.”§!\n-§OHenry David Thoreau§!\n\n§OTranscendental Naturalism§! is an ideology built out of the teachings of Henry David Thoreau, a prominent naturalist and proponent of civil disobedience. Thoreau believed in the inherent goodness of individuals and their ability to lead meaningful lives by following their own conscience and intuition. He advocated for a simplified and deliberate existence, emphasizing the importance of personal freedom and autonomy. Much of this remained simply theory until the Dissolution of the Mexican Empire, which saw the emergence of numerous Trekker settler states.\n\nThe untamed wilderness of North America would be the ultimate testbed of Thoreau's ideas, culminating in the formation of the Transcendentalist state of New Walden. The modern incarnation of Transcendentalism is staunchly individualist and decentralized, focusing on the primacy of ruralism and the common man. While ideologically adjacent to Jacobinism, Transcendentalists do not consider themselves to be revolutionary republicans and merely aim for similar goals."

 JC_VARIANT_09:0 "§OButlerism§!"
 JC_VARIANT_09_desc:0 "\n\n£GFX_ideology_jacobin_banner_10\n\n\n\n§Y“By uniting we stand, by dividing we fall.”§!\n-§OJohn Dickinson§!\n\nSmedley Butler’s march to the West coast has birthed an ideology built out of revolutionary republicanism and desperation. Butlerism is principally pragmatic, making whatever decision is necessary to maintain the continuity of the state. It is similarly militaristic, as Butler’s forces frequently clashed with local groups on the path to their current position.\n\nUltimately while the current head of the Continental Army is a revolutionary at heart, his movement is ill defined and will require time and development to reach whatever state Butler and his people choose to create."

 JC_VARIANT_10:0 "§OPost Urbanism§!"
 JC_VARIANT_10_desc:0 "\n\n£GFX_ideology_jacobin_banner_09\n\n\n\n§Y“The Mir contains the elements of the spontaneous social organization of the Russian people, outside of the State and outside of the official, imported civilization.”§!\n-§ONikolai Bukharin§!\nThe concept of §OPost-Urbanism§! serves as a reaction to the ever stronger middle class and ruling elitès the poor, forgotten, and angered started romanticizing, or even fetishizing, rural life following vast developments of industralization and modern societies far past than what was able to be kept up with. \nThus demanding the return of the traditional villages that went forward by self-determination, distribution of goods to all people, and lack of any social roles. The most extreme cases of nations led by post-urbanism forcibly relocate the urban population to rural areas; leaving only political dissidents, undesireables, and prisoners in cities; to take care of what the countryside alone can't produce. Indeed, the cities under post-urban natons become labour camps. \nPost-Urbanist theorists uphold a utopian and romanticized opinion of rural life; holding the belief that urban inhabitants are below them serving as subhumans, believing that urban apparatuses are a way for communities to enslave the populations - and therefore should be totally neglected as they are the ultimate form or symbol of capitalist decadence and debauchery."

 JC_VARIANT_11:0 "§ORevolutionary Americanism§!"
 JC_VARIANT_11_desc:0 "\n\n£GFX_ideology_jacobin_banner_08\n\n\n\n§Y“Let tyrants shake their iron rod, and slavery clank her galling chains. We fear them not, we trust in God, America's God forever reigns. The foe comes on with haughty stride. Our troops advance with martial noise. Their veterans flee before our youth, and generals yield to beardless boys.”§!\n-§OWilliam Billings§!\n\nButler’s efforts to bring revolution to the Americas have succeeded, and once again the United States are on the map. With Butler acceding to the Revolutionary Congress, America experiences something vaguely resembling the democracy once hoped for in 1776. The new United States formed under the Congress shifts away from the autocracy of Butler’s emergency powers, hoping to form a more equitable union in the mold of the first revolutionaries.\n\nThough not fully democratic, the new ideology formed by this state is a sort of Americanized Jacobinism, taking the ideas of republican revolution and putting an American face on them. This has proven popular among the populations conquered by the United States, although it will take time for the ideology to fully take root.\n\nStill, in spite of all the chaos and hardship of the Reclamation War, the Second American Revolution has reached its’ natural conclusion as a true revolutionary democracy."

 JC_VARIANT_12:0 "§ODirectorial Republicanism§!"
 JC_VARIANT_12_desc:0 "\n\n£GFX_ideology_jacobin_banner_11\n\n\n\n§Y“The ship of the Republic, battered by the storm so many times, has come to shore; beware of pushing it back into the midst of the reefs.”§!\n-§OJean-Jacques Régis de Cambacérès§!\n\n§ODirectorial Republicanism§! first and foremost embodies a so-called pragmatic approach toward radical politics and governance in revolutionary times. Against both the extremism of the ultrarevolutionaries and the complacency of the moderates, Directorial Republicanism affirms the primacy of national interests and the preservation of the newly-established republic over the whirlwinds of ideologies — be it from the far left or the far right. \n\nWith most political powers granted to a collegial assembly or a governing council of oligarchical nature, internal politics is conducted in the name of stability and the struggle against the enemies of the revolution. In practice, such an agenda often results in the limitation of democratic suffrage to those perceived as most-fitted to govern the country, systematic repression of any civil discontent as well as the militarization of the social body through mass conscription and nationalism. The development of private property and the progressive dismantlement of old aristocratic and ecclesial estates to the benefit of new productive, profit-seeking classes remains one of the core economic goals pursued by the directorial power; although limited redistribution of wealth can often be carried to alleviates the burden of the impoverished masses. \n\nIs Directorial Republicanism but a cruel necessity to safeguard the revolution in times of need? Or is it a dangerous deviation from its core tenets instead? Only time will tell."

 JC_VARIANT_13:0 "§ORevolutionary Mysticism§!"
 JC_VARIANT_13_desc:0 "\n\n£GFX_ideology_jacobin_banner_12\n\n\n\n§Y“The Revolution is of spiritual essence.”§!\n-§OAntonin Artaud§!\n\n§ORevolutionary Mysticism§! represents both a practice within existing revolutionary movements and an ideology by itself. While such phenomenon might appear as a contemporary byproduct of a broader regain of interest toward irrationalism and the occult, its first occurrences can be traced back to the Reformation Era. \n\nAmidst the multitude of radical movements and political initiatives flourishing throughout Europe at this time, some would embrace ritualistic practices — with highly codified ceremonies, an emphasis put on secrecy and various considerations about faith, the human soul and metaphysics. Rooted either in Kabbalism, esoteric Christianity or theistic beliefs, these fellowships would eventually fall dormants as revolutionary enthusiasm vanished off. \n\nWhat could have been considered as an ephemeral and ultimately futile oddity eventually resurfaced in the late-nineteenth century. As capitalism sweeped mercilessly the old faiths to impose its mercantile rationality, a new dissenting esotericism arose to oppose both the old Order of the autocrats and the new techno-industrial hegemony. Diving into Eastern philosophy while drawing from romanticism and decadentism, Revolutionary Mysticism would slowly grow in importance over the course of the twentieth century — gaining enormous appeal as the Great War brought about mass delusion toward the sciences which allowed such bloodshed to occur. \n\nAs diverse as the hundreds of sects acting in its name, Revolutionary Mysticism  nonetheless holds true the tenet of the revolution not being a purely materialistic affair. Only through spiritual and collective renewal shall the individual reach the Nirvana of its emancipation."
 
 JC_VARIANT_14:0 "§ORevolutionary Fatimism§!" 
 JC_VARIANT_14_desc:0 "\n\n£GFX_ideology_jacobin_banner_14\n\n\n\n§Y“Theology is not only thinking about God, it is thinking about the world in light of God.”§!\n-§OGustavo Gutiérrez§!\n\n§ORevolutionary Fatimism§! is a radical offshoot of the Fatimist ideology, emerging in the wake of the collapse of Republican columns during the latter half of the Fatima Revolutions. Drawing heavily from the principles of Liberation Theology, the movement views the contemporary Church as a corrupt and kleptocratic institution—one that has long since abandoned its mission of peace and brotherhood. While its long-term goals remain ambiguous, factions within the movement are divided between those who seek to eliminate all intermediaries in spiritual life, and those who aim to reform the Church from within."
 
 JC_VARIANT_15:0 "§OJamalism§!" 
 JC_VARIANT_15_desc:0 "\n\n£GFX_ideology_jacobin_banner_15\n\n\n\n§Y“Let us cast a glance at the achievements of others. By effort, they have achieved the final degree of knowledge and the peak of elevation. For us too all the means are ready, and there remains no obstacle to our progress.”§!\n-§OJamal al-Din al-Afghani§!\n\nFathered by the mind of muslim freedom fighter and theoretician Jamal Al-Afgani, §OJamalism§! embodies a bold syncretism between pan-islamism and European radicalism; such hybridation being considered as the key to bring progress into the islamic world while vanquishing foreign imperialism. \n\nHaving travelled through Asia and the Maghreb, Al-Afgani would learn from the coloniser and the colonised alike — being thaught about Freemasonry, the Reformation Era, English chartism and the heroic resistance of the Cipayes and Sudanese peoples against British tyranny. It is from such formative experiences that the path of Jamalism would be forged, only for it to reshape the Middle-East as Persian revolutionaries would finally break the foreign yoke imposed upon their homeland. \n\nWhile its core tenets remain rooted in the idea of an union of the islamic world to counteract European hegemony, Jamalism upholds the emancipation of the muslim peoples through a series of radical measures enforced thanks to the militant action of secret societies. With parliamentary institutions founded on the Shura principle now empowered, breakneck modernization of sciences and industries is to be conducted in accordance with rationalized islamic principles. Militarization of the society and support to all those opposed to the western rule regardless of religion or ethnicity is also firmly promoted as a way to gather support in the struggle against the West. \n\nOnly through such renewal may the oppressed peoples finally vanquish the hydra of imperialism, uniting the community of the believers into a continent-spanning republic of free and faithful citizens."

