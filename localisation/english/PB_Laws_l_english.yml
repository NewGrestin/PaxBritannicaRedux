### CIVIL LAWS ###
civilian_policies: "Civilian Policies"

## SUFFRAGE LAWS ##
suffrage_laws: "Suffrage Law"

PB_universal_voting: "Universal Voting"
PB_universal_voting_desc: "Every adult citizen, regardless of gender, wealth, or class, is granted the right to vote. Elections are open and competitive, serving as the foundation of political legitimacy."
PB_biased_universal_voting: "Biased Universal Voting"

PB_weighted_universal_voting: "Weighted Universal Voting"
PB_region_dependent_voting: "Region Dependent Voting"
PB_wealth_voting: "Wealth Voting"
PB_landed_voting: "Landed Voting"

PB_monitored_voting: "Monitored Voting"

PB_single_party_system_voting: "Single Party System"
PB_single_party_system_voting_decs: "A single political party dominates all institutions of government. Opposition is banned, and elections, if held, serve only to reaffirm the ruling ideology."
PB_no_voting: "No Voting"
PB_no_voting_desc: "The state is governed without elections or representation. All authority lies in the hands of the ruler or ruling clique, with the population entirely excluded from political life."

## PRESS LAWS ##
press_laws: "Press Law"

PB_independent_free_press: "Independent Free Press"
PB_independent_free_press_desc: "Newspapers, journals, and radio stations operate without government interference. A plurality of voices shapes public discourse, and criticism of authority is openly tolerated."
PB_biased_free_press: "Biased Free Press"
PB_monopolized_press: "Monopolized Press"
PB_censored_press: "Censored Press"
PB_censored_press_desc: "The press enjoys limited freedom but remains subject to censorship, licensing, and government pressure. Sensitive topics are restricted, though some dissenting voices persist."
PB_state_controlled_press: "State-Controlled Press"
PB_state_controlled_press_desc: "All media is directly overseen or owned by the state. Information is filtered through official channels, propaganda dominates the public sphere, and dissent is silenced."

## PUBLIC MEETINGS LAWS ##
public_meetings: "Public Meetings Law"

PB_public_meetings_allowed: "Public Meetings Allowed"
PB_public_meetings_allowed_desc: "Citizens are free to gather, protest, or organize without government interference. Public squares and halls are vibrant arenas of political and social life."
PB_public_meetings_monitored: "Public Meetings Monitored"
PB_public_meetings_monitored_desc: "Assemblies are permitted, but authorities keep a close watch. Demonstrations may require permits, and security forces often loom nearby to maintain \"order\"."
PB_public_meetings_banned: "Public Meetings Banned"
PB_public_meetings_banned_desc: "Public gatherings are outlawed. Any attempt to assemble is swiftly dispersed by authorities, and collective political expression is driven underground."

## WOMENS RIGHTS ##
womens_rights: "Women's Rights Law"

PB_total_gender_equality: "Total Gender Equality"
PB_total_gender_equality_desc: "Women enjoy full social, political, and economic equality with men. They can vote, hold office, inherit property, work freely, and participate in all aspects of public and private life."
PB_full_gender_equality: "Full Equality"
PB_full_gender_equality_desc: "Women have broad legal and social rights, including voting, education, and employment opportunities, though some minor inequalities may remain in practice."
PB_limited_womens_rights: "Limited Women's Rights"
PB_limited_womens_rights_desc: "Women are granted basic legal protections and some access to education and work, but their political participation and legal independence are restricted."
PB_no_womens_legal_protection: "No Legal Protections"
PB_no_womens_legal_protection_desc: "Women have little to no legal recognition of their rights. They cannot vote, inherit equally, or freely participate in public life, leaving them vulnerable under the law."
PB_patriarchal_society: "Patriarchal Society"
PB_patriarchal_society_desc: "Society is structured around male dominance. Women are largely confined to domestic roles, and legal, social, and economic independence is minimal or nonexistent."

PB_MTA_maternal_exclusion: "Maternal Exclusion"

## MINORITY LAWS ##
minority_rights: "Minority Rights Law"

PB_minority_affirmitive_action: "Affirmitive Action"
PB_minority_affirmitive_action_desc: "Minorities are actively supported through state policies to ensure equal opportunities in education, employment, and political representation."
PB_minority_significant_autonomy: "Significant Autonomy"
PB_minority_significant_autonomy_desc: "Minorities have substantial self-governance, including cultural, linguistic, or administrative autonomy within the state."
PB_minority_neutral_stance: "Neutral Stance"
PB_minority_neutral_stance_desc: "Minorities are legally recognized but receive no special privileges or protections beyond basic citizenship."
PB_minority_forceful_integration: "Forceful Integration"
PB_minority_ethnic_segregation: "Ethnic Segregation"
PB_minority_ethnic_segregation_desc: "Minorities are socially or legally separated from the majority, with restricted access to certain areas, services, or political rights."
PB_minority_ethnic_hierarchy: "Ethnic Hierarchy"
PB_minority_ethnic_hierarchy_desc: "Minorities are considered inferior, face systemic discrimination, and are denied meaningful rights or participation in society."
PB_minority_ethnic_exclusivity: "Ethnic Exclusivity"

PB_minority_stellar_extermination: "Stellar Extermination"
PB_minority_stellar_extermination_2: "$PB_minority_stellar_extermination$"

## SECURITY SERVICES LAWS ##
security_services: "Security Services Law"

PB_community_outreach_policing: "Community Outreach"
PB_community_outreach_policing_desc: "Local authorities work hand in hand with the population, focusing on education, trust, and cooperation. Crime and unrest are discouraged through positive engagement, but the lack of strong control leaves room for underground movements."
PB_preventative_policing: "Preventative Policing"
PB_preventative_policing_desc: "Patrols and community presence are expanded to deter crime and resistance before they take root. The approach is firmer than outreach but still avoids heavy repression, balancing order with civil freedoms."
PB_standard_policing: "Standard Policing"
PB_standard_policing_desc: "Routine law enforcement maintains a basic level of order and safety. Citizens are neither especially encouraged nor suppressed, and the state exerts only the minimum necessary force to keep control."
PB_state_intimidation_policing: "State Intimidation"
PB_state_intimidation_policing_desc: "The regime uses threats, coercion, and occasional displays of force to ensure obedience. Fear becomes a tool of governance, raising war readiness at the cost of civil stability and long-term loyalty."
PB_secret_police_policing: "Secret Police"
PB_secret_police_policing_desc: "A vast network of informants and covert agents roots out dissent wherever it appears. Constant surveillance and repression crush resistance but breed deep resentment among the populace."
PB_RUS_national_panopticon_policing: "National Panopticon"

### ECONOMIC LAWS ###
economic_policies: "Economic Policies"

## LABOUR LAWS ##
labour_laws: "Labour Law"

PB_fully_automated_factories: "Fully Automated Factories"
PB_fully_automated_factories_desc: "Extensive automation replaces human labor with machines, maximizing efficiency and output while reducing the need for a traditional workforce."
PB_8_hour_workday: "Eight Hour Workday"
PB_8_hour_workday_desc: "Strictly limits work to 8 hours per day, prioritizing worker welfare and productivity."
PB_12_hour_workday: "Twelve Hour Workday"
PB_12_hour_workday_desc: "Moderate regulation, balancing economic output and worker rest."
PB_14_hour_workday: "Fourteen Hour Workday"
PB_14_hour_workday_desc: "Lightly regulated, favors employers while still providing some protection for workers."
PB_18_hour_workday: "Eighteen Hour Workday"
PB_18_hour_workday_desc: "Minimal regulation, workers have very long shifts with few legal protections."
PB_no_limit_workday: "No Work Hour Limits"
PB_no_limit_workday_desc: "Complete laissez-faire approach, workers may be required to work indefinitely."

## HEALTHCARE LAWS ##
healthcare: "Healthcare Policy Law"

PB_comprehensive_healthcare: "Comprehensive Healthcare System"
PB_comprehensive_healthcare_desc: "Full access to medical care for all citizens, preventive and advanced treatments included."
PB_standard_healthcare: "Standard Healthcare System"
PB_standard_healthcare_desc: "Moderate coverage, basic treatments and public hospitals widely available."
PB_basic_healthcare: "Basic Healthcare System"
PB_basic_healthcare_desc: "Minimal healthcare, limited to essential services only."
PB_no_national_healthcare: "No National Healthcare System"
PB_no_national_healthcare_desc: "No state-provided healthcare; citizens must rely on private or informal care."

## EDUCATION LAWS ##
education: "Education Policy Law"

PB_subsidized_higher_education: "Subsidized Higher Education"
PB_subsidized_higher_education_desc: "Comprehensive education system with support for higher education, ensuring widespread access to universities and advanced studies."
PB_subsidized_basic_education: "Subsidized Basic Education"
PB_subsidized_basic_education_desc: "Government-supported basic education, providing primary and secondary schooling to most children."
PB_basic_education: "Basic Education System"
PB_basic_education_desc: "Limited education available; only fundamental literacy and numeracy are taught, often with little government support."
PB_no_official_education: "No Official Education System"
PB_no_official_education_desc: "No structured education provided by the state; learning is informal or private, with minimal access for the general population."

PB_SCA_subsidized_higher_education: "Subsidized Higher Education"
PB_SCA_subsidized_basic_education: "Subsidized Basic Education"
PB_SCA_subsidized_basic_education: "Basic Education System"

## WELFARE LAWS ##

welfare: "Welfare Policy Law"

PB_generous_state_welfare: "Generous State Welfare"
PB_generous_state_welfare_desc: "Extensive social support programs, including unemployment benefits, pensions, and subsidies for low-income citizens."
PB_moderate_state_welfare: "Moderate State Welfare"
PB_moderate_state_welfare_desc: "Partial social support, covering basic needs like unemployment aid and limited welfare payments."
PB_basic_state_welfare: "Basic State Welfare"
PB_basic_state_welfare_desc: "Minimal assistance, only essential welfare for the most vulnerable populations."
PB_no_state_welfare: "No State Welfare"
PB_no_state_welfare_desc: "No welfare system; citizens are responsible for their own social security and support."

## SOCIOGENETICS ##
sociogenetics: "Sociogenetics Policy Law"

PB_sociogenetics_banned: "Sociogenetics Banned"
PB_sociogenetics_restricted: "Sociogenetics Restricted"
PB_sociogenetics_scientific: "Sociogenetics: Scientific Purposes Only"
PB_sociogenetics_by_consent: "Sociogenetics by Consent"
PB_sociogenetics_system_illnesses: "Sociogenetics: Systematic for Illnesses"
PB_sociogenetics_system_undesirables: "Sociogenetics: Systematic for Undesirables"
PB_sociogenetics_malthusian: "Malthusian Sociogenetics"

## AUGMENTATION ##
augments: "Augmentation Policy Law"

PB_augmentation_no_legislation: "No Augmentation Legislation"
PB_augmentation_no_legislation_desc: "here are no formal laws governing bioengineering or human augmentation. Citizens and private organizations are free to explore and apply enhancements as they see fit. While innovation flourishes, oversight is minimal, leading to both remarkable breakthroughs and potential ethical dilemmas."
PB_augmentation_banned: "Augmentation Banned"
PB_augmentation_banned_desc: "All forms of biological or cybernetic augmentation are strictly forbidden. Research is suppressed, procedures outlawed, and practitioners harshly punished. The state frames augmentation as dangerous, unnatural, or destabilizing, leaving citizens reliant solely on natural human limits."
PB_augmentation_encouraged: "Augmentation Encouraged"
PB_augmentation_encouraged_desc: "The state actively promotes augmentation through subsidies, research funding, and cultural campaigns. Adoption is voluntary, but citizens are incentivized to embrace enhancements for greater productivity, health, or military effectiveness. Augmentation becomes a celebrated aspect of modern identity."
PB_augmentation_enforced: "Augmentation Enforced"
PB_augmentation_enforced_desc: "Bioengineering and augmentation are mandatory for specific groups, or even for the entire population. The state imposes enhancements for strategic goals - military superiority, economic efficiency, or ideological purity. Refusal is seen as defiance, and citizens' very bodies become instruments of state policy."

