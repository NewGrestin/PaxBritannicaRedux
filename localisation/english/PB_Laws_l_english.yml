PB_NI_spanish_virtue: "Spanish Virtue"
PB_NI_spanish_virtue_desc: "\n\n\n\n\n\n\n£GFX_TT_Apostasy_to_Sanity\n\n\n\n\n\n\n\n\nThe mania that engulfs Spanish society can all be attributed to one thing — a trauma response. For each time the Spanish people face war, revolution, humiliation, and torture, the nation lies dormant, separated from reality and locked in a state of complete paralysis. Like a martyr too long upon the rack, Spain no longer cries — she forgets how. \n\nComplete paranoia consumes her children. Infants are dressed in vestments without a single thought as to why, hollow rites professed without a hint of insight, Processions wind through every street night and day, incense choking the air, bells tolling for no one. At the mere whisper of sin, men fall to their knees — begging, weeping, screaming for mercy in repentance for what is effectively a punishment extending to every soul in the Spanish state. \n\nAnd yet Spain lives, somehow. In her stillness, she replays every invasion, every treaty, every misstep as if reliving an unending Passion. It is not history, but a judgment — one great trial stretching toward the end of days. She pleads nothing, sitting still in silence but not for submission, but expectation. \n\nAnd if the memory of Spain is not one of conquest or empire — it is one of condemnation. Her body may rot in chains, but her heart beats like the Sacred Heart itself: surrounded by thorns, afire, and still bleeding."
