  ### AFGHAN CIVIL WAR DECISIONS ###
  PB_AFG_civil_war_descision:0 "Afghan Civil War"
  PB_AFG_civil_war_descision_desc:0 "\n\n\n\n\n\nWhat we knew would occur sooner or later ultimately happened: Afghanistan as a united political entity is no more. Ethnic minorities and revolutionaries alike took arms against the pro-Russian Durrani dynasty, torning the country apart as rag-tag armies of partisans and former soldiers now clashes in the mountainous expanses. Now is the time to act and secure our position in Afghanistan for good — else our rival might use the country for his own benefits instead.\n"
  
