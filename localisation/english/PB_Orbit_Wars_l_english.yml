 OW_earth_tt: "§HEarth:§!\nEarth, home of humanity. A planet fertile with life Earth is the only known planet within the Sol system, and the known universe, to be able to sustain advanced multi-cellar lifeforms. Although it may seem to be only a blink in the night sky Earth is rich with history. From ancient civilizations to the long-lasting scars of war, Earth is truly Humanities great garden of Eden. Although its finest achievement, the human race, seeks to one day spread its wings and take to the heavens. This era defining event would be known as the Orbit Wars.\n\nClick to §Ytoggle Earth spin§!"

