 PB_orbit_wars_category: "The Orbit Wars"
 PB_orbit_wars_category_desc: "\nWith the launch of the Epsilon-1 in New Alexandria, the viability of a rocket-propelled craft breaching the atmosphere and entering orbit has been proven possible, at least on paper. While the launch itself failed, the limited success has proven the potential of such enterprises.\n\nOur nation is not the first to realize this, and we must capitalize on this situation as quickly as possible. Britain and Russia have already begun plans to launch their own craft to succeed where Epsilon failed.\n\nIf we fail to acquire a hegemony over the heavens, we may face a catastrophic §ROrbital Gap§! with our rival.\n\nIn order to §Gwin§! the Orbit Wars, we must successfully launch a communications satellite and human crewed satellite into Orbit.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n"
