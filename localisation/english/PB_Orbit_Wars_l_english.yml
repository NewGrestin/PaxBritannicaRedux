 ## GENERAL EVENTS ##
 OW_events.1.t: "The Launch of the Epsilon 1" 
 OW_events.1.d: "We've received some interesting news from Carnegia, where a think tank funded by the EIEC and Carnegie Steel was able to launch a small rocket containing a similarly small radio operated drone.\n\nWhile the launch itself was only a minor success, the research has proven the potential for launching a functioning satellite into orbit. Furthermore, it may very well mean the potential to launch a living human being into orbit. It's become clear to both ourselves and our rivals on the continent that this technology cannot be allowed to go to waste. Britain's early frontiers came in Africa and the Americas, and we ensured that we secured ourselves in those regions. Now, however, we have a new scramble on our hands.\n\nThe union jack will be the first standard to touch the stars, no matter how much blood, sweat or tears are needed."
 OW_events.1.a: "We cannot afford to lose our chance at conquering the cosmos."

 OW_events.4.t: "[target.GetName] hit by our Scorched Space Sytem"
 ## SUCCESS EVENTS ##
 OW_success_events.1.t: "Successful Launch"
 OW_success_events.1.d: "Our constructed rocket was able to launch successfully, breaching the Earth's atmosphere. Any components on the rocket can now be activated, or otherwise our research modules will begin transmitting their data."
 OW_success_events.1.a: "Excellent work, boys."

 OW_success_events.2.t: "The First Successful Satellite"
 OW_success_events.2.d: "After many months of research and trials, one of our rockets has managed to breach the atmosphere and successfully deploy a communications satellite in orbit. Ground control has already received data, and our current orbit is stable for the next few months.\n\nThe occasion is momentous to say the least, as this marks our nation's first successfully deployed orbital satellite. Likely our enemies will see this growing orbit gap and rise to meet us, so now the focus will be to launch a human being into orbit."
 OW_success_events.2.a: "We've got proof of concept, now let's get a man up there."

 OW_success_events.3.t: "The First Man in Orbit"
 OW_success_events.3.d: "Finally, after thousands of years of development and evolution, a man has entered orbit and returned. We've accomplished what was previously thought impossible and broken a major barrier to scientific development.\n\nWith this, we have proven not just the potential of human habitation in orbit, but also the scientific supremacy of our nation."
 OW_success_events.3.a: "The stars will not wait for us."

 ## FAIL EVENTS ##
 OW_fail_events.2.t: "Guidance Sensor Failed"
 OW_fail_events.2.d: "Unfortunately, while we were launching our latest rocket, an unforeseen failure in its design has sent us back to the drawing board.  Apparently, while it was launching, one of our remote pilots attempted to steer it towards its intended target, but a malfunction in the guidance sensor sent it careening towards a nearby forest instead.\n\nAlthough this failure has given us valuable insights in guidance sensor maintenance, it was difficult cleaning up the debris and virtually none of the rocket parts were reusable."
 OW_fail_events.2.a: "Unlucky, but at least we know better for next time."

 OW_fail_events.3.t: "Failure to Launch"
 OW_fail_events.3.d: "The rocket we have invested so much into has failed to launch today due to a mechanical error. The apparatus holding the rocket until it is time for it to blast off accidently crushed the rocket like a empty RC can. It seems as if some mechanic used a negative value instead of a positive value for the programming of the umbilical cords holding the rocket up.\n\nAll our work is for nothing, and we will have to go back to the drawing board."
 OW_fail_events.3.a: "What a waste."

 OW_fail_events.4.t: "Explosion at Launch Site"
 OW_fail_events.4.d: "In a shock to our government, The rocket we've been working on has exploded due to the fuel line severing, ending up with multiple scientists and engineers dead. after further examination of the wreckage it appears that the nuts and bolts that physically held our rocket together were substandard at best.\n\nDue to this, a critical bolt melted, exposing all the rocket fuel to an open flame exploding the entire rocket and taking out multiple personnel.\n\nAlthough this is our fault, we will find a way to blame our enemies and accuse them of sabotage, hopefully distracting the grieving families of those deceased."
 OW_fail_events.4.a: "Jet fuel can melt steel bolts!"

 OW_fail_events.5.t: "Electrical Failure"
 OW_fail_events.5.d: "Embarrassing news, it appears as if our rocket has failed to launch due to a electrical error.The launch sequence uses a series of gears and tesla coils to send the electric pulses necessary to start the rocket. This did not happen, as some buffoon engineer used the wrong sized gear thus leading to the generation of too much torque, and thus the coils were fried.\n\nThis stunning error has cost our government a staggering amount of money as we have to entirely rewire the rocket. The engineer responsible will be harshly punished for this mistake."
 OW_fail_events.5.a: "Back to basics people!"

 OW_fail_events.6.t: "Atmospheric Burnout"
 OW_fail_events.6.d: "The rocket launch was successful, however the rocket was destroyed due to burning up in the atmosphere. The rocket was practically nothing but ash and dust by the time recovery teams reached ground zero of the wreckage.\n\nExamination shows that improper materials were used, and thus they were insufficient to withstand the heat of leaving the atmosphere. The rocket program is back to step one due to this error."
 OW_fail_events.6.a: "Outsource the materials, outsource the profits."

 OW_fail_events.7.t: "Unforseen Shutdown"
 OW_fail_events.7.d: "Due to an electrical problem, the rocket's remote controls shut down during launch and the rocket has been lost. R&D is conflicted to how this has occurred, but the consensus is that somehow the tesla coils necessary for the rockets computer work did not form a proper current at some point losing us control of the rocket.\n\nIt has been noted by observers that the rocket has probably gone somewhere into deep space to be lost forever to humanity. The best chance we have of getting it back is praying that maybe one day it will return back to us through being slingshot back to us if it happened to veer close to the moon."
 OW_fail_events.7.a: "Actually, on second thought. Maybe we don't want it back."

 OW_fail_events.8.t: "Crash and Burn"
 OW_fail_events.8.d: "It appears as if a communication error caused the rocket to be unable to breach the atmosphere causing it to land in an unpopulated area, causing some damage and fires. The local ecosystem suffered due to this error, but that pales in comparison to the loss of the rocket and materials.\n\nThe person responsible for the error that lost our rocket has been fired and blacklisted for this incident. The rest of the team will know to fear failure more then they crave success."
 OW_fail_events.8.a: "Orbit to Surface missiles, kind of."

 OW_fail_events.9.t: "Communication Lost"
 OW_fail_events.9.d: "An electrical malfunction temporarily disabled the rocket's remote controls, upon being re-enabled, the rocket and payload were found to be completely missing. R&D is split on how this occurred and where the rocket itself went as all calculations suggest that this scenario was impossible.\n\nSome think some undiscovered electrical phenomenon has occurred that warped the location of the rocket in space time. Some believe that extra terrestrials are involved while others suggest that Tesla himself has cursed the rocket.\n\nAn internal investigation indicates the control module was likely not bolted down properly."
 OW_fail_events.9.a: "Any more conspiracy theories?"

 OW_fail_events.10.t: "Space Bird Cult Conundrum"
 OW_fail_events.10.d: "The rocket successfully launched, but veered off course and ended up landing on an island in the middle of Pacific Ocean, where it is now supposedly being worshipped as a gift from local deities by a local tribe.\n\nUpon further inspection from intelligence agencies, our secret services have reported back to us that this tribe sees the rocket as a good omen. These uncivilized tribals seem to believe the metal from the crash site is imbued with magic properties.\n\nThe rocket is damaged so heavily that it can no longer be tied to us or effectively salvaged, therefore they have come to the conclusion to let the natives have the rocket.\n\nThey seem to be getting more use out of it than we are anyway."
 OW_fail_events.10.a: "All praise the rocket!"

 OW_fail_events.11.t: "Unintentional Moon Landing"
 OW_fail_events.11.d: "In a strange twist of fate, the most recent rocket we launched was sent on a collision course with the moon, destroying the entire payload after landing in the Sea of Tranquillity.\n\nWhile the unlikeliness of the event has prompted an internal investigation of our space agency, we have been able to use the fact that we were still able to send a rocket to the moon to show that we have the potential to send a successful mission there! With our newspapers touting that men will be singing our national anthem on the lunar surface, maybe this mission was not so bad after all."
 OW_fail_events.11.a: "We, uh, we meant to do that."

 OW_fail_events.12.t: "Waterlogged"
 OW_fail_events.12.d: "Bureaucracy strikes once again! It appears as if precitipation the night before launch damaged the rockets electronics, resulting in a failure to launch. R&D is keen to smugly note how this is technically not their fault.\n\nThe offending members of R&D were politlely encouraged not to let the door hit them on the way out."
 OW_fail_events.12.a: "Slippery when wet"

 OW_fail_events.13.t: "Wild Wild West"
 OW_fail_events.13.d: "Our science team has come to a sour conclusion. The rocket successfully launched.... but it went off course and landed in the untamed American frontier.\n\nIt appears the locals have begun to use it as a tourist attraction, claiming it to be some kind of alien spaceship.\n\nThis will obviously set back our space program, but on the bright side, some lucky souls out in the frontier will make a few extra caps off our failure. "
 OW_fail_events.13.a: "A small airstrike should do the trick."

 OW_fail_events.14.t: "Research Setbacks"
 OW_fail_events.14.d: "During a test prior to launch, the rocket prematurely fired the engines, incinerating research personnel before exploding."
 OW_fail_events.14.a: ""

 OW_fail_events.15.t: "Tipping Point"
 OW_fail_events.15.d: "Failure to set up launching struts resulted in the rocket tipping over and falling before the launch sequence could start."
 OW_fail_events.15.a: ""

 OW_fail_events.16.t: "Enemy Unknown"
 OW_fail_events.16.d: "Our rocket was able to successfully launch and break through the atmosphere, but it appeared to begin suffering electrical malfunctions before it could complete the assigned tasks. Shortly after, the rocket and payload simply vanished from sensors without a trace. Just before losing contact, researchers used the on-board camera to snap a series of photos and transmit them to Earth.\n\nWhat we found was concerning, to say the least.\n\nAn unknown object can be seen on the horizon on a course to intercept the rocket. Analysis of the blurry images indicates the object was some kind of floating translucent glowing ship, emanating blue light. The research team has opted to claim the rocket was destroyed before entering the atmosphere and destroyed the photos, hoping to prevent any unbidden speculation by the public."
 OW_fail_events.16.a: "Let's just pretend we didn't see any of that."

 OW_fail_events.17.t: "From Beyond"
 OW_fail_events.17.d: "While we were able to launch our rocket successfully, issues emerged once it broke through the planet's atmosphere. Our remote control systems, reliant on radio transmissions, were suddenly overwhelmed with an unknown signal. Initially just thought to be interference, it was determined afterwards that the signal did not originate from Earth at all.\n\nThe loss of control over the rocket lead to it being lost, however the signal was successfully recorded and found to be semi-coherent. It contained a repeating sequence of prime numbers that were later decoded to indicate designs for some kind of unknown machine. The purpose of this device is unknown, and we still are unsure who sent the signal or where it originated from. Schematics for this device have been kicked over to a special research program to determine if we could even construct it in the first place."
 OW_fail_events.17.a: "Maybe we were better off alone?"

 OW_fail_events.18.t: "Knightwatch"
 OW_fail_events.18.d: "While the initial launch sequence went off without a hitch, it appears the rocket made contact with something in orbit. It's not entirely clear what it made contact with, but photos taken prior to the collision show a large metallic object in close proximity.\n\nOne of our researchers jokingly dubbed it the Black Knight, and despite our best efforts the name stuck. Since the incident this object has vanished from all sensors, and even now we still can't confirm if it was a genuine unidentified object or just a smudge on the lens.\n\nWhether or not it was anything serious, we're still down a rocket and have to deal with an increasingly superstitious research team."
 OW_fail_events.18.a: "Something's out there. Maybe."

 ## NEWS EVENTS ##
 OW_news_events.1.t: "EPSILON 1 BREAKS RECORDS"
 OW_news_events.1.d: "In Carnegia, scientists supported by the Edison Electric Company and Carnegie Steel successfully launched a small payload rocket into the atmosphere. Though the rocket unfortunately burnt up on re-entry, the initial success of the event has rocked the scientific community.\n\nBoth Britain and Russia have announced their plans to establish formal space programs, vowing to outdo the other in the race to achieve scientific dominance. Many fear, however, the prospect of militarizing orbit may have deadly consequences."
 OW_news_events.1.a: "He who rules heaven rule the Earth"

 OW_news_events.2.t: "BRITISH SATELLITE SUCCESS"
 OW_news_events.2.d.a: "The British Empire has achieved a significant success in the Orbit Race, launching a communications satellite into space. A statement from the Russian Empire has not been forthcoming, whereas the British press has wasted no time celebrating the achievement.\n\nWhile this merely constitutes a single step in the race to place a human being into space, it is nonetheless a major achievement for the British Empire."
 OW_news_events.2.d.b: "The British Empire has achieved a significant success in the Orbit Race, launching a communications satellite into space. However, the Russian Empire launched its first satellite earlier; nevertheless, the British government assures that the next achievements will be claimed by them first.\n\nWhile this merely constitutes a single step in the race to place a human being into space, it is nonetheless a major achievement for the British Empire."
 OW_news_events.2.a: "What next, a man in space?"

 OW_news_events.3.t: "RUSSIAN SATELLITE SUCCESS"
 OW_news_events.3.d.a: "The Russian Empire has achieved a significant success in the Orbit Race, launching a communications satellite into space. A statement from the British Empire has not been forthcoming, whereas the Russian press has wasted no time celebrating the achievement.\n\nWhile this merely constitutes a single step in the race to place a human being into space, it is nonetheless a major achievement for the Russian Empire."
 OW_news_events.3.d.b: "The Russian Empire has achieved a significant success in the Orbit Race, launching a communications satellite into space. However, the British Empire launched its first satellite earlier; nevertheless, the Russian government assures that the next achievements will be claimed by them first.\n\nWhile this merely constitutes a single step in the race to place a human being into space, it is nonetheless a major achievement for the Russian Empire."
 OW_news_events.3.a: "Interesting"

 OW_news_events.4.t: "FIRST BRITISH MEN IN ORBIT"
 OW_news_events.4.d.a: "The British space program has achieved something previously thought impossible, and has launched a manned expedition into space. A team of Astronauts successfully broke through the atmosphere and sustained orbit before returning to Earth, making the first time living humans have ever left the planet.\n\nThis breakthrough has definitively marked the British Empire as a leading technological power, and while Russia may catch up, it nonetheless has lost their opportunity to make scientific history."
 OW_news_events.4.d.b: "Although not as the first, the British space program nonetheless made a breakthrough by sending more people, including the first from its empire, beyond the planet. A team of Astronauts successfully broke through the atmosphere and sustained orbit before returning to Earth.\n\nThis breakthrough has definitively strenghtened the British Empire as a technological power, yet this time, it was unable to make history as the one that sent the first human into orbit."
 OW_news_events.4.a: "Per aspera ad astra"

 OW_news_events.5.t: "FIRST RUSSIAN MEN IN ORBIT"
 OW_news_events.5.d.a: "The Russian space program has achieved something previously thought impossible, and has launched a manned expedition into space. A team of Cosmonauts successfully broke through the atmosphere and sustained orbit before returning to Earth, making the first time living humans have ever left the planet.\n\nThis breakthrough has definitively marked the Russian Empire as a leading technological power, and while Britain may catch up, it nonetheless has lost their opportunity to make scientific history."
 OW_news_events.5.d.b: "Although not as the first, the Russian space program nonetheless made a breakthrough by sending more people, including the first from its empire, beyond the planet. A team of Cosmonauts successfully broke through the atmosphere and sustained orbit before returning to Earth.\n\nThis breakthrough has definitively strenghtened the Russian Empire as a technological power, yet this time, it was unable to make history as the one that sent the first human into orbit."
 OW_news_events.5.a: "Poyekhali!"

