sociogenetics: "Sociogenetics Policy"
PB_Sociogenetics_Allowed: "Sociogenetics Allowed"
PB_Sociogenetics_Allowed_desc: "Social Genetics, typically shortened as Sociogenetics, is a scientific field related to the management of the human genetic pool. Coined in the late 1800s, Sociogenetics largely developed as a response to the Population Boom caused by the Second Renaissance. As the medical sciences advanced, infant mortality dropped rapidly across the civilized world and consequently population numbers increased. In an effort to combat this, Sociogenetics was adopted by many nations in an effort to manage the population and gradually phase out less desirable traits.\n\nIn most countries, this is managed via genetic panel studies intended to detect traits such as abnormally low IQ, deformity, or congenital illness. If such traits are detected, the parent is typically advised to either terminate the pregnancy or report the child for sterilization at the appropriate age. In some nations, this is supplemented through Child Licensure and population counter systems to prevent overcrowding in megacities. Although on paper these systems are not racially motivated, there are innumerable cases of nations targeting certain groups disproportionately over others."
PB_Sociogenetics_Normalized: "Sociogenetics Normalized"
PB_Sociogenetics_Normalized_desc: "Social Genetics, typically shortened as Sociogenetics, is a scientific field related to the management of the human genetic pool. Coined in the late 1800s, Sociogenetics largely developed as a response to the Population Boom caused by the Second Renaissance. As the medical sciences advanced, infant mortality dropped rapidly across the civilized world and consequently population numbers increased. In an effort to combat this, Sociogenetics was adopted by many nations in an effort to manage the population and gradually phase out less desirable traits.\n\nIn most countries, this is managed via genetic panel studies intended to detect traits such as abnormally low IQ, deformity, or congenital illness. If such traits are detected, the parent is typically advised to either terminate the pregnancy or report the child for sterilization at the appropriate age. In some nations, this is supplemented through Child Licensure and population counter systems to prevent overcrowding in megacities. Although on paper these systems are not racially motivated, there are innumerable cases of nations targeting certain groups disproportionately over others."
PB_Sociogenetics_Enforced: "Sociogenetics Enforced"
PB_Sociogenetics_Enforced_desc: "Social Genetics, typically shortened as Sociogenetics, is a scientific field related to the management of the human genetic pool. Coined in the late 1800s, Sociogenetics largely developed as a response to the Population Boom caused by the Second Renaissance. As the medical sciences advanced, infant mortality dropped rapidly across the civilized world and consequently population numbers increased. In an effort to combat this, Sociogenetics was adopted by many nations in an effort to manage the population and gradually phase out less desirable traits.\n\nIn most countries, this is managed via genetic panel studies intended to detect traits such as abnormally low IQ, deformity, or congenital illness. If such traits are detected, the parent is typically advised to either terminate the pregnancy or report the child for sterilization at the appropriate age. In some nations, this is supplemented through Child Licensure and population counter systems to prevent overcrowding in megacities. Although on paper these systems are not racially motivated, there are innumerable cases of nations targeting certain groups disproportionately over others."
PB_Sociogenetics_Racial: "Race-Based Sociogenetics"
PB_Sociogenetics_Racial_desc: "Social Genetics, typically shortened as Sociogenetics, is a scientific field related to the management of the human genetic pool. Coined in the late 1800s, Sociogenetics largely developed as a response to the Population Boom caused by the Second Renaissance. As the medical sciences advanced, infant mortality dropped rapidly across the civilized world and consequently population numbers increased. In an effort to combat this, Sociogenetics was adopted by many nations in an effort to manage the population and gradually phase out less desirable traits.\n\nIn most countries, this is managed via genetic panel studies intended to detect traits such as abnormally low IQ, deformity, or congenital illness. If such traits are detected, the parent is typically advised to either terminate the pregnancy or report the child for sterilization at the appropriate age. In some nations, this is supplemented through Child Licensure and population counter systems to prevent overcrowding in megacities. Although on paper these systems are not racially motivated, there are innumerable cases of nations targeting certain groups disproportionately over others."
PB_Sociogenetics_Banned: "Sociogenetics Banned"
PB_Sociogenetics_Banned_desc: "Social Genetics, typically shortened as Sociogenetics, is a scientific field related to the management of the human genetic pool. Coined in the late 1800s, Sociogenetics largely developed as a response to the Population Boom caused by the Second Renaissance. As the medical sciences advanced, infant mortality dropped rapidly across the civilized world and consequently population numbers increased. In an effort to combat this, Sociogenetics was adopted by many nations in an effort to manage the population and gradually phase out less desirable traits.\n\nIn most countries, this is managed via genetic panel studies intended to detect traits such as abnormally low IQ, deformity, or congenital illness. If such traits are detected, the parent is typically advised to either terminate the pregnancy or report the child for sterilization at the appropriate age. In some nations, this is supplemented through Child Licensure and population counter systems to prevent overcrowding in megacities. Although on paper these systems are not racially motivated, there are innumerable cases of nations targeting certain groups disproportionately over others."
PB_Sociogenetics_Malthusian: "Malthusian Sociogenetics"
PB_Sociogenetics_Malthusian_desc: "Social Genetics, typically shortened as Sociogenetics, is a scientific field related to the management of the human genetic pool. Coined in the late 1800s, Sociogenetics largely developed as a response to the Population Boom caused by the Second Renaissance. As the medical sciences advanced, infant mortality dropped rapidly across the civilized world and consequently population numbers increased. In an effort to combat this, Sociogenetics was adopted by many nations in an effort to manage the population and gradually phase out less desirable traits.\n\nIn most countries, this is managed via genetic panel studies intended to detect traits such as abnormally low IQ, deformity, or congenital illness. If such traits are detected, the parent is typically advised to either terminate the pregnancy or report the child for sterilization at the appropriate age. In some nations, this is supplemented through Child Licensure and population counter systems to prevent overcrowding in megacities. Although on paper these systems are not racially motivated, there are innumerable cases of nations targeting certain groups disproportionately over others.\n\nA notable variation of Sociogenetics research, Malthusian Sociogenetics focuses more on population management over genetic selection processes. As the Population Explosion hit many nations, there was a need for greater infrastructure and living accomodations. Due to this, there was a push to implement greater population management policies in urban centers. Child licensure policies and hard legal caps on family size have become very common policies in many countries. "

