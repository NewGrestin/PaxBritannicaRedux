citizenship_laws: "Suffrage Law"
PB_Universal_Citizenship: "Universal Suffrage"
PB_Universal_Citizenship_desc: "Every adult citizen, regardless of gender, wealth, or class, is granted the right to vote. Elections are open and competitive, serving as the foundation of political legitimacy."
PB_Limited_Disenfranchisement: "Limited Disenfranchisement"
PB_Limited_Disenfranchisement_desc: "While elections are held, significant groups are denied participation through property requirements, literacy tests, or ethnic restrictions. Democracy exists, but only for the privileged."
PB_Aristocratic_Democracy: "Aristocratic Democracy"
PB_Aristocratic_Democracy_desc: "The franchise is restricted to the nobility, landowners, or a narrow elite. Politics remain the domain of a hereditary ruling class, with little regard for the broader population."
PB_Managed_Democracy: "Managed Democracy"
PB_Managed_Democracy_desc: "Elections are permitted, but heavily orchestrated by the government. Candidates are vetted, outcomes manipulated, and dissent marginalized-democracy in name more than in practice."
PB_Single_Party_State: "Single Party State"
PB_Single_Party_State_decs: "A single political party dominates all institutions of government. Opposition is banned, and elections, if held, serve only to reaffirm the ruling ideology."
PB_No_Voting: "No Voting"
PB_No_Voting_desc: "The state is governed without elections or representation. All authority lies in the hands of the ruler or ruling clique, with the population entirely excluded from political life."

press_laws: "Press Law"
PB_Free_Press: "Independent Free Press"
PB_Free_Press_desc: "Newspapers, journals, and radio stations operate without government interference. A plurality of voices shapes public discourse, and criticism of authority is openly tolerated."
PB_Limited_Censorship: "Semi-Independent Press"
PB_Limited_Censorship_desc: "The press enjoys limited freedom but remains subject to censorship, licensing, and government pressure. Sensitive topics are restricted, though some dissenting voices persist."
PB_State_Press: "State-Controlled Press"
PB_State_Press_desc: "All media is directly overseen or owned by the state. Information is filtered through official channels, propaganda dominates the public sphere, and dissent is silenced."

public_meetings: "Public Meetings Law"
PB_Public_Meetings_Allowed: "Public Meetings Allowed"
PB_Public_Meetings_Allowed_desc: "Citizens are free to gather, protest, or organize without government interference. Public squares and halls are vibrant arenas of political and social life."
PB_Public_Meetings_Monitored: "Public Meetings Monitored"
PB_Public_Meetings_Monitored_desc: "Assemblies are permitted, but authorities keep a close watch. Demonstrations may require permits, and security forces often loom nearby to maintain \"order\"."
PB_Public_Meetings_Banned: "Public Meetings Banned"
PB_Public_Meetings_Banned_desc: "Public gatherings are outlawed. Any attempt to assemble is swiftly dispersed by authorities, and collective political expression is driven underground."

womens_rights: "Women's Rights Law"
PB_Total_Gender_Equality: "Total Gender Equality"
PB_Total_Gender_Equality_desc: "Women enjoy full social, political, and economic equality with men. They can vote, hold office, inherit property, work freely, and participate in all aspects of public and private life."
PB_Full_Womens_Equality: "Full Equality"
PB_Full_Womens_Equality_desc: "Women have broad legal and social rights, including voting, education, and employment opportunities, though some minor inequalities may remain in practice."
PB_Limited_Womens_Rights: "Limited Women's Rights"
PB_Limited_Womens_Rights_desc: "Women are granted basic legal protections and some access to education and work, but their political participation and legal independence are restricted."
PB_No_Womens_Legal_Protections: "No Legal Protections"
PB_No_Womens_Legal_Protections_desc: "Women have little to no legal recognition of their rights. They cannot vote, inherit equally, or freely participate in public life, leaving them vulnerable under the law."
PB_Patriarchal_Society: "Patriarchal Society"
PB_Patriarchal_Society_desc: "Society is structured around male dominance. Women are largely confined to domestic roles, and legal, social, and economic independence is minimal or nonexistent."

minority_rights: "Minority Rights Law"
PB_Affirmitive_Action: "Affirmitive Action"
PB_Affirmitive_Action_desc: "Minorities are actively supported through state policies to ensure equal opportunities in education, employment, and political representation."
PB_Significant_Autonomy: "Significant Autonomy"
PB_Significant_Autonomy_desc: "Minorities have substantial self-governance, including cultural, linguistic, or administrative autonomy within the state."
PB_Limited_Autonomy: "Neutral Stance"
PB_Limited_Autonomy_desc: "Minorities are legally recognized but receive no special privileges or protections beyond basic citizenship."
PB_Racial_Segregation: "Racial Segregation"
PB_Racial_Segregation_desc: "Minorities are socially or legally separated from the majority, with restricted access to certain areas, services, or political rights."
PB_Racial_Hierarchy: "Racial Hierarchy"
PB_Racial_Hierarchy_desc: "Minorities are considered inferior, face systemic discrimination, and are denied meaningful rights or participation in society."

security_services: "Security Services Law"
PB_Law_Community_Outreach: "Community Outreach"
PB_Law_Community_Outreach_desc: "Local authorities work hand in hand with the population, focusing on education, trust, and cooperation. Crime and unrest are discouraged through positive engagement, but the lack of strong control leaves room for underground movements."
PB_Law_Prev_Policing: "Preventative Policing"
PB_Law_Prev_Policing_desc: "Patrols and community presence are expanded to deter crime and resistance before they take root. The approach is firmer than outreach but still avoids heavy repression, balancing order with civil freedoms."
PB_Law_Standard_Policing: "Standard Policing"
PB_Law_Standard_Policing_desc: "Routine law enforcement maintains a basic level of order and safety. Citizens are neither especially encouraged nor suppressed, and the state exerts only the minimum necessary force to keep control."
PB_Law_Intimidation_Policing: "State Intimidation"
PB_Law_Intimidation_Policing_desc: "The regime uses threats, coercion, and occasional displays of force to ensure obedience. Fear becomes a tool of governance, raising war readiness at the cost of civil stability and long-term loyalty."
PB_Law_Secret_Police: "Secret Police"
PB_Law_Secret_Police_desc: "A vast network of informants and covert agents roots out dissent wherever it appears. Constant surveillance and repression crush resistance but breed deep resentment among the populace."
PB_National_Panopticon: "National Panopticon"

civilian_policies: "Civilian Policies"
economic_policies: "Economic Policies"

labour_laws: "Labour Law"
PB_8_Hour_Workday: "Eight Hour Workday"
PB_8_Hour_Workday_desc: "trictly limits work to 8 hours per day, prioritizing worker welfare and productivity."
PB_12_Hour_Workday: "Twelve Hour Workday"
PB_12_Hour_Workday_desc: "Moderate regulation, balancing economic output and worker rest."
PB_14_Hour_Workday: "Fourteen Hour Workday"
PB_14_Hour_Workday_desc: "Lightly regulated, favors employers while still providing some protection for workers."
PB_18_Hour_Workday: "Eighteen Hour Workday"
PB_18_Hour_Workday_desc: "Minimal regulation, workers have very long shifts with few legal protections."
PB_No_Limit_Workday: "No Work Hour Limits"
PB_No_Limit_Workday_desc: "Complete laissez-faire approach, workers may be required to work indefinitely."

healthcare: "Healthcare Policy Law"
PB_Universal_Healthcare: "Comprehensive Healthcare System"
PB_Universal_Healthcare_desc: "Full access to medical care for all citizens, preventive and advanced treatments included."
PB_Trinket_Healthcare: "Standard Healthcare System"
PB_Trinket_Healthcare_desc: "Moderate coverage, basic treatments and public hospitals widely available."
PB_Basic_Healthcare: "Basic Healthcare System"
PB_Basic_Healthcare_desc: "Minimal healthcare, limited to essential services only."
PB_No_Healthcare: "No National Healthcare System"
PB_No_Healthcare_desc: "No state-provided healthcare; citizens must rely on private or informal care."

education: "Education Policy Law"
PB_Universal_Higher_Education: "Subsidized Higher Education"
PB_Universal_Higher_Education_desc: "Comprehensive education system with support for higher education, ensuring widespread access to universities and advanced studies."
PB_Universal_Basic_Education: "Subsidized Basic Education"
PB_Universal_Basic_Education_desc: "Government-supported basic education, providing primary and secondary schooling to most children."
PB_Basic_Education: "Basic Education System"
PB_Basic_Education_desc: "Limited education available; only fundamental literacy and numeracy are taught, often with little government support."
PB_No_Formal_Education: "No Official Education System"
PB_No_Formal_Education_desc: "No structured education provided by the state; learning is informal or private, with minimal access for the general population."


welfare: "Welfare Policy Law"
PB_Generous_Welfare: "Generous State Welfare"
PB_Generous_Welfare_desc: "Extensive social support programs, including unemployment benefits, pensions, and subsidies for low-income citizens."
PB_Limited_Welfare: "Moderate State Welfare"
PB_Limited_Welfare_desc: "Partial social support, covering basic needs like unemployment aid and limited welfare payments."
PB_Basic_Welfare: "Basic State Welfare"
PB_Basic_Welfare_desc: "Minimal assistance, only essential welfare for the most vulnerable populations."
PB_No_Welfare: "No State Welfare"
PB_No_Welfare_desc: "No welfare system; citizens are responsible for their own social security and support."

sociogenetics: "Sociogenetics Policy Law"
PB_Sociogenetics_Allowed: "Sociogenetics Allowed"
PB_Sociogenetics_Allowed_desc: "Genetic manipulation and selective breeding are entirely permitted, with no legal restrictions. Individuals are free to make reproductive choices based on personal preference, and the state does not intervene in population genetics. Such societies often rely on personal ethics and cultural norms rather than law to guide reproductive decisions."
PB_Sociogenetics_Normalized: "Sociogenetics Normalized"
PB_Sociogenetics_Normalized_desc: "Certain genetic practices are widely accepted and encouraged culturally and socially. The state may provide incentives for preferred traits or discourage harmful behaviors, but participation remains voluntary. Programs may include selective screening, educational campaigns, and public endorsements of “desirable” genetic practices without coercion."
PB_Sociogenetics_Banned: "Sociogenetics Banned"
PB_Sociogenetics_Banned_desc: "All forms of genetic engineering, eugenics, or population-directed breeding are strictly prohibited. Legal penalties may exist for individuals or institutions attempting to manipulate heredity. The focus is on equality and protection from coercion, ensuring that no group is subjected to state-guided reproductive policies."
PB_Sociogenetics_Malthusian: "Malthusian Sociogenetics"
PB_Sociogenetics_Malthusian_desc: "Population control measures are implemented to prevent overpopulation and resource strain. The state may limit family size, promote sterilization in overpopulated regions, or encourage delayed reproduction. Policies often target urban areas or high-density regions, balancing demographic growth with environmental and economic sustainability."
PB_Sociogenetics_Enforced: "Sociogenetics Enforced"
PB_Sociogenetics_Enforced_desc: "The state actively mandates specific genetic or reproductive practices, often tied to national goals. Programs may include arranged mating, enforced sterilization, or mandated breeding guidelines. Compliance is monitored, and nonconformity is subject to legal penalties, reflecting a highly interventionist approach to population genetics."
PB_Sociogenetics_Racial: "Race-Based Sociogenetics"
PB_Sociogenetics_Racial_desc: "Genetic policies are applied selectively based on race, ethnicity, or perceived social desirability. Certain groups may be encouraged or forced to reproduce according to state objectives, while others may be restricted or sterilized. Such laws institutionalize discrimination and enforce a hierarchical view of population \"quality\"."

augments: "Augmentation Policy Law"
PB_Augmentation_No_Legislation: "No Augmentation Legislation"
PB_Augmentation_No_Legislation_desc: "here are no formal laws governing bioengineering or human augmentation. Citizens and private organizations are free to explore and apply enhancements as they see fit. While innovation flourishes, oversight is minimal, leading to both remarkable breakthroughs and potential ethical dilemmas."
PB_Augmentation_Banned: "Augmentation Banned"
PB_Augmentation_Banned_desc: "All forms of biological or cybernetic augmentation are strictly forbidden. Research is suppressed, procedures outlawed, and practitioners harshly punished. The state frames augmentation as dangerous, unnatural, or destabilizing, leaving citizens reliant solely on natural human limits."
PB_Augmentation_Encouraged: "Augmentation Encouraged"
PB_Augmentation_Encouraged_desc: "The state actively promotes augmentation through subsidies, research funding, and cultural campaigns. Adoption is voluntary, but citizens are incentivized to embrace enhancements for greater productivity, health, or military effectiveness. Augmentation becomes a celebrated aspect of modern identity."
PB_Augmentation_Enforced: "Augmentation Enforced"
PB_Augmentation_Enforced_desc: "Bioengineering and augmentation are mandatory for specific groups, or even for the entire population. The state imposes enhancements for strategic goals - military superiority, economic efficiency, or ideological purity. Refusal is seen as defiance, and citizens’ very bodies become instruments of state policy."
