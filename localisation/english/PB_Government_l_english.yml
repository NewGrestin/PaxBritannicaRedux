PB_Law_Community_Outreach: "Community Outreach"
PB_Law_Community_Outreach_desc: "Local authorities work hand in hand with the population, focusing on education, trust, and cooperation. Crime and unrest are discouraged through positive engagement, but the lack of strong control leaves room for underground movements."
PB_Law_Prev_Policing: "Preventative Policing"
PB_Law_Prev_Policing_desc: "Patrols and community presence are expanded to deter crime and resistance before they take root. The approach is firmer than outreach but still avoids heavy repression, balancing order with civil freedoms."
PB_Law_Standard_Policing: "Standard Policing"
PB_Law_Standard_Policing_desc: "Routine law enforcement maintains a basic level of order and safety. Citizens are neither especially encouraged nor suppressed, and the state exerts only the minimum necessary force to keep control."
PB_Law_Intimidation_Policing: "State Intimidation"
PB_Law_Intimidation_Policing_desc: "The regime uses threats, coercion, and occasional displays of force to ensure obedience. Fear becomes a tool of governance, raising war readiness at the cost of civil stability and long-term loyalty."
PB_Law_Secret_Police: "Secret Police"
PB_Law_Secret_Police_desc: "A vast network of informants and covert agents roots out dissent wherever it appears. Constant surveillance and repression crush resistance but breed deep resentment among the populace."
